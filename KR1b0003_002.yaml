  text: 尚書正義卷第二
  hash: sha256:0a5607bfb51ed23307ca0ddfd1d26c2ef0361707478b9de24e426fa0c7edfd90
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_002-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔頴達奉勑撰古文尚書堯典第一正義曰撿古夲并石經直言堯典第一無古文尚書以孔君從隷古仍號古文故後人因而題於此以別伏生所出大小夏侯及歐陽所傳爲今文故也堯典第一篇之名當與衆篇相次第訓爲次也於次第之内而處一故曰堯典第一以此第一者以五帝之末接三王之初典䇿旣備因機成務交代揖讓以重無爲故爲第一也然書者理由舜史勒成一家可以爲法上取堯事下終禪禹以至舜終皆爲舜史所録其堯舜之典多陳行事之狀其言寡矣禹貢即全非君言準之後代不應入書此其一體之異以此禹之身事於禪後無入夏書之理自甘誓巳下皆多言辭則古史所書於是乎始知五子之歌亦非上言典書草創以義而録但致言有本名隨其事撿其此體爲例有十一曰典二曰謨三曰貢四曰歌五曰誓六曰誥七曰訓八曰命九曰征十曰範堯典舜典一篇典也大禹謨皐陶謨二篇謨也禹貢一篇貢也五子之歌一篇歌也甘誓泰誓三篇湯誓牧誓費誓秦誓八篇誓也仲虺之誥湯誥大誥康誥酒誥召誥洛誥康王之誥八篇誥也伊訓一篇訓也說命三篇微子之命蔡仲之命顧命畢命囧命文侯之命九篇命也胤征一篇征也洪範一篇範也此各隨事而言益稷亦謨也因其人稱言以別之其太甲咸有一德伊尹訓道王亦訓之類盤庚亦誥也故王肅云不言誥何也取其徙而立功非但録其誥髙宗肜日與訓序連文亦訓辭可知也西伯戡黎云祖伊恐奔告于受亦誥也武成云識其政事亦誥也旅􅋙戒王亦訓也金縢自爲一體祝亦誥辭也梓材酒誥分出亦誥也多士以王命誥自然誥也無逸戒王亦訓也君奭周公誥召公亦誥也多方周官上誥於下亦誥也君陳君牙與畢命之類亦命也吕刑陳刑告王亦誥也書篇之名因事而立旣無體例隨便爲文其百篇次第於序孔鄭不同孔以湯誓在夏社前於百篇爲第二十六鄭以爲在臣扈後第二十九孔以咸有一德次太甲後第四十鄭以爲在湯誥後第二十二孔以蔡仲之命次君奭後第八十三鄭以爲在費誓前第九十六孔以周官在立政後第八十八鄭以爲在立政前第八十六孔以費誓在文侯之命後第九十九鄭以爲在吕刑前第九十七不同者孔依壁内篇次及序爲文鄭依賈氏所奏別録爲次孔未入學官以此不同考論次第孔義是也虞書正義曰堯典雖曰唐事夲以虞史所録末言舜登庸由堯故追堯作典非唐史所録故謂之虞書也鄭玄云舜之美事在於堯時是也案馬融鄭玄王肅別録題皆曰虞夏書以虞夏同科雖虞事亦連夏此直言虞書夲無尚書之題也案鄭序以爲虞夏書二十篇商書四十篇周書四十篇賛云三科之條五家之敎是虞夏同科也其孔於禹貢注云禹之王以是功故爲夏書之首則虞夏別題也以上爲虞書則十六篇又帝告釐沃湯征汝鳩汝方於鄭玄爲商書而孔并於胤征之下或以爲夏事猶伯戡黎則夏書九篇商書三十五篇此與鄭異也或孔因帝告以下五篇亡并注於夏書不廢猶商書乎别文所引皆云虞書曰夏書曰無并言虞夏書者又伏生雖有一虞夏傳以外亦有虞傳夏傳此其所以冝別也此孔依虞夏各別而存之莊八年左傳云夏書曰皐陶邁種德僖二十四年左傳引夏書曰地平天成二十七年引夏書賦納以言襄二十六年引夏書曰與其殺不辜寧失不經皆在大禹謨皐陶謨當云虞書而云夏書者以事關禹故引爲夏書若洪範以爲周書以箕子至周商人所陳而傳引之即曰商書也案壁内所得孔爲傳者凡五十八篇爲四十六卷三十三篇與鄭注同二十五篇増多鄭注也其二十五篇者大禹謨一五子之歌二胤征三仲虺之誥四湯誥五伊訓六太甲三篇九咸有一德十說命三篇十三泰誓三篇十六武成十七旅獒十八微子之命十九蔡仲之命二十周官二十一君陳二十二畢命二十三君牙二十四冏命二十五但孔君所傳值巫蠱不行以終前漢諸儒知孔夲有五十八篇不見孔傳遂有張霸之徒於鄭注之外僞造尚書凡二十四篇以足鄭注三十四篇爲五十八篇其數雖與孔同其篇有異孔則於伏生所傳二十九篇内無古文泰誓除序尚二十八篇分出舜典益稷盤庚二篇康王之誥爲三十三增二十五篇爲五十八篇鄭玄則於伏生二十九篇之内分出盤庚二篇康王之誥又泰誓三篇爲三十四篇更増益僞書二十四篇爲五十八所増益二十四篇者則鄭注書序舜典一汩作二九共九篇十一大禹謨十二益稷十三五子之歌十四胤征十五湯誥十六咸有一德十七典寳十八伊訓十九肆命二十原命二十一武成二十二旅􅋙二十三囧命二十四以此二十四爲十六卷以九共九篇共卷除八篇故爲十六故藝文志劉向別録云五十八篇藝文志又云孔安國者孔子後也悉得其書以古文又多十六篇篇即卷也即吴僞書二十四篇也劉向作别録班固作藝文志並云此言不見孔傳也劉歆作三統曆論武王伐紂引今文泰誓云丙午逮師又引武成越若來三月五日甲子咸劉商王受並不與孔同亦不見孔傳也後漢初賈逵奏尚書䟽云流爲烏是與孔亦異也馬融書序云經傳所引泰誓泰誓並無此文又云逸十六篇絶無師說是融亦不見也服虔杜預注左傳亂其紀綱並云夏桀時服虔杜預皆不見也鄭玄亦不見之故注書序舜典云入麓伐木注五子之歌云避亂於洛汭注胤征云胤征臣名又注禹貢引胤征云厥篚玄黄昭我周王又注咸有一德云伊陟臣扈曰又注典寶引伊訓云載孚在亳又曰征是三朡又注旅獒云獒讀曰豪謂是酋豪之長又古文有仲虺之誥太甲說命等見在而云亡其汩作典寳之等一十三篇見亡而云巳逸是不見古文也案伏生所傳三十四篇者謂之今文則夏侯勝夏侯建歐陽和伯等三家所傳及後漢末蔡邕所勒石經是也孔所傳者膠東庸生劉歆賈逵馬融等所傳是也鄭玄書賛云我先師棘子下生安國亦好此學衞賈馬二三君子之業則雅才好博旣宣之矣又云歐陽氏失其本義今疾此蔽冒猶復疑惑未悛是鄭意師祖孔學傳授膠東庸生劉歆賈逵馬融等學而賤夏侯歐陽等何意鄭注尚書亡逸並與孔異篇數並與三家同又劉歆賈逵馬融之等並傳孔學云十六篇逸與安國不同者良由孔注之後其書散逸傳注不行以庸生賈馬之等惟傳孔學經文三十三篇故鄭與三家同以爲古文而鄭承其後所注皆同賈逵馬融之學題曰古文尚書篇與夏侯等同而經字多異夏侯等書宅嵎夷爲宅嵎䥫昧谷曰柳谷心腹腎腸曰憂腎陽劓刵劅剠云臏宫劓割頭庶剠是鄭注不同也三家之學傳孔業者漢書儒林傳云安國傳都尉朝子俊俊傳膠東庸生生傳淸河胡常常傳徐敖敖傳王璜及塗惲惲傳河南桑欽至後漢初衞賈馬亦傳孔學故書賛云自丗祖興後漢衞賈馬二三君子之業是也所得傳者三十三篇古經亦無其五十八篇及傳說絕無傳者至晉丗王肅注書始似竊見孔傳故注亂其紀綱爲夏太康時又晉書皇甫謐傳云姑子外弟梁柳邊得古文尚書故作帝王丗紀往往載孔傳五十八篇之書晉書又云晉太保公鄭冲以古文授扶風蘇愉愉字休預預授天水梁柳字洪季即謐之外弟也季授城陽臧曹字彦始始授郡守子汝南梅賾字仲眞又爲預章内史遂於前晉奏上其書而施行焉時巳亡失舜典一篇晉末范寗爲解時巳不得焉至齊蕭鸞建武四年姚方興於大航頭得而獻之議者以爲孔安國之所注也值方興有罪事亦隨寢至隋開皇二年購慕遺典乃得其篇焉然孔注之後歷及後漢之末無人傳說至晉之初猶得存者雖不列學官散在民閒事雖久逺故得猶存孔氏傳正義曰以注者多門故云某氏以別衆家或當時自題孔氏亦可以後人辯之昔在至堯典正義曰此序鄭玄馬融王肅並云孔子所作孔義或然詩書理不應異夫子爲書作序不作詩序者此自或作或否無義例也鄭知孔子作者依緯文而知也安國旣以同序爲卷撿此百篇凡有六十三序序其九十六篇明居咸有一德立政無逸不序所由直云咎單作明居伊尹作咸有一德周公作立政周公作無逸六十三序者若汩作九共九篇槀飫十一篇共序其咸乂四篇同序其大禹謨皐陶謨益稷夏社疑至臣扈伊訓肆命徂后太甲三篇盤庚三篇說命三篇泰誓三篇康誥酒誥梓材二十四篇皆三篇同序其帝告釐沃汝鳩汝方伊陟原命髙宗肜日髙宗之訓八篇皆共卷類同故同序同序而別篇者三十三篇通明居無逸等四篇爲三十七篇加六十三即百篇也序者以序别行辭爲形勢言昔日在於帝號堯之時也此堯身智無不知聦也神無不見明也以此聦明之神智定可以經緯天地即文也又神智之運深敏於機謀即思也聦明文思即其聖性行之於外無不備知故此德充滿居止於天下而逺著德旣如此政化有成天道沖盈功成者退以此故將遜遁避於帝位以禪其有聖德之虞舜史序其事而作堯典之篇言昔在者鄭玄云書以堯爲始獨云昔在使若無先之典然也詩云自古在昔言在昔者自下本上之辭言昔在者從上自下爲稱故曰使若無先之者據代有先之而書無所先故云昔也言帝者天之一名所以名帝帝者諦也言天蕩然無心忘於物我言公平通逺舉事審諦故謂之帝也五帝道同於此亦能審諦故取其名若然聖人皆能同天故曰大人大人者與天地合其德即三王亦大人不得稱帝者以三王雖實聖人内德同天而外隨時運不得盡其聖用逐迹爲名故謂之爲王禮運曰大道之行天下爲公即帝也大道旣隱各親其親即王也則聖德無大於天三皇優於帝豈過乎天哉然則三皇亦不能過天但遂同天之名以爲優劣五帝有爲而同天三皇無爲而同天立名以爲優劣耳但有爲無爲亦逐多少以爲分三王亦順帝之則而不盡故不得名帝然天之與帝義爲一也人主可得稱帝不可得稱天者以天隨體而立名人主不可同天之體也無由稱天者以天德立號王者可以同其德焉所以可稱於帝故繼天則謂之天子其號謂之帝不得云帝子也言堯者孔無明解案下傳云虞氏舜名然堯舜相配爲義旣舜爲名則堯亦名也以此而言禹湯亦名於下都無所解而放勲重華文命注隨其事而解其文以爲義不爲堯舜及禹之名據此似堯舜及禹與湯相類名則俱名不應殊異案鄭於下亦云虞氏舜名與孔傳不殊及鄭注中候云重華舜名則舜不得有二名鄭注禮記云舜之言充是以舜爲號謚之名則下注云舜名亦號謚之名也推此則孔君亦然何以知之旣湯類堯舜當爲名而孔注論語曰予小子履云履是殷湯名是湯名履而湯非名也又此不云堯舜是名則堯及舜禹非名於是明矣旣非名而放勲重華文命蓋以爲三王之名同於鄭玄矣鄭知名者以帝繫云禹名文命以上類之亦名若然名本題情記意必有義者蓋運命相符名與運接所以異於凡平或說以其有義皆以爲字古代尚質若名之不顯何以著字必不獲巳以爲非名非字可也譙周以堯爲號皇甫謐以放勲重華文命爲名案謚法翼善傳聖曰堯仁義盛明曰舜是堯舜謚也故馬融亦云謚也又曰淵源流通曰禹雲行雨施曰湯則禹湯亦是謚法而馬融云禹湯不在謚法故疑之將由謚法或本不同故有致異亦可本無禹湯爲謚後來所加故或本曰除虐去殘曰湯是以異也檀弓曰死謚周道也周書謚法周公所作而得有堯舜禹湯者以周法死後乃追故謂之爲謚謚者累也累其行而號也隨其行以名之則死謚猶生號因上丗之生號陳之爲死謚明上代生死同稱上丗質非至善至惡無號故與周異以此堯舜或云號或云謚也若然湯名履而王候丗本湯名天乙者安國意蓋以湯受命之王依殷法以乙日生名天乙至將爲王又改名爲履故二名也亦可安國不信丗夲無天乙之名皇甫謐巧欲傳㑹云以乙日生故名履字天乙又云祖乙亦云乙日生復名乙引易緯孔子所謂天之錫命故可同名旣以天乙爲字何云同名乎斯又妄矣號之曰堯者釋名以爲其尊髙堯堯然物莫之先故謂之堯也謚法云翼善傳聖曰堯堯者以天下之生善因善欲禪之故二八顯升所謂爲翼能傳位於聖人天下爲公此所以出衆而髙也言聦明者據人近驗則聽逺爲聦見微爲明若離婁之視明也師曠之聽聦也以耳目之聞見喻聖人之智惠兼知天下之事故在於聞見而巳故以聦明言之智之所用用於天地經緯天地謂之文故以聦明之用爲文須當其理故又云思而㑹理也經云欽明此爲聦明者彼方陳行事故美其敬此序其聖性故稱其聦隨事而變文下舜典直云堯聞之聦明不云文思者此將言堯用故云文思彼要云舜德故直云聦明亦自此而可知也言光宅者經傳云光充也不訓宅者可知也不於此訓光者從經爲正也下將遜于位傳云遜遁者以經無遜字故在序訓之傳言聖德之逺著正義曰聖德解聦明文思逺著解光宅天下傳老使至禪之正義曰老使攝者解將遜于位云遂禪之者解讓于虞舜也以已年老故遜之使攝之後功成而禪禪即讓也言攝者納於大麓是也禪者汝陟帝位是也雖舜受而攝之而堯以爲禪或云汝陟帝位爲攝因即直言爲讓故云遂也鄭玄云堯尊如故舜攝其事是也堯典正義曰序巳云作堯典而重言此者此是經之篇目不可因序有名略其舊題故諸篇皆重言夲目而就目解之稱典者以道可百代常行若堯舜禪讓聖賢禹湯傳授子孫即是堯舜之道不可常行但惟德是與非賢不授授賢之事道可常行但後王德劣不能及古耳然經之與典俱訓爲常名典不名經者以經是揔名包殷周以上皆可爲後代常法故以經爲名典者經中之別特指堯舜之德於常行之内道最爲優故名典不名經也其太宰六典及司寇三典者自由當代常行與此别矣曰若至上下正義曰史將述堯之美故爲題目之辭曰能順考校古道而行之者是帝堯也又申其順考古道之事曰此帝堯能放效上丗之功而施其敎化心意恒敬智惠甚明發舉則有文謀思慮則能通敏以此四德安天下之當安者在於已身則有此四徳其於外接物又能信實恭勤善能謙讓恭則人不敢侮讓則人莫與爭由此爲下所服名譽著聞聖德美名充滿被溢於四方之外又至于上天下地言其日月所照霜露所墜莫不聞其聲名被其恩澤此即稽古之事也傳若順至帝堯正義曰若順釋言文詩稱考卜惟王洪範考卜之事謂之稽疑是稽爲考經傳常訓也爾雅一訓一也孔所以約文故數字俱訓其末以一也結之又巳經訓者後傳多不重訓顯見可知則徑言其義皆務在省文故也言順考古道者古人之道非無得失施之當時又有可否考其事之是非知其冝於今丗乃順而行之言其行可否順是不順非也考古者自已之前無逺近之限但事有可取皆考而順之今古旣異時政必殊古事雖不得盡行又不可頓除古法故說命曰事不師古以克永丗匪說攸聞是後丗爲治當師古法雖則聖人必須順古若空欲追逺不知考擇居今行古更致禍災若宋襄慕義師敗身傷徐偃行仁國亡家滅斯乃不考之失故美其能順考也鄭玄信緯訓稽爲同訓古爲天言能順天而行之與之同功論語稱惟堯則天詩美文王順帝之則然則聖人之道莫不同天合德豈待同天之語然後得同之哉書爲丗敎當因之人事以人繫天於義無取且古之爲天經無此訓髙貴郷公皆以鄭爲長非篤論也傳勲功至安者正義曰勲功欽敬釋詁文此經述上稽古之事放效上丗之功即是考於古道也經言放勲放其功而巳傳兼言化者據其勲業謂之功指其敎人則爲化功之與化所從言之異耳鄭玄云敬事節用謂之欽照臨四方謂之明經緯天地謂之文慮深通敏謂之思孔無明說當與之同四者皆在身之德故謂之四德凡是臣人王者皆須安之故廣言安天下之當安者所安者則下文九族百姓萬邦是也其敬明文思爲此次者顧氏云隨便而言無義例也知者此先聦後明舜典云明四目達四聦先明後聦故知無例也今考舜典云濬哲文明又先文後明與此不類知顧氏爲得也傳允信至天地正義曰允信格至釋詁文克能光充釋言文在身爲德施之曰行鄭玄云不澥於位曰恭推賢尚善曰讓恭讓是施行之名上言堯德此言堯行故傳以文次言之言堯旣有敬明文思之四德又信實恭勤善能推讓下人愛其恭讓傳其德音故其名逺聞旁行則充溢四方上下則至于天地持身能恭與人能讓自已及物故先恭後讓恭言信讓言克交互其文耳皆言信實能爲也傳以溢解被言其饒多盈溢故被及之也表裏内外相對之言故以表爲外向下向上至有所限旁行四方無復限極故四表言被上下言至四外者以其無限自内言之言其至於逺處正謂四方之外畔者當如爾雅所謂四海四荒之地也先四表後上下者人之聲名冝先及於人後被四表是人先知之故先言至人後言至于上下言至於天地喻其聲聞逺耳禮運稱聖人爲政能使天降膏露地出醴泉是名聞逺達使天地効靈是亦格于上下之事克明至時雍正義曰言堯能名聞廣逺由其委任賢哲故復陳之言堯之爲君也能尊明俊德之士使之助已施化以此賢臣之化先令親其九族之親九族蒙化已親睦矣又使之和協顯明於百官之族姓百姓蒙化皆有禮儀昭然而明顯矣又使之合㑹調和天下之萬國其萬國之衆人於是變化從上是以風俗大和能使九族敦睦百姓顯明萬邦和睦是安天下之當安者也傳能明至之親正義曰鄭玄云俊德賢才兼人者然則俊德謂有德又能明俊德之士者謂命爲大官賜之厚禄用其才智使之髙顯也以其有德故任用之以此賢臣之化親睦髙祖玄孫之親上至髙祖下及玄孫是爲九族同出髙曽皆當親之故言之親也禮記喪服小記云親親以三爲五以五爲九又異義夏侯歐陽等以爲九族者父族四母族三妻族二皆據異姓有服鄭玄駁云異姓之服不過緦麻言不廢昬又昬禮請期云惟是三族之不虞恐其廢昬明非外族也是鄭與孔同九族謂帝之九族百姓謂百官族姓萬邦謂天下衆民自内及外從髙至卑以爲逺近之次也知九族非民之九族者以先親九族次及百姓百姓是羣臣弟子不冝越百姓而先下民若是民之九族則九族旣睦民巳和矣下句不當復言協和萬邦以此知帝之九族也堯不自親九族而待臣使之親者此言用臣法耳豈有聖人在上䟽其骨肉者乎若以堯自能親不待臣化則化萬邦百姓堯豈不能化之而待臣化之也且言親九族者非徒使帝親之亦使臣親之帝亦令其自相親愛故須臣子之化也傳旣巳至章明正義曰旣巳義同故訓旣爲巳經傳之言百姓或指天下百姓此下句乃有黎民故知百姓即百官也百官謂之百姓者隱八年左傳云天子建德因生以賜姓謂建立有德以爲公卿因其所生之地而賜之以爲其姓令其收斂族親自爲宗主明王者任賢不任親故以百姓言之周官篇云唐虞稽古建官惟百大禹謨云率百官若帝之初是唐虞之丗經文皆稱百官而禮記明堂位云有虞氏之官五十後丗所記不合經也平章與百姓共文非九族之事傳以此經之事文勢相因先化九族乃化百官故云化九族而平和章明謂九族與百官皆須導之以德義平理之使之協和敎之以禮法章顯之使之明著傳昭亦至大和正義曰釋詁以昭爲光光明義同經巳有明故云昭亦明也釋詁以協爲和和合義同故訓協爲合也黎衆時是釋詁文雍和釋訓文堯民之變明其變惡從善人之所和惟風俗耳故知謂天下衆人皆變化化上是以風俗大和人俗大和即是太平之事也此經三事相類古史交互立文以親言旣睦平章言昭明協和言時雍睦即親也章即明也雍即和也各自變文以類相對平九族使之親平百姓使之明正謂使從順禮義恩情和今故於萬邦變言協和明以親九族平章百姓亦是協和之也但九族冝相親睦百姓冝明禮義萬邦冝盡和協各因所冝爲文其實相通也民言於變謂從上化則九族旣睦百姓昭明亦是變上故得睦得明也乃命至咸熈正義曰上言能明俊德又述能明之事堯之聖德美政如上所陳但聖不必獨理必須賢輔堯以須臣之故乃命有俊明之人羲氏和氏敬順昊天之命曆此法象其日之甲乙月之大小昬明遞中之星日月所會之辰定其所行之數以爲一歳之曆乃依此曆敬授下人以天時之早晚其揔爲一歳之曆其分有四時之異旣舉揔目更別序之堯於羲和之内乃分别命其羲氏而字仲者令居治東方嵎夷之地也日所出處名曰暘明之谷於此處所主之職使羲仲主治之旣主東方之事而日出於東方令此羲仲恭敬導引將出之日平均次序東方耕作之事使彼下民務勤種植於日晝夜中分刻漏正等天星朱鳥南方七宿合昬畢見以此天之時候調正仲春之氣節此時農事巳起不居室内其時之民冝分析適野老弱居室丁壯就功於時鳥獸皆孕胎卵孳尾匹合又就所分羲氏之内重命其羲氏而字叔者使之居治南方之職又於天分南方與東交立夏以至立秋時之事皆主之均平次序南方化育之事敬行其敎以致其功於日正長晝漏最多天星大火東方七宿合昬畢見以此天時之候調正仲夏之氣節於時苗稼以殖農事尤煩其時之民老弱因共丁壯就在田野於時鳥獸羽毛希少變改寒時又分命和氏而字仲者居治西方日所入處名曰昧冥之谷於此處所主之職使和仲主治之旣主西方之事而日入在於西方令此和仲恭敬從送旣入之日平均次序西方成物之事使彼下民務勤收斂於晝夜中分漏刻正等天星之虛北方七宿合昬畢見以此天時之候調正仲秋之氣節於時禾苗秀實農事末閑其時之民與夏齊平盡在田野於時鳥獸毛羽更生巳稍整治又重命和氏而字叔者令居治北方名曰幽都之地於此處所主之職使和叔主治之平均視察北方歳改之事於日正短畫漏最少天星之昴西方七宿合昬畢見以此天時之候調正仲冬之氣節於時禾稼巳入農事閑暇其時之人皆處深隩之室鳥獸皆生䎡毳細毛以自温煖此是羲和敬天授人之實事也羲和所掌如是故帝堯乃述而歎之曰咨嗟汝羲仲羲叔與和仲和叔一朞之閒三百有六旬有六日分爲十二月則餘日不盡令氣朔參差若以閏月補闕令氣朔得正定四時之氣節成一歲之曆象是汝之美可歎也又以此歳曆告時授事信能和治百官使之衆功皆廣也歎美羲和能敬天之節衆功皆廣則是風俗大和傳重黎至序之正義曰楚語云少昊氏之衰九黎亂德人神雜擾不可方物顓頊受之乃命南正重司天以屬神火正黎司地以屬民使復舊常無相侵瀆其後三苗復九黎之惡堯復育重黎之後不忘舊者使復典之以至于夏商據此文則自堯及商無他姓也堯育重黎之後是此羲和可知是羲和爲重黎之後丗掌天地之官文所出也吕刑先重後黎此文先羲後和揚子法言云羲近重和近黎是羲承重而和承黎矣吕刑稱乃命重黎與此命羲和爲一事也故吕刑傳云重即羲也黎即和也羲和雖別爲氏族而出自重黎故吕刑以重黎言之鄭語云爲髙辛氏火正則髙辛亦命重黎故鄭玄於此注云髙辛氏丗命重爲南正司天黎爲火正司地據丗掌之文用楚語爲說也楚丗家云重黎爲帝嚳火正能光融天下帝嚳命日祝融共工氏作亂帝嚳使重黎誅之而不盡帝乃以庚寅日誅重黎而以其弟吴回爲重黎復居火正爲祝融案昭二十九年左傳稱少昊氏有子曰重顓頊氏有子曰黎則重黎二人各出一帝而史記并以重黎爲楚國之祖吴回爲重黎以重黎爲官號此乃史記之謬故束晳譏馬遷并兩人以爲一謂此是也左傳稱重爲句芒黎爲祝融不言何帝使爲此官但黎是顓頊之子其爲祝融必在顓頊之丗重雖少昊之胤而與黎同命明使重爲句芒亦是顓頊時也祝融火官可得稱爲火正句芒木官不應號爲南正且木不主天火不主地而外傳稱顓頊命南正司天火正司地者蓋使木官兼掌天火官兼掌地南爲陽位故掌天謂之南正黎稱本官故掌地猶爲火正鄭荅趙商云先師以來皆云火掌爲地當云黎爲北正孔無明說未必然也昭十七年左傳郯子稱少昊氏以鳥名官自顓頊巳來乃命以民事句芒祝融皆以人事名官明此當顓頊之時也傳言少昊氏有四叔當爲後代子孫非親子也何則傳稱共工氏有子曰句龍共工氏在顓頊之前多歷年代豈復共工氏親子至顓頊時乎明知少昊四叔亦非親子髙辛所命重黎或是重黎子孫未必一人能歷二代又髙辛前命後誅當是異人何有罪而誅不容列在祀典明是重黎之後丗以重黎爲號所誅重黎是有功重黎之子孫也吕刑說羲和之事猶尚謂之重黎況彼尚近重黎何故不得稱之以此知異丗重黎號同人別顓頊命重司天黎司地羲氏掌天和氏掌地其實重黎羲和通掌之也此云乃命羲和欽若昊天是羲和二氏共掌天地之事以乾坤相配天地相成運立施化者天資生成物者地天之功成其見在地故下言日中星鳥之類是天事也平秩東作之類是地事也各分掌其時非別職矣案楚語云重司天以屬神黎司地以屬人天地旣別人神又殊而云通掌之者外傳之文說吕刑之義以爲少昊之衰天地相通人神雜擾顓頊乃命重黎分而異之以解絶地天通之言故云各有所掌天地相通人神雜擾見其能離絶天地變異人神耳非即別掌之下文别序所掌則羲主春夏和主秋冬俱掌天時明其共職彼又言至于夏商丗掌天地胤征云羲和湎淫廢時亂日不知日食羲和同罪明其丗掌天地共職可知顓頊命掌天地惟重黎二人堯命羲和則仲叔四人者以羲和二氏賢者旣多且後代稍文故分掌其職事四人各職一時兼職方岳以有四岳故用四人顓頊之命重黎惟司天地主岳以否不可得知設令亦主方岳蓋重黎二人分主東西也馬融鄭玄皆以此命羲和者命爲天地之官下云分命申命爲四時之職天地之與四時於周則冢宰司徒之屬六卿是也孔言此舉其目下別序之則惟命四人無六官也下傳云四岳即羲和四子舜典傳稱禹益六人新命有職與四岳十二牧凡爲二十二人然新命之六人禹命爲百揆契作司徒伯夷爲秩宗皐陶爲士垂作共工亦禹契之輩即是卿官卿官之外別有四岳四岳非卿官也孔意以羲和非是卿官別掌天地但天地行於四時四時位在四方平秩四時之人因主方岳之事猶自別有卿官分掌諸職左傳稱少昊氏以鳥名官五鳩氏即周丗之卿官也五鳩之外别有鳳鳥氏曆正也班在五鳩之上是上代以來皆重曆數故知堯於卿官之外别命羲和掌天地也於時羲和似尊於諸卿後丗以來稍益卑賤周禮太史掌正歳年以序事即古羲和之任也桓十七年左傳云日官居卿以厎日猶尚尊其所掌周之卿官明是堯時重之故特言乃命羲和此乃命羲和重述克明俊德之事得致雍和所由巳上論堯聖性此說堯之任賢據堯身而言用臣故云乃命非時雍之後方始命之使敬順昊天昊大者混元之氣昊然廣大故謂之昊天也釋天云春爲蒼天夏爲昊天秋爲旻天冬爲上天毛詩傳云尊而君之則稱皇天元氣廣大則稱昊天仁覆閔下則稱旻天自上降監則稱上天據逺視之蒼蒼然則稱蒼天爾雅四時異名詩傳即隨事立稱鄭玄讀爾雅云春爲昊天夏爲蒼天故駁異義云春氣博施故以廣大言之夏氣髙明故以逺言之秋氣或生或殺故以閔下言之冬氣閉藏而淸察故以監下言之皇天者尊而號之也六籍之中諸稱天者以情所求言之耳非必於其時稱之然此言堯敬大四天故以廣大言之星四方中星者二十八宿布在四方隨天轉運更互在南方每月各有中者月令每月昬旦惟舉一星之中若使每日視之即諸宿毎日昬旦莫不常中中則人皆見之故以中星表宿四方中星揔謂二十八宿也或以書傳云主春者張昬中可以種穀主夏者火昬中可以種黍主秋者虛昬中可以種麥主冬者昴昬中可以收斂皆云上告天子下賦臣人天子南面而視四方星之中知人緩急故曰敬授人時謂此四方中星如書傳之說孔於虚昴諸星夲無取中之事用書傳爲孔說非其旨矣辰日月所㑹者昭七年左傳士文伯對晉侯之辭也日行遲月行疾每月之朔月行及日而與之會其必在宿分二十八宿是日月所㑹之處辰時也集㑹有時故謂之辰日月所㑹與四方中星俱是二十八宿舉其人目所見以星言之論其日月所會以辰言之其實一物故星辰共文益稷稱古人之象日月星辰共爲一象由其實同故也日月與星天之三光四時變化以此爲政故命羲和令以筭術椎歩累歷其所行法象其所在具有分數節候參差不等敬記此天時以爲曆而授人此言星辰共爲一物周禮大宗伯云實柴祀日月星辰鄭玄云星謂五緯辰謂日月所㑹十二次者以星辰爲二者五緯與二十八宿俱是天星天之神祇禮無不祭故鄭玄隨事而分之以此敬授人時無取五緯之義故鄭玄於此注亦以星辰爲一觀文爲說也然則五星與日月皆别行不與二十八宿同爲不動也傳宅居至之官正義曰宅居釋言文禹貢靑州云嵎夷旣略靑州在東界外之畔爲表故云東表之地稱嵎夷也隂陽相對隂闇而陽明也故以暘爲明谷無隂陽之異以日出於谷而天丁皆明故謂日出之處爲暘谷冬南夏北不常厥處但日由空道似行自谷故以谷言之非實有深谷而日從谷之出也據日所出謂之暘谷指其地名即稱嵎夷故云暘谷嵎夷一也又解居者居其官不居其地故云羲仲居治東方之官此言分命者上云乃命羲和揔舉其目就乃命之内分其職掌使羲主春夏和主秋冬分一歳而別掌之故言分命就羲和之内又重分之故於夏變言申命旣命仲而復命叔是其重命之也所命無伯季者蓋時無伯季或有而不賢則外傳稱堯育重黎之後不忘舊者使復典之明仲叔能守舊業故命之也此羲和掌序天地兼知人事因主四時而分主四方故舉東表之地以明所舉之域地東舉嵎夷之名明分三方皆冝有地名此爲其始故特詳舉其文羲仲居治東方之官居在帝都而遥統領之王肅云皆居京師而統之亦有時述職是其事也以春位在東因治於東方其實本主四方春政故於和仲之下云此居治西方之官掌秋天之政明此掌春天之政孔以經事詳故就下文而互發之傳寅敬至務農正義曰寅敬釋詁文賔者主行導引故賔爲導也釋詁以祑爲常常即次第有序故秩爲序也一歳之事在東則耕作在南則化育在西則成熟在北則改易故以方名配歳事爲文言順天時氣以勸課人務也春則生物秋則成物日之出也物始生長人當順其生長致力耕耘日之入也物皆成熟人當順其成熟致力收斂東方之官當恭敬導引日出平秩東作之事使人耕耘西方之官當恭敬從送日入平秩西成之事使人收斂日之出入自是其常但由日出入故物有生成雖氣能生物而非人不就勤於耕稼是導引之勤於收藏是從送之冬夏之文無此類者南北二方非日所出入平秩南訛亦是導日之事平在朔易亦是送日之事依此春秋而共爲賔餞故冬夏二時無此一句勸課下民皆使致力是敬導之平均次序即是授人田里各有疆埸是平均之也耕種收斂使不失其次序王者以農爲重經主於農事寅賔出日爲平秩設文故并解之也言敬導出日者正謂平秩次序東作之事以務農也鄭以作爲生計秋言西成春冝言東生但四時之功皆須作力不可不言力作直說生成明此以歳事初起特言東作以見四時亦當力作故孔以耕作解之鄭玄云寅賔出日謂春分朝日又以寅餞納日謂秋分夕日也傳日中至可知正義曰其仲春仲秋冬至夏至馬融云古制刻漏晝夜百刻晝長六十刻夜短四十刻晝短四十刻夜長六十刻晝中五十刻夜亦五十刻融之此言據日出見爲說天之晝夜以日出入爲分人之晝夜以昬明爲限日未出前二刻半爲明日入後二刻半爲昬損夜五刻以裨於晝則晝多於夜復校五刻古今曆術與太史所候皆云夏至之晝六十五刻夜三十五刻冬至之晝四十五刻夜五十五刻春分秋分之晝五十五刻夜四十五刻此其不易之法也然今太史細候之法則校常法半刻也從春分至于夏至晝漸長增九刻半夏至至于秋分所減亦如之從秋分至于冬至晝漸短減十刻半從冬至至于春分其增亦如之又於每氣之閒增減刻數有多有少不可通而爲率漢初未能審知率九日増減一刻和帝時待詔霍融始請改之鄭注書緯考靈曜仍云九日增減一刻猶尚未覺誤也鄭注此云日長者日見之漏五十五刻日短者日見之漏四十五刻與曆不同故王肅難云知日見之漏減晝漏五刻不意馬融爲傳巳減之矣因馬融所減而又減之故日長爲五十五刻因以冬至反之取其夏至夜刻以爲冬至晝短此其所以誤耳鳥南方朱鳥七宿者在天成象星作鳥形曲禮說軍陳象天之行前朱雀後玄武左靑龍右白虎雀即鳥也武謂龜甲捍禦故變文玄武焉是天星有龍虎鳥龜之形也四方皆有七宿各成一形東方成龍形西方成虎形皆南首而北尾南方成鳥形北方成龜形皆西首而東尾以南方之宿象鳥故言鳥謂朱鳥七宿也此經舉宿爲文不類春言星鳥揔舉七宿夏言星火獨指房心虚昴惟舉一宿文不同者互相通也釋言以殷爲中中正義同故殷爲正也此經冬夏言正春秋言殷者其義同春分之昬觀鳥星畢見以正仲春之氣節計仲春日在奎婁而入於酉地則初昬之時井鬼在午柳星張在巳軫翼在辰是朱鳥七宿皆得見也春有三月此經直云仲春故傳辨之云旣正仲春轉以推季孟之月則事亦可知也天道左旋日體右行故星見之方與四時相逆春則南方見夏則東方見秋則北方見冬則西方見此則勢自當然而書緯爲文生說言春夏相與交秋冬相與互謂之母成子子助母斯假妄之談耳馬融鄭玄以爲星鳥星火謂正在南方春分之昬七星中仲夏之昬心星中秋分之昬虚星中冬至之昬昴星中皆舉正中之星不爲一方盡見此其與孔異也至于舉仲月以統一時亦與孔同王肅亦以星鳥之屬爲昬中之星其要異者以所宅爲孟月日中日永爲仲月星鳥星火爲季月以殷以正皆揔三時之月讀仲爲中言各正三月之中氣也以馬融鄭玄之言不合天象星火之屬仲月未中故爲每時皆歷陳三月言日以正仲春以正春之三月中氣若正春之三月中當言以正春中不應言以正仲春王氏之說非文勢也孔氏直取畢見稍爲迂闊比諸王馬於理最優傳冬寒至曰尾正義曰厥其釋言文其人老弱在室丁壯適野是老壯分析也孳字古今同耳字訓愛也産生爲乳胎孕爲化孕産必愛之故乳化曰孳鳥獸皆以尾交接故交接曰尾計當先尾後孳隨便言之傳申重至之官正義曰申重釋詁文此官旣主四時亦主方面經言南交謂南方與東方交傳言夏與春交見其時方皆掌之春盡之日與立夏之初時相交也東方之南南方之東位相交也言羲叔所掌與羲仲相交際也四時皆舉仲月之候嫌其不統季孟於此言交明四時皆然故傳言舉一隅以見之春上無冬不得見其交接至是夏與春交故此言之傳訛化至一隅正義曰訛化釋言文禾苗秀穗化成子實亦胎生乳化之類故掌夏之官平序南方化育之事謂勸課民耘耨使苗得秀實敬行其敎以致其功謂敬行平秩之敎以致化育之功農功歳終乃畢敬行四時皆同於此言之見四時皆然故云亦舉一隅也夏日農功尤急故就此言之傳永長至可知正義曰永長釋詁文夏至之日日最長故知謂夏至之日計七宿房在其中但房心連體心統其名左傳言火中火見詩稱七月流火皆指房心爲火故曰火蒼龍之中星特舉一星與鳥不類故云舉中則七星見可知計仲夏日在東井而入于酉地即初昬之時角亢在午氐房心在巳尾箕在辰是東方七宿皆得見也傳因謂至革改正義曰春旣分析在外今日因往就之故言因謂老弱因就在田之丁壯以務農也鳥獸冬毛最多春猶未脫故至夏始毛羽希少改易往前革謂變革故爲改也傳之訓字或先或後無義例也傳昧冥至之政正義曰釋言云晦冥也冥是暗故昧爲冥也谷者日所行之道日入於谷而天下皆冥故謂日入之處爲昧谷非實有谷而日入也此經春秋相對春不言東但舉昧谷曰西則嵎夷東可知然則東言嵎夷則西亦有地明矣闕其文所以互見之傳於春言東方之官不言掌春夏言掌夏之官不言南方此言居治西方之官掌秋天之政互文明四時皆同傳餞送至成物也正義曰送行飲酒謂之餞故餞爲送也導者引前之言送者從後之稱因其欲出導而引之因其欲入從而送之是其因事之冝而立此文也秋位在西於時萬物成熟平序其秋天之政未成則耘耨旣熟則收斂助天成物以此而從送入日也納入義同故傳以入解納傳宵夜至三秋正義曰宵夜釋言文舎人曰宵陽氣消也三時皆言日惟秋言夜故傳辨之云春言日秋言夜互相備也互者明也明日中宵亦中宵中日亦中因此而推之足知日永則宵短日短則宵長皆以此而備知也正於此時變文者以春之與秋日夜皆等春言出日即以日言之秋云納日即以夜言之亦事之冝也北方七宿則虚爲中故虛爲玄武之中星計仲秋日在角亢而入于酉地初昬之時斗牛在午女虛危在巳室壁在辰舉虚中星言之亦言七星皆以秋分之日昬時並見以正秋之三月傳夷平至整理正義曰釋詁云夷平易也俱訓爲易是夷得爲平秋禾未熟農事猶煩故老壯在田與夏平也毨者毛羽美悅之狀故爲理也夏時毛羽希少今則毛羽復生夏改而少秋更生多故言更生整理傳北稱至所掌正義曰釋訓云朔北方也舎人曰朔盡也北方萬物盡故言朔也李巡曰萬物盡於北方蘇而復生故言北方是北稱朔也羲和主四方之官四時皆應言方於此言方者即三方皆見矣春爲歳首故舉地名夏與春交故言南交秋言西以見嵎夷當爲東冬言方以見三時皆有方古史要約其文互相發見也幽之與明文恒相對北旣稱幽則南當稱明從此可知故於夏無文經冬言幽都夏當云明都傳不言都者從可知也鄭云夏不言曰明都三字摩滅也伏生所誦與壁中舊夲並無此字非摩滅也王肅以夏無明都避敬致然即幽足見明闕文相避如肅之言義可通矣都謂所聚者揔言此方是萬物所聚之處非指都邑聚居也易謂歲改易於北方者人則三時在野冬入隩室物則三時生長冬入囷倉是人之與物皆改易也王肅云改易者謹約蓋藏循行積聚引詩嗟我婦子曰爲改歳入此室處王肅言人物皆易孔意亦當然也釋詁云在察也舎人曰在見物之察是在爲察義故言平均在察其政以順天常以在察須與平均連言不復訓在爲察故舜典之傳别更訓之三時皆言平秩此獨言平在者以三時乃役力田野當次序之冬則物皆藏入須省察之故異其文秋日物成就故傳言助成物冬日蓋藏天之常道故言順天常因明東作南訛亦是助生物順常道也上揔言羲和敬順昊天此分別仲叔各有所掌明此四時之節即順天之政實恐人以敬順昊天直是曆象日月嫌仲叔所掌非順天之事故重明之傳隩室至温焉正義曰釋宫云西南隅謂之隩孫炎云室中隱隩之處也隩是室内之名故以隩爲室也物生皆盡野功咸畢是歳改矣以天氣改歳故入此室處以避風寒天氣旣至故鳥獸皆生䎡毳細毛以自温焉經言氄毛謂附肉細毛故以䎡毳解之傳咨嗟至曆象正義曰咨嗟曁與皆釋詀文也四時曰朞朞即迊也故王肅云朞四時是也然古時眞曆遭戰國及秦而亡漢存六曆雖詳於五紀之論皆秦漢之際假託爲之實不得正要有梗槩之言周天三百六十五度四分度之一而日日行一度則一朞三百六十五日四分日之一今考靈曜乾鑿度諸緯皆然此言三百六十六日者王肅云四分日之一又入六日之内舉全數以言之故云三百六十六日也傳又解所以須置閏之意皆㩀大率以言之云一歳十二月月三十日正三百六十日也除小月六又爲六日今經云三百六十六日故云餘十二日不成朞以一月不整三十日今一年餘十二日故未至盈滿三歳足得一月則置閏也以時分於歳故云氣節謂二十四氣時月之節歳揔於時故云曆象日月星辰敬授人時以相配成也六曆諸緯與周髀皆云日行一度月行十三度十九分度之七爲每月二十九日過半日之於法分爲日九百四十分日之四百九十九即月有二十九日半強爲十二月六大之外有日分三百四十八是除小月無六日又大歳三百六十六日小歳三百五十五日則一歳所餘無十二日今言十二日者皆以大率據整而計之其實一歲所餘正十一日弱也以爲十九年七閏十九年年十一日則二百九日其七月四大三小猶二百七日況無四大乎爲毎年十一日弱分明矣所以弱者以四分日之一於九百四十分則一分爲二百三十五分少於小月餘分三百四十八以二百三十五減三百四十八不盡一百一十三是四分日之一餘矣皆以五日爲率其小月雖爲歳日殘分所減猶餘一百一十三則實餘尚無六日就六日抽一日爲九百四十分減其一百一十三分不盡八百二十七分以不抽者五日并三百六十日外之五日爲十日其餘九百四十分日之八百二十七爲每歲之實餘今十九年年十日得整日一百九十又以十九乗八百二十七分得一萬五千七百一十三以日法九百四十除之得十六日以并一百九十日爲二百六日不盡六百七十三分爲日餘今爲閏月得七每月二十九日七月爲二百三日又每四百九十九分以七乗之得三千四百九十三以日法九百四十分除之得三日以二百三日亦爲二百六日不盡亦六百七十三爲日餘亦相當矣所以無閏時不定歲不成者若以閏無三年差一月則以正月爲二月毎月皆差九年差三月即以春爲夏若十七年差六月即四時相反時何由定歲何得成乎故須置閏以定四時故左傳云履端於始序則不愆舉正於中民則不惑歸餘於終事則不悖是也先王以重閏焉王肅云斗之所建是爲中氣日月所在斗指兩辰之閒無中氣故以爲閏也傳允信至其善正義曰釋訓云鬼之爲言歸也郷飲酒義云春之爲言蠢也然則釋訓之例有以聲相近而訓其義者釐治工官皆以聲近爲訓他皆放此類也績功咸皆釋詁文熙廣周語文此經文義承成歳之下傳以文勢次之言定曆授事能使衆功皆廣歎其善謂帝歎羲和之功也帝曰疇咨至弗成正義曰史又序堯事堯任羲和衆功巳廣及其末年羣官有闕復求賢人欲任用之帝曰誰乎咨嗟嗟人之難得也有人能順此咸熈庶績之事者我將登而用之有臣放齊者對帝曰有胤國子爵之君其名曰朱其人心志開達性識明悟言此人可登用也帝疑怪歎之曰吁此人旣頑且嚚又好爭訟豈可用乎言不可也史又記堯復求人帝曰誰乎咨嗟嗟人之難得也今有人能順我事者否乎言有即欲用之也有臣驩兜者對帝曰嗚呼歎有人之大賢也帝臣共工之官者此人於所在之方能立事業聚見其功言此人可用也帝亦疑怪之曰吁此人自作謀計之言及起用行事而背違之貌象恭敬而心傲很若漫天言此人不可用也頻頻求人無當帝意於是洪水爲災求人治之帝曰咨嗟嗟水災之大也呼掌岳之官而告以須人之意汝四岳等今湯湯流行之水所在方方爲害又其勢奔突蕩蕩然滌除在地之物包裹髙山乗上丘陵浩浩盛大勢若漫天在下之人其皆咨嗟困病其水矣有能治者將使治之羣臣皆曰嗚呼歎其有人之能惟鯀堪能治之帝又疑怪之曰吁其人心很戾哉好此方直之名命而行事輒毀敗善類言其不可使也朝臣巳共薦舉四岳又復然之岳曰帝若謂鯀爲不可餘人悉皆巳哉言不及鯀也惟鯀一人試之可也試若無功乃黜退之言洪水必須速治餘人不復及鯀故勸帝用之帝以羣臣固請不得巳而用之乃告勑鯀曰汝往治水當敬其事哉鯀治水九載巳經三考而功用不成言帝實知人而朝無賢臣致使水害未除待舜乃治此經三言求人未必一時之事但歷言朝臣不賢爲求舜張夲故也傳疇誰至用之正義曰疇誰釋詁文庸聲近用故爲用也馬融以羲和爲卿官堯之末年皆以老死庶績多闕故求賢順四時之職欲用以代羲和孔於下傳云四岳即上羲和之四子帝就羲和求賢則所求者別代他官不代羲氏和氏孔以羲和掌天地之官正在敬順昊天告時授事而巳其施政者乃是百官之事非復羲和之職但羲和告時授事流行百官使百官庶績咸熈今云咸熈庶績順是事者指謂求代百官之闕非求代羲和也此經文承庶績之下而言順是事者故孔以文勢次之此言誰能咸熈庶績順是事者將登用之蓋求卿士用任也計堯即位至洪水之時六十餘年百官有闕皆應求代求得賢者則史亦不錄不當帝意乃始録之爲求舜張本故惟帝求一人放齊以一人對之非六十餘年止求一人也堯以聖德在位庶績咸熈蓋應久矣此繼咸熈之下非知早晚求之史自歷序其事不必與治水同時也計四岳職掌天地當是朝臣之首下文求治水者帝咨四岳此不言咨四岳者帝求賢者固當博訪朝臣但史以有岳對者言咨四岳此不言咨者但此無岳對故不言耳傳放齊至不可王義曰以放齊舉人對帝故知臣名爲名爲字不可得知傳言名者辯此是爲臣之名號耳未必是臣之名也夏王仲康之時胤侯命掌六師顧命陳寶有胤之舞衣故知古有胤國胤旣是國自然子爲爵朱爲名也馬融鄭玄以爲帝之胤子曰朱也求官而薦太子太子下愚以爲啓明撥之人情必不然矣啓之爲開書傳通訓言此人心志開解而明達吁者必有所嫌而爲此聲故以爲疑怪之辭僖二十四年左傳曰口不道忠信之言爲嚚是言不忠信爲嚚也其人心旣頑嚚又好爭訟此實不可而帝云可乎故吁聲而反之可乎言不可也唐堯聖明之主應任賢哲放齊聖朝之臣當非庸品人有善惡無容不知稱嚚訟以爲啓明舉愚臣以對聖帝何哉將以知人不易人不易知密意深心固難照察胤子矯飾容貌但以惑人放齊内少鑒明未能圎備謂其實可任用故承意舉之以帝堯之聖乃知其嚚訟之事放齊所不知也驩兜薦舉共工以爲比周之惡謂之四凶投之逺裔放齊舉胤子不爲凶人者胤子雖有嚚訟之失不至滔天之罪放齊謂之實賢非是苟爲阿比驩兜則志不在公私相朋黨共工行背其言心反於貌其罪並深俱被流放其意異於放齊舉胤子故也傳采事至事者正義曰采事釋詁文上巳求順時不得其人故復求順我事者順時順事其義一也史以上承庶績之下故言順時謂順是庶績之事此不可復同前文故變言順我帝事其意亦如前經當求卿士之任也順我事之下亦冝有登用之言上文已具故於此略之傳驩兜至其功正義曰驩兜亦舉人對帝故知臣名都於釋詁文於即嗚字歎之辭也將言共工之善故先歎美之舜典命垂作共工知共工是官稱鄭以爲其人名氏未聞先祖居此官故以官氏也計稱人對帝不應舉先世官名孔直云官稱則其人於時居此官也時見居官則是已被任用復舉之者帝求順事之人欲置之上位以爲大臣所欲尊於共工故舉之也鳩聚釋詁文􅟅然見之狀故爲見歎共工能方方聚見其功謂每於所在之方皆能聚集善事以見其功言可用也若能共工實有見功則是可任用之人帝言其庸違滔天不可任者共工言是行非貌恭心佷取人之功以爲已功其人非無見功但功非已有左傳說驩兜云醜類惡物是與比周天下之人謂之渾敦言驩兜以共工比周妄相薦舉知所言見功非其實功也傳靜謀至可用正義曰靜謀釋詁文滔者漫浸之名浸必漫其上故滔爲漫也共丁險僞之人自爲謀慮之言皆合於道及起用行事而背違之言其語是而行非也貌象恭敬而心傲很其侮上陵下若水漫天言貌恭而心很也行與言違貌恭心反乃是大佞之人不可任用也明君聖主莫先於堯求賢審官王政所急乃有放齊之不識是非驩兠之朋黨惡物共工之巧言令色崇伯之敗善亂常聖人之朝不才揔萃雖曰難之何其甚也此等諸人才實中品亦雖行有不善未爲大惡故能仕於聖代致位大官以帝尭之末洪水爲災欲責非常之功非復常人所及自非聖舜登庸大禹致力則滔天之害未或可平以舜禹之成功見此徒之多罪勲業旣謝愆釁自生爲聖所誅其咎益大且虞史欲盛彰舜德歸過前人春秋史克以宣公比堯辭頗増甚知此等並非下愚未有大惡其爲不善惟帝所知將言求舜以見帝之知人耳傳四岳至稱焉正義曰上列羲和所掌云宅嵎夷朔方言四子居治四方主於外事岳者四方之大山今王朝大臣皆號稱四岳是與羲和所掌其事爲一以此知四岳即上羲和之四子也又解謂之岳者以其分掌四岳之諸侯故稱焉舜典稱巡守至于岱宗肆覲東后周官說巡守之禮云諸侯各朝於方岳之下是四方諸侯分屬四岳也計堯在位六十餘年乃命羲和蓋應早矣若使成人見命至此近將百歳故馬鄭以爲羲和皆死孔以爲四岳即是羲和至今仍得在者以羲和丗掌天地自當父子相承不必仲叔之身皆悉在也書傳雖出自伏生其當聞諸先達虞傳雖說舜典之四岳尚有羲伯和伯是仲叔子孫丗掌岳事也傳湯湯至為害正義曰湯湯波動之状故為流貌洪大釋詁文刀害為割故割為害也言大水方方為害謂其徧害四方也傳蕩蕩至漫天正義曰蕩蕩廣平之貌言水勢奔突有所滌除謂平地之水除地上之物為水漂流無所復見蕩蕩然惟有水耳懐藏包裹之義故懐為包也釋言以襄為駕駕乘牛馬皆車在其上故襄為上也包山謂遶其傍上陵謂乘其上平地已皆蕩蕩又復遶山上陵故為盛大之勢縂言浩浩盛大若漫天然也天者無上之物漫者加陵之辭甚其盛大故云若漫天也傳俾使乂治也正義曰俾使乂治釋詁文傳僉皆至舉之正義曰僉皆釋詁文周語云有崇伯鯀即鯀是崇君伯爵故云鯀崇伯之名帝以岳為朝臣之首故特言四岳其實求能治者普問朝臣不言岳對而云皆曰乃衆人舉之非獨四岳故言朝臣舉之傳凡言至善類正義曰自上以来三經求人所舉者帝言其惡而辭皆稱吁故知凡言吁者皆非帝之所當意也咈者相乖詭之意故為戾也圯毁釋詁文左氏稱非我族類其心必異族類義同故族為類也言鯀性很戾多乖異衆人好此方直之名内有姦囘之志命而行事輒毁敗善類何則心性很戾違衆用已知善不從故云毁敗善類詩稱貪人敗類與此同鄭王以方為放謂放弃敎命易坤卦六二直方大是直方之事為人之美名此經云方故依經為説傳异已已退也正義曰异聲近已故為已也已訓為止是停住之意故為退也傳勅鯀至用之正義曰傳觧鯀非帝所意而命使之者堯知其性很戾圮族未明其所能夫管氏之好奢尚僣翼賛霸圖陳平之盗嫂受金弼諧帝業然則人有性雖不善才堪立功者而衆皆據之言鯀可試兾或有益故遂用之孔之此說據迹立言必其盡理而論未是聖人之實何則禹稱帝德廣運乃聖乃神夫以聖神之資聦明之鑒旣知鯀性很戾何故使之治水者馬融云堯以大聖知時運當然人力所不能治下民其咨亦當憂勞屈己之是從人之非遂用於鯀李顒云堯雖獨明於上衆多不達於下故不得不副倒懸之望以供一切之求耳傳載年至退之正義曰釋天云載歳也夏曰歳商曰祀周曰年唐虞曰載李巡云各自紀事示不相襲也孫炎曰歳取歳星行一次也祀取四時祭祀一訖也年取禾穀一熟也載取萬物終而更始是載者年之別名故以載爲年也舜典云三載考績三考黜陟幽明是三考九年也功用不成水害不息故放退之謂退使不復治水至明年得舜乃殛之羽山周禮太宰職云歲終則令百官各正其治而詔王廢置三年則大計羣吏之治而誅賞然則考課功績必在歳終此言功用不成是九年歳終三考也下云朕在位七十載而求得虞舜歷試三載即數登用之年至七十二年爲三載即知七十載者與此異年此時堯在位六十九年鯀初治水之時堯在位六十一年若然鯀旣無功早應黜廢而待九年無成始退之者水爲大災天之常運而百官不悟謂鯀能治水及遣往治非無小益下人見其有益謂鯀實能治之日復一日以終三考三考無成衆人乃服然後退之故至九年祭法云鯀障洪水而殛死禹能脩鯀之功然則禹之大功頗亦因縣是治水有益之驗但不能成功故誅殛之耳若然災以運來時不可距假使興禹未必能治何以治水之功不成而便殛鯀者以鯀性傲很帝所素知又治水無功法須貶黜先有很戾之惡復加無功之罪所以殛之羽山以示其罪若然禹旣聖人當知洪水時未可治何以不諫父者梁主以爲舜之怨慕由已之私鯀之治水乃爲國事上令必行非禹能止時又年小不可干政也帝曰咨四至欽哉正義曰帝以鯀功不成又巳年老求得授位明聖代禦天災故咨嗟汝四岳等我在天子之位七十載矣言已年老不堪在位汝等四岳之内有能用我之命使之順我帝位之事言欲讓位與之也四岳對帝曰我等四岳皆不有用命之德若使順行帝事即辱於帝位言已不堪也帝又言曰汝當明白舉其明德之人於僻隱鄙陋之處何必在位之臣乃舉之也於是朝廷衆臣乃與帝之明人曰有無妻之鰥夫在下民之内其名曰虞舜言側陋之處有此賢人帝曰然我亦聞之其德行如何四岳又對帝曰其人愚瞽之子其父頑母嚚其弟字象性又傲慢家有三惡其人能諧和以至孝之行使此頑嚚傲慢者皆進進於善以自治不至於姦惡言能調和惡人是爲賢也帝曰其行如此當可任用我其召而試之哉欲配女與試之也即以女妻舜於是欲觀其居家治否也舜能以義理下二女之心於嬀水之汭使行婦道於虞氏帝歎曰此舜能敬其事哉歎其善治家知其可以治國故下篇言其授以官位而歷試諸難正義曰徧撿今之書傳無堯即位之年孔氏博考羣書作爲此傳言堯年十六以唐侯升爲天子必當有所案據未知出何書計十六爲天子其歳稱元年在位七十載應年八十五孔云八十六者史記諸書皆言堯帝嚳之子帝摯之弟嚳崩摯立摯崩乃傳位於堯然則堯以弟代兄蓋踰年改元據其改元年則七十載數其立年故八十六下句求人巽位是老將求代也此經文承績用不成之下計治水之事於時最急不求治水之人而先求代已者堯以身旣年老臣無可任治水之事非已所能故求人代已令代者自治是虞史盛美舜功言堯不能治水以大事付舜美舜能消大災成堯美也傳巽順至之事正義曰巽順易説卦文帝呼四岳言汝能庸命四岳自謙言巳否德故知汝四岳言四岳能用帝命故帝欲使之順行帝位之事將使攝也在位之臣四岳爲長故讓位於四岳也傳否不至不堪正義曰否古今不字忝辱釋言文已身不德恐辱帝位自辭不堪岳爲羣臣之首自度旣不堪意以爲在位之臣皆亦不堪由是自辭而巳不薦餘人故帝使之明舉側陋之處傳堯知至求賢正義曰此經曰上無帝以可知而省文也傳解四岳旣辭而復言此者堯知子不肖不堪為主有禪位與人之志故令四岳明舉明人今其在側陋者欲使廣求賢也鄭注雜記云肖似也言不如人也史記五帝本紀云堯知子丹朱之不肖不足授天下於是權授舜授舜則天下得其利而丹朱病授丹朱則天下病而丹朱得其利堯曰終不以天下之病而利一人而卒授舜以天下是堯知子不肖而禪舜之意也文王丗子論舉賢之法云或以事舉或以言揚揚亦舉也故以舉解揚經之揚字在於二明之下傳進舉字於兩明之中經於明中冝有揚字言明舉明人於側陋之處明下有揚故上闕揚文傳進舉於明上互文以足之也側陋者僻側淺陋之處意言不問貴賤有人則舉是令朝臣廣求賢人也堯知有舜而朝臣不舉故令廣求賢以啓之臣亦以堯知側陋有人故不得不舉舜耳此言堯知子不肖有志禪位然則自有賢子必不禪人授賢爰自上代堯舜而巳非堯舜獨可彼皆不然將以子不肖時無聖者乃運值汚隆非聖有優劣而緯候之書附㑹其事乃云河洛之符名字之錄何其妄且俗也傳師衆至言之正義曰師衆錫與釋詁文無妻曰鰥釋名云愁悒不寐目恒鰥鰥然故鰥字從魚魚目恒不閉王制云老而無妻曰鰥舜於時年未三十而謂之鰥者書傳稱孔子對子張曰舜父頑母嚚無室家之端故謂之鰥鰥者無妻之名不拘老少少者無妻可以更娶老者即不復更娶謂之天民之窮故禮舉老者耳詩云何草不玄何人不鰥暫離室家尚謂之鰥不獨老而無妻始稱鰥矣書傳以舜年尚少爲之說耳虞氏舜名者舜之爲虞猶禹之爲夏外傳稱禹氏曰有夏則此舜氏曰有虞顓頊巳來地爲國號而舜有天下號曰有虞氏是地名也王肅云虞地名也皇甫謐云堯以二女妻舜封之於虞今河東太陽山西虞地是也然則舜居虞地以虞爲氏堯封之虞爲諸侯及王天下遂爲天子之號故從微至著常稱虞氏舜爲生號之名前已具釋傳又解衆人以舜與帝則衆人盡知有舜但舜在下人之中未有官位衆臣德不及之而位居其上雖知舜實聖賢而恥已不若故不舉之以帝今舉及側陋意謂帝知有舜乃不獲巳而言之耳知然者正以初不薦舉至此始言明是恥己不若故不早舉舜實聖人而連言賢者對則事有優劣散即語亦相通舜謂禹曰惟汝賢是言聖德稱賢也傳以師爲衆臣爲朝臣之衆或亦通及吏人王肅云古者將舉大事訊羣吏訊萬人堯將讓位咨四岳使問羣臣衆舉側陋衆皆願與舜堯計事之大者莫過禪讓必應博詢吏人非獨在位王氏之言得其實矣鄭以師爲諸侯之師帝咨四岳徧訪羣臣安得諸侯之師獨對帝也傳俞然至如何正義曰俞然釋言文然其所舉言我亦聞也其德行如何恐所聞不審故詳問之堯知有舜不召取禪之而訪四岳令衆舉薦者以舜在卑賤未有名聞率暴禪之則下人不服故鄭玄六藝論云若堯知命在舜舜知命在禹猶求於羣臣舉於側陋上下交讓務在服人孔子曰人可使由之不可使知之此之謂也是解堯使人舉舜之意也傳無目至並惡正義曰周禮樂官有瞽矇之職以其無目使眡瞭相之是無目曰瞽又解稱瞽之意舜父有目但不能識別好惡與無目者同故時人謂之瞽配字曰瞍瞍亦無目之稱故或謂之爲瞽瞍詩云矇瞍奏公是瞍爲瞽類大禹謨云祗載見瞽瞍是相配之文史記云舜父瞽瞍盲以爲瞽瞍是名身實無目也孔不然者以經說舜德行美其能養惡人父自名瞍何須言之若實無目即是身有固疾非善惡之事輙言舜是盲人之子意欲何所見乎論語云未見顔色而言謂之瞽則言瞽者非謂無目史記又說瞽瞍使舜上廩從下縱火焚廩使舜穿井下土實井若其身自能然不得謂之無目明以不識善惡故稱瞽耳心不則德義之經爲頑僖二十四年左傳文象舜弟之字以字表象是人之名號其爲名字未可詳也釋訓云善兄弟爲友孟子說象與父母共謀殺舜是傲慢不友言舜父母與弟並皆惡也此經先指舜身因言瞽子又稱父頑者欲極其惡故文重也傳諧和至姦惡正義曰諧和烝進釋詁文上歷言三惡此美舜能養之言舜能和之以至孝之行和頑嚚昬傲使皆進進於善道以善自治不至于姦惡以下愚難變化令慕善是舜之美行故以此對堯案孟子及史記稱瞽瞍縱火焚廩舜以兩笠自扞而下以土實井舜從旁空井出象與父母共分財物舜之大孝升聞天朝堯妾之二女三惡尚謀殺舜爲姦之大莫甚於此而言不至姦者此三人性實下愚動挂刑網非舜養之久被刑戮猶尚有心殺舜餘事何所不爲舜以權謀自免厄難使􅮊無殺子之愆象無害兄之罪不至於姦惡於此益驗終令瞽亦允若象封有鼻是不至於姦惡也傳言欲至行迹正義曰下言妻舜以女觀其治家是試舜觀其行迹也馬鄭王夲說此經皆無帝曰當時庸生之徒漏也鄭玄云試以爲臣之事王肅云試之以官鄭王皆以舜典合於此篇故指歷試之事充此試哉之言孔據古今別卷此言試哉正謂以女試之旣善於治家别更試以難事與此異也傳女妻至治國正義曰左傳稱宋雍氏女於鄭莊公晉伐驪戎驪戎男女以驪姬以女妻人謂之女故云女妻也刑法釋詁文此巳下皆史述堯事非復堯語言女于時謂妻舜於是故傳倒文以曉人堯於是以二女妻舜必妻之者舜家有三惡身爲匹夫忽納帝女難以和協觀其施法度於二女以法治家觀治國將使治國故先使治家敵夫曰妻不得有二女言女十時者揔言之耳二女之中當有貴賤長幼劉向列女傳云二女長曰娥皇次曰女英舜旣升爲天子娥皇爲后女英爲妃然則初適舜時即娥皇爲妻鄭不言妻者不告其父不序其正又注禮記云舜不告而娶不立正妃此則鄭自所說未有書傳云然案丗本堯是黄帝玄孫舜是黄帝八代之孫計堯女於舜之曽祖爲四從姊妹以之爲妻於義不可丗本之言未可據信或者古道質故也傳降下至虞氏正義曰降下釋詁文周禮九嬪之職掌婦學之法嬪是婦之別名故以嬪爲婦釐降謂能以義理下之則女意初時不下故傳解之言舜爲匹夫帝女下嫁以貴適賤必自驕矜故美舜能以義理下帝女尊亢之心於所居嬀水之汭使之服行婦道於虞氏虞與嬀汭爲一地見其心下乃行婦道故分爲二文言匹夫者士大夫巳上則有妾媵庶人無妾媵惟夫妻相匹其名旣定雖單亦通謂之匹夫匹婦嬀水在河東虞郷縣歷山西西流至蒲坂縣南入於河舜居其旁周武王賜陳胡公之姓爲嬀爲舜居嬀水故也舜仕堯朝不家在於京師而令二女歸虞者蓋舜以大孝示法使妻歸事於其親以帝之賢女事頑嚚舅姑美其能行婦道故云嬪於虞傳歎舜至大矣正義曰二女行婦道乃由舜之敬故帝言欽哉歎能脩已行敬以安民也能脩已及安人則是所能者大故歎之論語云脩已以安百姓堯舜其猶病諸傳意出於彼也尚書正義卷第二計二萬一千九十三字
