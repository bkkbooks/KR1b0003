  text: 尚書正義卷第一
  hash: sha256:9b66f58012e572e9c7d1e79cfcc204c2e4be444898a9a64354acaf1dc12a2be8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_001-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎逹等奉勑撰尚書序正義曰道夲沖寂非有名言既形以道生物由名舉則凡諸經史因物立名物有夲形形從事著聖賢闡教事顯於言言愜羣心書而示法既書有法因號曰書後人見其久逺自於上丗尚者上也言此上代以來之書故曰尚書且言者意之聲書者言之記是故存言以聲意立書以記言故易曰書不盡言言不盡意是言者意之筌蹄書言相生者也書者舒也書緯璿璣鈐云書者如也則書者寫其言如其意情得展舒也又劉熙釋名云書者庶也以記庶物又為著言事得彰著五經六籍皆是筆書此獨稱書者以彼五經者非是君口出言即書為法所書之事各有云為遂以所為別立其稱稱以事立故不名書至於此書者本書君事事雖有別正是君言言而見書因而立號以此之故名異諸部但諸部之書隨事立名名以事舉要名立之後亦是筆書故百氏六經總曰書也論讖所謂題意別名各自載耳昭二年左傳曰晉韓起適魯觀書於太史氏見易象與魯春秋此總名書也序者言序述尚書起記存亡注説之由序為尚書而作故曰尚書序周頌曰繼序思不忘毛傳云序者緒也則緒述其事使理相胤續若繭之抽緒伹易有序卦子夏作詩序孔子亦作尚書序故孔君因此作序名也鄭玄謂之贊者以序不分散避其序名故謂之贊贊者明也佐也佐成序義明以注解故也安國以孔子之序分附篇端故已之總述亦謂之序事不煩重義無所嫌故也古者至生焉正義曰代結繩者言前丗之政用結繩今有書契以代之則伏犧時始有文字以書事故曰由是文籍生焉自今本昔曰古古者以聖德伏物教人取犧牲故曰伏犧字或作宓犧音亦同律曆志曰結作網罟以取犧牲故曰伏犧或曰包犧言取犧而包之顧氏讀包為庖取其犧牲以供庖廚顧氏又引帝王丗紀云伏犧母曰華胥有巨人迹出於雷澤華胥以足履之有娠生伏犧於成紀蛇身人首月令云其帝太昊繫辭云古者包犧氏之王天下也是直變包言伏耳則伏犧是皇言王天下者以皇與帝王據迹為優劣通亦為王故禮運云昔者先王亦謂上代為王但自下言之則以上身為王據王身於下謂之王天下也知伏犧始畫八卦者以繫辭云包犧氏之王天下也後乃云始畫八卦以通神明之德以類萬物之情故知之也知時造書契以代結繩之政者亦以繫辭云上古結繩而治後丗聖人易之以書契蓋取諸夬是造書契可以代結繩也彼直言後丗聖人知是伏犧者以理比況而知何則八卦畫萬物之象文字書百事之名故繫辭曰仰則觀象於天俯則觀法於地觀鳥獸之文與地之冝近取諸身逺取諸物始畫八卦是萬象見於卦然畫亦書也與卦相類故知書契亦伏犧時也由此孔意正欲須言伏犧時有書契夲不取於八卦今云八卦者明書卦相類據繫辭有畫八卦之成文而言明伏犧造書契也言結繩者當如鄭注云為約事大大其繩事小小其繩王肅亦曰結繩識其政事是也言書契者鄭云書之於木刻其側為契各持其一後以相考合若結繩之為治孔無明説義或當然説文云文者物象之本也籍者借也借此簡書以記録政事故曰籍蓋取諸夬夬者決也言文籍所以決斷宣揚王政是以夬繇曰揚于王庭繫辭云包犧氏之王天下又云作結繩而為罔罟蓋取諸離彼謂結罔罟之繩與結為政之繩異也若然尚書緯及孝經讖皆云三皇無文字又班固馬融鄭玄王肅諸儒皆以為文籍初自五帝亦云三皇未有文字與此説不同何也又蒼頡造書出於丗本蒼頡豈伏犧時乎且繫辭云黃帝堯舜為九事之目末乃云上古結繩以治後丗聖人易之以書契是後丗聖人即黃帝堯舜何得為伏犧哉孔何所據而更與繫辭相反如此不同者藝文志曰仲尼沒而微言絶七十子喪而大義乖況遭秦焚書之後羣言競出其緯文鄙近不出聖人前賢共疑有所不取通人考正偽起哀平則孔君之時未有此緯何可引以為難乎其馬鄭諸儒以據文立説見後丗聖人在九事之科便謂書起五帝自所見有異亦不可難孔也而繫辭云後丗聖人在九事之下者有以而然案彼文先歷説伏犧神農蓋取下乃云黃帝堯舜垂衣裳而天下治蓋取諸乾坤是黃帝堯舜之事也又舟楫取渙服牛取隨重門取豫曰杵取小過弧矢取睽此五者時無所繫在黃帝堯舜時以否皆可以通也至於宫室葬與書契皆先言上古古者乃言後丗聖人易之則別起事之端不指黃帝堯舜時以此葬事云古者不云上古而云易之以棺椁棺椁自殷湯而然非是彼時之驗則上古結繩何廢伏犧前也其蒼頡則説者不同故丗夲云蒼頡作書司馬遷班固韋誕宋忠傅玄皆云蒼頡黃帝之史官也崔瑗曹植蔡雍索靖皆直云古之王也徐整云在神農黃帝之間譙周云在炎帝之丗衛氏云當在庖犧蒼帝之丗愼到云在庖犧之前張揖云蒼頡為帝王生於禪通之紀廣雅曰自開闢至獲麟二百七十六萬歲分為十紀則大率一紀二十七萬六千年十紀者九頭一也五龍二也攝提三也合雒四也連通五也序命六也循飛七也因提八也禪通九也流訖十也如揖此言則蒼頡在獲麟前二十七萬六千餘年是説蒼頡其年代莫能有定亦不可以難孔也然紀自燧人而下揖以為自開闢而設又伏犧前六紀後三紀亦為據張揖愼到徐整等説亦不可以年斷其流訖之紀似自黃帝為始耳又依易緯通卦驗燧人在伏犧前表計置其刻曰蒼牙通靈昌之成孔演命明道經鄭玄注云刻謂刻石而記識之據此伏犧前巳有文字矣又隂陽書稱天老對黃帝云鳳皇之象首戴德背負仁頸荷義膺抱信足履政尾繫武又山海經云鳳皇首文曰德背文曰義翼文曰順膺文曰仁腹文曰信又易繫辭云河出圖洛出書聖人則之是文字與天地並興焉又韓詩外傳稱古封太山禪梁甫者萬餘人仲尼觀焉不能盡識又管子書稱管仲對齊桓公曰古之封太山者七十二家夷吾所識十二而巳首有無懷氏封太山禪云云其登封者皆刻石紀號但逺者字有雕毀故不可識則夷吾所不識者六十家又在無懷氏前孔子覩而不識又多於夷吾是文字在伏犧之前巳自久逺何怪伏犧而有書契乎如此者蓋文字在三皇之前未用之教丗至伏犧乃用造書契以代結繩之政是教丗之用猶燧人有火中古用以燔黍捭豚後聖乃修其利相似文字理本有之用否隨丗而漸也若然惟繫辭至神農始有噬嗑與益則伏犧時其卦未重當無雜卦而得有取諸夫者此自鄭玄等説耳案説卦曰昔者聖人幽贊於神明而生蓍繫辭曰天生神物聖人則之則伏犧用蓍而筮矣故鄭注説卦亦曰昔者聖人謂伏犧文王也繫辭又曰十有八變而成卦是言爻皆三歸竒為三變十八變則六爻明矣則筮皆六爻伏犧有筮則有六爻何為不重而怪有夬卦乎伏犧至常道也正義曰墳大也以所論三皇之事其道至大故曰言大道也以典者常也言五帝之道可以百代常行故曰言常道也此三皇玉帝或舉德號或舉地名或直指其人言及便稱不為義例顧氏引帝王丗紀云神農母曰女登有神龍首感女登而生炎帝人身牛首黃帝母曰附寶見大電光繞北斗樞星附寶感而懷孕二十四月而生黃帝日角龍顔少昊金天氏母曰女節有星如虹下流意感而生少昊顓頊母曰景僕昌意正妃謂之女樞有星貫月如虹感女樞於幽房之宫而生顓頊堯母曰慶都觀河遇赤龍暗然隂風感而有孕十四月而生堯又云舜母曰握登見大虹感而生舜此言謂之三墳謂之五典者因左傳有三墳五典之文故指而謂之然五帝之書皆謂之典則虞書皋陶謨益稷之屬亦應稱典所以别立名者若主論帝德則以典為名其臣下所為隨義立稱其三墳直云言大道也五典直云言常道也不訓墳典之名者以墳大典常常訓可知故略之也常道所以與大道為異者以帝者公平天下其道可以常行故以典言之而皇優於帝其道不但可常行而巳又更大於常故言墳也此為對例耳雖少有優劣皆是大道並可常行故禮運云以大道之行為五帝時也然帝號同天名所莫加優而稱皇者以皇是美大之名言大於帝也故後代措廟立主尊之曰皇生者莫敢稱焉而士庶祖父稱曰皇者以取美名可以通稱故也案左傳上有三墳五典不言墳是三皇之書典是五帝之書孔知然者案今堯典舜典是二帝二典推此二典而上則五帝當五典是五典為五帝之書今三墳之書在五典之上數與三皇相當墳又大名與皇義相類故云三皇之書為三墳孔君必知三皇有書者案周禮小史職掌三皇五帝之書是其明文也鄭玄亦云其書即三墳五典但鄭玄以三皇無文或據後録定孔君以為書者記當時之事不可以在後追録若當時無書後代何以得知其道也此亦孔君所據三皇有文字之驗耳鄭玄注中候依運斗樞以伏犧女媧神農為三皇又云五帝坐帝鴻金天髙陽髙辛唐虞氏知不爾者孔君既不依緯不可以緯難之又易興作之條不見有女媧何以輒數又鄭玄云女媧修伏犧之道無改作則巳上修舊者衆豈皆為皇乎既不數女媧不可不取黃帝以充三皇耳又鄭玄數五帝何以六人或為之説云德協五帝座不限多少故六人亦名五帝若六帝何有五座而皇指大帝所謂耀魄寶止一而巳本自無三皇何云三皇豈可三皇數人五帝數座二文舛互自相乖阻也其諸儒説三皇或數燧人或數祝融以配犧農者其五帝皆自軒轅不數少昊斯亦非矣何燧人説者以為伏犧之前據易曰帝出於震震東方其帝太昊又云古者包犧氏之王天下也言古者制作莫先於伏犧何以燧人廁在前乎又祝融及顓頊以下火官之號金天巳上百官之號以其徴五經無云祝融為皇者縱有不過如共工氏共工有水瑞乃與犧農軒摯相類尚云霸其九州祝融夲無此瑞何可數之乎左傳曰少昊之立鳳鳥適至於月令又在秋享食所謂白帝之室者也何為獨非帝乎故孔君以黃帝上數為皇少昊為五帝之首耳若然案今丗夲帝繫及大戴禮五帝德并家語宰我問太史公五帝夲紀皆以黃帝為五帝此乃史籍明文而孔君不從之者孟軻曰信書不如其無書吾於武城取二三䇿而巳言書以漸染之濫也孟軻巳然況後之説者乎又帝繫夲紀家語五帝德皆云少昊即黃帝子靑陽是也顓頊黃帝孫昌意子帝嚳髙辛氏為黃帝曽孫玄嚻孫僑極子堯為帝嚳子舜為顓頊七丗孫此等之書説五帝而以黃帝為首者原由丗夲經於暴秦為儒者所亂家語則王肅多私定大戴禮夲紀出於丗夲以此而同蓋以少昊而下皆出黃帝故不得不先説黃帝因此謬為五帝耳亦由繫辭以黃帝與堯舜同事故儒者共數之焉孔君今者意以月令春曰太昊夏曰炎帝中央曰黃帝依次以為三皇又依繫辭先包犧氏王沒神農氏作又沒黃帝氏作亦文相次皆著作見於易此三皇之明文也月令秋曰少昊冬曰顓頊自此為五帝然黃帝是皇今言帝不云皇者以皇亦帝也别其美名耳太昊為皇月令亦曰其帝太昊易曰帝出於震是也又軒轅之稱黃帝猶神農之云炎帝神農於月令為炎帝不怪炎帝為皇何怪軒轅稱帝而梁主云書起軒轅同以燧人為皇其五帝自黃帝至堯而止知帝不可以過五故曰舜非三王亦非五帝與三王為四代而巳其言與詩之為體不雅則風除皇巳下不王則帝何有非王非帝以為何人乎典謨皆云帝曰非帝如何至于至一揆正義曰既皇書稱墳帝書稱典除皇與帝墳典之外以次纍陳故言至于夏商周三代之書雖復當時所設之教與皇及帝墳典之等不相倫類要其言皆是雅正辭誥有深奧之義其所歸趣與墳典一揆明雖事異墳典而理趣終同故所以同入尚書共為丗教也孔君之意以墳典亦是尚書故此因墳典而及三代下云討論墳典斷自唐虞以下是墳典亦是尚書之內而小史偏掌之者以其逺代故也此既言墳典不依外文連類解八索九丘而言三代之書廁於其間者孔意以墳典是尚書丘索是尚書外物欲先説尚書事訖然後及其外物故先言之也夏商周之書皆訓誥誓命之事言設教者以此訓誥誓命即為教而設故云設教也言不倫者倫類也三代戰爭不與皇帝等類若然五帝稱典三王劣而不倫不得稱典則三代非典不可常行何以垂法乎然三王丗繞不如上代故隨事立名雖篇不目典理實是典故曰雅誥奧義其歸一揆即為典之謂也然三王之書惟無典謨以外訓誥誓命歌貢征範類猶有八獨言誥者以別而言之其類有八文從要約一誥兼焉何者以此八事皆有言以誥示故總謂之誥又言奧義者指其言謂之誥論其理謂之義故以義配焉言其歸一揆見三代自歸於一亦與墳典為一揆者況喻之義假譬人射莫不皆發志揆度於的猶如聖人立教亦同揆度於至理故云一揆是故歷代寶之以為大訓正義曰顧命云越玉五重陳寶即以赤刀大訓在西序是寶之以為大訓之文彼注以典謨為之與此相當要六藝皆是此直為書者指而言之故彼注亦然也彼直周時寶之此知歷代者以墳典久逺周尚寶之前代可知故言歷代耳八卦至此書也正義曰以墳典因外文而知其丘索與墳典文連故連而説之故總引傳文以充足已意且為於下見與墳典俱被黜削故説而以為首引言為論八卦事義之説者其書謂之八索其論九州之事所有志記者其書謂之九丘所以名丘者以丘聚也言於九州當有士地所生之物風氣所冝之事莫不皆聚見於此書故謂之九丘焉然八卦言之説九州言之志不同者以八卦交互相説其理九州當州有所志識以此而不同此索謂求索亦為搜索以易八卦為主故易曰八卦成列象在其中矣因而重之爻在其中矣又曰八卦相蕩是六十四卦三百八十四爻皆出於八卦就八卦而求其理則萬有一千五百二十䇿天下之事得故謂之索非一索再索而巳此索於左傳亦或謂之索説有不同皆後人失其真理妄穿鑿耳其九丘取名於聚義多如山丘故為聚左傳或謂之九區得為説當九州之區域義亦通也又言九州所有此一句與下為揔即上地所生風氣所冝是所有也言土地所生即其動物植物大率土之所生不出此二者又云風氣所冝者亦與土地所生大同何者以九州各有土地有生與不生由風氣所冝與不冝此亦職方禹貢之類別而言之土地所生若禹貢之厥貢厥篚也風氣所冝若職方其畜冝若干其民若干男若干女是也上墳典及索不別訓之以可知故略之丘訓既難又須別言九州所冝巳下故先訓之於下結義故云皆聚此書也春秋至遺書也正義曰以上因有外文言墳典丘索而謂之故引成文以證結之此昭十二年左傳楚靈王見倚相趨過告右尹子革以此辭知倚相是其名字蓋為太史而主記左動之事謂之左史不然或楚俗與諸國不同官多以左右為名或別有此左史乎彼子革答王云倚相臣問祈招之詩而不知若問逺焉其焉能知之彼以為倚相不能讀之此云能者以此據左傳成文因王言而引之假不能讀事亦無妨況子革欲開諫王之路倚相未必不能讀也言此墳典丘索即此晉是謂上丗帝王遺餘之書也以楚王論時巳在三王之末故云遺書其丘索知是前事亦不知在何代故直揔言帝王耳先君至九丘正義曰既結申帝王遺書欲言孔子就而刋定孔子丗家云安國是孔子十一世孫而上尊先祖故曰先君穀梁以為魯襄公二十一年冬十一月庚子孔子生左傳哀公十六年夏四月己丑孔子卒計以周靈王時生敬王時卒故為周末上云文籍下云滅先代典籍此言史籍籍者古書之大名由文而有籍謂之文籍因史所書謂之史籍可以為常故曰典籍義亦相通也但上因書契而言文下傷秦滅道以稱典於此言史者不但義通上下又以此史籍不必是先王正史是後代好事者作以此懼其不一故曰蓋有不知而作之者我無是也先言定禮樂者欲明孔子欲反於聖道以歸於一故先言其舊行可從者修而不改曰定就而減削曰刪凖依其事曰約因而佐成曰贊顯而明之曰述各從義理而言獨禮樂不改者以禮樂聖人制作己無貴位故因而定之又云明舊章者即禮樂詩易春秋是也以易道職方與黜八索除九丘相對其約史記以刪詩書為偶其定禮樂文孤故以明舊章配之作文之體也易亦是聖人所作不言定者以易非如禮樂人之行事不須云定又因而為作十翼故云贊耳易文在下者亦為黜八索與除九丘相近故也為文之便不為義例孔子之修六藝年月孔無明説論語曰吾自衛反魯然後樂正雅頌各得其所則孔子以魯哀公十一年反魯為大夫十二年孟子卒孔子弔則致仕時年七十以後修述也詩有序三百一十一篇全者三百五篇云三百者亦舉全數計職方在周禮夏官亦武帝時出於山巖屋壁即藏祕府丗人莫見以孔君為武帝博士於祕府而見焉知必黜八索除九丘者以三墳五典夲有八今序只有二典而巳其三典三墳今乃寂寞明其除去既墳典書內之正尚有去者況書外乎故知丘索亦黜除也黜與除其義一也黜退不用而除去之必云贊易道以黜者以不有所興孰有所廢故也職方即周禮也上巳云定禮樂即職方在其內別云遂之以為除九丘舉其類者以言之則云述者以定而不改即是遵述更有書以述之討論至百篇正義曰言孔子既懼覽之者不一不但刪詩約史定禮贊易有所黜除而巳又討整論理此三墳五典并三代之書也論語曰丗叔討論之鄭以討論為整理孔君既取彼文義亦當然以書是亂物故就而整理之若然墳典周公制禮使小史掌之而孔子除之者蓋隨丗不同亦可孔子之時墳典巳雜亂故因去之左傳曰芟夷藴崇之又曰俘翦惟命詩曰海外有截此孔君所取之文也芟夷者據全代全篇似草隨次皆芟使平夷若自帝嚳巳上三典三墳是芟夷之文自夏至周雖有所留全篇去之而多者即芟夷也翦截者就代就篇辭有浮者翦截而去之去而少者為翦截也舉其宏綱即上芟夷煩亂也撮其機要即上翦截浮辭也且宏綱云舉是據篇代大者言之機要云撮為就篇代之內而撮出之耳宏大也網者綱之索舉大網則衆目隨之機者機關撮取其機關之要者斷自唐虞以下者孔無明説書緯以為帝嚳以上朴略難傳唐虞已來煥炳可法又禪讓之首至周五代一意故耳孔義或然典即堯典舜典謨即大禹謨皋陶謨訓即伊訓髙宗之訓誥即湯誥大誥誓即甘誓湯誓命即畢命顧命之等是也説者以書體例有十此六者之外尚有征貢歌範四者并之則十矣若益稷盤庚單言附於十事之例今孔不言者不但舉其機約亦自征貢歌範非君出言之名六者可以兼之此云凡百篇據序而數故耳或云百二篇者誤有所由以前漢之時有東萊張霸偽造尚書百兩篇而為緯者附之因此鄭云異者其在大司徒大僕正乎此事為不經也鄭作書論依尚書緯云孔子求書得黃帝玄孫帝魁之書迄於秦穆公凡三千二百四十篇斷逺取近定可以為丗法者百二十篇以百二篇為尚書十八篇為中候以為去三千一百二十篇以上取黃帝玄孫以為不可依用今所考核尚書首自舜之末年以禪於禹上録舜之得用之事由堯以為堯典下取舜禪之後以為舜讓得人故史體例别而不必君言若禹貢全非君言而禹身事受禪之後無入夏書之言是舜史自録成一法後代因之耳所以至其義正義曰此論孔子正理羣經已畢揔而結之故為此言家語及史記皆云孔子弟子三千人故云三千之徒也及秦至屋壁正義曰言孔子既定此書後雖曰明白反遭秦始皇滅除之依秦夲紀云秦王正二十六年平定天下尊為皇帝不復立諡以為初并天下故號始皇為滅先代典籍故云坑儒焚書以即位三十四年因置酒於咸陽宫丞相李斯奏請天下敢有藏詩書百家語者悉詣守尉親燒之有敢偶語詩書者棄市令下三十日不燒黥為城旦制曰可是焚書也三十五年始皇以方士盧生求仙藥不得以為誹謗諸生連相告引四百六十餘人皆坑之咸陽是坑儒也又衛宏古文竒字序云秦改古文以為篆隸國興教招聘名士文景以後儒者更衆至武帝尤甚故云旁求儒雅詩小雅曰匪先民是程匪大猷是經彼注云猷道也大道即先王六籍是也伏生名勝為秦二丗博士儒林傳云孝文帝時求能治尚書者天下無有聞伏生治之欲召時伏生年巳九十有餘老不能行於是詔太常使掌故臣朝錯往受之得二十九篇即以教於齊魯之間是年過九十也案史記秦時焚書伏生壁藏之其後兵火起流漢定天下伏生求其書亡數十篇獨得二十九篇以教于齊魯之間則伏生壁內得二十九篇而云失其夲經口以傳授者蓋伏生初實壁內得之以教齊魯傳教既久誦文則熟至其末年因其習誦或亦目暗至年九十朝錯往受之時不執經而口授之故也又言裁二十餘篇者意在傷亡為少之文勢何者以數法隨所近而言之若欲多之當云得三十篇今裁二十餘篇言裁亦意以為少之辭又二十九篇自是計卷若計篇則三十四去泰誓猶有三十一案史記及儒林傳皆云伏生獨得二十九篇以教齊魯則今之泰誓非初伏生所得案馬融云泰誓後得鄭玄書論亦云民間得泰誓別録曰武帝末民有得泰誓書於壁內者獻之與博士使讀説之數月皆起傳以教人則泰誓非伏生所傳而言二十九篇者以司馬遷在武帝之丗見泰誓出而得行入於伏生所傳內故為史揔之并云伏生所出不復曲別分析云民間所得其實得時不與伏生所傳同也但伏生雖無此一篇而書傳有八百諸侯俱至孟津白魚入舟之事與泰誓事同不知為伏生先為此説不知為是泰誓出後後人加增此語案王充論衡及後漢史獻帝建安十四年黃門侍郎房宏等説云宣帝泰和元年河內女子有壞老子屋得古文泰誓三篇論衡又云以掘地所得者今史漢書皆云伏生傳二十九篇則司馬遷時巳得泰誓以并歸於伏生不得云宣帝時始出也則云宣帝時女子所得亦不可信或者爾時重得之故於後亦據而言之史記云伏生得二十九篇武帝記載今文泰誓末篇由此劉向之作別録班固為儒林傳不分明因同於史記而劉向云武帝末得之泰誓理當是一而古今文不同者即馬融所云吾見書傳多矣凡諸所引今之泰誓皆無此言而古文皆有則古文為真亦復何疑但於先有張霸之徒偽造泰誓以藏壁中故後得而惑丗也亦可今之泰誓百篇之外若周書之例以於時實有觀兵之誓但不録入尚書故古文泰誓曰皇天震怒命我文考肅將天威大勳未集肆豫小子發以爾友邦冢君觀政於商是也又云以其上古之書謂之尚書者此文繼在伏生之下則言以其上古之書謂之尚書此伏生意也若以伏生指解尚書之名名巳先有有則當云名之尚書既言以其上古之書今先云以其則伏生意之所加則知尚字乃伏生所加也以尚解上則尚訓為上上者下所慕尚故義得為通也孔君既陳伏生此義於下更無是非明即用伏生之説故書此而論之馬融雖不見孔君此説理自然同故曰上古有虞氏之書故曰尚書是也王肅曰上所言史所書故曰尚書鄭氏云尚者上也尊而重之若天書然故曰尚書二家以尚與書相將則上名不正出於伏生鄭玄依書緯以尚字是孔子所加故書贊曰孔子乃尊而命之曰尚書璿璣鈐云因而謂之書加尚以尊之又曰書務以天言之鄭玄溺於書緯之説何有人言而須繫之於天乎且孔君親見伏生不容不悉自云伏生以其上古之書謂之尚書何云孔子加也王肅云上所言史所書則尚字與書俱有無先後既直云尚何以明上之所言書者以筆畫記之辭羣書皆是何知書要責史所為也此其不若前儒之説密耳云上古者亦無指定之目自伏生言之則於漢丗仰遵前代自周巳上皆是馬融云有虞氏為書之初耳若易歷三丗則伏犧為上古文王為中古孔子為下古禮運鄭玄以先王食腥與易上古結繩同時為上古神農為中古五帝為下古其不相對則無例耳且太之與上為義不異禮以唐虞為太古以下有三代冠而推之為然是為不定則但今丗巳上仰之巳古便為上古耳以書是夲名尚是伏生所加故諸引書直云書曰若有配代而言則曰夏書無言尚書者至魯至壞宅正義曰欲云得百篇之由故序其事漢景帝之子名餘封於魯為王死諡曰共存日以居於魯近孔子宅好治宫室故欲褒益乃壞孔子舊宅以增廣其居於所壞壁內得安國先人所藏古文虞夏商周之書及傳論語孝經皆是科斗文字王雖得此書猶壞不止又升孔子廟堂聞金鐘石磬絲琴竹管之音以懼其神異乃止不復敢壞宅也上言藏家書於屋壁此亦屋壁內得書也亦得及傳論語孝經等不從約云得尚書而煩文言虞夏商周之書者以壁內所得上有題目虞夏商周書其序直云書序皆無尚字故其目録亦然故不云尚書而言虞夏商周之書安國亦以此知尚字是伏生所加推此壁內所無則書夲無尚字明矣凡書非經則謂之傳言及傳論語孝經正謂論語孝經是傳也漢武帝謂東方朔云傳曰時然後言人不厭其言又漢東平王劉雲與其太師䇿書云傳曰陳力就列不能者止又成帝賜翟方進䇿書云傳曰髙而不危所以長守貴也是漢世通謂論語孝經為傳也以論語孝經非先王之書是孔子所傳説故謂之傳所以異於先王之書也上巳云壞孔子舊宅又云乃不壞宅者初王意欲壞之已壞其屋壁聞八音之聲乃止餘者不壞明知已壞者亦不敢居故云乃不壞宅耳悉以至能者正義曰既云王不壞宅以懼神靈因還其書巳前所得言悉以書還孔氐則上傳論語孝經等皆還之故言悉也科斗書古文也所謂蒼頡本體周所用之以今所不識是古人所為故名古文形多頭粗尾細狀腹團圎似水蟲之科斗故曰科斗也以古文經秦不用故云廢巳久矣時人無能知識者孔君以人無能知識之故已欲傳之故以所聞伏生之書比校起發考論古文之義考文而云義者以上下事義推考其文故云義也定其可知者就古文內定可知識者為隸古定不言就伏生之書而云以其所聞者明用伏生書外亦考之故云可知者謂并伏生書外有可知不徒伏生書內而巳言隸古者正謂就古文體而從隸定之存古為可慕以隸為可識故曰隸古以雖隸而猶古由此故謂孔君所傳為古文也古文者蒼頡舊體周丗所用之文字案班固漢志及許氏説文書本有六體一曰指事上下二曰象形日月三曰形聲江河四曰會意武信五曰轉注考老六曰假借令長此造字之本也自蒼頡以至今字體雖變此夲皆同古今不易也自蒼頡以至周宣皆蒼頡之體未聞其異宣王紀其史籕始有大篆十五篇號曰篆籕惟篆與蒼頡二體而巳衛恆曰蒼頡造書觀於鳥迹因而遂滋則謂之字字有六義其文至於三代不改及秦用篆書焚燒先代典籍古文絶矣許愼説文言自秦有八體一曰大篆二曰小篆三曰刻符四曰蟲書五曰摹印六曰署書七曰殳書八曰隸書亡新居攝以應制作改定古文使甄豐校定時有六書一曰古文孔子壁內書也二曰竒字即古字有異者三曰篆書即小篆下杜人程邈所作也四曰佐書秦隸書也五曰繆篆所以摹印也六曰鳥蟲書所以書幡信也由此而論即秦罷古文而有八體非古文矣以至亡新六書并八體亦用書之六體以造其字其亡新六書於秦八體用其小篆蟲書摹印隸書去其大篆刻符殳書署書而加以古文與竒字其刻符及署書蓋同摹印殳書同於繆篆大篆正古文之別以慕古故乃用古文與竒字而不用大篆也是孔子壁內古文即蒼頡之體故鄭玄云書初出屋壁皆周時象形文字今所謂科斗書以形言之為科斗指體即周之古文鄭玄知者若於周時秦丗所有至漢猶當識之不得云無能知者又亡新古文亦云即孔氏壁內古文是其證也或以古文即大篆非也何者八體六書自大篆與古文不同又秦有大篆若大篆是古文不得云古文遂絶以此知大篆非古文也六書古文與蟲書本別則蟲書非科斗書也鄭玄云周之象形文字者揔指六書象科斗之形不謂六書之內一曰象形也又云更以竹簡寫之明留其壁內之夲也顧氏云䇿長二尺四寸簡長一尺二寸增多伏生二十五篇者以壁內古文篇題殊別故知以舜典合於堯典益稷合於皋陶謨伏生之夲亦壁內古文而合者蓋以老而口受之時因誦而連之故殊耳其盤庚本當同卷故有并也康王之誥以一時之事連誦而同卷當以王出在應門之內為篇首及以王若曰庶邦亦誤矣以伏生夲二十八篇盤庚出二篇加舜典益稷康王之誥凡五篇為三十三篇加所增二十五篇為五十八加序一篇為五十九故云復出此篇并序凡五十九篇此云為四十六卷者謂除序也下云定五十八篇既畢不更云卷數明四十六卷故爾又伏生二十九卷而序在外故知然矣此云四十六卷者不見安國明説蓋以同序者同卷異序者異卷故五十八篇為四十六卷何者五十八篇內有太甲盤庚説命泰誓皆三篇共卷減其八又大禹謨皋陶謨益稷又三篇同序共卷其康誥酒誥梓材亦三篇同序共卷則又減四通前十二以五十八減十二非四十六卷如何其康王之誥乃與顧命別卷以别序故也其餘錯亂摩滅五十八篇外四十二篇也以不可復知亦上送官其可知者巳用竹簡寫得其本亦俱送入府故在祕府得有古文也以後生可畏或賢聖間出故須藏之以待能整理讀之者承詔至將來正義曰安國時為武帝博士孔君考正古文之曰帝之所知亦既定訖當以聞於帝帝令注解故云承詔為五十九篇作傳以注者多言曰傳傳者傳通故也以傳名出自丘明賔牟賈對孔子曰史失其傳又喪服儒者皆云子夏作傳是傳名久矣但大率秦漢之際多名為傳於後儒者以其傳多或有改之別云注解者仍有同者以當時之意耳説者為例云前漢稱傳於後皆稱注誤矣何者馬融王肅亦稱注名為傳傳何有例乎以聖道弘深當須詳悉於是研核精審覃靜思慮以求其理兾免乖違既顧察經文又取證於外故須廣博推考羣經六籍文捃拾採托羣書之言以此文證造立訓解為之作傳明不率爾雖復廣證亦不煩多為傳直約省文令得申盡其美明文要義通不遐煩多也以此得申故能遍布通暢書之旨意是辭達而巳不求於煩既義暢而文要則觀者曉悟故云庶幾有所輔益於將來讀之者得悟而有益也敷布也厥其也庶幸也幾兾也爾雅有訓既云經籍又稱羣言者經籍五經是也羣言子史是也以書與經籍理相因通故云博考子史時有所須故云採托耳案孔君此傳辭旨不多是約文也要文無不解是申義也其義既中故云敷暢其義之旨趣耳考其此注不但言少書之為言多須詁訓而孔君為例一訓之後重訓者少此亦約文也書序至不隱也正義曰孔君既言巳立傅之意又當斟酌所冝而書序雖名為序不是揔陳書意泛論乃篇篇各序作意但作序者不敢廁於正經故謙而聚於下而注述者不可代作者之謙須從利益而欲分之從便云序序所以當篇為作此書之意則是當篇作意觀序而昭然意義顯見既義見由序此序冝各與其本篇相從附近不冝聚於一處故每篇引而分之各冠加於篇首人意昭見序既分散損其一篇故定五十八篇然此本承詔而作作畢當以上奏聞知但會值國家有巫蠱之事好愛經籍之道滅息假奏亦不能行用為此之故不復以此傳奏聞亦以既傳成不得聞上惟自傳於已之子孫以遺與後世之人使行之亦不敢望後丗必行故云石後丗有好愛古道廣博學問志懷雅正如此之君子兾能與我同於慕古之志以行我道我道得此人流行亦所以傳不隱蔽是弘道由人也言巫蠱者王制曰執左道以亂政殺鄭玄注云左道謂巫蠱之屬以非正道故謂之左道以蠱皆巫之所行故云巫蠱蠱者揔名左傳云惑蠱其君則蠱者怪惑之名指體則藥毒害人者是若行符猒俗之為魅令人蠱惑夭年傷性皆是也依漢書此時武帝末年上巳年老淫惑鬼神崇信巫術由此姦人江充因而行詐先於太子宫埋桐人告上云太子宫有蠱氣上信之使江充治之於太子宫果得桐人太子知己不為此以江充故為陷己因而殺之而帝不知太子實心謂江充言為實即詔丞相劉屈釐發三輔兵討之太子赦長安因與鬪不勝而出走奔湖關自殺此即巫蠱事也言不隱者不謂恐隱藏已道以已道人所不知懼其幽隱人能行之使顯為不隱蔽耳易曰謙謙君子仁者好謙而孔君自作揄揚云君子知己者亦意在教丗欲令人覩此言知已傳是深逺因而有所曉痦令之有益故不可以苟謙也亦猶孔子曰何有於我哉尚書正義卷第一計一萬三千一百八十六字
