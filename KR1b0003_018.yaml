front:
  text: 禮文皆伯尊於牧牧主一州明伯是中分天下者也禮言職方是各主一方也此二伯即以三公為之隱五年公羊傳云諸公者何天子三公天子三公者何天子之相也天子之相何以三自陜而東者周公主之自陜而西者召公主之一相處乎內是言三公為二伯也公羊傳漢丗之書陜縣者漢之弘農郡所治其地居二京之中故以為二伯分掌之界周之所分亦當然也公羊傳所言周召分主謂成王即位之初此時周公巳薨故畢公代之周官篇三公之次太師太傅太保太保最在下此篇以召公為先者三公命數尊卑同也王就其中委任賢者任之重者則在前耳傳臨終至顧命正義曰説文云顧還視也鄭玄云回首曰顧顧是將去之意此言臨終之命曰顧命言臨將死去回顧而為語也顧命正義曰發首至百尹御事敘王以病召臣為發言之端自王曰至冒貢于非幾是顧命之辭也茲既受命至立于側階言命後王崩欲宣王命布陳儀衛之事也自王麻冕巳下敘康王受命之事傳實命至要言正義曰王之所命實普命羣臣序以要約為言直云命召公畢公傳不於上召公畢公之下而解於顧命之下言之者以上欲指明二公中分天下之事非是揔語故命不得言之顧命是揔命羣臣非但召畢而巳故於此解也傳成王至恱懌正義曰成王崩年經典不載漢書律曆志云成王即位三十年四月庚戍朔十五日甲子哉生魄即引此顧命之文以為成王即位三十年而崩此是劉歆説也孔以甲子為十六日則不得與歆同矣鄭玄云此成王二十八年傳惟言成王崩年未知成王即位幾年崩也志又云死魄朔也生魄望也明死魄生從望為始故始生魄為月十六日即是望之日也釋詁云懌樂也有疾故不恱懌下云病日臻既彌留則成王遇疾巳多日矣於哉生魄下始言王不懌者甲子是發命之日為洮頮張本耳傳王將至出命正義曰凡有敬事皆當潔淸王將發大命臨羣臣必齋戒沐浴今以病疾之故不能沐浴故但洮頮而巳禮洗手謂之盥洗面謂之靧內則云子事父母面垢燂潘請靧頮是洗面知洮為盥手言水謂洮盥俱用水扶相王者以冕服加王鄭玄云相者正王服位之臣謂太僕或當然也被以冠冕以冕服被玉首也加朝服以服加王身也謂以衮冕朝諸侯之服加王身也鄭以為玄冕知不然者以顧命羣臣大發大命以文武之業傳社稷之重不應惟服玄冕而巳覲禮王服衮冕而有玉几此既憑玉几明服衮冕也周禮司几筵云凡大朝覲王位設黼扆扆前南向設左右玉几是王見羣臣當憑玉几以出命傳同召至公卿正義曰下及御事蒙此同召之文故云同召六卿下及御事也以王病甚故同時俱召之太保是三公官名畢毛又亦稱公知此三人是三公也三人是三公而與侯伯相次知六者是六卿衛侯為司寇而位第五知此先後是六卿次第也以三公尊故特言公其餘三卿舉其本爵見其以國君入為卿也天子三公皆以卿為之不復別置其人髙官兼攝下司者漢丗以來謂之為領故言召公領之毛公領之定四年左傳云康叔為司寇知此六人依周禮次第為六卿也王肅云彤姒姓之國其餘五國姬姓畢毛文王庶子衛侯康叔所封武王母弟依丗本史記為説也傳師氏至事者正義曰周禮師氏中大夫掌以美詔王居虎門之左司王朝得失之事帥其屬守王之門重其所掌故與虎臣並於百尹之上特言之尹訓正也故百尹為百官之長諸御治事謂諸掌事者蓋大夫皆被召也王肅云治事蓋羣士也王曰至非幾正義曰王召羣臣既集乃言而歎曰嗚呼我疾大進益重惟危殆矣病日日益至言病困巳甚病既久留於我身恐一旦暴死不得結誓出言語以繼續我志以此故我今詳審教訓命誥汝等昔先君文王武王布其重光纍聖之德安定天命施陳教誨則勤勞矣文武定命陳教雖勞而不違於道用能通殷為周成其大命代殷為主至文武後之侗稚成王自謂已也言已常敬迎天之威命終當奉順天道繼守文武大教無敢昏亂逾越言常戰栗畏懼恐墜文武之業今天降疾於我身甚危殆矣不能更起不復覺悟言巳必死汝等庶幾明是我言勿忽略之用我之語敬安太子釗大渡於艱難言當安和逺人又須能和近人當為善政逺近俱安之又當安勸小大衆國於彼小大衆國皆安之勸之安之使國得安存勸之使相勸為善汝羣臣等思夫人夫人衆國各自治正於威儀有威有儀然後可以率人無威無儀則民不從命戒使愼威儀也汝無以釗冒進於非事危事欲令戒其不為惡也傳病日至命汝正義曰病日至者言日日益至遍於身體困甚也巳久留者言病來多日無瘳愈也恐死不得結信出言嗣續我志志欲有言若不能言則不得續志以此及今能言故我詳審出言教命汝言巳詳審欲其敬聽之傳今天至忽略正義曰孔讀殆上屬為句今天下疾我身甚危殆也不起言身不能起不悟言心不能覺悟病者形弱神亂不起不悟言必死也兹既至宅宗正義曰此羣臣既受王命還復本位出連綴之衣王所坐幄帳置之於庭於其明日乙丑王崩矣太保召公命仲桓南宫毛使此二人於齊侯吕伋之所以二干戈桓毛各執其一又取虎賁之士百人迎太子釗於南門之外逆此太子使入於路寢明室今太子在室當喪憂居為天下宗主正其將王之位以繫羣臣之心也傳此羣至本位正義曰周禮射人掌國之三公孤卿大夫之位三公北面孤東面卿大夫西面鄭玄云不言士者此與諸侯之賔射士不與也凡朝燕及射臣見於君之禮同鄭知然者以周禮司士掌治朝之位與射人同是天子之朝位與射禮位同案燕禮小臣納卿大夫卿大夫皆北面公命爾卿東方西面爾大夫少進皆北面大射禮其位亦然是諸侯燕位與射位同故云朝燕及射臣見於君之禮同但天子臣多故三公北面孤東面卿大夫西面諸侯臣少故卿西面大夫北面其士與天子同皆門內西方東靣其入門當立定位如此及王呼與言必各自前進巳受顧命退還本位者謂還本治事之位故孔下傳云朝臣就次謂退王庭而還治事之處傳綴衣至王崩正義曰綴衣者連綴衣物出之於庭則是從內而出下云狄設黼扆綴衣則綴衣是黼扆之類黼扆是王坐立之處知綴衣是施張於王坐之上故以為幄帳也周禮幕人掌帷幕幄帟綬之事鄭玄云在旁曰帷在上曰幕帷幕皆以布為之四合象宫室曰幄王所居之帳也帟王在幕若幄中坐上承塵也幄帟皆以繒為之然則幄帳是黼扆之上所張之物此言出綴衣於庭則亦并出黼扆故下句云象王平生之時更復設之王發顧命在此黼扆幄帳之坐命訖乃復反於寢處以王病重不復能臨此坐故徹出幄帳於庭將欲為死備也傳更解徹去幄帳之意以王病困寢不在此喪大記云疾病君大夫徹懸士去琴瑟寢東首於北墉下廢牀鄭玄云廢去也人始生在地去牀庶其生氣反也記言君大夫士則尊卑皆然故知此時王亦寢於北墉下東首反初生也傳臣子至賁氏正義曰天子初崩太子必在其側解其迎於門外之意於時臣子皆侍左右將正太子之尊故使太子出於路寢門外更迎入所以殊之也經言以二干戈文在齊侯吕伋下似就齊侯取干戈傳言使桓毛二臣各執干戈於齊侯吕伋索虎賁則是執干戈就齊侯傳似反於經者於時新遭大禍內外嚴戒桓毛二人必是武臣宿衛先執干戈太保就命使之就干戈以往傳達其意故移干戈之文於齊侯之上傳言是實也經言於齊侯吕伋下言以二干戈虎賁百人者指説迎太子之時有此備衛耳非言二人干戈亦是齊侯授也周禮虎賁氏下大夫其屬有虎士八百人知伋為天子虎賁氏故就伋取虎賁也傳明室至宗主正義曰釋言云翼明也喪大記云君夫人卒於路寢以諸侯薨於路寢知天子亦崩於路寢今延太子入室必延入喪所知翼室是明室謂路寢也路寢之大者故以明言之延之使憂居喪主為天下宗主也傳三日至康王正義曰周禮囚史掌䇿命故命內史為䇿書也經不言命史史是常職不假言之王之將崩雖口有遺命未作䇿書故於此日作之既作䇿書因作受䇿法度下云曰皇后憑玉几宣成王言是䇿書也將受命時升階即位及傳命巳後康王答命受同祭饗皆是法度越七日癸酉正義曰自此以下至立于側階惟命士須材是擬供喪用其餘皆是將欲傳命布設之事四坐王之所處者器物國之所寶者車輅王之所乘者陳之所以華國且以示重顧命其執兵器立於門內堂階者所以備不虞亦為國家之威儀也傳𨝍伯至喪用正義曰成王既崩事皆聽於冢宰自非召公無由發命知伯相即召公也王肅云召公為二伯相王室故曰伯相上言太保命仲桓此改言伯相者於此所命事多非是國相不得大命諸侯故改言伯相以見政皆在焉於丁卯七日癸酉則王乙丑崩於今巳九日矣於九日始傳顧命不知其所由也鄭玄云癸酉蓋大斂之明日也鄭以大夫巳上殯斂皆以死之來日數天子七日而殯於死日為八日故以癸酉為殯之明日孔不為傳不必如鄭説也須訓待也今所命者皆為喪事知命士須材者召公命士致材木須待以供喪用謂椁與明器是喪之雜用也案士喪禮將葬筮宅之後始作椁及明器此既殯即須材木者以天子禮大當須預營之故禮記云虞人致百祀之木可為棺椁者斬之是與士禮不同顧氏亦云命士供葬椁之材傳狄下至所為正義曰禮記祭統云狄者樂吏之賤者也是賤官有名為狄者故以狄為下士喪大記復魄之禮云狄人設階是喪事使狄與此同也釋宫云牖戶之間謂之扆李巡曰謂牖之東戶之西為扆郭璞曰窗東戶西也禮云斧扆者以其所在處名之郭璞又云禮有斧扆形如屏風畫為斧文置於扆地因名為扆是先儒相傳黼扆者屏風畫為斧文在於戶牖之間考丁記云畫繢之事白與黑謂之黼是用白黑畫屏風置之於扆地故名此物為黼扆上文言出綴衣於庭此復設黼扆帷幄帳者象王平生時所為也經於四坐之上言設黼扆綴衣則四坐皆設之此經所云狄設亦是伯相命狄使設之不言命者上云命士此蒙命文設四坐及陳寶玉兵器與輅車各有所司皆是相命不言所命之人從上省文也牖間至漆仍几正義曰牖謂窗也間者窗東戶西戶牖之間也周禮司几筵云凡大朝覲大饗射凡封國命諸侯王位設黼扆扆前南向設莞筵紛純加繅席畫純加次席黼純左右玉几彼所設者即此坐也又云戶牖之間謂之扆彼言扆前此言牖間即一坐也彼言次席黼純此言篾席黼純亦一物也周禮天子之席三重諸侯之席再重則此四坐所言敷重席者其席皆敷三重舉其上席而言重知其下更有席也此牖間之坐即是周禮扆前之坐篾席之下二重其次是繅席畫純其下是莞筵紛純也此一坐有周禮可據知其下二席必然下文三坐禮無其事以扆前一坐敷三種之席知下三坐必非一種之席敷三重伹不知其下二重是何席耳周禮天子左右几諸侯惟右几此言仍几則四坐皆左右几也鄭玄云左右有几優至尊也傳篾桃至之坐正義曰此篾席與周禮次席一也鄭注彼云次席桃枝席有次列成文鄭玄不見孔傳亦言是桃枝席則此席用桃枝之竹必相傳有舊説也鄭注此下則云篾析竹之次靑者王肅云蔑席纎蒻蘋席並不知其所據也考工記云白與黑謂之黼釋器云緣謂之純知黼純是白黑雜繒緣之蓋以白繒黑繒錯雜彩以緣之鄭玄注周禮云斧謂之黼其繡白黑彩也以絳帛為質其意以白黑之線縫刺為黼文以緣席其事或當然也華是彩之別名故以為彩色用華玉以飾憑几也鄭玄云華玉五色玉也仍因也釋詁文周禮云凡吉事變几凶事仍几禮之於几有變有仍故特言仍几以見因生時几不改作也此見羣臣覲諸侯之坐周禮之文知之又覲禮天子待諸侯設斧扆於戶牖之間左右几天子衮冕負斧扆彼在廟此在寢為異其牖間之坐則同傳東西至之坐正義曰東西廂謂之序釋宫文孫炎曰堂東西牆所以別序內外也禮注謂蒲席為蒻蘋孔以底席為蒻蘋當謂蒲為蒲蒻之席也史遊急就篇云蒲蒻藺席蒲蒻謂此也王肅云砥席靑蒲席也鄭玄云砥致也篾纎致席也鄭謂此砥席亦竹席也凡此重席非有明文可據各自以意説耳綴者連綴諸色席必以彩為緣故以綴為雜彩也貝者水蟲取其甲以飾器物釋魚於貝之下云餘蚳黃白文餘泉白黃文李巡曰貝甲以黃為質白為文彩名為餘蚳貝甲以白為質黃為文彩名為餘泉有文之貝飾几謂用此餘蚳餘泉之貝飾几也此旦夕聽事之坐鄭王亦以為然牖間是見羣臣覲諸侯之坐見於周禮其東序西嚮養國老饗羣臣之坐者案燕禮云坐於阼階上西嚮則養國老及饗與燕禮同其西序之坐在燕饗坐前以其旦夕聽事重於燕飲故西序為旦夕聽事之坐夾室之坐在燕饗坐後又夾室是隱映之處又親屬輕於燕饗故夾室為親屬私宴之坐案朝士職掌治朝之位王南面此西序東嚮者以此諸坐並陳避牖間南嚮覲諸侯之坐故也王肅説四坐皆與孔同傳豐莞至之坐正義曰釋草云莞苻蘺郭璞曰今西方人呼蒲為莞用之為席也又云􅤴鼠莞樊光曰詩云下莞上簟郭璞曰似莞而纎細今蜀中所出莞席是也王肅亦云豐席莞鄭玄云豐席刮凍竹席考工記云畫繢之事雜五色是彩色為畫蓋以五彩色畫帛以為緣鄭玄云似雲氣畫之為緣釋器云玉謂之雕金謂之鏤木謂之刻是雕為刻鏤之類故以刻鏤解雕蓋雜以金玉刻鏤為飾也傳西廂至質飾正義曰下傳云西房西夾坐東東房東廂夾室然則房與夾室實同而異名天子之室有左右房房即室也以其夾中央之太室故謂之夾室此坐在西廂夾室之前故繫夾室言之釋草云筍竹萌孫炎曰竹初萌生謂之筍是筍為蒻竹取筍竹之皮以為席也紛則組之小別鄭玄周禮注云紛如綬有文而狹者也然則紛綬一物小大異名故傳以玄紛為黑綬鄭於此注云以玄組為之緣周禮大宗伯云以飲食之禮親宗族兄弟鄭玄云親者使之相親人君有食宗族飲酒之禮所以親之也文王丗子云族食丗降一等是天子有與親屬私宴之事以骨肉情親不事華麗故席几質飾也傳於東至器物正義曰此經為下揔目下復分別言之越訓於也於者於其處所上云西序東嚮東序西嚮則序旁巳有王之坐矣下句陳玉復云在西序在東序者明於東西序坐北也序者牆之別名其牆南北長坐北猶有序牆故言在西序在東序也西序二重東序三重二序共為列玉五重又陳老王所寶之器物河圖大訓貝鼓戈弓皆是先王之寶器也傳寶刀至二重正義曰上言陳寶非寶則不得陳之故知赤刀為寶刀也謂之赤刀者其刀必有赤處刀一名削故名赤刃削也禮記少儀記執物授人之儀云刀授穎削授拊鄭玄云避用時也穎鐶也拊謂把也然則刀施鐶削用把削似小於刀相對為異散文則通故傳以赤刀為赤刃削吳録稱吳人嚴白虎聚衆反遣弟興治孫䇿䇿引白削斫虎興體動曰我見刃為然然則赤刃為赤削白刃為白削是削為刀之別名明矣周禮考工記云築氏為削合六而成規鄭注云曲刃刀也又云赤刀者武王誅紂時刀赤為飾周正色不知其言何所出也大訓虞書典謨王肅亦以為然鄭云大訓謂禮法先王德教皆是以意言耳弘訓大也大璧琬琰之圭為二重則琬琰共為一重周禮典瑞云琬圭以治德琰圭以易行則琬琰別玉而共為重者蓋以其玉形質同故不別為重也考工記琬圭琰圭皆九寸鄭玄云大璧大琬大琰皆度尺二寸者孔既不分為二重亦不知何所據也傳三玉至寶之正義曰三玉為三重與上共為五重也夷常釋詁文禹貢雍州所貢球琳琅玕知球是雍州所貢也常玉天球傳不解常天之義未審孔意如何王肅云夷玉東夷之美玉天球玉磬也亦不解稱天之意鄭玄云大玉華山之球也夷玉東北之珣玕琪也天球雍州所貢之玉色如天者皆璞未見琢治故不以禮器名之釋地云東方之美者有醫無閭之珣玗琪焉東方實有此玉鄭以夷玉為彼玉未知經意為然否河圖八卦是伏犧氏王天下龍馬出河遂則其文以畫八卦謂之河圖當孔之時必有書為此説也漢書五行志劉歆以為伏犧氏繼天而王受河圖則而畫之八卦是也劉歆亦如孔説是必有書明矣易繫辭云古者包犧氏之王天下也仰則觀象於天俯則觀法於地觀鳥獸之文與地之冝近取諸身逺取諸物於是始作八卦都不言法河圖也而此傳言河圖者蓋易理寬弘無所不法直如繫辭之言所法已自多矣亦何妨更法河圖也且繫辭又云河出圖洛出書聖人則之若八卦不則河圖餘復何所則也王肅亦云河圖八卦也璧玉人之所貴是為可寶之物八卦典謨非金玉之類嫌其非寶故云河圖及典謨皆歷代傳寶之此西序東序各陳四物皆是臨時處置未必別有他義下二房各有二物亦應無別意也傳胤國至坐東正義曰以夏有胤侯知胤是國名也胤是前代之國舞衣至今猶在明其所為中法故常寶之亦不知舞者之衣是何衣也大貝必大於餘貝伏生書傳云散冝生之江淮取大貝如大車之渠是言大小如車渠也考工記謂車罔為渠大小如車罔其貝形曲如車罔故比之也考工記云鼓長八尺謂之鼖鼓釋樂云大鼓謂之鼖此鼓必有所異周興至此未久當是先代之器故云商周傳寶之西序即是西夾西夾之前巳有南向坐矣西序亦陳之寶近在此坐之西知此在西房者在西夾坐東也傳兊和至夾室正義曰戈弓竹矢巧人所作垂是巧人知兊和亦占之巧人也垂舜共工舜典文若不中法即不足可寶知所為皆中法故亦傳寶之垂是舜之共二竹矢蓋舜時之物其兊和之所作則不知寶來幾何丗也故皆言傳寶之耳東夾室無坐故直言東廂夾室陳於夾室之前也案鄭注周禮宗廟路寢制如明堂明堂則五室此路寢得有東房西房者鄭志張逸以此問鄭鄭答云成王崩在鎬京鎬京宫室因文武更不改作故同諸侯之制有左右房也孔無明説或與鄭異路寢之制不必同明堂也傳大輅至南向正義曰周禮巾車掌王之五輅玉輅金輅象輅革輅木輅是為五輅也此經所陳四輅必是周禮五輅之四大輅輅之最大故知大輅玉輅也綴輅繫綴於下必是玉輅之次故為金輅也面前者據人在堂上面向南方知面前皆南向謂轅向南也地道尊右故玉輅在西金輅在東傳先輅至顧命正義曰此經四輅兩兩相配上言大輅綴輅此言先輅次輅二者各自以前後為文五輅金即次之故言先輅象其木輅在象輅之下故云次輅木也又解四輅之名金玉象皆以飾車三者以飾為之名木則無飾故指木為名耳鄭玄周禮注云革輅鞔之以革而漆之木輅不鞔以革漆之而巳以直漆其木故以木為名木輅之上猶有革輅不以次輅為革輅者禮五輅而此四輅於五之內必將少一蓋以革輅是兵戎之用於此不必陳之故不云革輅而以木輅為次馬融王肅皆云不陳戎輅者兵事非常故不陳之孔意或當然也鄭玄以綴次是從後之言二者皆為副二之車先輅是金輅也綴輅是玉輅之二次輅是金輅之二不陳象輅革輅木輅者主於朝祀而巳未知孔鄭誰得經旨成王殯在路寢下云二人執惠立于畢門之內畢門是路寢之門知此陳設車輅皆在路寢門內也釋宫云門側之堂謂之孰孫炎曰夾門堂也孰前陳車必以轅向堂故知左右孰前皆北面也左墩者謂門內之西右孰者門內之東故以北面言之為左右所陳坐位器物皆以西為上由王殯在西序故也其執兵宿衛之人則先東而後西者以王在東宿衛敬新王故也顧氏云先輅在左孰之前在寢門內之西北面對玉輅次輅在右孰之前在寢門內之東對金輅也凡所陳列自狄設黼扆巳下至此皆象成王生時華國之事所以重顧命也鄭玄亦云陳寶者方有大事以華國也周禮典路云若有大祭祀則出路大喪大賔客亦如之是大喪出輅為常禮也二人至側階正義曰禮大夫服冕士服辨也此所執者凡有七兵立於畢門之內及夾兩階立堂下者服雀辨綦辨者皆士也以其去殯逺故使士為之其在堂上服冕者皆大夫也以其去殯近皆使大夫為之先門次階次堂從外向內而敘之也次東西垂次側階又從近向逺而敘之也在門者兩守門兩廂各一人故二人在階者兩廂各二人故四人禮記明堂位三公在中階之前考工記夏后氏丗室九階鄭玄云南面三三面各二鄭玄又云宗廟及路寢制如明堂則路寢南面亦當有三階矣此惟四人夾兩階不守中階者路寢制如明堂惟鄭玄之説耳路寢三階不書亦未有明文縱有中階中階無人升降不須以兵衛之傳士衛至畢門正義曰士入廟助祭乃服雀辨於此服雀辨者士衛王殯與在廟同故雀韋辨也鄭玄云赤黑曰雀言如雀頭色也雀辨制如冕黑色伹無藻耳然則雀辨所用當與冕同阮諶三禮圖云雀辨以三十升布為之此傳言雀韋辨者蓋以周禮司服云凡兵事韋辨服此人執兵冝以韋為之異於祭服故言雀韋辨下云綦辨孔言鹿子皮為辨然則下言冕執兵者不可以韋為冕未知孔意如何天子五門皋庫雉應路也下云王出在應門之內出畢門始至應門之內知畢門即是路寢之門一名畢門也此經所陳七種之兵惟戈經傳多言之考工記有其形制其餘皆無文傳惟言惠三隅矛鋭亦矛也戣瞿皆戟屬不知何所據也劉鉞屬者以劉與鉞相對故言屬以似之而別又不知何以為異古今兵器名異體殊此等形制皆不可得而知也鄭玄云惠狀蓋斜刃冝芟刈戈即今之句孑戟劉蓋今鑱斧鉞大斧戣瞿蓋今三鋒矛鋭矛屬凡此七兵或施矜或著柄周禮戈長六尺六寸其餘未聞長短之數王肅惟云皆兵器之名也傳綦文至立處正義曰鄭玄云靑黑曰綦王肅云綦赤黑色孔以為綦文鹿子皮辨各以意言無正文也大夫則服冕此服辨知亦士也堂廉曰戺相傳為然廉者稜也所立在堂下近於堂稜傳冕皆至前堂正義曰周禮司服云大夫之服自玄冕而下知服冕者皆大夫也鄭玄云序內半以前曰堂謂序內簷下自室壁至於堂廉中半以前揔名為堂此立於東堂西堂者當在東西廂近階而立以備升階之人也傳戣瞿至階上正義曰釋詁云疆界邊衛圉垂也則垂是逺外之名此經所言冕則在堂上辨則在堂下此二人服冕知在堂上也堂上而言東垂西垂知在堂上之逺地堂之逺地當於序外東廂西廂必有階上堂知此立於東西堂之階上也傳鋭矛至階上正義曰鄭王皆以側階為東下階也然立于東垂者巳在東下階上何由此人復共並立故傳以為北下階上謂堂北階北階則惟堂北一階而已側猶特也王麻至册命正義曰此將傳顧命布設位次即上所作法度也凡諸行禮皆賤者先置此必卿下士邦君即位既定然後王始升階但以君臣之序先言王服困服之下即言升階從省文卿士邦君無所執事故直言即位而已太保太史太宗皆執事之人故別言衣服各有所職不得即言升階故別言所執各從升階為文次也卿士王臣故先於邦君太史乃是太宗之屬而先於太宗者太史之職掌册書此禮主以為册命太史所掌事重故先言之傳王及至當主正義曰禮績麻三十升以為冕故稱麻冕傳嫌麻非吉服故言王及羣臣皆吉服也王麻冕者蓋衮冕也周禮司服享先王則衮冕此禮授王册命進酒祭王且衮是王之上服於此正王之尊明其服必衮冕也其卿士邦君當各以命服服即助祭之冕矣衮鄭玄周禮注云衮之衣五章裳四章則衮衣之裳非獨有黼言黼裳者以裳之章色黼黻有文故特取為文詩采菽之篇言王賜諸侯云玄衮及黼以黼有文故特言之鄭玄於此注云黼裳者冕服有文者也是言貴文故稱之禮君升阼階此用西階升者以未受顧命不敢當主也傳公卿至色玄正義曰卿士卿之有事者公則卿兼之此行大禮大夫亦與焉略舉卿士為文公與大夫必在故傳言公卿大夫及諸侯皆同服言同服吉服此亦廟中之禮也言其如助祭各服其冕服也禮無蟻裳今云蟻者裳之名也蟻者蚍蜉蟲也此蟲色黑知蟻裳色玄以色玄如蟻故以蟻名之禮祭服皆玄衣纁裳此獨云玄裳者卿士邦君於此無事不可全與祭同改其裳以示變於常也太保太史有所主者則純如祭服暫從吉也入即位者鄭玄云卿西面諸侯北面鄭玄惟據經卿士邦君言之其公亦北面孤東面也傳執事至宗伯正義曰此三官者皆執事俱彤裳而言各異裳者各自異於卿士邦君也彤赤也禮祭服纁裳纁是赤色之淺者故以彤為纁言是常祭服也太宗與下文上宗一人即宗伯之卿也傳大圭至不嫌正義曰考工記玉人云鎮圭尺有二寸天子守之鎮圭圭之大者介訓大也故知是彼鎮圭天子之所守故奉之以奠康王所位以明正位為天子也禮又有大圭長三尺知介圭非彼三尺圭者典瑞云王搢大圭執鎮圭以朝日玉人云大圭長三尺天子服之彼搢於紳帶是天子之笏不是天子所守故知非彼三尺之大圭也上宗奉同瑁則下文云天子受同瑁太保必奠於位其奉介圭下文不言受介圭者以同瑁并在手中故不得執之太保必奠於其位但文不見耳禮於奠爵無名同者但下文祭酢皆用同奉酒知同是酒爵之名也玉人云天子執冒四寸以朝諸侯鄭玄注云名玉曰冒者言德能覆蓋天下也四寸者方以尊接卑以小為貴禮天子所以執瑁者諸侯即位天子賜之以命圭圭頭邪鋭其瑁當下邪刻之其刻闊狹長短如圭頭諸侯來朝執圭以授天子天子以冒之刻處瑁彼圭頭若大小相當則是本所賜其或不同則圭是偽作知諸侯信與不信故天子執瑁所以冒諸侯之圭以齊瑞信猶今之合符然經傳惟言圭之長短不言闊狹瑁方四寸容彼圭頭則圭頭之闊無四寸也天子以一瑁冒天下之圭則公侯伯之圭闊狹等也此瑁惟冒圭耳不得冒璧璧亦稱瑞不知所以齊信未得而聞之也阼階者東階也謂之阼者鄭玄士冠禮注云阼猶酢也東階所以答酢賔客是其義也禮凶事設洗於西階西南吉事設洗於東階東南此太保上宗皆行吉事盥洗在東故用阼階升由便以卑不嫌為主人也鄭玄云上宗猶太宗變其文者宗伯之長太宗伯一人與小宗伯二人凡三人使其上二人也一人奉同一人奉瑁傳無明解當同於鄭也傳太史至同階正義曰訓御為進太史持䇿書顧命欲以進王故與王同升西階鄭玄云御猶嚮也王此時王立賔階上少東太史東面於殯西南而讀策書以命王嗣位之事孔雖以御為進其意當如鄭言不言王面北可知也篇以顧命為名指上文為言顧命䇿書稟王之意為言亦是顧命之事故傳言䇿書顧命曰皇至光訓正義曰此即丁卯命作之册書也誥康王曰大君成王病困之時憑玉几所道稱揚將終之教命命汝繼嗣其道代為民主用是道以臨君周邦率羣臣循大法用和道和天下用對揚聖祖文武之大教敘成王之意言成王命汝如此也傳册命至託戒正義曰言憑玉几所道以示不憑玉几則不能言所以感動康王令其哀而聽之不敢忽也以訓為道命汝繼嗣其道繼父道為天下之主言所任者重因以託戒也傳用是至大法正義曰卞之為法無正訓也告以為法之道令率羣臣循之明所循者法也故以大卞為大法王肅亦同也乃受至降收正義曰王受册命之時立於西階上少東北面太史於柩西南東面讀䇿書讀册既訖王再拜上宗於王西南北面奉同瑁以授王王一手受同一手受瑁王又以瑁授宗人王乃執同就樽於兩楹之間酌酒乃於殯東西面立三進於神坐前祭神如前祭凡前祭酒酹地而奠爵訖復位再拜王又於樽所別以同酌酒祭神如前復三祭故云三宿三祭三吒然後酌福酒以授王上宗讃王曰饗福酒王再拜受酒跪而祭先嚌至齒興再拜太保受同降自東階反於篚又盥以異同執璋升自東階適樽所酌酒至殯東西面報祭之欲祭之時授宗人同拜白王柩云巳傳顧命訖王則答拜拜柩尊所受命太保乃於宗人處受同祭柩如王禮但一祭而巳祭訖乃受福祝酌同以授太保宗人讃太保曰饗福酒太保再拜受同亦祭先而嚌至齒興再拜訖於所居位授宗人同太保更拜白柩以事畢王又答拜拜柩敬所白王與太保降階而下堂有司於是收徹器物傳王受至顧命正義曰天子執瑁故受瑁為主同是酒器故受同以祭鄭玄云王既對神則一手受同一手受瑁然既受之後王受同而祭則瑁以授人禮成於三酌者實三爵於王當是實三爵而續送三祭各用一同非一同而三反也釋詁云肅進也宿即肅也故以宿爵而續送祭各用一同為一進三宿謂三進爵從立處而三進至神所也三祭酒三酹酒於神坐也每一酹酒則一奠爵三奠爵於地也為此祭者告神言己己受羣臣所傳顧命白神使知也經典無此吒字吒為奠爵傳記無文正以既祭必當奠爵既言三祭知三宅為三奠爵也王肅亦以吒為奠爵鄭玄云徐行前曰肅却行曰吒王徐行前三祭又三却復本位與孔異也傳祭必至福酒正義曰禮於祭末必飲神之酒受神之福其大祭則有受嘏之福禮特牲少牢主人受嘏福是受神之福也其告祭小祀則不得備儀直飲酒而巳此非大祭故於王三奠爵訖上宗以同酌酒進王讃王曰饗福酒也王取同嚌之乃以同授太保也傳受王至於篚正義曰上宗讃王以饗福酒也即云太保受同明是受王所饗同也祭祀飲酒之禮爵未用皆實於篚既飲皆反於篚知此下堂反於篚也傳太保至曰酢正義曰祭祀以變為敬不可即用王同故太保以盥手更洗異同實酒於同中乃秉璋以酢祭於王祭後更復報祭猶如正祭大禮之亞獻也周禮典瑞云四圭有邸以祀天兩圭有邸以祀地圭璧以祀日月璋邸射以祀山川從上而下遞減其半知半圭曰璋祭統云君執圭瓉太宗執璋瓉謂亞獻用璋瓉此非正祭亦是亞獻之類故亦執璋若助祭公侯伯子男自得執圭璧也秉璋以酢是報祭之事王巳祭太保又報祭也酢訓報也故報祭曰酢飲酒之禮稱獻酢者亦是報之義也傳宗人至受命正義曰上宗為大宗伯知宗人為小宗伯也太保所以拜者白成王言己巳傳顧命訖也將欲拜故先授宗人同拜者自為拜神不拜康王但白神言巳傳顧命之事先告王巳受顧命王答拜者尊所受之命亦告神使知故答拜也王既祭則奠同於地太保不敢奠於地故以同授宗人然後拜也太保既酢祭而拜則王之奠爵每奠必拜於王祭不言拜者祭酒必拜乃是常禮於王不言拜於太保言拜者足以見王拜也傳太保至相備正義曰太保受同者謂太保既拜之後於宗人邊受前所授之同而進以祭神既祭神之後遂更受福酒嚌以至齒禮之通例啐入口是嚌至於齒示飲而實不飲也太保報王之祭事與王祭禮同而史録其事二文不等故傳辨其意於太保言嚌至齒則王饗福酒亦嚌至齒也於王言上宗曰饗則太保亦應有宗人曰饗二文不同互見以相備傳太保至所白正義曰宅訓居也太保居其所於受福酒之處足不移為將拜故授宗人同祭祀既畢而更拜者白成王以事畢也既拜白成王以傳顧命事畢則王受顧命亦畢王答拜敬所白也諸侯出廟門侯正義曰廟門謂路寢門也出門待王後命即作後篇後篇云二伯率諸侯入應門則諸侯之出應門之外非出廟門而巳以其在廟行事事畢出於廟門不言出廟門即止也康王之誥第二十五康王之誥正義曰康王既受顧命主天子之位羣臣進戒於王王遂報誥諸侯史敘其事作康王之誥伏生以此篇合於顧命共為一篇後人知其不可分而為二馬鄭王本此篇自髙祖寡命巳上內於顧命之篇王若曰以下始為康王之誥諸侯告王王報誥諸侯而使告報異篇失其義也王出至答拜正義曰此敘諸侯見新王之事王出畢門在應門之內立於中庭太保召公為西伯率西方諸侯入應門左立於門內之西廂也太師畢公為東伯率東方諸侯入應門右立於門內之東廂也諸侯皆布陳一乘四匹之黃馬朱鬛以為見新王之庭實諸侯為王之賔共使一人少前進舉奉圭兼幣之辭言曰一二天子之臣在外為蕃衛者敢執土壤所有奠之於庭既為此言乃皆再拜稽首用盡禮致敬以正王為天子也康王先為太子以義嗣先人明德不以在喪為嫌答諸侯之拜以示受其圭幣與之為主也傳出畢至南面正義曰出在門內不言王坐諸侯既拜王即答拜復不言興知立庭中南面也傳二公至北面正義曰二公率領諸侯知其為二伯各率其所掌諸侯曲禮所謂職方者此之義也王肅云畢公代周公為東伯故率東方諸侯然則畢公是太師也當太師之名在太保之上此先言太保者於時太保領冢宰相王室任重故先言西方若使東伯任重亦當先言東方北面以東為右西為左入左入右隨其方為位嫌東西相向故云皆北面將拜王明北面也傳諸侯至庭實正義曰諸侯朝見天子必獻國之所有以表忠敬之心故諸侯皆陳四黃馬朱鬛以為庭實言實之於王庭也四馬曰乘言乘黃正是馬色黃矣黃下言朱朱非馬色定十年左傳云宋公子地有白馬四公嬖向魋魋欲之公取而朱其尾鬛以與之是古人貴朱鬛知朱者朱其尾鬛也於時諸侯其數必衆衆國皆陳四馬則非王庭所容諸侯各有所獻必當少陳之也案周禮小行人云合六幣圭以馬璋以皮壁以帛琮以錦琥以繡璜以黼此六物者以和諸侯之好鄭玄云六幣所以享也五等諸侯享天子用璧享后用琮用圭璋者二王之後也如鄭彼言則諸侯之享天子惟二王之後用馬此云皆陳馬者下云奉圭兼幣幣即馬是也圭是文馬之物鄭云此幣圭以馬蓋舉王者之後以言耳諸侯當璧以帛亦有庭實然則此陳馬者是二王之後享王物也獨取此物以揔表諸侯之意故云諸侯皆陳馬也圭亦享王之物下言奉圭此不陳圭者圭奉以文命不陳之也案覲禮諸侯享天子馬卓上九馬隨之此用乘黃者因喪禮而行朝故略之傳賔諸至奠贄正義曰天子於諸侯有不純臣之義故以諸侯為賔稱訓舉也舉奉圭兼幣之辭以圭幣奉王而為之作辭辭出一人之口而言一二者見諸侯同為此意意非一人也鄭玄云釋辭者一人其餘奠幣拜者稽首而巳是也言衛者諸侯之在四方皆為天子蕃衛故曰臣衛此時成王始崩即得有諸侯在京師者來朝而遇國喪遂因見新王也諸侯享天子其物甚衆非徒圭馬而巳皆是土地所有故云敢執壤地所出而奠贄也然舉奉圭兼幣乃是享禮凡享禮則每一國事畢乃更餘國復入其朝則侯氏揔入故鄭玄注曲禮云春受贄於朝受享於廟是朝與享別此既諸侯揔入而得有庭實享禮者以新朝嗣王因行享禮故鄭注云朝兼享禮也與常禮不同傳諸侯至其幣正義曰周禮太祝辨九拜一曰稽首施之於極尊故為盡禮也義嗣德三字史原王答拜之意也康王先是太子以義繼先人明德今為天子無所嫌故答其拜受其幣自許與諸侯為主也太保至寡命正義曰太保召公與司徒芮伯皆共諸侯並進相顧而揖乃並再拜稽首起而言曰敢告天子大天改大國殷之王命誅殺殷紂惟周家文王武正大受大道而順之能憂我西土之民以此王有天下惟我周家新升王位當盡和天下賞罰戡定其為王之功用布遺後人之美將使施及子孫無有窮盡之期今王新即王位其敬之哉當張大我之六師令國常強盛無令傾壞我髙祖寡有之命戒王使繼先王之業也傳冢宰至見外正義曰召公為冢宰芮伯為司徒司徒位次冢宰故言太保與芮伯咸進芮伯已下共告羣臣諸侯並皆進也相揖者揖之使俱進也太保揖羣臣羣臣又報揖太保故言相揖動足然後相揖故相揖之文在咸進之下傳言文至所起正義曰羑聲近猷故訓之為道王肅云羑道也文武所憂非憂西土而巳特言能憂西土之民本其初起於西土故也傳言當至教命正義曰皇訓大也國之大事在於強兵故令張大六師之衆髙德之祖謂文王也王肅云美文王少有及之故曰寡有也王若至子羞正義曰羣臣諸侯既進戒王王順其戒呼而告之曰衆邦在侯甸男衛諸服內之國君惟我一人釗報誥卿士羣公昔先君文王武王其道甚大政化平美專以美道教化不務咎惡於人致行至美中正誠信之道用是顯明於天下言聖道博洽也文武既聖時臣亦賢則亦有如熊如羆之勇士不二心之忠臣共安治王家以君聖臣良之故用能受端直之命於上天犬天用順其道付與四方之國使文武受此諸國王有天下言文武得賢臣之力也文武以得臣力之故乃施政命封立賢臣為諸侯者樹之以為蕃屏令屏衛在我後之人先王所立諸侯即今諸侯之祖故舉先丗之事以告今之諸侯今我一二伯父庶幾相與顧念文武之道安汝先公之用臣服於先王之道而法循之亦當以忠誠輔我天子雖汝身在外土為國君汝心常當無有不在王室當各用心奉憂其所行順道無自荒怠以遺我稚子之羞辱稚子康王自謂戒令匡弼已也傳順其至見內正義曰羣臣戒王使勤王又戒之使輔已是順其事而告之也上文太保芮伯進言不言諸侯以內見外此王告庶邦不言朝臣以外見內欲令互相備也周制六服此惟四服不言采要者略舉其事猶武成云甸侯衛駿奔走亦略舉之矣豫一人釗正義曰禮天子自稱豫一人不言名此王自稱名者新即王位謙也傳言先至咎惡正義曰孔以富為美故云政化平美不務咎惡於人言哀矜下民不用刑罰王肅云文武道大天下以平萬民以冨是也傳致行至德洽正義曰孔以齊為中致行中正誠信之道王肅云立大中之道也傳天子至循之正義曰覲禮言天子呼諸侯之禮云同姓大國則曰伯父其異姓則曰伯舅同姓小邦則曰叔父其異姓則曰叔舅計此時諸侯多矣獨云伯父舉同姓大國言之也諸侯先公以臣道服於先王其事有法故令安汝先公之用臣服於先王以臣之道而法循之傳言雖至諸侯正義曰王之此誥並告羣臣諸侯但互相發見其言不備言先王有熊羆之士勵朝臣使用力如先丗之臣也此言汝身在外土心念王室督諸侯使然羣公至喪服正義曰羣公揔謂朝臣與諸侯也鄭玄云羣公主為諸侯與王之三公諸臣亦在焉王釋冕反喪服朝臣諸侯亦反喪服禮喪服篇臣為君諸侯為天子皆斬衰畢命第二十六康王至畢命正義曰康王命史官作册書命畢公使畢公分別民之居里今善惡有異於成周之邑成定東周之郊境史敘其事作畢命傳命為至畢公正義曰周禮內史云凡命諸侯及孤卿大夫則䇿命之此云命作册者命內史為册書以命畢公故云以册命畢公傳分別至保護正義曰殷之頑民遷居此邑歷丗化之巳得純善恐其變改故更命畢公分別民之居里異其善惡即經所云旌別淑慝表厥宅里彰善疸惡樹之風聲殊厥井疆㑭克畏慕皆是也分者令其善惡分別使惡者慕善非分別其處使之異居也此邑本名成周欲以成就周道民不純善則是未成故命畢公教之成定東周郊境即經申畫郊圻愼固封守是其使有保護惟十至東郊正義曰惟康王即位十有二年六月三日庚午月光朏然而明也於朏後三日壬申王早朝行從宗周鎬京至於豐邑就文王之廟以成周之民衆命太師畢公使安理東郊之民今得其所傳康王至庚午正義曰漢初不得此篇有偽作其書以代之者漢書律曆志云康王十二年六月戊辰朔三日庚午故畢命豐刑曰惟十有二年六月庚午朏王命作䇿書豐刑此偽作者傳聞舊語得其年月不得以下之辭妄言作豐刑耳亦不知豐刑之言何所道也鄭玄云今其逸篇有册命霍侯之事不同與此序相應非也鄭玄所見又似異於豐刑皆妄作也説文云朏月未盛之明也此日未有事而記此庚午朏者為下言壬申張本猶如記朔望與生魄死魄然也王若至仰成正義曰康王順其事歎而呼畢公曰嗚呼父師惟文王武王布大德於天下用此能受殷之王命代殷為天子惟周公佐助先王安定其家愼彼殷之頑民恐其或有叛逆故遷於洛邑令之比近王室用使化其教訓自爾巳來既歷三紀人丗既變風谷亦移四方無可度之事我天子一人用是而得安寧但天道有上下交接之義政教有用俗改更之理今日雖善或變為惡若不善其善則民無所勸慕更須選賢教之舉善勸之冝此任者莫先於公惟公勉力行德能勤小事輔佐四丗正色率下無有不敬仰師法公言者公之善功多於先王我小子垂衣拱手仰公成理將欲任之故盛稱其德也傳王順至王命正義曰畢公代周公為太師故王呼為父師率東方諸侯是為東伯也蓋君陳卒命之使代君陳也傳言周至其家正義曰釋詁云左右助也言周公助先王安定其家伐殷之時周公巳有其功復能遷殷頑民言其功之多也傳言殷至曰丗正義曰周公以攝政七年營成周成王元年遷殷頑民成王在位之年雖未知其實當在三十左右至今應三十六年是殷民遷周巳歷三紀十一年者天之大數歲星太歲皆十二年而一周天故十二年曰紀父子易人為丗大禹謨云賞延于丗謂緣父及子也傳天道至勸慕正義曰天氣下降地氣上騰而有寒暑生焉刑新國用輕典刑亂國用重典輕重隨俗而有寬猛異焉天道有上下交接之義故寒暑易節政教有用俗改更之理故寬猛相濟天道有寒暑遞來政教以寬猛相濟民之風俗善惡無常或善變為惡或惡變為善不可以其既善謂善必不變民之俗善須以善養之令善遂不變人之俗有不善當以善法御之使變而為善若乃不善其善則下民無所勸慕民無所慕則變為惡矣殷民今雖巳善更當以善教之欲以屈畢公之意傳言公至師法正義曰小物猶小事也能勤小事則大事必能勤矣故舉能勤小事以為畢公之善釋詁云亮佐也晉語説文王之事云詢于八虞訪于辛尹重之以周召畢榮則畢公於文王之丗巳為大臣是輔佐文武成康四丗為公卿也正色謂嚴其顔色不惰慢不阿諂以此率下下民無不敬仰師法之傳公之至子孫正義曰先王之功無由可及言公之善功多大先人之美方欲委之以事盛言之重其功美矣王曰至念哉正義曰王更歎而呼畢公曰嗚呼父師今日我敬命公以周公所為之事公其往為之哉公往至彼當識別善之與惡表異其善者所居之里彰明其為善病其為惡其為善之人當立其善風揚其善聲其有不循道教之常者則殊其井田疆界使之能畏為惡之禍慕為善之福更重畫郊圻境界謹愼牢固其封疆守備以安彼四海之內為政貴在有常言辭尚其體實要約當不惟好其竒異商之舊俗靡靡然好相隨順利口辨捷阿諛順旨者惟以為賢餘風至今未絶公其念絶之哉戒畢公以治殷民之法傳言當至善聲正義曰旌旗所以表識貴賤故傳以旌為識淑善也慝惡也言當識別頑民之善惡知其善者表異其所居之里若今孝子順孫義夫節婦表其門閭者也表其善者則惡者自見明其為善當褒賞之病其為惡當罪罰之其有善人立其善風令邑里使放效之揚其善聲告之踈逺使聞知之傳其不至沮勸正義曰孟子云方里為井井九百畝使民死徙無出鄉鄉田同井出入相友守望相助疾病相扶持則百姓親睦然則先王制之為井田也欲使民相親愛生相佐助死相殯葬不循道教之常者其人不可親近與善民雜居或染善為惡故殊其井田居界令民不與來往猶今下民有大罪過不肯服者則擯出族黨之外吉凶不與交通此之義也亦既殊其井田必當思自改悔使其能畏為惡之禍慕為善之福所以沮止為惡者勸勉為善者傳郊圻至安矣正義曰郊圻謂邑之境界境界雖舊有規畫而年丗久逺或相侵奪當重分明畫之以防後相侵犯雖舉邑之郊境為言其民田疆畔亦令更重畫之不然何以得殊其井疆也王城之立四郊以為京師屏障預備不虞又當謹愼牢固封疆之守備以安四海之內此是王之近郊牢設守備惟可以安京師耳而云安四海者京師安則四海安矣傳紂以至絶之正義曰韓宣子稱紂使師延作靡靡之樂靡靡者相隨順之意紂之為人拒諫飾非惡聞其短惟以靡靡相隨順利口捷給能隨從上意者以之為賢商人效之遂成風俗由此所以覆亡國家殷民利口餘風至今不絶公其念絶之欲令其變惡俗也我聞至共訓正義曰我聞古人言曰丗有祿位之家恃富驕恣少能用禮以放蕩之心陵邈有德之士如此者實悖亂天道敝俗相化奢侈華麗雖相去萬丗而共同一流此殷之衆士皆是富貴之家居處寵勢惟巳久矣怙恃奢侈以滅德義身卑而僭上飾其服美於其人驕恣過制矜能自誇行如此不變將用惡自終今以法約之雖收斂其放佚之心恆防間之惟大艱難資財富足能順道義則惟可以長年命矣惟能用德惟能行義是乃為大順德也若不用古之訓典則於何其能順乎欲令畢公以古之訓典教殷民也傳特言至天道正義曰凡以善言教化無非古之訓典於此特言我聞者言此事自古有之所以尤須嚴禁故也丗有祿位財多勢重縱恣其心而無禮教如此之人少能不以放蕩之心陵邈有德者天這以上臨下以善率惡今乃以下慢上以惡陵善如此者實亂天道也傳此殷至僭上正義曰席者人之所處故為居之義舊久也殷士多是丗貴之家故為居寵日久怙恃已之奢侈自謂奢侈為賢德義廢而不行故為以滅德義又以人輕位卑美服盛飾是服飾過制度美於其人言僭上服服勝人也傳言殷至惟難正義曰淫訓過也故為過制強梁者不得其死好勝者必遇其敵故矜誇不變將用惡自終言雖收放心則已收之矣雖今順從周制畏威自止故怨猶在心未壓服故以禮間禦其心惟難也間謂防間禦止也傳敬順至畢公正義曰美於前人之政謂光前人之政所以勉勵畢公尚書正義卷第一八
