body:
  text: 維等言臣等元奉勑校勘五經正義今巳見有成堪雕印版行用者伏以三才分而書契肈啓六籍著而學校斯興由是體國辨方必典禮修文立敎實本於膠庠則郁郁乎文於周爲盛矣後曁法值挾書復時經戰國或年祀逺而篇簡爛脫或師徒衆而傳授差訛存歷朝錯綜之文雖具陳解說在羣儒講論之旨亦互有異同唐貞觀中國子祭酒孔穎達考前代之文採衆家之善隨經析理去短從長用功二十四五年撰成一百八十卷自是至此三百餘年講經者止務銷文應舉者唯編節義茍期合格志望䇿名出身者急在于榮食禄者多忘本業一登科級便罷披尋因循而舛謬漸滋節略而宗源莫究伏惟應運統天睿文英武大聖至明廣孝皇帝陛下道髙貫月德邁重曈武暢遐陬舉前朝之墜典正歷代之舊章崇儒雅之風三王却軫闡詩書之敎兩漢厚顔臣等謬以寡聞幸塵華貫猥奉窮經之寄曽無博古之能空極覃精寧周奥義今則逐部各詳於訓解寫本皆正於字書非遇昌期難興大敎旣釋不刋之典願垂永代之規儻今雕印以頒行乞降絲綸之明命干犯旒冕臣等無任戰汙兢惶激切屏營之至謹奉表陳請以聞臣維等誠惶誠恐頓首頓首謹言端拱元年三月日勘官承奉郎守大理評事臣秦奭等上張勘官徴事郎守大理寺丞柱國臣軒轅節勘官徴事郎守太子右賛善大夫臣胡令問勘官承奉郎守太子右賛善大夫柱國臣解貞吉勘官承奉郎守殿中丞柱國臣胡迪勘官朝奉郎守國子毛詩博士柱國賜緋魚袋臣解損勘官承奉郎守國子禮記博士賜緋魚袋臣李覺勘官承奉郎守國子春秋博士賜緋魚袋臣袁逢吉都勘官朝請大夫守國子司業賜紫金魚袋臣孔維上五經正義表臣無忌等言臣聞混元初闢三極之道分焉醇德旣醨六籍之文著矣於是龜書浮於温洛爰演九疇龍圖出於榮河以彰八卦故能範圍天地埏埴隂陽道濟四𬈑知周萬物所以七敎八政垂炯戒於百王五始六虚貽徽範於千古詠歌明得失之跡雅頌表廢興之由寔刑政之紀綱乃人倫之隱括昔雲官司契之后火紀建極之君雖歩驟不同質又有異莫不開玆膠序方之地軸將五嶽而永久筆削巳了繕寫如前臣等學謝伏業慙張禹雖罄庸淺懼乖正典謹以上聞伏増戰越謹言永徽四年二月二十四日太尉揚州都督上柱國趙國公臣無忌等上奉尚書正義序國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰夫書者人君辭誥之典右史記言之䇿古之王者事緫萬機發號出令義非一揆或設敎以馭下或展禮以事上或宣威以肅震曜或敷和而散風雨得之則百度惟貞失之則千里斯謬樞機之發榮辱之主絲綸之動不可不愼所以辭不苟出君舉必書欲其昭法誡愼言行也其泉源所漸基於出震之君黼藻斯彰郁乎如雲之后勲華揖讓而典謨起湯武革命而誓誥興先君宣父生於周末有至德而無至位修聖道以顯聖人芟煩亂而翦浮辭舉宏綱而撮機要上斷唐虞下終秦魯時經五代書緫百篇採翡翠之羽毛拔犀象之牙角罄荆山之石所得者連城窮漢水之濵所求者照乗巍巍蕩蕩無得而稱郁郁紛紛於斯爲盛斯乃前言往行足以垂法將來者也曁乎七雄巳戰五精未聚儒雅與深穽同埋經典共積薪俱燎漢氏大濟區宇廣求遺逸採古文於金石得今書於齊魯其文則歐陽夏侯二家之所說蔡邕碑石刻之古文則兩漢亦所不行安國注之寔遭巫蠱遂寢而不用歷及魏晉方始稍興故馬鄭諸儒莫覩其學所注經傳時或異同晉丗皇甫謐獨得其書載於帝紀其後傳授乃可詳焉但古文經雖然早出晩始得行其辭富而備其義弘而雅故復而不厭乆而愈亮江左學者咸悉祖焉近至隋初始流河朔其爲正義者蔡大寶巢猗費甝顧彪劉焯劉炫等其諸公旨趣多或因循怗釋注文義皆淺略惟劉焯劉炫最爲詳雅然焯乃織綜經文穴鑿孔穴詭其新見異彼前儒非險而更爲險無義而更生義竊以古人言誥惟在達情雖復時或取象不必辭皆有意若其言必託數經悉對文斯乃鼔怒浪於平濟震驚猋於靜樹使敎者煩而多惑學者勞而少功過猶不及爲此也炫嫌焯之煩雜就而刪焉雖復微稍省要又好改張前義義更大略辭又過華雖爲文筆之善乃非開獎之路義旣無義文又非文欲使後生若爲領袖此乃炫之所失未爲得也今奉明勑考定是非謹罄庸愚竭所聞見覽古人之傳記質近代之異同存其是而去其非削其煩而増其簡此亦非敢臆說必據舊聞謹與朝散大夫行太學博士臣王德韶前四門助敎臣李子雲等謹共銓敘至十六年又奉勑與前修䟽人及通直郎行四門博士驍騎尉臣朱長才給事郎守四門博士上騎都尉臣蘇德融登仕郎守太學助敎雲騎尉臣隨德素儒林郎守四門助敎雲騎尉臣王士雄等對勑使趙弘智覆更詳審爲之正義凡二十卷庶對揚於聖範冀有益於童稚略陳其事敘之云爾
