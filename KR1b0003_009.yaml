body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔頴達奉勑撰商書盤庚上第九盤庚中第十盤庚下第十一說命上第十二說命中第十三說命下第十四髙宗肜日第十五西伯戡黎第十六微子第十七盤庚上第九盤庚至三篇正義曰商自成湯以來屢遷都邑仲丁河亶甲袒乙皆有言誥歷載於篇盤庚最在其後故序揔之自湯至盤庚凡五遷都今盤庚將欲遷居而治於亳之殷地民皆戀其故居不欲移徙咨嗟憂愁相與怨上盤庚以言辭誥之史敘其事作盤庚三篇傳自湯至亳殷正義曰經言不常厥邑于今五邦故序言盤庚五遷傳嫌一身五遷故辯之云自湯至盤庚凡五遷都也上文言自契至于成湯八遷并數湯爲八此言盤庚五遷又并數湯爲五湯一人再數故班固云朗人屢遷前八後五其實正十二也此序云盤庚將治亳殷下傳云殷亳之别名則亳殷即是一都湯遷還從先王居也汲冢古文云盤庚自奄遷于殷殷在鄴南三十里束晳云尚書序盤庚五遷將治亳殷舊說以爲居亳亳殷在河南孔子壁中尚書云將始宅殷是與古文不同也漢書項羽傳云洹水南殷墟上今安陽西有殷束晳以殷在河北與亳異也然孔子壁内之書安國先得其本此將治亳殷不可作將始宅殷亳字摩滅容或爲宅壁内之書安國先得始皆作乱其字與治不類無縁誤作始字知束晳不見壁内之書妄爲說耳若洹水之南有殷墟或當餘王居之非盤庚也盤庚治於亳殷紂滅在於朝歌則盤庚以後遷於河北蓋盤庚後王有從河南亳地遷於洹水之南後又遷于朝歌傳胥相至怨上正義曰釋詁云胥皆也相亦是皆義故通訓胥爲相也民不欲徙乃咨嗟憂愁相與怨上經云民不適有居是怨上之事也仲丁祖乙亦是遷都序無民怨之言此獨有怨者盤庚祖乙之曽孫也祖乙遷都於此至今多歷年丗民居巳乆戀舊情深前王三徙誥今則行曉喻之易故無此言此則民怨之深故序獨有此事彼各一篇而此獨三篇者謂民怨上故勸誘之難也民不欲遷而盤庚必遷者鄭玄云祖乙居耿後奢侈踰禮土地迫近山川甞圯焉至陽甲立盤庚爲之臣乃謀徙居湯舊都又序注云民居耿乆奢淫成俗故不樂徙王肅云自祖乙五丗至盤庚元兄湯甲宫室奢侈下民邑居墊隘水泉瀉鹵不可以行政化故徒都於殷皇甫謐云耿在河北迫近山川自祖辛以來民皆奢侈故盤庚遷於殷此三者之說皆言奢侈鄭玄旣言君奢又言民奢王肅專謂君奢皇甫謐專謂民奢言君奢者以天子宫室奢侈侵奪下民言民奢者以豪民室宇過度逼迫貧乏皆爲細民弱劣無所容居欲遷都改制以寛之富民戀舊故違上意不欲遷也案檢孔傳無奢侈之語惟下篇云今我民用蕩析離居罔有定極傳云水泉沈溺故蕩析離居無安定之極徙以爲之極孔意蓋以地勢洿下又乆居水變水泉瀉鹵不可行化故欲遷都不必爲奢侈也此以君名名篇必是爲君時事而鄭玄以爲上篇是盤庚爲臣時事何得專輒謬妄也盤庚正義曰此三篇皆以民不樂遷開解民意告以不遷之害遷都之善也中上二篇未遷時事下篇旣遷後事上篇人皆怨上初啓民心故其辭尤切中篇民以少悟故其辭稍緩下篇民旣從遷故辭復益緩哀十一年左傳引此篇云盤庚之誥則此篇皆誥辭也題篇不目盤庚誥者王肅云取其徙而立功故但以盤庚名篇然仲丁祖乙河亶甲等皆以王名名篇則是史意異耳未必見他義傳殷質以名篇正義曰周書謚法成王時作故桓六年左傳云周人以諱事神殷時質未諱君名故以王名名篇也上仲丁祖乙亦是王名於此始作傳者以上篇經亡此經稱盤庚故就此解之史記殷本紀云盤庚崩弟小辛立殷復衰百姓思盤庚乃作盤庚三篇與此序違非也鄭玄云盤庚湯十丗孫祖乙之曽孫以五遷繼湯篇次祖乙故繼之于上累之祖乙爲湯玄孫七丗也又加祖乙復其祖父通盤庚故十丗本紀云祖乙崩子祖辛立崩子開甲立崩弟祖丁立崩開甲之子南庚立崩祖丁子陽甲立崩弟盤庚立是祖乙生祖辛祖辛生祖丁祖丁生盤庚故爲曽孫盤庚至四方正義曰盤庚欲遷於亳之殷地其民不欲適彼殷地別有邑居莫不憂愁相與怨上盤庚率領和諧其衆憂之人出正直之言以曉告曰我先王初居此者從舊都來於是宅於此地所以遷於此者爲重我民無欲盡殺故先王以乆居墊隘不遷則死見下民不能相匡正以生故謀而來徙以徙爲善未敢專決又考卜於龜以從旣獲吉兆乃曰其如我所行欲徙之吉先王成湯以來凡有所服行敬順天命如此尚不常安可徙則徙不常其邑於今五邦矣今若不承於古徙以避害則是無知天將斷絶汝命矣天將絶命尚不能知況曰其能從先王之基業乎今我徃遷都更求昌盛若顚仆之木有用生蘖哉人衰更求盛猶木死生蘖哉我今遷向新都上天其必長我殷之王命於此新邑繼復先王之大業致行其道以安四方之人我徙欲如此耳汝等何以不願徙乎前云若不徙以避害則天將絶汝命謂絶臣民之命明亦絶我殷王之命復云若遷往新都天其長我殷之王命明亦長臣民之命互文也傳亳之別名正義曰此序先亳後殷亳是大名殷是亳内之別名鄭玄云商家自徙此而號曰殷鄭以此前未有殷名也中篇云殷降大虐將遷於殷先正其號明知於此號爲殷也雖兼號爲殷而商名不改或稱商或稱殷又有兼稱殷商商頌云商邑翼翼撻彼殷武是單稱之也又大雅云殷商之旅咨汝殷商是兼稱之也亳是殷地大名故殷社謂之亳社其亳鄭玄以爲偃師皇甫謐以爲梁國穀熟縣或云濟隂亳縣說旣不同未知誰是傳適之至邑居正義曰釋詁云適之往也俱訓爲往故適得爲之不欲往彼殷地別有新邑居也傳籲和至之言正義曰籲即𥙿也是寛意故爲和也憂則不和戚訓憂也故率和衆憂之人出正直之言詩云其直如矢故以矢言爲正直之言傳我王至於此正義曰孔以祖乙圯於相地遷都於耿今盤庚自耿遷二殷以我王爲祖乙此謂耿也傳劉殺至殺故正義曰劉殺釋詁文水泉鹹鹵不可行化王化不行殺民之道先王所以去彼遷此者重我民無欲盡殺故也傳言民至所行正義曰不徙所以不能相匡以生者謂水泉沈溺人民困苦不能從敎相匡正以生又考卜於龜以徙周禮太卜大遷則貞龜是遷必卜也傳先王至輒遷正義曰下云于今五邦自湯以來數之則此言先王揔謂成湯至祖乙也先王有所服行謂行有典法言能敬順天命即是有所服行也盤庚言先王敬順天命如此尚不常安有可遷輒遷況我不能敬順天命不遷民必死矣故不可不遷也傳湯遷至國都正義曰孔以盤庚意在必遷故通數我往居亳爲五邦鄭王皆云湯自商徙亳數商亳嚻相耿爲五計湯旣遷亳始建王業此言先王遷都不得遠數居亳之前充此數也傳言今至蘖哉正義曰釋詁云枿餘也李巡曰枿槁木之餘也郭璞云晉衞之閒曰枿是言木死顚仆其根更生蘖哉此都毀壞若枯死之木若棄去毀壞之邑更得昌盛猶顚仆枯死之木用生蘖哉盤庚至攸箴正義曰前旣略言遷意今復並戒臣民盤庚先敎於民云汝等當用汝在位之命用舊常故事正其法度欲令民徙從其臣言也民從上命即是常事法度也又戒臣曰汝等無有敢伏絕小人之所欲箴規上者傳斆敎至朝臣正義曰文王丗子云小樂正斆干太胥賛之籥師斆戈籥師丞賛之彼並是敎舞干戈知斆爲敎也小民等患水泉沈溺欲箴規上而徙汝臣下勿抑塞伏絕之鄭玄云奢侈之俗小民咸苦之欲言於王今將屬民而詢焉故勑以無伏之傳衆羣臣以下正義曰周禮小司寇掌外朝之政以致萬民而詢焉一曰詢國危二曰詢國遷三曰詢立君是國將大遷必詢及於萬民故知衆悉至王庭是羣臣以下謂及下民也民不欲徙由臣不助王勸民故已下多是責臣之辭傳先王正義曰此篇所言先王其文無指斥者皆謂成湯巳來諸賢王也下言神后髙后者指謂湯耳下篇言古我先王適于山者乃謂遷都之王仲丁祖乙之等也此言先王謂先丗賢王此旣言先王下句王播告之王用丕欽蒙上之先不言先省文也傳王布至其指正義曰上句言先王用舊人共政下云王播告之修當謂告臣耳傳言布告人者以下云民用丕變是必告臣亦又告民傳聒聒至何謂正義云鄭玄云聒讀如聒耳之聒聒聒難告之貌王肅云聒聒善自用之意也此傳以聒聒爲無知之貌以聒聒是多言亂人之意也起信險膚者言發起所行專信此險僞膚受淺近之言信此浮言妄有爭訟我不知汝所訟言何謂言無理也非予至觀火正義曰言先王敬其敎民用大變我命敎汝汝不肯徙非我自廢此丕欽之德惟汝之所含德甚惡不畏懼我一人故耳汝含藏此意謂我不知我見汝情若觀火言見之分明如視火也傳逸過至汝過正義曰逸過釋言文我若以威加汝汝自不敢不遷則無違上之過也我不威脅汝徙乃是我亦拙謀作成汝過也恨民以恩導之而不從已也傳紊亂至有福正義曰紊是絲亂故爲亂也稼穡相對則重之曰稼斂之曰穡穡是秋收之名得爲耕穫揔稱故云穡耕稼下承上則有福福謂禄賞傳戎大至所有正義曰戎大昬強越於皆釋詁文孫炎曰昬夙夜之強也書曰不昬作勞引此解彼是亦讀此爲昬也鄭玄讀昬爲愍訓爲勉也與孔不同傳云言不欲徙則是不畏大毒於遠近其意言不徙則有毒毒謂禍患也遠近謂賖促言害至有早晚也不強於作勞則黍稷無所獲以喻不遷於新邑則福禄無所有也此經惰農弗昬無黍稷對上服田力穡乃亦有秋但其文有詳略耳傳責公至毒害正義曰此篇上下皆言民此獨云百姓則知百姓是百官也百姓旣是百官和吉言者又在百官之上知此經是責公卿不能和喻善言於百官使之樂遷也不和百官必將遇禍是公卿自生毒害傅羣臣至所及正義曰羣臣是民之師長當倡民爲善羣臣亦不欲徙是乃先惡於民也恫痛釋言文相時至有咎正義曰又責大臣不相敎遷徙是不如小民我視彼憸利小民猶尚相顧於箴規之言恐其發舉有過口之患故以言相規患之小者尚知畏避況我爲天子制汝短長之命威恩甚大汝不相敎從我乃是汝不如小民汝若不欲徙何不以情告我而輒相恐動以浮華之言乃語民云國不可徙我恐汝自取沈溺於衆人而身被刑戮之禍害此浮言流行若似火之燎放原野炎熾不可嚮近其猶可撲之使滅以喻浮言不可止息尚可刑戮使絶也若以刑戮加汝則是汝衆自爲非謀所致此耳非我有咎過也傳曷何至禍害正義曰曷何同音故曷爲何也顧氏云汝以浮言恐動不徙更是無益我恐汝自取沈溺放衆人不免禍害也傳我刑至所致正義曰我刑戮汝汝自招之非我咎也靖謀釋詁文告民不徙者非善謀也由此而被刑戮是汝自爲非謀所致也遲任至非德正義曰可遷即遷是先王舊法古之賢人遲任有言曰人惟求舊器非求舊惟新言人貴舊器貴新汝不欲徙是不貴舊反遲任也古者我之先王及汝祖汝父相與同逸豫同勤勞汝爲人子孫冝法父祖當與我同其勞逸我豈敢動用非常之罰脅汝乎自先王以至於我丗丗數汝功勞我不掩蔽汝善是我忠放汝也以此故我大享祭於先王汝祖其從我先王與在宗廟而歆享之是我不掩汝善也汝有善自作福汝有惡自作災我亦不敢動用非德之賞妄賞汝各從汝善惡而報之耳其意告臣言從上必有賞違我必有罰也傳遲任至貴舊正義曰其人旣沒其言立於後丗如是古賢人也鄭玄云古之賢史正肅云古老成人皆謂賢也傳選數至於汝正義曰釋詁云算數也舎人曰釋數之曰算選即算也故調爲數經言丗丗數汝功勞是從先王至已常行此事故云是我忠於汝也言已之忠責臣之不忠也傳古者至汝善正義曰周禮大宗伯祭祀之名天神曰祀地祇曰祭人鬼曰享此大享於先王謂天子祭宗廟也傳解天子祭廟得有臣祖與享之意言古者天子録功臣配食於廟故臣之先祖得與享之也古者孔氏據已而道前丗也此殷時巳然矣大享烝嘗者烝甞是秋冬祭名謂之大享者以事各有對若烝甞對禘祫則禘祫爲大烝甞爲小若四時自相對則烝甞爲大礿祠爲小以秋冬物成可薦者衆故烝甞爲大春夏物未成可薦者少故礿祠爲小也知烝甞有功臣與祭者案周禮司勲云凡有功者銘書放王之太常祭於大烝司勲詔之是也甞是烝之類而傳以甞配之魯頌曰秋而載甞是也祭統云内祭則大甞禘是也外祭則郊社是也然彼以祫爲大甞知此不以烝甞時爲禘祫而直據時祭者以殷祫於三時非獨烝甞也秋冬之祭尚及功臣則禘祫可知惟春夏不可耳以物未成故也近代巳來惟禘祫乃祭功臣配食時祭不及之也近代巳來功臣配食各配所事之君若所事之君其廟巳毀時祭不祭毀廟其君尚不時祭其臣固當止矣禘祫則毀廟之主亦在焉其時功臣亦當在也王制云犆礿祫禘祫甞祫烝諸侯礿犆禘一犆一祫甞祫烝祫此王制之文夏殷之制天子春惟時祭其夏秋冬旣爲祫又爲時祭諸侯亦春爲時祭夏惟作祫不作時祭秋冬先作時祭而後祫周則春曰祠夏曰礿三年一祫在秋五年一禘在夏故公羊傳云五年再殷祭禮緯云三年一祫五年一禘此是鄭氏之義未知孔意如何予告至有志正義曰旣言作福作災由人行有善惡故復敎臣行善我告汝於行事之難猶如射之有所準志志之所主欲得中也必中所志乃爲善耳以喻人將有行豫思念之行得其道爲善耳其意言遷都是善道當念從我言也傳告汝至乃善正義曰此傳惟順經文不言喻意鄭玄云我告汝於我心至難矣夫射者張弓屬矢而志在所射必中然後發之爲政之道亦如是也以已心度之可施於彼然後出之傳不用至易之正義曰老謂見其年老謂其無所復知弱謂見其幼弱謂其未有所識鄭云老弱皆輕忽之意也老成人之言云可徙不用其言是侮老之也不徙則水泉鹹鹵孤幼受害不念其害是卑弱輕易之也傳盤庚至之謀正義曰於時羣臣難毀其居宅惟見目前之利不思長乆之計其臣非一共爲此心盤庚勑臣下各思長乆於其居處勉強盡心出力聽從我遷徙之謀自此以下皆是也無有至厥善正義曰此即遷徙之謀也言我至新都撫養在下無有遠之與近必當待之如一用刑殺之罪伐去其死道用照察之德彰明其行善有過罪以懲之使民不犯非法死刑不用是伐去其死道伐若伐樹然言止而不復行用也有善者人主以照察之德加賞禄以明之使競慕爲善是彰其善也此二句相對上言用罪伐厥死下冝言用賞彰厥生不然者上言用刑下言賞善死是刑之重者舉重故言死有善乃可賞故言彰厥善行賞是德故以德言賞人生是常無善亦生不得言彰厥生故文互度乃口正義曰度法度也故傳言以法度居汝口也盤庚中第十盤庚至厥民正義曰盤庚於時見都河北欲遷向河南作惟南渡河之法欲用民徙乃出善言以告曉民之不循敎者大爲敎告用誠心於其所有之衆人於時衆人皆至無有褻慢之人盡在於王庭盤庚乃升進其民延之使前而敎告之史敘其事以爲盤庚發誥之目傳爲此至民徙正義曰鄭玄云作渡河之具王肅云爲此思南渡河之事此傳言南渡河之法皆謂造舟船渡河之具是濟水先後之次思其事而爲之法也傳話善至於衆正義曰釋詁云話言也孫炎曰話善人之言也王苦民不從敎必發善言告之故以話爲善言鄭玄詩箋亦云話善言也傳民亦至天時正義曰以君承安民而憂之故民亦安君之政相與憂行君令使君令必行責時羣臣不憂行君令也舟船浮水而行故以浮爲行也行天時也順時布政若月令之爲也傳我殷至行徙正義曰遷都者止爲邑居墊隘水泉鹹鹵非爲避天災也此傳以虐爲災懷爲思言殷家於天降大災則先王不思故居而行徙者以天時人事終是相將邑居不可行化必將天降之災上云不能相匡以生罔知天之斷命即是天降災也承汝至于罰正義曰先王爲政惟民之承今我亦法先王故承安汝使汝徙惟歡喜安樂皆與汝共之非謂汝有咎惡而徙汝令比近於殃罰也予若至厥志正義曰盤庚言我順於道理和協汝衆歸懷此新邑者非直爲我王家亦惟利汝衆故爲此大從我本志而遷徙不有疑也臭厥載正義曰臭是氣之別名古者香氣穢氣皆名爲臭易云其臭如蘭謂香氣爲臭也晉語云惠公改葬申生臭徹於外謂穢氣爲臭也下文覆述此意云無起穢以自臭則此臭謂穢氣也肉敗則臭故以臭爲敗船不渡水則敗其所載物也爾忱至曷瘳正義曰盤庚責其臣民汝等不用徙者由汝忠誠不能屬逮於古賢苟不欲徙惟相與沈溺於衆不欲徙之言不其有考驗於先王遷徙之事汝旣不考於古及其禍至乃自忿怒何所瘳差也汝誕勸憂正義曰凡人以善自勸則善事多若以憂自勸則憂來衆今不徙則憂來衆是自勸勵以憂愁之道今其至在上正義曰顧氏云責羣臣汝今日其且有今目前之小利無後日乆長之計患禍將至汝何得乆生在民上也今予至自臭正義曰今我命汝是我之一心也汝當從我無得起爲穢惡以自臭敗汝違我命是起穢以自臭也恐人至乃心正義曰言汝心旣不欲徙旁人或更誤汝我又恐他人倚曲汝身迂僻汝心使汝益不用徙也傳言汝至迂僻正義曰人心不能自決則好用非理之謀言汝旣不欲遷徙又爲他人所誤盤庚疑其被誤故言此也以物倚物者必曲故倚爲曲也迂是迴也迴行必僻故迂爲僻也傳迓迎至汝衆正義曰迓迎釋詁文不遷必將死矣天欲遷以延命天意向汝我欲迎之天斷汝命我欲續之我今徙者欲迎續汝命於天豈以威脅汝乎遷都惟用奉養汝衆臣民耳予念至爾然正義曰我念我先丗神后之君成湯愛勞汝之先人故我大能進用汝與汝爵位用以道義懷安汝心耳然汝乃違我命是汝反先人也傳言我至先人正義曰易稱神者妙萬物而爲言也殷之先丗神明之君惟有湯耳故知神后謂湯也下髙后先后與此神后一也神者言其通聖髙者言其德尊此神后言先於髙后略而不言先其下直言先后又略而不言髙從上省文也勞爾先謂愛之也勞者勤也閔其勤勞而慰勞之勞亦愛之義故論語云愛之能勿勞乎是勞爲愛也追言湯勞汝先則此所責之臣其祖於成湯之丗巳在朝廷丗仕王朝而不用已命故責之深也失於至能迪正義曰盤庚以民不願遷言神將罪汝欲懼之使從已也我所以必須徙者我今失於政敎陳乆於此民將有害髙德之君成湯必忿我不徙六乃重下罪疾於我曰何爲殘虐我民而不徙乎我旣欲徙而汝與萬民乃不進進與我一人謀計同心則我先君成湯大下與汝罪疾曰何故不與我幼孫盤庚有相親比同心徙乎汝不與我同心故湯有明德從上見汝一情其下罪罰於汝汝實有罪無所能道言無辭以自解說也傳崇重至徙正正義曰崇重釋詁文又云塵乆也孫炎曰陳居之乆乆則生塵矣古者塵陳同也故陳爲乆之義傳不進至心徙正義曰物之生長則必漸進故以生生爲進進王肅亦然進進是同心願樂之意也此實責羣臣而言汝萬民者民心亦然因博及之傳湯有至無辭正義曰訓爽爲明言其見下故稱明德詩稱三后在天死者精神在天故言下見汝古我至乃死正義曰又責羣臣古我先君成湯旣愛勞汝祖汝父與之共治民矣汝今共爲我養民之官是我於汝與先君同也而汝有殘虐民之心非我令汝如此則在汝心自爲此惡是汝反祖父之行雖汝祖父亦不祐汝我先君安汝祖汝父之忠汝祖汝父忠於先君必忿汝違我乃斷絕棄汝命不救汝死言汝違我命故汝祖父亦忿見湯罪汝不救汝死也傳勞之至治人正義曰下句責臣之身云汝共作我畜民明先后勞其祖父是勞之共治民也傳戕殘至之行正義曰春秋宣十八年邾人戕鄫子左傳云凡自虐其君曰弑自外曰戕戕爲殘害之義故爲殘也先后愛勞汝祖汝父與共治民汝祖父必有愛人之心作訓爲也汝今共爲我養民之官而有殘民之心而不用徙以避害是汝反祖父之行盤庚距湯年丗多矣臣父不及湯丗而云父者與祖連言之耳玆予至弗祥正義曰又責臣云汝祖父非徒不救汝死乃更請與汝罪於此我有治政之臣同位於其父祖其位與父祖同心與父祖異不念忠誠但念具汝貝玉而已言其貪而不忠也汝先祖先父以汝如此大乃告我髙后曰爲大刑於我子孫以此言開道我髙后故我髙后大乃下不善之殃以罰汝成湯與汝祖父皆欲罪汝汝何以不從我徙乎傳亂治至其貪正義曰亂治釋詁文舎人曰亂義之治也孫炎曰亂治之理也大臣理國之政此者所責之人故言於此我有治政之臣言其同位於父祖責其位同而心異也貝者水蟲古人取其甲以爲貨如今之用錢然漢書食貨志具有其事貝是行用之貨也貝玉是物之最貴者責其貪財故舉二物以言之當時之臣不念盡忠於君但念具貝玉而已言其貪也傳言汝至之罪正義曰上句言成湯罪此諸臣其祖父不救子孫之死此句言臣之祖父請成湯討其子孫以不從已故責之益深先祖請討非盤庚所知原神之意而爲之辭以懼其子孫耳傳言汝至督之正義曰訓迪爲道言汝父祖開道湯也不從君爲不忠違父祖爲不孝父祖開道湯下罰欲使從君順祖陳忠孝之義以督勵之嗚呼至乃家正義曰盤庚以言事將畢欲戒使入之故嗚呼而歎之今我告汝皆不易之事言其難也事旣不易當長敬我言大憂行之無相絶遠棄廢之必須存心奉行汝羣臣臣分輩相與計謀念和協以相從各設中正于汝心勿爲殘害之事汝羣臣若有不善不道隕墜禮法不恭上命暫逢遇人即爲姦宄而劫奪之我乃割絶滅之無有遺餘生長所以然者欲無使易其種類於此新邑故耳自今以往哉汝當進進於善今我將用以汝遷長立汝家使汝在位傳諸子孫勿得違我言也傳不易至之事正義曰此易讀爲難易之易不易言其難也王肅云告汝以命之不易亦以不易爲難鄭玄云我所以告汝者不變易言必行之謂盤庚自道已言必不改易與孔異傳顚隕至於内正義曰釋詁云隕落也隕墜也顚越是從上倒下之言故以顚爲隕越爲墜也左傳僖九年齊桓公云恐隕越於下文十八年史克云弗敢失墜隕越是遺落廢失之意故以隕墜不恭爲不奉上命也暫遇人而劫奪之謂逢人即劫爲之無巳成十七年左傳曰亂在外爲姦在内爲宄是劫奪之事故以劫奪解其姦宄也傳劓割至新邑正義曰五刑截鼻爲劓故劓爲割也育長釋詁文不吉之人當割絶滅之無遺長其類謂早殺其人不使得生子孫有此惡類也易種者即今俗語云相染易也惡種在善人之巾則善人亦變易爲惡故絶其惡類無使易種於此新邑也滅去惡種乃是常法而言于此新邑者言已若至新都當整齊使㓗淸傳自今至稱家正義曰長立汝家謂賜之以族使子孫不絕左傳所謂諸侯命氏是也王朝大夫天子亦命之氏故云立汝家也盤庚下第十一盤庚至一人正義曰盤庚旣遷至殷地定其國都處所乃正其郊廟朝社之位又屬民而聚之安慰於其所有之衆曰汝等自今以後無得遊戲怠惰勉力立行敎命今我其布心腹腎腸輸冩誠信歷徧告汝百姓於我心志者欲遷之日民臣共怒盤庚盤庚恐其怖懼故開解之今我無復罪汝衆人我旣不罪汝汝無得如前共爲忿怒協比讒言毀惡我一人恕其前愆與之更始也傳定其至之位正義曰訓攸爲所定其所居揔謂都城之内官府萬民之居處也鄭玄云徙主於民故先定其里宅所處次乃正宗廟朝廷之位如鄭之意奠厥攸居者止謂定民之居豈先令民居使足待其餘剰之處然後建王宫乎若留地以擬王宮即是先定王居不得爲先定民矣孔惟言定其所居知是官民之居並定之也禮郊在國外左祖右社面朝後市正厥位謂正此郊廟朝社之位也傳安於至大敎正義曰鄭玄云勉立我大命使心識敎令常行之王肅云勉立大敎建性命致之五福又案下句爾無共怒予一人是恐其不從巳命此句冝言我有敎命汝當勉力立之鄭說如孔旨也傳布心至告志正義曰此論心所欲言腹内之事耳以心爲五臟之主腹爲六腑之揔腸在腹内腎在心下舉腎腸以配腹心詩曰公侯腹心宣十二年左傳云敢布腹心是腹心足以表内腎腸配言之也古我至定極正義曰言古者我之先王將欲多大於前人之功是故徙都而適于山險之處用下去我凶惡之德立善功於我新國但徙來巳乆水泉沈溺今我在此之民用播蕩分析離其店宅無有安定之極我今徙而使之得其中也說其遷都之意亦欲多大前人之功定民極也傳言以至功美正義曰古我先王謂遷都者前人謂未遷省前人乆居舊邑民不能相匡以生則是居無功矣盤庚言先王以此遷徙故多大前人之功美故我今遷亦欲多前功矣傳徙必至我國正義曰先王至此五邦不能盡知其地所都皆近山故揔稱適于山也易坎卦彖云王公設險以守其國徙必依山之險欲使下民無城郭之勞雖則近山不可全無城郭言其防守易耳徙必近山則舊處新居皆有山矣而云適于山者言其徙必依山不適平地不謂舊處無山故徙就山也水泉鹹鹵民居墊隘時君不爲之徙即是凶惡之德其徙者是下去凶惡之德立善功於我新遷之國也言下者凶德在身下而墜去之傳水泉至之極正義曰民居積丗穿掘處多則水泉盈溢令人沈深而陷溺其處不可安居播蕩分析離其居宅無安定之極極訓中也詩云立我烝民莫匪爾極言民賴后稷之功莫不得其中今爲民失中故徙以爲之中也爾謂至兹賁正義口言我徙以爲民立中汝等不明我心乃謂我何故震動萬民以爲此遷我以此遷之故上天將復我髙祖成湯之德治理於我家我當與厚敬之臣奉承民命用是長居於此新邑以此須遷之故我童蒙之人非敢廢其詢謀謀放衆人衆謀不同至用其善者言善謀者皆欲遷都也又決之於龜卜而得吉我與汝羣臣各非敢違卜用是必遷光大此遷都之大業我徙本意如此耳傳以徙至我家正義曰民害不徙違失湯德以徙之故天必祐我將使復奉湯德令得治理於我家言由徙故天福之也傳沖童至其善正義曰沖童聲相近皆是幼小之名自稱童人言已幼小無知故爲謙也弔至靈善皆釋詁文禮將有大事必謀於衆謀衆乃足常理故言非廢謂動謀於衆言匕不自專也衆謀必有異見故至極用其善者傳宏賁至大業正義曰宏賁皆大也釋詁文樊光口周禮云其聲大而宏詩云有賁其首是宏賁皆爲大之義也各者非一之辭故爲君臣用謀不敢違卜洪範云汝則有大疑謀及卿七謀及卜筮言非敢違卜是旣謀及於衆又決於蓍龜也用大此遷都大謂立嘉績以大之也嗚呼至敘欽正義曰言遷事巳訖故歎而勑之嗚呼國之長伯及衆官之長與百執事之人庶幾皆相與隱括共爲善政哉我其勉力大助汝等爲善汝當思念愛敬我之衆民我不任用好貨之人有人果敢奉用進進於善見窮困之人能謀此窮困之人安居者我乃次序而敬用之傳國伯至善政正義曰邦伯邦國之伯諸侯師長故爲東西二伯及九州之牧也鄭玄注禮記云殷之州長曰伯虞夏及周皆曰牧此殷時而言牧者此乃鄭之所約孔意不然故揔稱牧也師訓爲衆衆長衆官之長故爲三公六卿也其百執事謂大夫以下諸有職事之官皆是也此揔勑衆臣故二伯巳下及執事之人皆戒之也釋言云庶幾尚也反覆相訓故尚爲庶幾庶幸也幾兾也隱謂隱審也幸兾相與隱審檢括共爲善政欲其同心共爲善也隱括必是舊語不知本出何書何休公羊序云隱括使就繩墨焉傳簡大至衆民正義曰簡大釋詁文又云相助慮也俱訓爲慮是相得爲助也盤庚欲使羣臣同心爲善欲勉力大佐助之使皆念敬我衆民也傳肩任至敬之正義曰釋詁云肩勝也舎人曰肩強之勝也強能勝重是堪任之義故爲任也我今不委任貪貨之人以恭爲奉人有向善而心不決志故美其人能果敢奉用進進於善者言其人好善不倦也鞠訓爲窮鞠人謂窮困之人謀人之保居謂謀此窮人之安居若見人之窮困能謀安其居愛人而樂安存之者則我式序而敬之詩云式序在位言其用次序在官位也鄭王皆以鞠爲養言能謀養人安其居者我則次序而敬之與孔不同今我至一心正義曰今我旣進而告汝於我心志矣其我所告順合於汝心以否當以情告我無得有不敬者汝等無得揔於貨寶以求官位當進進自用功德不當用冨也用此布示於民必以德義長任一心以事君不得懷二意以遷都旣定故殷勤以戒之說命上第十二髙宗至三篇正義曰殷之賢王有髙宗者夢得賢相其名曰說羣臣之内旣無其人使百官以所夢之形象經營求之於野外得之于傳氏之巖遂命以爲相史敘其事作說命三篇傳盤庚至曰說正義曰丗本云盤庚崩弟小辛立崩弟小乙立崩子武丁立是武丁爲盤庚弟小乙子也喪服四制云髙宗者武丁武丁者殷之賢王也當此之時殷衰而復興禮廢而復起中而髙之故謂之髙宗是德髙可尊故號髙宗也經云爰立作相王呼之曰說知其名曰說傳使百至之谿正義曰以工爲官見其求者衆多故舉百官言之使百官以所夢之形象經營求於外野皇甫謐云使百工寫其形象則謂工爲工巧之人與孔異也釋水云水注川曰谿李巡曰水出於山入於川曰谿然則谿是水流之處巖是山崖之名序稱得諸傅巖傅云得之於傅巖之谿以巖是揔名故序言之耳傳命說至攝政正義曰經稱爰立作相是命爲相也惟說命揔百官是使攝政也說命正義曰此三篇上篇言夢說始求得而命之中篇說旣揔百官戒王爲政下篇王欲師說而學說報王爲學之有益王又厲說以伊尹之功相對以成章史分序以爲三篇也王宅憂亮隂三祀正義曰言王居父憂信任冡宰黙而不言巳三年矣三年不言自是常事史録此句於首者謂旣免喪事可以言而猶不言故述此以發端也傳隂黙至不言正義曰隂者幽闇之義黙亦闇義故爲黙也易稱君子之道或黙或語則黙者不言之謂也無逸傳云乃有信黙三年不言有此信黙則信謂信任冢宰也傳傅氏至之形正義曰傳以傅爲氏此巖以傅爲名明巖傍有姓傅之民故三傅氏之巖也尸子云傅巖在北海之洲傳言虞虢之界孔必有所案據而言之也史記殷本紀云是時說爲胥靡築於傅險晉灼漢書音義云胥相也靡隨也古者相隨坐輕刑之名言於時築傅險則以杵築地傅說賢人必身不犯罪言其說爲胥靡當是時代胥靡也傳云通道所經有㵎水壞道常使胥靡刑人築護此道說賢而隱代胥靡築之以供食或亦有成文也殷本紀又云武丁得說舉以爲相遂以傅險姓之號曰傅說鄭云得諸傅巖髙宗因以傳命說爲氏案序直言夢得說不言傅或如馬鄭之言如髙宗始命爲傅氏不知舊何氏也皇甫謐云髙宗夢天賜賢人胥靡之衣蒙之而來口云我徙也姓傅名說天下得我者豈徒也哉武丁悟而推之曰傅者相也說者懽說也天下當有傅我而說民者哉明以夢視百官百官皆非也乃使百工寫其形象求諸天下果見築者胥靡衣褐帶索執役于虞虢之閒傅巖之野名說以其得之傅巖謂之傅說案謐言初夢即云姓傅名說又言得之傅巖謂之傅說其言自不相副謐惟見此書傳㑹爲近丗之語其言非實事也傳霖三日雨正義曰隱九年左傳云凡雨自三日巳往爲霖啓乃至弗瘳正義曰當開汝心所有以灌沃我心欲今以彼所見敎已未知故也其沃我心須切至若服藥不使人瞑眩憤亂則其疾不得瘳愈言藥毒乃得除病言切乃得去惑也傳開汝至自警正義曰瞑眩者令人憤悶之意也方言云凡飲藥而毒東齊海岱間或謂之瞑或謂之眩郭璞曰瞑眩亦通語也然則藥之攻病先使人瞑眩憤亂病乃得瘳傳言瞑眩極者言悶極藥乃行也楚語稱衞武公作懿以自警懿即大雅抑詩也切言出於傅說據王以爲自警也說命中第十三惟說命揔百官正義曰惟此傅說受王命揔百官之職謂在冢宰之任也說以官髙任重乃進言於王故史特摽此句爲發言之端也傳天有至設都正義曰晉語云大者天地其次君臣易繫辭云天垂象見吉凶聖人象之皆言人君法天以設官順天以致治也天有日月照臨晝夜猶王官之伯率領諸侯也北斗環繞北極猶卿士之周衞天子也五星行於列宿猶州牧之省察諸侯也二十八宿布於四方猶諸侯爲天子守土也天象皆有尊卑相正之法言明王奉順天道以立國設都也立國謂立王國及邦國設都謂設帝都及諸侯國都揔言建國立家之事樹后至師長正義曰此又揔言設官分職之事也樹立也后王謂天子也君公謂諸侯也承者奉上之名后王君公人主也大夫師長人臣也臣當奉行君命故以承言之周禮立官多以師爲名師者衆所法亦是長之義也大夫巳下分職不同每官各有其長故以師長言之三公則君公之内包之卿則大夫之文兼之師長之言亦通有士將陳爲治之本故先舉其始略言設官故辭不詳備爲治之本惟天聦明巳下皆是也傳憲法至爲治正義曰憲法釋詁文人之聞見在於耳目天無形體假人事以言之聦謂無所不聞明謂無所不見惟聖人於是法天言聖王法天以立敎於下無不聞見除其所惡納之於善雖復運有推移道有升降其所施爲未甞不法天也臣敬順而奉之奉即上文承也奉承君命而布之於民民以從上爲治不從上命則亂故從乂也惟口至厥躬正義曰言王者法天施化其舉止不可不愼惟口出令不善以起羞辱惟甲胄伐非其罪以起戎兵言不可輕敎令易用兵也惟衣裳在篋笥不可加非其人觀其能足稱職然後賜之惟干戈在府庫不可任非其才省其身堪將帥然後授之上二句事相類下二句文不同者衣裳言在篋笥干戈不言所在干戈云省厥躬衣裳不言視其人令其互相足也傳甲鎧至用兵正義曰經傳之文無鎧與兠鍪蓋秦漢巳來始有此名傳以今曉古也古之甲胄皆用犀兕未有用鐵者而鍪鎧之字皆從金蓋後丗始用鐵耳口之出言爲敎今甲胄興師乃用之言不可輕敎令易用兵也易亦輕也安危在出令令之不善則人違背之是起羞也靜亂在用兵伐之無罪則人叛違之是起戎也傳言服至其才正義曰非其人非其才義同而互文也周禮大宗伯以九儀之命正邦國之位一命受職再命受服三命受位四命受器五命賜則六命賜官七命賜國八命作牧九命作伯鄭云一命始見命爲正吏受職治職事也列國之士一命王之下士亦一命再命受服受玄冕之服列國之大夫再命王之中士亦再命然則再命巳上始受衣服未賜之時在官之篋笥也甲胄干戈俱是軍器上言不可輕用兵此言不可妄委人雖文重而意異也官不至其賢正義曰王制云論定然後官之任官然後爵之鄭云官之使之試守也爵之命之也然則治其事謂之官受其位謂之爵官爵一也所從言之異耳賢謂德行能謂才用治事必用能故官云惟其能受位冝得賢故爵云惟其賢詩序云任賢使能周禮郷大夫三年則大比考其德行道藝而興賢者能者鄭云賢者有德行者能者有道藝者是賢能爲異耳私昵謂知其不可而用之惡德謂不知其非而任之戒王使審求人絶私好也有其至厥功正義曰人性尚謙讓而憎自取自有其善則人不以爲善故實善而喪其善自誇其能則人不以爲能故實能而喪其能由其自取故人不與之有其善即伐善也舜美禹云汝惟不矜天下莫與汝爭能汝惟不伐天下莫與汝爭功是言推而不有故名反歸之也無啓寵納侮正義曰君子位髙益恭小人得寵則慢若寵小人則必恃寵慢主無得開小人以寵自納此輕侮也開謂君出恩以寵臣納謂臣入慢以輕主據君而言開納以出入爲文也傳恥過至大非正義曰仲虺之美成湯云改過不吝明小人有過皆惜而不改論語云小人之過也必文恥有過誤而更以言辭文飾之望人不覺其非彌甚故遂成大非也傳祭不至戒之正義曰祭不欲數數則黷黷則不敬禮記祭義文也此一經皆言祭祀之事禮煩亦謂祭𣏌之煩故傳揔云事神禮煩則亂而難行孔以髙宗肜日祖己訓諸王𣏌無豐于尼謂傅說此言爲彼事而發故云髙宗之祀特豐數於近廟故說因而戒之說命下第十四王曰至甘盤正義曰舊學于甘盤謂爲王子時也君奭篇周公仰陳殷之賢臣云在武丁時則有若甘盤然則甘盤於髙宗之時有大功也上篇髙宗免喪不言即求傅說似得說時無賢臣矣蓋甘盤於小乙之丗以爲大臣小乙將崩受遺輔政髙宗之初得有大功及髙宗免喪甘盤巳死故君奭傳曰髙宗即位甘盤佐之後有傅說是言傅說之前有甘盤也但下句言旣乃遯于荒野是學訖乃遯非即位之初從甘盤學也傳旣學至民閒正義曰河是水名水不可居而云入宅于河知在河之洲也釋水云水中可居者曰洲初遯田野後入河洲言其徙居無常也無逸云其在髙宗時舊勞於外爰曁小人言其乆欲使髙宗知民之艱苦故使居民閒也於時蓋未爲太子殷道雖質不可旣爲太子更得與民雜居傳交非至汝敎正義曰爾交修予令其交更修治已也故以交爲非一之義言交互敎之非一事之義邁行釋詁文惟學至乃來正義曰人志本欲求善欲學順人本志學能務是敏疾則其德之修乃自來言務之旣疾則德自來歸已也惟斆至罔覺正義曰敎人然後知困知困必將自強惟敎人乃是學之半言其功半於學也於學之法念終念始常在於學則其德之修漸漸進益無能自覺其進言曰有所益不能自知也傳保衡至之臣正義曰保衡阿衡俱伊尹也君奭傳曰伊尹爲保衡言天下所取安所取平也鄭箋云阿倚衡平也伊尹湯所依倚而取平也故以爲官名又云太甲時曰保衡鄭不見古文太甲云不惠于阿衡故此爲解孔所不用計此阿衡保衡非常人之官名蓋當時特以此名號伊尹也作訓爲起言起而助湯也正長釋詁文髙宗肜日第十五髙宗至之訓正義曰髙宗祭其太祖成湯於肜祭之日有飛雉來升祭之鼎耳而雊鳴其臣祖己以爲王有失德而致此祥遂以道義訓王勸王改修德政史敘其事作髙宗肜日髙宗之訓二篇傳耳不至雊鳴正義曰經言肜日有雊雉不知祭何廟鳴何處故序言祭成湯升鼎耳以足之禘祫與四時之祭祭之明日皆爲肜祭不知此肜是何祭之肜也洪範五事有貌言視聽思若貌不恭言不從視不明聽不聦思不睿各有妖異興焉雉乃野鳥不應入室今乃入宗廟之内升鼎耳而鳴孔以雉鳴在鼎耳故以爲耳不聦之異也洪範五行傳云視之不明時則有羽蟲之孽聽之不聦時則有介蟲之孽言之不從時則有毛蟲之孽貌之不恭時則有鱗蟲之孽思之不睿時則有倮蟲之孽先儒多以此爲羽蟲之孽非爲耳不聦也漢書五行志劉歆以爲鼎三足三公象也而以耳行野鳥居鼎耳是小人將居公位敗宗廟之祀也鄭云鼎三公象也又用耳行雉升鼎耳而鳴象視不明天意若云當任三公之謀以爲政劉鄭雖小異其爲羽蟲之孽則同與孔意異詩云雉之朝雊尚求其雌說文云雊雄雉鳴也雷始動雉乃鳴而雊其頸傳所以訓也亡正義曰名髙宗之訓所以訓髙宗也此二篇俱是祖己之言並是訓王之事經云乃訓于王此篇亦是訓也但所訓事異分爲二篇摽此爲發言之端故以肜日爲名下篇揔諫王之事故名之訓終始互相明也肆命徂后孔歷其名於伊訓之下別爲之傳此髙宗之訓因序爲傳不重出名者此以訓王事同因解文便作傳不爲例也傳祭之至曰繹正義曰釋天云繹又祭也周曰繹商曰肜孫炎曰祭之明日㝷繹復祭也肜者相㝷不絶之意春秋宣八年六月辛巳有事於太廟壬午猶繹榖梁傳曰繹者祭之旦日之享賔也是肜者祭之明日又祭也爾雅因繹祭而本之上丗故先周後商此以上代先後故與爾雅倒也釋天又云夏日復胙郭璞云未見所出或無此一句孔傳不言夏日復胙於義非所須或本無此事也儀禮有司撤上大夫曰儐尸與正祭同日鄭康成注詩鳧鷖云祭天地社稷山川五祀皆有繹祭髙宗至厥事正義曰髙宗旣祭成湯肜祭之日於是有雊鳴之雉在於鼎耳此乃怪異之事賢臣祖已見其事而私自言曰惟先丗至道之王遭遇變異則正其事而異自消也旣作此言乃進言訓王史録其事以爲訓王之端也傳言至至自消正義曰格訓至也至道之王謂用心至極行合於道遭遇變異改修德敎正其事而異自消太戊拱木武丁雊雉皆感變而懼殷道復興是異自消之驗也至道之王當無災異而云遭變消災者天或有譴告使之至道未必爲道不至而致此異且此勸戒之辭不可執文以害意也此經直云祖已曰不知與誰語鄭云謂其黨王肅云言于王下句始言乃訓于王此句未是告王之辭私言告人鄭說是也乃訓至厥德正義曰祖已旣私言其事乃以道訓諫於王曰惟天視此下民常用其義言以義視下觀其爲義以否其下年與民有長者有不長者言與爲義者長不義者短短命者非是天欲夭民民自不修義使中道絕其性命但人有爲行不順德義有過不服聽罪過而不改乃致天罰非天欲夭之也天旣信行賞罰之命正其馭民之德欲使有義者長不義者短王安得不行義事求長命也傳言天至絕命正義曰經惟言有永有不永安知由義者以上句云惟天監下民典厥義天旣以義爲常知命之長短莫不由義故云天之下年與民有義者長無義者不長也民有五常之性謂仁義禮智信也此獨以義爲言者五常指體則別理亦相通義者冝也得其事冝五常之名皆以適冝爲用故稱義可以揔之也民有貴賤貧富愚智好醜不同多矣獨以夭壽爲言者鄭玄云年命者惷愚之人尤愒焉故引以諫王也愒貪也洪範五福以壽爲首六極以短折爲先是年壽者最是人之所貪故祖已引此以諫王也傳不順至不永正義曰傳亦顧上經故不順德言無義也聽謂聽從故以不聽爲不服罪言旣爲罪過而不肯改修也天巳信命正其德言天自信命賞有義罰無義此事必信也天自正其德福善禍淫其德必不差也謂民有永有不永天隨其善惡而報之勸王改過修德以求永也嗚呼至于昵正義曰祖已恐其言不入王意又歎而戒之嗚呼王者主民堂謹敬民事民事無非夭所繼嗣以爲常道者也天以其事爲常王當繼天行之祀禮亦有常無得豐厚於近廟若特豐於近廟是失於常道髙宗豐於近廟欲王服罪改修也傳胤嗣至改修之正義曰釋詁云胤嗣繼也俱訓爲繼是胤得爲嗣嗣亦繼之義也釋詁云即尼也孫炎曰即猶今也尼者近也郭璞引尸子曰恱尼而來遠是尼爲近也尼與昵音義同烝民不能自治立君以主之是王者主民也旣與民爲主當敬愼民事民事無大小無非天所嗣常也言天意欲令繼嗣行之所以爲常道也祭𣏌有常謂犧牲粢盛樽彞俎豆之數禮有常法不當特豐於近廟謂犧牲禮物多也祖已知髙宗豐於近廟欲王因此雊雉之異服罪改修以從禮耳其異不必由豐近而致之也王肅亦云髙宗豐於禰故有雊雉升遠祖成湯廟鼎之異西伯戡黎第十六殷始至戡黎正義曰文王功業稍髙王兆漸著殷之朝廷之臣始畏惡周家所以畏惡之者以周人伐而勝黎邑故也殷臣祖伊見周克黎國之易恐其終必伐殷奔走告受言殷將滅史敘其事作西伯戡黎傳咎惡又云乗勝至見惡正義曰易繫辭云無咎者善補過也則咎是過之別名以彼過而憎惡之故咎爲惡也以其勝黎所以見惡釋其見惡之由是周人勝黎之後始惡之詩毛傳云乗陵也乗駕是加陵之意故乗爲勝也鄭玄云紂聞文王斷虞芮之訟又三伐皆勝而始畏惡之所言據書傳爲說伏生書傳云文王受命一年斷虞芮之質二年伐邘三年伐密須四年伐犬夷五年伐耆六年伐崇七年而崩耆即黎也乗黎之前始言惡周故鄭以伐邘伐密須伐犬夷三伐皆勝始畏惡之武成篇文王誕膺天命九年乃崩則伐國之年不得如書傳所說未必見三伐皆勝始畏之傳祖已後賢臣正義曰此無所出正以同爲祖氏知是其後明能先覺故知賢臣傳受紂至無道正義曰經云奔告于王王無謚號故序言受以明之此及泰誓武成皆呼此君爲受自外書傳皆呼爲紂受即紂也音相亂故字改易耳殷本紀云帝乙崩子辛立是爲帝辛天下謂之紂鄭玄云紂帝乙之少子名辛帝乙愛而欲立焉號曰受德時人傳聲轉作紂也史掌書知其本故曰受與孔大同謚法云殘義損善曰紂殷時未有謚法後人見其惡爲作惡義耳傳戡亦勝也正義曰戡勝釋詁文孫炎曰戡強之勝也西伯戡黎正義曰鄭玄云西伯周文王也時國於𡵨封爲雍州伯也國在西故曰西伯王肅云王者中分天下爲二公揔治之謂之二伯得專行征伐文王爲西伯黎侯無道文王伐而勝之兩說不同孔無明解下傳云文王率諸侯以事紂非獨率一州之諸侯也論語稱三分天下有其二以服事殷謂文王也終乃三分有二豈獨一州牧乎且言西伯對東爲名不得以國在西而稱西伯也蓋同王肅之說傳近王至東北正義曰黎國漢之上黨郡壷關所治黎亭是也紂都朝歌王圻千里黎在朝歌之西故爲近王圻之諸侯也鄭云入紂圻内文王猶尚事紂不可伐其圻内所言圻内亦無文也傳文王至爲周正義曰襄四年左傳云文王率殷之叛國以事紂是率諸侯共事紂也貌雖事紂内秉王心布德行威有將王之意而紂不能制日益強大今復克有黎國迫近王圻似有天助之力故云天巳畢訖殷之王命言殷祚至此而畢將欲化爲周也傳至人至知吉正義曰格訓爲至至人謂至道之人有所識解者也至人以人事觀殷大龜有神靈逆知來物故大龜以神靈考之二者皆無知殷有吉者言必凶也祖伊未必問至人親灼龜但假之以爲言耳傳以紂至多罪正義曰禮記稱萬物本於天人本於祖則天與先王俱是人君之本紂旣自絶於先王亦自絕於天上經言紂自絕先王此言天棄紂互明紂自絶然後天與先王棄絕之故傳申通其意以紂自絶先王故天亦棄之亦者亦先王言先王與天俱棄之也孝經言天子得萬國之歡心以事其先王然後祭則鬼享之今紂旣自絶於先王先王不有安食於天下言紂雖以天子之尊事宗廟宗廟之神不得安食也而王不度知天命所在不知已之性命當盡也而所行不蹈循常法動皆違法言多罪傳摯至也至所言正義曰摯至同音故摯爲至也言天何不下罪誅之恨其乆行虐政欲得早殺之也有大命冝王者何以不至向望大聖之君欲令早伐紂也王之凶禍其如我之所言以王不信故審告之也微子第十七殷旣至少師正義曰殷紂旣暴虐無道錯亂天命其兄微子知紂必亡以作言誥告父師箕子少師比干史敘其事而作此篇也名曰微子而不言作微子者巳言微子作誥以可知而省文也傳錯亂也正義曰交錯是渾亂之義故爲亂也不指言紂惡而言錯亂天命者天生烝民立君以牧之爲君而無君道是錯亂天命爲惡之大故舉此以見惡之極耳傳微圻至無道正義曰微國在圻内先儒相傳爲然鄭玄以爲微與箕俱在圻内孔雖不言箕亦當在圻内也王肅云微國名子爵入爲王卿士肅意蓋以微爲圻外故言入也微子名啓丗家作開避漢景帝諱也啓與其弟仲衍皆是紂之同母庶兄史記稱微仲衍衍亦稱微者微子封微以微爲氏故弟亦稱微猶如春秋之丗虞公之弟稱虞叔祭公之弟稱祭叔微子若非大臣則無假憂紂亦不必須去以此知其爲卿士也傳云去無道者以去見其爲卿士也微子至于今正義曰微子將欲去殷順其去事而言曰父師少師呼二師與之言也今殷國其將不復有治正四方之事言其必滅亡也昔我祖成湯致行其道遂其功業陳列於上丗矣今我紂惟用沈湎酗醟於酒用是亂敗其祖之德於下由紂亂敗之故今日殷人無不小大皆好草竊姦宄雖在朝卿士相師師爲非法度之事朝廷之臣皆有辜罪乃無有一人能秉常得中者在外小人方方各起相與共爲敵讎荒亂如此今殷其没亡若渉大水其無津濟涯岸殷遂喪亡言不復乆也此喪亡於是至於今到必不得更乆也傳父師至而言之正義曰以畢命之篇王呼畢公爲父師畢公時爲太師也周官云太師太傅太保兹惟三公少師少傅少保曰三孤家語云比子官則少師少師是比干知太師是箕子也徧檢書傳不見箕子之名惟司馬彪注莊子云箕子名胥餘不知出何書也周官以少師爲孤此傳言孤卿者孤亦卿也考工記曰外有九室九卿朝焉是三孤六卿共爲九卿也比干不言封爵或本無爵或有而不言也家語云比干是紂之親則諸父知比干是紂之諸父耳箕子則無文宋丗家云箕子者紂親戚也止言親戚不知爲父爲兄也鄭玄王肅皆以箕子爲紂之諸父服虔杜預以爲紂之庶兄旣無正文各以意言之耳微子以紂距諫知其必亡心欲去之故順其去事而言呼二師以告之傳或有至必亡正義曰或者不定之辭其事或當然則是有此事故以或爲有也鄭玄論語注亦云或之言有也不有言無也天子天下之主所以治正四方言殷其不有治正四方之事言將必亡傳我紂至後丗正義曰嗜酒亂德是紂之行故知我我紂也人以酒亂若沈於水故以耽洒爲沈也湎然是齊同之意詩云天不湎爾以酒鄭云大不同汝顔色以酒是湎謂酒變面色湎然齊同無復平時之容也說文云酗醟也然則酗醟一物謂飲酒醉而發怒經言亂敗其德必有所屬上言我祖指謂成湯知言敗亂湯德於後丗也上謂前丗故下爲後丗也傳六卿至中者正義曰士訓事也故卿士爲六卿典事師師言相師效爲非法度之事也止言卿士以貴者尚爾見賤者皆然故王肅云郷士以下轉相師效爲非法度之事也鄭云凡猶皆也傳意亦然以凡爲皆言卿士以下在朝之臣其所舉動皆有辜罪無人能秉常行得中正者曰父師至何其正義曰微子旣言紂亂乃問身之所冝止而復言故別加一曰父師少師更呼而誥之也我念殷亡之故其心發疾生狂吾在家心内耄亂欲遜遯出於荒野今汝父師少師無指滅亡之意告我云殷邦其隕墜則當如之何其救之乎恐其留已共救之也傳我念至愁悶正義曰狂生於心而出於外故傳以出狂爲生狂應璩詩云積念發狂癡此其事也在家思念之深精神益以耄亂鄭玄云耄昬亂也在家不堪耄亂故欲遯出於荒野言愁悶之至詩云駕言出遊以寫我憂亦此意也傳汝無至救之正義曰無指意告我者謂無指殷亡之事告我言殷將隕墜欲留我救之顚謂從上而隕隮謂墜於溝壑皆滅亡之意也昭十三年左傳曰小人老而無子知擠於溝壑矣王肅云隮隮溝壑言此隮之義如左傳也父師至行遯正義曰父師亦順其事而報微子曰王子今天酷毒下災生此昬虐之君以荒亂殷之邦國紂旣沈湎四方化之皆起而沈湎酗醟於酒不可如何小人皆自放恣乃無所畏上不畏天災下不畏賢人違戾其耇老之長與舊有爵位致仕之賢人今殷民乃攘竊祭祀神祇之犧牷牲用以相通容行取食之無災罪之者盜天地大𣏌之物用而不得罪言政亂甚也我又下視殷民所用爲治者民皆讎怨斂聚之道也言重賦傷民民以在上爲讎重賦乃是斂讎也旣爲重賦又急行暴虐此所以益招民怨是乃自召敵讎不懈怠也上下各有罪合於一紂之身言紂化之使然也故使民多瘠病而無詔救之者商今其有滅亡之災我起而受其敗啇其役亡喪滅我無所爲人臣僕言不可別事他人必欲諫取死也我敎王子出奔於外是道也我乆云子賢言於帝乙欲立子不肯我乃病傷子不得立爲王則冝終爲殷後若王子不出則我殷家宗廟乃隕墜無主旣勸之出即與之别云各自謀行其志人人各自獻達於先王我不顧念行遯之事明期與紂俱死傳比干至王子正義曰諮二人而一人荅明心同省文也鄭云少師不荅志在必死然則箕子本意豈必求生乎身若求生何以不去旣不顧行遯明期於必死但紂自不殺之耳若比干意異箕子則別有荅安得黙而不言孔解心同是也微子帝乙元子微子之命有其文也父師呼微子爲王子則父師非王子矣鄭王等以爲紂之諸父當是實也傳天生至如何正義曰荒殷邦者乃是紂也而云天毒降災故言天生紂爲亂本之於天天毒下災也以微子云若之何此荅彼意故言四方化紂沈湎不可如何傳言起至紂故正義曰文在方興沈酗之下則此無所畏畏者謂當時四方之民也民所當畏惟畏天與人耳故知二畏者上不畏天下不畏賢人違戾者長與舊有位人即是不畏賢人故不用其敎紂無所畏此民無所畏謂法紂故也傳自永至政亂正義曰攘竊同文則攘是竊類釋詁云攘因也是因其自來而取之名攘也說文云犧宗廟牲也曲禮云天子以犧牛天子祭牲必用純色故知色純曰犧也周禮牧人掌牧六牲以供祭祀之牲牷以牷爲言必是體全具也故體完曰牷經傳多言三牲知牲是牛羊豕也以犧牷牲三者旣爲俎實則用者簠簋之實謂黍稷稻粱故云器實曰用謂粢盛也禮天曰神地曰祇舉天地則人鬼在其閒矣故揔云盜天地宗廟牲用也訓將爲行相容行食之謂所司相通容使盜者得行盜而食之大祭祀之物物之重者盜而無罪言政亂甚也漢魏以來著律皆云敢盜郊祀宗廟之物無多少皆死爲特重故也傳下視至懈怠正義曰箕子身爲三公下觀丗俗故云下視殷民所用治者謂卿士巳下是治民之官也以紂暴虐務稱上旨皆重賦傷民民旣傷矣則以上爲讎泰誓所謂虐我則讎是也重斂民財乃是聚斂怨讎之道旣爲重斂而又亟行暴虐亟急也急行暴虐欲以威民乃是自召敵讎勤行虐政是不懈怠也傳商其至於道正義曰有災與淪喪一事而重出文者上言商今其有災我興受其敗逆言災雖未至至則己必受禍此言商其淪喪我罔爲臣僕豫言殷滅之後言已不事異姓辭有二意故重出其文我無所爲臣僕言不能與人爲臣僕必欲以死諫紂但箕子之諫值紂怒不甚故得不死耳我敎王子出合於道保全身命終爲殷後使宗廟有主享祀不絶是合其道也丨傳刻病至無王正義曰刻者傷害之義故爲病也吕氏春秋仲冬紀云紂之母生微子啓與仲衍其時猶尚爲妾改而爲妻後生紂紂之父欲立微子啓爲太子太史據法而爭曰有妻之子不可立妾之子故立紂爲後於時箕子蓋謂請立啓而帝乙不聽令追恨其事我乆知子賢言於帝乙欲立子爲太子而帝乙不肯我病子不得立則冝爲殷後傳言將至一途正義曰不肯遯以求生言將與紂俱死也或去或留所執各異皆歸於仁孔子稱殷有三仁焉是皆歸於仁也易繫辭曰君子之道或出或處或黙或語是非一途也何晏云仁者愛人三人行異而同稱仁者以其俱在憂亂寧民尚書正義卷第九計一萬八千五百七十八字
