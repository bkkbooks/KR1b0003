  text: 尚書正義卷第六
  hash: sha256:7b13f9038264e468af592242784f781571058db3ac4d6af77783d4e0b3a1b6d8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_006-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔頴達奉勑撰禹貢第夏書禹別至作貢正義曰禹分別九州之界隨其所至之山刋除其木深其大川使得注海水害旣除地復本性任其土地所有定其貢賦之差史録其事以爲禹貢之篇傳分其圻界正義曰詩傳云圻疆也分其疆界使有分限計九州之境當應舊定而云禹別者以堯遭洪水萬事改新比為作貢生文故言禹別耳傳刋其木深其流正義曰經言隨山刋木序以較略爲文直言隨山不云隨山爲何事故傳明之隨山刋其木也濬川深其流也隨山本爲濬川故連言之傳任其至是功正義曰九州之工物産各里任其土地所有以定貢賦之差旣任其所有亦因其肥瘠多少不同制爲差品鄭玄云任土謂定其肥墝之所生是言用肥瘠多少爲差也賦者自上稅下之名謂治田出糓故經定其差等謂之厥賦貢者從下獻上之稱謂以所出之糓市其土地所生異物獻其所有謂之厥貢雖以所賦之物爲貢用賦物不盡有也亦有全不用賦物直隨地所有採取以爲貢者此之所貢即與周禮太宰九貢不殊但周禮分之爲九耳其賦與周禮九賦全異彼賦謂口率出錢不言作賦而云作貢者取下供上之義也諸序皆言作某篇此序不言作禹貢者以發首言禹句末言貢篇名足以顯矣百篇之序此類有三微子作誥父師少師不言作微子仲虺作誥不言作仲虺之誥與此篇皆爲理足而略之也又解篇在此之意此治水是堯末時事而在夏書之首禹之得王天下以是治水之功故以爲夏書之首此篇史述時事非是應對言語當是水土旣治史即録此篇其初必在虞書之内蓋夏史抽入夏書或仲尼始退其第事不可知也禹貢正義曰此篇史述爲文發首奠髙山大川言禹治九州之水水害旣除定山川攻秩與諸州爲引序自導岍至嶓冡條說所治之山言其首尾相及也自導弱水至導洛條說所治之水言其發源注海也自九州攸同至成賦中邦揔言水土旣平貢賦得常之事也錫土姓三句論天子於土地布行德敎之事也自五百里甸服至二百里流揔言四海之内量其逺近分爲五服之事也自東漸于海以下揔結禹功成受錫之事也傳禹制九州貢法正義曰禹制貢法故以禹貢名篇貢賦之法其來久矣治水之後更復改新言此篇貢法是禹所制非禹始爲貢也禹敷至大川正義曰言禹分布治此九州之土其治之也隨行所至之山除木通道決流其水水土旣平乃定其髙山大川謂定其次秩尊卑使知祀禮所視言禹治其山川使復常也傳洪水至通道正義曰詩傳云汎汎流也汎是水流之貌洪水流而汎溢浸壞民居故禹分布治之知者文十八年左傳云舉八凱使主后土則伯益之輩佐禹多矣禹必身行九州規謀設法乃使佐已之人分布治之於時平地盡爲流潦鮮有陸行之路故將欲治水隨行山林斬木通道鄭云必隨州中之山而登之除木爲道以望觀所當治者則規其形而度其功焉是言禹登山之意也孟子曰禹三過門不入其家門猶三過之則其餘所歷多矣來而復往非止一處故言分布治之傳奠定至所視正義曰禮定器於地通名爲奠是奠爲定也山之髙者莫髙於岳川之大者莫大於瀆故言髙山五岳謂嵩岱衡華恒也大川四瀆謂江河淮濟也此舉髙大爲言卑小亦定之矣舜典云望秩於山川故言定其差秩定其大小次敘也定其祀禮所視謂王制所云五岳視三公四瀆視諸侯其餘視伯子男往者洪水滔天山則爲水所包川則水皆汎溢祭祀禮廢今始定之以見水土平復舊制地經云荆岐旣旅蔡蒙旅平九山刋旅是次秩旣定故旅祭之兾州正義曰九州之次以治爲先後以水性下流當從下而泄故治水皆從下爲始兾州帝都於九州近北故首從奠起而東南次兖而東南次靑而南次徐而南次揚從揚而西次荆從荆而北次豫從豫而西次梁從梁而北次雍雍地最髙故在後也自兖巳下皆準地之形勢從下向髙從東向西靑徐揚三州並爲東偏雍州髙於豫州豫州髙於靑徐雍豫之水從靑徐而入海也梁髙於荆荆髙於揚梁荆之水從揚而入海也兖州在兾州東南兾兖二州之水各自東北入海也兾州之水不經兖州以兾是帝都河爲大患故先從兾起而次治兖若使兾州之水東入兖州水無去處治之無益雖是帝都不得先也此經大體每州之始先言山川後言平地靑州梁州先山後川徐州雍州先川後山兖揚荆豫有川無山揚豫不言平地兾州田賦之下始言恒衛旣從史以大略爲文不爲例也每州之下言水路相通通向帝都之道言禹每州事了入朝以白帝也傳堯所至於書正義曰史傳皆云堯都平陽五子之歌曰惟彼陶唐有此兾方是兾州堯所都也諸州兾爲其先治水先從兾起爲諸州之首記其役功之法旣載者言先施貢賦役載於書也謂計人多少賦功配役載於書籍然後徴而用之以治水也兾州如此則餘州亦然故於此特記之也王肅云言巳賦功屬役載於書籍傳意當然鄭云載之言事事謂作徒役也禹知所當治水又知用徒之數則書於䇿以告帝徴役而治之惟解載字爲異其意亦同孔也傳壷口至而西正義曰史記稱髙祖入咸陽蕭何先收圖籍則秦焚詩書圖籍皆在孔君去漢初七八十年耳身爲武帝博士必當具見圖籍其山川所在必是驗實而知壷口在兾州梁岐在雍州當時疆界爲然也此於兾州之分言及雍州之山者從東循山治水而西故也鄭云於此言治梁及岐者蓋治水從下起以襄水害易也班固作漢書地理志據前漢郡縣言山川所在志云壷口在河東北屈縣東南應劭云已有南屈故稱北屈梁山在左馮翊夏陽縣西北岐山在右扶風美陽縣西北然則壷口西至梁山梁山西至岐山從東而向西言之也經於壷口之下言治者孔意蓋云欲見上下皆治也傳髙平至曰陽正義曰太原原之大者漢書以爲郡名傳欲省文故云髙平曰太原今以爲郡名即晉陽縣是也釋地云廣平曰原髙平曰陸孔以太原地髙故言髙平其地髙而廣也下文導山云壷口雷首至于大岳知此岳即太岳也屬河東郡在太原西南也地理志云河東彘縣東有霍太山此彘縣周厲王所奔順帝改爲永安縣周禮職方氏兾州其山鎭曰霍山即此太岳是也山南見日故山南曰陽此說循理平地言從太原至岳山之南故云岳陽也傳覃懷至衡漳正義曰地理志河内郡有懷縣在河之北蓋覃懷二字共爲一地故云近河地名衡即古横字漳水橫流入河故云横漳漳在懷北五百餘里從覃懷致功而北至橫漳也地理志云淸漳水岀上黨沾縣大黽谷東北至㴾海阜城縣入河過郡五行千六百八十里此沾縣因水爲名志又云沾水出壷關志又云濁漳水出長子縣東至鄴縣入淸漳鄭玄亦云横漳漳水橫流王肅云衡漳二水名傳無塊至而壤正義曰九章算術穿地四爲壤五壤爲息土則壤是土和緩之名故云無塊曰壤此土本色爲然水去土復其性色白而壤雍州色黃而壤豫州直言壤不言其色蓋州内之土不純一色故不得言色也傳賦謂至之賦正義曰以文承厥土之下序云任土作貢又賦者稅斂之名往者洪水爲災民皆墊溺九州賦稅蓋亦不行水災旣除土復本性以作貢賦之差故云賦謂土地所生以供天子謂稅穀以供天子鄭玄云此州入穀不貢是也因九州差爲九等上上是第一也交錯是閒雜之義故錯爲雜也顧氏云上上之下即次上中故云雜出第二之賦也孟子稱稅什一爲正輕之於堯舜爲大貃小貃重之於堯舜爲大桀小桀則此時亦什一稅俱什一而得爲九等差者人功有強弱收穫有多少傳以荆州田第八賦第三爲人功修也雍州田第一賦第六爲人功少也是據人功多少揔計以定差此州以上上爲正而雜爲次等言出上上時多而上中時少也多者爲正少者爲雜故云第一此州言上上錯者少在正下故先言上上而後言錯豫州言錯上中者少在正上故先言錯而後言上中揚州云下上上錯不言錯下上者以本設九等分三品爲之上中下下上本是異品故變文言下上上錯也梁州云下中三錯者梁州之賦凡有三等其出下中時多故以下中爲正上有下上下有下下三等雜出故言三錯足明雜有下上下下可知也此九等所較無多諸州相準爲等級耳此計大率所得非上科定也但治水據田責其什一隨土豐瘠是上之任土而下所獻自有差降即以差等爲上之定賦也然一升一降不可常同兾州自出第二與豫州同時則無第一之賦豫州與兾州第一同時則無第二之賦或容如此事不可恒鄭玄云賦之差一井上上出九夫稅下下出一夫稅通率九州一井稅五夫如鄭此言上上出稅九倍多於下下鄭詩箋云井稅一夫其田百畝若上上一井稅一夫則下下九井乃出一夫稅太少矣若下下井稅一夫則上上全入官矣豈容輕重頓至是乎傳田之至第五正義曰鄭玄云田著髙下之等者當爲水害備也則鄭謂地形髙下爲九等也王肅云言其土地各有肥瘠則肅定其肥瘠以爲九等也如鄭之義髙處地瘠出物旣少不得爲上如肅之義肥處地下水害所傷出物旣少不得爲上故孔云髙下肥瘠共相叅對以爲九等上言敷土此言厥田田土異者鄭玄云地當隂陽之中能吐生萬物者曰土據人功作力競得而田之則爲之田田土異名義當然也傳二水至耕作正義曰二水汎溢漫流巳治從其故道故今巳可耕作也靑州濰淄其道與此恒衞旣從同是從故道也荆州雲土夢作乂與此大陸旣作同是水治可耕作也其文不同史異辭耳無義例也壷口與雍州之山連文故傳言壷口在兾州此無所嫌故不言在兾州以下皆如此也地理志云恒水出常山上曲陽縣東入滱水衞水出常山靈壽縣東北入滹沲大陸在鉅鹿縣北釋地十藪云晉有大陸孫炎等皆云今鉅鹿縣北廣河澤也郭璞云廣河猶大陸以地名言之近爲是也春秋魏獻子畋于大陸焚焉還卒于寗杜氏春秋說云嫌鉅鹿絶逺以爲汲郡修武縣吴澤也寗即修武也然此二澤相去甚逺所以得爲大陸者以爾雅廣平曰陸但廣而平者則名大陸故異所而同名焉然此二澤地形卑下得以廣平爲陸者澤雖卑下旁帶廣平之地故統名焉故大陸澤名廣河以旁近大陸故也傳海曲至害除正義曰孔讀鳥爲島島是海中之山九章筭術所云海島邈絕不可踐量是也傳云海曲謂之島謂其海曲有山夷居其上此居島之夷常衣鳥獸之皮爲遭洪水衣食不足今還得衣其皮服以明水害除也鄭玄云鳥夷東方之民搏食鳥獸者也王肅云鳥夷東北夷國名也與孔不同傳碣石至餘州正義曰地理志云碣石山在北平驪城縣西南是碣石爲海畔山也鄭云戰國䇿碣石在九門縣今屬常山郡蓋別有碣石與此名同今驗九門無此山也下文導河入于海傳云入於渤海渤海之郡當以此海爲名計渤海北距碣石五百餘里河入海處逺在碣石之南禹行碣石不得入於河也蓋逺行通水之處北盡兾州之境然後南迴入河而逆上也夾右者孔云夾行此山之右則行碣石山西南行入河在碣石之右故云夾右也顧氏亦云山西曰右鄭玄云禹由碣石山西北行盡兾州之境還從山東南行入河鄭以北行則東爲右南行西爲右故夾山兩旁山常居右與孔異也梁州傳云浮東渡河而還帝都白所治也則入河逆上爲還都白所治也禹之治水必每州巡行度其形勢計其人功施設規模指授方略令人分布並作還都白帝所知於時帝都近河故於每州之下皆言浮水達河記禹還都之道也兾兖徐荆豫梁雍州各自言河惟靑揚二州不言河耳兖州云浮于濟漯達于河故青州直云達于濟徐州云浮于淮泗達于河故揚州云達于淮泗皆記禹入河之道也王肅云凡每州之下說諸治水者禹功主於治水故詳記其所治之州往還所乗涉之水名肅惟不言還都白帝亦謂爲治水故浮水也鄭玄以爲治水旣畢更復行之觀地肥瘠定貢賦上下其意與孔異也八州皆言境界而此獨無故解之此州帝都不說境界以餘州所至則可知也兖州云濟河自東河以東也豫州云荆河自南河以南也雍州云西河自西河以西也明東河之西西河之東南河之北是兾州之境也馬鄭皆云兾州不書其界者時帝都之使若廣大然文旣局以州名復何以見其廣大是妄說也又解餘州先田後賦此州先賦後田亦如境界殊於餘州也言殊者當爲田賦以收穫爲差田以肥瘠爲等若田在賦上則賦冝從田田美則冝賦重無以見人功修否故令賦先於田也以見賦由人功此州旣見此理餘州從而可知皆令賦在田下欲見賦從田出爲此故殊於餘州也鄭玄云此州入糓不貢下云五百里甸服傳云爲天子服治田是田入糓故不獻貢篚差異於餘州也甸服止方千里兾之北土境界甚遥逺都之國必有貢篚舉大略而言也兖州傳東南至距河正義曰此下八州發首言山川者皆謂境界所及也據謂跨之距至也濟河之閒相去路近兖州之境跨濟而過東南越濟水西北至東河也李巡注爾雅解州名云兩河閒其氣情性相近故曰兾兾近也濟河閒其氣專質體性信謙故云兖兖信也淮海閒其氣寛舒稟性安徐故曰徐徐舒也江南其氣燥勁厥性輕揚故曰揚揚輕也荆州其氣燥剛稟性彊梁故曰荆荊彊也河南其性安舒厥性寛豫故曰豫豫舒也河西其氣蔽壅受性急凶故云雍雍壅也爾雅九州無梁靑故李巡不釋所言未必得其本也傳河水至北是正義曰河自大陸之北敷爲九河謂大陸在兾州嫌九河亦在兾州故云在此州界也河從大陸東畔北行而東北入海兾州之東境至河之西畔水分大河東爲九道故知在兖州界平原以北是也釋水載九河之名云徒駭太史馬頰覆釡胡蘇簡絜鉤盤鬲津李巡曰徒駭禹䟽九河以徒衆起故云徒駭太史禹大使徒衆通其水道故曰太史馬頰河勢上廣下狹狀如馬頰也覆釡水中多渚往往而處形如覆釡胡蘇其水下流故曰胡蘇胡下也蘇流也簡大也河水深而大也絜言河水多山石治之苦絜絜苦也鉤盤言河水曲如鉤屈折如盤也鬲津河水狹小可鬲以爲津也孫炎曰徒駭禹䟽九河用功雖廣衆懼不成故曰徒駭胡蘇水流多散胡蘇然其餘同李巡郭璞云徒駭今在成平東光縣今有胡蘇亭覆釡之名同李巡餘名皆云其義未詳計禹陳九河云復其故道則名應先有不冝徒駭太史因禹立名此郭氏所以未詳也或九河雖舊有名至禹治水更别立名即爾雅所云是也漢書溝洫志成帝時河隄都尉許商上書曰古記九河之名有徒駭胡蘇鬲津今見在成平東光鬲縣界中自鬲津以北至徒駭其閒相去二百餘里是知九河所在徒駭最北鬲津最南蓋徒駭是河之本道東出分爲八枝也許商上言三河下言三縣則徒駭在成平胡蘇在東光鬲津在鬲縣其餘不復知也爾雅九河之次從北而南旣知三河之處則其餘六者太史馬頰覆釡在東光之北成平之南簡絜鉤盤在東光之南鬲縣之北也其河塡塞時有故道鄭玄云周時齊桓公塞之同爲一河今河閒弓髙以東至平原鬲津往往有其遺處春秋緯寶乾圖云移河爲界在齊吕塡閼八流以自廣鄭玄蓋據此文爲齊桓公塞之也言閼八流拓境則塞其東流八枝并使歸於徒駭也傳雷夏至此澤正義曰洪水之時髙原亦水澤不爲澤雷夏旣澤髙地水盡此復爲澤也於澤之下言灉沮㑹同謂二水㑹合而同入此澤也地理志云雷澤在濟隂城陽縣西北桑土至宅土正義曰冝桑之土旣得桑養蠶矣洪水之時民居丘上於是得傳治水至州同正義曰作者役功作務謂治水也治水十三年乃有賦法始得貢賦與他州同也他州十二年此州十三年比於他州最在後也堯典言鯀治水九載績用不成然後堯命得舜舜乃舉禹治水三載功成堯即禪舜此言十三載者并鯀九載數之祭法云禹能脩鯀之功明鯀巳加功而禹因之也此言十三載者記其治水之年言其水害除耳非言十三年内皆是禹之治水施功也馬融曰禹治水三年八州平故堯以爲功而禪舜是十二年而八州平十三年而兖州平兖州平在舜受終之年也傳地冝至貢焉正義曰任土作貢此州貢漆知地冝漆林也周禮載師云漆林之征故以漆林言之綺是織繒之有文者是綾錦之別名故云錦綺之屬皆是織而有文者也篚是入貢之時盛在於篚故云盛之筐篚而貢焉鄭玄云貢者百功之府受而藏之其實於篚者入於女功故以貢篚別之歷檢篚之所盛皆供衣服之用入於女功如鄭言矣檿絲中琴瑟之絃亦是女功所爲也織貝鄭玄以爲織如貝文傳謂織爲細紵貝爲水物則貝非服飾所須蓋恐其損缺故以筐篚盛之也諸州無厥篚者其諸州無入篚之物故不貢也漢丗陳留襄邑縣置服官使制作衣服是兖州綾錦美也傳順流至曰達正義曰地理志云漯水出東郡東武陽縣至樂安千乗縣入海過郡三行千二十里其濟則下文具矣是濟漯爲二水名也言因水入水曰達當謂從水入水不須舎舟而陸行也揚州云㳂于江海達于淮泗傳云㳂江入海自海入淮自淮入泗是言水路相通得乗舟經達也案靑州云浮于汶達于濟經言濟㑹于汶浮汶得達濟也此云浮于濟漯達于河從漯入濟自濟入河徐州云浮于淮泗達于河蓋以徐州北接靑州旣浮淮泗當浮汶入濟以達于河也靑州傳東北至距岱正義曰海非可越而言據者東萊東境之縣浮海入海曲之閒靑州之境非至海畔而巳故言據也漢末有公孫度者竊據遼東自號靑州刺史越海收東萊諸郡堯時靑州當越海而有遼東也舜爲十二州分靑州爲營州營州即遼東也傳嵎夷至故道正義曰嵎夷地名即堯典宅嵎夷是也嵎夷萊夷和夷爲地名淮夷爲水名島夷爲狄名皆觀文爲說也略是簡易之義故用功少爲略也地理志云濰水出琅邪箕屋山北至都昌縣入海過郡三行五百二十里淄水出泰山萊蕪縣原山東北至千乗博昌縣入海傳濵涯至斥鹵正義曰濵涯常訓也說文云鹵鹹地也東方謂之斥西方謂之鹵海畔逈闊地皆斥鹵故云廣斥言水害除復舊性也傳畎谷至貢之正義曰釋水云水注川曰谿注谿曰谷谷是兩山之閒流水之道㽗言畎去水故言谷也怪石竒怪之石故云好石似玉也枲麻也鈆錫也岱山之谷有此五物美於他方所有故貢之也傳檿桑至瑟弦正義曰釋木云檿桑山桑郭璞曰柘屬也檿絲是蠶食檿桑所得絲韌中琴瑟弦也浮于汶正義曰地理志云汶水出泰山萊蕪縣原山西南入濟也徐州傳二水至種藝正義曰乂訓治也故云二水已治地理志云沂水出泰山蓋縣臨樂子山南至下邳入泗過郡五行六百里淮出桐柏山發源逺矣於此州言之者淮水至此而大爲害尤甚喜得其治故於此記之地理志云蒙山在泰山蒙隂縣西南羽山在東海祝其縣南詩云藝之荏菽故藝爲種也傳大野至可耕正義曰地理志云大野澤在山陽鉅野縣北鉅即大也檀弓云汚其宫而豬焉又澤名孟豬停水處也故云水所停曰豬往前漫溢今得豬水爲澤也東原即今之東平郡也致功而地平言其可耕也傳土黏至叢生正義曰戠埴音義同考工記用土爲瓦謂之搏埴之工是埴謂黏土故土黏曰埴易漸卦彖云漸進也釋言云苞稹也孫炎曰物叢生曰苞齊人名曰稹郭璞曰今人呼叢緻者爲稹漸苞謂長進叢生言其美也傳王者至四方正義曰傳解貢土之意王者封五色土以爲社若封建諸侯則各割其方色土與之使歸國立社其上燾以黃土燾覆也四方各依其方色皆以黃土覆之其割土與之時苴以白茅用白茅裹土與之必用白茅者取其絜淸也易稱藉用白茅茅色白而絜美韓詩外傳云天子社廣五丈東方靑南方赤西方白北方黒上冒以黃土將封諸侯各取其方色土苴以白茅以爲社明有土謹敬絜淸也蔡邕獨斷云天子太社以五色土爲壇皇子封爲王者授之太社之上以所封之方色苴以白茅使之歸國以立社謂之茅社是必古書有此說故先儒之言皆同也傳夏翟至琴瑟正義曰釋鳥云翟山雉此言夏翟則夏翟共爲雉名周禮立夏采之官取此名也周禮司常云全羽爲旞析羽爲旌用此羽爲之故云羽中旌旄也地理志云東海下邳縣西有葛嶧山即此山也傳泗水至美魚王義曰泗水旁山而過石爲泗水之涯石在水旁水中見石似若水上浮然此石可以爲磬故謂之浮磬也貢石而言磬者此石宜爲磬猶如砥礪然也蠙是蚌之別名此蠙出珠遂以蠙爲珠名蠙之與魚皆是水物而以淮夷冠之知淮夷是二水之名淮即四瀆之淮也夷蓋小水後來竭涸不復有其處耳王肅亦以淮夷爲水名鄭玄以爲準水之上夷民獻此珠與魚北地理志泗水岀濟隂乗氏縣東南至臨淮睢陵縣入淮行千一百一十里也傳玄黒至當細正義曰篚之所盛例是衣服之用此單言玄玄必有質玄是黒色之別名故知玄是黒繒也史記稱髙祖爲義帝發喪諸侯皆縞素是縞爲白繒也揚州傳彭蠡至此澤正義曰彭蠡是江漢合處下云導漾水南入于江東匯爲彭蠡是也日之行也夏至漸南冬至漸北鴻鴈之屬九月而南正月而北左思蜀都賦所云木落南翔冰泮北徂是也日陽也此鳥南北與日進退隨陽之鳥故稱陽鳥冬月所居於此彭蠡之澤也傳震澤至震澤正義曰地理志云㑹稽吴縣故周泰伯所封國也具區在西古文以爲震澤是吴南大湖名蓋縣治居澤之東北故孔傳言南志言西大澤畜水南方名之曰湖三江旣入此湖也治水致功令江入此澤故致定爲震澤也下傳云自彭蠡江分爲三入震澤遂爲北江而入海是孔意江從彭蠡而分爲三又共入震澤從震澤復分爲三乃入海鄭云三江分於彭蠡爲三孔東入海其意言三江旣入入海耳不入震澤也又案周禮職方揚州藪曰具區浸曰五湖五湖即震澤若如志云具區即震澤則浸藪爲一案餘州浸藪皆異而揚州同者蓋揚州浸藪同處論其水謂之浸指其澤謂之藪傳篠竹箭簜大竹正義曰釋草云篠竹箭郭璞云別二名也又云簜竹李巡曰竹節相去一大曰簜孫炎曰竹闊節者曰簜郭璞云竹别名是篠爲小竹簜爲大竹傳少長曰夭喬髙也正義曰夭是少長之貌詩曰桃之夭夭是也喬髙釋詁文詩曰南有喬木是也傳金銀銅也正義曰金旣揔名而云三品黃金以下惟有白銀與銅耳故爲金銀銅也釋器云黃金謂之璗其美者謂之鏐白金謂之銀其美者謂之鐐郭璞曰此皆道金銀之別名及其美者也鏐即紫磨金也鄭玄以爲金三品者銅三色也傳瑶琨皆美玉正義曰美石似玉者也玉石其質相類美惡别名也王肅云瑶琨美石次玉者也傳齒象至豫章正義曰詩云元龜象齒知齒是象牙也說文云齒口斷骨也牙壯齒也隱五年左傳云齒牙骨角牙齒小別統而名之齒亦牙也考工記犀甲七屬兕甲六屬宣二年左傳云犀兕尚多棄甲則那是甲之所用犀革爲上革之所美莫過於犀知革是犀皮也說文云獸皮治去其毛爲革革與皮去毛爲異耳說文云羽鳥長毛也知羽是鳥羽南方之鳥孔雀翡翠之屬其羽可以爲飾故貢之也說文云犛西南夷長旄牛也此犛牛之尾可爲旌旗之飾經傳通謂之旄牧誓云右秉白旄詩云建旐設旄皆謂此牛之尾故知毛是旄牛尾也直云惟木不言木名故言楩梓豫章此三者是揚州美木故傳舉以言之所貢之木不止於此傳南海至葛越正義曰上傳海曲謂之㠀知此㠀夷是南海㠀上之夷也釋草云卉草舎人曰凡百草一名卉知卉服是草服葛越也葛越南方布名用葛爲之左思吴都賦云蕉葛升越弱於羅紈是也兾州云㠀夷皮服是夷自服皮皮非所貢也此言㠀夷卉服亦非所貢也此與萊夷作牧並在貢篚之閒古史立文不次也鄭玄云此州下濕故衣草服貢其服者以給天子之官與孔異也傳織細至水物正義曰傳以貝非織物而云織貝則貝織異物織是織而爲之揚州紵之所出此物又以篚盛之爲衣服之用知是細紵謂細紵布也釋魚之篇貝有居陸居水此州下濕故云水物釋魚有玄貝貽貝餘貾黃白文餘泉白黃文當貢此有文之貝以爲器物之飾也鄭玄云貝錦名詩云萋兮斐兮成是貝錦凡爲織者先染其絲乃織之則文成矣禮記曰士不衣織與孔異也傳小曰至不常正義曰橘柚二果其種本別以實相比則柚大橘小故云小曰橘大曰柚猶詩傳云大曰鴻小曰鴈亦別種也此物必須裹送故云其所包裹而送之以須之有時故待錫命乃貢言不常也文在篚下以不常故耳荆州納錫大龜豫州錫貢磬錯皆爲非常並在篚下荆州言包傳云橘柚也文在篚上者荆州橘柚爲善以其常貢此州則不常也王肅云橘與柚錫其命而後貢之不常入當繼荆州乏無也鄭云有錫則貢之此州有錫而貢之或時無則不貢錫所以柔金也周禮考工記云攻金之工掌執金錫之齊故也傳順流至入泗正義曰文十年左傳云㳂漢泝江泝是逆㳂是順故順流而下曰㳂㳂江入海順也自海入淮自淮入泗逆也荆州傳北據至之陽正義曰此州北界至荆山之北故言據也南及衡山之陽其境過衡山也以衡是大山其南無復有名山大川可以爲記故言陽見其南至山南也傳二水至宗尊也正義曰周禮大宗伯諸侯見天子之禮春見曰朝夏見曰宗鄭云朝猶朝也欲其來之早也宗尊也欲其尊王也朝宗是人事之名水無性識非有此義以海水大而江漢小以小就大似諸侯歸於天子假人事而言之也詩云沔彼流水朝宗於海毛傳云水猶有所朝宗朝宗是假人事而言水也老子云滄海所以能爲百谷王者以其下之是百川以海爲宗鄭云江水漢水其流遄疾又合爲一共赴海也猶諸侯之同心尊天子而朝事之荆楚之域國有道則後服國無道則先彊故記其水之義以著人臣之禮傳江於至之中正義曰傳以江是此水大名九江謂大江分而爲九猶大河分爲九河故言江於此州之界分爲九道訓孔爲甚殷爲中言甚得地勢之中也鄭云殷猶多也九江從山谿所出其孔衆多言治之難也地理志九江在今廬江潯陽縣南皆東合爲大江如鄭此意九江各自別源其源非大江也下流合於大江耳然則江以南水無大小俗人皆呼爲江或從江分出或從外合來故孔鄭各爲別解應劭注地理志云江自潯陽分爲九道符於孔說潯陽記有九江之名一曰烏江二曰蜯江三曰烏白江四曰嘉靡江五曰畎江六曰源江七曰廩江八曰提江九曰菌江雖名起近代義或當然傳沱江至故道正義曰下文㞴山導江東別爲沱是沱爲江之別名也經無潛之本源故直云水名釋水云水自江出爲沱漢爲潛鄭注此旣引爾雅乃云今南郡枝江縣有沱水其尾入江耳首不於江出也華容有夏水首出江尾入汚蓋此所謂沱也潛則未聞象類此解荆州之沱潛發源此州若如鄭言此水南流不入荆州界非此潛也此下梁州注云二水亦謂自江漢出者地理志在今蜀郡郫縣江沱及漢中安陽皆有沱水潛水其尾入江漢耳首不於此出江源有􅗪江首出江南至揵爲武陽又入江豈沱之類與潛蓋漢西出嶓冡東南至巴郡江州入江行二千七百六十里此解梁州之沱潛也郭璞爾雅音義云沱水自蜀郡都水縣揃山與江別而更流璞又云有水從漢中沔陽縣南流至梓潼漢壽入太穴中通峒山下西南潛出一名沔水舊俗云即禹貢潛也郭璞此言亦解梁州沱潛與鄭又異然地理志及鄭皆以荆梁二州各有沱潛又郭氏所解沱潛惟據梁州不言荆州之沱潛而孔梁州注云沱潛發源此州入荆州以二州沱潛爲一者然彼州山水古今不可移易孔爲武帝博士地理志無容不知蓋以水從江漢出者皆曰沱潛但地勢西髙東下雖於梁州合流還從荆州分出猶如濟水入河還從河出故孔舉大略爲發源梁州耳傳雲夢至之治正義曰昭三年左傳楚子與鄭伯田于江南之夢是雲夢之澤在江南也地理志南郡華容縣南有雲夢澤杜預云南郡枝江縣西有雲夢城江夏安陸縣亦有雲夢或曰南郡華容縣東南有巴丘湖江南之夢雲夢一澤而每處有名者司馬相如子虛賦云雲夢者方八九百里則此澤跨江南北每處名存焉定四年左傳稱楚昭王寢于雲中則此澤亦得單稱雲單稱夢經之土字在二字之閒蓋史文兼上下也此澤旣大其内有平土有髙丘水去可爲耕作畎畝之治傳土所至州同正義曰與揚州同而揚州先齒革此州先羽毛者蓋以善者爲先由此而言之諸州貢物多種其次第皆以當州貴者爲先也傳榦柘至曰栝正義曰榦爲弓榦考工記云弓人取榦之道也以柘爲上知此榦是柘也釋木云栝柏葉松身陸機毛詩義䟽云杶㯉栲漆相似如一則杶似㯉漆也杶栝柏皆木名也以其所施多矣柘木惟用爲弓榦弓榦莫若柘木故舉其用也傳砥細至朱類正義曰砥以細密爲名礪以麤糲爲稱故砥細於礪皆磨石也鄭云礪磨刀刃石也精者曰砥魯語曰肅愼氏貢楛矢石砮賈逵云砮矢鏃之石也故曰砮石中矢鏃丹者丹砂故云朱類王肅云丹可以爲采傳箘簵至稱善正義曰箘簵美竹當時之名猶然鄭云箘簵䉁風也竹有二名或大小異也箘簵是兩種竹也肅愼氏貢楛矢知楛中矢榦三物皆出雲夢之澤當時驗之猶然經言三邦厎貢知近澤三國致此貢也文續厥名則其物特有美名故云其名天下稱善鄭玄以厥名下屬包匭菁茅傳橘柚正義曰包下言匭菁茅說文云匚受物之器象形也凡匚之屬皆從匚匱匣之字皆從匚匭亦從匚故匭是匣也菁茅旣以匭盛非所包之物明包必有裹也此州所出與揚州同揚州厥包橘柚知此包是橘柚也王肅云揚州厥包橘柚從省而可知也傳匭匣至縮酒正義曰匣是匱之别名匱之小者菁茅所盛不須大匱故用匣也周禮醢人有菁菹鹿臡故知菁以爲淔鄭云菁􅕴菁也蓂菁處處皆有而令此州貢者蓋以其味善也僖四年左傳齊桓公責楚云爾貢包茅不入王祭不供無以縮酒是茅以縮酒也郊特牲云縮酒用茅明酌也鄭注云以茅縮酒也周禮甸師云祭祀供蕭茅鄭興云蕭字或爲莤莤讀爲縮束茅立之祭前酒沃其上酒滲下若神飲之故謂之縮杜預解左傳用鄭興之說未知誰同孔旨特令此州貢茅茅當異於諸處杜預云茅之爲異未審也或云茅有三脊案史記齊桓公欲封禪管仲覩其不可窮以辭因設以無然之事云古之封禪江淮之閒三脊茅以爲藉此乃懼桓公耳非荆州所有也鄭玄以菁茅爲一物匭猶纏結也菁茅之有毛刺者重之故旣包裹而又纏結也傳此州至綬類正義曰釋器云三染謂之纁李巡云三染其色巳成爲絳纁絳一名也考工記云三入爲纁五入爲緅七入爲緇鄭云染纁者三入而成入再染以黒則爲緅又再染以黒則爲緇玄色在緅緇之閒其六入者是染玄纁之法也此州染玄纁色善故令貢之說文云璣珠不圎者故爲珠類玉藻說佩玉所懸者皆云組綬是組綬相類之物也傳尺二至納之正義曰史記龜䇿傳云龜千歳滿尺二寸漢書食貨志云元龜距髯長尺二寸故以尺二寸爲大龜冠以九江知出九江水中也文在篚下而言納錫是言龜不常用故錫命乃納之言此大龜錫命乃貢之也浮于江沱潛漢正義曰浮此四水乃得至洛本或潛下有于誤耳豫州傳伊出至入河正義曰地理志云伊水出弘農盧氏縣東熊耳山東北入洛洛水出弘農上洛縣冡領山東北至鞏縣入河瀍水出河南榖城縣潜亭北東南入洛㵎水出弘農新安縣東南入洛志與傳異者熊耳山在陸渾縣西冢領山在上洛縣境之内沔池在新安縣西穀城潛亭北此即是河南境内之北山也志詳而傳略所據小異耳伊􅬖㵎三水入洛合流而入河言其不復爲害也傳滎澤至遏豬正義曰沇水入河而溢爲滎滎是澤名洪水之時此澤水大動成波浪此澤其時波水巳成遏豬言壅遏而爲豬畜水而成澤不濫溢也鄭云今塞爲平地滎陽民猶謂其處爲滎澤在其縣東言在滎澤縣之東也馬鄭王本皆作滎播謂此澤名滎播春秋閔二年衛侯及狄人戰于滎澤不名播也鄭玄謂衞狄戰在此地社預云此滎澤當在河北以衞敗方始渡河戰處必在河北蓋此澤跨河南北多而得名耳傳菏澤至被之正義曰地理志山陽郡有胡陵縣不言其縣有菏澤也又云菏澤在濟隂定陶縣東孟豬在梁國睢陽縣東北以今地驗之則胡陵在睢陽之東定陶在睢陽之北其水皆不流溢東北被孟豬也然郡縣之名隨代變易古之胡陵當在睢陽之西北故得東出被孟豬也於此作孟豬左傳爾雅作孟諸周禮作望諸聲轉字異正是一地也傳纊細緜正義曰禮喪大記候死者屬纊以俟絕氣即纊是新緜耳纎是細故言細緜傳治玉至磬錯正義曰詩云佗山之石可以攻玉又曰可以爲錯磬有以玉爲之者故云治玉石曰錯謂治磬錯也梁州傳東據至黒水正義曰周禮職方氏豫州其山鎭曰華山在豫州界内此梁州之境東據華山之南不得其山故言陽也此山之西雍州之境也傳㞴山至荆州正義曰漢制縣有羌夷曰道地理志云蜀郡有湔道㞴山在西徼外江水所出也隴西郡西縣嶓冡山西漢水所出是二者皆山名也沱出于江潛出于漢二水發源此州而入荆州故荆州亦云沱潛旣道傳蔡蒙至可藝正義曰地理志云蒙山在蜀郡靑衣縣應劭云順帝改曰漢茄縣蔡山不知所在論語云季氏旅於泰山是祭山曰旅也平者言其治水畢猶上旣藝也和夷平地之名致功可藝藝與平互言耳傳色青黒而沃壤正義曰孔以黎爲黒故云色靑黒其地沃壤言其美也王肅曰靑黒色黎小䟽也傳田第至三等正義曰傳以旣言下中復云三錯舉下中第八爲正上下取一故雜出第七第九與第八爲三也鄭云三錯者此州之地有當出下之賦者少耳又有當出下上中下者差復益少與孔異也傳璆玉至剛鐵正義曰釋器云璆琳玉也郭璞云璆琳美玉之別名鏤者可以刻鏤故爲剛鐵也傳貢四至金罽正義曰與織皮連文必不貢生獸故云貢四獸之皮釋言云氂罽也舎人曰氂謂毛罽也胡人續羊毛作衣孫炎曰毛氂爲罽織毛而言皮者毛附於皮故以皮表毛耳傳西傾至曰沔正義曰下又導山有西傾知是山名也地理志云西傾在隴西臨洮縣西南西傾在雍州自西傾山南行因桓水是來浮於潛水也地理志云桓水出蜀郡蜀山西南行羌中入南海則初發西傾未有水也不知南行幾里得桓水也下傳云泉始出山爲漾水東南流爲沔水至漢中東行爲漢水是漢上曰沔傳越沔至曰亂正義曰計沔在渭南五百餘里故越沔陸行而北入渭渭水入河故浮渭而東帝都在河之東故渡河陸行而還帝都也以每州之下言入河之事河近帝都知是還都白所治也正絕流曰亂釋水文孫炎曰横渡也雍州傳西距至州西正義曰禹治豫州乃次梁州自東向西故言梁州之境先以華陽而後黒水從梁適雍自南向北故先黒水而後西河計雍州之境被荒服之外東不越河而西踰黒水王肅云西據黒水東距西河所言得其實也徧撿孔本皆云西距黒水東據河必是誤也又河在雍州之東而謂之西河者龍門之河在兾州西界故謂之西河王制云自東河至於西河千里而近是河相對而爲東西也傳導之至合黎正義曰諸水言旣導此言旣西由地勢不同導之使西流也鄭云衆水皆東此水獨西故記其西下也傳屬逮至於渭正義曰屬謂相連屬故訓爲逮逮及也言水相及詩毛傳云汭水涯也鄭云汭之言内也蓋以人皆南面望水則北爲汭也且涇水南入渭而名爲渭汭知水北曰汭言治涇水使之入渭亦是從故道也地理志云涇水出安定涇陽縣西岍頭山東南至馮翊陽陵縣入渭行千六百里傳漆沮至於渭正義曰詩云自土沮漆毛傳云沮水漆水也則漆沮本爲二水地理志云漆水出扶風漆縣西闞駰十三州志云漆水出漆縣西北岐山東入渭沮則不知所出蓋東入渭時巳與漆合渭發源逺以渭爲主上云涇屬渭是矣故此言漆沮旣從巳從於渭灃水所同亦同於渭以渭爲主故也地理志灃水出扶風鄠縣東南北過上林苑入渭也傳巳旅至之荆正義曰洪水之時祭祀禮廢巳旅祭而言治功畢治水從下自東而西先荆後岐荆在岐東嫌與上荆爲一故云非荆州之荆也地理志云禹貢北條荆山在馮翊懷德縣南南條荆山在南郡臨沮縣北彼是荆州之荆也傳三山至相望正義曰以荆岐單名此山復名故辯之云三山名也至於爲首尾之辭故言相望也三山空舉山名不言治意䝉上旣旅之文也地理志云扶風武功縣有太一山古文以爲終南垂山古文以爲惇物皆在縣東傳下濕至致功正義曰下濕曰隰釋地文地理志云豬野澤在武威縣東北有休屠澤古文以爲豬野澤鄭玄以爲詩云度其隰原即此原隰是也原隰豳地從此致功西至豬野之澤也傳西裔至之功正義曰左傳稱舜去四凶投之四裔舜典云竄三苗於三危是三危爲西裔之山也其山必是西裔未知山之所在地理志杜林以爲燉煌郡即古瓜州也昭九年左傳云先王居檮杌于四裔故允姓之姦居于瓜州杜預云允姓之祖與三苗俱放於三危瓜州今燉煌也鄭玄引地記書云三危之山在鳥䑕之西南當㞴山則在積石之西南地記乃妄書其言未必可信要知三危之山必在河之南也禹治水未巳竄三苗水災旣除彼得安定故云三危之山巳可居三苗之族大有次敘記此事以美禹治之功也傳田第一至功少正義曰此與荆州賦田升降皆較六等荊州升之極故云人功修此州降之極故云人功少其餘相較少者從此可知也王制云凡居民量地以制邑度地以居民地邑民居必參相得地則民當相準而得有人功修人功少者記言初置邑者可以量之而州境闊逺民居先定新遭洪水存亡不同故地勢有美惡人功有多少治水之後即爲此差在後隨人少多必得更立其等此非永定也傳球琳至似珠正義曰釋地云西北之美者有崐崘虚之璆琳琅玕焉說者皆云球琳美玉名琅玕石而似珠者必相傳驗實有此言也傳積石至西界正義曰地理志云積石山在金城河關縣西南羌中河行塞外東北入塞内積石非河之源故云河所經也河從西來至此北流故禹㳂河順流而北釋水云河千里一曲一直故千里而東千里而南至于龍門西河也地理志云龍門山在馮翊夏陽縣北此山當河之道禹鑿以通河東郡之西界也禹至此渡河而還都白帝也㳂或誤爲治此說禹行不說治水也傳逆流至西上正義曰㑹合也人行逆流而水相向故逆流曰㑹從河入渭自渭北涯逆水西上言禹白帝訖從此而西上更入雍州界也諸州之末惟言還都之道此州事終言發都更去明諸州皆然也傳織皮至戎狄也王義曰四國皆衣皮毛故以織皮冠之傳言織皮毛布有此四國崐崘也析支也渠也搜也四國皆是戎狄也末以西戎揔之此戎在荒服之外流沙之内牧誓云武王伐紂有羌髳從之此是羌髳之屬禹皆就次敘美禹之功逺及戎狄故記之也鄭玄云衣皮之民居此崐崘析支渠搜三山之野者皆西戎也王肅云崐崘在臨羌西析文在河關西西戎西域也王肅不言渠搜鄭併渠搜爲一孔傳不明或亦以渠搜爲一通西戎爲四也鄭以崐崘爲山謂別有崐崘之山非河所出者也所以孔意或是地名國號不必爲山也導岓及岐正義曰上文每州說其治水登山從下而上州境隔絕未得徑通今更從上而下條說所治之山本以通水舉其山相連屬言此山之傍所有水害皆治訖也因兾州在北故自北爲始從此導岍至敷淺原舊說以爲三條地理志云禹貢北條荆山在馮翊懷德縣南南條荆山在南郡臨沮縣東北是舊有三條之說也故馬融王肅皆爲三條導岍北條西傾中條嶓冡南條鄭玄以爲四列導岍爲隂列西傾爲次隂列嶓冡爲次陽列㞴山爲正陽列鄭玄創爲此說孔亦當爲三條也岍與嶓冡言導西傾不言導者史文有詳略以可知故省文也傳更理至雍州正義曰荆岐上已具矣而此復言之以山勢相連而州境隔絕更從上理說所治山川首尾所在揔解此下導山水之意也其實通水而文稱導山者導山本爲治水故以導山名之地理志云吴岳在扶風岍縣西古文以爲岍山岐山在美陽縣西北荆山在懷德縣三山皆在雍州傳此謂至西河正義曰逾于河謂山逾之也此處山勢相望越河而東故云此謂龍門西河言此處山不絕從此而渡河也傳三山至黨西正義曰地理志云壷口在河東北屈縣東南雷首在河東蒲坂縣南太岳在河東彘縣東是三山在兾州以太岳東近上黨故云在上黨西也傳此三至東行正義曰地理志云析城在河東濩澤縣西王屋在河東垣縣東北地理志不載厎柱厎柱在太陽關東析城之西從厎柱至王屋在兾州南河之北東行也傳此二至言之正義曰地理志云太行山在河内山陽縣西北恒山在常山上曲陽縣西北太行去恒山太逺恒山去碣石又逺故云此二山連延東北接碣石而入滄海言山傍之水皆入海山不入海也又解治水言山之意百川經此衆山禹皆治之川多不可勝名故以山言之也謂漳潞汾涑在壷口雷首太行經底柱析城濟出王屋淇近太行恒衛滹沲滱易近恒山碣石之等也傳西傾至南山正義曰地理志云西傾在隴西臨洮縣西南朱圉在天水兾縣南言在積石以東見河所經也地理志云鳥䑕同穴山在隴西首陽縣西南渭水所出在隴西郡之西是三者皆雍州之南山也傳相首尾而東正義曰地理志云大華在京兆華隂縣南鳥䑕東望太華太逺故云相首尾而東也傳四山至相備正義曰地理志云熊耳山在弘農盧氏縣東伊水所出嵩髙山在潁川嵩髙縣古文以爲外方山桐柏山在南陽平氏縣東南横尾山在江夏安陸縣東北古文以爲陪尾山是四山接華山而相連東南皆在豫州界也凡舉山名皆爲治水故言水之所經洛出熊耳伊經外方淮出桐柏經陪尾導山本爲治水故云皆先舉所施功之山於上而後條列所治水於下互相備也傳漾水至荆州正義曰下云嶓冡導漾梁州云㞴嶓旣藝是嶓冡在梁州也荆州以荆山爲名知荆山在荆州也傳内方至所經正義曰地理志云章山在江夏竟陵縣東北古文以爲内方山地理志無大別鄭玄云大別在廬江安豐縣杜預解春秋云大別闕不知何處或曰大別在安豐縣西南左傳云吴旣與楚夾漢然後楚乃濟漢而陳自小別至于大別然則二別近漢之名無縁得在安豐縣如預所言雖不知其處要與内方相接漢水所經必在荆州界也傳㞴山至荆州正義曰其下云㞴山導江梁州㞴嶓旣藝是㞴山在梁州也地理志云衡山在長沙湘南縣東南上言衡陽惟荆州是江所經在荆州也傳言衡至章界正義曰衡即横也東西長今之人謂之爲嶺東行連延過九江之水而東接於敷淺原之山也經於岍及嶓冡言導㞴山言陽故解之言導從首起言陽從南言㞴山之南至敷淺原別以㞴山爲首不與大別相接由江所經别記之耳以見㞴非三條也地理志豫章歷陵縣南有博陽山古文以爲敷淺原導弱水正義曰此下所導凡有九水大意亦自北爲始以弱水最在西北水又西流故先言之黒水雖在河南水從雍梁西界南入南海與諸水不相參涉故又次之四瀆江河爲大河在北故先言河也漢入于江故先漢後江其濟發源河北越河而南與淮俱爲四瀆故次濟次淮其渭與洛俱入于河故後言之計流水多矣此舉大者言耳凡此九水立文不同弱水黒水沇水不出于山文單故以水配其餘六水文與山連旣繫於山不須言水積石山非河上源記施功之處故云導河積石言發首積石起也漾江先山後水淮渭洛先水後山皆是史文詳略無義例也又淮渭洛言自某山者皆是發源此山欲使異於導河故加自耳鄭玄云凡言導者發源於上未成流凡言自者亦發源於上未成流必其俱未成流何須別導與自河出崐崘發源甚逺豈至積石猶未成流而云導河也傳合黎至沙東正義曰弱水得入合黎知合黎是水名顧氏云地說書合黎山名但此水出合黎因山爲名鄭玄亦以爲山名地理志張掖郡刪丹縣桑欽以爲導弱水自此西至酒泉合黎張掖郡又有居延澤在縣東北古文以爲流沙如志之言酒泉郡在張掖郡西居延屬張掖合黎在酒泉則流沙在合黎之東與此傳不合案經弱水西流水既至于合黎餘波入于流沙當如傳文合黎在流沙之東不淂在其西也傳黒水至南海正義曰地理志益州郡計在蜀郡西南三千餘里故滇王國也武帝元封二年始開為郡郡内有滇池縣縣有黒水祠止言有其祠不知水之所在鄭云今中國無也傳之此言順經文耳案酈元水經黒水岀張掖雞山南流至燉煌過三危山南流入于南海然張掖燉煌並在河北所以黒水淂越河入南海者河自積石以西皆多伏流故黒水淂越而南也傳施功至通流正義曰河源不始于此記其施功處耳故言施功發於積石釋水云河千里一曲一直則河從積石北行又東乃南行至扵龍門計應三千餘里龍門厎柱鑿山也其餘平地穿地也或鑿山或穿地以通流言自積石至海皆然也釋水云河出崑崙虛色白李廵曰崑崙山名虛山下地也郭璞云發源高處激湊故水色白潜流地中受渠衆多渾濁故水色黃漢書西域傳云河有两源一出葱嶺一出于闐于闐在南山下其河北流與葱嶺河合東注蒲昌海蒲昌海一名鹽澤者去玉門陽闗三百餘里廣袤三四百里其水停居冬夏不增減皆以為潜行地下南出于積石為中國河郭璞云其去崑崙里數逺近未淂詳也傳孟津至為津正義曰孟是地名津是渡處在孟地致津謂之孟津傳云地名謂孟為地名耳杜預云孟津河内河陽縣南孟津也在洛陽城北都道所湊古今常以為津武王渡之近世以来呼為武濟傳洛汭至北行正義曰洛汭洛入河處河南鞏縣東也釋山云再成英一成岯李廵曰山再重曰英一重曰岯傳云再成曰岯與爾雅不同葢所見異也鄭玄云大岯在修武武徳之界張揖云成臯縣山也漢書音義有臣瓉者以為修武武徳無此山也成臯縣山又不一成今黎陽縣山臨河豈不是大岯平瓉言當然傳降水至澤名正義曰地理志云降水在信都縣案班固漢書以襄國爲信都在大陸之南或降水發源在此下尾至今之信都故得先過降水乃至大陸若其不爾則降水不可知也鄭以降讀爲降下江反聲轉爲共河内共縣淇水出焉東至魏郡黎陽縣入河此近降水也周時國於此地者惡言降水改謂之共此鄭胸臆不可從也傳同合至敘之正義曰傳言九河將欲至海更同合爲一大河名爲逆河而入于渤海也鄭玄云下尾合名爲逆河言相向迎受王肅云同逆一大河納之於海其意與孔同傳泉始至漢水正義曰傳之此言當據時人之名爲說也地理志云漾水出隴西氏道縣至武都爲漢水不言中爲沔水孔知嶓冡之東漢水之西而得爲沔水者以禹治梁州入帝都白所治云逾于沔入于渭是沔近於渭當梁州向兾州之路也應劭云沔水自江别至南郡華容縣爲夏水過江夏郡入江旣云江別明與此沔別也依地理志漢水之尾變爲夏水是應劭所云沔水下尾亦與漢合乃入于江也傳別流在荆州正義曰傳言别流似分爲異水案經首尾相連不是分別當以名稱別流也以上在梁州故此云在荆州傳自彭至入海正義曰揚州云三江旣入震澤厎定孔爲三江旣入入震澤也故言江自彭蠡分而爲三江復共入震澤出澤又分爲三此水遂爲北江而入于海鄭玄以爲三江旣入入于海不入震澤也孔必知入震澤者以震澤屬揚州彭蠡在揚州之西界今從彭蠡有三江則震澤之西三江具矣今云三江旣入繼以震澤厎定故知三江入震澤矣今南人以大江不入震澤震澤之東別有松江等二江案職方揚州其川曰三江冝舉州内大川其松江等雖出震澤入海旣近周禮不應捨岷山大江之名而記松江等小江之說山水同今變易故鄭云旣知今亦當知古是古今同之驗也傳江東至東行正義曰以上云浮于江沱潛漢其次自南而北江在沱南知江東南流而沱東行傳澧水名正義曰鄭玄以此經自導弱水巳下言過言㑹者皆是水名言至于者或山或澤皆非水名故以合黎爲山名澧爲陵名鄭玄云今長沙郡有澧陵縣其以陵名爲縣乎孔以合黎與澧皆爲水名弱水餘波入千流沙則本源入合黎矣合黎得容弱水知是水名楚辭曰濯余佩兮澧浦是澧亦爲水名傳江分至地名正義曰九江之水禹前先有其處禹今導江過歷九江之處非是別有九江之水傳迆溢至彭蠡正義曰迆言靡迆邪出之言故爲溢也東溢分流又都共聚合北㑹彭蠡言散流而復合也鄭云東迆者爲南江孔意或然至之與㑹史異文耳傳有北有中南可知正義曰地理志云南江從㑹稽吴縣南東入海中江從丹陽無湖縣西東至㑹稽陽羨縣東入海北江從㑹稽毗陵縣北東入海傳泉源至平地正義曰地理志云濟水出河東垣縣王屋山東南至河内武德縣入河傳言在温西北平地者濟水近在河内孔必驗而知之見今濟水所出在温之西北七十餘里温是古之舊縣故計温言之傳濟水至東南正義曰此皆目驗爲說也濟水旣入于河與河相亂而知截河過者以河濁濟淸南出還淸故可知也傳陶丘丘再成正義曰釋丘云再成爲陶丘李巡曰再成其形再重也郭璞云今濟隂定陶城中有陶丘地理志云定陶縣西南有陶丘亭傳桐柏至之東正義曰地理志云桐柏山在南陽平氏縣東南淮水所出水經云出胎簪山東北過桐柏山胎簪蓋桐柏之傍小山傳言南陽郡之東也傳與泗至入海正義曰地理志云沂水出泰山蓋縣南至下邳入泗泗水出濟隂乗氏縣至臨淮睢陵縣入淮乃沂水先入泗泗入淮耳以沂水入泗處去淮巳近故連言之傳鳥䑕至出焉正義曰釋鳥云鳥䑕同穴其鳥爲䳜其鼠爲鼵李巡曰䳜鼵鳥鼠之名共處一穴天性然也郭璞曰鼵如人家䑕而短尾䳜似鵽而小黃黒色穴入地三四尺䑕在内鳥在外今在隴西首陽縣有鳥䑕同穴山尚書孔傳云共爲雄雌張氏地理記云不爲牝牡璞並載此言未知誰得實也地理志云隴西首陽西南有鳥䑕同穴山渭水所出至京兆北舩司空縣入河過郡四行千八百七十里傳漆沮至翊北正義曰地理志云漆水出扶風漆縣依十三州記漆水在𡵨山東入渭則與漆沮不同矣此云會于涇又東過漆沮是漆沮在涇水之東故孔以爲洛水一名漆沮水經沮水出北池直路縣東入洛水又云鄭渠在太上皇陵東南濯水入焉俗謂之漆水又謂之漆沮其水東流注於洛水志云出馮翊懷德縣東南入渭以水土驗之與毛詩古公自土沮漆者別也彼漆即扶風漆水也彼沮則未聞九州至中邦正義曰昔堯遭洪水道路阻絶今水土旣治天下大同故揔敘之今九州所共同矣所同者四方之宅巳盡可居矣九州之山刋槎其木旅祭之矣九州之川滌除泉源無壅塞矣九州之澤巳皆陂障無決溢矣四海之内皆得㑹同京師無乖異矣六材之府甚修治矣言海内之人皆豐足矣水災巳除天下衆土墳壤之屬俱得其正復本性故也民旣豐足取之有藝致所重愼者惟財貨賦稅也愼之者皆法則其三品土壤準其地之肥瘠爲上中下三等以成其貢賦之法於中國美禹能治水土安海内於此揔結之傳所同事在下正義曰九州所同與下爲目故言所同事在下四隩旣宅巳下皆是也其言九山九川九澤最是同之事矣傳四方至可居正義曰室隅爲隩隩是内也人之造宅爲居至其隩内遂以隩表宅故傳以隩爲宅以宅内可居言四方舊可居之處皆可居也傳九州至溢矣正義曰上文諸州有言山川澤者皆舉大言之所言不盡故於此復更揔之九山九川九澤言九州之内所有山川澤無大無小皆刋槎決除巳訖其皆旅祭惟據名山大川言旅者往前大水旅祭禮廢巳旅見巳治也山非水體故以旅見治其實水亦旅矣發首云奠髙山大川但是定位皆巳旅祭也川言滌除泉源從其所出至其所入皆蕩除之無壅塞也澤言旣陂往前濫溢今時水定或作陂以障之使無決溢詩云彼澤之陂毛傳云陂澤障也傳四海至化和正義曰禮諸侯之見天子時見曰㑹殷見曰同此言四海㑹同乃謂官之與民皆得聚㑹京師非據諸侯之身朝天子也夷狄戎蠻謂之四海但天子之於夷狄不與華夏同風故知四海謂四海之内即是九州之中乃有萬國萬國同其風化若物在繩索之貫故云九州同風萬國共貫大禹謨云水火金木土糓謂之六府皆修治者言政化和也由政化和平民不失業各得殖其資産故六府修治也傳交俱至過度正義曰交錯更互俱之義故交爲俱也洪水之時髙下皆氷土失本性今水災旣除衆土俱得其正謂壤墳壚還復其壤墳壚之性也諸州之土靑黎是色塗泥是濕土性之異惟有壤墳壚耳故舉三者以言也致所愼者財貨貢賦謹愼其事不使害人言取民有節什一而稅不過度也傳皆法至害除正義曰土壤各有肥瘠貢賦從地而出故分其土壤爲上中下計其肥瘠等級甚多但舉其大較定爲三品法則地之善惡以爲貢賦之差雖細分三品以爲九等人功修少當時小異要民之常稅必準其土故皆法三壤成九州之賦言得施賦法以明水害除也九州即是中邦故傳以九州言之錫土至朕行正義曰此一經皆史美禹功言九州風俗旣同可以施其敎化天子惟當擇任其賢者與共治之選有德之人賜與所生之土爲姓旣能尊賢如是又天子立意常自以敬我德爲先則天下之民無有距違我天子所行者皆禹之使然故敘而美之傳台我至行者正義曰台我釋詁文天子建德因生以賜姓隱八年左傳文旣引其文又解其義土地也謂有德之人生于此地天子以地名賜之姓以尊顯之周語稱帝嘉禹德賜姓曰姒祚四岳賜姓曰姜左傳稱周賜陳胡公之姓爲嬀皆是因生賜姓之事也臣蒙賜姓其人少矣此事是用賢大者故舉以爲言王者旣能用賢又能謹敬其立意也常自以敬我德爲先則天下無有距違我天子之行者論語云上好禮則民莫敢不敬上好義則民莫敢不服上好信則民莫敢不用情王者自敬其德則民豈敢不敬之人皆敬之誰敢距違者聖人行而天下皆恱動而天下皆應用此道也五百里甸服正義曰旣言九州同風法壤成賦而四海之内路有遠近更敘弼成五服之事甸侯綏要荒五服之名堯之舊制洪水旣平之後禹乃爲之節文使賦役有恒職掌分定甸服去京師最近賦稅尤多故每於百里即爲一節侯服稍逺近者供役故二百里内各爲一節三百里外共爲一節綏要荒三服去京師益逺每服分而爲二内三百里爲一節外二百里爲一節以逺近有較故其任不等甸服入糓故發首言賦稅也賦令自送入官故三百里内每皆言納四百聖五百里不言納者從上省文也於三百里言服者舉中以明上下皆是服王事也侯服以外貢不入榖侯主爲斥候二百里内傜役差多故各爲一名三百里外同是斥候故共爲一名自下皆先言三百里而後二百里舉大率爲差等也傳規方至百里正義曰先王規方千里以爲甸服周語文王制亦云千里之内曰甸鄭玄云服治田出糓稅也言甸者主治田故服名甸也傳甸服至國馬正義曰去王城五百里揔名甸服就其甸服内又細分之從内而出此爲其首故云甸服之内近王城者緫者緫下銍秸禾穗與稾揔皆送之故云禾稾曰緫入之供飼國馬周禮掌客待諸侯之禮有芻有禾此緫是也傳銍刈謂禾穗正義曰劉熈釋名云銍穫禾鐵也說文云銍穫禾短鎌也詩云奄觀銍刈用銍刈者謂禾穗也禾穗用銍以刈故以銍表禾穗也傳秸稾也服稾役正義曰郊特牲云莞簟之安而稾秸之設秸亦稾也雙言之耳去穗送稾易於送穗故爲逺彌輕也然計什一而得稾粟皆送則秸服重於納銍則乖近重逺輕之義蓋納粟之外斟酌納稾服稾役者解經服字於此言服明上下服皆並有所納之伇也四百里猶尚納粟此當稾粟別納非是徒納稾也傳所納至者多正義曰直納粟米爲少禾稾俱送爲多其於稅也皆當什一但所納有精麤逺輕而近重耳傳甸服至服事正義曰便聲近候故爲候也襄十八年左傳稱晉人伐齊使司馬斥山澤之險斥謂檢行之也斥候謂撿行險阻伺候盜賊此五百里主爲斥候而服事天子故名侯服因見諸言服者皆是服事也傳侯服至主一正義曰采訓爲事此百里乏内主供王事而已事謂役也有役則供不主於一故但言采傳男任屯任王者事正義曰男聲近任故訓爲任任王者事任受其役此任有常殊於不主一也言邦者見上下皆是諸侯乏國也傳三百至一名正義曰經言諸侯者三百里内同爲王者斥候在此內所圭事同故合三百四百五百共爲一名言諸侯以示義耳傳綏安至政敎正義曰綏安釋詁文要服去京師巳逺王者以文敎要束使服此綏服路近言安服王者政敎以示不待要束而自服也周語云先王之制邦内甸服邦外侯服侯衞賔服夷蠻要服戎狄荒服彼賔服當此綏服韋昭云以文武侯衞爲安王賔之因以名服然則綏者據諸侯安王爲名賔者據王敬諸侯爲名彼云先王之制則此服舊有二名傳揆度至皆同正義曰釋詁訓揆爲度故雙言之以王者有文敎此服諸侯揆度王者政敎而行之必自揆度恐其不合上耳即是安服王者之義傳文敎至以安正義曰旣言三百又言二百嫌是三百之内以下二服文與此同故於此解之此是文敎外之二百里也由其心安王化奮武以衞天子所以名此服爲安也内文而外武故先揆文敎後言奮武衞所從言之異與安之義同奮武衛天子是其安之驗也言服内諸侯心安天子非言天子賴諸侯以安也傳綏服至文敎正義曰要者約束之義上言揆文敎知要者要束以文敎也綏服自揆天子文敎恐其不稱上旨此要服差逺巳慢王化天子恐其不服乃以文敎要服之名爲要見其踈逺之義也傳蔡法至差簡正義曰蔡之爲法無正訓也上言三百里夷夷訓平也言守平常敎耳此名爲蔡敎簡於夷故訓蔡爲法法則三百里者去京師彌逺差復簡易言其不能守平常也傳要服至簡略正義曰服名荒者王肅云政敎荒忽因其故俗而治之傳言荒又簡略亦當以爲荒忽又簡略於要服之蔡也傳以文至以法正義曰鄭云蠻者聽從其俗羈縻其人耳故云蠻蠻之言緡也其意言蠻是緡也緡是繩也言蠻者以繩束物之名揆度文敎論語稱逺人不服則修文德以來之故傳言以文德蠻來之不制以國内之法強逼之王肅云蠻慢也禮儀簡慢與孔異然甸侯綏要四服俱有三日之役什一而稅但二百里蔡者稅微差簡其荒服力役田稅並無故鄭注云蔡之言殺減殺其賦荒服旣不役作其人又不賦其田事也其侯綏等所出稅賦各入本國則亦有納緫納銍之差但此據天子立文耳要服之内皆有文敎故孔於要服傳云要束以文敎則知巳上皆有文敎可知獨於綏服三百里云揆文敎者以去京師旣逺更無別供又不近外邊不爲武衞其要服又要束始行文敎無事而能揆度文敎而行者惟有此三百里耳奮武衛者在國習學兵武有事則征討夷狄不於要服内奮武衛者以要服逼近夷狄要束始來不可委以兵武傳流移至千里正義曰流如水流故云移也其俗流移無常故政敎隨其俗任其去來不服蠻來之也凡五服之別各五百里是王城四面面别二千五百里四面相距爲方五千里也賈逵馬融以爲甸服之外百里至五百里米特有此數去王城千里其侯綏要荒服各五百里是面三千里相距爲方六千里鄭玄以爲五服服別五百里是堯之舊制及禹弼之每服之閒更増五百里面别至于五千里相距爲方萬里司馬遷與孔意同王肅亦以爲然故肅注此云賈馬旣失其實鄭玄尤不然矣禹之功在平治山川不在拓境廣土土地之廣三倍於堯而書傳無稱也則鄭玄創造難可據信漢之孝武疲弊中國甘心夷狄天下戸口至減大半然後僅開縁邊之郡而巳禹方憂洪水三過其門不入未暇以征伐爲事且其所以爲服之名輕重顚倒逺近失所難得而通矣先王規方千里以爲甸服其餘均分之公侯伯子男使各有寰宇而使甸服之外諸侯入禾稾非其義也史遷之旨蓋得之矣是同於孔也若然周禮王畿之外別有九服服別五百里是爲方萬里復以何故三倍於堯又地理忘言漢之土境東西九千三百二里南北萬三千三百六十八里驗其所言山川不出禹貢之域山川戴地古今必同而得里數異者堯與周漢其地一也尚書所言據其虛空鳥路方直而計之漢書所言乃謂著地人跡屈曲而量之所以數不同也故王蕭上篇注云方五千里者直方之數若其迴邪委曲動有倍加之較是言經指直方之數漢據迴邪之道有九服五服其地雖同王者革易自相變改其法不改其地也鄭玄不言禹變堯法乃云地倍於堯故王肅所以難之王制云西不盡流沙東不盡東海南不盡衡山北不盡恒山凡四海之内斷長𥙷短方三千里者彼自言不盡明未至逺界且王制漢丗爲之不可與經合也東漸至成功正義曰言五服之外又東漸入于海西被及于流沙其北與南雖在服外皆與聞天子威聲文敎時來朝見是禹治水之功盡加于四海以禹功如是故帝賜以玄色之圭告其能成天之功也傳漸入至朝見正義曰漸是沾濕故爲入謂入海也覆被是逺及之辭故爲及也海多邪曲故言漸入流沙長逺故言被及皆是過之意也五服之下乃說此事故言此五服之外皆與王者聲敎而朝見言其聞風感德而來朝也鄭玄云南北不言所至容踰之此言西被於流沙流沙當是西境最逺者也而地理志以流沙爲張掖居延澤是也計三危在居延之西大逺矣志言非也傳玄天至功成正義曰考工記天謂之玄是玄爲天色禹之蒙賜必是堯賜故史敘其事禹功盡加于四海故堯賜玄圭以彰顯之必以天色圭者言天功成也大禹謨舜美禹功云地平天成是天功成也尚書正義卷第六計二萬一千二百六字
