  text: 尚書正義卷第十五
  hash: sha256:74c6b0c803e09bd326d6e0b93926bd19d157d1159e34c2aaf971c40994b9101f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_015-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰周書多士第十六無逸第十七多士第十六成周至多士正義曰成周之邑既成乃遷殷之頑民令居此邑頑民謂殷之大夫士從武庚叛者以其無知謂之頑民民性安土重遷或有怨恨周公以成王之命誥此衆士言其須遷之意史敘其事作多士傳洛陽下都正義曰周之成周於漢為洛陽也洛邑為王都故謂此為下都遷殷頑民以成周道故名此邑為成周傳殷大至誨之正義曰經云商王士殷遺多士皆非民事謂之頑民知是殷之大夫士也經止云士而知有大夫者以經云迪簡在王庭有服在百僚其意言將任為王官以為大臣不惟告士而巳故知有大夫也士者在官之揔號故言士也心不則德義之經僖二十四年左傳文引之以解稱頑民之意經云移爾遐逖比事臣我宗多遜是言徙近王都教誨之也漢書地理志及賈逵注左傳皆以為遷邶鄘之民於成周分衛民為三國計三國俱是從叛何以獨遷邶鄘邶鄘在殷畿三分有二其民衆矣非一邑能容民謂之為士其名不類故孔意不然惟三至王士正義曰惟成王即政之明年三月周公初始於所造新邑之洛用成王之命告商王之衆士言周公親至成周告新來者傳周公至衆士正義曰以洛誥之文成周與洛邑同時成也王以周公攝政七年十二月來至新邑明年即政此篇繼王居洛之後故知是致政明年之三月也成周南臨洛水故云新邑洛周公既以致政在王都故新邑成周以成王之命告商王之衆士鄭云成王元年三月周公自王城初往成周之邑用成王命告殷之衆士以撫安之是也王若至明畏正義曰周公以王命順其事而呼之曰汝殷家遺餘之衆士汝殷家道教不至旻天以殷道不至之故天下喪亡於殷將欲滅殷我有周受天佑助之命奉天明白之威致王者之誅罰正黜殷命終我周家於帝王之事謂使我周家代殷為天子也天既助我周王故汝衆士來為我臣由天助我我得為之非我小國敢取殷之王命以為已有此乃天與我惟天不與信無堅固於治者以是故輔弼我若其不然我其敢妄求天子之位乎言此位天自與我非我求而得之惟天不與紂故惟我周家下民秉心為我故我得之惟天明德可畏之效也亦既得喪由天汝等不得不服以殷士未服故以天命喻之傳順其至在下正義曰順其殷亡之事稱王命以告之從紂之臣或有身已死者遺餘在者遷於成周故告殷遺餘衆士所順在下下文皆是順之辭傳稱天至於殷正義曰此經先言弗弔謂殷道不至也不至者上不至天事天不以道下不至民撫民不以理也天有多名獨言旻天者旻愍也稱天以愍下言天之所愍愍道至者也殷道不至故旻天下喪亡於殷言將覆滅之傳天命至帝王正義曰天命周致王者之誅罰謂奉上天之命殺無道之主此乃王者之事故為王者之誅罰勑訓正也正黜殷命謂殺去虐紂使周受其終事是終周於帝王終猶舜受堯終言殷祚終而歸於周傳天佑至天命正義曰肆訓故也直云故爾多士辭無所結此經大意敘其去殷事周知其故爾衆士言其臣服我弋射也射而取之故弋為取也鄭玄王肅本弋作翼王亦云翼取也鄭云翼猶驅也非我周敢驅取汝殷之王命雖訓為驅亦為取義周本殷之諸侯故周公自稱小國我聞至四方正義曰既言天之效驗去惡與善更追說往事比而喻之我聞人有言曰上天之情欲民長得逸樂而有夏王桀逆天害民不得使民之適逸樂以此則惟上天下災異至戒以譴告之欲使夏王桀覺悟改惡為善是天歸嚮於是夏家不背棄之而夏桀不能用天之明戒改悔已惡而反大為過逸之行致有惡辭以聞於丗惟是桀有惡辭故天無復愛念無復聽聞言天不復助桀其惟廢其大命欲絶夏祚也下致天罰欲誅桀身也乃命汝先祖成湯使之改革夏命用其賢俊之人以治四方之國舉桀滅湯興以譬之傳言上至告之正義曰襄十四年左傳稱天之愛民甚矣又曰天生民而立之君使司牧之是言上天欲民長得逸樂故立君養之使之長逸樂也夏桀為政割剝夏邑使民不得之適逸樂故上天下此至戒以譴告之降下格至也直言下至明是天下至戒天所下戒惟下災異以譴告人主使之見災而懼改修德政耳古書亡失桀之災異未得盡聞傳惟是至天罰正義曰桀惡流毒於民乃有惡辭聞於丗惡既有辭是惡巳成矣惟是桀惡有辭故天無所念聞言天不愛念不聽聞是其全棄之不佑助也棄而不佑則當更求賢主其惟廢大命欲奪其王位也下致天罰欲殺其凶身也廢大命知降致是下罰也自成至于罰正義曰既言命湯革夏又說後丗皆賢至紂始惡天乃滅之自成湯至於帝乙無不顯用有德憂念祭祀後丗亦賢非獨成湯以用其行合天意亦惟天大立安治有殷殷家諸王皆能明德憂祀亦無敢失天道者無不皆配天而布其德澤以此得天下久為民主在今後嗣㠪紂大無明於天道敢行昏虐之政於天天猶且忽之況曰其有聽念先王父祖勤勞國家之事乎乃復大淫過其泆無所顧於上天無能明民為敬以此反於先王違逆天道惟是上天不安紂之所為下若此大喪亡之誅惟天不與不明其德之人故也天不與惡豈獨紂乎凡四方諸侯小大邦國其喪滅者無非皆有惡辭是以致至於天罰汝紂以惡而見滅汝何以不服我也傳自帝至社稷正義曰下篇說中宗髙宗祖甲三王以外其後立王生則逸豫亦罔或能壽如彼文則帝乙以上非無僻王而此言無不顯用有德憂念祭祀者立文之法辭有抑揚方說紂之不善盛言前丗皆賢正以守位不失故得美而言之憂念祭祀者惟有齊肅恭敬故言憂念齊敬奉其祭祀言能保宗廟社稷為天下之主以見紂不恭敬故喪亡之傳湯既至德澤正義曰帝乙巳上諸王所以長處天位者皆由湯之聖德延及後人湯既革夏亦惟天大立安治於殷者謂天安治之故殷家得治理也殷家諸王自成湯之後皆能憂念祭祀無敢失天道者故得常處王位無不配天布其德澤於民為天之子是配天也號令於民是布德也傳言紂至亂甚正義曰淫泆俱訓為過言紂大過其愆過無顧於天言其縱心為惡不畏天也無能明民為敬言其多行虐政不憂民也不畏於天不愛於民言其暴亂甚也此經顧於天與顯民祗共蒙上罔文故傳再言無也傳惟天至之辭正義曰能明其德天乃與之惟天不與不明其德者紂不明其德故天喪之因即廣言天意凡四方小大邦國謂諸侯有止之君其為天所喪滅者無非皆有惡辭聞於天乃為上天所罰言被天罰者皆有暗亂之辭上天不罰無辜紂有暗亂之辭故天滅之耳天既滅不明其德我有明德為天所立汝等殷士安得不服我乎以其心仍不服故以天道責之王若至不正正義曰周公又稱王順而言曰汝殷衆士今惟我周家文武二王大神能奉天事故天有命命我周王曰當割絶殷命告正於天我受天命巳滅殷告天惟我天下之事不有二處之適言已之適周不更適他也惟汝殷王家事亦於我之適不復變改又追說初伐紂之事我其為汝言曰惟汝殷紂大無法度故當冝誅絶之伐紂之時我不先於汝動自往誅汝其亂從汝邑先起汝紂自召禍耳我亦念天所以就於殷致大罪者故以紂不能正身念法故也傳周王至恤祀正義曰文王受命武王伐紂故知周王兼文武也大神奉天事謂以天為神而勤奉事之勞身敬神言亦如湯明德恤祀也傳天有至傷士正義曰以周王奉天之故故天有命命我周使割絶殷命告正於天謂武成之篇所云既克紂柴於牧野告天不頓兵傷士是也前敵即服故無頓兵傷士師以正行故為告正武成正告功成功成無害即是不頓傷也頓兵者昭十五年左傳文頓折也傳我亦至念法正義曰言我亦念天者以紂雖無法度若使天不命我我亦不往誅紂以紂既為大惡上天命我我亦念天所遣我就殷加大罪者何故以紂不能正身念法也王曰猷至天命正義曰又言曰我以道告汝衆士我惟是以汝未達德義之故其今徙居西汝置於洛邑以教誨汝我之徙汝非我一人奉行德義不能使民安而安之是惟天命冝然汝無違我我亦不敢更有後誅罰汝等無於我見怨汝既來遷當為善事惟汝所親知惟汝殷先人往丗有䇿書有典籍說殷改夏王命之意汝當案省知之汝知先人之故事今汝又有言曰夏之諸臣蹈道者大在殷王之庭有服行職事在於百官言其見任用恐我不任汝我一人惟聽用有德之者故我敢求汝有德之人於彼天邑商都欲取賢而任用之我惟循殷故事憐愍汝故徙教汝此徙非我有罪是惟天命當然聖人動合天心故每事惟託天命也傳以道至誨汝正義曰猷訓道也故云以道告汝衆士上言惟是不言其故故傳辨之惟是者未達德義也遷使居西正欲教以德義是以徙居西汝置於洛邑近於京師教誨汝也從殷適洛南行而西回故為居西也傳汝無至怨我正義曰周既伐紂又誅武庚殷士懼更有誅疑其欲違上命故設此言以戒之知無違朕者謂戒之使汝無違命也汝能用命我亦不敢有後誅必無後誅汝無怨我也傳言我至用之正義曰夏人簡在王庭為其有德見用言我亦法殷家惟聽用有德汝但有德我必任用故我往前敢求汝有德之人於天邑商都將任用之也鄭玄云言天邑商者亦本天之所建王肅云言商今為我之天邑二者其言雖異皆以天邑商為殷之舊都言未遷之時當求往遷後有德任用之必矣傳惟我至天命正義曰循殷故事此故解經中肆字謂殷用夏人我亦用殷人憐愍汝故徙之教汝此故解義之言非經中肆遷汝來西者非我罪咎是惟天命也王曰多士至多遜正義曰王復言曰衆士昔我來從奄國大黜下汝管蔡商奄四國民命民之性命死生在君誅殺其君是下民命由四國叛逆我乃明白致行天罰汝等遺餘當教之為善故移徙汝居於逺令汝逺於惡俗比近服事臣我宗周多為順道兾汝相教為善永不為惡也傳昔我至國君正義曰金縢之篇說周公東征言居東二年罪人斯得則昔我來從奄者謂攝政三年時也於時王不親行而王言我來自奄者周公以王命誅四國周公師還亦是王來還也一舉而誅四國獨言來自奄者謂先誅三監後伐奄與淮夷奄誅在後誅奄即來故言來自奄也民以君為命故民命謂君也大下汝民命謂誅四國君王肅云君為民命為君不能順民意故誅之也傳四國至順道正義曰天之所罰罰有罪也四國之君有叛逆之罪我下其命乃所以明致天罰言非苟為之也遐逖俱訓為逺今移徙汝於洛邑令去本鄉逺也使汝逺於惡俗令去惡俗逺也比近京師臣我周家使汝從我善化多為順道所以救汝之性命也王曰告至爾遷正義曰王又言曰告汝殷之多士所以逺徙汝者今我惟不欲於汝刑殺我惟是教命有所申戒由此也今我作大邑於此洛非但為我惟以待四方無所賔外亦惟為汝衆士所當服行臣事我宗周多為順事故也汝若多為順事汝乃庶幾還有汝本土乃庶幾安汝故事止居可不勉之也汝能敬行順事天惟與汝憐汝況於人乎汝若不能敬行順事則汝不啻不得還汝本土我亦致天之罰於汝身今汝惟是敬順居汝所受新邑繼汝舊日所居為我當聽汝還歸本鄉有幹事有豐年乃由於此洛邑行善也汝能敬順則汝之小子與孫等乃起從汝化而遷善矣傳今汝至有年正義曰殷士逺離本鄉新來此邑或當居不安為棄舊業故戒之今汝惟是敬順居汝新所受邑繼汝舊日所當居為謂繼其本土之事業也但能如此得還本土其有安事有豐年也有幹有年謂歸本土有幹年而言於洛者言由在洛修善得還本土有幹有年也王肅云汝其有安事有長久年於此洛邑王解於文甚便但孔上句為云爾乃尚有爾本土是誘引之辭故止為得還本土有幹有年也王曰又至攸居正義曰王之所云又復稱曰汝當是我勿非我也我乃有教誨之言則汝所當居行之傳言汝至居行正義曰王以誨之巳終故戒之云汝當是我勿非我既不非我我乃有教誨汝之言則汝所當居行令其居於心而行用之鄭玄論語注云或之言有此亦或為有也凡言王曰皆是史官録辭非王語也今史録稱王之言曰以前事未終故言又曰也無逸第十七傳中人至無逸正義曰上智不肯為非下愚戒之無益故中人之性可上可下不能勉強多好逸豫故周公作書以戒之使無逸此雖指戒成王以為人之大法成王以聖賢輔之當在中人以上其實本性亦中人耳傳成王至名篇正義曰篇之次第以先後為序多士君奭皆是成王即位之初知此篇是成王始初即政周公恐其逸豫故戒之使無逸即以所戒名篇也周公至聞知正義曰周公歎美君子之道以戒王曰嗚呼君子之人所在其無逸豫君子必先知農人稼穡之艱難然後乃謀為逸豫如是則知小人之所依怙也視彼小人不孝者其父母勤勞稼穡其子乃不知稼穡之艱難乃為逸豫遊戲乃叛諺不恭既為欺誕父母矣不欺則又侮慢其父母曰昔之人無所聞知小人與君子如此相反王冝知其事也傳歎美至者乎正義曰周公意重其事故歎而為言鄭云嗚呼者將戒成王欲求以深感動之是欲深感成王故歎美君子之道君子者言其可以君正上位子愛下民有德則稱之不限貴賤君子之人念德不怠故所在念德其無逸豫也君子且猶然而況王者乎言王者曰有萬幾彌復不可逸豫鄭云君子止謂在官長者所猶處也君子處位為政其無自逸豫也傳稼穡至依怙正義曰民之性命在於穀食田作雖苦不得不為寒耕熱耘沾體塗足是稼穡為農夫艱難之事在上位者先知稼穡之艱難乃可謀其逸豫使家給人足乃得思慮不勞是為謀逸豫也能知稼穡之艱難則知小人之所依怙言小人依怙此稼穡之事不可不勤勞也上句言君子當無逸此言乃謀逸豫者君子之事勞心與形盤于遊畋形之逸也無為而治心之逸也君子無形逸而有心逸既知稼穡之艱難可以謀心逸也傳視小人至其勞正義曰視小人不孝者其父母勤苦艱難勞於稼穡成於生業致冨以遺之而其子謂已自然得之乃不知其父母勤勞傳小人至聞知正義曰上言視小人之身此言小人之子者小人謂無知之人亦是賤者之稱躬為稼穡是賤者之事故言小人之子謂賤者之子即上所視之小人也此子既不知父母之勞謂已自然得冨恃其家冨乃為逸豫遊戲乃為叛諺不恭巳是欺誕父母矣若不欺誕則輕侮其父母曰古老之人無所聞知言其罪之深也論語曰由也諺諺則叛諺欺誕不恭之貌昔訓久也自今而道逺久故為古老之人詩云召彼故老周公至五年正義曰既言君子不逸小人反之更舉前代之王以天夀為戒周公曰嗚呼我所聞曰昔在殷王中宗威儀嚴恪貌恭心敬畏天命用法度治民敬身畏懼不敢荒怠自安故中宗之享有殷國七十有五年言不逸之故而得歷年長也傳太戊至稱宗正義曰中宗廟號太戊王名商自成湯巳後政教漸衰至此王而中興之王者祖有功宗有德殷家中丗尊其德其廟不毀故稱中宗傳言太至法度正義曰祭義云嚴威儼恪故引恪配嚴鄭玄云恭在貌敬在心然則嚴是威恭是貌敬是心三者各異故纍言之其在至九年正義曰其殷王髙宗父在之時久勞於外於時與小人同其事後為太子起其即王之位乃有信默三年不言在喪其惟不言喪畢發言言得其道乃天下大和不敢荒怠自安善謀殷國至於小大之政莫不得所其時之人無是有怨恨之者故髙宗之享殷國五十有九年亦言不逸得長壽也傳武丁其至同事正義曰舊久也在即位之前而言久勞於外知是其父小乙使之久居民閒勞是稼穡與小人出入同為農役小人之艱難事也太子使與小人同勞此乃非常之事不可以非常怪之於時蓋未為太子也殷道雖質不可既為太子更得與小人雜居也傳武丁起至行著正義曰以上言久勞於外為父在時事故言起其即王位則小乙死也亮信也隂默也三年不言以舊無功而今有故言乃有說此事者言其孝行著也禮記喪服四制引書云髙宗諒暗三年不言善之也王者莫不行此禮何以獨善之也曰髙宗者武丁武丁者殷之賢王也繼丗即位而慈良於喪當此之時殷衰而復興禮廢而復起故載之於書中而髙之故謂之髙宗三年之喪君不言也是說此經不言之意也傳在喪至自安正義曰鄭玄云其不言之時時有所言則羣臣皆和諧鄭玄意謂此言乃雍者在三年之內時有所言也孔意則為出言在三年之外故云在喪則其惟不言喪畢發言則天下大和知者說命云王宅憂亮隂三祀既免喪其惟不言除喪猶尚不言在喪必無言矣故知喪畢乃發言也髙宗不敢荒寧與中宗正同故云亦法中宗不敢荒怠自安殷家之王皆是明主所為善事計應略同但古文辭有差異傳因其文同故言法中宗也傳善謀至無非㠪義曰釋詁云嘉善也靖謀也善謀殷國謀為政教故至於小大之政皆允人意人無是有怨髙宗者言其政無非也鄭云小大謂萬人上及羣臣言人臣小大皆無怨王也其在至三年正義曰其在殷王祖甲初遭祖喪所言行不義惟亦為王久為小人之行伊尹廢諸桐起其即王之位於是知小人之所依依於仁政乃能安順於衆民不敢侮鰥寡惸獨故祖甲之享有殷國三十有三年亦言不逸得長壽也傳湯孫至之桐正義曰以文在髙宗之下丗次顚倒故特辨之此祖甲是湯孫太甲也為王不義謂湯初崩久為小人之行故伊尹放之於桐言其廢而復興為下作其即位起本也王肅亦以祖甲為太甲鄭玄云祖甲武丁子帝甲也有兄祖庚賢武丁欲廢兄立弟祖甲以此為不義逃於人閒故云久為小人案殷本紀云武丁崩子祖庚立祖庚崩弟祖甲立是為帝甲淫亂殷道復衰國語說殷事云帝甲亂之七代而殞則帝甲是淫亂之主起亡殷之源寧當與二宗齊名舉之以戒無逸武丁賢王祖庚復賢以武丁之明無容廢長立少祖庚之賢誰所傳說武丁廢子事出何書妄造此語是負武丁而誣祖甲也傳在桐至惸獨正義曰在桐三年太甲序文思集用光詩大雅文彼集作輯輯和也彼鄭言公劉之遷豳思在和其民人用光大其道此傳之意蓋言太甲之在桐也思得安集其身用光顯王政故起即王位於是知小人之依依於仁政故能施行政教安順於衆民不敢侮慢惸獨鰥寡之類尤可憐愍故特言之傳太甲至稱祖正義曰傳於甲宗云以敬畏之故得夀考之福髙宗之為政小大無怨故亦享國永年於此云太甲亦以知小人之依故得久年各順其文而為之說其言行善而得長壽經意三王同也以其丗次顚倒故解之云此以德優劣立年多少為先後故祖甲在大戊武丁之下諸書皆言太甲此言祖甲者殷家亦祖其功故稱之祖甲與二宗為類惟見此篇必言祖其功亦未知其然殷之先君有祖乙祖辛祖丁稱祖多矣或可號之為祖未必祖其功而存其廟也自時至三年正義曰從是三王其後所立之王生則逸豫不知稼穡之艱難不聞小人之勞苦惟耽樂之事則從而為之故從是其後諸王無有能壽考者或十年或七八年或五六年或四三年言逸樂之損壽故舉以戒成王也周公至十年正義曰殷之三王既如此矣周公又言曰嗚呼其惟我周家大王王季能以義自枊而畏敬天命故王迹從此起也文王又卑薄衣服以就其安人之功與治田之功以美道柔和其民以美政恭待其民以此民歸之以美政恭民之故故小民安之又加恩惠於鮮乏鰥寡之人其行之也自朝旦至於日中及昊尚不遑暇食用善政以諧和萬民故也文王專心於政不敢逸樂於遊戲畋獵以已為衆國所取法惟當正身行已以供待之由是文王受命嗣位為君惟於中身受之其享國五十年亦以不逸得長壽也傳大王至父祖正義曰大王周公曽祖王季即祖也此乃經傳明文而須詳言之者此二王之下辭無所結陳此不為無逸周公將說文王故本其父祖是以傳詳言也解其言此之意以義自抑者言其非無此心以義自而不為耳傳文王至艱難正義曰文王卑其衣服以就安人之功言儉於身而厚於人也立君所以牧人安人之功諸有美政皆是也就安人之內田功最急故特云田功以示知稼穡之艱難也傳以美至之人正義曰徽懿皆訓為美徽柔懿恭此是施人之事以此柔恭懷安小民故傳分而配之徽柔配懹以美道和民故民懷之懿恭配保以美政恭民故民安之徽懿言其美而巳不知何所美也人君施於民惟有道與政耳故傳以美道美政言之政與道亦互相通也少乏鰥寡尤是可憐故別言加惠於鮮乏鰥寡之人也傳從朝至萬民正義曰昭五年左傳云日上其中食日為二旦日為三則人之常食在日中之前謂辰時也易豐卦彖曰日中則昊謂過中而斜昊也昊亦名昳言日蹉跌而下謂未時也故日之十位食時為辰日昳為未言文王勤於政事從朝不食或至於日中或至於日昊猶不暇食故經中昊並言之傳舉晚時故惟言昳遑亦暇也重言之者古人自有復語猶云艱難也所以不暇食者為思慮政事用皆和萬民政事雖多皆是為民故言咸咸訓皆也傳文王至之故正義曰釋詁云盤樂也遊謂遊逸田謂畋獵二者不同故並云遊逸田獵以衆國皆於文王所取其法則文王當以正義供待之故也言文王思為政道以待衆國故不敢樂於遊田文王丗為西伯故當為衆國所取法則禮有田獵而不敢者順時搜狩不為取樂故不敢非時畋獵以為樂耳傳文王至全數正義曰文王年九十七而終禮記文子丗子文也於九十七內減享國五十年是未立之前有四十七在禮諸侯踰年即位此據代父之年故為即位時年四十七也計九十七年半折以為中身則四十七時於身非中言中身者舉全數而稱之也經言受命者鄭玄云受殷王嗣位之命然殷之末丗政教巳衰諸侯嗣位何必皆待王命受先君之命亦可也王肅云文王受命嗣位為君不言受王命也周公至德哉正義曰周公又言而歎曰嗚呼繼此後丗自今以後嗣位之王則其無得過於觀望過於逸豫過於遊戲過於田獵所以不得然者以萬民聽王者之殺命王當正已身以供待之也以身供待萬民必當早夜恪勤無敢自間暇曰今日且樂後日乃止此為耽樂者非民之所以教訓也非天之所以敬順也若是之人則有大愆過矣王當自勤政事莫如殷王受之迷亂國政酗醟於酒德哉殷紂藉酒為凶以酒為德由是喪亡殷國王當以紂為戒無得如之傳繼從至戒之正義曰先言繼者謂繼此後人即從今以後嗣丗之王也周公思及長逺後王盡皆戒之非獨成王也傳所以至之故正義曰傳意訓淫為過鄭玄云淫放恣也淫者侵淫不止其言雖殊皆是過之義也言觀為非時而行違禮觀物如春秋隱公如棠觀魚莊公如齊觀社穀梁傳曰常事曰視非常曰觀此言無淫于觀禁其非常觀也逸謂逸豫遊謂遊蕩田謂畋獵四者皆異故每事言於以訓用也用萬民皆聽王命王者惟當正身待之故不得淫於觀逸遊田也傳無敢至過矣正義曰無敢自暇謂事不寬不暇而以為原王之意而為辭故言曰耽以為樂惟今日樂而後日止惟言今日樂明知後日止也夫耽樂者乃非所以教民教民當恪勤也非所以順天順天當肅恭也是此耽樂之人則大有愆過矣戒王不得如此也傳以酒至如之正義曰酗從酉以凶為聲是酗為凶酒之名故以酒為凶謂之酗酗是飲酒而益凶也言紂心迷亂以酗酒為德飲酒為政心以凶酒為已德紂以此亡殷戒嗣王無如之周公至詛祝正義曰周公言而歎曰我聞人之言曰古之人雖君明臣良猶尚相訓告以善道相安順以美政相教誨以義方君臣相正如此故於時之民順從上教無有相誑欺為幻惑者此其不聽中正之君人乃教訓之以非法之事乃從其言變亂先王之正法至於小大之事無不皆變亂之君既變亂如此其時之民疾苦否則其心違上怨上否則其口詛祝上言人患之無巳舉此以戒成王使之君臣相與養下民也傳歎古至義方正義曰此章二事善惡相反下句不聽人者是愚暗之君知此言古之人者是賢明之君相是兩人相與故知兼有臣良更相教告隱三年左傳石碏曰臣聞愛子教之以義方故知相教誨者使相教誨以義方也則知相訓告者告之以善道也相保惠者相安順以美政也傳譸張至惑也正義曰譸張誑也釋訓文孫炎曰眩惑誑欺人也民之從上若影之隨形君臣以道相正故下民無有相欺誑幻惑者幻即眩也惑亂之名漢書稱西域有幻人是也傳此其至致之正義曰上言善事此說惡事如此其不聽者是不聽中正之君也既不聽中正則好聽邪佞知此乃訓之者是邪佞之人訓之也邪佞之人必反正道故言人乃教之以非法暗君即受用之變亂先王之正法至於小大無不變亂言皆變亂正法盡也暗君所任同已由已之暗致此佞人言此暗君已身有以致之也上君明臣良由君明而有良臣亦是已有致之上言胥此不言者君任佞臣國亡滅矣不待相教為惡故不言胥也傳以君至其上正義曰君既變亂正法必將困苦下民民不堪命忿恨必起故民忿君乃有二事否則心違怨否則口詛祝言皆患上而為此也違怨謂違其命而怨其身詛祝謂告神明令加殃咎也以言告神謂之祝請神加殃謂之詛襄十七年左傳曰宋國區區而有詛有祝詩曰侯詛侯祝是詛祝意小異耳周公至含怒正義曰既言明君暗君善惡相反更述二者之行周公言而歎曰嗚呼自殷王中宗及髙宗及祖甲及我周文王此四人者皆蹈明智之道以臨下民其有告之曰小人怨恨汝罵詈汝既聞此言則大自敬德更增修善政其民有過則曰是我之過民信有如是怨詈則不啻不敢含怒以罪彼人乃欲得數聞此言以自改悔言寬弘之若是傳其有至善政正義曰釋詁云皇大也故傳言大自敬德者謂增修善政也鄭玄以皇為暇言寬暇自敬王肅本皇作況況滋益用敬德也傳其人至和恱正義曰或告之曰小人怨汝詈汝其言有虛有實其言若虛則民之愆也民有愆過則曰我過不責彼為虛言而引過歸巳者湯所云百姓有過在豫一人故若信有如是怨詈小人聞之則含怒以罪彼人此四王即不啻不敢含怒以罪彼人乃自願聞其愆言其顔色常和恱也鄭玄云不但不敢含怒乃欲屢聞之以知巳政得失之源也此厥至厥身正義曰此其不聽中正之人乃有欺誑為幻惑以告之曰小人怨汝詈汝不原其本情則信受之則如是信讒者不長念其為君之道不審虛實不能寬緩其心而徑即含怒於人是亂其正法罰無罪殺無辜罰殺欲以止怨乃令人怨益甚天下之民有同怨君令怨惡聚於其身言𥚹急使民之怨若是教成王勿學此也傳則如至含怒正義曰君人者察獄必審其虛實然後加罪不長念其為君之道謂不審察虛實也不寬緩其心言徑即含怒也王肅讀辟為辟扶亦反下長念其刑辟不當加無罪也尚書正義卷第十五計九千一百三十二字
