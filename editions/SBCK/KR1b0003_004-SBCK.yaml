body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰虞書大禹謨第三皐陶謨第四大禹謨第三皐陶至益稷正義曰皐陶爲帝舜陳其謀禹爲帝舜陳已成所治水之功帝舜因其所陳從而重美之史録其辭作大禹皐陶二篇之謨又作益稷之篇凡三篇也篇先大禹序先言皐陶者皐陶之篇皐陶自先發端禹乃然而問之皐陶言在禹先故序先言皐陶其此篇以功大爲先故先禹也益稷之篇亦是禹之所陳因皐陶之言而禹論益稷在皐陶謨後故後其篇傳矢陳也正義曰矢陳釋詁文傳陳其成功正義曰此是謨篇禹成其功陳其言耳蒙上矢文故傳明之言陳其成功也序成在厥上傳成在下者序順上句傳從便文故倒也傳申重至之言正義曰申重釋詁文大禹謨云帝曰俞地平天成時乃功又帝曰皐陶惟玆臣庶罔或干予政時乃功懋哉益稷云迪朕德時乃功皆是重美二子之言也傳大禹至九德正義曰二篇皆是謨也序以一謨揔二篇故傳明之大禹治水能致九功而言謨以其序有謨文故云謨也傳凡三篇正義曰益稷亦大禹所謀不言謨者禹謀言及益稷非是益稷爲謀不得言益稷謨也其篇雖有夔曰夔言樂和本非謀慮不得謂之夔謨傳禹稱至謀也正義曰餘文單稱禹而此獨加大者故解之禹與皐陶同爲舜謀而禹功實大禹與皐陶不等史加大其功使異於皐陶於此獨加大字與皐陶並言故也謨謀釋詁文此三篇皆是舜史所録上取堯事下録禹功善於堯之知已又美所禪得人故包括上下以爲虞書其事以􅀋相從非由事之先後若其不然上篇已言舜死於此豈死後言乎此篇巳言禪禹下篇豈受禪後乎明史以􅀋聚爲文計此三篇禹謨最在後以禹功大故進之於先孟子稱舜薦禹於天十有七年則禹攝一十七年舜陟方乃死不知禹征有苗在攝幾年史述禹之行事不必以攝位之年即征苗民也曰􅀂至于帝正義曰史將録禹之事故爲題目之辭曰能順而考案古道而言之者是大功之禹也此禹能以文德敎命布陳於四海又能敬承堯舜外布四海内承二帝言其道周備傳順考至言之正義曰典是常行謨是言語故傳於典云行之於謨云言之皆是順考古道也傳言其至堯舜正義曰敷於四海即敷此文命故言外布文德敎命也四海舉其逺地故傳以外内言之祗訓敬也禹承堯舜二帝故云敬承堯舜傳不訓祗而直言敬以易知而略之曰后至時克正義曰禹爲帝舜謀曰君能重難其爲君之事臣能重難其爲臣之職則上之政敎乃治則下之衆民皆化而疾修其德而帝曰然信能如此君臣皆能自難並願善以輔己則下之善言無所隱伏在野無遺逸之賢賢人盡用則萬國皆安寧也爲人上者考於衆言觀其是非舎已之非從人之是不苛虐鰥寡􅀌獨無所告者必哀矜之不廢棄困苦貧窮無所依者必愍念之惟無父謂之􅀌老而無子謂之獨老而無妻謂之鰥老而無夫謂之寡此四者天民之窮而無告者故此無告是彼四者彼四者而此惟言􅀌者四者皆􅀌也言􅀌足以揔之言困窮謂貧無資財也益曰至下君正義曰益承帝言歎美堯德曰嗚呼帝堯之德廣大運行乃聖而無所不通乃神而微妙無方乃武能克定禍亂乃文能經緯天地以此爲大天顧視而命之使同有四海之内爲天下之君傳益因至禍亂正義曰廣者闊之義故爲所覆者大運者動之言故爲所及者逺洪範云睿作聖言通知衆事故爲無所不通案易曰神者妙萬物而爲言也又曰神妙無方此言神道微妙無可比方不知其所以然易又云隂陽不測之謂神謚法云經緯天地曰文克定禍亂曰武經傳文武倒者經取韻句傳以文重故也傳眷視而勉舜正義曰詩云乃眷西顧謂視而迴首􅀃文亦以眷爲視奄同釋言文益因帝言盛稱堯善者亦勸勉舜兾之必及堯也禹曰至來王正義曰禹因益言謀及丗事言人順道則吉從逆則凶吉凶之報惟􅀂影之隨形響之應聲言其無不報也益聞禹語驚懼而言曰吁誠如此言冝誡愼之哉所誡者當儆誡其心無億度之事謂忽然而有當誡愼之無失其守法度使行必有恒無違常也無遊縱於逸豫無過耽於戯樂當誡愼之以保己也任用賢人勿有二心逐去回邪勿有疑惑所疑之謀勿成用之如是則百種志意惟益廣也無違越正道以求百姓之譽無反戾百姓以從巳心之欲常行此事無怠惰荒廢則四夷之國皆來歸往之此亦所以勸勉舜也傳迪道也正義曰釋詁文傳先吁至有恒正義曰堯典傳云吁疑怪之辭此無可怪聞善驚而爲聲耳先吁後戒者驚其言之美然後設戒辭欲使聽者精審其言虞度釋詁文無億度者謂不有此事無心億度之曲禮云凡爲人子者聽于無聲視于無形戒于無形見之事言備愼深也安不忘危治不忘亂是其愼無形也法度當執守之故以秉法守度解不失言有恒也傳淫過至爲戒正義曰淫者過度之意故爲過也逸謂縱體樂謂適心縱體在於逸遊適心在於淫恣故以遊逸過樂爲文二者敗德之源富貴所忽故特以爲戒傳干求至賤之正義曰干求釋言文失道求名謂曲取人情苟恱衆意古人賤之傳咈戾至戒之正義曰堯曲巳訓咈爲戾彼謂戾朋儕此謂戾在下故詳其文耳專欲難成犯衆興禍襄十年左傳文禹曰至乃功正義曰禹因益言又獻謀於帝曰嗚呼帝當念之哉言所謂德者惟是善於政也政之所爲在於養民養民者使水火金木土穀此六事惟當修治之正身之德利民之用厚民之生此三事惟當諧和之修和六府三事九者皆就有功九功惟使皆有次敘九事次敘惟使皆可歌樂此乃德之所致是德能爲善政之道終當不得怠惰但人雖爲善或寡令終故當戒勑之念用美道使民慕美道行善又督察之用威罰言其不善當獲罪勸勉之以九歌之辭但人君善政先致九歌成辭自勸勉也用此事使此善政勿有敗壞之時勸帝使長爲善也帝荅禹曰汝之所言爲然汝治水土使地平天成六府三事信皆治理萬代長所恃賴是汝之功也歸功于禹明衆臣不及傳歎而至懷之正義曰於歎辭歎而言念自重其言欲使帝念之此史以􅀋相從共爲篇耳非是一時之事不使念益言也禹謀以九功爲重知重其言者九功之言也傳言養至六府正義曰下文帝言六府即此經六物也六者民之所資民非此不生故言養民之本在先修六府也府者藏財之處六者貨財所聚故稱六府襄二十七年左傳云天生五材民並用之即是水火金木土民用此自資也彼惟五材此兼以穀爲六府者穀之於民􅀹急穀是土之所生故於土下言之也此言五行與洪範之次不同者洪範以生數爲次此以相刻爲次便文耳六府是民之急先有六府乃可施敎故先言六府後言三事也傳正德至善政正義曰正德者自正其德居上位者正已以治民故所以率下人利用者謂在上節儉不爲縻費以利而用使財物殷阜利民之用爲民興利除害使不匱乏故所以阜財阜財謂財豐大也厚生謂薄征傜輕賦稅不奪農時令民生計温厚衣食豐足故所以養民也三者和謂德行正財用利生資厚立君所以養民人君若能如此則爲君之道備矣故謂善政結上德惟善政之言此三者之次人君自正乃能正下故以正德爲先利用然後厚生故後言厚生厚生謂財用足禮讓行也傳言六至之致正義曰上六下三即是六府三事此揔云九功知六府三事之功爲九功惟敘者即上惟修惟和爲次敘事皆有敘民必歌樂君德故九敘皆可歌樂乃人君德政之致也言下民必有歌樂乃爲善政之驗所謂和樂興而頌聲作也傳休美至而巳正義曰休美釋詁文又云董督正也是董爲督也此戒之董之勸之皆謂人君自戒勸欲使善政勿壞在此三事而已文七年左傳云晉郤缺言於趙宣子引此一經乃言九功之德皆可歌也謂之九歌若吾子之德莫可歌也其誰來之盍使睦者歌吾子乎言九功之德皆可歌者􅀂水能灌漑火能烹餁金能斷割木能興作土能生殖􅂖能養育古之歌詠各述其功猶如漢魏巳來樂府之歌事歌其功用是舊有成辭人君修治六府以自勸勉使民歌詠之三事亦然傳水土至不及正義曰釋詁云平成也是平成義同天地文異而分之耳天之不成由地之不平故先言地平本之於地以及天也禹平水土故水土治曰平五行之神佐天治物繫之於天故五行敘曰成洪範云鯀陻洪水汨陳其五行彞倫攸斁禹治洪水彞倫攸敘是禹命五行敘也帝因禹陳九功而歎美之指言是汝之功明衆臣不及帝曰格至念功正義曰此舜言將禪禹帝呼禹曰來汝禹我居帝位巳三十有三載在耄期之閒猒倦於勤勞汝惟在官不懈怠可代我居帝位揔領我衆禹讓之曰我德實無所能民必不依就我也言己不堪揔衆也皐陶行布於德德乃下洽於民衆皆歸服之可令皐陶攝也我所言者帝當念之哉凡念愛此人在此功勞知有功乃用之釋廢此人在此罪釁知有罪乃廢之言進人退人不可誣也名目言談此事必在此事之義而名言之􅀂信實出見此心必在此心之義而出見之言巳名言其口出見其心以舉皐陶皆在此義不有虚妄帝當念録其功以禪之言皐陶堪攝位也傳八十至使攝正義曰八十九十曰耄百年曰期頤曲禮文也如舜典之傳計舜年六十三即政至今九十五矣年在耄期之閒故並言之鄭云期要也頤養也不知衣服食味孝子要盡養之道而巳孔意當然傳邁行至服之正義曰邁行降下釋言文又云懷來也來亦歸也種物必布於地故爲布也傳玆此至可誣正義曰玆此釋詁文釋爲􅃕義故爲廢也禹之此意欲令帝念皐陶下云惟帝念功念是念功知廢是廢罪言念廢必依其實不可誣罔也傳名言至念之正義曰名言謂巳發於口信出謂始發於心皆據欲舉皐陶必先念慮於心而後宣之於口先言名言者已對帝讓皐陶即是名言之事故先言其意然後本其心故後言信出以義爲主者言已讓皐陶事非虚妄以義爲主帝曰皐陶至之休正義曰帝以禹讓皐陶故述而美之帝呼之曰皐陶惟此羣臣衆庶皆無敢有干犯我正道者由汝作士官明曉於五刑以輔成五敎當於我之治體用刑期於無刑以殺止殺使民合於中正之道令人每事得中是汝之功當勉之哉皐陶以帝美已歸美於君曰民合於中者由帝德純善無有過失臨臣下以􅂤易御衆庶以優寛罰人不及後嗣賞人延於來丗宥過失者無大雖大亦宥之刑其故犯者無小雖小必刑之罪有疑者雖重從輕罪之功有疑者雖輕從重賞之與其殺不辜非罪之人寧失不經不常之罪以等枉殺無罪寧妄免有罪也由是故帝之好生之德下洽於民心民服帝德如此故用是不犯於有司言民之無刑非已力也帝又述之曰使我從心所欲而爲政以大治四方之民從我化如風之動草惟汝用刑之美言已知其有功也傳弼輔至治體正義曰書傳稱左輔右弼是弼亦輔也期要是相當之言故爲當也傳言當於治體言皐陶用刑輕重得中於治體與正相當也傳雖或至勉之正義曰言皐陶或行刑乃是以殺止殺爲罪必將被刑民終無犯者要使人無犯法是期於無所用刑刑無所用此期爲限與前經期義別而論語所謂勝殘去殺矣民皆合於大中言舉動每事得中不犯法憲是合大中即洪範所謂皇極是也傳愆過至之義正義曰愆過釋言文坊記云善則稱君過則稱已則民作忠是善則稱君人臣之義也臨下據其在上御衆厈其治民􅂤易寛大亦不異也論語云居敬而行􅂤以臨其民不亦可乎是臨下冝以􅂤也又曰寛則得衆居上不寛吾何以觀之哉是御衆冝以寛也傳嗣亦至及也正義曰嗣謂繼父丗謂後胤故俱謂子也延訓長以長及物故延爲及也傳辜罪至之道正義曰辜罪釋詁文經常司主常訓也皐陶因帝勉已遂稱帝之德所以明民不犯上者自由帝化使然非已力也不常之罪者謂罪大非尋常小罪也枉殺無罪妄免有罪二者皆失必不得民心寧妄免大罪不枉殺無罪以好生之心故也大罪尚赦小罪可知欲極言不可枉殺不辜寧放有罪故也故言非常大罪以對之耳寧失不經與殺不辜相對故爲放赦罪人原帝之意等殺無罪寧放有罪傳言帝德之善寧失有罪不枉殺無罪是仁愛之道各爲文勢故經傳倒也洽謂沾漬優渥洽於民心言潤澤多也帝曰來至不再正義曰帝不許禹讓呼之曰來禹下流之水儆戒於我我恐不能治之汝成聲敎之信能成治水之功惟汝之賢汝能勤勞於國謂盡力於溝洫能節儉於家謂薄飲食卑宫室常執謙沖不自滿溢誇大惟汝之賢也又申美之汝惟不自矜誇故天下莫敢與汝爭能汝惟不自稱伐故天下莫敢與汝爭功美功之大也我今勉汝之德善汝大功天之曆運之數帝位當在汝身汝終當􅂛此大君之位冝代我爲天子因戒以爲君之法民心惟甚危險道心惟甚幽微危則難安微則難明汝當精心惟當一意信執其中正之道乃得人安而道明耳又爲人君不當妾受用人語無可考驗之言勿聽受之不是詢衆之謀勿信用之言民所愛者豈非人君乎民以君爲命故愛君也言君可畏者豈非民乎君失道則民叛之故畏民也衆非大君而何所奉戴無君則民亂故愛君也君非衆人無以守國無人則國亡故畏民也君民相須如此當冝敬之哉謹愼汝所有之位守天子之位勿使失也敬修其可願之事謂道德之美人所願也養彼四海困窮之民使皆得存立則天之禄籍長終汝身矣又告禹惟口之所言出好事興戎兵非善思慮無以出口我言不可再發令禹受其言也傳水性至美之正義曰降水洪水也水性下流故曰下水禹以治水之事儆戒於予益稷云予創􅀂時娶于塗山辛壬癸甲啓􅈱􅈱而泣予弗子惟荒度土功之事雖文在下篇實是欲禪前事故帝述而言之禹貢言治水功成云朔南暨聲敎故知成允是成聲敎之信成功是成治水之功也前巳言地平天成是汝功今復􅀃治水之事言禹最賢重美之也禹實聖人美其賢者其性爲聖其功爲賢猶易繫辭云可乆則賢人之德可大則賢人之業亦是聖傳滿謂至盈大正義曰滿以器喻故爲盈實也假大釋詁文言已無所不知是爲自滿言已無所不能是爲自大禹實不自滿大故爲賢也論語美禹之功德云惡衣服菲飲食卑宫室而盡力乎溝洫故傳引彼惡衣薄食卑其宫室是儉於家盡力爲民是勤於邦上言其功此言其德故再云惟汝賢傳自賢至衆人正義曰自言巳賢曰矜自言已功曰伐論語云願無伐善詩云矜其車甲矜與伐俱是誇義以經有爭能爭功故別解之耳弗矜莫與汝爭能即矜者矜其能也賢能大同小異故自賢解矜老子云夫惟不爭故天下莫能與之爭是故不矜伐而不失其功能此所以能絕異於衆人也傳丕大至天子正義曰丕大釋詀文曆數謂天曆運之數帝王易姓而興故言曆數謂天道鄭􅀇以曆數在汝身謂有圖籙之名孔無䜟緯之􅀃義必不然當以大功旣衆望歸之即是天道在身釋詁元訓爲首首是體之大也易曰大君有命是大君謂天子也傳危則至其中正義曰居位則治民治民必須明道故戒之以人心惟危道心惟微道者徑也物所從之路也因言人心遂云道心人心爲萬慮之主道心爲衆道之本立君所以安人人心危則難安安民必須明道道心微則難明將欲明道必須精心將欲安民必須一意故以戒精心一意又當信執其中然後可得明道以安民耳傳無考至聽用正義曰爲人之君不當妄用人言故又戒之無可考校之言謂無信驗不詢於衆人之謀謂專獨用意言無信驗是虚妄之言獨爲謀慮是偏見之􅀃二者終必無成故戒令勿聽用也言謂率意爲語謀謂豫計前事故互文也傳民以至而立正義曰百人無主不散則亂故民以君爲命君尊民畏之嫌其不愛故言愛也民賤君忽之嫌其不畏故言畏也傳有位至汝身正義曰上云汝終陟元后命􅂛天位知其愼汝有位愼天子位也道德人之可願知可願者是道德之美也惟言四海困窮不結言民之意必謂四海之内困窮之民令天子撫育之故知如王制所云􅀌獨鰥寡此四者天民之窮而無告者此是困窮者也言爲天子當愼天位修道德養窮民勤此三者則天之禄籍長終汝身禄謂福禄籍謂名籍言享大福保大名也傳好謂至於一正義曰昭二十八年左傳云慶賞刑威曰君君出言有賞有刑出好謂愛人而出好言故爲賞善興戎謂疾人而動甲兵故爲伐惡易繫辭曰言語者君子之樞機樞機之發榮辱之主必當慮之於心然後宣之於口故成之於一而不可再帝言我命汝􅂛天位者是慮而宣之此言故不可再禹曰至汝諧正義曰禹以讓而不許更請帝曰每以一枚歷卜功臣惟吉之人從而受之帝曰禹卜官之占惟能先斷人志後乃命其大􅀛我授汝之志先以定矣又詢於衆人其謀又皆同美矣我後謀及􅀑神加之卜筮􅀑神其依我矣􅀛筮復合從矣卜法不得因前之吉更復卜之不須復卜也禹猶拜而後稽首固辭帝曰母母者禁止其辭也惟汝能諧和此元后之任汝冝受之傳枚謂至之志正義曰周禮有銜枚氏所銜之物狀如箸今人數物云一枚兩枚則枚是籌之名也枚卜謂人人以次歷申卜之似􅀂枚數然然請卜不請筮者舉重也傳帝王至後卜正義曰占是卜人之占而云官占者帝王立卜筮之官故曰官占洪範稽疑云擇建立卜筮人是帝王立卜筮之官周禮司寇斷獄爲蔽獄是蔽爲斷也昆後釋言文官占之法先斷人志後命元􅀛言志定然後卜也洪範云汝則有大疑謀及乃心謀及卿士謀及庶人是先斷人志乃云謀及卜筮是後命元􅀛元􅀛謂大􅀛也傳習因至枚􅁲正義曰表記云􅁲筮不相襲鄭云襲因也然則習與襲同重衣謂之襲習是後因前故爲因也朕志先定言已謀之於心􅀛筮協從是謀及􅁲筮經言詢謀僉同謀及卿士庶人謀皆同心􅀑神其依即是􅀛筮之事􅁲筮通􅀑神之意故言􅀑神其依􅀛筮協從謂􅁲得吉是依從也志先定也謀僉同也􅀑神依也􅀛筮從也四者合從然後命汝􅁲法不得因吉無所復枚􅁲也如帝此言旣謀旣􅁲方始命禹仍請枚􅁲者帝與朝臣私謀私􅁲將欲命禹禹不預謀故不在更請􅁲也傳言母至之任正義曰􅀃文云母止之也其字從女内有一畫象有姦之者禁止令勿姦也古人言母猶今人言莫是言母者所以禁其辭令勿辭正月至之初正義曰舜即政三十三年命禹代已禹辭不獲免乃以明年正月朔旦受終事之命於舜神靈之宗廟揔率百官順帝之初攝故事言與舜受禪之初其事悉皆同也此年舜即政三十四年九十六也傳受舜至尊之正義曰舜典􅀃舜之初受終于文祖此言􅀂帝之初知受命即是舜終事之命也神宗猶彼文祖故云文祖之宗廟文祖言祖有文德神宗言神而尊之名異而實同神宗當舜之始祖案帝繫云黃帝生昌意昌意生顓頊顓頊生窮蟬窮蟬生敬康敬康生句芒句芒生蟜牛蟜牛生瞽瞍瞽瞍生舜即是舜有七廟黃帝爲始祖其顓頊與窮蟬爲二祧敬康句芒蟜牛瞽瞍爲親廟則文祖爲黃帝顓頊之等也傳順舜至行之正義曰􅀂不得爲如也舜典巡守之事言如初者皆言如不言􅀂知此􅀂爲順也順舜初攝帝位故事而奉行之其奉行者當如舜典在璿璣以下班瑞羣后以上也其巡守非率百官之事舜尚自爲陟方禹攝帝位未得巡守此是舜史所録以爲虞書故言順帝之初奉行帝之事故自美禪之得人也帝曰咨至有勲正義曰史言禹雖攝位帝尊如故時有苗國不順帝曰咨嗟汝禹惟時有苗之國不循帝道汝往征之禹得帝命乃㑹羣臣諸侯告誓於衆曰濟濟美盛之有衆皆聽從我命今蠢蠢然動而不遜者是此有苗之君昬闇迷惑不恭敬王命侮慢典常自以爲賢反戾正道敗壞德義君子在野小人在位由此民弃叛之不保其有衆上天降之殃咎故我以爾衆士奉此譴責之辭伐彼有罪之國汝等庶幾同心盡力以從我命其必能有大功勲不可懈惰傳三苗至討之正義曰吕刑稱苗民作五虐之刑皇帝遏絕苗民無丗在下謂堯初誅三苗舜典云竄三苗于三危謂舜居攝之時投竄之也舜典又云庶績咸熙分北三苗謂舜即位之後往徙三苗也今復不率命命禹徂征是三苗之民數干王誅之事禹率衆征之猶尚逆命即三苗是諸侯之君而謂之民者以其頑愚號之爲民吕刑云苗民弗用靈是謂爲民也吕刑稱堯誅三苗云無丗在下而得有苗國歷代常存者無丗在下謂誅叛者絕後丗耳蓋不滅其國又立其近親紹其先祖鯀旣殛死於羽山禹乃代爲崇伯三苗亦竄其身而存其國故舜時有被宥者復不從化更分北流之下傳云三苗之國左洞庭右彭蠡其國在南方蓋分北之時使爲南國君今復不率帝道率循徂往皆釋詁文不循帝道言其亂逆以其亂逆故命禹討之案舜典皆言舜受終之後萬事皆舜主之舜自巡守不稟堯命此言􅀂帝之初其事亦應同矣而此言命禹征苗舜復陟方乃死與舜受堯禪事不同者以題曰虞書即舜史所録明其詳於舜事略於堯禹也傳㑹諸至之貌正義曰軍旅曰誓曲禮丈也隱八年􅂖梁傳曰誥誓不及五帝盟詛不及三王交質不及二伯二伯謂齊􅁊公晉文公也不及者言於時未有也據此文五帝之丗有誓周禮立司盟之官三王之丗有盟也左傳云平王與鄭交質二伯之前有質也􅂖梁傳漢初始作不見經文妄言之耳美軍衆而言濟濟知是衆盛之貌傳蠢動至討之正義曰蠢動釋詁文釋訓云蠢不遜也郭璞云蠢動爲惡不謙遜也日入爲昏是爲闇也動爲惡而闇於事言其所以冝討之傳狎侮至德義正義曰侮謂輕人身慢謂忽言語故爲狎侮先王輕慢典敎侮慢義同因有二字而分釋之論語云狎大人侮聖人之言則狎侮爲異旅獒云狎侮君子則狎侮意亦同鄭􅀇云狎慣忽也慣見而忽之是侮之義傳取狎侮連言之慢先王典敎自謂已賢不知先王訓敎道者物所由之路德謂自得於心反正道從邪徑敗德義毀正行也傳廢仁賢任姦佞正義曰雖則下愚之君皆云好賢疾佞非知賢而廢之知佞而任之但愚人所好必同於民賢求其心佞從其欲以賢爲惡謂佞爲善故仁賢見廢姦佞被任此則昏迷之狀也傳肆故至下事正義曰肆故釋詁文所奉之辭即所伐之罪但天子責其不恭數其身罪因其文異而分之傳尚庶至我命正義曰釋言云庶幾尚也反以相解故尚爲庶幾三旬至苗格正義曰禹旣誓於衆而以師臨苗經三旬苗民逆帝命不肯服罪益乃進謀以佐於禹曰惟是有德能動上天茍能修德無有逺而不至因言行德之事自滿者招其損謙虚者受其益是乃天之常道欲禹修德謙虚以來苗旣􅀃其理又言其驗帝乃初耕於歷山之時爲父母所疾往至于田日號泣于旻天於父母乃自負其罪自引其惡恭敬以事見父瞽瞍夔夔然悚懼齋莊戰慄不敢言己無罪舜謙如此雖瞽瞍之頑愚亦能信順帝至和之德尚能感于􅄀神況此有苗乎言其苗易感於瞽瞍禹拜受益之當言曰然然益語也遂還師整衆而歸帝舜乃大布文德舞干羽于兩階之閒七旬而有苗自䏜來至言主聖臣賢御之有道也傳旬十至生辭正義曰堯典云三百有六旬是知旬十日也以師臨之一月不服者責舜不先有文告之命威讓之辭而便憚之以威脅之以兵所以有苗得生辭也傳知然者昭十三年左傳論征伐之事云告之以文辭董之以武師是用兵者先告不服然後伐之今經無先告之文而有逆命之事故知責舜不先有文告之命而即脅之以兵其文告之命威讓之辭國語亦有其事夫以大舜足達用兵之道而不爲文告之命使之得生辭者有苗數干王誅逆者難以言服故憚之以威武任其生辭待其有辭爲之振旅彼􅀂師退而服我復更有何求爲退而又不降復往必無辭􅀃不恭而征之有辭而捨之正是柔服之道也􅀂先告以辭未必即得從命不從而後行師必將大加殺戮不以文誥感德自來固是大聖之逺謀也傳賛佐至致逺正義曰禮有賛佐是助祭之人故賛爲佐也届至也釋詁文經天惟德動天天逺而難動德能動逺又言無逺不届乃據人言德動逺人無不至也益以此義佐禹欲脩德致逺使有苗自來也德之動天經傳多矣禮運云聖人順民天不愛其道地不愛其寶故天降膏露地出醴泉如此之􅀋皆德動之也傳自滿至常道正義曰自以爲滿人必損之自謙受物人必益之易謙卦􅂏曰天道虧盈而益謙地道變盈而流謙􅀑神害盈而福謙人道惡盈而好謙是滿招損謙受益爲天道之常也益言此者欲令禹修德息師持謙以待有苗傳仁覆至責於人正義曰仁覆愍下謂之旻天詩毛傳文也旻愍也求天愍己故呼曰旻天書傳言舜耕於歷山鄭􅀇云歷山在河東是耕於歷山之時爲父母所疾故往於田日號泣于旻天何爲然也孟子曰怨慕也長息問於公明髙曰舜往于田則予旣聞命矣號泣于旻天及父母即吾不知矣公明髙曰非爾所知也我竭力耕田供爲子職而巳父母不愛我何哉大孝終身慕父母五十而慕者予於大舜見之矣言舜之號泣怨慕者克已自責不責於人也傳慝惡至頑父正義曰慝之爲惡常訓耳舜典巳訓載爲事以非常訓故詳其文夔夔與齋慄共文故爲悚懼之貌自負其罪引惡歸己事勢同耳丁寧深言之敬以事見于父者謂恭敬自因事務須見父恭敬以見夔􅇪然悚懼齋慄是見時之貌父亦信順之者謂當以事見之時順帝意不悖怒也言能以至誠感頑父者言感使當時暫以順耳不能使每事信順變爲善人故孟子􅀃舜旣被堯徴用堯妻之二女瞽瞍猶與象欲謀殺舜而分其財物是下愚之性終不可改但舜善養之使不至于姦惡而巳傳諴和至易感正義曰諴亦咸也咸訓爲皆皆能相從亦和之義也矧況釋言文上言德能動天次言帝能感瞽天以􅀇逺難感瞽以頑愚難感言苗民近於天而智於瞽故言感天感瞽以況之天是神也覆動上天言至和尚能感天神而況於有苗乎言有苗易感神覆動天而不覆言瞽者以瞽雖愚猶是人􅀋天神事與人隔感天難於感瞽故舉難者以況之其實天與瞽俱言難感以況有苗易於彼二者傳昌當至整衆正義曰昌當也釋詁文禹以益言爲當拜受而巳即還還不請者春秋襄十九年晉士匄帥師侵齊聞齊侯卒乃還公羊傳曰大夫以君命出進退在大夫是言進退由將不須請也或可當時請帝乃還文不具耳兵入曰振旅釋天文與春秋二傳皆有此文振整也言整衆而還傳逺人至來之正義曰逺人不服文德以來之論語文也益賛於禹使修德而帝自誕敷者言君臣同心大布者多設文德之敎君臣共行之也傳干楯至武事正義曰釋言云干扞也孫炎曰干楯自蔽扞也以楯爲人扞通以干爲楯名故干爲楯釋言又云纛翳也郭璞云舞者持以自蔽翳也故明堂位云朱干玉戚以舞大武戚斧也是武舞執斧執楯詩云左手執籥右手秉翟是文舞執籥故干羽皆舞者所執修闡文敎不復征伐故舞文德之舞於賔主階閒言帝抑武事也經云舞干羽即亦舞武也傳惟言舞文者以據器言之則有武有文俱用以爲舞而不用於敵故敎爲文也傳討而至百里正義曰御之必有道者不恭而往征得辭而振旅而御之以道史記吳起對魏武侯云昔三苗氏左洞庭右彭蠡德義不修而禹滅之此言來服則是不滅吴起言滅者以武侯恃險言滅以懼之辯士之􅀃不必皆依實也知在荒服之例者以其地驗之爲然禹貢五服甸侯綏要荒荒最在外王畿面五百里其外四服又每服五百里是去京師爲二千五百里皐陶謨第四傳謨謀至舜謀正義曰孔以此篇惟與禹言嫌其不對帝舜故言爲帝舜謀將言爲帝舜謀故又訓謨爲謀以詳其文曰􅀂至曰俞正義曰史將言皐陶之能謀故爲題目之辭曰能順而考案古道而言之者是皐陶也其爲帝謀曰爲人君者當信實蹈行古人之德而謀廣其聦明之性以輔諧已之政事則善矣禹曰然然其謀是也此當如何行之皐陶曰嗚呼重其事而歎美之行上謀者當謹愼其巳身而修治人之事思爲乆長之道又厚次敘九族之親而不遺弃則衆人皆明曉上意而各自勉勵翼戴上命行之於近而可推而至逺者在此道也禹乃拜受其當理之言曰然美其言而拜受之傳亦順之至則正義曰二謨其目正同故云亦順考古道以言也堯舜考古以行謂之爲典大禹皐陶考古以言謂之爲謨典謨之文不同其目皆云考古故傳明言其意夫典謨聖帝所以立治之本雖言行有異皆是考法古道以成不易之則故史皆以稽古爲端目但君則行之臣則言之以尊卑不同故典謨名異禹亦爲君而云謨者禹在舜時未爲君也顧氏亦同此解皐陶德劣於禹皆是考古以言故得同其題目但禹能敷于四海祗承于帝皐陶不能然故此下更無別辭耳傳迪蹈至其政正義曰釋詁云迪道也聲借爲導導音與蹈同故迪又爲蹈也其德即其上稽古故曰其古人也而臣爲君謀故云言人君當信蹈行古人之德謂蹈履依行之也謀廣聦明聦明者自是已性又當受納人言使多所聞見以博大此聦明以輔弼和諧其政經惟言明傳亦有聦者以耳目同是所用故以聦明言之此曰上不言皐陶猶大禹爲謀曰上不言禹鄭􅀇云以皐陶下屬爲句則稽古之下無人名與上三篇不􅀋甚矣傳歎美至之道正義曰案傳之言以修爲上讀顧氏亦同也傳言愼至此道正義曰自身以外九族爲近故愼修其身又厚次敘九族猶堯之爲政先以親九族也人君旣能如此則衆庶皆明其敎而各自勉勵翼戴上命昭九年左傳􅀃晉叔向言翼戴天子故以爲翼戴上命言如鳥之羽翼而奉戴之王者率己以化物親親以及逺故從近可推而至于逺者在修已身親九族之道王肅云以衆賢明爲砥礪爲羽翼鄭云厲作也以衆賢明作輔翼之臣與孔不同皐陶曰都在至孔壬正義曰皐陶以禹然其言更述修身親親之道歎而言曰人君行此道者在於知人善惡擇善而信任之在於能安下民爲政以安定之也禹聞此言乃驚而言曰吁人君皆如是能知人能安民惟帝堯猶其難之況餘人乎知人善惡則爲大智能用官得其人矣能安下民則爲惠政衆民皆歸之矣此甚不易也􅀂帝堯能智而惠則當朝無姦佞何憂懼於驩兜之佞而流放之何須遷徙於有苗之君何所畏懼於彼巧言令色爲甚佞之人三凶見惡帝堯方始去之是知人之難傳哲智至歸之正義曰哲智釋詁文舎人曰哲大智也無所不知知人之善惡是能官人惠愛釋詁文君愛民則民歸之傳孔甚至放之正義曰孔甚釋詁文上句旣言驩兜有苗則此巧言令色共工之行也故以堯典共工之事解之巧言靜言庸違也令色象恭滔天也孔壬之文在三人之下揔上三人皆甚佞也苗言其名巧言令色言其行令其文首尾互相見故傳通言之禹言有苗驩兜之徒甚佞如此堯畏其亂政故遷放之傳不言共工故云之徒以包之遷與憂畏亦互相承言畏之而憂乃遷之也四凶惟言三者馬融云禹爲父隱故不言鯀也皐陶至采采正義曰禹旣言知人爲難皐陶又言行之有術故言曰嗚呼人性雖則難知亦當考察其所行有九種之德人欲稱薦人者不直言可用而巳亦當言其人有德問其德之狀乃言曰其德之所行某事某事以所行之事爲九德之驗如此則可知也傳言人至可知正義曰言人性行有九德下文所云是也如此九者考察其眞僞則人之善惡皆可知矣然則皐陶之賢不及帝堯逺矣皐陶知有此術帝堯無容不知而有四凶在朝禹言帝難之者堯朝之有四凶晦迹以顯舜爾禹言惟帝難之􅀃彼甚佞因其成敗以示敎法欲開皐陶之志故舉大事以爲戒非是此實甚佞堯不能知也顧氏亦云堯實不以此爲難今云難者俯同流俗之稱也傳載行至爲驗正義曰載者運行之義故爲行也此謂薦舉人者稱其人有德欲使在上用之必須言其所行之事云見此人常行其某事某事由此所行之事以爲有德之驗論語云如有所譽者其有所試矣是言試之於事乃可知其德禹曰至吉哉正義曰皐陶旣言其九德禹乃問其品例曰何謂也皐陶曰人性有寛􅀪而能莊栗也和柔而能立事也慤愿而能恭恪也治理而能謹敬也和順而能果毅也正直而能温和也􅂤大而有廉隅也剛斷而能實塞也強勁而合道義也人性不同有此九德人君明其九德所有之常以此擇人而官之則爲政之善哉傳性寛至莊栗正義曰此九德之文舜典云寛而栗直而温與此正同彼云剛而無虐􅂤而無傲與此小異彼言剛失入虐此言剛斷而能實塞實塞亦是不爲虐彼言簡失入傲此言􅂤大而有廉隅廉隅亦是不爲傲也九德皆人性也鄭􅀇云凡人之性有異有其上者不必有下有其下者不必有上上下相恊乃成其德是言上下以相對各令以相對兼而有之乃爲一德此二者雖是本性亦可以長短自矯寛􅀪者失於緩慢故性寛􅀪而能矜莊嚴栗乃成一德力者皆然也傳慤愿而恭恪正義曰愿者慤謹良善之名謹愿者失於遲鈍貌或不恭故慤愿而能恭恪乃爲德傳亂治至謹敬正義曰亂治釋詁文有能治者謂才髙於人也堪撥煩理劇者也負才輕物人之常性故有治而能謹敬乃爲德也愿言恭治云敬者恭在貌敬在心愿者遲鈍失於外儀故言恭以表貌治者輕物内失於心故稱敬以顯情恭與敬其事亦通愿其貌恭而心敬也傳擾順至爲毅正義曰周禮太宰云以擾萬民鄭􅀇云擾猶馴也司徒云安擾邦國鄭云擾亦安也擾是安馴之義故爲順也致果爲毅宣二年左傳文彼文以殺敵爲果致果爲毅謂能致果敢殺敵之心是爲強貌也和順者失於不斷故順而能決乃爲德也傳性􅂤至廉隅正義曰簡者寛大率略之名志逺者遺近務大者輕細􅀪大者失于不謹細行者不修廉隅故簡大而有廉隅乃爲德也傳剛斷而實塞正義曰塞訓實也剛而能斷失於空踈必性剛正而内充實乃爲德也傳無所至合義正義曰強直自立無所屈撓或任情違理失於事冝動合道義乃爲德也鄭注論語云剛謂強志不屈撓即剛強義同此剛強異者剛是性也強是志也當官而行無所避忌剛也執已所是不爲衆撓強也剛強相近鄭連言之寛謂度量寛􅀪柔謂性行和柔擾謂事理擾順三者相􅀋即洪範云柔克也愿謂容貌恭正亂謂剛柔治理直謂身行正直三者相􅀋即洪範云正直也􅂤謂器量凝􅂤剛謂事理剛斷強謂性行堅強三者相􅀋即洪範云剛克也而九德之次從柔而至剛也惟擾而毅在愿亂之下耳其洪範三德先人事而後天地與此不同傳彰明至之善正義曰彰明吉善常訓也此句言用人之義所言九德謂彼人常能然者若暫能爲之未成爲德故人君取士必明其九德之常知其人常能行之然後以此九者之法擇人而官之則爲政之善也明謂人君明知之王肅云明其有常則善也言有德當有恒也其意亦言彼能有常人君能明之也鄭云人能明其德所行使有常則成善人矣其意謂彼人自明之與孔異也日宣至其凝正義曰皐陶旣陳人有九德冝擇而官之此又言官之所冝􅀂人能日日宣布三德早夜思念而須明行之此人可以爲卿大夫使有家也􅀂日日嚴敬其身又能敬行六德信能治理其事此人可以爲諸侯使有國也然後揔以天子之任合受有家有國三六之德而用之布施政敎使九德之人皆得用事事各盡其能無所遺棄則天下俊德治能之士並在官矣皆隨賢才任職百官各師其師轉相敎誨則百官惟皆是矣無有非者以此撫順五行之時以化天下之民則衆功其皆成矣結上知人安民之意傳三德至大夫正義曰此文承九德之下故知三德是九德之内課有其三也周語云宣布哲人之令德宣亦布義故爲布也夙早釋詁文又云須待也此經之意謂夜思之明旦行之須爲待之意故浚爲須也大夫受采邑賜氏族立宗廟丗不絶祀故稱家位不虚受非賢臣不可言能日日布行三德早夜思之待明行之如此念德不懈怠者乃可以爲大夫也以士卑故言不及也計有一德二德即可以爲士也鄭以三德六德皆亂而敬以下之文經無此意也傳有國至諸侯正義曰天子分地建國諸侯專爲已有故有國謂諸侯也祗亦爲敬敬有二文上謂敬身下謂敬德嚴則敬之狀也故言日日嚴敬其身敬行六德以信治政事則可以爲諸侯也諸侯大夫皆言日日者言人之行德不可暫時捨也臣當行君之今故早夜思之君是出令者故言敬身行德此文以小至大揔以天子之事故先大夫而後諸侯傳翕合至在官正義曰翕合釋詁文以文承三德六德之下故言合受三六之德而用之以此人爲官令其布施政敎使此九德之人皆居官用事謂天子也任之所能大夫所行三德或在諸侯六德之内但并此三六之德即充九數故言九德皆用事謂用爲大夫用爲諸侯使之治民事也大夫諸侯當身自行之故言日宣日嚴天子當任人使行之故言合受而用之其實天子亦備九德故能任用三德六德也則俊德治能之士並在官矣乂訓爲治故云治能馬王鄭皆云才德過千人爲俊百人爲乂傳僚工至無非正義曰僚官釋詁文工官常訓也師師謂相師法也傳凝成至皆成正義曰鄭􅀇亦云凝成也王肅云凝猶定也皆以意訓耳文承百工之下撫于五辰還是百工撫之故云百官皆撫順五行之時則衆功皆成也五行之時即四時也禮運曰播五行於四時土􅀉王四季故爲五行之時也所撫順者即堯典敬授民時平秩東作之􅀋是也無敎至懋哉正義曰皐陶旣言用人之法又戒以居官之事之所爲下必效之無敎在下爲逸豫貪欲之事是有國之常道也爲人君當兢兢然戒愼業業然危懼言當戒愼一日二日之閒而有萬種幾微之事皆須親自知之不得自爲逸豫也萬幾事多不可獨治當立官以佐已無得空廢衆官使才非其任此官乃是天官人其代天治之不可以天之官而用非其人乂言典禮德刑皆從天出天次敘人倫使有常性故人君爲政當勑正我父母兄弟子五常之敎敎之使五者皆惇厚哉天又次敘爵命使有禮法故人君爲政當奉用我公侯伯子男五等之禮接之使五者皆有常哉接以常禮當使同敬合恭而和善哉天又命用有九德使之居官當承天意爲五等之服使五者尊卑彰明哉天又討治有罪使之絕惡當承天意爲五等之刑使五者輕重用法哉典禮德刑無非天意人君居天官聽治政事當須勉之哉傳不爲至之常正義曰母者禁戒之辭人君身爲逸欲下則效之是以禁人君使不自爲耳不爲逸豫貪欲之敎是有國者之常也此文主於天子天子謂天下爲國詩云生此王國之􅀋是也傳兢兢至之微正義曰釋訓云兢兢戒也業業危也戒必愼危必懼傳言愼懼以足之易繫辭云幾者動之微故幾爲微也一日二日之閒微者乃有萬事言當戒愼萬事之微微者尚有萬則大事必多矣且微者難察察則勞神以言不可逸耳馬王皆云一日二日猶日日也傳曠空至其才正義曰曠之爲空常訓也位非其人所職不治是爲空官天不自治立君乃治之君不獨治爲臣以佐之下典禮德刑無非天意者天意旣然人君當順天是言人當代天治官官則天之官居天之官代天爲治苟非其人不堪此任人不可以天之官而私非其才王肅云天不自下治之故人代天居之不可不得其人也傳天次至天下正義曰天敘有典有此五典即父義母慈兄友弟恭子孝是也五者人之常性自然而有但人性有多少耳天次敘人之常性使之各有分義義冝也今此義慈友恭孝各有定分合於事冝此皆出天然是爲天次敘之天意旣然人君當順天之意勑正我五常之敎使合於五者皆厚以敎天下之民也五常之敎人君爲之故言我也五敎徧於海内故以天下言之傳庸常至有常正義曰庸常釋詁丈又云由自也由是用故自爲用也天次敘有禮謂使賤事貴卑承尊是天道使之然也天意旣然人君當順天意用我公侯伯子男五等之禮以接之使之貴賤有常也此文主於天子天子至於諸侯車旗衣服國家禮儀饗食燕好饔餼飱牢禮各有次秩以接之上言天敘此云天秩者敘謂定其倫次秩謂制其差等義亦相通上云勑我此言自我者五典以敎下民須勑戒五禮以接諸侯當用我意故文不同也上言五惇此言五庸者五典施於近親欲其恩厚五禮施于臣下欲其有常故文異也王肅云五禮謂王公卿大夫士鄭􅀇云五禮天子也諸侯也卿大夫也士也庶民也此無文可據各以意􅀃耳傳衷善至和善正義曰衷之爲善常訓也故左傳云天誘其束􅀃者皆以衷爲善此文承五禮之下禮尚恭敬故以五禮正諸侯使同敬合恭而和善也鄭􅀇以爲并上之禮共有此事五典室家之内務在相親非復言以恭敬恭敬惟爲五禮而巳孔言是也傳五服至有德正義曰益稷云以五采彰施於五色作服汝明是天子諸侯卿大夫士之服也其尊卑彩章各異於彼傳具之天命有德使之居位命有貴賤之倫位有上下之異不得不立名以此等之象物以彰之先王制爲五服所以表貴賤也服有等差所以別尊卑也天聦至襄哉正義曰此承上懋哉之下言所勉之者以天之聦明視聽觀人有德用我民以爲耳目之聦明察人言善者天意歸賞之又天之明德可畏天威者用我民言惡而叛之因討而伐之成其明威天所賞罰達於上下不避貴賤故須敬哉有土之君皐陶旣陳此戒欲其言入之故曰我之此言順於古道可致行不可忽也禹即受之曰然汝言用而致可以立功重其言以深戒帝皐陶乃承之以謙曰我未有所知未能思致於善我所言曰徒賛奏上古所行而言之哉非已知思而所自能是其謙也傳言天至聦明正義曰皇天無心以百姓之心爲心此經大意言民之所欲天必從之聦明謂聞見也天之所聞見用民之所聞見也然則聦明直是聞見之義其言未有善惡以下言明威是天降之禍知此聦明是天降之福此即泰誓所云天聽自我民聽天視自我民視故民所歸者天命之大而言之民所歸就天命之爲天子也小而言之雖公卿大夫之任亦爲民所歸向乃得居之此文王於天子故言天視聽人君之行用民爲聦明戒天子使順民心受天之福也傳言天至敬懼正義曰上句有賞罰故言天所賞罰不避貴賤此之達於上下言天子亦不免也喪服鄭􅀇注云天子諸侯及卿大夫有地者皆曰君即此有土可兼大夫以上但此文本意實主於天子戒天子不可不敬懼也傳言我至之序正義曰皐陶自言可致行禹言致可績此承而爲謙知其自言未有所知未能思致於善也思字屬上句王肅云賛賛猶賛奏也顧氏云襄上也謂賛奏上古行事而言之也經云曰者謂我上之所言也傳不訓襄爲上巳從襄陵而釋之故二劉並以襄爲因􅀂必爲因孔傳無容不訓其意言進習上古行事因賛成其辭而言之也傳雖不訓襄字其義當如王􅀃皐陶慮怱之自
