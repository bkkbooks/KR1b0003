  text: 尚書正義卷第三
  hash: sha256:d3f02a09085aa97a15b28b65c4b692ebbc1403d17b5fefaf8943578bd3cd30fe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_003-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰舜典第二虞書虞舜至舜典正義曰虞舜所居側􅋘身又微賤堯聞之有聦明聖德將使之繼已帝位歷試於諸所難爲之事史述其事故作舜典傳爲庶人故微賤正義曰此云側微即堯典側􅋘也不在朝廷謂之側其人貧賤謂之微居處褊隘故言􅋘此指解微故云爲庶人故微賤也帝繫云顓頊生窮蟬窮蟬生敬康敬康生句芒句芒生蟜牛蟜牛生瞽瞍瞽瞍生舜昭八年左傳云自幕至于瞽瞍無違命似其繼丗相傳常有國土孔言爲庶人者堯典云有鰥在下此云虞舜側微必是爲庶人矣蓋至瞽瞍始失國也傳嗣繼至難事正義曰嗣繼釋詁文經所云愼徽五典納于百揆賔于四門皆是試以治民之難事也曰􅀂至以位正義曰昔東晉之初豫章内史梅賾上孔氏傳猶闕舜典自此乃命以位巳上二十八字丗所不傳多用王范之注補之而皆以愼徽巳下爲舜典之初至齊蕭鸞建武四年吴興姚方興於大航頭得孔氏傳古文舜典亦􅀋太康中書乃表上之事未施行方興以罪致戮至隋開皇初購求遺典始得之史將録舜之美故爲題目之辭曰能順而考案古道而行之者是爲帝舜也又申其順考古道之事曰此舜能繼堯重其文德之光華用此德合於帝堯與堯俱聖明也此舜性有深沈智惠文章明鑒温和之色恭遜之容由名聞逺達信能充實上下濳行道德􅂛聞天朝堯乃徴用命之以位而試之也傳濬深至上下正義曰濬深哲智皆釋言文舎人曰濬下之深也哲大智也舜有深智言其智之深所知不淺近也經緯天地曰文照臨四方曰明詩云温温恭人言其色温而貌恭也舜旣有深逺之智又有文明温恭之德信能充實上下也詩毛傳訓塞爲實言能充滿天地之閒堯典所謂格于上下是也不言四表者以四表外無限極非可實滿故不言之堯舜道同德亦如一史官錯互爲文故與上篇相􅀋是其所合於堯也傳􅀇謂至徴用正義曰老子云􅀇之又􅀇衆妙之門則􅀇者微妙之名故云􅀇謂幽濳此舜在畎􅅿之閒濳行道德顯彰於外升聞天朝天朝者天子之朝也從下而上謂之爲升天子聞之故遂見徴用愼徽至弗嗣正義曰此承乃命以位之下言命之以位試之以事也堯使舜愼美篤行五常之敎而五常之敎皆能順從而行之無違命也又納於百官之事命揆度行之而百事所揆度者於是皆得次序無廢事也又命使賔迎諸侯於四門而來入者穆穆然皆有美德無凶人也又納於大官揔録萬機之政而隂陽和風􅀨時烈風雷􅀨不有迷惑錯謬明舜之德合於天天人和協其功成矣帝堯乃謂之曰來汝舜有所謀之事我考驗汝舜之所言汝言致可以立功於今三年汝功巳成汝可升處帝位告以此言欲禪之也舜辭讓於德言已德不堪嗣成帝也傳徽美至違命正義曰釋詁云徽善也善亦美也此五典與下文五品五敎其事一也一家之内品有五謂父母兄弟子也敎此五者各以一事敎父以義敎母以慈敎兄以友敎弟以恭敎子以孝是爲五敎也五者皆可常行謂之五典是五者同爲一事所從言之異耳文十八年左傳曰昔髙辛氏有才子八人伯奮仲堪叔獻季仲伯虎仲熊叔豹季貍忠肅恭懿宣慈惠和天下之民謂之八元舜臣堯舉八元使布五敎于四方父義母慈兄友弟恭子孝以此知五典是五常之敎謂此父義之等五事也皐陶謨云天敘有典自我五典五惇哉惇厚也行此五典須厚行之篤亦厚也言舜謹愼美善篤行斯道舉八元使布之於四方命敎天下之民以此五敎能使天下皆順從之無違逆舜之命也左傳又云故虞書數舜之功曰愼徽五典五典克從無違敎也父母於子並冝爲慈今分之者以父主敎訓母主撫養撫養在於恩愛故以慈爲名敎訓愛而加嚴故以義爲稱義者冝也理也敎之以義方使得事理之冝故爲義也釋訓云善兄弟爲友則兄弟之恩俱名爲友今云兄友弟恭者以其同志曰友友是相愛之名但兄弟相愛乃有長幼故分其弟使之爲恭恭敬於兄而兄友愛之傳揆度至事業正義曰揆度釋言文百揆者言百事皆度之國事散在諸官故度百事爲揔百官也周官云唐虞稽古建官惟百内有百揆四岳則百揆爲宮名故云納舜於此官也文十八年左傳云昔髙陽氏有才子八人蒼舒隤敳檮戭大臨尨降庭堅仲容叔達齊聖廣淵明允篤誠天下之民謂之八凱舜臣堯舉八凱使主后􅁟以揆百事莫不時敘地平天成又云虞書數舜之功曰納于百揆百揆時敘無廢事業也是言百官於是得其次敘皆無廢事業舜旣臣堯乃舉元凱主后土布五敎同時爲之史官立文自以人事外内爲次故孔先言八元􅀂左傳據所出代之先後故先舉八凱堯旣得舜庶事委之舜旣臣堯任無不統非五典克從之後方始納於百揆百揆時敘之後方始賔于四門四門穆穆謂流四凶流放四凶最在於前矣洪範云鯀則殛死禹乃嗣興是先誅鯀而後用禹明此言三事皆同時爲之但言百揆時敘故言納于百揆其實納于百揆初得即然由舜旣居百揆故得舉用二八􅀂偏居一職不得分使元凱傳穆穆美至凶人正義曰穆穆美也釋詁文四門四方之門謂四方諸侯來朝者從四門而入文十八年左傳歷言四凶之行乃云舜臣堯流四凶族渾敦窮竒檮杌饕餮投諸四裔以禦螭魅又曰虞書數舜之功曰賔于四門四門穆穆無凶人也是言皆有美德無凶人也案驗四凶之族皆是王朝之臣舜流王朝之臣而言諸侯無凶人者以外見内諸侯無凶人則王朝必無矣鄭􅀇以賔爲擯謂舜爲上擯以迎諸侯今孔不爲擯者則謂舜旣録攝事無不統以諸侯爲賔舜主其禮迎而待之非謂身爲擯也傳麓録至於天正義曰麓聲近録故爲録也皐陶謨云一日二日萬幾言天下之事事之微者有萬喻其多無數也納舜使大録萬機之政還是納於百揆揆度百事大録萬機揔是一事不爲異也但此言合于天故以大録言耳論語稱孔子曰迅雷風烈必變書傳稱越常之使久矣天之無烈風淫雨則烈風是猛疾之風非善風也經言烈風雷􅀨弗迷言舜居大録之時隂陽和風􅀨時無此猛烈之風又雷􅀨各以其節不有迷錯愆伏也迷錯者應有而無應無而有也昭四年左傳云冬無愆陽夏無伏隂無愆伏者無冬温夏寒也舜録大政天時如此明舜之德合於天也此文與上三事亦同時也上爲變人此爲動天故最後言之以爲功成之驗王肅云堯得舜任之事無不統自愼徽五典以下是也其言合孔意傳格來至禪之正義曰格來釋言文詢謀陟􅂛釋詁文厎聲近致故爲致也經傳言汝多呼爲乃知乃汝義同凡事之始必先謀之後爲之堯呼舜曰來汝舜呼使前而與之言也汝所謀事我考汝言汝所爲之事皆副汝所謀致可以立功於今三年矣從徴得至此爲三年也君之馭臣必三年考績考旣有功故使􅂛帝位將禪之也鯀三考乃退此一考使􅂛者鯀待三考兾其有成無成功乃黜爲緩刑之義舜旣有成更無所待故一考即􅂛之且大聖之事不可以常法論也􅀂然禹貢兖州作十有三載乃同是禹治兖州之水乃積十有三年此始三年巳言地平天成者祭法云鯀障洪水而殛死禹能修鯀之功先儒馬融等皆以爲鯀旣九年又加此三年爲十二年惟兖州未得盡平至明年乃畢八州巳平一州未畢足以爲成功也正月至羣后正義曰舜旣讓而不許乃以堯禪之明年正月上日受堯終帝位之事於堯文祖之廟雖受堯命猶不自安又以璿爲璣以玉爲衡者是爲王者正天文之器也乃復察此璿璣玉衡以齊整天之日月五星七曜之政觀其齊與不齊齊則受之是也不齊則受之非也見七政皆齊知已受爲是遂行爲帝之事而以告攝事􅀋祭於上帝祭昊天及五帝也又禋祭於六宗等尊卑之神望祭於名山大川五岳四瀆而又徧祭於山川丘陵墳衍古之聖賢之羣神以告已之受禪也告祭旣畢乃斂公侯伯子男五等之瑞玉其圭與璧悉斂取之盡以正月之中乃日日見四岳及羣牧旣而更班所斂五瑞於五等之羣后而與之更始見巳受堯之禪行天子之事也傳上日至祖廟正義曰月之如日謂之朔日每月皆有朔日此是正月之朔故云上日言一歳日之上也下云元日亦然鄭􅀇以爲帝王易代莫不改正堯正建丑舜正建子此時未改堯正故云正月上日即位乃改堯正故云月正元日故以異文先儒王肅等以爲惟殷周改正易民視聽自夏巳上皆以建寅爲正此篇二文不同史異辭耳孔意亦然下云歳二月傳云旣班瑞之明月以此爲建寅之月也受終者堯爲天子於此事終而授與舜故知終謂堯終帝位之事終言堯終舜始也禮有大事行之於廟況此是事之大者知文祖者堯文德之祖廟也且下云歸格于藝祖藝文義同知文祖是廟者咸有一德云七丗之廟可以觀德則天子七廟其來自逺堯之文祖蓋是堯始祖之廟不知爲誰也帝繫及丗本皆云黃帝生􅀇嚻􅀇嚻生僑極僑極生帝嚳帝嚳生堯即如彼言黃帝爲堯之髙祖黃帝以上不知復祭何人充此七數況彼二書未必可信堯之文祖不可強言傳在察至與否正義曰在察釋詁文􅀃文云璿美王也玉是大名璿是玉之別稱璣衡俱以玉飾但史之立文不可以玉璣玉衡一指玉體一指玉名猶左傳云瓊弁玉纓所以變其文傳以璿言玉名故云美玉其實玉衡亦美玉也易賁卦􅂏云觀乎天文以察時變日月星􅀫運行於天是爲天之文也璣衡者璣爲轉運衡爲撗簫運璣使動於下以衡望之是王者正天文之器漢丗以來謂之渾天儀者是也馬融云渾天儀可旋轉故曰璣衡其撗簫所以視星􅀫也以璿爲璣以玉爲衡蓋貴天象也蔡邕云玉衡長八尺孔徑一寸下端望之以視星辰蓋懸璣以象天而衡望之轉機窺衡以知星􅀫是其􅀃也七政其政有七於璣衡察之必在天者知七政謂日月與五星也木曰歳星火曰熒惑星土曰鎭星金曰太白星水曰辰星易繫辭云天垂象見吉凶聖人象之此日月五星有吉凶之象因其變動爲占七者各自異政故爲七政得失由政故稱政也舜旣受終乃察璣衡是舜察天文齊七政以審已之受禪當天心與否也馬融云日月星皆以璿璣玉衡度知其盈縮進退失政所在聖人謙讓猶不自安視璿璣玉衡以驗齊日月五星行度知其政是與否重審已之事也上天之體不可得知測天之事見於經者唯有此璿璣玉衡一事而巳蔡邕天文志云言天體者有三家一曰周髀二曰宣夜三曰渾天宣夜絕無師􅀃周髀術數具在考驗天象多所違失故史官不用惟渾天者近得其情今史所用候臺銅儀則其法也虞喜云宣明也夜幽也幽明之數其術兼之故曰宣夜但絕無師􅀃不知其狀如何周髀之術以爲天似覆盆蓋以斗極爲中中髙而四邊下日月旁行遶之日近而見之爲晝日逺而不見爲夜渾天者以爲地在其中天周其外日月初登於天後入於地晝則日在地上夜則日入地下王蕃渾天􅀃曰天之形狀似鳥􅆑天包地外猶􅆑之裹黃圎如彈九故曰渾天言其形體渾渾然也其術以爲天半覆地上半在地下其天居地上見有一百八十二度半強地下亦然北極出地上三十六度南極入地下亦三十六度而嵩髙正當天之中極南五十五度當嵩髙之上又其南十二度爲夏至之日道又其南二十四度爲春秋分之日道又其南二十四度爲冬至之日道南下去地三十一度而巳是夏至日北去極六十七度春秋分去極九十一度冬至去極一百一十五度此其大率也其南北極持其兩端其天與日月星􅀫斜而迴轉此必古有其法遭秦而滅揚子法言云或問渾天曰落下閎營之鮮于妄人度之耿中丞象之幾乎幾乎莫之能違也是揚雄之意以渾天而問之也閎與妄人武帝時人宣帝時司農中丞耿壽昌始鑄銅爲之象史官施用焉後漢張衡作靈憲以􅀃其狀蔡邕鄭􅀇陸繢吳時王藩晉丗姜岌張衡葛洪皆論渾天之義並以渾􅀃爲長江南宋元嘉年皮延宗又作是渾天論太史丞錢樂鑄銅作渾天儀傳於齊梁周平江陵遷其器於長安今在太史書矣衡長八尺璣徑八尺圎周二丈五尺強轉而望之有其法也傳堯不至五帝正義曰傳以旣受終事又察璣衡方始祭於羣神是舜察天文考齊七政知已攝位而當於天心故行其天子之事也祭法云有天下者祭百神徧然羣神是天子事也肆是縱緩之言此因前事而行後事故以肆爲遂也􅀋謂攝位事􅀋旣知攝當天遂以攝位事􅀋告天帝也此􅀋與下禋望相次當爲祭名詩云是􅀋是禡周禮肆師云􅀋造上帝王制云天子將出􅀋乎上帝所言􅀋者皆是祭天之事言以事􅀋而祭也周禮小宗伯云天地之大烖􅀋社稷則爲位是􅀋之爲祭所及者廣而傳之􅀋謂攝位事􅀋者以攝位而告祭故􅀋爲祭名周禮司服云王祀昊天上帝則服大裘而冕祀五帝亦如之是昊天外更有五帝上帝可以兼之故以告天及五帝也鄭􅀇篤信䜟緯以爲昊天上帝謂天皇大帝北辰之星也五帝謂靈威仰等太微宮中有五帝座星是也如鄭之言天神有六也家語云季康子問五帝之名孔子曰天有五行金木水火土分時化育以成萬物其神謂之五帝王肅云五行之神助天理物者也孔意亦當然矣此經惟有祭天不言祭地及社稷必皆祭之但史略文耳傳精意至攝告正義曰國語云精意以享禋也釋詁云禋祭也孫炎曰禋絜敬之祭也周禮大宗伯云以禋祀祀昊天上帝以實柴祀日月星辰以槱燎祀司中司命風師􅀨師鄭云禋之言煙周人尚臭煙氣之臭聞者也鄭以禋祀之文在燎柴之上故以禋爲此解耳而洛誥云秬鬯二卣曰明禋又曰禋于文王武王又曰王賔殺禋咸格經傳之文此􅀋多矣非燔柴祭之也知禋是精誠絜敬之名耳宗之爲尊常訓也名曰六宗明是所尊祭者有六但不知六者爲何神耳祭法云理少牢於太昭祭時相近於坎壇祭寒暑王宫祭日夜明祭月幽禜祭星雩禜祭水旱也據此言六宗彼祭六神故傳以彼六神謂此六宗必謂彼之所祭是此六宗者彼文上有祭天祭地下有山谷丘陵此六宗之文在上帝之下山川之上二者次第相􅀋故知是此六宗王肅亦引彼文乃云禋于六宗此之謂矣鄭􅀇注彼云四時謂隂陽之神也然則隂陽寒暑水旱各自有神此言禋于六宗則六宗常禮也禮無此文不知以何時祀之鄭以彼皆爲祈禱之祭則不可用鄭􅀇注以解此傳也漢丗以來􅀃六宗者多矣歐陽及大小夏侯􅀃尚書皆云所祭者六上不謂天下不謂地旁不謂四方在六者之閒助隂陽變化實一而名六宗矣孔光劉歆以六宗謂乾坤六子水火雷風山澤也賈逵以爲六宗者天宗三日月星也地宗三河海岱也馬融云萬物非天不覆非地不載非春不生非夏不長非秋不收非冬不藏此其謂六也鄭􅀇以六宗言禋與祭天同名則六者皆是天之神祇謂星辰司中司命風師雨師星謂五緯也辰謂日月所㑹十二次也司中司命文昌第五第四星也風師箕也􅀨師畢也晉初幽州秀才張髦上表云臣謂禋于六宗祀祖考所尊者六三昭三穆是也司馬彪又上表云歷難諸家及自言已意天宗者日月星辰寒暑之屬也地宗社稷五祀之屬也四方之宗四時五帝之屬惟王肅據家語六宗與孔同各言其志未知孰是司馬彪續漢書云安帝元初六年立六宗祠於洛陽城西北亥地祀比大社魏亦因之晉初荀顗定新祀以六宗之神諸􅀃不同廢之摯虞駁之謂冝依舊近代以來皆不立六宗之祠也傳九州至祭之正義曰望於山川大揔之語故知九州之内所有名山大川五岳四瀆之屬皆一時望祭之也王制云名山大川不以封山川大乃有名是名大互言之耳釋山云泰山爲東嶽華山爲西嶽霍山爲南嶽恒山爲北嶽嵩髙山爲中嶽白虎通云岳者何捔也捔考功德也應邵風俗通云岳者捔考功德黜陟也然則四方方有一大山天子巡守至其下捔考諸侯功德而黜陟之故謂之岳釋水云江河淮濟爲四瀆四瀆者發源注海者也釋名云瀆獨也各獨出其水而入海也岳是名山瀆是大川故先言名山大川又舉岳瀆以見之岳瀆之外猶有名山大川故言之屬以包之周禮大司樂云四鎭五嶽崩令去樂鄭云四鎭山之重大者謂揚州之㑹稽山靑州之沂山幽州醫無閭山兾州之霍山是五岳之外名山也周禮職方氏毎州云其川其浸􅀂雍州云其川涇汭其浸渭洛如此之􅀋是四瀆之外大川也言徧于羣神則神無不徧故羣神謂丘陵墳衍古之聖賢皆祭之周禮大司樂云凡六樂者一變而致川澤之示再變而致山林之示三變而致丘陵之示四變而致墳衍之示鄭􅀇大司徒注云積石曰山竹木曰林注瀆曰川水鍾曰澤土髙曰丘大阜曰陵水崖曰墳下平曰衍此傳舉丘陵墳衍則林澤亦包之矣古之聖賢謂祭法所云在祀典者黃帝顓頊句龍之􅀋皆祭之也傳輯斂至正始正義曰覲見后君釋詁文釋言云輯合也輯是合聚之義故爲斂也日月食盡謂之旣是旣爲盡也釋言云班賦也孫炎曰謂布與也輯是斂聚班爲散布故爲還也下云班瑞于羣后則知輯者從羣后而斂之故云舜斂公侯伯子男之瑞圭璧也周禮典瑞云公執􅁊圭侯執信圭伯執躬圭子執􅂖璧男執蒲璧是圭璧爲五等之瑞諸侯執之以爲王者瑞信故稱瑞也舜以朔日受終於文祖又徧祭羣神及斂五瑞則入月以多日矣盡以正月中謂從斂瑞以後至月末也乃日日見四岳及九州牧監舜初攝位當發號出令日日見之與之言也州牧各監一州諸侯故言監也更復還五瑞於諸侯者此瑞本受於堯斂而又還之若言舜新付之改爲舜臣與之正新君之始也歳二月至以庸正義曰舜旣班瑞羣后即以其歳二月東行巡省守土之諸侯至於岱宗之岳燔柴告至又望而以秩次祭於其方岳山川柴望旣畢遂以禮見東方諸侯諸國之君於此諸國協其四時氣節月之大小正其日之甲乙使之齊一均同其國之法制度之丈尺量之斛斗衡之斤兩皆使齊同無輕重大小又修五禮吉凶賔軍嘉之禮修五玉公侯伯子男所執之圭璧也又修三帛諸侯丗子公之􅀌附庸之君所執􅀇纁黃之帛也又修二生卿所執羔大夫所執鴈也又修一死士所執雉也自五玉至於一死皆蒙上修文揔言所用玉帛生死皆爲贄以見天子也其贄之内如五玉之器禮終乃復還之其帛與生死則不還也東岳禮畢即向衡山五月南巡守至于南岳之下柴望以下一如岱宗之禮南岳禮畢即向華山八月西巡守至于西岳之下其禮如初時如岱宗所行西岳禮畢即向恒山朔北也十有一月北巡守至于北岳之下一如西岳之禮巡守旣周乃歸京師藝文也至於文祖之廟用特牛之牲設祭以告巡守歸至也從是以後每五載一巡守其巡守之年諸侯羣后四方各朝天子於方岳之下其朝之時各使自陳進其所以治化之言天子明試其言以考其功功成有驗則賜之車服以表顯其有功能用事傳諸侯至告至正義曰王者所爲巡守者以諸侯自專一國威福在已恐其擁遏上命澤不下流故時自巡行問民疾苦孟子稱晏子對齊景公云天子適諸侯曰巡守巡守者巡所守也是言天子巡守主謂巡行諸侯故言諸侯爲天子守土故稱守而往巡行之定四年左傳祝鮀言衞國取相土之東都以㑹王之東蒐蒐是獵之名也王者因巡諸侯或亦獵以敎戰其守皆作狩白虎通云王者所以巡狩者也巡者循也狩者收也爲天子循收養人彼因名以附􅀃不如晏子之言得其本也正月班瑞二月即行故云旣班瑞之明月乃順春東巡春位在東故順春也爾雅泰山爲東岳此巡守至於岱岱之與泰其山有二名也風俗通云泰山山之尊者一曰岱宗岱始也宗長也萬物之始隂陽交代故爲五岳之長是解岱即泰山爲四岳之宗稱岱宗也郊特牲云天子適四方先柴是燔柴爲祭天告至也傳東岳至子男正義曰四時各至其方岳望祭其方岳山川故云東岳諸侯境内名山大川如其秩次望祭之也言秩次而祭知徧於羣神故云五岳牲禮視三公四瀆視諸侯其餘視伯子男也其尊卑所視王制及書傳之文牲禮二字孔増之也諸侯五等三公爲上等諸侯爲中等伯子男爲下等則所言諸侯惟謂侯爵者耳其言所視蓋視其祭祀祭五岳如祭三公之禮祭四瀆如祭諸侯之禮祭山川如祭伯子男之禮公侯伯子男尊卑旣有等級其祭禮必不同但古典亡滅不可復知鄭􅀇注書傳云所視者謂其牲幣粢盛籩豆爵獻之數案五等諸侯適天子皆膳用太牢禮諸侯祭皆用太牢無上下之別又大行人云上公九獻侯伯七獻子男五獻掌客上公饔餼九牢飱五牢侯伯饔餼七牢飱四牢子男饔餼五牢飱三牢又上公豆四十侯伯三十二子男二十四並伯與侯同又鄭注禮器四望五獻據此諸文與孔傳王制不同者掌客行人自是周法孔與王制先代之禮必知然者以周禮侯與伯同公羊及左氏傳皆以公爲上伯子男爲下是其異也傳合四至均同正義曰上篇巳訓協爲合故注即以合言之也他皆倣此周禮太史云正歳年頒告朔於邦國則節氣晦朔皆天子頒之猶恐諸侯國異或不齊同故因巡守而合和之節是月初氣是月半也丗本云容成作曆大撓作甲子二人皆黃帝之臣蓋自黃帝巳來始用甲子紀日每六十日而甲子一周史記稱紂爲長夜之飲忘其日辰恐諸侯或有此之􅀋故須合日之甲乙也時也月也日也三者皆當勘檢諸國使齊一也律者􅃸氣之管而度量衡王者法制皆出於律故云律法制也度有丈尺量有斛斗衡有斤兩皆取法於律故孔解律爲法制即云及尺丈斛斗斤兩皆均同之漢書律曆志云度量衡出於黃鐘之律也度者分寸尺丈引所以度長短也本起於黃鐘之管長以子穀秬黍中者以一黍之廣度之千二百黍爲一分十分爲寸十寸爲尺十尺爲丈十丈爲引而五度審矣量謂龠合􅂛斗斛所以量多少也本起於黃鐘之龠以子穀秬黍中者千有二百實爲一龠十龠爲合十合爲升十􅂛爲斗十斗爲斛而五量嘉矣權者銖兩斤鈞石所以稱物知輕重也本起於黃鐘之龠一龠容千二百黍重十二銖兩銖之爲兩十六兩爲斤三十斤爲鈞四鈞爲石而五權謹矣權衡一物衡平也權重也稱上謂之衡稱鎚謂之權所從言之異耳如彼志文是度量衡本起於律也時月言協日言正度量衡言同者以時月須與他月和合故言協日有正與不正故言正度量衡俱是民之所用恐不齊同故言同因事冝而變名耳傳修吉至其玉正義曰周禮大宗伯云以吉禮事邦國之􅀑神示以凶禮哀邦國之憂以賔禮親邦國以軍禮同邦國以嘉禮親萬民之昬姻知五禮謂此也帝王之名旣異古今之禮或殊而以周之五禮爲此五禮者以帝王相承事有損益後代之禮亦當是前代禮也且曆驗此經亦有五事此篇􅀋於上帝吉也如喪考妣凶也羣后四朝賔也大禹謨云汝徂征軍也堯典云女于時嘉也五禮之事並見於經知與後丗不異也此云五玉即上文五瑞故知五等諸侯執其玉也鄭􅀇云執之曰瑞陳列曰玉傳諸侯至執黃正義曰周禮典命云凡諸侯之適子誓於天子攝其君則下其君之禮一等未誓則以皮帛繼子男之下公之􅀌四命以皮帛眡小國之君是諸侯丗子公之􅀌執帛也附庸雖則無文而爲南面之君是一國之主春秋時附庸之君適魯皆稱來朝未有爵命不得執玉則亦繼小國之君同執帛也經言三帛必有三色所云纁􅀇黃者孔時或有所據未知出何書也王肅云三帛纁􅀇黃也附庸與諸侯之適子公之􅀌執皮帛其執之色未詳聞或曰􅀌執􅀇諸侯之適子執纁附庸執黄王肅之注尚書其言多同孔傳周禮􅀌與丗子皆執皮帛鄭􅀇云皮帛者束帛而表之以皮爲之飾皮虎豹皮也此三帛不言皮蓋于時未以皮爲飾傳卿執至執雉正義曰此皆大宗伯文也鄭􅀇曰羔小羊取其羣而不失其􅀋也鴈取其候時而行也雉取其守介死不失節也曲禮云飾羔鴈者以繢謂衣之以布而又畫之雉執之無飾士相見之禮卿大夫飾贄以布不言繢此諸侯之臣與天子之臣異也鄭之此言論周之禮耳虞時毎事猶質羔鴈不必有飾傳玉帛至見之正義曰曲禮云贄諸侯圭卿羔大夫鴈士雉雉不可生知一死是雉二生是羔鴈也鄭􅀇云贄之言至所執以自至也自五玉以下蒙上修文者執之使有常也若不言贄則不知所用故言贄以結上文見玉帛生死皆所以爲贄以見君與自相見其贄同也傳卒終至則否正義曰卒終釋詁文釋言云還復返也是還復同義故爲還也五器文在贄下則是贄内之物周禮大宗伯云以玉作五器知器謂圭璧即五玉是也如若也言諸侯贄之内若是五器禮終乃還之如三帛生死則不還也聘義云以圭璋聘重禮也巳聘而還圭璋此輕財而重禮之義也聘義主於􅀃聘其朝禮亦然周禮司儀云諸公相見爲賔還圭如將幣之儀是圭璧皆還之也士相見禮言大夫以下見國君之禮云􅀂邦他之人則使擯者還其贄已臣皆不還其贄是三帛生死則否傳南岳至月至正義曰釋山云河南華河東岱河北恒江南衡李巡云華西岳華山也岱東岳泰山也恒北岳恒山也衡南岳衡山也郭璞云恒山一名常山避漢文帝諱釋山又云泰山爲東岳華山爲西岳霍山爲南岳恒山爲北岳岱之與泰衡之與霍皆一山而有兩名也張揖云天柱謂之霍山漢書地理志云天柱在廬江􅈞縣則霍山在江北而與江南衡爲一者郭璞爾雅注云霍山今在廬江􅈞縣濳水出焉別名天柱山漢武帝以衡山遼曠故移其神於此今其彼土俗人皆呼之爲南岳南岳本自以兩山爲名非從近來也而學者多以霍山不得爲南岳又云漢武帝來始乃名之即如此言謂武帝在爾雅前乎斯不然矣是解衡霍二名之由也書傳多云五岳以嵩髙爲中岳此云四岳者明巡守至於四岳故也風俗通云泰山山之尊者一曰岱宗岱始也宗長也萬物之始隂陽交代故爲五岳之長王者受命恒封禪之衡山一名霍山言萬物霍然大也華也萬物變由西方也恒常也萬物伏北方有常也二月至於岱宗不指岳名者巡守之始故詳其文三時言岳名明岱亦是岳因事冝而互相見也四巡之後乃云歸格則是一出而周四岳故知自東岳而即南行以五月至也王者順天道以行人事故四時之月各當其時之中故以仲月至其岳上云歳二月東巡守以二月始發者此四時巡守之月皆以至岳爲文東巡以二月至非發時也但舜以正月有事二月即發行耳鄭􅀇以爲每岳禮畢而歸仲月乃復更去􅀂如鄭言當於東巡之下即言歸格後以如初包之何當北巡之後始言歸乎且􅀂來而復去計程不得周徧此事不必然也其經南云如岱禮西云如初北云如西禮者見四時之禮皆同互文以明耳不巡中岳者蓋近京師有事必聞不慮枉滯且諸侯分配四方無屬中岳故不須巡之也朔巡守正義曰釋訓云朔北方也故堯典及此與禹貢皆以朔言北史變文耳傳巡守至一牛正義曰此承四巡之下是巡守旣徧然後歸也以上受終在文祖之廟知此亦告至文祖之廟才藝文德其義相通故藝爲文也文祖藝祖史變文耳王制􅀃巡守之禮云歸格于祖禰用特此不言禰故傳推之言祖則考著考近於祖舉尊以及卑也特者獨也故爲一牛此唯言文祖故云一牛徧告諸廟廟用一牛故鄭注彼云祖下及禰皆一牛也此時舜始攝位未自立廟故知告堯之文祖也傳各㑹至可知正義曰此揔􅀃巡守之事而言羣后四朝是言四方諸侯各自㑹朝於方岳之下凡四處别朝故云四朝上文肆覲東后是爲一朝四岳禮同四朝見矣計此不冝須重言之爲將􅀃敷奏之事敷奏因朝而爲故申言之申重也此是巡守大法文在舜攝位之時嫌堯本不然故云堯舜同道舜攝則然堯又可知也堯法巳然舜無増改而言此以美舜者道同於堯足以爲美故史録之傳敷陳至能用正義曰敷者布散之言與陳設義同故爲陳也奏是進上之語故爲進也諸侯四處來朝每朝之處舜各使陳進其治理之言令自􅀃巳之治政旣得其言乃依其言明試之以要其功必如其言即功實成則賜之車服以表顯其人有才能可用也人以車服爲榮故天子之賞諸侯皆以車服賜之覲禮云天子賜侯氏以車服是也肈十至咸服正義曰史言舜旣攝位出行巡守復分置州域重愼刑罰於禹治水後始分置十有二州每州以一大山爲鎭殊大者十有二山深其州内之川使水通利又留意於民詳其罪罰依法用其常刑使罪各當刑不越法用流放之法寛宥五刑五刑雖有犯者或以恩減降不使身服其罪所以流放宥之五刑之外更有鞭作治官事之刑有扑作師儒敎訓之刑其有意善功惡則令出金贖罪之刑若過誤爲害原情非故者則緩縱而赦放之􅀂怙恃姧詐終行不改者則賊殺而刑罪之舜愼刑如此又設言以誡百官曰敬之哉敬之哉惟此刑罰之事最須憂念之哉令勤念刑罰不使枉濫也又言舜非於攝位之後方始重愼刑罰初於登用之日即用刑當其罪流徙共工於北裔之幽州放逐驩兜於南裔之崇山竄三苗于西裔之三危誅殛伯鯀于東裔之羽山行此四罪各得其實而天下皆服從之傳肈始至二州正義曰肈始釋詁文禹貢治水之時猶爲九州今始爲十二州知禹治水之後也禹之治水通鯀九載爲作十有三載則舜攝位元年九州始畢當是二年之後以境界太逺始別置之知分兾州爲幽州并州者以王者廢置理必相㳂周禮職方氏九州之名有幽并無徐梁周立州名必因於古知舜時當有幽并職方幽并山川於禹貢皆兾州之域知分兾州之域爲之也爾雅釋地九州之名於禹貢無梁靑而有幽營云燕曰幽州齊曰營州孫炎以爾雅之文與職方禹貢並皆不同疑是殷制則營州亦有所因知舜時亦有營州齊即靑州之地知分靑州爲之於此居攝之時始置十有二州蓋終舜之丗常然宣三年左傳云昔夏之方有德也貢金九牧則禹登王位還置九州其名蓋如禹貢其境界不可知也傳封大至通利正義曰釋詁云冢大也舎人曰冢封之大也定四年左傳云封豕長蛇相對是封爲大也周禮職方氏每州皆云其山鎭曰某山揚州㑹稽荆州衡山豫州華山雍州吳山兾州霍山并州恒山幽州醫無閭靑州沂山兖州岱山是周時九州之内最大之山舜時十有二山事亦然也州内雖有多山取其最髙大者以爲其州之鎭特舉其名是殊大之也其有川無大無小皆當深之故云濬川有流川則深之使通利也職方氏每州皆云其川其浸亦舉其州内大川但令小大俱通不復舉其大者故直云濬之而巳傳象法至越法正義曰易繫辭云象也者象此者也又曰天垂象聖人則之是象爲倣法故爲法也五刑雖有常法所犯未必當條皆須原其本情然然斷決或情有差降俱被重科或意有不同失出失入皆是違其常法故令依法用其常刑用之使不越法也傳宥寛至五刑正義曰寛宥周語文流謂徙之逺方放使生活以流放之法寛縱五刑也此惟解以流寛之刑而不解宥寛之意鄭􅀇云其輕者或流放之四罪是也王肅云謂君不忍刑殺有之以逺方然則知此是據狀合刑而情差可恕全赦則太輕致刑即太重不忍依例刑殺故完全其體宥之逺方應刑不刑是寛縱之也上言典刑此言五刑者其法是常其數則五象以典刑謂其刑之也流宥五刑謂其逺縱之也流言五刑則典刑亦五其文互以相見王肅云言宥五刑則正五刑見矣是言二文相通之意也典刑是其身流宥離其郷流放致罪爲輕此鞭爲重故次典刑之下先言流宥鞭扑雖輕猶虧其體比於出金贖罪又爲輕且以刑五罰雖主贖五刑其鞭扑之罪亦容輸贖故後言之此正刑五與流宥鞭扑俱有常法典字可以統之故發首言典刑也傳以鞭至之刑正義曰此有鞭刑則用鞭久矣周禮滌狼氏誓大夫曰敢不􅀜鞭五百左傳有鞭徒人費圉人犖是也子玉使鞭七人衞侯鞭師曹三百日末亦皆施用大隨造律方使廢之治官事之刑者言􅀂於官事不治則鞭之蓋量狀加之未必有定數也傳扑榎至撻之正義曰學記云榎楚二物以收其威鄭􅀇云榎槄也楚荆也二物可以扑撻犯禮者知扑是榎楚也旣言以收其威知不勤道業則撻之益稷云撻以記之又大射郷射皆云司馬搢扑則扑亦官刑惟言作敎刑者官刑鞭扑俱用敎刑惟扑而巳故屬扑於敎其實官刑亦當用扑蓋重者鞭之輕者撻之傳金黃至贖罪正義曰此以金爲黃金吕刑其罰百鍰傳爲黃鐵俱是贖罪而金鐵不同者古之金銀銅鐵揔號爲金别之四名耳釋器云黃金謂之盪白金謂之銀是黃金白銀俱名金也周禮考工記攻金之工築氏爲削冶氏爲殺矢鳧氏爲鐘㮚氏爲量段氏爲鎛桃氏爲劒其所爲者有銅有鐵是銅鐵俱名爲金則鐵名亦包銅矣此傳黃金吕刑黃鐵皆是今之銅也古之贖罪者皆用銅漢始改用黃金但少其斤兩令與銅相敵故鄭􅀇駁異義言贖死罪千鍰鍰六兩大半兩爲四百一十六斤十兩大半兩銅與金贖死罪金三斤爲價相依附是古贖罪皆用銅也實謂銅而謂之金鐵知傳之所言謂銅爲金鐵耳漢及後魏贖罪皆用黃金後魏以金難得合金一兩收絹十匹今律乃復依古死罪贖銅一百二十斤於古稱爲三百六十斤孔以鍰爲六兩計千鍰爲三百七十五斤今贖輕於古也誤而入罪出金以贖即律過失殺傷人各依其狀以贖論是也吕刑所言疑赦乃罰者即今律疑罪各從其實以贖論是也疑謂虚實之證等是非之理均或事渉疑似旁無證見或雖有證見事非疑似如此之􅀋言皆爲疑罪疑而罰贖吕刑巳明言誤而輸贖於文不顯故此傳指言誤而入罪以解此贖鞭扑加於人身可云扑作敎刑金非加人之物而言金作贖刑出金之與受扑俱是人之所患故得指其所出以爲刑名傳眚過至殺之正義曰春秋言肆眚者皆謂緩縱過失之人是肆爲緩也眚爲過也公羊傳云害物曰災是爲害也宣二年左傳晉侯殺趙盾使鉏麑賊之是賊爲殺也此經二句承上典刑之下揔言用刑之要過而有害雖據狀合罪而原心非故如此者當緩赦之小則恕之大則宥之上言流宥贖刑是也怙恃姧詐欺罔時人以此自終無心改悔如此者當刑殺之小者刑之大者殺之上言典刑及鞭扑皆是也經言賊刑傳云刑殺不順經文者隨便言之傳舜陳至得中正義曰此經二句舜之言也不言舜曰以可知而略之舜旣制此典刑又陳典刑之義以勑天下百官使敬之哉敬之哉惟刑之憂哉憂念此刑恐有濫失欲使得中也傳象恭至曰州正義曰堯典言共工之行云靜言庸違象恭滔天言貌象恭敬傲很漫天足以疑惑丗人故流放也左傳􅀃此事言投諸四裔釋地云燕曰幽州知北裔也水中可居者曰洲釋水文李巡曰四方有水中央髙獨可居故曰洲天地之勢四邊有水鄒衍書􅀃九州之外有瀛海環之是九州居水内故以州爲名共在一洲之上分之爲九耳州取水内爲名故引爾雅解州也投之四裔裔訓逺也當在九州之外而言於幽州者在州境之北邊也禹貢羽山在徐州三危在雍州故知北裔在幽州下三者所居皆言山名此共工所處不近大山故舉州言之此流四凶在治水前於時未作十有二州則無幽州之名而云幽州者史據後定言之傳黨於至南裔正義曰共工象恭滔天而驩兜薦之是黨於共工罪惡同故放之也左傳􅀃此事云流四凶族投諸四裔則四方方各有一人幽州在北裔雍州三危在西裔徐州羽山在東裔三方旣明知崇山在南裔也禹貢無崇山不知其處蓋在衡嶺之南也傳三苗至西裔正義曰昭元年左傳􅀃自古諸侯不用王命者虞有三苗夏有觀扈知三苗是國其國以三苗爲名非三國也杜預言三苗地闕不知其處三凶皆是王臣則三苗亦應是諸夏之國入仕王朝者也文十八年左傳言縉雲氏有不才子貪于飲食冒于貨賄侵欲崇侈不可盈厭聚斂積實不知紀極不分􅀌寡不恤窮匱天下之民以比三凶謂之饕餮即此三苗是也知其然者以左傳􅀃此事言舜臣堯流四凶族渾敦窮竒檮杌饕餮投諸四裔以禦螭魅謂此驩兜共工三苗與鯀也雖知彼言四凶此等四人但名不同莫知孰是惟當驗其行跡以别其人左傳􅀃窮竒之行云靖􅉲庸回堯典言共工之行云靜言庸違其事旣同知窮竒是共工也左傳􅀃渾敦之行云醜􅀋惡物是與比周堯典言驩兜薦舉共工與惡比周知渾敦是驩兜也左傳􅀃檮杌之行言不可敎訓不知話言傲很明德以亂天常堯典言鯀之行云咈哉方命圯族其事旣同知檮杌是鯀也惟三苗之行堯典無文鄭􅀇具引左傳之文乃云命驩兜舉共工則驩兜爲渾敦也共工爲窮竒也鯀爲檮杌也而三苗爲饕餮亦可知是先儒以書傳相考知三苗是饕餮也禹貢雍州言三危旣宅三苗丕敘知三危是西裔也傳方命至海中正義曰方命圯族是其本性績用不成試而無功二者俱是其罪故並言之釋言云殛誅也傳稱流四凶族者皆是流而謂之殛竄放流皆誅者流者移其居處􅀂水流然罪之正名故先言也放者使之自活竄者投棄之名殛者誅責之稱俱是流徙異其文述作之體也四者之次蓋以罪重者先共工滔天爲罪之最大驩兜與之同惡故以次之祭法以鯀障洪水故列諸祀典功雖不就爲罪最輕故後言之禹貢徐州云蒙羽其藝是羽止爲東裔也漢書地理志羽山在東海郡祝其縣西南海水漸及故言在海中也傳皆服至見之正義曰此四罪者徴用之初即流之也舜以微賤超􅂛上宰初來之時天下未服旣行四罪故天下皆服舜用刑得當其罪也自象以典刑以下徴用而即行之於此居攝之後追論成功之狀故作者先敘典刑言舜重刑之事而連引四罪述其刑當之驗明此諸事皆是徴用之時所行於此揔見之也知此等諸事皆徴用所行者洪範云鯀則殛死禹乃嗣興僖三十三年左傳云舜之罪也殛鯀其舉也興禹襄二十一年左傳云鯀殛而禹興此三者皆言殛鯀而後用禹爲治水是徴用時事四罪在治水之前明徴用所行也又下云禹讓稷契皐陶帝因追美三人之功所言稷播百穀契敷五敎皐陶作士皆是徴用時事皐陶所行五刑有服五流有宅即是象以典刑流宥五刑此爲徴用時事足可明矣而鄭􅀇以爲禹治水事畢乃流四凶故王肅難鄭言􅀂待禹治水功成而後以鯀爲無功殛之是爲舜用人子之功而流放其父則禹之勤勞適足使父致殛爲舜失五典克從之義禹䧟三千莫大之罪進退無據亦甚迂哉二十至八音正義曰舜受終之後攝天子之事二十有八載帝堯乃死百官感德思慕如喪考妣三載之内四海之人蠻炎戎狄皆絶靜八音而不復作樂是堯盛德恩化所及者逺也傳殂落至七歳正義曰殂落死也釋詁文李巡曰殂落堯死之稱郭璞曰古死尊卑同稱故書堯曰殂落舜曰陟方乃死謂之殂落者蓋殂爲往也言人命盡而往落者􅀂草木葉落也堯以十六即位明年乃爲元年七十載求禪求禪之時八十六也試舜三年自正月上日至崩二十八載揔計其數凡壽一百一十七歳案堯典求禪之年即得舜而試之求禪試舜共在一年也更得二年即爲歷試三年故下傳云歷試二年與攝位二十八年合得爲三十在位故王肅云徴用三載其一在徴用之年其餘二載與攝位二十八年凡三十歳也故孔傳云歷試二年明其一年在徴用之限以此計之惟有一百一十六歳不得有七蓋誤爲七也傳考妣至思慕正義曰曲禮云生曰父母死曰考妣鄭􅀇云考成也言其德行之成也妣之言嫓也嫓於考也喪服爲父爲君同服斬衰檀弓􅀃事君之禮云服勤至死方喪三年鄭􅀇云方喪資於事父凡此以義爲制義重則恩輕其情異於父如喪考妣言百官感德情同父母思慕深也諸經傳言百姓或爲百官或爲萬民知此百姓是百官者以喪服庶民爲天子齊衰三月畿外之民無服不得如考妣故知百官也傳遏絶至者逺正義曰密靜釋詁文遏止絶之義故爲絶也周禮太師云播之以八音金石土革絲木匏竹鄭云金鐘鎛也石磬也土塤也革鼔鼗也絲琴瑟也木柷敔也匏笙也竹管簫也傳言八音與彼次不同者隨便言耳釋地云九夷八狄七戎六蠻謂之四海夷狄尚絶音三年則華夏内國可知也喪服諸侯之大夫爲天子正服繐衰旣葬除之今能使四夷三載絕音言堯有盛德恩化所及逺也月正至率服正義曰自此以下言舜眞爲天子命百官受職之事舜旣除堯喪以明年之月正元日舜至於文祖之廟告已將即正位爲天子也告廟旣訖乃謀政治於四岳之官所謀開四方之門大爲仕路致衆賢也明四方之目使爲已逺視四方也達四方之聦使爲已逺聽聞四方也恐逺方有所擁塞令爲己悉聞見之旣謀於四岳又別勑州牧咨十有二牧曰人君最所重者在於民之食哉惟當敬授民之天時無失其農要爲政務在安民當安彼逺人則能安近人耳逺人不安則近亦不安欲令逺近皆安之也又當厚行德信而使足爲善長欲令諸侯皆厚行其德爲民之師長而難拒佞人斥逺之使不干朝政如是則誠信昭於四夷自然蠻夷皆相率而來服也傳月正至廟告正義曰正訓長也月正言月之最長正月長於諸月月正還是正月也上日日之最上元日日之最長元日還是上日王肅云月正元日猶言正月上日變文耳禮云令月吉日又變文言吉月令辰此之􅀋也知舜服堯喪三年畢將即政者以堯存且攝其位堯崩謙而不居孟子云堯崩三年喪畢舜避丹朱於南河之南天下諸侯朝覲者不之堯子而之舜獄訟者不之堯子而之舜謳謌者不之堯子而謳謌舜曰天也然後之中國踐天子位孟子旣言然矣此文又承三載之下故知舜服堯喪三年畢將欲即政復至文祖廟告前以攝位告今以即政告也此猶是堯之文祖自此以後舜當自立文祖之廟堯之文祖當遷於丹朱之國也傳詢謀至衆賢正義曰詢謀釋詁文闢訓開開四方之門謂開仕路引賢人也論語云從我於陳蔡者皆不及門也門者行之所由故以門言仕路以堯舜之聖求賢久矣今更言開門是開其未開者謂多設取士之科以此廣致衆賢也傳廣視至壅塞正義曰聦謂耳聞之也旣云明四目不云聦四耳者目視苦其不明耳聦貴其及逺明謂所見博達謂聽至逺二者互以相見故傳揔申其意廣視聽於四方使天下無壅塞天子之聞見在下必由近臣四岳親近之官故與謀此事也傳咨亦至民時正義曰咨謀釋詁文以上帝曰咨上連帝曰故爲咨嗟此則上有詢于四岳言咨十有二牧故爲謀也立君所以牧民民生在於粒食是君之所重論語云所重民食謂年􅂖也種殖收斂及時乃穫故惟當敬授民時傳柔安至長善正義曰柔安邇近惇厚皆釋詁文元善之長易文言也安近不能安逺逺人或來擾亂雖欲安近近亦不安人君爲政􅀂其下能安近但戒使之柔逺故能安近言當安彼逺人乃能安近欲令逺近皆安也王肅云能安逺者先能安近知不然者以牧在逺方故據逺言之惇德者令人君厚行德也允元者信使足爲長善也言人君厚行德之與信使足爲善長民必効之爲善而行也傳任佞至來服正義曰任佞釋詁文孫炎云似可任之佞也論語􅀃爲邦之法云逺佞人佞人殆故以難距佞人爲斥逺之令不干朝政朝無佞人則忠信昭於四夷皆相率而來服也舉蠻夷而戎狄亦見矣舜曰至往哉正義曰舜本以百揆攝位今旣即政故求置其官曰咨嗟四岳等汝於羣臣之内有能起發其功廣大帝堯之事者我欲使之居百揆之官在官而信立其功於事能順者其是誰乎四岳皆曰伯禹作司空有成功惟此人可用帝曰然然其所舉得人也乃咨嗟勑禹汝本平水土實有成功惟當居是百揆而勉力行哉禹拜稽首讓于稷契與皐陶帝曰然然其所讓實賢也汝但往居此職不許其讓也傳奮起至別堯正義曰奮是起動之意故爲起也釋詁云庸勞也勞亦功也鄭􅀇云載行也王肅云載成也孔以載爲事也各自以意訓耳舜受堯禪當繼行其道行之在於任臣百揆臣之最貴求能起發其功廣大帝堯之事者欲任之舜旣即位可以稱帝而言舜曰者承堯事下言舜曰以別堯於此一別以下稱帝也傳亮信至誰乎正義曰亮信釋詁文惠順釋言文上云舜納於百揆百揆是官名故求其人使居百揆之官居官則當信立其功能順其事者誰乎此官任重當統羣職繼堯之功故歷言所順而後始問誰乎異於餘官先言疇也傳四岳至用之正義曰僉訓爲皆故云四岳皆同辭而對也國語云有崇伯鯀堯殛之於羽山賈逵云崇國名伯爵也禹代鯀爲崇伯入爲天子司空以其伯爵故稱伯禹言人之賢而舉其爲官知禹治洪水有成功言可用也傳然其至行之正義曰禹平水土往前之事嫌其今復命之令平水土故云稱禹前功以命之懋勉釋詁文傳居稷至首至地正義曰下文帝述三人遂變稷爲棄故解之居稷官者棄也獨稱官者出自禹意耳不必著義鄭云時天下賴后稷之功故以官名通稱或當然也經因稷契名單共文言曁皐陶爲文勢耳三人爲此次者蓋以官尊卑爲先後也周禮太祝辨九拜一曰稽首稽首爲敬之極故爲首至地稽首是拜内之别名爲拜乃稽首故云拜稽首也帝曰棄至百􅂖正義曰帝因禹讓三人而官不轉各述其功以勸之帝呼稷曰棄往者洪水之時衆民之難難在於飢汝君爲此稷之官敎民布種是百穀以濟活之言我知汝功當勉之傳阻難至勉之正義曰阻難釋詁文播是分散之義故爲布也王肅云播敷也堯遭洪水民不粒食故衆民之難在於飢也稷是五穀之長立官主此稷事后訓君也帝言汝君此稷官布種是百穀以濟救之追美其功以勸勉之上文讓於稷契益稷云暨稷吕刑云稷降播種國語云稷爲天官單名爲稷尊而君之稱爲后稷故詩傳孝經皆以后稷爲言非官稱后也帝曰契至在寛正義曰帝又呼契曰往者天下百姓不相親睦家内尊卑五品不能和順汝作司徒之官謹敬布其五常之敎務在於寛故使五典克從是汝之功冝當勉之傳五品至順也正義曰品謂品秩一家之内尊卑之差即父母兄弟子是也敎之義慈友恭孝此事行乃爲五常耳傳上云五典克從即此五品能順上傳以解五典爲五常又解此以同之故云五品謂五常其實五常據敎爲言不據品也遜順常訓也不順謂不義不慈不友不恭不孝也傳布五至前功正義曰文十八年左傳云布五敎於四方父義母慈兄友弟恭子孝是布五常之敎也論語云寛則得衆故務在寛所以得民心也治不遜之罪冝峻法以繩之而貴其務在寛者此五品不遜直是禮敎不行風俗未淳耳未有殺害之罪故敎之務在於寛􅀂其不孝不恭其人至於逆亂而後治之於事不得寛也帝曰皐陶至克允正義曰帝呼皐陶曰往者蠻夷戎狄猾亂華夏又有強寇劫賊外姦内宄者爲害甚大汝作士官治之皆能審得其情致之五刑之罪受罪者皆有服從之心言輕重得中悉無怨恨也五刑有服從者於三處就而殺之其有不忍刑其身者則斷爲五刑而流放之五刑之流各有所居處五刑所居於三處居之所以輕重罪得其冝受罪無怨者惟汝識見之明能使之信服故姦邪之人無敢更犯是汝之功冝當勉之因禹之讓以次誡之傳猾亂至之致正義曰猾者狡猾相亂故猾爲亂也夏訓大也中國有文章光華禮義之大定十年左傳云裔不謀夏夷不亂華是中國爲華夏也寇者衆聚爲之賊者殺害之稱故羣行攻劫曰寇殺人曰賊成十七年左傳云亂在外爲姦在内爲宄是在外曰姦在内曰宄也寇賊姦宄皆是作亂害物之名也蠻夷猾夏興兵犯邊害大故先言之寇賊姦宄皆國内之害小故後言之管子曰倉廩實知禮節衣食足知榮辱讓生於有餘爭生於不足往者洪水爲災下民飢困内有寇賊爲害外則四夷犯邊皆言無敎之致也唐堯之聖協和萬邦不應末年頓至於此蓋少有其事辭頗増甚歸功於人作與奪之勢耳傳士理至中正正義曰士即周禮司寇之屬有士師卿士等皆以士爲官名鄭􅀇云士察也主察獄訟之事月令云命大理昭十四年左傳云叔魚攝理是謂獄官爲理官也準吕刑文知五刑謂墨劓剕宫大辟也人心服罪是順從之義故爲從也所以服者言得輕重之中正也吕刑云咸庶中正是也傳旣從至於市正義曰經言五服謂皐陶所斷五刑皆服其罪傳旣訓服爲從故云旣從五刑謂服罪也行刑當就三處惟謂大辟罪耳魯語云刑五而巳無有隱者大刑用甲兵次刑斧􅃏中刑刀鋸其次鑚筰薄刑鞭扑以威民故大者陳之原野小者致之市朝五刑三次是無隱也孔用彼爲􅀃故以三就爲原野與朝市也國語賈逵注云用兵甲者諸侯逆命征討之刑也大夫巳上於朝士巳下於市傳雖不言巳上巳下爲義亦當然也國語云五刑者謂甲兵也斧鉞也刀鋸也鑚筰也鞭扑也與吕刑之五刑異也所言三次即此三就是也惟死罪當分就處所其墨劓剕宫無常處可就也馬鄭王三家皆以三就爲原野也市朝也甸師氏也案刑於甸師氏者王之同族刑於隱者不與國人慮兄弟耳非所刑之正處此言正刑不當數甸師也又市朝異所不得合以爲一且皆國語之文其義不可通也傳謂不至之外正義曰此五流有宅即流宥五刑也當在五刑而流放之故知謂不忍加刑則流放之􅀂四凶也鄭􅀇云舜不刑此四人者以爲堯臣不忍刑之王肅云謂在八議之辟君不忍殺宥之以逺八議者周禮小司寇所云議親議故議賢議能議貴議賔議功議勤是也以君恩不忍殺罪重不可全赦故流之也五刑之流各有所居謂徙置有處也五居之差有三等之居量其罪狀爲逺近之差也四裔最逺在四海之表故大罪四裔謂本犯死罪也故周禮調人職云父之讎辟諸海外即與四裔爲一也次九州之外即王制云入學不率敎者屏之逺方西方曰􅈎東方曰􅀉注云偪􅀉於夷狄也與此九州之外同也次千里之外者即調人職云兄弟之讎辟諸千里之外也立政云中國之外下同者言中國者據罪人所居之國定千里也據其逺近其實一也周禮與王制旣有三處之別故約以爲言鄭􅀇云三處者自九州之外至於四海三分其地逺近􅀂周之夷鎭蕃也然罪有輕重不同豈五百里之校乎不可從也傳言皐至述之正義曰惟明謂皐陶之明克允謂受罪者信服故王肅云惟明其罪能使之信服是信施於彼也但彼人信服由皐陶有信故傳言皐陶能明信五刑施之逺近蠻夷使咸信服主言信者見其皐陶有信故彼信之也傳問誰至臣名正義曰考工記云國有六職百工與居一焉工即百工故云問誰能順我百工事者直言帝曰無所偏咨故知僉曰是朝臣共舉垂也傳共謂供其職事正義曰堯典傳云共工官稱即彼以共工二字爲官名上云疇􅀂予工單舉工名今命此人云汝作共工明是帝謂此人堪供此職非是呼此官名爲共工也其官或以共工爲名要帝意言共謂供此職也傳上謂至能之正義曰言上下草木鳥獸則上之與下各有草木鳥獸即周禮山虞澤虞之官各掌其敎知上謂山下謂澤也順其草木鳥獸之冝明是施其政敎取之有時用之有節也馬鄭王本皆爲禹曰益哉是字相近而彼誤耳作朕虞正義曰此官以虞爲名帝言作我虞耳朕非官名也鄭􅀇云言朕虞重鳥獸草木漢書王莽自稱爲予立予虞之官則莽謂此官名爲朕虞其義必不然也傳朱虎至之中正義曰知垂所讓四人皆在元凱之中者以文十八年左傳八元之内有伯虎仲熊即此朱虎熊羆是也虎熊在元凱之内明殳斨伯與亦在其内但不知彼誰當之耳益是皐陶之子皇陶即庭堅也益在八凱之内垂則不可知也傳不在伯夷夔龍之下爲此言者以伯夷姜姓不在元凱之内夔龍亦不可知惟言此四人耳傳雖言殳斨伯與亦難知也傳三禮至姜姓正義曰此時秩宗即周禮之宗伯也其職云掌天神人􅀑地祇之禮雖三者併爲吉禮要言三禮者是天地人之事故知三禮是天地人之禮上文舜之巡守言修五禮此云典朕三禮各有其事則五禮皆據其所施於三處五禮所施於天地人耳言三足以包五故舉三以言之鄭語云姜伯夷之後也伯夷能禮於神以佐堯是伯夷爲姜姓也此經不言疇者訪其有能是問誰可知上文巳具此略之也傳秩序至之官正義曰堯典傳巳訓秩爲序此復訓者此爲官名須辨官名之義故詳之也宗之爲尊常訓也主郊廟之官掌序􅀑神尊卑故以秩宗爲名郊謂祭天南郊祭地北郊廟謂祭先祖即周禮所謂天神人􅀑地祇之禮是也傳夙早至淸明正義曰夙早釋詁文早夜敬服其職謂侵早巳起夜深乃卧謹敬其職事也典禮之官施行敎化使正直而淸明正直不枉曲也淸明不暗昧也帝曰夔至率舞正義曰帝因伯夷所讓隨才而任用之帝呼夔曰我今命汝典掌樂事當以詩樂敎訓丗適長子使此長子正直而温和寛􅀪而莊栗剛毅而不苛虐􅂤易而不傲慢敎之詩樂所以然者詩言人之志意歌詠其義以長其言樂聲依此長歌爲節律吕和此長歌爲聲八音皆能和諧無今相奪道理如此則神人以此和矣夔荅舜曰嗚呼我繫其石磬拊其石磬諸音莫不和諧百獸相率而舞樂之所感如此是人神旣巳和矣傳胄長至孝友正義曰􅀃文云胄胤也釋詁云胤繼也繼父丗者惟長子耳故以胄爲長也謂元子巳下至卿大夫子弟者王制云樂正崇四術立四敎王太子王子羣后之太子卿大夫元士之適子皆造焉是下至卿大夫也不言元士士卑故略之彼鄭注云王子王之庶子也此傳兼言弟者蓋指太子之弟耳或孔意公卿大夫之弟亦敎之國子以適爲主故言胄子也命典樂之官使敎胄子下句又言詩歌之事是今夔以歌詩蹈之舞之敎此適長國子也周禮大司樂云以樂德敎國子中和祗庸孝友鄭云中猶忠也和剛柔適也祗敬也庸有常也善父母曰孝善兄弟曰友是言樂官用樂敎之使成此六德也樂記又云樂在宗廟之中君臣上下同聽之則莫不和敬在族黨郷里之中長幼同聽之則莫不和順在閨門之内父子兄弟同聽之則莫不和親是樂之感人能成忠和祗庸孝友之六德也傳敎之至莊栗正義曰此直而温與下三句皆使􅇪敎胄子令性行當然故傳發首言敎之也正直者失於太嚴故令正直而温和寛弘者失於緩慢故令寛弘而莊栗謂矝莊嚴栗栗者謹敬也傳剛失至其失正義曰剛彊之失入於苛虐故令人剛而無虐􅂤易之失入於傲慢故令􅂤而無傲剛􅂤是其本性敎之使無虐傲是言敎之以防其失也由此而言之上二句亦直寛是其本性直失於不温寛失於不栗故敎之使温栗也直寛剛􅂤即皐陶所謀之九德也九德而獨舉此四事者人之大體故特言之傳謂詩至其言正義曰作詩者自言巳志則詩是言志之書習之可以生長志意故敎其詩言志以導胄子之志使開悟也作詩者直言不足以申意故長歌之敎令歌詠其詩之義以長其言謂聲長續之定本經作永字明訓永爲長也傳聲謂至和樂正義曰周禮太師云文之以五聲宫商角徴羽言五聲之淸濁有五品分之爲五聲也又太師掌六律六吕以合隂陽之聲陽聲黃鐘太蔟沽洗蕤賔夷則無射隂聲大吕應鐘南吕林鐘仲吕夾鐘是六律六吕之名也漢書律曆志云律有十二陽六爲律隂六爲吕是隂律名同亦名吕也鄭􅀇云律述氣也同助隂宣氣與之同也又云吕旅也言旅助陽宣氣也志又云律黃帝之所作也黃帝使伶倫氏自大夏之西崑崙之隂取竹於嶰谷之中各生其竅厚薄均者斷兩節之閒吹之以爲黃鐘之宫制十二籥以聽鳳皇之鳴其雄聲爲六雌鳴亦六以比黃鐘之宫是爲律之本言律之所作如此聖人之作律也旣以出音又以􅃸氣布十二律於十二月之位氣至則律應是六律六吕十二月之音氣也聲依永者謂五聲依附長言而爲之其聲未和乃用此律吕調和其五聲使應於節奏也傳倫理至勉之正義曰倫之爲理常訓也八音能諧相應和也各自守分不相奪道理是言理不錯亂相奪也如此則神人咸和矣帝言此者命􅇪使勉之也大司樂云大合樂以致􅀑神示以和邦國以諧萬民以安賔客以􅀃逺人是神人和也傳石磬至可知正義曰樂器惟磬以石爲之故云石磬也八音之音石磬最淸故知磬是音之聲淸者磬必擊以鳴之故云拊亦擊之重其文者擊有大小擊是大擊拊是小擊音聲濁者粗淸者精精則難和舉淸者和則其餘皆從矣商頌云依我磬聲是言磬聲淸諸音來依之百獸率舞即大司樂云以作動物益稷云鳥獸蹌蹌是也人神易感鳥獸難感百獸相率而舞則神人和可知也夔言此者以帝戒之云神人以和欲使勉力感神人也乃荅帝云百獸率舞則神人以和言帝德及鳥獸也帝曰龍至惟允正義曰帝呼龍曰龍我憎疾人爲讒佞之􅀃絕君子之行而動驚我衆人欲遏之故命汝作納言之宫從早至夜出納我之敎命惟以誠信每事皆信則讒言自絕命龍使勉之傳堲疾至絕之正義曰堲聲近疾故爲疾也殄絕震動皆釋詁文讒人以善爲惡以惡爲善故言我疾讒􅀃絕君子之行衆人畏其讒口故爲讒也動驚我衆欲遏止之傳納言至以信正義曰詩美仲山甫爲王之喉舌喉舌者宣出王命如王咽喉口舌故納言爲喉舌之官也此官主聽下言納於上故以納言爲名亦主受上言宣於下故言出朕命納言不納於下朕命有出無入官名納言云出納朕命互相見也必以信者不妄傳下言不妄宣帝命出納皆以信也帝曰咨至天功正義曰帝旣命用衆官乃揔戒勑之曰咨嗟汝新命六人及四岳十二牧凡二十有二人等各當敬其職事哉惟是汝等敬事則信實能立天下之功天下之功成主在於汝可得不敬之哉傳禹垂至命之正義曰傳以此文揔結上事據上文詢於四岳咨十有二牧及新命六官等適滿二十二人謂此也其稷契皐陶殳斨伯與朱虎熊羆七人仍舊故不須勑命之岳牧亦應是舊而勑命之者岳牧外内之官常所咨詢故亦勑之鄭􅀇云自咨十有二牧至帝曰龍皆月正元日格於文祖所勑命也案經格於文祖之後方始詢於四岳咨十二州牧未必一日之内即得行此諸事傳旣不􅀃或曆日命授乃揔勑之未必即是元日之事也鄭以爲二十二人數殳㭊伯與朱虎熊羆不數四岳彼四人者直􅀍讓而巳不言居官何故勑使敬之也岳牧俱是帝所咨詢何以勑牧不勑岳也必非經旨故孔􅀃不然三載至三苗正義曰自此以下史述舜事非帝語也言帝命羣官之後經三載乃者其功績經三考則九載黜陟幽明明者􅂛之闇者退之羣官懼黜思􅂛各敬其事故得衆功皆廣前流四凶時三苗之君竄之西裔更紹其嗣不滅其國舜即政之後三苗復不從化是闇當黜之其君臣有善有惡舜復分北流其三苗北背也善留惡去使分背也傳三年至明者正義曰三年一閏天道成人亦可以成功故以三年考校其功之成否也九年三考則人之能否可知幽明有別黜退其幽者或奪其官爵或徙之逺方升進其明者或益其土地或進其爵位也傳考績至惡明正義曰考績法明人皆自勵故得衆功皆廣也分地三苗即是黜幽之事故其考績之下言其流之分謂別之云北者言相背必善惡不同故知三苗幽闇冝黜其君臣乃有善否分背流之不今相從俱徙之則善從惡俱不徙則惡從善言善惡不使相從言舜之黜陟善惡明也鄭􅀇以爲流四凶者卿爲伯子大夫爲男降其位耳猶爲國君故以三苗爲西裔諸侯猶爲惡乃復分北流之謂分北西裔之三苗也孔傳竄三苗爲誅也其身無復官爵必非黜陟之限其所分北非彼竄者王肅云三苗之民有赦宥者復不從化不今相從分北流之王肅意彼赦宥者復繼爲國君至不復從化故分北流之禹繼鯀爲崇伯三苗未必絕後傳意或如肅言傳歷試至八年正義曰上云乃言厎可績三載則歷試當三年云二年者其一即是徴用之年巳在上句三十之數故惟有二年耳受終居攝尚在臣位故歷試并爲三十在位謂在臣位也傳方道至十二歳正義曰論語云可謂仁之方也已孔注亦以方爲道常訓也舜即位五十年從格於文祖之後數之􅂛道謂乗道而行也天子之行必是巡其所守之國故通以巡守爲名未必以仲夏之月巡南岳也檀弓云舜葬蒼梧之野是舜死蒼梧之野因而葬焉孔以月正元日在三載遏密之下又孟子云舜服堯三年喪畢避堯之子故服喪三年三年之喪二十五月而畢其一年即在三十在位之數惟有二年是舜年六十二爲天子五十年是舜凡壽百一十二歳也大禹謨云帝曰朕宅帝位三十有三載乃求禪禹孟子云舜薦禹於天子十七年是在位五十年其文明矣鄭􅀇讀此經云舜生三十謂生三十年也登庸二十謂歷試二十年在位五十載陟方乃死謂攝位至死爲五十年舜年一百歳也史記云舜年三十堯舉用之年五十攝行天子事年五十八堯崩年六十一而踐天子位三十九年崩皆謬耳帝􅁵至槀飫正義曰此序也孔以書序序所以爲作者之意冝相附近故引之各冠其篇首其經亡者以序附於本篇次而爲之傳故此序在此也帝舜治理下土諸侯之事爲各於其方置設其官居其所在之方而統治之又爲民別其姓族之生分別異􅀋各使相從作汨作篇又作九共九篇又作槀飫之篇凡十一篇皆亡傳言舜至其方正義曰在虞書知帝是舜也下土對天子之辭故云理四方諸侯各爲其官居其方不知􅀂爲設之凡此三篇之序亦旣不見其經闇射無以可中孔氏爲傳復順其文爲其傳耳是非不可知也他皆倣此傳汨治至篇亡正義曰汨之爲治無正訓也作是起義故爲興也言其治民之功興以意言之耳傳槀勞飫賜也正義曰左傳言槁師者以師枯槁用酒食勞之是槀得爲勞也襄二十六年左傳云將賞爲之加膳加膳則飫賜是飫得爲賜也亦不知勞賜之何所謂也尚書正義卷第三計二萬八千六十四字
