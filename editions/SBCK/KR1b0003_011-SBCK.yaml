  text: 尚書正義卷第十一
  hash: sha256:aa565cba11a85d0834c697333bdddc1e088413d25e12e3ebb059d80208ff7174
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_011-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔頴達奉勑撰洪範第六周書武王至洪範正義曰武王伐殷旣勝殺受立其子武庚爲殷後以箕子歸鎬京訪以天道箕子爲陳天地之大法敘述其事作洪範此惟當言箕子歸耳乃言殺受立武庚者序自相顧爲文上武成序云武王伐紂故此言勝之下微子之命序云黜殷命殺武庚故此言立之敘言此以順上下也傳不放至禄父正義曰放桀也湯放桀此不放而殺之者紂自焚而死也殷本紀云紂兵敗紂走入登鹿􅄗衣其寶玉衣赴火而死武王遂斬紂頭懸之太白旗是也泰誓云取彼凶殘則志在於殺也死猶斬之則生亦不放傳據實而言之耳本紀又云封紂子武庚禄父以續殷祀是以爲王者後也本紀武庚禄父􅀟言之伏生尚書傳云武王勝殷繼公子禄父是一名禄父也鄭云武庚字禄父春秋之丗有齊侯禄父蔡侯考父季孫行父父亦是名未必爲字故傳言一名禄父傳歸鎬至作之正義曰上篇云至于豐者文王之廟在豐至豐先告廟耳時王都在鎬知歸者歸鎬京也此經文旨異於餘篇非直問荅而巳不是史官敘述必是箕子旣對武王之問退而自撰其事故傳特云箕子作之書傳云武王釋箕子之囚箕子不忍周之釋走之朝鮮武王聞之因以朝鮮封之箕子旣受周之封不得無臣禮故於十三祀來朝武王因其朝而問洪範案此序云勝殷以箕子歸明旣釋其囚即以歸之不令其走去而後來朝也又朝鮮去周路將萬里聞其所在然後封之受封乃朝必歷年矣不得仍在十三祀也宋丗家云旣作洪範武王乃封箕子於朝鮮得其實也洪範正義曰此經開源於首覆更演􅀃非復一問一荅之勢必是箕子自爲之也發首二句自記被問之年自王乃言至彞倫攸敘王問之辭自箕子乃言至彞倫攸敘言禹得九疇之由自初一曰至威用六極言禹第敘九疇之次自一五行巳下箕子更條􅀃九疇之義此條􅀃者當時亦以對王更復退而修撰定其文辭使成典敎耳傳洪大至大法正義曰洪大範法皆釋詁文惟十至攸敘正義曰此箕子陳王問已之年被問之事惟文王受命十有三祀武王訪問於箕子即陳其問辭王乃言曰嗚呼箕子此上天不言而黙定下民佑助諧合其安居使有常生之資我不知此天之定民常道所以次敘問天意何由也傳商曰至天道正義曰商曰祀周曰年釋天文案此周書也泰誓稱年此獨稱祀故解之箕子稱祀不忘本也此篇箕子所作箕子商人故記傳引此篇者皆云商書曰是箕子自作明矣序言歸作洪範似歸即作之嫌在武成之前故云此年四月歸宗周先告武成次問天道以次在武成之後故知先告武成也傳騭定至之資正義曰傳以騭即質也質訓爲成成亦定義故爲定也言民是上天所生形神天之所授故天不言而黙定下民羣生受氣流形各有性靈心識下民不知其然是天黙定也相助也協合也助合其居者言民有其心天佑助之令其諧合其生出言是非立行得失衣食之用動止之冝無不稟諸上天乃得諧合失道則死合道則生言天非徒賦命於人授以形體心識乃復佑助諧合其居業使有常生之資九疇施之於民皆是天助之事也此問荅皆言乃者以天道之大沈吟乃問思慮乃荅宣八年公羊傳曰乃緩辭也王肅以隂騭下民一句爲天事相協以下爲民事注云隂深也言天深定下民與之五常之性王者當助天和合其居所行天之性我不知常道倫理所以次敘是問承天順民何所由與孔異也箕子至攸敘正義曰箕子乃言荅王曰我聞在昔鯀障塞洪水治水失道是乃亂陳其五行而逆天道也天帝乃動其威怒不與鯀大法九􅀋天之常道所以敗也鯀則放殛至死不赦禹以聖德繼父而興代治洪水決道使通天乃賜禹大法九􅀋天之常道所以得其次敘此􅀃其得九􅀋之由也傳陻塞至五行正義曰襄二十五年左傳􅀃陳之伐鄭云井陻木刋謂塞其井斬其木是陻爲塞也汨是亂之意故爲亂也水是五行之一水性下流鯀反塞之失水之性水失其道則五行皆失矣是塞洪水爲亂陳其五行言五行陳列皆亂也大禹謨帝美禹治水之功云地平天成傳云水土治曰平五行敘曰成水旣治五行序是治水天道爲亂五行也傳􅂌與至以敗正義曰􅂌與釋詁文斁敗相傳訓也以禹得而鯀不得故爲天動威怒鯀不與大法九疇疇是輩􅀋之名故爲􅀋也言其每事自相􅀋者有九九者各有一章故漢書謂之爲九章此謂九􅀋是天之常道旣不得九􅀋故常道所以敗也自古以來得九疇者惟有禹耳未聞餘人有得之者也􅀂人皆得之鯀獨不得可言天帝怒鯀餘人皆不得獨言天怒鯀者以禹由治水有功故天賜之鯀亦治水而天不與以鯀禹俱是治水父不得而子得之所以彰禹之聖當於天心故舉鯀以彰禹也傳放鯀至之道正義曰傳嫌殛謂被誅殺故辨之云放鯀至死不赦也嗣繼釋詁文三代以還父罪子廢故云廢父興子堯舜之道賞罰各從其實爲天下之至公也傳天與至次敘王義曰易繫辭云河出圖洛出書聖人則之九􅀋各有文字即是書也而云天乃錫禹知此天與禹者即是洛書也漢書五行志劉歆以爲伏羲繫天而王河出圖則而畫之八卦是也禹治洪水錫洛書法而陳之洪範是也先達共爲此􅀃􅀛負洛書經無其事中􅃸及諸緯多􅀃黃帝堯舜禹湯文武受圖書之事皆云龍負圖􅀛負書緯􅃸之書不知誰作通人討覈謂僞起哀平雖復前漢之末始有此書以前學者必相傳此􅀃故孔以九􅀋是神􅀛負文而出列於背有數從一而至於九禹見其文遂因而第之以成此九􅀋法也此九􅀋陳而行之常道所以得次敘也言禹第之者以天神言語必當􅂤要不應曲有次第丁寧􅀂此故以爲禹次第之禹旣第之當有成法可傳應人盡知之而武王獨問箕子者五行志云聖人行其道而寶其眞降及於殷箕子在父師之位而典之周旣克殷以箕子歸周武王親虚已而問焉言箕子典其事故武王特問之其義或當然也􅀂然大禹旣得九􅀋常道始有次敘未有洛書之前常道所以不亂者丗有澆淳敎有踈密三皇已前無文亦治何止無洛書也但旣得九􅀋以後聖王法而行之從之則治違之則亂故此􅀃常道攸敘攸斁由洛書耳初一至六極正義曰天所賜禹大法九􅀋者初一日五材氣性流行次二曰敬用在身五種之行事次三曰厚用接物八品之政敎次四曰和用天象五物之綱紀次五曰立治用大爲中正之道次六曰治民用三等之德次七曰明用􅁲筮以考疑事次八曰念用天時衆氣之應驗次九曰嚮勸人用五福威沮人用六極此九􅀋之事也傳農厚至乃成正義曰鄭􅀇云農讀爲醲則農是醲意故爲厚也政施於民善不厭深故厚用之政乃成也張晏王肅皆言農食之本也食爲八政之首故以農言之然則農用止爲一食不兼八事非上下之例故傳不然八政三德揔是治民但政是被物之名德是在己之稱故分爲二疇也傳協和至五紀正義曰協和釋詁文天是積氣其狀無形列宿四方爲天之限天左行晝夜一周日月右行日遲月疾周天三百六十五度有餘日則曰行一度月則日行十三度有餘日月行於星辰乃爲天之曆數和此天時令不差錯使行得正用五紀也日月逆天道而行其行又有遲疾故須調和之傳皇大至之道正義曰皇大釋詁文極之爲中常訓也凡所立事王者所行皆是無得過與不及當用大中之道也詩云莫匪爾極周禮以爲民極論語允報其中皆謂用大中也傳言天至第敘正義曰貧弱等六者皆謂窮極惡事故目之六極也福者人之所慕皆嚮望之極者人之所惡皆畏懼之勸勉也勉之爲善沮止也止甘爲惡福極皆上天爲之言天所以嚮望勸勉人用五福所以畏懼沮止人用六極自初一曰已下至此六極巳上皆是禹所次第而敘之下文更條此九􅀋而演􅀃之知此九者皆禹所第也禹爲此次者蓋以五行丗所行用是諸事之本故五行爲初也發見於人則爲五事故五事爲二也正身而後及人施人乃名爲政故八政爲三也施人之政用天之道故五紀爲四也順天布政則得大中故皇極爲五也欲求大中隨德是任故三德爲六也政雖任德事必有疑故稽疑爲七也行事在於政得失應於天故庶徴爲八也天監在下善惡必報休咎驗於時氣禍福加於人身故五福六極爲九也皇極居中者揔包丄下故皇極傳云大中之道大立其有中謂行九疇之義是也福極處末者顧氏云前八事俱得五福歸之前八事俱失六極臻之故福極處末也發首言初一其末不言終九者數必以一爲始其九非數之終故從上言次而不言終也五行不言用者五行萬物之本天地百物莫不用之不嫌非用也傳於五福六極言天用者以前並是人君所用五福六極受之於天故言天用傳言此禹所第敘不知洛書本有幾字五行志悉載此一章乃云凡此六十五字皆洛書本文計天言􅂤要必無次第之數上傳云禹因而第之則孔以第是禹之所爲初一曰等二十七字必是禹加之也其敬用農用等一十八字大劉及顧氏以爲􅀛背先有揔三十八字小劉以爲敬用等亦禹所第敘其􅀛文惟有二十字並無明據未知孰是故兩存焉皇極不言數者以揔該九疇理兼萬事非局數能盡故也稽疑不言數者以􅁲五筮二共成爲七􅀂舉卜不得兼筮舉筮不得兼􅁲且疑事旣衆不可以數揔之故也庶徴不言數者以庶徴得爲五休失爲五咎􅀂舉休不兼咎舉咎不兼休􅀂休咎並言便爲十事本是五物不可言十也然五福六極所以善惡皆言者以沮勸在下故丁寧明言善惡也且庶徴雖有休咎皆以念慮包之福極嚮威相反不可一言爲目故別爲文焉知五福六極非各分爲疇所以共爲一者蓋以􅀛文福極相近一處故禹第之揔爲一疇等行五事所以福五而極六者大劉以爲皇極若得則分散揔爲五福􅀂失則不能爲五事之主與五事並列其咎弱故爲六也猶詩平王以後與諸侯並列同爲國風焉咎徴有五而極有六者五行傳云皇之不極厥罰常隂即與咎徴常雨相􅀋故以常雨包之爲五也一五行至作甘正義曰此以下箕子所演陳禹所第疇名於上條列􅀃以成之此章所演文有三重第一言其名次第二言其體性第三言其氣味言五者性異而味别各爲人之用書傳云水火者百姓之求飲食也金木者百姓之所興作也土者萬物之所資生也是爲人用五行即五材也襄二十七年左傳云天生五材民並用之言五者各有材幹也謂之行者􅀂在天則五氣流行在地丗所行用也傳皆其生數正義曰易繫辭曰天一地二天三地四天五地六天七地八天九地十此即是五行生成之數天一生水地二生火天三生木地四生金天五生土此其生數也如此則陽無匹隂無偶故地六成水天七成火地八成木天九成金地十成土於是隂陽各有匹偶而物得成焉故謂之成數也易繫辭又曰天數五地數五五位相得而各有合此所以成變化而行􅀑神謂此也又數之所起起於隂陽隂陽往來在於日道十一月冬至日南極陽來而隂往冬水位也以一陽生爲水數五月夏至日北極隂進而陽退夏火位也當以一隂生爲火數但隂不名竒數必以偶故以六月二隂生爲火數也是故易􅀃稱乾貞於十一月子坤貞於六月未而皆左行由此也冬至以及於夏至當爲陽來正月爲春木位也三陽巳生故三爲木數夏至以及冬至當爲隂進八月爲秋金位也四隂巳生故四爲金數三月春之季四季土位也五陽巳生故五爲土數此其生數之由也又萬物之本有生於無著生於微及其成形亦以微著爲漸五行先後亦以微著爲次五行之體水最微爲一火漸著爲二木形實爲三金體固爲四土質大爲五亦是次之冝大劉與顧氏皆以爲水火木金得土數而成故水成數六火成數七木成數八金成數九土成數十義亦然也傳言其自然之常性正義曰易文言云水流濕火就燥王肅曰水之性潤萬物而退下火之性炎盛而􅂛上是潤下炎上言其自然之本性傳木可至改更正義曰此亦言其性也揉曲直者爲器有須曲直也可改更者可銷鑄以爲器也木可以揉令曲直金可以從人改更言其可爲人用之意也由此而觀水則潤下可用以灌漑火則炎上可用以炊爨亦可知也水旣純隂故潤下趣隂火是純陽故炎上趣陽木金隂陽相雜故可曲直改更也傳種曰至以斂正義曰鄭􅀇周禮注云種􅂖曰稼􅀂嫁女之有所生然則穡是惜也言聚畜之可惜也共爲治田之事分爲種斂二名耳土上所爲故爲土性上文潤下炎上曲直從革即是水火木金體有本性其稼穡以人事爲名非是土之本性生物是土之本性其稼穡非土本性也爰亦曰也變曰言爰以見此異也六府以土􅂖爲二由其體異故也傳水鹵所生正義曰水性本甘久浸其地變而爲鹵鹵味乃鹹􅀃文云鹵西方鹹地東方謂之厈西方謂之鹵禹貢云海濵廣厈是海浸其旁地使之鹹也月令冬云其味鹹其臭朽是也上言曰者言其本性此言作者從其發見指其體則稱曰致其􅀋即言作下五事庶徴言曰作者義亦然也傳焦氣之味正義曰火性炎上焚物則焦焦是苦氣月令夏云其臭焦其味苦苦爲焦味故云焦氣之味也嗅之曰氣在口曰味傳木實之性正義曰木生子實其味多酸五果之味雖殊其爲酸一也是木實之性然也月令春云其味酸其臭羶是也傳金之氣味正義曰金之在火別有腥氣非苦非酸其味近辛故辛爲金之氣味月令秋云其味辛其臭腥是也傳甘味生於百􅂖正義曰甘味生於百􅂖􅂖是上之所生故甘爲土之味也月令中央云其味甘其臭香是也二五事至作聖正義曰此章所演亦爲三重第一言其所名第二言其所用第三言其所致貌是容儀舉身之大名也言是口之所出視是目之所見聽是耳之所聞思是心之所慮一人之上有此五事也貌必須恭言乃可從視必當明聽必當聦思必當通於微密也此一重即是敬用之事貌能恭則心肅敬也言可從則政必治也視能明則所見照晢也聽能聦則所謀必當也思通微則事無不通乃成聖也此一重言其所致之事洪範本體與人主作法皆據人主爲􅀃貌揔身也口言之目視之耳聽之心慮之人主始於敬身終通萬事此五事爲天下之本也五事爲此次者鄭云此數本諸隂陽昭明人相見之次也五行傳曰貌屬木言屬金視屬火聽屬水思屬土五行傳伏生之書也孔於太戊桑穀之下云七日大拱貌不恭之罰髙宗雊雉之下云耳不聦之異皆書傳之文也孔取書傳爲􅀃則此次之意亦當如書傳也木有華葉之容故貌屬木言之決斷􅀂金之斬割故言屬金火外光故視屬火水内明故聽屬水土安靜而萬物生心思慮而萬事成故思屬土又於易東方震爲足足所以動容貌也西方兊爲口口出言也南方离爲目目視物也北方坎爲耳耳聽聲也土在内猶思在心亦是五屬之義也傳察是非正義曰此五事皆有是非論語云非禮勿視非禮勿聽非禮勿言非禮勿動又引詩云思無邪故此五事皆有是非也此經歷言五名名非善惡之稱但爲之有善有惡傳皆以是辭釋之貌者言其動有容儀也言者道其語有辭章也視者言其觀正不觀邪也聽者受人言察是非也思者心慮所行使行得中也傳於聽云察是非明五者皆有是非也所爲者爲正不爲邪也於視不言視邪正於聽言察是非亦所以互相明也傳必通於微正義曰此一重言敬用之事貌戒惰容故恭爲儼恪曲禮曰儼􅀂思儼是嚴正之貌也恪敬也貌當嚴正而莊敬也言非理則人違之故言是則可從也視必明於善惡故必淸徹而審察也聽當別彼是非必微妙而審諦也王肅云睿通也思慮苦其不深故必深思使通於微也此皆敬用使然故經以善事明之鄭􅀇云此恭明聦睿行之於我身其從則是彼人從我以與上下違者我是而彼從亦我所爲不乖倒也此據人主爲文皆是人主之事􅀃命云接下思恭梘逺惟明聽德惟聦即此是也傳於事至之聖正義曰此一重言所致之事也恭在貌而敬在心人有心慢而貌恭必當縁恭以致敬故貌恭作心敬也下從上則國治故人主言必從其國可以治也視能淸審則照了物情故視明致照晢也聽聦則知其是非從其是爲謀必當故聽聦致善謀也睿聖俱是通名聖大而睿小縁其能通微事事無不通因睿以作聖也鄭􅀇周禮注云聖通而先識也是言識事在於衆物之先無所不通以是名之爲聖聖是智之上通之大也此言人主行其小而致其大皆是人主之事也鄭云皆謂其政所致也君貌恭則臣禮肅君言從則臣職治君視明則臣照晢君聽聦則臣進謀君思睿則臣賢智鄭意謂此所致皆是君致臣也案庶徴之章休徴咎徴皆肅乂所致若肅乂明聦皆是臣事則休咎之所致悉皆不由君矣又聖大而睿小若君睿而致臣聖則臣皆上於君矣何不然之甚乎晢字王肅及漢書五行志皆云晢智也定本作晢則讀爲哲三八政至曰師正義曰八政者人主施政敎於民有八事也一曰食敎民使勤農業也二曰貨敎民使求資用也三曰祀敎民使敬􅀑神也四曰司空之官主空土以居民也五日司徒之官敎衆民以禮義也六曰司寇之官詰治民之姦盗也七曰賔敎民以禮待賔客相往來也八曰師立師防寇賊以安保民也八政如此次者人不食則死食於人最急故敎爲先也有食又須衣貨爲人之用故貨爲二也所以得食貨乃是明靈祐之人當敬事􅀑神故􅂎爲三也足衣食祭􅀑神必當有所安居司空主居民故司空爲四也雖有所安居非禮義不立司徒敎以禮義故司徒爲五也雖有禮義之敎而無刑殺之法則彊弱相陵司寇主姦盗故司寇爲六也民不往來則無相親之好故賔爲七也寇賊爲害則民不安居故師爲八也此用於民緩急而爲次也食貨祀賔師指事爲之名三卿舉官爲名者三官所主事多􅀂以一字爲名則所掌不盡故舉官名以見義鄭􅀇云此數本諸其職先後之冝也食謂掌民食之官若后稷者也貨掌金帛之官􅀂周禮司貨賄是也祀掌祭祀之官􅀂宗伯者也司空掌居民之官司徒掌敎民之官也司寇掌詰盗賊之官賔掌諸侯朝覲之官周禮大行人是也師掌軍旅之官􅀂司馬也王肅云賔掌賔客之官也即如鄭王之􅀃自可皆舉官名何獨三事舉官也八政主以敎民非謂公家之事司貨賄掌公家貨賄大行人掌王之賔客􅀂其事如周禮皆掌王家之事非復施民之政何以謂之政乎且司馬在上司空在下今司空在四司馬在八非取職之先後也傳寶用物正義曰貨者金玉布帛之揔名皆爲人用故爲用物旅獒云不貴異物賤用物是也食則勤農以求之衣則􅁞績以求之但貨非獨衣不可指言求處故云得而寶愛之孝經云謹身節用詩序云儉以足用是寶物也傳主空土以居民正義曰周官篇云司空掌邦土居四民時地利司徒掌邦敎敷五典擾兆民司寇掌邦禁詰姦慝刑暴亂周禮司徒敎以禮義司寇無縱罪人其文具矣傳􅂤師至必練正義曰經言賔師當有賔師之法故傳以禮賔客無不敬敎民待賔客相往來也師者衆之通名必當選人爲之故傳言􅂤師選人爲師也所任必良任良將也士卒必練練謂敎習使知義􅀂練金使精也論語以不敎民戰是謂棄之是士卒必須練也四五紀至曆數正義曰五紀者五事爲天時之經紀也一曰歳從冬至以及明年冬至爲一歳所以紀四時也二曰月從朔至晦大月三十日小月二十九日所以紀一月也三曰日從夜半以至明日夜半周十二辰爲一日所以紀一日也四曰星辰星謂二十八􅀫昏明迭見辰謂日月別行㑹於􅀫度從子至於丑爲十二辰星以紀節氣早晚辰以紀日月所㑹處也五曰曆數筭日月行道所曆計氣朔早晩之數所以爲一歳之曆凡此五者皆所以紀天時故謂之五紀也五紀不言時者以歳月氣節正而四時亦自正時隨月變非曆所推故不言時也五紀爲此次者歳統月月統日星辰見於天其曰曆數揔曆四者故歳爲始曆爲終也傳二十至所㑹正義曰二十八宿布於四方隨天轉運昬明迭見月令十二月皆紀昏旦所中之星􅀂月令孟春昬參中旦尾中仲春昬弧中旦建星中季春昬七星中旦牽牛中孟夏昬翼中旦婺女中仲夏昬亢中旦危中季夏昬心中旦奎中孟秋昬建星中旦畢中仲秋昬牽牛中旦觜中季秋昬虚中旦柳中孟冬昬危中旦七星中仲冬昬東壁中旦軫中季冬昬婁中旦氐中皆所以敘氣節也氣節者一歳三百六十五日有餘分爲十二月有二十四氣一爲節氣謂月初也一爲中氣謂月半也以彼迭見之星敘此月之節氣也昭七年左傳晉侯問士文伯曰多語寡人辰而莫同何謂也對曰日月之㑹是謂辰㑹者日行遲月行疾俱循天度而右行二十九日過半月行一周天又前及日而與日㑹因謂㑹處爲辰則月令孟春日在營室仲春日在奎季春日在胃孟夏日在畢仲夏日在東井季夏日在柳孟秋日在翼仲秋日在角季秋日在房孟冬日在尾仲冬日在斗季冬日在婺女十二㑹以爲十二辰辰即子丑寅卯之謂也十二辰所以紀日月之㑹處也鄭以爲星五星也然五星所行下民不以爲􅃸故傳不以星爲五星也傳曆數至民時正義曰天以積氣無形二十八􅀫分之爲限毎􅀫各有度數合成三百六十五度有餘日月右行循此􅀫度日行一度月行十三度有餘二十九日過半而月一周與日㑹每於一㑹謂之一月是一歳爲十二月仍有餘十一日爲日行天未周故置閏以充足􅀂均分天度以爲十二次則每次三十度有餘一次之内有節氣中氣次之所管其度多每月之所統其日入月朔參差不及節氣不得在月朔中氣不得在月半故聖人曆數此節氣之度使知氣所在旣得氣在之日以爲一歳之曆所以敬授民時王肅云日月星辰所行布而數之所以紀度數是也歳月日星傳皆言紀曆數不言紀者曆數數上四事爲紀所紀非獨一事故傳不得言紀但成彼四事爲紀故通數以爲五耳五皇極至作極正義曰皇大也極中也施政敎治下民當使大得其中無有邪僻故演之云大中者人君爲民之主當大自立其有中之道以施敎於民當先敬用五事以斂聚五福之道用此爲敎布與衆民使衆民慕而行之在上能敎如此惟是其衆民皆效上所爲無不於汝人君取其中道而行積乆漸以成性乃更與汝人君以安中之道言皆化也􅀂能化如是凡其衆民無有淫過朋黨之行人無有惡相阿比之德惟皆大爲中正之道言天下衆民盡得中也傳大中至之義正義曰此疇以大中爲名故演其大中之義大中之道大立其有中欲使人主先自立其大中乃以大中敎民也凡行不迂僻則謂之中中庸所謂從容中道論語允執其中皆謂此也九疇爲德皆求大中是爲善之揔故云謂行九疇之義言九疇之義皆求得中非獨此疇求大中也此大中是人君之大行故特敘以爲一疇耳傳斂是至慕之正義曰五福生於五事五事得中則福報之斂是五福之道指其敬用五事也用五事得中則各得其福其福乃散於五處不相集聚􅀂能五事皆敬則五福集來歸之普敬五事則是斂聚五福之道以此敬五事爲敎布與衆民使衆民勸慕爲之福在幽冥無形可見敬用五事則能致之斂是五福正是敬用五事不言敬用五事以敎而云斂是五福以爲敎者福是善之見者故言福以勸民欲其慕而行善也汝者箕子汝王也傳君上至從化正義曰凡人皆有善性善不能自成必須人君敎之乃得爲善君上有五福之敎以大中敎民衆民於君取中保訓安也旣學得中則其心安之君以大中敎民民以大中嚮君是民與君皆以大中之善君有大中民亦有大中言從君化也傳民有至中正正義曰民有安中之善非中不與爲交安中之人則無淫過朋黨之惡無有比周之德朋黨比周是不中者善多惡少則惡亦化而爲善無復有不中之人惟天下皆大爲中正矣凡厥至髙明正義曰又􅀃用人爲官使之大中凡其衆民有道德有所爲有所執守汝爲人君則當念録敘之用之爲官􅀂未能如此雖不合於中亦不罹於咎惡此人可勉進冝以取人大法則受取之其受人之大法如何乎汝當和安汝之顔色以謙下人彼欲仕者謂汝曰我所好者德也汝則與之以福禄隨其所能用之爲官是人庶幾必自勉進此其惟爲大中之道又爲君者無侵虐單獨而畏忌髙明髙明謂貴寵之人勿枉法畏之如是即爲大中矣傳民戢至敘之正義曰戢斂也因上斂是五福故傳以戢言之戢文兼下三事民能斂德行智能使其身有道德其才能有所施爲用心有所執守如此人者汝念録敘之冝用之爲官也有所爲謂藝能也有執守謂得善事能守而勿失言其心正不逆邪也傳凡民至受之正義曰不合於中不罹於咎謂未爲大善又無惡行是中人巳上可勸勉有方將者也故皆可進用以大法受之大法謂用人之法取其所長棄瑕録用也上文人君以大中敎民使天下皆爲大中此句又令不合於中亦用之者上文言設敎耳其實天下之大兆民之衆不可使皆合大中且庶官交曠即須任人不可待人盡合大中然後敘用言各有爲不相妨害傳汝當至爵祿正義曰安汝顔色以謙下人其此不合於中之人此人言曰我所好者德也是有慕善之心有方將者也汝則與之爵禄以長進之上句言受之謂始受取此言與爵禄謂用爲官也傳不合至勉進正義曰不合於中之人初時未合中也汝與之爵禄置之朝廷見人爲善心必慕之則是人此其惟大中之道爲大中之人言可勸勉使進也荀卿書曰蓬生麻中不扶自直白沙在􅄺與之俱黒斯言信矣此經或言時人德鄭王諸本皆無德字此傳不以德爲義定本無德疑􅄛字也傳煢單至畏之正義曰詩云獨行煢煢是爲單謂無兄弟也無子曰獨王制文髙明與煢獨相對非謂才髙知寵貴之人位望髙也不枉法畏之即詩所謂不畏強禦是也此經皆是據天子無陵虐煢獨而畏避髙明寵貴者顧氏亦以此經據人君小劉以爲據人臣謬也人之至用咎正義曰此又言用臣之法人之在位者有才能有所爲當襃賞之委任使進其行汝國其將昌盛也凡其正直之人旣以爵禄富之又復以善道接之使之荷恩盡力汝􅀂不能使正直之人有好善於汝國家是人於此其將詐取罪而去矣於其無好德之人謂性行惡者汝雖與之福賜之爵禄但本性旣惡必爲惡行其爲汝臣必用惡道以敗汝善言當任善而去惡傳功能至昌盛正義曰功能有爲之士謂其身有才能所爲有成功此謂巳在朝廷任用者也使進其行者謂人之有善􅀂上知其有能有爲或以言語勞來之或以財貨賞賜之或更任之以大位如是則其人喜於見知必當行自進益人皆漸自修進汝國其昌盛矣傳凡其至接之正義曰凡其正直之人普謂臣民有正直者爵禄所設正直是與巳知彼人正直必當授之以官旣當與爵禄富之又當以善道接之言其非徒與官而巳又當數加燕賜使得其歡心也傳不能至而去正義曰授之以官爵加之以燕賜喜於知已荷君恩德必進謀樹功有好善於國家􅀂雖用爲官心不委任禮意踈薄更無恩紀言不聽計不用必將􅁬衣而去不肯乆留故言不能使正直之人有好於國家則是人斯其詐取罪而去也傳於其至汝善正義曰無好對有好有好謂有善也無好德之人謂彼性不好德好惡之人也論語曰未見好德如好色者傳記言好德者多矣故傳以好德言之定本作無惡者疑誤耳不好德者性行本惡君雖與之爵禄不能感恩行義其爲汝臣必用惡道以敗汝善也易繫辭云無咎者善補過也咎是過之別名故爲惡耳無偏至有極正義曰更言大中之體爲人君者當無偏私無陂曲動循先王之正義無有亂爲私好謬賞惡人動循先王之正道無有亂爲私惡濫罰善人動循先王之正路無偏私無阿黨王家所行之道蕩蕩然開闢矣無阿黨無偏私王者所立之道平平然辯治矣所行無反道無偏側王家之道正直矣所行得無偏私皆正直者㑹集其有中之道而行之􅀂其行必得中則天下歸其中矣言人皆謂此人爲大中之人也傳偏不至治民正義曰不乎謂髙下不正謂邪僻與下好惡反側其義一也偏頗阿黨是政之大患故箕子殷勤言耳下傳云無有亂爲私好私惡者人有私好惡則亂於正道故傳以亂言之傳言㑹至中矣正義曰㑹謂集㑹言人之將爲行也集㑹其有中之道而行之行實得中則天下皆歸其爲有中矣天下者大言之論語云一曰克己復禮天下歸仁焉此意與彼同也曰皇至下王正義曰旣言有中矣爲天下所歸更美之曰以大中之道布陳言敎不使失是常道則民皆於是順矣天且其順而況於人乎以此之故大中爲天下所歸也又大中之道至矣何但出於天子爲貴凡其衆民中和之心所陳之言謂以善言聞於上者於是順之於是行之恱於民而便於政則可近益天子之光明矣又本人君須大中者更美大之曰人君於天所子布德惠之敎爲民之父母以是之故爲天下所歸往由大中之道敎使然言人君不可不務大中矣六三德至􅆫忒正義曰此三德者人君之德張㢮有三也一曰正直言能正人之曲使直二曰剛克言剛彊而能立事三曰柔克言和柔而能治旣言人主有三德又􅀃隨時而用之平安之丗用正直治之彊禦不順之丗用剛能治之和順之丗用柔能治之旣言三德張㢮隨時而用又舉天地之德以喻君臣之交地之德沈深而柔弱矣而有剛能出金石之物也天之德髙明剛彊矣而有柔能順隂陽之氣也以喻臣道雖柔當執剛以正君君道雖剛當執柔以納臣也旣言君臣之交剛柔遞用更言君臣之分貴賤有恒惟君作福得專賞人也惟君作威得專罰人也惟君玉食得備珍食也爲臣無得有作福作威玉食言政當一統權不可分也臣之有作福作威玉食者其必害於汝臣之家凶於汝君之國言將得罪喪家且亂邦也在位之人用此大臣專權之故其行側頗僻下民用在位頗僻之故皆言不信而行差錯傳和柔至皆德正義曰剛不恒用有時施之故傳言立事柔則常用以治故傳言能治三德爲此次者正直在剛柔之閒故先言二者先剛後柔得其敘矣王肅意與孔同鄭􅀇以爲三德人各有一德謂人臣也傳友順至治之正義曰釋訓云善兄弟爲友友是和順之名故爲順也傳云爕和也釋詁文此三德是王者一人之德視丗而爲之故傳三者各言丗丗平安雖時無逆亂而民俗未和其下猶有曲者須在上以正之故丗平安用正直之德治之丗有彊禦不順非剛無以制之故以剛能治之丗旣和順風俗又安故以柔能治之鄭􅀇以爲人臣各有一德天子擇使之注云安平之國使中平守一之人治之使不失舊職而巳國有不順孝敬之行者則使剛能之人誅治之其有中和之行者則使柔能之人治之差正之與孔不同傳髙明至納臣正義曰中庸云博厚配地髙明配天髙而明者惟有天耳知髙明謂天也以此髙明是天故上傳沈潜謂地也文五年左傳云天爲剛德猶不干時是言天亦有柔德不干四時之序也地柔而能剛天剛而能柔故以喻臣當執剛以正君君當執柔以納臣也傳言惟至美食正義曰於三德之下􅀃此事者以德則隨時而用位則不可假人故言尊卑之分君臣之紀不可使臣專威福奪君權也衣亦不得􅆫君而獨言食者人之所資食最爲重故舉言重也王肅云辟君也不言王者􅀜諸侯也諸侯於國得專賞罰其義或當然也傳在位至􅆫差正義曰此經福威與食於君每事言辟於臣則并文而略之也作福作威謂秉國之權勇略震主者也人用側頗僻者謂在位小臣見彼大臣威福由已由此之故小臣皆附下罔上爲此側頗僻也下民見此在位小臣秉心僻側用此之故下民皆不信􅁪爲此􅆫差也言在位由大臣下民由在位故皆言用也傳不解家王肅云大夫稱家言秉權之臣必滅家復害其國也七稽疑至之言正義曰稽疑者言王者考正疑事當選擇知卜筮者而建立之以爲􅁲筮人謂立爲卜人筮人之官也旣立其官乃命以􅁲筮之職云􅁲兆有五曰􅀨兆如􅀨下也曰霽兆如􅀨止也曰雺兆氣蒙闇也曰圛兆氣落驛不連屬也曰克兆相交也筮卦有二重二體乃成一卦曰貞謂内卦也曰悔謂外卦也􅁲筮兆卦其法有七事其􅁲兆用五雨霽蒙驛克也其筮占用二貞與悔也􅁲筮皆就此七者推􅄛其變立是知􅁲筮人使作􅁲筮之官其􅁲筮必用三代之法三人占之若其所占不同而其善鈞者則從二人之言言以此法考正疑事也傳􅀛曰至立之正義曰􅀛曰􅁲蓍曰筮曲禮文也考正疑事當選擇知􅁲筮人而建立之建亦立也復言之耳鄭王皆以建立爲二言將考疑事選擇可立者立爲􅁲人筮人傳兆相至常法正義曰此上五者灼􅀛爲兆其璺拆形狀有五種是􅁲兆之常法也􅀃文云霽􅀨止也霽似􅀨止則􅀨似􅀨下鄭􅀇曰霽如􅀨止者雲在上也雺聲近蒙詩云零􅀨其濛則濛是闇之義故以雺爲兆蒙是隂闇也圛即驛也故以爲兆氣落驛不連屬落驛希踈之意也􅀨霽旣相對則蒙驛亦相對故驛爲落驛氣不連屬則雺爲氣連蒙闇也王肅云圛霍驛消减如雲隂雺天氣下地不應闇􅁳也其意如孔言鄭􅀇以圛爲明言色澤光明也雺者氣澤鬱鬱􅁳􅁳也自以明闇相對異於孔也克謂兆相交錯王肅云兆相侵入蓋兆爲二拆其拆相交也鄭􅀇云克者如􅀨氣色相侵入􅁲筮之事體用難明故先儒各以意􅀃未知孰得其本今之用􅀛其兆横者爲土立者爲木斜向徑者爲金背徑者爲火因兆而細曲者爲水不知與此五者同異如何此五兆不言一曰二曰者灼􅀛所遇無先後也傳内卦至曰悔正義曰僖十五年左傳云秦伯伐晉􅁲徒父筮之其卦遇蠱蠱卦巽下艮上􅀃卦云巽爲風艮爲山其占云蠱之貞風也其悔山也是内卦爲貞外卦爲悔也筮法爻從下起故以下體爲内上體爲外下體爲本因而重之故以下卦爲貞貞正也言下體是其正鄭􅀇云悔之言晦晦猶終也晦是月之終故以爲終言上體是其終也下體言正以見上體不正上體言終以見下體爲始二名互相明也傳立是至三人正義曰此經􅁲五占用二􅄛忒孔不爲傳鄭􅀇云􅁲五占用謂􅀨霽蒙驛克也二􅄛忒謂貞悔也斷用從上句二􅄛忒者指謂筮事王肅云􅁲五者筮短􅀛長故􅁲多而筮少占用二者以貞悔占六爻􅄛忒者當推􅄛其爻義以極其意􅁲五占二其義當如王解其􅄛忒冝揔謂􅁲筮皆當􅄛其義極其變非獨筮􅄛而􅁲否也傳言立是知􅁲筮人使爲􅁲筮之事者言經之此文覆述上句立􅁲筮人也言三人占是占此􅁲筮法當有三人周禮太􅁲掌三兆之法一曰玉兆二曰瓦兆三曰原兆掌三易之法一曰連山二曰歸藏三曰周易杜子春以爲玉兆帝顓頊之兆瓦兆帝堯之兆又云連山虙犧歸藏黃帝三兆三易皆非夏殷而孔意必以三代夏殷周法者以周禮指言一曰二曰不辯時代之名案考工記云夏曰丗室殷曰重屋周曰明堂又禮記郊特牲云夏收殷哻周冕皆以夏殷周三代相因明三易亦夏殷周相因之法子春之言孔所不取鄭􅀇易賛亦云夏曰連山殷曰歸藏與孔同也所言三兆三易必是三代異法故傳以爲夏殷周􅁲筮各異三代異法三法並􅁲法有一人故三人也從二人之言者二人爲善旣鈞故從衆也􅀂三人之内賢智不等雖少從賢不從衆也善鈞從衆成六年左傳文旣言三法並􅁲嫌筮不然故又云􅁲筮冬三人也經惟言三占從二何知不一法而三占而知三法並用者金縢云乃􅁲二􅀛一習吉儀禮士喪􅁲葬占者三人貴賤俱用三􅀛知􅁲筮並用三代法也傳將舉至決之正義曰非有所舉則自不􅁲故云將舉事事有疑則當􅁲筮人君先盡已心以謀慮之次及卿士衆民人謀猶不能定然後問􅁲筮以決之故先言乃心後言􅁲筮也鄭􅀇云卿士六卿掌事者然則謀及卿士以卿爲首耳其大夫及士亦在焉以下惟言庶人明大夫及士􅀉卿文以見之矣周禮小司寇掌外朝之政以致萬民而詢焉一曰詢國危二曰詢國遷三曰詢立君是有大疑而詢衆也又曰小司寇以敘進而問焉是謀及之也大疑者不要是彼三詢其謀及則同也謀及庶人必是大事􅀂小事不必詢於萬民或謀及庶人在官者耳小司寇又曰以三刺斷庶民獄訟之中一曰訊羣臣二曰訊羣吏三曰訊萬民彼羣臣羣吏分而爲二此惟言卿士者彼將斷獄令衆議然後行刑故臣與民爲三其人主待衆議而決之此則人主自疑故人主爲一又揔羣臣爲一也傳人心至於吉正義曰人主與卿士庶民皆從是人心和順也此必臣民皆從乃問􅁲筮而進􅀛筮於上者尊神物故先言之不在汝則之上者􅁲當有主故以人爲先下三事亦然改􅁲言􅀛者􅁲是請問之意吉凶􅀛占兆告於人故改言􅀛也筮則本是蓍名故不須改也傳動不至遇吉正義曰物貴和同故大同之吉延及於後宣三年左傳稱成王定鼎􅁲丗三十􅁲年七百是後丗遇吉傳三從至舉事正義曰此與下二事皆是三從二逆除􅀛筮以外有汝與卿士庶民分三者各爲一從二逆嫌其貴賤有異從逆或殊故三者各以有一從爲主見其爲吉同也方論得吉以從者爲主故次言卿士從下言庶民從也以從爲主故退汝則於下傳解其意卿士從者君臣不同也庶民從者民與上異心也解臣民與君異心得其筮之意也不言四從一逆者吉可知不假言之也四從之内雖􅀛筮相違亦爲吉以其從者多也􅀂三從之内􅀛筮相違雖不如􅀛筮俱從猶勝下􅀛筮相違二從三逆必知然者以下傳云二從三逆􅀛筮相違旣計從之多少明從多則吉故杜預云􅀛筮同卿士之數者是􅀛筮雖靈不至越於人也上言庶人又言庶民者嫌庶人惟指在官者變人言民見其同也民人之賤得與卿士敵者貴者雖貴未必謀慮長故通以民爲一令與君臣等也傳民與至決之正義曰天子聖人庶民愚賤得爲識見同者但聖人生知不假􅁲筮垂敎作訓晦跡同凡且庶民旣衆以衆情可否亦得上敵於聖故老子云聖人無常心以百姓心爲心是也傳二從至征伐正義曰此二從三逆爲小吉故猶可舉事内謂國内故可以祭祀冦㛰外謂境外故不可以出師征伐征伐事大此非大吉故也此經􅀛從筮逆其筮從􅀛逆爲吉亦同故傳言􅀛筮相違見􅀛筮之智等也若􅀛筮智等而僖四年左傳云筮短􅀛長者於時晉獻公欲以驪􅁎爲夫人􅁲旣不吉而更令筮之神靈不以實告筮而得吉必欲用之􅁲人欲令公舎筮從􅁲故曰筮短􅀛長非是􅀛實長也易繫辭云蓍之德圎而神卦之德方以智神以知來智以藏往然則知來藏往是爲極妙雖􅀛之長無以加此聖人演筮爲易所知豈是短乎明彼長短之􅀃乃是有爲言耳此二從三逆以汝與􅀛爲二從耳卿士庶民課有一從亦是二從凶吉亦同故不復設文同可知也􅀂然汝卿士庶民皆逆􅀛筮並從則亦是二從三逆而經無文者􅀂君與臣民皆逆本自不問􅁲矣何有􅀛從筮從之理也前三從之内􅀛筮旣從君與卿士庶民各有一從以配􅀛筮凡有三條􅀂惟君與卿士從配􅀛爲一條或君與庶民從配􅀛又爲一條或卿士庶民從配􅀛又爲一條凡有三條􅀂筮從􅀛逆其事亦然二從三逆君配􅀛從爲一條於經巳具卿士配􅀛從爲二條庶民配􅀛從爲三條􅀂筮從􅀛逆以人配筮其事亦同案周禮筮人國之大事先筮而後􅁲鄭􅀇云於筮之凶則止何有筮逆􅀛從及􅀛筮俱違者崔靈恩以爲筮用三代之占􅀂三占之俱凶則止不􅁲即鄭注周禮筮凶則止是也􅀂三占二逆一從凶猶不決雖有筮逆猶得更􅁲故此有筮逆􅀛從之事或筮凶則止而不􅁲乃是鄭􅀇之意非是周禮經文未必孔之所取曲禮云􅁲筮不相襲鄭云􅁲不吉則又筮筮不吉則又􅁲是謂瀆􅀛筮周禮太􅁲小事筮大事􅁲應筮而又用􅁲應􅁲而又用筮及國之大事先筮後􅁲不吉之後更作􅁲筮如此之等是爲相襲皆據吉凶分明不可重爲􅁲筮􅀂吉凶未決於事尚疑者則得更爲􅁲筮僖二十五年晉侯􅁲納王得阪泉之兆曰吾不堪也公曰筮之遇大有之睽又哀九年晉趙鞅􅁲救鄭遇水適火又筮之遇泰之需之􅀋是也周禮旣先筮後􅁲而春秋時先􅁲後筮者不能依禮故也八庶徴正義曰庶衆也徴驗也王者用九疇爲大中行稽疑以上爲善政則衆驗有美惡以爲人主自曰雨至一極無凶揔言五氣之驗有美有惡曰休徴敘美行之驗曰咎徴敘惡行之驗自曰王省至家用平康言政善致美也日月歳時至家用不寜言政惡致咎也庶民惟星以下言人君當以常度齊正下民曰􅀨至無凶正義曰將􅀃其驗先立其名五者行於天地之閒人物所以得生成也其名曰􅀨所以潤萬物也曰暘所以乾萬物也曰燠所以長萬物也曰寒所以成萬物也曰風所以動萬物也此是五氣之名曰時言五者各以時來所以爲衆事之驗也更述時與不時之事五者於是來皆備足須風則風來須􅀨則􅀨來其來各以次序則衆草木蕃滋而豐茂矣謂來以時也􅀂不以時五者之内一者備極過甚則凶一者極無不至亦凶􅀨多則澇雨少則旱是備極亦凶極無亦凶其餘四者亦然傳雨以至衆驗正義曰易􅀃卦云風以散之􅀨以潤之日以烜之日暘也烜乾也是􅀨以潤物暘以乾物風以動物也易繫辭云寒往則暑來暑往則寒來寒暑相推而歳成焉是言天氣有寒有暑暑長物而寒成物也釋言云燠煖也舎人曰燠温煖也是燠煖爲一故傳以煖言之不言暑而言燠者燠是熱之始暑是熱之極涼是冷之始寒是冷之極長物舉其始成物舉其極理冝然也五者各以其時而至所以爲衆事之驗也所以言時者謂當至則來當止則去無常時也冬寒夏燠雖有定時或夏須漸寒冬當漸熱􅀨足則思暘暘乆則思􅀨草木春則待風而長秋則待風而落皆是無定時也不言一曰二曰者爲其來無先後也依五事所致爲次下云休徴咎徴􅀨􅀂風􅀂是其致之次也昭元年左傳云天有六氣隂陽風􅀨晦明也以彼六氣校此五氣􅀨暘風文與彼同彼言晦明此言寒燠則晦是寒也明是燠也惟彼隂於此無所當耳五行傳􅀃五事致此五氣云貌之不恭是謂不肅厥罰恒􅀨惟金沴木言之不從是謂不乂厥罰恒暘惟木沴金視之不明是謂不晢厥罰恒燠惟水沴火聽之不聦是謂不謀厥罰恒寒惟火沴水思之不睿是謂不聖厥罰恒風惟木金水火沴土如彼五行傳言是􅀨屬木暘屬金燠屬火寒屬水風屬土鄭云􅀨木氣也春始施生故木氣爲􅀨暘金氣也秋物成而堅故金氣爲暘燠火氣也寒水氣也風土氣也凡氣非風不行猶金木水火非土不處故土氣爲風是用五行傳爲􅀃孔意亦當然也六氣有隂五事休咎皆不致隂五行傳又曰皇之不極厥罰常隂是隂氣不由五事別自屬皇極也蓋立用大中則隂順時爲休大之不中隂恒􅀂爲咎也傳言五至廡豐正義曰五氣所以生成萬物正可時來時去不可常無常有故言五者備至各以次序須至則來須止則去則衆草百物蕃滋廡豐也釋詁文廡豐茂也草蕃廡言草滋多而茂盛也下言百穀用成此言衆草蕃廡者舉草茂盛則穀成必矣舉輕以明重也傳一者至失敘正義曰此謂不以時來其至無次序也一者備極過甚則凶謂來而不去也一者極無不至亦凶謂去而不來也即下云恒􅀨􅀂恒風􅀂之􅀋是也有無相刑去來正反恒􅀨則無暘恒寒則無燠恒􅀨亦凶無暘亦凶恒寒亦凶無燠亦凶謂至不待時失次序也如此則草不茂穀不成也曰休徴至風􅀂正義曰旣言五者次序覆述次序之事曰美行致以時之驗何者是也曰人君行敬則􅀨以時而順之曰人君政治則暘以時而順之曰人君照晢則燠以時而順之曰人君謀當則寒以時而順之曰人君通聖則風以時而順之此則致上文各以其次敘庶草蕃廡也曰咎徴至風􅀂正義曰上旣言失次序覆述失次序之事曰惡行致備極之驗何者是也曰君行狂妄則常􅀨順之曰君行􅆫差則常暘順之曰君行逸豫則常煖順之曰君行急躁則常寒順之曰君行蒙闇則常風順之此即致上文一極備凶一極無凶也傳君行至順之正義曰此休咎皆言􅀂者其所致者皆順其所行故言􅀂也易文言云雲從龍風從虎水流濕火就燥是物各以􅀋相應故知天氣順人所行以示其驗也其咎反於休者人君行不敬則狂妄故狂對肅也政不治則􅆫差故􅆫對乂也明不照物則行自逸豫故豫對晢也心無謀慮則行必急躁故急對謀也性不通曉則行必蒙闇故蒙對聖也鄭􅀇以狂爲倨慢以對不敬故爲慢也鄭王本豫作舒鄭云舉遲也王肅云舒惰也以對照晢故爲遲惰鄭云急促自用也以謀者用人之言故急爲自用已也鄭云蒙見冒亂也王肅云蒙瞽蒙以聖是通達故蒙爲瞽蒙所見冒亂言其不曉事與聖反也與孔各小異耳曰王省至不寧正義曰旣陳五事之休咎又言皇極之得失與上異端更復言曰王之省職兼揔羣吏惟如歳也卿士分居列位惟如月也衆正官之長各治其職惟如日也此王也卿士也師尹也掌事猶歳月日者言皆無改易君秉君道臣行臣事則百穀用此而成歳豐稔也其治用是而明丗安泰也俊民用此而章在官位也國家用此而平安風俗和也􅀂王也卿士也師尹也掌事猶如日月歳者是巳變易君失其柄權臣各專恣百穀用此而不成歳飢饉也其治用此昬闇而不明政事亂也俊民用此而卑徴皆隱遁也國家用此而不安泰時丗亂也此是皇極所致得中則致善不中則致惡歳月日無易是得中也旣易是不中也所致善惡乃大於庶徴故於此敘之也傳王所至四時正義曰下云庶民惟星以星喻民知此歳月日者皆以喻職事也於王言省則卿士師尹亦爲省也王之所省職無不兼所揔羣吏如歳兼四時下句惟有月日羣臣無喻時者但時以統月故傳以四時言之言其兼下月日也傳衆正至歳月則致國亂故當立用大中以齊正之不得從民欲也傳星民至所好正義曰星之在天猶民之在地星爲民象以其象民故因以星喻故衆民惟􅀂星也直言星有好風不知何星故云箕星好風也畢星好􅀨亦如民有所好也不言畢星好􅀨具於下傳傳日月至常法正義曰日月之行四時皆有常法變冬夏爲南北之極故舉以言之日月之行冬夏各有常度喻人君爲政小大各有常法張衡蔡邕王蕃等􅀃渾天者皆云周天三百六十五度四分度之一天體圎如彈丸北髙南下北極出地上三十六度南極入地下三十六度南極去北極直徑一百二十二度弱其依天體隆曲南極去北極一百八十二度彊正當天之中央南北二極中等之處謂之赤道去南北極各九十一度春分日行赤道從此漸北夏至赤道之北二十四度去北極六十七度去南極一百一十五度日行黒道從夏至日以後日漸南至秋分還行赤道與春分同冬至行赤道之南二十四度去南極六十七度去北極一百一十五度其日之行處謂之黃道又有月行之道與日道相近交絡而過半在日道之裏半在日道之表其當交則兩道相合交去極逺處兩道相去六度此其日月行道之大略也王肅云日月行有常度君臣禮有常法以齊其民傳月經至以亂正義曰詩云月離于畢俾滂沲矣是離畢則多􅀨其文見於經經箕則多風傳記無其事鄭􅀇引春秋緯云月離於箕則風揚沙作緯在孔君之後以前必有此􅀃孔依用之也月行雖有常度時或失道從星經箕多風離畢多􅀨此天象之自然以箕爲簸揚之器畢亦捕魚之物故耳鄭以爲箕星好風者箕東方木宿風中央土氣木克土爲妻從妻所好故好風也畢星好􅀨者畢西方金宿􅀨東方木氣金克木爲妻從妻所好故好􅀨也推此則南宫好暘北宫好燠中宮四季好寒以各尚妻之所好故也未知孔意同否顧氏所解亦同於鄭言從星者謂不應從而從以致此風􅀨故喻政敎失常以從民欲亦所以亂也土云日月之行此句惟言月者鄭云不言日者日之從星不可見故也九五福至曰弱正義曰五福者謂人蒙福祐有五事也一曰壽年得長也二曰富家豐財貨也三曰康寧無疾病也四曰攸好德性所好者美德也五曰考終命成終長短之命不橫夭也六極謂窮極惡事有六一曰凶短折遇凶而橫夭性命也二曰疾常抱疾病三曰憂常多憂愁四曰貧困乏於財五曰惡貌狀醜􅋘六曰弱志力尫劣也五福六極天實得爲之而歷言此者以人生於丗有此福極爲善致福爲惡致極勸人君使行善也五福六極如此次者鄭云此數本諸其尤者福是人之所欲以尤欲者爲先極是人之所惡以尤所不欲者爲先以下縁人意輕重爲次耳傳百二十年正義曰人之大期百年爲限丗有長壽云百二十年者故傳以最長者言之未必有正文也傳所好至之道正義曰人所嗜好稟諸上天性之所好不能自巳好善者或當知善是善好惡者不知惡之爲惡謂惡是善故好之無厭任其所好從而觀之所好者德是福之道也好德者天使之然故爲福也鄭云民皆好有德也王肅云言人君所好者道德爲福洪範以人君爲主上之所爲下必從之人君好德故民亦好德事相通也傳各成至橫夭正義曰成十三年左傳云民受天地之中以生所謂命也能者養之以福不能者敗以取禍是言命之短長雖有定分未必能遂其性不致夭枉故各成其短長之命以自終不橫夭者亦爲福也傳動不至辛苦正義曰動不遇吉者解凶也傳以壽爲百二十年短者半之爲未六十折又半爲未三十辛苦者味也辛苦之味入口猶困厄之事在身故謂殃厄勞役之事爲辛苦也鄭􅀇以為凶短折皆是夭枉之名未齓曰凶未冠曰短未婚曰折漢書五行志云傷人曰凶禽獸曰短草木曰折一曰凶夭是也兄喪弟曰短父喪子曰折並與孔不同傳尫劣正義曰尫劣並是弱事爲䈥力弱亦爲志氣弱鄭􅀇云愚懦不毅曰弱言其志氣弱也五行傳有致極之文無致福之事鄭􅀇依書傳云凶短折思不睿之罰疾視不明之罰憂言不從之罰貧聽不聦之罰惡貌不恭之罰弱皇不極之罰反此而云王者思睿則致壽聽聦則致富視明則致康寧言從則致攸好德貌恭則致考終命所以然者不但行運氣性相感以義言之以思睿則無擁神安而保命故壽􅀂蒙則不通殤神夭性所以短折也聽聦則謀當所求而㑹故致富違而失計故貧也視明照了性得而安寧不明以擾神而疾也言從由於德故好者德也不從而無德所以憂耳貌恭則容儼形美而成性以終其命容毀故致惡也不能爲大中故所以弱也此亦孔所不同焉此福極之文雖主於君亦兼於下故有貧富惡弱之等也武王至分器正義曰武王旣巳勝殷制邦國以封有功者爲諸侯旣封爲國君乃班賦宗廟彞器以賜之於時有言誥戒勑史敘其事作分器之篇傳賦宗至諸侯正義曰序云邦諸侯者立邦國封人爲諸侯也樂託云封有功者爲諸侯詩賚序云大封於廟謂此時也釋言云班賦也周禮有司尊彞之官鄭云彞亦尊也鬱鬯曰彞彞法也言爲尊之法正然則盛鬯者爲彞盛酒者爲尊皆祭宗廟之酒器也分宗廟彞器酒尊以賦諸侯旣封乃賜之也傳言諸至也亡正義曰篇名分器知其篇言諸侯尊卑各有分也昭十二年左傳楚靈王云昔我先王熊繹與吕伋王孫牟爕父禽父並事康王四國皆有分我獨無十五年傳曰諸侯之封也皆受明器於王室杜預云謂明德之分器也是諸侯各有分也亡尚書正義卷第十一計一萬七千七百九字
