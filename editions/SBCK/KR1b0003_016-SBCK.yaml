  text: 尚書正義卷第十六
  hash: sha256:27ee3ac9b89c37873a492bbfa4805305095823f1774bc268db80315b56e1c964
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_016-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰周書君奭第十八蔡仲之命第十九多方第二十君奭第十八召公至君奭正義曰成王即政之初召公爲保周公爲師輔相成王爲左右大臣召公以周公甞攝王政今復在臣位其意不􅀃周公陳已意以告召公史敘其事作君奭之篇也周官篇云立太師太傅太保兹惟三公則此爲保爲師亦爲三公官也此實太師太保而不言太者意在師法保安王身言其實爲左右爾不爲舉其官名故不言太也經傳皆言武王之時太公爲太師此言周公爲師蓋太公薨命周公代之於時太傅蓋畢公爲之於此無事不須見也三公之次先師後保此序先言保者篇之所作主爲召公不􅀃故先言召公不以官位爲次也案經周公之言皆􅀃已留在王朝之意則召公不􅀃周公之留也故鄭王皆云周公旣攝王政不冝復列於臣職故不􅀃然則召公大賢豈不知周公留意而不􅀃者以周公留在臣職當時人皆怪之故欲開道周公之言以解丗人之惑召公疑之作君奭非不知也史記燕丗家云成王旣幼周公攝政當因踐阼召公疑之作君奭此篇是致政之後言留輔成王之意其文甚明馬遷妄爲􅀃爾鄭􅀇不見周官之篇言此師保爲周禮師氏保氏大夫之職言賢聖兼此官亦謬矣傳尊之至名篇正義曰周公呼爲君奭是周公尊之曰君也奭是其名君非名也僖二十四年左傳富辰言文王之子一十六國無名奭者則召公必非文王之子燕丗家云召公奭與周同姓􅁎氏譙周曰周之支族譙周考校古史不能知其所出皇甫謐云原公名豐是其一也是爲文王之子一十六國然文王之子本無定數并原豐爲一當召公於中以爲十六謬矣此篇多言先丗有大臣輔政是陳古道以告之呼君奭以告之故以君奭名篇周公至不祥正義曰周公留在王朝召公不􅀃周公爲師順古道而呼曰君奭殷道以不至之故故天下喪亡於殷殷旣墜失其王命我有周巳受之矣今雖受命貴在能終若不能終與殷無異故視殷以爲監戒我不敢獨知殷家其初始之時能長信於美道能安順於上天之道輔其誠信所以有國此亦君之所知我亦不敢獨知曰殷紂其終墜失其王命由出於不善之故亦君所知也傳廢興至以國正義曰孔以召誥云我不敢知者其意召公言我不敢獨知亦王所知則此言我不敢知亦是周公言我不敢獨知是君奭所知故以此及下句爲􅀃殷之興亡言與君奭同知舉其殷興亡爲戒鄭􅀇亦然也嗚呼至沖子正義曰周公又歎而呼召公曰嗚呼君巳巳辭也旣歎乃復言曰君當是我之留勿非我也我亦不敢安於上天之命故不敢不留君何不長逺念天之威罰禍福難量當勤敎於我下民使無尤過違法之闕惟今天下衆人共誠心存在我後嗣子孫觀其政之善惡􅀂此嗣王大不能恭承上天下地絶失先王光大之道令使衆人失望我􅀂退老在家則不能得知何得不留輔王也天命不易言甚難也天難信惡則去之不常在一家是難信也天子若不稱天意乃墜失其王命不能經久歷逺其事可不愼乎繼嗣前人先王之大業恭奉其明德也正在今我小子旦周公自言已身當恭奉其先王之明德留輔佐王非能有所改正但欲蹈行先王光大之道施政於我童子童子謂成王意欲奉行先王之事以敎成王也傳歎而至不留正義曰歎而言曰嗚呼君巳巳是引聲之辭旣呼君奭歎而引聲乃復言曰君當是我之留以其意不􅀃故令是我而勿非我我不敢安於上天之命孔意當謂天旣命周我當成就周道故不敢不留又曰至受命正義曰周公又言曰天不可信無德則去之是其不可信也天難信之故恐其去我周家故我以道惟安行寜王之德謀欲延長之我原上天之意不用令廢於文王所受命􅀂嗣王失德則還廢之故我當留佐成王也傳無德至延久正義曰此經言又曰傳不明解鄭云人又云則鄭􅀇以此又曰爲周公稱人之言也王肅云重言天不可信明己之留蓋畏其天命則肅意以周公重言故稱又曰孔雖不解當與王肅意同言寜王者即文王也鄭王亦同公曰君奭至甘盤正義曰言時則有􅀂者言當其時有如此人也指謂如此伊尹甘盤非謂別有如此人也以湯是殷之始王故言在昔旣受命見其爲天子也以下在太甲在武丁亦言其爲天子之時有如此臣也成湯未爲天子巳得伊尹言旣受命者以功格皇天在受命之後故言旣受命也皇天之與上帝俱是天也變其文爾其功至於天帝謂致太平而天下和之也保衡伊尹一人也異時而別號伊尹之下巳言格于皇天保衡之下不言格于皇天從可知也伊陟臣扈言格于上帝則其時亦致太平故與伊尹文異而事同巫咸巫賢甘盤蓋功劣於彼三人故無格天之言傳伊擊至太平正義曰伊尹名摰諸子傳記多有其文功至大天猶堯格于上下知其謂致太平也傳太甲至取平正義曰據太甲之篇及諸子傳記太甲大臣惟有伊尹知即保衡也􅀃命云昔先正保衡作我先王佑我烈祖格于皇天商頌􅃚祀成湯稱爲烈祖烈祖湯之號言保衡佐湯明保衡即是伊尹也詩稱實維阿衡實左右商王鄭􅀇云阿􅀝衡平也伊尹湯所依􅀝而取平至太甲改曰保衡保安也言天下所取安所取平此皆三公之官當時爲之號也孔以太甲云嗣王不惠於阿衡則太甲亦曰阿衡與鄭異也傳太甲之孫正義曰史記殷本紀云太甲崩子沃丁立崩弟太庚立崩子小甲立崩弟雍已立崩弟太戊立是太戊爲太甲之孫太庚之子三代表云小甲太庚弟雍巳太戊又是小甲弟則太戊亦是沃丁弟太甲子本紀丗表俱出馬遷必有一誤孔於咸乂序傳云太戊沃丁弟之子是太戊爲太甲之孫也傳伊陟至二臣正義曰伊尹格于皇天此伊陟臣扈云格于上帝其事旣同知此二臣能率循伊尹之職輔佐其君使其君不隕祖業故至天之功亦不隕墜也夏社序云湯旣勝夏欲遷其社不可作夏社疑至臣扈則湯初有臣扈巳爲大臣矣不得至今仍在與伊尹之子同時立功蓋二人名同或兩字一誤也案春秋范武子光輔五君或臣扈事湯而又事太戊也格于上帝之下乃言巫咸乂王家則巫咸亦是賢臣俱能紹治王家之事而巳其功不得至天言不及彼二臣傳祖乙至巫氏正義曰殷本紀云中宗崩子仲丁立崩弟外壬立崩弟河亶甲立崩子祖乙立則祖乙是大戊之孫也孔以其人稱祖故云殷家亦祖其功賢是咸子相傳云然父子俱稱爲巫知巫爲氏也傳髙宗至傅􅀃正義曰􅀃命篇髙宗云台小子舊學于甘盤旣乃遯於荒野髙宗未立之前巳有甘盤免喪不言乃求傅􅀃明其即位之初有甘盤佐之甘盤卒後有傅􅀃計傅􅀃當有大功此惟數六人不言傅􅀃者周公意所不言未知其故率惟至百姓正義曰此伊尹甘盤六臣等輔佐其君率循此爲臣之道有陳列之功以安治有殷故殷有安上治民之禮升配上天享國多歷年之次所天惟大佑助其爲王之命則使商家富實百姓爲令使商之百姓家給人足皆知禮節也傳言伊至年所正義曰率訓循也􅀃賢臣佐君云循惟此道當謂循此爲臣之道盡忠竭力以輔其君故有陳列於丗以安治有殷使殷王得安治民故殷得此安上治民之禮能升配上天天在人上故謂之升爲天之子是配天也享國乆長多歷年所傳殷禮至禮節正義曰殷能以禮配天故天降福天惟大佑助其王命風􅀨以時年穀豐稔使商家百姓豐實家給人足管子曰衣食足知榮辱倉廩實知禮節王人至是孚正義曰王人謂與人爲王言此上所􅀃成湯太甲太戊祖乙武丁皆王人也無不持德立業明憂小臣雖則小臣亦憂使得其賢人以蕃屏侯甸之服王恐臣之不賢尚以爲憂沉在臣下得不皆勤勞奔走惟憂王此求賢之事惟求有德者舉之用治其君之事乎君臣共求其有德所在職事皆治天子一人有事於四方天下咸化而服如有􅁲筮之驗無不是而信之賢臣助君致使大治我留不去亦當如此也傳自湯至可知正義曰王肅云王人猶君人也無不持德立業謂持人君之德立王者之事業人君之德在官賢人官得其人則事業立故傳以立業配持德明憂小臣之不賢憂欲使得其人以爲蕃屏侯甸之服也小臣且憂得人則大臣憂之可知侯甸尚思得其人朝廷思之必矣王肅云小臣臣之微者舉小以明大也傳王猶至君事正義曰君之所重莫重於求賢官之所急莫急於得人故此章所陳惟言君憂得人臣能舉賢以工之尊猶尚秉徳憂臣況其臣下得不皆奔走惟王此求賢之事惟有德者必舉之置於官位用治其君事也傳一人至信之正義曰禮天子自稱曰予一人故爲天子也君臣務求有德衆官得其人從上至下遞相師法職無大小莫不治理故天子有事於四方發號岀令而天下化服譬如􅁲筮無不是而信之事旣有驗言如是則人皆信之公曰君奭天至造邦正義曰周公呼召公曰君奭皇天賦命壽此有平至之君言有德者必壽考也殷之先王有平至之德故能安治有殷言故得安治也有殷嗣子紂不能平至故天滅亡而加之以威今汝奭當長念天道平至者安治不平至者滅亡以此爲法戒則有堅固王命其治理足以明我新成國矣傳言天至以威正義曰格訓至也平謂政敎均平至謂道有所至上言不弔謂道有不至者此言格謂道至者天壽有平至之君有平至之德則天與之長壽即知中宗髙宗之屬身是也由其君有平至之德故能安治有殷言有殷國安而民治也有殷嗣子紂其德不能平至國不安民不治故天滅亡之而加之以威也孔傳之意此經專􅀃君之善惡其言不及臣也王肅以爲兼言君臣注云殷君臣之有德故安治有殷言是者不可不法殷家有良臣也鄭注以爲專言臣事格謂至於天也與孔不同傳今汝至國矣正義曰上句言善者興而惡者亡此句令其長安治及念明道念上二者故言今汝長念平至者而安治反是者滅亡念此以爲法戒則有堅固王命王族必不傾壞若能如此其治理足以光明我新成國矣周自武王伐紂至此年歳未多對殷而言故爲新國傳意言不及臣周公􅀃此事者蓋言興滅由人我欲輔王使爲平至之君公曰君奭至厥躬正義曰公呼召公曰君奭在昔上天斷割其義重勸文王之德以文王有德勸勉使之成功故文王能成大命於其身言文王能順天之意勤德以受命傳在昔至受命正義曰文王去此未乆但欲逺本天意故云在昔上天作乆逺言之割制謂切割絶斷之意故云割制其義重勸文王之德者文王旣巳有德上天佑助而重勸勉文王順天之意故其能成大命於其身正謂勤行德義以受天命傳文王至夭名正義曰文王未定天下庶幾能修政化以和我所有諸夏謂三分有二屬已之諸國也僖五年左傳云虢仲虢叔王季之穆也是虢叔爲文王之弟也虢國名叔字凡言人之名氏皆上氏下名故閎散泰南宫皆氏天冝生顚括皆名也傳散泰至之任正義曰詩緜之卒章稱文王有䟽附先後奔奏禦侮之臣毛傳云率下親上曰䟽附相道前後曰先後喻德宜譽曰奔奏武臣折衝曰禦侮鄭箋云䟽附使䟽者親也奔奏使人歸趨之詩言文王有此四種之臣經歷言五臣之名故知五臣佐文王爲此任也此四事者五臣共爲此任非一臣當一事也鄭云不及呂望者太師敎文王以大德周公謙不可以自比又曰至命哉正義曰文王旣有賢臣五人又復言曰我之賢臣猶少無所能往來五人以此道法敎文王以微蔑精妙之德下政令於國人德政旣善爲天所佑文王亦如殷家惟爲天所大佑文王亦秉德蹈知天威文王得如此者乃惟是五人明文王之德使然也五人能明文王德使蹈行顯見覆冒下民聞於上天惟是之故得受有殷王之命哉言文王之聖猶須良佐我所以留輔成王傳有五至良佐正義曰無能往來一句周公假爲文王之辭言文王有五賢臣猶恨其少又復言曰我巨旣少於事無能往來謂去還理事未能周悉言其好賢之深不知厭足也迪道彞法也蔑小也小謂精微也而五人以此道法敎文王以精微之德用此精微之德下敎令於國人言雖聖人亦須良佐以見成王須輔佐之甚也鄭􅀇亦云蔑小也武王至稱德正義曰文王旣没武王次立武功初立惟此四人庶幾輔相武王蹈有天下之禄其後四人與武王大行天之威罰皆與共殺其強敵謂共誅紂也武王之有天下惟此四人明武王之德惟武王布德覆冒天下此四人大盡舉行武王之德言武王亦得良臣之力傳文王至四人正義曰文王受命九年而崩十三年方始殺紂文王没武王立謂武王初立之時惟此四人而已庶幾輔相武王蹈有天禄初立則有此志故下句言後與武王殺紂也虢叔先死故曰四人以是文王之弟其年應長故言先死也鄭􅀇疑不知誰死注云至武王時虢叔等有死者餘四人也傳惟此至其德正義曰單盡稱舉也使武王之德布冒天下是此四人之力言此四人大盡舉行武王之德也今在至能格正義曰周公言我新還政成王今任之重者其在我小子之身也我不能同於四人輔文武使有大功德但苟求救溺而巳譬如游於大川我往與汝奭其共濟渡小子成王用心輔弼同於成王未在位之時恐其未能嗣先人明德我當與汝輔之汝大無非責我之留也我留與汝輔王者欲收敎無自勉力不及道義者我今欲立此化而老成德之人不降意爲之我周家則鳴鳳之鳥尚不得聞知況曰其有能格於皇天者乎傳我新至我留正義曰周公旣以還政則是捨重任矣而猶言今任重在我小子旦者周公旣攝王政又須傳授得人若其不能負荷仍是周公之負以嗣子劣弱故言今任重猶在我小子旦也彼四人者能翼賛初基佐成王業我不能同於四人望有大功惟求救溺而巳詩云泳之游之左傳稱閻敖游涌而逸則游者入水浮渡之名譬􅀂成王在於大川我往與汝奭其同共濟渡成王若云從此向川故言往也傳今與至天乎正義曰王朝之臣有不勉力者今與汝留輔成王者正欲收斂敎誨無自勉力不及道義者當敎之勉力使其及道義也我欲成立此化而老成德之人不肯降意爲之我周家則鳴鳳尚不得聞知況曰其有能如伊尹之輩使其功格於皇天乎言太平不可兾也經言耇造德不降者周公以已年老應退而留因即博言已􅀋言已若退則老成德者悉皆退自逸樂不肯降意爲之政無所成祥瑞不至我周家則鳴鳳不得聞則鳳是難聞之鳥必爲靈瑞之物故以鳴鳥爲鳴鳳孔子稱鳳鳥不至是鳳鳥難聞也詩大雅卷阿之篇歌成王之德其九章曰鳳皇鳴矣于彼髙岡鄭云因時鳳皇至固以喻焉則成王之時鳳皇至也大雅正經之作多在周公攝政之後成王即位之初則周公言此之時巳鳳皇至見太平矣而復言此者恐其不復能然故戒之此經之意言功格上天難於致鳳故以鳴鳳況之格天案禮器云升中于天而鳳皇降􅀛龍假􅂛中謂功成告天也如彼記文似功至於天鳳皇乃降此以鳴鳳易致況格天之難者乎記以龍鳳有形是可見之物故以鳳降龍至爲成功之驗非言成功告天然後此物始至也公曰嗚呼至人迷正義曰周公歎而呼召公曰嗚呼君我以朝臣無能立功至天之故故君其當視於此謂視此朝臣無能立功之事我周家受天之命無有境界惟美亦大惟艱難不可輕忽謂之易治我今告君汝當謀寛饒之道以治下民使其事可法我不用使後丗人迷惑故欲敎之也傳告君至敎之正義曰猷訓爲謀告君汝謀寛饒之道故當以寛饒爲法我留與汝輔王不用使後人迷惑怪之無法則迷惑故欲與汝作法以敎之鄭云召公不􅀃似隘急故今謀於寛裕也公曰前至之恤正義曰周公又言曰前人文武布其乃心制法度乃悉命汝爲民立中正之道矣治民之法巳成就也戒召公汝當以前人之法度明自勉力配此成王在於誠信行此大命而巳言巳有舊法易可遵行也惟文王聖德造始周邦爲其子孫欲令無忝厥祖大承無窮之憂故我與汝不可不輔傳前人至正矣正義曰乃緩辭不訓爲汝傳汝以至而巳正義曰勗勉也偶配也亶信也汝當以前人法度明自勉力配成王在於誠信行大命而巳言其不復須勞心傳以乗爲行蓋以乗車必行故訓乗爲行公曰君告至丕時正義曰周公呼召公曰君我今告汝以我之誠信又呼其官而名之太保奭其汝必須能敬以我之言視於殷之喪亡殷之喪亡其事甚大不可不戒愼以殷喪大之故當念我天德可畏言天命無常無德則去之甚可畏我不信惟若此誥而已我惟言曰當因我文武二人之道而行之汝所行事舉動必當有所合哉當與文王武王合也汝所發言常在是文王武王二人則天美我周家日日滋益至矣其善旣多惟在是文武二人不能勝受之矣其汝能敬行德明我賢俊之人在於禮讓則後人於此道大且是也傳言汝至多福正義曰動當有所合哉舉動皆合文武也發言常在是文武言非文武道則不言嗚呼至率俾正義曰周公言而歎曰嗚呼我厚輔是二人之道而行之我用能至於今日其政美言今日政美由是文武之道我周家若能皆成文王之功於事常不懈怠則德敎大覆四海之隅至於日出之處其民無不循我化可臣使也戒召公與朝臣皆當法文王之功公曰君予至越民正義曰公呼召公曰君我不徒惟順如此之事多誥而巳欲使汝躬親行之我惟用勉力自強於天道行化於民顧氏云我亦自用勉勸躬行於天道加益於民人也公曰嗚至用治正義曰周公歎而呼召公曰嗚呼君惟汝知民之德行亦無有不能其初惟鮮能其終言行之雖易終之實難恐召公不能終行善政故戒之以愼終汝當以敬順我此言自今以往冝敬用此治民職事戒之使行善不懈怠也傳惟汝至愼終正義曰詩云靡不有初鮮克有終是凡民之德無不能其初少能有終者凡民皆如是有終則惟君子蓋召公至此巳􅀃恐其不能終善故戒召公以愼終也鄭云召公是時意􅀃周公恐其復不􅀃故依違託言民德以剴切之蔡仲之命第十九蔡叔至之命正義曰蔡叔與管叔流言於國謗毀周公周公囚之郭鄰至死不赦蔡叔旣没成王命蔡叔之子蔡仲踐諸侯之位封爲國君以䇿書命之史敘其事故作蔡仲之命傳成王至相及正義曰編書以丗先後爲次此篇在成王書内知王命蔡仲是成王命之也蔡叔之没不知何年其命蔡仲未必初卒即命以其繼父命子故繫之蔡叔之後也蔡叔有罪而命蔡仲者父卒命子罪不相及也昭二十年左傳曰父子兄弟罪不相及其言罪不相及謂蔡仲不坐父爾若父有大罪罪當絶滅正可別封他國不得仍取蔡名以蔡叔爲始祖也蔡叔身尚不死明其罪輕不立管叔之後者蓋罪重無子或有而不賢故也惟周至之蔡正義曰惟周公於武王崩後其位爲冢宰之卿正百官之治攝王政治天下於時管蔡霍等羣叔流言於國謗毀周公周公乃以王命致法殺管叔於商就殷都殺之囚蔡叔遷之於郭鄰之地惟與之從車七乗降黜霍叔於庶人若今除名爲民三年之内不得與兄弟年齒相次蔡叔之子蔡仲能用敬德周公爲畿内諸侯得立二卿以蔡仲爲已之卿士周公善其爲人及蔡叔旣卒乃將蔡仲命之於王國之於蔡爲諸侯也傳致法至國名正義曰周禮有掌囚之官鄭云囚拘也主拘繫當刑殺者拘繫之是爲制其出入不得輒行郭鄰中國之外地名蓋相傳爲然不知在何方舜典云流宥五刑謂流之逺地任其自主此則徙之郭鄰而又囚之管蔡丗家云封叔鮮於管封叔度於蔡是管蔡爲國名杜預云管在滎陽京縣東北傳罪輕至所滅正義曰言羣叔流言則霍叔亦流言也而知其罪輕者以其不死不遷直降黜而巳明其罪輕也霍叔不監殷民周公惟伐管蔡不言伐霍叔於時霍叔蓋在京邑聞管蔡之語流傳其言謂其實然不與朝廷同心故退之丗家云武王巳克商平天下封功臣昆弟封叔處於霍則武王巳封之矣後黜爲庶人奪其爵禄三年之後乃更齒録蓋復其舊封封爲霍侯春秋閔元年晉侯滅霍旣子孫得爲國君爲晉所滅知三年之後復得封也丗家惟云封霍不云其爵傳言霍侯或當有所據而知之傳蔡仲至治事正義曰周禮冢宰以八則治都鄙馬融云距王城四百里至五百里謂之都鄙鄙邊邑也以封王之子弟在畿内者冢宰又云乃施則于都鄙而建其長立其兩馬鄭皆云立卿兩人是畿内諸侯立二卿定四年左傳􅀃此事云周公舉之以爲已卿士是爲周公圻内之卿士也丗家云周公舉胡以爲魯卿士魯國治於是周公言於成王復封之於蔡案魯丗家云成王封周公於魯周公不就封留佐成王則周公身不就封安得使胡爲卿士馬遷􅀃之謬爾傳叔之至戒之正義曰仲之所封淮汝之閒左傳有文叔之所封圻内之蔡其事不知所出也丗家云蔡叔居上蔡宋仲子云胡徙居新蔡杜預云武王封叔度於汝南上蔡至平侯徙新蔡昭侯徙居九江下蔡檢其地上蔡新蔡皆屬汝南郡去京師太逺叔若封於上蔡不得在圻内也孔言叔封圻内或當有以知之但圻内蔡地不知所在爾侯于東土正義曰此使之爲諸侯於東土爾不知何爵也丗家云蔡仲卒子蔡伯荒立卒子宫侯立自此巳下遂皆稱侯則蔡仲初封即爲侯也蔡伯荒者自稱其字伯非爵也傳汝當至惟孝正義曰忠施於君孝施於父子能蓋父惟得爲孝而亦得爲忠者父以不忠獲罪若能改父之行蓋父之愆是爲忠臣也成王東至王政正義曰周公攝政之初奄與淮夷從管蔡作亂周公征而定之成王即政之初淮夷與奄又叛成王親往征之成王東伐淮夷遂踐滅奄國以其數叛徙奄民作誥命之辭言平淮夷徙奄之政令史敘其事作成王政之篇成訓平也言平此叛逆之民以爲王者政今故以成王政爲篇名傳成王至反覆正義曰洛誥之篇言周公歸政成王多士巳下皆是成王即政初事編篇以先後爲次此篇在成王書内知是成王即政淮夷奄國又叛王親征之又案洛誥成王即政始封伯禽伯禽旣爲魯侯乃居曲阜費誓稱魯侯伯禽宅曲阜淮夷徐戎並興魯侯征之作費誓彼言淮夷並興即此伐淮夷王伐淮夷魯伐徐戎是同時伐明是成王即政之年復重叛也鄭􅀇謂此伐淮夷與踐奄是攝政三年伐管蔡時事其編篇於此即云未聞費誓之篇言淮夷之叛則是重叛明矣多方之篇責殷臣云我惟時其戰要囚之至於再至於三􅀂武王伐紂之後惟攝政三年之一叛正可至於再爾安得至於三乎故知是成王即政又叛也鄭􅀇讀踐爲翦翦滅也孔不破字蓋以踐其國即是踐滅之事故孔以踐爲滅也下篇序云成王旣踐奄將遷其君是滅其奄而徙之以其數反覆故也成王旣至作蒲姑正義曰成王旣踐滅奄國將遷其君於蒲姑之地周公告召公使作䇿書言將遷奄君於蒲姑之地史敘其事作將蒲姑之篇傳巳滅至化之正義曰昭二十年左傳晏子云古人居此地者有蒲姑氏杜預云樂安博昌縣北有蒲姑城是蒲姑爲齊地也周公遷殷頑民於成周近京師敎化之知今遷奄君臣於蒲姑爲近中國敎化之必如此言則奄去中國逺於蒲姑杜預云奄闕不知所在鄭云奄蓋在淮夷之地亦未能詳成王先伐淮夷遂滅奄奄似逺於淮夷也傳言將至之亡正義曰禮天子不滅國諸侯有罪則殺其君而擇立次賢者故知所徙者言將徙奄新立之君於蒲姑也上言周公告召公其篇旣亡不知告以何事孔以意􅁲之告召公使爲此䇿書告令之不能知其必然否也多方第二十成王至多方正義曰成王歸自伐奄在於宗周鎬京諸侯以王征還皆來朝集周公稱王命以禍福咸告天下諸侯國史敘其事作多方傳衆方天下諸侯正義曰自武王伐紂及成王即政新封建者甚少天下諸侯多是殷之舊國其心未服周家由是奄君重叛今因滅奄新歸故告天下諸侯以興亡之戒欲今其無二心也語雖普告天下意在殷之舊國篇末亦告殷之多士獨言諸侯者舉其尊者以其篇主告殷之諸侯故也傳周公至鎬京正義曰以洛誥言歸政之事多士之篇次之多士是歸政明年之事故知此篇亦歸政明年之事事猶不明故取費誓爲證以成王政之序言成王東伐淮夷費誓之篇言淮夷徐戎並興俱言淮夷明是一事故言魯征淮夷作費誓王親征之奄滅其國以明二者爲一時之事也上序言成王伐淮夷而此傳言魯征淮夷者當時淮夷徐戎並起爲亂魯與二國相近發意欲並征二國故以二國誓衆但成王恐魯不能獨平二國故復親往征之所以成王政之序與費誓之經並言淮夷爲此故也傳言五月還至鎬京明此宗周即鎬京也禮記祭統衞孔悝之鼎銘云即宫於宗周彼宗周謂洛邑也是洛邑亦名宗周知此是鎬京者成王以周公歸政之時暫至洛邑還歸處西都鎬京是王常居知至于宗周至鎬京也且此與周官同時事也周官序云還歸在豐經云歸于宗周豐鎬相近即此宗周是鎬京也周公至不知正義曰周公以成王之意告衆方之諸侯曰我王順大道以告汝四方之國多方諸侯惟爾殷之諸侯正民者我武王大下汝天下民命誅殺虐紂汝諸侯天下之民無有不知紂以暴虐取亡欲令其思念之傳周公至自告正義曰成王新始即政周公留而輔之周公以工命告令諸侯所告實非王言故加周公曰於王􅀂曰之上以明周公宣成王之意也猷道也周公以王命順大道告四方也旣言四國又言多方見四方國多也不直言王曰稱周公以別王自告也王肅云周公攝政稱成王命以告及還政稱王曰嫌自成王辭故加周公以明之然多士之篇王􅀂曰之上不加周公曰者以彼上句云周公初于新邑洛用告知是周公故也傳殷之至取亡正義曰諸侯爲民之主民所取正故謂之正民民以君爲命死生在君天下之命在於一人紂言我大黜下汝之民命正謂武王誅紂也言天下無不知紂以暴虐取亡欲使思念之令其心棄殷而慕周也洪惟至攸聞正義曰以諸侯心未服周故舉夏殷爲戒此章皆􅀃桀亡湯興之事言夏桀大惟居天子之位謀上天之命而不能長敬念于祭祀惟天下至戒於夏桀謂下災異以譴告之兾其見災而懼改修政德而有夏桀不畏天命乃大其逸豫不肯憂言於民惟乃自樂其身無憂民之言夏桀乃復大爲淫昏之行不能終竟一日勉於天之道言不能一日行天道也桀之此惡乃是汝之所聞言不虚也傳大惟至災異正義曰上天之命去惡與善凡爲民主皆當謀之恐天捨己而去常須敬念祭祀天所譴告謂下災異天不言故下災異以譴告責人主兾自修政也厥圖至夏邑正義曰又言桀惡桀其謀天之命不能開發於民之所施政敎正謂不能開發善政以施於民桀乃大下罪罰於民重亂有夏之國外不憂民内不勤德因復甲於二者之内爲亂之行桀不能以善道奉承於衆民無大惟進之恭德而大舒惰於民言桀不能進行恭德而舒惰於治民桀旣舒惰於民故亦惟有夏之民貪饕忿懫而違逆桀命於是桀日日尊敬殘賜之臣能劓割夏邑者任用之使威服下民也傳桀乃至昏甚正義曰釋詁云崇重也桀旣爲惡政無以悛改乃復大下罪罰於民重亂有夏之國言其殘虐大也夾聲近甲古人甲與夾通用夾於二事之内而爲亂行故傳以二事充之外不憂民内不勤德桀身夾於二亂之内言其昏闇甚也鄭王皆以甲爲狎王云狎習災異於内外爲禍亂鄭云習爲鳥獸之行於内爲淫亂與孔異也傳言桀至治民正義曰民當奉主而責桀不能善奉於民衆者君之奉民謂設美政於民也以善奉民當敬以循之不敢懈惰桀乃無大惟進於恭德而大舒緩懈惰於治民令民益困而政益亂也傳桀洪至賊臣正義曰禮記云言悖而出亦悖而入桀旣不憂於民故民亦違逆桀命爲貪饕忿懫之行文十八年左傳云縉雲氏有不才子貪於飲食冒於貨賄天下之民謂之饕餮􅀃者皆言貪財爲饕貪食爲餮饕即叨也叨餮謂貪財貪食也忿懫言忿怒違理也民旣如此桀無如之何惟日日尊敬其能劓割夏邑者謂性能殘賊者任用之天惟至克開正義曰天惟桀惡之故更求民主以代之天乃大下明美之命於成湯使之代桀王天下乃命湯施刑罰絶有夏惟天不與夏桀亦巳大矣天所不與之者乃惟此桀用汝多方之義民爲臣而不能長乆於多享國故也義民實賢人也夏桀不用惟夏桀之所謂恭人衆士者大不能用明道安存享於衆民乃相與惟行暴虐於民至於百端所爲言虐無所不作大不能開民以善其臣與桀同惡夏家所以滅亡也傳惟桀至已者正義曰惟桀之所謂恭人衆士實非恭人亂王所好好用同己者以其同己謂之爲恭人實非善人故不能明享於民杜預訓享爲受受國者謂受而有之此言不能安享於民謂不能安存享受於民衆也乃惟至之命正義曰桀殘虐於民乃惟成湯能用汝衆方之賢人大代夏桀作天下民主湯旣爲民主愼其所施政敎於民民乃勸勉爲善其民雖被刑殺亦用勸勉爲善非徒湯聖後丗亦賢自湯至於帝乙皆能成其王道無不顯用有德畏愼刑罰亦能用勸勉爲善要察囚情絶戮衆罪亦能用勸勉爲善開放無罪亦能用勸勉爲善今至於汝君紂反先王之道不能用汝多方之民享有上天之命由此故被誅滅汝等冝當知之不當更令如殷也傳乃惟至民主正義曰大代夏者言天位之重湯能代之謂之大代夏也王肅云以大道代夏爲民主傳湯愼至刑淸正義曰愼厥麗者揔謂施政敎爾但下句言刑用勸勸用刑則厥麗之言有賞賞謂賞用勸也但所施政敎其事旣多非徒刑賞而巳舉事得中民皆勸也政無失刑無濫民以是勸善言政刑淸傳帝乙至勸善正義曰將欲斷罪必受其要辭察其虚實故言要囚也殄戮多罪罪者不濫開釋無罪者不枉殺人不縱有罪亦是政刑清故能用勸善也嗚呼至有辭正義曰周公先自歎而復稱王命云王順其事而言曰以言􅁻人謂之誥我告汝衆方諸侯非天用廢有夏夏桀縱惡自棄也非天用廢有殷殷紂縱惡自棄也又指􅀃紂惡乃惟汝君殷紂用汝衆方之民大爲過惡者共此惡人謀天之命其惡事盡有辭􅀃布在天下以此故見誅滅乃惟至閒之正義曰更􅀃桀亡之由乃惟有夏桀謀其政不能成於享國所謀皆是惡事故天下是喪亡以禍之使有國聖人來代之言皇天無親惟佑有德故以聖君代闇主也湯是夏之諸侯故云有國乃惟至念聽正義曰更􅀃紂亡之由乃惟汝商之後王紂逸豫其過縱恣無度紂謀其爲政不能絜進於善惟行惡事天惟下是喪亡以禍之惟聖人無念於善則爲狂人惟狂人能念於善則爲聖人紂雖狂愚兾其念善也計紂爲惡早應誅滅天惟以成湯之故故積五年須待閑暇湯之子孫縱緩多年兾其改悔而紂大爲民主肆行無道事無可念言無可聽由是夫始改意故誅滅之傳惟聖至滅亡正義曰聖者上智之名狂者下愚之稱孔子曰惟上智與下愚不移是聖必不可爲狂狂必不能爲聖此事決矣而此言惟聖人無念於善則爲狂人惟狂人能念於善則爲聖人者方言天須暇於紂兾其改悔􅀃有此理爾不言此事是實也謂之爲聖寧肯無念於善巳名爲狂豈能念善中人念與不念其實少有所移欲見念善有益故舉狂聖極善惡者言之傳天以至二年正義曰湯是創業聖主理當祚胤長逺計紂未死五年之前已合喪滅但紂是湯之子孫天以湯聖人之故故五年須待閑暇湯之子孫兾其改悔能念善道而紂大爲民主肆行無道所爲皆惡事無可念者言皆惡言無可聽者由是天始滅之五年者以武王討紂初立即應伐之故從武王初立之年數至伐紂爲五年文王受命九年而崩其年武王嗣立服喪三年未得征伐十一年服闋乃觀兵於孟津十三年方始殺紂從九年至十三年是五年也然服喪三年還師二年乃事理冝然而云以湯故須暇之者以殷紂惡盈乆合誅滅逢文王崩未暇行師兼之示弱凡經五載聖人因言之以爲法敎爾其實非天不知紂狂望其後改悔亦非曲念湯德延此歳年也天惟至多方正義曰天以紂惡之故將選人代之惟求賢人於汝衆方大動紂以威謂誅去紂也開其有德能顧天之者欲以代紂惟汝衆方之君悉皆無德無堪使天顧之惟我周王善奉於衆能以仁政得人心文武能堪用德惟可以主神天之􅂎任作天子也天惟以我用德之故故敎我使用美道大與我殷王之命命我代殷爲王正汝衆方諸侯言天授我以此位也傳天惟至代者正義曰天惟求汝衆方之賢言欲選賢以爲天子也大動紂以威謂誅殺紂也天意復開其能顧天可以代者欲使代之顧謂迴視有聖德者天迴視之詩所謂乃眷西顧此惟與宅與彼顧同言天顧文王而與之居即此意也但謂天顧此人人亦顧天此云開厥顧天謂人顧天也下云罔堪顧之謂天顧人也言多方人皆無德不堪使天顧之傳以顧事通於彼故皆以天言之傳天以至諸侯正義曰周以能行美道乃得天顧復言天用敎我美道者人之美惡何事非天由爲美道爲天所顧以美歸功於天言敎我用美道故得當天意也今我至速辜正義曰今我何敢多以言誥告於汝衆而巳我惟大下黜汝管蔡商奄四國之君也民命謂民以君爲命謂誅殺四國之君也我巳殺汝四國君矣汝何不以誠信之心行寛裕之道於汝衆方諸侯欲令懲創四國務崇和協言汝衆方諸侯何不崇和協相親近大顯見治道於我周王以享受上天之命而執心不安乎今爾殷之諸侯尚得居汝常居臣民尚得畋汝故田其安樂如此汝何得不順從王政以廣大天之命而自懷疑乎汝乃復所蹈行者數爲不安時或叛逆是汝心未愛我周家故也汝乃不大居安天命是汝乃欲盡播棄天命汝不愛我周家播棄天命是汝乃自爲此不常謀信於正道言其心不常謀正道故爲背違之心我惟汝如是不謀信於正道之故其以言辭敎告之我惟汝如是不誠信於正道之故其用戰伐要察囚繫之由汝數爲不信故我敎告汝戰伐要囚汝至於再至於三我敎告汝戰伐要囚汝巳至再三如今而後乃復有不用我命者我乃其大罰誅之言我更將殺汝也非我有周執德不安數設誅罰乃惟汝自召罪也此章反覆殷勤者恐其更有叛逆故丁寜戒之傳今我至之君正義曰今我何敢多爲言誥而巳實殺其君非徒口告管蔡商奄皆爲叛逆受誅故今因奄重叛而追􅀃前事言下四國民命王肅以四國爲四方之國言從今以後四方之國苟有此罪則必誅之謂戒其將來之事與孔不同傳夾近至安乎正義曰夾其旁旁是近義故爲近也諸國踈逺周室不肯以治爲功故責之顧氏云汝衆方諸侯何不常和協相親近大顯見治道於我周王以享上天之命而今何以不自安乎傳今汝至疑乎正義曰主遷於上臣易於下計汝諸侯之國應隨殷降黜今汝殷之諸侯皆尚得居汝常居臣民畋汝故田田宅不易安樂如此汝何不順從我周王之政以廣上天之命使天多佑汝何故畏我周家自懷疑乎諸侯有國故云居汝常居臣民重田故云畋汝故田治田謂之畋猶捕魚謂之漁今人以營田求食謂之畋食即此畋亦田之義也傳汝未至正道正義曰事君無二臣之道爲人臣者常冝信之汝末愛我周家播棄天命汝數爲叛逆是汝乃自爲此不常謀信於正道傳我惟至朋黨正義曰敎告與戰要囚連文則告以文辭是將戰之時敎告謂伐紂之事昭十三年􅀃戰法云告之以文辭董之以武師是將戰之時於法當有文辭告前敵也我惟汝如是不謀信於正道故其敎告之謂訊以文辭訊告也告以文辭數其罪也其戰要囚之謂戰敗其師執取其人受其要辭而囚之謂討其倡亂之人囚執其朋黨也此雖揔言戰事但下有至於再三明此指伐紂也傳再謂至之事正義曰以伐紂爲一故再謂攝政之初三監與淮夷叛時也三謂成王即政又叛也言上迪屢不靜之事王曰嗚呼猷至大僚正義曰王言而歎曰嗚呼我以道告汝在此所有四方之多士謂四方之諸侯及與殷之衆士謂頑民遷成周者曰告四方諸侯遂告成周之人徧使諸侯知之此章皆告成周之人辭也今汝成周之人奔走勤事臣我周之監成周者五年無罪過則聽汝還本土於惟有相長事謂小大衆正官之人汝無有不能用法欲其皆用法也小大衆正官之人自爲不和汝衆官等自當和之哉汝等親近室家不相和親汝亦當和之哉汝邑内之人􅀂能明於和睦之道汝惟能勤於汝之職事言是其敎之使然汝能庶幾不自相怨忌入於凶德若能不入於凶德亦則用敬敬之道常在汝之職位不黜退也汝􅀂能善相敎誨使我􅂤閱於汝邑善汝之事以汝所謀爲大則汝乃用是洛邑庶幾得反本土長得勤畋汝故田汝能修善天惟與汝憐汝我有周惟其大大賞賜汝汝非但受賞而已其有蹈大道者得在王庭被任用庶幾汝事有所服行在於大官恐其心未服故丁寧勸誘之傳王歎至多士正義曰言有方多士與殷多士則此二者非一人也有方多士當謂於時所有四方之諸侯也與殷多士當謂遷於成周頑民之衆士也下云以臣我監者謂成周之監明此殷多士也傳監謂至本土正義曰下云自時洛邑此所戒成周之人故知監謂成周之監此指謂所遷頑民殷家衆士也五年再閏天道有成故期以五年無過則得還本土以民性重遷設期以誘之傳於惟至用法正義曰胥相也伯長也顧氏以相長事即小大衆正官之人也傳汝庶至汝位正義曰和順爲善德怨惡爲凶德忌謂自怨忌上言自作不和是怨忌也釋訓云穆穆敬也此戒小大正官之人故云敬敬常在汝位傳汝能至邑里正義曰閲謂􅂤閲其事觀其具足以否故言閲具於汝邑介大也以汝所謀爲大善其治理聽還本國也是由在洛邑修善得反其邑里王肅云其無成雖五年亦不得反也王曰嗚呼多至爾土正義曰王言而歎曰嗚呼成周之衆士汝若不能勸勉信用我之敎命汝則惟不能多受大福祚矣凡民惟曰不享於汝祚矣汝乃惟爲逸豫惟爲頗僻大逺棄王命則惟汝衆方自取天之威刑我則致天之罰於汝身將逺徙之使離逺汝之本土傳王歎至祚矣正義曰勸信我命勸勉而信順之凡民亦惟曰不享於汝祚矣言民亦不願汝之子孫長久矣傳􅀂爾至徙之正義曰成周一邑之士不得謂之多方此蓋意在成周遷者兼告四方諸國使知亦如康誥王誥康叔并使諸侯知之離逺汝土更逺徙之鄭云分離奪汝土也與孔異也王曰我至我怨正義曰王曰我今告戒汝者不惟多爲言誥汝而巳惟敬告汝吉凶之命從我則吉違我則凶汝命吉凶在此言也王又謂汝所以再三被誅者是惟汝初不能敬於和道故致此爾汝自取之則無於我有怨傳又誥至之意正義曰又誥者更言王意又謂汝曰也以上王誥巳終又起別端故更稱王又復言曰以序云成王在豐誥庶邦則此篇是王親告之辭直稱王曰者是也其有周公稱王告者則上云周公曰王􅀂曰是也又云嗚呼王􅀂曰是也顧氏云又曰者是王又復言曰也尚書正義卷第十六計一萬三千一百七十七字
