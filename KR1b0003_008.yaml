body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔頴達奉勑撰商書湯誓第一仲虺之誥第二湯誥第三伊訓第四太甲上第五太甲中第六太甲下第七咸有一德第八湯誓第一伊尹至湯誓正義曰伊尹以夏政醜惡去而歸湯輔相成湯與之伐桀升道從陑出其不意遂與桀戰于鳴條之野將戰而誓戒士衆史敘其事作湯誓傳桀都至之南正義曰此序湯自伐桀必言伊尹相湯者序其篇次自爲首尾以上云伊尹醜夏遂相成湯伐之故文次言伊尹也計太公之相武王猶如伊尹之相成湯泰誓不言太公相者彼文無其次也且武王之時有周召之倫聖賢多矣湯稱伊尹云聿求元聖與之戮力伊尹稱惟尹躬曁湯咸有一德則伊尹相湯其功多於太公故特言伊尹相湯也桀都安邑相傳爲然即漢之河東郡安邑縣是也史記吳起對魏武侯云夏桀之居左河濟右太華伊闕在其南羊腸在其北修政不仁湯放之也地理志云上黨郡壷關縣有羊腸坂在安邑之北是桀都安邑必當然矣將明陑之所在故先言桀都安邑桀都在亳西當從東而往今乃升道從陑升者從下向上之名言陑當是山阜之也歷險迂路爲出其不意故也陑在河曲之南蓋今潼關左右河曲在安邑西南從陑向北渡河乃東向安邑鳴條在安邑之西桀西出拒湯故戰于鳴條之野陑在可由之南鳴條在安邑之西皆彼有其迹相傳云然湯以至聖伐暴當顯行用師而出其不意掩其不備者湯承禪代之後甞爲桀臣慙而且懼故出其不意武王則三分天下有其二久不事紂紂有浮桀之罪地無險要之勢故顯然致罰以明天誅又慇懃誓衆與湯有異所以湯惟一誓武王有三傳地在至拒湯正義曰鄭玄云鳴條南夷地名孟子云舜卒放鳴條東夷之地或云陳留平丘縣今有鳴條亭是也皇甫謐云伊訓曰造攻自鳴條朕哉自亳又曰夏師敗績乃伐三朡湯誥曰王歸自克夏至于亳三朡在定陶放義不得在陳留與東夷也今安邑見有鳴條陌昆吾亭左氏以爲昆吾與桀同以乙卯日亡韋顧亦爾故詩曰韋顧旣伐昆吾夏桀放左氏昆吾在衞乃在濮陽不得與桀異處同日而亡明昆吾亦來安邑欲以衞桀故同日亡而安邑有其亭也且吳起言險以指安邑安邑於此而言何得在南夷乎謐言是也湯誓正義曰此經皆誓之辭也甘誓泰誓牧誓發首皆有序引別言其誓意記其誓處此與費誓惟記誓辭不言誓處者史非一人辭有詳略序以經文不具故備言之也王曰至攸赦正義曰商王成湯將與桀戰呼其將士曰來汝在軍之衆庶悉聽我之誓言我伐夏者非我小子輒敢行此以臣伐君舉爲亂事乃由有夏君桀多有大罪上天命我誅之桀旣失君道我非復桀臣是以順天誅之由其多罪故也桀之罪狀汝盡知之今汝桀之所有之衆即汝輩是也汝等言曰我君夏桀不憂念我等衆人舎廢我稼穡之事奪我農功之業而爲割剥之政於夏邑斂我貨財我惟聞汝衆言夏氏旣有此罪上天命我誅桀哉畏上天之命不敢不正桀罪而誅之又質而審之今汝衆人其必言曰夏王之罪其實如我所言夏王非徒如此又與臣下相率遏絶衆力使不得事農又相率爲割剥之政於此夏邑使不得安居上下同惡民困益甚由是汝等相率怠惰不與在上和協比桀於日曰是日何時能喪若其可喪我與汝皆亡身没之寧殺身以亡桀是其惡之甚夏王惡德如此今我必往誅之汝庶幾輔成我一人致行天之威罰我其大賞賜汝汝無得不信我語我終不食盡其言爲虚僞不實汝若不從我之誓言我則并殺汝子以戮汝身必無有所赦勸使勉力勿犯法也庶亦衆也古人有此重言猶云艱難也傳契始至一夫正義曰以湯於此稱王故本其號啇之意契始封商湯號爲商知契始封商湯遂以商爲天下之號鄭玄之說亦然惟王肅云相土居商丘湯取商爲號若取啇丘爲號何以不名商丘而單名商也若八遷國名商不改則此商猶是契商非相土之商也若八遷遷即改名則相土至湯改名多矣相土旣非始祖又非受命何故用其所居之地以爲天下號名成湯之意復何取乎知其必不然也湯取契封商以商爲天下之號周不取后稷封邰爲天下之號者契後八遷商名不改成湯以商受命故冝以商爲號后稷之後隨遷易名公劉爲豳大王爲周文王以周受命故當以周爲號二代不同理則然矣泰誓云獨夫受此湯稱爲王則比桀於一夫桀旣同於一夫故湯可稱王矣是言湯於伐桀之時始稱王也周書泰誓稱王則亦伐紂之時始稱王也鄭玄以文王生稱王亦謬也傳稱舉至順天正義曰稱舉釋言文常法以臣伐君則爲亂逆故舉亂謂以諸侯伐天子桀有昬德宣三年左傳文以有昬德天命誅之今乃順天行誅非復臣伐君也以此解衆人守常之意也傳今汝至之言正義口如我者謂湯之自稱我也湯謂其衆云汝言桀之罪如我誓言所述也傳言桀至賦重正義曰此經與上舎我穡事而割正夏其意一也上言夏王之身此言君臣相率再言所以積桀之罪也力施於農財供上賦故以止絶衆力謂廢農功割剥夏邑謂征賦重言以農時勞役又重斂其財致使民困而怨深賦斂重則民不安矣傳衆下至喪桀正義曰上旣馭之非道下亦不供其命故衆下相率爲怠惰不與上和合不肯每事順從也比桀於日曰是日何時喪亡欲令早喪桀命也我與汝俱亡者民相謂之辭言並欲殺身以喪桀也所以比桀於日者以日無喪之理猶云桀不可喪言喪之難也不避其難與汝俱亡欲殺身以喪桀疾之甚也鄭云桀見民欲叛乃自比於日曰是日何甞喪乎日若喪亡我與汝亦皆喪亡引不亡之徴以脅恐下民也傳食盡至不實正義曰釋詁云食僞也孫炎曰食言之僞也哀二十五年左傳云孟武伯惡郭重曰何肥也公曰是食言多矣能無肥乎然則言而不行如食之消盡後終不行前言爲僞故通謂僞言爲食言故爾雅訓食爲僞也傳古之至勿犯正義曰昭二十年左傳引康誥曰父子兄弟罪不相及是古之用刑如是也旣刑不相及必不殺其子權時以迫脅之使勿犯刑法耳不於甘誓解之者以夏啓承舜禹之後刑罰尚寛殷周以後其罪或相縁坐恐其實有孥戮故於此解之鄭玄云大罪不止其身又孥戮其子孫周禮云其奴男子入于罪隷女子八于舂槀鄭意以爲實戮其子故周禮注云奴謂從坐而沒入縣官者也孔以孥戮爲權脅之辭則周禮所云非從坐也鄭衆云謂坐爲盗賊而爲奴者輸於罪隸舂人槀人之官引此孥戮汝又引論語云箕子爲之奴或如衆言別有没入非縁坐者也湯旣至臣扈正義曰湯旣伐而勝夏革命創制變置社稷欲遷其社無人可代句龍故不可而止於時有言議論其事故史敘之爲夏社疑至臣扈三篇皆亡傳湯承至而止正義曰傳解湯遷社之意湯承堯舜禪代之後已獨伐而取之雖復應天順人乃是逆取順守而有慙愧之德自恨不及古人故革命創制改正易服因變置社稷也易革卦彖曰湯武革命順乎天而應乎人下篇言湯有慙德大傳云改正朔易服色此其所得與民變革者也所以變革此事欲易人之視聽與之更新故於是之時變置社稷昭二十九年左傳云共工氏有子曰句龍爲后土后土爲社有烈山氏之子曰柱爲稷自夏巳上祀之周棄亦爲稷自商巳來祀之祭法云厲山氏之有天下也其子曰農能殖百穀夏之衰也周棄繼之故祀以爲稷其工氏之霸九州也其子曰后土能平九州故祀以爲社是言變置之事也魯語文與祭法正同而云夏之興也周棄繼之興當爲衰字之誤耳湯于初時社稷俱欲改之周棄功多於柱即今廢柱祀棄而上丗治水土之臣其功無及句龍者故不可遷而止此序之次在湯誓之下云湯旣勝夏下云夏師敗績湯遂從之是未及逐桀巳爲此謀鄭玄等注此序乃在湯誓之上若在作誓之前不得云旣勝夏也孟子曰犧牲旣成粢盛旣絜祭祀以時然而旱乾水溢則變置社稷鄭玄因此乃云湯伐桀之時大旱旣置其禮祀明德以薦而猶旱至七年故更致社稷乃謂湯即位之後七年大旱方始變之若實七年乃變何當繫之勝夏勝夏猶尚不可況在湯誓前乎且禮記云夏之衰也周棄繼之商興七年乃變安得以夏衰爲言也若商革夏命猶七年祀柱左傳亦不得斷爲自夏已上祀柱自商巳來祀棄也由此而言孔稱改正朔而變置社稷所言得其旨也漢丗儒者說社稷有二左傳說社祭句龍稷祭柱棄惟祭人神而已孝經說社爲土神稷爲穀神句龍柱棄是配食者也孔無明說而此經云遷社孔傳云無及句龍即同賈逵馬融等說以社爲句龍也傳言夏至皆亡正義曰疑至與臣扈相類當是二臣名也蓋亦言其不可遷之意馬融云聖人不可自專復用二臣自明也傳三朡至寶之正義曰湯伐三朡知是國名逐桀而伐其國知桀走保之也今定陶者相傳爲然安邑在洛陽西北定陶在洛陽東南孔跡其所往之路桀自安邑東入山出太行乃東南渉河往奔三朡湯緩追之不迫遂奔南巢俘取釋詁文桀必載寶而行棄於三朡取其寶玉取其所棄者也楚語云玉足以庇廕嘉穀使無水旱之災則寶之韋昭云玉禮神之玉也言用玉禮神神享其德使風雨調和可以庇廕嘉穀故取而寶之仲虺之誥第二湯歸至作誥正義曰湯歸自伐夏至于大坰之地其臣仲虺作誥以誥湯史録其言作仲虺之誥上言遂伐三朡故傳言自三朡而還不言歸自三朡而言歸自夏者伐夏而遂逐桀於今方始旋歸以自夏告廟故序言自夏傳本其來處故云自三朡耳大坰地名未知所在當是定陶向亳之路所經湯在道而言予恐來丗以台爲口實故仲虺至此地而作誥也序不言作仲虺之誥以理足文便故略之傳爲湯至之後正義曰定元年左傳云薛之皇祖奚仲居薛以爲夏車正仲虺居薛以爲湯左相是其事也仲虺之誥正義曰發首二句史述成湯之心次二句湯言已慙之意仲虺乃作誥以下皆勸湯之辭自曰嗚呼至用爽厥師言天以桀有罪命伐夏之事自簡賢輔勢至言足聽聞說湯在桀時怖懼之事自惟王弗邇聲色至厥惟舊哉言湯有德行加民民歸之事自佑賢輔德以下說天子之法當擢用賢良屏黜昬暴勸湯奉行此事不須以放桀爲惡康誥召誥之類二字足以爲文仲虺誥三字不得成文以之字足成其句畢命囧命不言之微子之命文侯之命言之與此同猶周禮司服言大裘而冕亦足句也傳仲虺至曰誥正義曰伯仲叔季人字之常仲虺必是其名或字仲而名虺古人名字不可審知縱使是字亦得謂之爲名言是人之名號也左傳稱居薛爲湯左相是以諸侯相天子也周禮士師云以五戒先後刑罰一曰誓用之於軍旅二曰誥用之於㑹同是㑹同曰誥誥謂於㑹之所設言以誥衆此惟誥湯一人而言㑹同者因解諸篇誥義且仲虺必對衆誥湯亦是㑹同曰誥成湯放桀于南巢正義曰桀奔南巢湯縱而不迫故稱放也傳言南巢地名不知地之所在周書序有巢伯來朝傳云南方遠國鄭玄云巢南方之國丗一見者桀之所奔蓋彼國也以其國在南故稱南耳傳并以南巢爲地名不能委知其處故未明言之夏王至厥師正義曰矯詐也誣加也夏王自有所欲詐加上天言天道須然不可不爾假此以布苛虐之命於天下以困苦下民上天用桀無道之故故不善之用使商家受此爲王之命以王天下用命商王明其所有之衆謂湯敎之使修德行善以自安樂是明之也傳式用爽明也正義曰式用釋言文昭七年左傳云是以有精爽至於神明從爽以至於明則爽是明之如故爽爲明也經稱昧爽謂未大明也德懋至不吝正義曰於德能勉力行之者王則勸勉之以官於功能勉力爲之者王則勸勉之以賞用人之言惟如已之所出改悔過失無所恡惜美湯之行如此凡庸之主得人之言非已智雖知其善不肯遂從已有愆失恥於改過舉事雖覺其非不肯更悔是惜過不改故以此美湯也成湯之爲此行尚爲仲虺所稱歎凡人能勉者鮮矣乃葛伯仇餉正義曰此言乃者却說巳過之事胤征云乃季秋月朔其義亦然左傳稱怨耦曰仇謂彼人有負於我我心怨之是名爲仇也餉田之人不負葛伯葛伯奪其餉而殺之是葛伯以餉田之人爲已之仇言非所怨而妄殺故湯爲之報也孟子稱湯使亳衆往爲之耕有童子以黍肉餉葛伯奪而殺之則葛伯所殺殺亳人也傳言葛伯遊行見農人之餉於田者殺其人而奪其餉故謂之仇餉乃似葛伯自殺已人與孟子違者湯之征葛以人之枉死而爲之報耳不爲亳人乃報之非亳人則赦之故傳指言殺餉不辨死者何人亳人葛人義無以異故不復言亳非是故違孟子傳賢則至之道正義曰周禮郷大夫云三年則大比考其德行道藝而興賢者鄭玄云賢者謂有德行者詩序云忠臣良士皆是善也然則賢是德盛之名德是資賢之實忠是盡心之事良是爲善之稱俱是可用之人所從言之異耳佑之與輔顯之與遂隨便而言之傳弱則至正義正義曰力少爲弱不明爲昧政荒爲亂國滅爲亡兼謂包之攻謂擊之取謂取爲已有侮謂侮慢其人弱昧亂亡俱是彼國衰微之狀兼攻取侮是此欲吞并之意弱昧是始衰之事來服則制爲已屬不服則以兵攻之此二者始欲服其人未是滅其國亂是巳亂亡謂將亡二者衰甚已將滅其國亡形巳著無可忌憚故陵侮其人旣侮其人必滅其國故以侮言之此是人君之正義仲虺陳此者意亦言桀亂亡取之不足爲愧下言推亡及覆昬暴其意亦在桀也德日至乃離正義曰易繫辭云日新之謂盛德修德不怠日日益新德加于人無遠不届故萬邦之衆惟盡歸之志意自滿則陵人人旣被陵情必不附雖九族之親乃亦離之萬邦舉遠以明近九族舉親以明踈也漢代儒者說九族有二案禮戴及尚曺緯歐陽說九族乃異姓有屬者父族四母族三妻族二古尚書說九族從髙祖至玄孫凡九族堯典云以親九族傳云以睦髙祖玄孫之親則此言九族亦謂髙祖玄孫之親也謂萬邦惟懷實歸之九族乃離實離之聖賢設言爲戒容辭頗甚父子之閒便以志滿相棄此言九族以爲外姓九族有屬文便也湯誥第三湯旣至湯誥正義曰湯旣黜夏王之命復歸于亳以伐桀大義誥示天下史録其事作湯誥仲虺在路作誥此至亳乃作故次仲虺之下王歸自克夏正義曰湯之俴桀當有諸侯從之不從行者必應多矣旣巳克夏改正名號還至于亳海内盡來猶如武成篇所云庶邦冢君曁百工受命于周也湯於此時大誥諸侯以伐桀之義故云誕告萬方誕大釋詁文萬者舉盈數下云凡我造邦是誥諸侯也降衷于下民正義曰天生烝民與之五常之性使有仁義禮智信是天降善於下民也天旣與善於民君當順之故下傳云順人有常之性則是爲君之道弗忍荼毒正義曰釋草云荼苦菜此萊味苦故假之以言人苦毒謂螫人之蟲蛇虺之類實是人之所苦故并言荼毒以喻苦也敢用玄牡正義曰檀弓云殷人尚白牲用白今云玄牡夏家尚黒于時未變夏禮故不用白也故安國注論語敢用玄牡之文云殷家尚白未變夏禮故用玄牡是其義也鄭玄說天神有六周家冬至祭皇天大帝于圜丘牲用蒼夏至祭靈威仰於南郊則牲用騂孔注孝經圜丘與郊共爲一事則孔之所說無六天之事論語堯曰之篇所言敢用玄牡即此事是也孔注論語以爲堯曰之章有二帝三王之事録者採合以成章檢大禹謨及此篇與泰誓武成則堯曰之章其文略矣鄭玄解論語云用玄牡者爲舜命禹事於時揔告五方之帝莫適用用皇天大帝之牲其意與孔異傳聿遂至請命正義曰聿訓述也述前所以申遂故聿爲遂也戮力猶勉力也論語云陳力就列湯臣大賢惟有伊尹故知大聖陳力謂伊尹也伊尹賢人而謂之聖者相對則聖極而賢次散文則賢聖相通舜謂禹曰惟汝賢是聖得謂之賢則賢亦可言聖鄭玄周禮注云聖通而先識也解先識則爲聖名故伊尹可爲聖也孟子云伯夷聖人之淸者也伊尹聖人之任者也柳下惠聖人之和者也孔子聖人之明者也是謂伊尹爲聖人也桀爲殘虐人不自保故伐桀除人之穢是爲請命天命至允殖正義曰桀以大罪身即黜伏是天之福善禍淫之命信而不僭差也旣除大惡天下煥然脩飾若草木同生華兆民信樂生也昔日不保性命今日樂生活矣僭差不齊之意故傳以僭爲差賁飾易序卦文也傳此伐至衆心正義曰經言兹者謂此伐桀也顧氏云未知得罪于天地言伐桀之事未知得罪于天地以否湯之伐桀上應天心下符人事本實無罪而云未知得罪以否者謙以求衆心惟簡在上帝之心正義曰鄭玄注論語云簡閱在夭心言天簡閱其善惡也咎單作明居正義曰百篇之序此類有四伊尹作咸有一德周公作無逸作立政與此篇直言其所作之人不言其作者之意蓋以經文分明故略之馬融云咎單爲湯司空傳言主土地之官蓋亦爲司空也伊訓第四成湯至徂后正義曰成湯旣没其歳即太甲元年伊尹以太甲承湯之後恐其不能纂修祖業作書以戒之史叙其事作伊訓肆命徂后三篇傳太甲至元年正義曰太甲太丁子丗本文也此序以太甲元年繼湯沒之下明是太丁未立而卒太甲以孫繼祖故湯没而太甲代立即以其年稱爲元年也周沄以踰年即位知此即以其年稱元年者此經云元祀十有二月伊尹祠于先王奉嗣王柢見厥祖太甲中篇云惟三祀十有二月朔伊尹以冕服奉嗣王歸于亳二者皆云十有二月若是踰年即位二者皆當以正月行事何以用十二月也明此經十二月是湯崩之踰月太甲中篇三祀十有二月是服闋之踰月以此知湯崩之年太甲即稱元年也舜禹以受帝終事自取歳首遭喪嗣位經無其文夏后之丗或亦不踰年也顧氏云殷家猶質踰月即改元年以明丗異不待正月以爲首也商謂年爲祀序稱年者序以周丗言之故也據此經序及太甲之篇太甲必繼湯後而殷本紀云湯崩太子太丁未立而卒於是乃立太丁之弟外丙三年崩別立外丙之弟仲壬四年崩伊尹乃立太丁之子太甲與經不同彼必妄也劉歆班固不見古文謬從史記皇甫謐旣得此經作帝王丗紀乃述馬遷之語是其踈也顧氏亦云止可依經誥大典不可用傳記小說惟元祀正義曰伊尹祠于先王謂祭湯也奉嗣王祗見厥祖謂見湯也故傳解祠先王爲奠殯而告見厥祖爲居位主喪羣后咸在爲在位次皆述在喪之事是言祠是奠也祠喪于殯斂祭皆名爲奠虞祔卒哭始名爲祭知祠非宗廟者元祀即是初喪之時未得祠廟且湯之父祖不追爲王所言先王惟有湯耳故知祠實是奠非祠宗廟也祠之與奠有大小耳祠則有主有尸其禮大奠則奠器而巳其禮小奠祠俱是享神故可以祠言奠亦由於時猶質未有節文周時則祠奠有異故傳解祠爲奠耳傳此湯至而告正義曰太甲中篇云三祀十有二月伊尹以冕服奉嗣王則是除喪即吉明十二月服終禮記稱三年之喪二十五月而畢知此年十一月湯崩此祠先王是湯崩踰月太甲即位奠殯而告也此奠殯而告亦如周康王受顧命尸於天子春秋之丗旣有奠殯即位踰年即位此踰月即位當奠殯即位也此言伊尹祠于先王是特設祀也嗣王祗見厥祖是始見祖也特設祀禮而王始見祖明是初即王位告殯爲喪主也傳湯有至稱焉正義曰湯有功烈之祖毛詩傳文也烈訓業也湯有定天下之功業爲商家一代之大祖故以烈祖稱焉傳先君至禳災正義曰有夏先君揔指桀之上丗有德之王皆是也傳舉聖賢者言禹巳下少康巳上惟當禹與啓及少康耳魯語云杼能師禹者也杼少康之子傳蓋以其德衰薄故斷自少康巳上耳由勉行其德故無有夭災言能以德禳災也山川至咸若正義曰山川鬼神謂山川之鬼神也亦莫不寧者謂鬼神安人君之政政善則神安之神安之則降福人君無妖孽也鳥獸魚鼈咸若者謂人君順禽魚君政善而順彼性取之有時不夭殺也鳥獸在陸魚鼈在水水陸所生微細之物人君爲政皆順之明其餘無不順也于其至自亳正義曰于其子孫於有夏先君之子孫謂桀也不循其祖之道天下禍災謂滅其國而誅其身也天不能自誅於桀故借手于我有命之人謂成湯也言湯有天命將爲天子就湯借手使誅桀也旣受天命誅桀始攻從鳴條之地而敗之天所以命我者由湯始自修德於亳故也立愛至四海正義曰王者之馭天下撫兆人惟愛敬二事而巳孝經天子之章盛論愛敬之事言天子當用愛敬以接物也行之所立自近爲始立愛惟親先愛其親推之以及踈立敬惟長先敬其長推之以及幼即孝經所云愛親者不敢惡於人敬親者不敢慢於人是推親以及物始則行於家國終乃洽於四海即孝經所云德敎加於百姓刑于四海是也所異者孝經論愛敬並始於親令縁親以及踈此分敬屬長言從長以及幼耳先民時若正義曰賈逵注周語云先民古賢人也魯語云古曰在昔昔曰先民然則先民在古昔之前遠言之也遠古賢人亦是民内之一人故以民言之先民之言於是順從言其動皆法古賢也居上克明正義曰見下之謂明言其以理恕物照察下情是能明也檢身若不及正義曰檢謂自攝斂也檢勑其身常如不及不自大以卑人不恃長以陵物也曰敢有至蒙士正義曰此皆湯所制治官之刑以儆戒百官之言也三風十愆謂巫風二舞也歌也淫風四貨也色也遊也畋也與亂風四爲十愆也舞及遊畋得有時爲之而不可常然故三事特言恒也歌則可矣不可樂酒而歌故以酣配之巫以歌舞事神故歌舞爲巫覡之風俗也貨色人所貪欲冝其以義自節而不可專心殉求故言殉於貨色心殉貨色常爲遊畋是謂淫過之風俗也侮慢聖人之言拒逆忠直之諫踈遠耆年有德親比頑愚幼童愛惡憎善國必荒亂故爲荒亂之風俗也此三風十愆雖惡有大小但有一於身皆喪國亡家故各從其類相配爲風俗臣下不匡其刑墨言臣無貴賤皆當匡正君也具訓于蒙士者謂湯制官刑非直敎訓邦君卿大夫等使之受諫亦備具敎訓下士使受諫也傳常舞至無政正義曰酣歌常舞並爲耽樂無度荒淫廢德俱是敗亂政事其爲愆過不甚異也恒舞酣歌乃爲愆耳若不恒舞不酣歌非爲過也樂酒曰酣言耽酒以自樂也說文亦云酣樂酒也楚語云民之精爽不擕貳者則明神降之在男曰覡在女曰巫又周禮有男巫女巫之官皆掌接神故事鬼神曰巫也廢棄德義專爲歌舞似巫事鬼神然言其無政也傳殉求至風俗正義曰殉者心循其事是貪求之意故爲求也志在得之不顧禮義昧求謂貪昧以求之無逸云于遊于畋是遊與畋別故爲遊戯與畋獵爲之無度是淫過之風俗也傳狎侮至風俗正義曰侮謂輕慢狎謂慣忽故傳以狎配侮而言之旅􅋙云德盛不狎侮是狎侮意相類也傳邦君至匡正正義曰言十愆有一則亡國喪家邦君卿士慮其喪亡之故則冝以爭臣自匡正犯顔而諫臣之所難故設不諫之刑以勵臣下故言臣不正君則服墨刑墨刑五刑之輕者謂鑿其頟涅以墨司刑所謂墨罪五百者也蒙謂蒙稚卑小之稱故蒙士例謂下士也顧氏亦以爲蒙謂蒙闇之士例字冝徙下讀言此等流例謂下士也聖謨至孔彰正義曰此歎聖人之謨洋洋美善者謂上湯作官刑所言三風十愆今受下之諫是善言甚明可法也爾惟至厥宗正義曰又戒王爾惟修德而爲善德無小德雖小猶萬邦賴慶況大善乎爾惟不德而爲惡惡無大惡雖小猶墜失其宗廟況大惡乎傳苟爲至之訓正義曰爾惟德謂修德以善也爾惟不德謂不修德爲惡也易繫辭曰善不積不足以成名惡不積不足以滅身乃謂大善始爲福大惡乃成禍此訓作勸誘之辭言爲善無小小善萬邦猶慶況大善乎而爲惡無大言小惡猶墜厥宗況大惡乎此經二事辭反而意同也傳言惡有類者解小惡墜宗之意初爲小惡小惡有族類以類相致至於大惡若致於大惡必墜失宗廟言至於大惡乃墜非小惡即能墜也晉語云趙文子冠見韓獻子曰戒之此謂成人成人在始始與善善進不善蔑由至矣始與不善不善進善亦蔑由至矣言惡有類以類相致也今太甲初立恐其親近惡人以惡類相致禍害故以言戒之此是伊尹至忠之訓也太甲上第五太甲至三篇正義曰太甲旣立爲君不明居喪之禮伊尹放諸桐宫使之思過三年復歸於亳都以其能改前過思念常道故也自初立至放而復歸伊尹每進言以戒之史敘其事作太甲三篇案經上篇是放桐宫之事中下二篇是歸亳之事此序歷言其事以揔三篇也傳不用至之禮正義曰此篇承伊訓之下經稱不惠于阿衡知不明者不用伊尹之訓也王徂桐宫始云居憂是未放巳前不明居喪之禮也傳湯葬至曰放正義曰經稱營于桐宫密邇先王知桐是湯葬地也舜放四凶徙之遠裔春秋放其大夫流之他境嫌此亦然故辨之云不知朝政故曰放使之遠離國都往居墓側與彼放逐事同故亦稱放也古者天子居喪三年政事聽於冢宰法當不知朝政而云不知朝政曰放者彼正法三年之内君雖不親政事冢宰猶尚諮稟此則全不知政故爲放也傳戒太甲故以名篇正義曰盤庚仲丁祖乙等皆是發言之人名篇此太甲及沃丁君奭以被告之人名篇史官不同故以爲名有異且伊訓肆命徂后與此三篇及咸有一德皆是伊尹戒太甲不可同名伊訓故隨事立稱以太甲名篇也惟嗣至阿衡正義曰太甲以元年十二月即位比至放桐之時未知几經幾月必是伊尹數諫乆而不順方始放之蓋以三五月矣必是二年放之序言三年復歸者謂即位三年非在桐宮三年也史録其伊尹訓王有伊訓肆命徂后其餘忠規切諫固應多矣太甲終不從之故言不惠于阿衡史爲作書發端故言此爲目也傳阿倚至之訓正義曰古人所讀阿倚同音故阿爲倚也稱上謂之衡故衡爲平也詩毛傳云阿衡伊尹也鄭玄亦云阿倚衡平也伊尹湯倚而取平故以爲官名傳顧謂至天地正義曰說文云顧還視也諟與是古今之字異故變文爲是也言先王每有所行必還迴視是天之明命謂常目在之言其想象如目前終常敬奉天命以承上天下地之神祇也惟尹躬正義曰孫武兵書及吕氏春秋皆云伊尹名摯則尹非名也今自稱尹者蓋湯得之使尹正天下故號曰伊尹人旣呼之爲尹故亦以尹自稱禮法君前臣名不稱名者古人質直不可以後代之禮約之伊尹至有辭正義曰伊尹作書以告太甲不念聞之伊尹乃又言曰先王以昧爽之時思大明其德旣思得其事則坐以待旦明則行之其身旣勤於政又乃旁求俊彦之人置之於位今以開導後人先王之念子孫其憂勤若是嗣王今承其後無得墜失其先祖之命以自覆敗王當愼汝儉約之德今其以儉爲德而謹愼守之惟思爲長丗之謀謀爲政之事譬若以弩射也可準度之機巳張之又當以意往省視矢括當於所度則釋而放之如是而射則無不中矣猶若人君所修政敎欲發命也當以意夙夜思之使當於民心明旦行之則無不當矣王又當敬其身所安止循汝祖之所行若能如此惟我以此喜恱王于萬丗常有善辭言有聲譽亦見歎美無窮也傳爽顯至行之正義曰昭七年左傳云是以有精爽至於神明從爽以至於明是爽謂未大明也昧是晦冥爽是未明謂夜向晨也釋詁云丕大也顯光也光亦明也於夜昧冥之時思欲大明其德旣思得之坐以待旦而行之言先王身之勤也傳旁非至訓戒正義曰旁謂四方求之故言非一方也美士曰彦釋訓文舎人曰國有美士爲人所言道也傳機弩至則中正義曰括謂矢末機張省括則是以射喻也機是轉關故爲弩牙虞訓度也度機者機有法度以準望所射之物準望則解經虞也如射者弩以張訖機關先省矢括與所射之物三省於法度相當乃後釋弦發矢則射必中矣言爲政亦如是也傳未能至不巳正義曰未能變者據在後能變故當時爲未能也時旣未變是不用伊尹之訓也太甲終爲人主非是全不可移但體性輕脫與物推遷雖有心向善而爲之不固伊尹至忠所以進言不巳是伊尹知其可移故誨之不止兾其終從巳也伊尹至丗迷正義曰伊尹以王未變乃告於朝廷羣臣曰此嗣王所行乃是不義之事習行此事乃與性成言爲之不巳將以不義爲性也我不得令王近於不順之事當營於桐墓立宫使比近先王當受人敎訓之無得成其過失使後丗人迷惑怪之傳狎近至怪之正義曰狎習是相近之義故訓爲近也不順即是近不順也習爲不義近於不順則當日日益惡必至滅亡故伊尹言已不得使王近於不順故經營桐墓立宫墓傍令太甲居之不使復知朝政身見廢退必當改悔爲善也傳往入至憂位正義曰亦旣不知朝政之事惟行居喪之禮居憂位謂服治喪禮也伊尹亦使兵士衞之選賢俊敎之政太甲能終信德也太甲中第六惟三至于亳正義曰周制君薨之年屬前君明年始爲新君之元年此殷法君薨之年而新君即位即以其年爲新君之元年惟三𣏌者太甲即位之三年也湯以元年十一月崩至此年十一月爲再朞除喪服也至十二月服闋闋息也如喪服息即吉服舉事貴初始故於十二月朔以冕服奉嗣王歸于亳冕是在首之服冠内之別名冠是首服之大名故傳以冕爲冠案王制云殷人哻而祭大雅云常服黼哻哻是殷之祭冠今云冕者蓋冕爲通名王制又云有虞氏皇而祭夏后氏收而祭殷人哻而祭周人冕而祭並是當代別名殷禮不知天子幾冕周禮天子六冕大裘之冕祭天尚質弁師惟掌五冕備物盡文惟衮冕耳此以冕服蓋以衮冕之服也顧氏云祥禫之制前儒不同案士虞禮云朞而小祥又朞而大祥中月而橝王肅云祥月之内又禫祭服彌寛而變彌數也禮記檀弓云祥而縞是月禫徙月樂王肅云是祥之月而禫橝之明月可以樂矣案此孔傳云二十六月服闋則與王肅同鄭玄以中月爲閒一月云祥後復更有一月而燂則三年之喪凡二十七月與孔爲異傳速召至其身正義曰釋言云速徴也徴召也轉以相訓故速爲召也欲者本之於情縱者放之於外有欲而縱之縱欲爲一也準法謂之度體見謂之禮禮度一也故傳并釋之言已放縱情欲毀敗禮儀法度以召罪於其身也傳孽災至可逃正義曰洪範五行傳有妖孽眚祥漢書五行志說云凡草物之類謂之妖妖猶夭胎言尚微也蟲豸之類謂之孽孽則牙孽矣甚則異物生謂之眚自外來謂之祥是孽爲災初生之名故爲災也逭逃也釋言文樊光云行相避逃謂之逭亦行不相逢也天作災者謂若太戊桑穀生朝髙宗雊雉升鼎耳可修德以禳之是可避也自作災者謂若桀放鳴條紂死宣室是不可逃也據其將來修德可去及其巳至改亦無益天災自作逃否亦同且天災亦由人行而至非是橫加災也此太甲自悔之深故言自作甚於天災耳傳拜手首至手正義曰周禮太祝辨九拜一曰稽首二曰頓首三曰空首鄭玄云稽首拜頭至地也頓首拜頭叩地也空首拜頭至手所謂拜手也鄭惟解此三者拜之形容所以爲異也稽首頭至地頭下至地也頓首頭下至地暫一叩之而巳此言拜手稽首者初爲拜頭至手乃復申頭以至于地至手是爲拜手至地乃爲稽首然則凡爲稽首者皆先爲拜手乃後爲稽首故拜手稽首連言之諸言拜手稽首義皆同也太祝又云四曰振動五曰吉拜六曰凶拜七曰竒拜八曰襃拜九曰肅拜鄭注云振動者戰栗變動而拜吉拜者拜而後稽顙謂齊衰不杖以下者之拜凶拜者稽顙而後拜即三年喪拜也竒拜者謂君荅臣一拜也襃拜者謂再拜拜神與尸也肅拜者謂揖拜也禮介者不拜及婦人之拜也左傳云天子在寡君無所稽首則諸侯於天子稽首也諸侯相於則頓首也君於臣則空手也並其至無罰正義曰言湯昔爲諸侯之時與湯並居其有邦國謂諸侯之國也此諸侯國人其與湯鄰近者皆願以湯爲君乃言曰待我后后來無罰於我言羨慕湯德忻戴之也傳言當至聽德正義曰人之心識所知在於聞見聞見所得在於耳目故欲言人之聦明以視聽爲主視若不見故言惟明明謂監察是非也聽若不聞故言惟聦聦謂識知善惡也視戒見近迷遠故言視遠聽戒背正從邪故言聽德各準其事相配爲文太甲下第七伊尹申誥于王正義曰伊尹以至忠之心喜王改悔重告於王兾王大善一篇皆誥辭也天親克敬民歸有仁神享克誠言天民與神皆歸于善也奉天冝其敬謹養民冝用仁恩事神當以誠信亦準事相配而爲文也傳言安至所法正義曰任賢則興任佞則亡故安危在所任於善則治於惡則亂故治亂在所法揔言治國則稱道單指所行則言事興難而亡易道大而事小故大言興而小言亡也此所云惟言治亂在所法耳下句云終始愼厥與言當與賢不與佞治亂在於用臣故傳於此言安危在所任也惟明明后正義曰重言明明言其爲大明耳傳因文重故言明王明君君王猶是一也愼終于始正義曰欲愼其終於始即須愼之故傳云於始慮終傳以將終戒惰故又云於終思始言終始皆當愼也傳胡何至其正正義曰胡之與何方言之異耳易彖象皆以貞爲正也伊尹此言勸王爲善弗慮弗爲必是善事人君善事惟有道德政敎言不慮何獲是念慮有所得知心所念慮是道德也不爲何成則爲之有所成則知心所念是爲善政也謂天子爲一人者其義有二一則天子自稱一人是爲謙辭言已是人中之一耳一則臣下謂天子爲一人是爲尊稱言天下惟一人而巳傳成功至安之正義曰四時之序成功者退臣旣成功不知退謝其志貪欲無限其君不堪所求或有怨恨之心君懼其謀必生誅殺之計自古以來人臣有功不退者皆喪家滅族者衆矣經稱臣無以寵利居成功者爲之限極以安之也伊尹告君而言及臣事者雖復汎說大理亦見已有退心也咸有一德第八伊尹作咸有一德正義曰太甲旣歸於亳伊尹致仕而退恐太甲德不純一故作此篇以戒之經稱尹躬及湯有一德言已君臣皆有純一之德戒太甲使君臣亦然此主戒太甲而言臣有一德者欲令太甲亦任一德之臣經云任官惟賢材左右惟其人是戒太甲使善用臣也伊尹旣放太甲又迎而復之是伊尹有純一之德已爲太甲所信是已君臣純一欲令太甲法之咸有一德正義曰此篇終始皆言一德之事發首至陳戒于德敘其作戒之由巳下皆戒辭也德者得也内得於心行得其理旣得其理執之必固不爲邪見更致差貳是之謂一德也而凡庸之主監不周物志旣少決性復多疑與智者謀之與愚者敗之則是二三其德不爲一也經云德惟一動罔不吉德二三動罔不凶是不二三則爲一德也又曰終始惟一時乃曰新言守一必須固也太甲新始即政伊尹恐其二三故專以一德爲戒伊尹至于德正義曰自太甲居桐而伊尹秉政太甲旣歸于亳伊尹還政其君將欲告老歸其私邑乃陳言戒王於德以一德戒王也太甲旣得復歸伊尹即應還政其告歸陳戒未知在何年也下云今嗣王新服厥命則是初始即政蓋太甲居亳之後即告老也君奭云在太甲時則有若保衡保衡伊尹也襄二十一年左傳云伊尹放太甲而相之卒無怨色則伊尹又相太甲蓋伊尹此時將欲告歸太甲又留之爲相如成王之留周公不得歸也傳告老至以戒正義曰伊尹湯之上相位爲三公必封爲國君又受邑于畿内告老致政事於君欲歸私邑以自安將離王朝故陳戒以德也無逸云肆祖甲之享國三十三年傳稱祖甲即太甲也殷本紀云太甲崩子沃丁立沃丁序云沃丁旣葬伊尹于亳則伊尹卒在沃丁之丗湯爲諸侯之時巳得伊尹比至沃丁始卒伊尹壽年百有餘歳此告歸之時巳應七十左右也殷本紀云太甲旣立三年伊尹放之於桐宮居桐宫三年悔過反善伊尹乃迎而授之政謂太甲歸亳之歳巳爲即位六年與此經相違馬遷之說妄也紀年云殷仲壬即位居亳其卿士伊尹仲壬崩伊尹乃放太甲於桐而自立也伊尹即位於太甲七年太甲濳出自桐殺伊尹乃立其子伊陟伊奮命復其父之旧宅而中分之案此經序伊尹奉太甲歸于亳其文甚明左傳又稱伊尹放太甲而相之孟子云有伊尹之志則可無伊尹之志則篡伊尹不肯自立太甲不殺伊尹也必若伊尹放君自立太甲起而殺之則伊尹死有餘罪義當汙宫滅族太甲何所感德而復立其子還其田宅乎紀年之書晉太康八年汲郡民發魏安僖王塚得之蓋當時流俗有此妄說故其書因記之耳九有以亡正義曰毛詩傳云九有九州也此傳云九有諸侯謂九州所有之諸侯伊尹此言汎說大理未指夏桀但傳顧下文比桀爲此言之驗故云桀不能常其德湯伐而兼之傳享當至天命正義曰德當神意神乃享之故以享爲當也天道遠而人道近天之命人非有言辭文誥正以神明佑之使之所征無敵謂之受天命也緯候之書乃稱有黃龍玄龜白魚赤雀負圖銜書以授聖人正典無其事也漢自哀平之閒緯候始起假託鬼神妄稱祥瑞孔時未有其說縱使時巳有之亦非孔所信也惟吉至在德正義曰指其巳然則爲吉凶言其徴兆則曰災祥其事不甚異也吉凶巳成之事指人言之故曰在人災祥未至之徴行之所招故言在德在德謂爲德有一與不一在人謂人行有善與不善也吉凶巳在其身故不言來處災祥自外而至故言天降其實吉凶亦天降也今嗣王至惟一正義曰上旣言在德此指戒嗣王今新始服其王命惟當新其所行之德所云新者終始所行惟常如一無有衰殺之時是乃日新也王旣身行一德臣亦當然任人爲官惟用其賢材輔弼左右惟當用其忠良之人乃可爲左右耳此任官左右即王之臣也臣之爲用所施多矣何者言臣之助爲在上當施爲道德身爲臣下當須助爲於民也臣之旣當爲君又須爲民故不可任非其才用非其人此臣之所職其事甚難無得以爲易其事須愼無得輕忽爲臣之難如此惟當衆臣和順惟當共秉一心以此事君然後政乃善耳言君臣冝皆有一德傳其命至勿怠正義曰說命云王言惟作命成十八年左傳云人之求君使出命也是言人君職在發命新服厥命新始服行王命故云其命王命也新其德者勤行其事日日益新戒王勿懈怠也傳言德至之義正義曰日新者日日益新也若今日勤而明日惰昨日是而今日非自旁觀之則有新有舊言王德行終始皆同不有衰殺從旁觀之每日益新是乃日新之義也傳官賢至其人正義曰任官謂任人以官故云官賢才而任之言官用賢才而委任之詩序云任賢使能非賢才不可任也冏命云小大之臣咸懷忠良故言選左右必忠良不忠良即是非其人任官是用人爲官左右亦是任而用之故言選左右也直言其人人字不見故據冏命之文以忠良充之傳言臣至其人正義曰言臣奉上布德者奉上謂奉爲在上解經爲上也布德者謂布爲道德解經爲德也順下訓民者順下謂卑順以爲臣下解經爲下也訓民者謂以善道訓助下民解經爲民也顧氏亦同此解傳其難至乃善正義曰此經申上臣事旣所爲如此其難無以爲易其愼無以輕忽之戒臣無得輕易臣之職也旣事不可輕冝和協奉上羣臣當一心以事君如此政乃善耳一心即一德言臣亦當一德也嗚呼至觀政正義曰此又勸王脩德以立後丗之名禮王者祖有功宗有德雖七丗之外其廟不毀嗚呼七丗之廟其外則猶有不毀者可以觀知其有明德也立德在於爲政萬夫之長能使其整齊可以觀知其善政也萬夫之長尚爾況天子乎勸王使爲善政也立七廟王者常禮非獨周人始有七廟也文武則爲祖宗不在昭穆之數王制之文不得云三昭三穆也劉歆馬融王肅雖則不見古文皆以七廟爲天子常禮所言二祧者王肅以爲髙祖之父及祖也并髙祖巳下共爲三昭三穆耳喪服小記云王者禘其祖之所自出以其祖配之而立四廟庶子王亦如之所以不同者王肅等以爲受命之王是初基之王故立四廟庶子王者謂庶子之後自外繼立雖承正統之後自更別立已之髙祖巳下之廟猶若漢宣帝別立戾太子悼皇考廟之類也或可庶子初基爲王亦得與嫡子同正立四廟也無自至厥功正義曰旣言君民相須又戒王虚心待物凡爲人主無得自爲廣大以狹小前人勿自以所知爲大謂彼所知爲小若謂彼狹小必待之輕薄彼知遇薄則意不自盡匹夫匹婦不得自盡其意則在下不肯親上在上不得下情如是則人主無與成其功也沃丁至作沃丁正義曰沃丁殷王名也沃丁旣葬伊尹言重其賢德備禮而葬之咎單以沃丁愛慕伊尹遂訓暢伊尹之事以告沃丁史録其事作沃丁之篇傳沃丁至禮葬正義曰丗本本紀皆云太甲崩子沃丁立是爲太甲子也伊尹本是三公上篇言其告歸知致仕老終以三公禮葬皇甫謐云沃丁八年伊尹卒卒年百有餘歳大霧三日沃丁葬之以天子禮葬祀以太牢親臨喪以報大德晉文請隧襄王不許沃丁不當以天子之禮葬伊尹也孔言三公禮葬未必有又要情事當然也伊陟至四篇正義曰伊陟輔相太戊於亳都之内有不善之祥桑穀二木共生于朝朝非生木之處是爲不善之徴伊陟以此桑穀之事告于巫咸史録其事作咸乂四篇乂訓治也言所以致妖須治理之故名篇爲咸乂也伊陟不先告太戊而告巫咸者君奭云在太戊時則有若巫咸乂王家則咸是賢臣能治王事大臣見怪而懼先共議論而後以告君下篇序云大戊賛于伊陟明先告於巫咸而後告太戊傳伊陟至之子正義曰伊陟伊尹子相傳爲然殷本紀云沃丁崩弟太庚立崩子小甲立崩弟雍巳立崩弟太戊立是太戊爲小甲弟太庚之子傳祥妖至之罰正義曰漢書五行志云凡草物之類謂之妖自外來謂之祥祥是惡事先見之徴故爲妖怪也二木合生謂共處生也七日大拱伏生書傳有其文或當別出餘書則孔用之也鄭玄注書傳云兩手搤之曰拱生七日而見其大滿兩手也殷本紀云一暮大拱言一夜即滿拱所聞不同故說異也五行傳曰貌之不恭是謂不肅時則有靑眚靑祥漢書五行志夏侯始昌劉向等說云肅敬也内曰恭外曰敬人君行已體貌不恭怠慢驕蹇則不能敬木色靑故有靑眚靑祥是言木之變怪是貌不恭之罰人君貌不恭天將罰之木怪見其徴也皇甫謐云太戊問於伊陟伊陟曰臣聞妖不勝德帝之政事有闕白帝修德太戊退而占之曰桑穀野木而不合生於朝意者朝亡乎太戊懼修先王之政明養老之禮三年而遠方重譯而至七十六國是言妖不勝德也傳賛告至臣名正義曰禮有賛者皆以言告人故賛爲告也君奭傳曰巫氏也當以巫爲氏名咸此言臣名者言是臣之名號也鄭玄云巫咸謂之巫官者案君奭咸子又稱賢父子並爲大臣必不丗作巫官故孔言巫氏是也太戊至原命正義曰言太戊賛於伊陟惟告伊陟不告原也史録其事而作伊陟原命二篇則太戊告伊陟亦告原俱以桑穀事告故序揔以爲文也原是臣名而云原命謂以言命原故以原命名篇猶如冏命畢命也仲丁遷于嚻正義曰此三篇皆是遷都之事俱以君名名篇並陳遷都之義如盤庚之誥民也發其舊都謂之遷到彼新邑謂之居遷于嚻與居相亦事同也以河亶甲三字句長不言于其實亦是居于相也圯于耿者孔意以爲毀于相地乃遷于耿地其篇蓋言毀意故序特言圯也李顒云嚻在陳留浚儀縣皇甫謐云仲丁自亳徙嚻在河北也或曰今河南敖倉二說未知孰是也相地孔云在河北蓋有文而知也謐又以耿在河東皮氏縣耿郷是也傳大戊至地名正義曰此及下傳言仲丁是太戊之子河亶甲仲丁弟也祖乙河亶甲子皆丗本支也仲丁是太戊之子太戊之時仍云亳有祥知仲丁遷于嚻去亳也傳亶甲至曰圯正義曰孔以河亶甲居相祖乙即亶甲之子故以爲圯於相地乃遷都于耿釋詁云圯毀也故云河水所毀曰圯據文圮于耿也知非圯毀于耿更遷餘處必云圯於相地遷於耿者明與其上文連上云遷于嚻謂遷來向嚻居於相謂居於相地故知北于耿謂遷來于耿以文相類故孔爲此解謂古人之言雖尚要約皆使言足其文令人曉解若圯於相遷居於耿經言圯於耿太不辭乎且亶甲居於相祖乙居耿今爲水所毀更遷他處故言毀于耿耳非旣毀乃遷耿也盤庚云不常厥邑于今五邦及其數之惟有亳嚻相耿四處而巳知此旣毀於耿更遷一處盤庚又自彼處而遷於殷耳殷本紀云祖乙遷於邢馬遷所爲說耳鄭玄云祖乙又去相居耿而國爲水所毀於是修德以禦之不復徙也録此篇者善其國圯毀改政而不徙如鄭所言稍爲文便但上有仲丁亶甲下有盤庚皆爲遷事作書述其遷意此若毀而不遷序當改文見義不應文類遷居更以不遷爲義汲冢占文云盤庚自奄遷于殷者蓋祖乙圯於耿遷於奄盤庚自奄遷於殷亳嚻相耿與此奄五邦者此蓋不經之書未可依信也尚書正義卷第八計一萬五千五百四字
