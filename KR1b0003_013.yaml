body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰周書康誥第十一酒誥第十二梓材第十三康誥第十一成王至梓材正義曰既伐叛人三監之管叔蔡叔等以殷餘民國康叔為衛侯周公以王命戒之作康誥酒誥梓材三篇之書也其酒誥梓材亦戒康叔但因事而分之然康誥戒以德刑又以化紂嗜酒故次以酒誥卒若梓人之治材為器為善政以結之傳以三至主之正義曰此序亦與上相顧為首引初言三監叛又言黜殷命此云既伐管叔蔡叔言以殷餘民圻內之餘民故云以三監之國康叔為衛侯然古字邦封同故漢有上邦下邦縣邦字如封字此亦云邦康叔若分器序云邦諸侯故云國康叔并以三監之地封之者周公懲其數叛故使賢母弟主之此始一叛而云數叛者以六州之衆悉來歸周殷之頑民叛逆天命至今又叛據周言之故云數叛故多方云爾乃不大宅天命爾乃屑播天命以不從天命故云叛也古者大國不過百里周禮上公五百里侯四百里孟軻有所不信費誓注云伯禽率七百里之內附庸諸侯則魯猶非七百里之封而康叔封千里者康叔時為方伯殷之圻內諸侯並屬之故得揔言三監且其實地不方平計亦不能大於魯也故左傳云宋衛吾匹也又曰寡君未嘗後衛君且言千里亦大率言之耳何者邢在襄國河內即東圻之限故以賜諸侯西山即有黎潞河濟之西以曹地約有千里也以此鄭云初封於衛至子孫而并鄁鄘也其地理志鄁鄘之民皆遷分衛民於鄁鄘故異國而同風所以詩分為三孔與同否未明也既三年滅三監七年始封康叔則於其間更遣人錢守自不知名號耳傳命康至封字正義曰以定四年左傳祝他云命以康誥故以為命康叔之誥知康圻內國名者以管蔡郕霍皆國名則康亦國名而在圻內馬王亦然惟鄭玄以康為諡號以史記丗家云生康伯故也則孔以康伯為號諡而康叔之康猶為國而號諡不見耳惟三至誥治正義曰言惟以周公攝政七年之三月始明死而生魄月十六日已未於時周公初造基趾作新大邑於東國洛水之汭四方之民大和恱而集會言政治也此所集之民即侯甸男采衛五服百官播率其民和恱並見即事於周之東國而周公皆慰勞勸勉之乃因大封命以康叔為衛侯大誥以治道傳周公至魄生正義曰知周公攝政七年之三月者以洛誥即七年反政而言新邑營及獻卜之事與召誥參同俱為七年此亦言作新邑又同召誥故知七年三月也若然書傳云四年建衛侯而封康叔五年營成洛邑六年制禮作樂明堂位云昔者周公朝諸侯于明堂之位即云頒度量而天下大服又云六年制禮作樂是六年巳有明堂在洛邑而朝諸侯言六年巳作洛邑而有明堂者禮記後儒所録書傳伏生所造皆孔所不用始生魄月十六日戊午社于新邑之明日魄與明反故云明消而魄生傳𥘉造至集會正義曰所以初基東國洛者以天下土中故也其召誥與大司徒文之所出釋言云集會也以主治民故民服恱而見太平也初基者謂初始營建基趾作此新邑此史揔序言之鄭以為此時未作新邑而以基為謀大不辭矣傳此五至於周正義曰男下獨有邦以五服男居其中故舉中則五服皆有邦可知言邦見其國君焉以大司馬職大行人故知五服服五百里禹貢五服通王畿此在畿外去王城五百里故每畿計之至衛服三千里言與禹貢異制也通王畿與不通為異以此計畿之均故須土中若然黃帝與帝嚳居偃師餘非土中者自由當時之冝實在土中因得而美善之也不見要服者鄭云以遠於役事而恆闕焉君行必有臣從即卿大夫及士見亦主其勞故云五服之內百官播率其民和悅即事以土功勞事民之所苦也而此和恱見太平也而書傳云示之以力役其且猶至況導之以禮樂乎是也傳周公至治道正義曰太保以戊申至七日庚戌巳云庶殷攻位於洛汭則庶殷先與之期于前至也周公以十二日乙卯朝至于洛則達觀于新邑營此日當勉其民此因命而并言之序云邦康叔洪大也為大封命大誥康叔以治道也鄭玄以洪為代言周公代成王誥何故代誥而反誥王呼之曰孟侯為不辭矣王若至東土正義曰言周公稱成王命順康叔之德而言曰命汝為孟侯王又使我教命其弟小子封其所教命者惟汝大明德之父文王能顯用俊德愼去刑罰以為教首故惠恤窮民不侮慢鰥夫寡婦況貴強乎其明德用可用敬可敬其愼罰威可威者顯此道以示民用此道故始為政於我區域諸夏由是於我一二諸國皆以修治也上政既修我西上惟是怙恃文王之道故其政教冒被四表聞于上天天美其治道以此上天乃大命文王以誅殺之道用兵除惡于殷大受其王命三分天下而有其二也其所受二分者於其國於其民惟是皆有次敘以文王之教故也汝寡有之兄武王勉行文王之道故受命克殷今汝小子封故得在此東土為諸侯是文王之道明德愼罰既用受命武王無所復加以為勉行所以汝必法之傳周公至教訓正義曰以曰者為命辭故曰周公稱成王命順康叔之德命為孟侯孟長也五侯之長謂方伯使康叔為之長者即州牧也五侯之長五等諸侯之長也而左傳云五侯九伯汝實征之彼謂上公之伯故征九伯而此五侯當州牧之五侯與彼不同王制有連屬卒伯也孔以五侯亦方伯則四方者皆可為方伯而此方伯自是州牧也康叔以母弟令德受大國封命固非卒及連屬也虞夏及周既有牧又離騷云伯昌作牧殷亦有牧伯四代皆通也非如鄭玄云殷之州長曰伯以稱小子為幼弱故明當受教訓故云使我命其弟為親親而使我用戒故也此指命康叔為之而鄭以揔告諸侯依略説以太子十八為孟侯而呼成王既禮制無文義理駢曲豈周公自許天子以王為孟侯皆不可信也傳惟汝至教首正義曰以近而可法不過子之法父故舉文王也法者不過除惡行善故云明德愼罰也傳惠恤至示民正義曰用可用敬可敬即明德也用可用謂小德小官敬可敬謂大德大官刑可刑謂愼罰也傳天美至武王正義曰天美文王乃大命之殺兵殷者殪殺也戎兵也用誅殺之道以兵患殷文王以伐殷事未卒而言殺兵殷者謂三分有二為滅殷之資也王曰嗚呼封汝至王命正義曰既言文王明德愼罰之訓武王尚行之汝既得為君方別陳明德之事故稱王命而言曰嗚呼封汝常念我所以告汝之言哉今治民所行將在敬循汝文德之父繼其所聞者服行其德言以為政教汝往之國當分布求於殷先智王之道用安治民不但法其先君汝又當須大遠求商家耇老成人之道居之於心即知訓民矣其外又更當別求所聞父兄用古先智王之道用其安者以安民即古虞夏之道也人事既然又闡大於天之道而為順德又加之寬容則汝身不見廢常在王命傳今治至政教正義曰繼其所聞服行其德言者謂文王先有所聞善事今令康叔繼續其文王所聞善事被服而施行其德言以為政教也傳汝當至訓民正義曰上云敷求殷先哲王謂求殷之賢君此言求商家耇老成人謂求殷之賢臣大遠者備遍求之傳又當至安民正義曰以父兄乃所居殷外故云別求上只言遹乃文考并言兄者以上云寡兄朂則以文武道同言文可以兼武故并言父兄也古先哲王鄭云虞夏也孔亦當然以上代與今事遠不可以同故言用其安者傳大于至王命正義曰以天道人用而光大之故因云大也其文王及殷古先哲王與天其道不異以前後聖迹雖殊同天不二也以康叔亞聖大賢治殷餘惡故使之用天道為順德也王曰嗚呼小至新民正義曰所明而云行天人之德者其要在於治民故言王曰嗚呼小子封治民為善而除惡政當如痛病在汝身欲去之敬行我言哉所以去惡政者以天德可畏者以其輔誠故也以民情大率可見所以可見者以小人難安也安之既難其往治之當盡汝心為政無自安好逸豫而寬縱乃其可以治民我聞古遺言曰人之怨不在事大或由小事而起雖由小事而起亦不恆在事小因小至大是為民所怨事不可為當使施順令不順者順勉力勸行令不勉者勉則其怨小大都消令汝消怨者已乎汝惟小子乃當服行政德惟弘大王道上以應天下以安我所受殷民不但汝身所當行此亦惟助王者居順天命為民日新之教傳恫痛至我言正義曰恫聲類於痛故恫為痛也􅘃病釋詁文以痛病在汝身以述治民故務除惡政如己病也戒之而言敬故知敬行我言也鄭玄云刑罰及己為痛病其義不及去惡若己病也傳天德至難安正義曰人情所以大可見者以小人難安為可見故須安之傳不在至者勉正義曰以致怨恐謂由大惡故云不在大起於小言怨由小事起不在小者謂為怨不恆在小言其初小漸至於大怨故使不順者順不勉者勉其怨自消也傳弘王至之教正義曰亦所以惟助王者言非直康叔身行有益亦惟助王者居順天命為民日新之教謂漸致太平政教日日益新也王曰嗚呼封敬至可殺正義曰以上既言明德之理故此又云愼罰之義而王言曰嗚呼封又當敬明汝所行刑罰須明其犯意人有小罪非過誤為之乃惟終身自為不常之行用犯汝如此者有其罪小乃不可不殺以故犯而不可赦若人乃有大罪非終行之乃惟過誤為之以此故當盡斷獄之道以窮極其罪是人所犯乃不可以殺當以罰宥論之以誤故也即原心定罪斷獄之本所以須敬明之也王曰嗚呼封有至刵人正義曰以刑者政之助不得已即用之非情好殺害故又本於政不可以濫刑而王言曰嗚呼封欲正刑之本要而汝政教有次敘是乃治理大明則民服惟民既服從化其自勑正勉力而平和然政之化惡為善若有病而欲去之治之以理則惟民其盡棄惡而修善言愛養人若母之安赤子惟民為善其皆安治為政保民之如此不可行以淫刑豈非汝封得刑人殺人乎言得刑殺不可以得故而有濫刑人殺人無辜也非汝封又曰劓刵人無以得故而有所濫劓刵人之無罪者也傳化惡至修善正義曰人之有疾治之以理則疾去人之有惡化之以道則惡除傳愛養至安治正義曰既去惡乃須愛養之為善人為上養則化所行故言其皆安治子生赤色故言赤子傳劓截至得行正義曰以國君故得專刑殺於國中而不可濫其刑即墨劓剕宫也劓在五刑為截鼻而有刵者周官五刑所無而吕刑亦云劓刵易噬嗑上九云何校滅耳鄭玄以臣從君坐之刑孔意然否未明要有刵而不在五刑之類言又曰者周公述康叔豈非汝封又自言曰得劓刵人此又曰者述康叔之又曰王曰外事至要囚正義曰言不濫刑不但國內而王言曰若外土諸侯奉王事以至汝汝當布陳是刑法以司牧其衆及此殷家刑罰有倫理者兼用之周公又重言曰既用刑法要察囚情得其要辭以斷其獄當須服膺思念之五日六日次至於十日遠至於三月一時乃大斷囚之要辭言必反覆重之如此乃得無濫故耳傳言外至用之正義曰外土以獄事上於州牧之官為奉王事汝當用刑書為布陳是刑法為司牧其衆故受而聽之既衛居殷墟又周承於殷後刑書相因故兼用其有理者謂當時刑書或無正條而殷有故事可兼用若今律無條求故事之比也臬為準限之義故為法也傳要囚至之至正義曰言要囚明取要辭於囚以思訖事定故言乃大斷之多至三月故云反覆思念重刑之至顧氏云又曰者周公重言之也王曰汝至乃知正義曰此又申上既要囚思念定其大斷若為而王言曰汝當陳是刑書之法以行事其刑法斷獄用殷家所行常法故事其陳法殷彞皆用其合冝者以刑殺勿用以就汝封意之所安而自行也以用心不如依法故耳言汝不但依法乃使汝所行盡順曰是有次敘猶當自惟曰未有順事其有餘若不足故耳必期汝於大幸已乎汝惟小子耳而他人未其有若汝封之心言汝心最善汝心既善我心我德惟汝所委知也傳陳是至故事正義曰陳是法事即上汝陳時臬事罰蔽殷彞即上殷罰有倫上據有初思念得失此據臨時行事也傳巳乎至款心正義曰此言我我王也以王命故言王為我以康叔為已若汝不善我王家心德汝所不知則我不順命汝款曲之心只由汝最善我王心德汝所偏知故我王命汝以款曲之心述康叔為言故云已欲令康叔明識此意也凡民至弗憝正義曰言人所愼刑者以凡民所用得罪者寇盜攘竊於外姦內宄而殺害及顚越於人以取貨利也自強為之而不畏死此為人無不惡之者以此須刑絶之故當愼刑罰耳傳凡民至貨利正義曰自用也言所用得罪者由冦攘也而為之於外內既有劫竊其劫竊皆有殺有傷越人謂不死而傷皆為之而取貨利故也傳暋強至絶之正義曰暋強也於盤庚巳訓而此重詳之以由此得罪當須絶之王曰封元至無赦正義曰以是所用得其罪不但寇盜王命而言曰封非於骨肉之人為大惡猶尚為人所大惡之況惟不孝父母不友兄弟者乎其罪莫大於不孝也何者為人之子不能敬身服行其父事而怠忽其業大傷其父心是不孝也於為人父不能字愛其子乃疾惡其子是不慈也於為人弟不能念天之明道故乃不能恭事其兄是不恭也為人兄亦不能念稚子之可哀哉大不友愛於弟是不友也惟人所行以至此不孝不友者豈不由我執政之人道教不至以得此罪乎既人罪由教而致天惟與我民以五常之性使有恭孝廢棄不行是大滅亂天道也以由我滅亂曰乃其疾用文王所作違教之罰刑此亂五常者不可赦放也傳大惡至不友正義曰言將有作姦宄大惡猶為人所大惡況不孝父母不善兄弟者乎孝經云五刑之屬三千而罪莫大於不孝是也釋親云善父母為孝善兄弟為友下文不言母母同於父父子尊卑而異等故孝名上不通於下其兄弟雖有長幼而同倫故共友名也傳為人至不孝正義曰考亦通生死即此文及酒誥是也下曲禮云死曰考是對例耳人子以述成父事為孝怠忽其業即其肯曰我有後不棄基故為大傷父心即是上不孝也則子不述父事當輕於盜殺況以為甚者此聖人緣心立法人莫不緣身本於父母也自親以及物天然之理故孝經曰不愛其親而愛他人者謂之悖德不敬其親而敬他人者謂之悖禮以順則逆民無則焉不在於善而皆在於凶德是也以此言賊殺他人罪小於骨肉相乖阻但於他人言其極者於親言其小者小則有不和詈爭鬪訟相傷者也於親小則傷心大乃逆命驅罵殺害互相發起而可知也傳於為至不慈正義曰上文不言不慈意以不孝為揔焉父當言義而云不慈者以父母於子并為慈因父有愛敬多少而分之言父義母慈而由慈以義故雖義言不慈且見父兼母耳傳於為至不恭正義曰善兄弟曰友此言不恭者友思念之辭兄弟同倫故俱言友雖同倫而有長幼其心友而貌恭故因兄弟而分友文為二而言恭也五教即左傳文十八年史克言也於此言天之明道者父子天性不嫌非天明故於兄弟言之因上先言不孝先言子於父故此不友先言弟於兄若舉中以見上下故此言天明見五教皆是即孝經云則天之明左傳云為父子兄弟姻媾以象天明是於天理常然為天明白之道傳為人至不友正義曰言亦者以兄弟同等而相亦所謂周書云父子兄弟罪不相及即此文也不孝罪子非及於父之輩理所當然而周官鄰保以比伍相及而趙商疑而發問鄭答云周禮太平制此為居殷亂而言斯不然矣康誥所云以骨肉之親得相容隱故左傳云父子兄弟罪不相及周禮所云據踈人相督率之法故相連獲罪故今之律今大功巳上得相容隱鄰保罪有相及是也不率至以懌正義曰言滅五常之害當除凡民不循大道五常之教猶刑之況在外土掌庶子之官主於訓民惟其正官之人及於小臣諸有符節者並為教首其心不循大常豈可赦也以人之須有五常汝今往之國乃當分別播布德教以立民大善之譽若不念我言不用我法即病其為君之道是汝長為惡矣以此惟我亦惡汝也己乎既惡不可為汝乃其疾用此典刑冝於時丗者循理以刑殺亂常者則亦惟為人君惟為人長之正道既為人君長不能治其五教施於家人之道則於其卑小臣外上正官之吏惟為威暴惟為酷虐大放棄王命矣如是乃由汝非以道德用治之故由此汝亦無得不能敬其常事汝用寬民之道當思惟念用文王之所敬畏而法之汝以此行寬民之政曰我願惟有及於古則我一人天子以此恱懌汝德矣汝惟冝勤之傳戛常至犯乎正義曰戛猶楷也言為楷模之常故戛為常也述上凡民自得罪故言凡民不循大常之教也猶刑之即上云刑茲無赦故也亦愚以況智故言況在外掌衆子之官主訓民者而親犯乎即周官云諸子文王丗子云庶子也以致教諸子故為訓人周禮諸子之官亦是王朝之臣言在外者對父子兄弟為外惟舉庶子之官者以其教訓公卿子弟最為急故也鄭玄以訓人為師長亦各一家之道也傳惟其至之科正義曰正官之人若周官三百六十職正官之首於小臣諸有符節者謂正人之下非長官之身下至符吏諸有符節為教人之故故言有符節者非要行道之符節若為官行文書而有符今之印者也以上況之故言不循大常亦在無赦之科矣在軍者有旌節亦得為有符節耳傳汝今至惡汝正義曰言分別播布德教謂分遣卿大夫為之教民使善而巳有善譽是立民以大善之譽傳汝乃至正道正義曰此用冝於時以刑殺上不循五常之道者其君長對則大夫為長散則人君為長君而居之是君亦與長為一孝經對例以長為大夫耳傳為人至之故正義曰以五常父母兄弟子即家人之道易有家人卦亦與此同也不行五教為不能治家人之道家人不治則君不明君既不明則不察下故則於其小臣外正官之吏並為威虐大放棄王命非德用治是不明為非德也傳常事至法之正義曰常事常所行之事也人見尋常不為異故輕之而以為戒文王所敬忌即敬德忌刑鄭云祇祇威威是也傳汝行至汝德正義曰寬則得衆故五教在寬上既言乃由𥙿民此又疊之汝行寬民之政曰我惟有及於古即古賢諸侯汝惡我則惡之汝善我則愛之以此我一人悅懌汝德也王曰封爽至厥邦正義曰既言德刑事終而揔言之我所以令汝明德愼罰以施政者王命所以言曰封為人君當明惟為治民之道而善安之故我以是須汝善安民故我其惟念殷先智聖王之德用安治民為求而等之我於民未治之時尚求等殷先智王況今民無道不之而易化汝若不以道訓之則無善政在其國所以須安民以德刑也傳明惟至安之正義曰以愼德刑為明治民之道教之五常為善富而不擾為安也鄭以迪為下讀各為一通也傳治民至其國正義曰以已喻康叔言我未治之時乃欲求等殷先智王以致太平者況今民無道不之言易從教不以正道訓民民則不知道故無善政在其國為無吉康也王曰封豫至于天正義曰以汝須善政在國令我民安當為政以愼德刑為教故王又命之曰封我惟不可不視古義告汝施德之説於罰之所行欲其勤德愼刑也假令惟天下民不安未定其心於周教道屢數而未和同明惟天其以民不安其罰誅我我其不怨於天則汝不治是其罪我罰汝汝亦不可怨我我以民之不安惟其罰之無在大邑無在多民以少猶誅罰況曰為君不愼德刑其上明聞於天是為罪大不可赦傳我惟至愼刑正義曰以敷求殷先哲王及別求古先哲王為已視古義也德由説而罰須行故德之言説而罰言行也以事終而結上故云德刑也傳假令至之言正義曰天下不安為揔説所以不安猶未定其心於周道屢數而未和同也時巳大和會故言假令設不和同事言耳傳明惟至怨我正義曰顧氏云明惟天者言天明察在上見民不安乃以刑罰誅戮於我傳民之至罪大正義曰此揔德刑而直云不愼罰者政以德為主不嫌不明政失由於濫刑故舉罰以言之下言無作怨以失罰為罪大王曰嗚呼封至瑕殄正義曰以罰不可失故王命言曰嗚呼封當修已以敬哉無為可怨之事勿用非善謀非常法而以決斷行是誠信之道大當法為機敏之德用是信敏安汝心顧省汝德廣遠汝謀能行寬政乃以民安則我不於汝罪過而絶亡汝傳斷行至有功正義曰以誠在於心故決斷行之亦心誠而行敏為見事之速事有善而須德法故云大法敏德也正以此二者以信則人任焉敏則有功故也論語文傳用是至長久正義曰上文有忱有敏此惟云用是誠道不云敏者敏在誠下亦用之可知王曰嗚呼肆至乂民正義曰與上相首引王命言曰嗚呼以民安則不汝絶亡之故汝小子封當念天命之不於常也汝行善則得之行惡則失之汝念此無常哉無絶棄我言而不念若享有國土當明汝服行之教令使可法髙大汝所聽用先王道德之言以安治民也傳享有至可則正義曰以不瑕殄即享有國土也服行之命謂德刑也王若至丗享正義曰以須髙聽治民故王命順其德而言曰汝往之國哉封乎勿廢所冝敬之常法即聽用我誥是也汝如此則汝乃得以殷民丗丗享國而言不絶國祚短長由德也又言王若曰者一篇終始言之明於中亦有若也酒誥第十二傳康叔至酒誥正義曰以梓材云若茲監故云康叔監殷民也鄭以為連屬之監則為牧而言然康叔時實為牧而所戒為居殷墟化紂餘民不主於牧下篇云監監亦指為君言之也明監即國君監一國故此言監殷民不言監一州若大宰之建牧立監也王若至惟辜正義曰周公以王命誥康叔順其事而言曰汝當明施大教命於妹國而戒之以酒所以須戒酒者以汝父於廟次穆考文王始國在西土岐周為政也其誥愼所職衆國衆士於少正官御治事吏朝夕勑之曰惟祭祀而用此酒不常為飲也所以不常為飲者以惟天之下教命始令我民知作酒者惟為大祭祀故以酒為祭不主飲故天下威罰於我民用使之大為亂以喪其德亦無非以酒為行而用之故於小大之國用使之喪亡亦無非以酒為罪以此衆事少正皆須戒酒也是文王以酒為重戒汝不可不法也傳周公至北是正義曰此為下之目故言明施大教命於妹國此妹與沫一也故沫為地名紂所都朝歌以北但妹為朝歌之所居也朝歌近妹邑之南故云以北是詩又云沫之東矣沫之鄉矣即東與北為鄉也妹屬鄘紂所都在妹又在北與東是地不方平偏在鄘多故也馬鄭王本以文涉三家而有成字鄭玄云成王所言成道之王三家云王年長骨節成立皆為妄也傳父昭至之政正義曰以穆連考故以昭穆言之文王廟次為穆以周自后稷以至文王十五丗案丗本云后稷生下窋為昭不窋生鞠陶為傳惟天至祭祀正義曰丗本云儀狄造酒夏禹之臣又云杜康造酒則人自意所為言天下教命者以天非人不因人為者亦天之所使故凡造立皆云本之天元祀者言酒惟用於大祭祀見戒酒之深也顧氏云元大也洛誥稱秩元祀孔以為舉秩大祀大劉以元為始誤也傳天下至亂行正義曰民自飲酒致亂以被威罰言天下威者亦如上言天之下教命令民作酒也為亂而罪天理當然故曰天討有罪五刑五用哉俗本云不為亂行定本云亦為亂行俗本誤也傳於小至為罪正義曰小大之國謂諸侯之國有小大也上言民用大亂指其身為罪此言邦用喪言其邦國喪滅上文揔謂貴賤之人此則專指諸侯之身故也惟行用酒惟罪身得罪亦互相通也文王至惟一正義曰前文王戒酒以為所供當重飲之則有滅亡之害此更戒之令以德自將不可常飲故又云文王誥教其民之小子與正官之下有職事之人謂羣吏汝等無得常飲酒也於所治衆國之君臣民衆等言飲酒惟當因祭祀以德自將無今至醉又自申文王之教小子者不但身自教之又化民使自教其子弟惟教其民曰惟我民等當教道子孫小子令土地所生之物皆愛惜之則其心善矣以愛物則不為酒而損耗故也既父祖稟文王之教以化其子孫而子孫能聰審聽用祖考之常訓言愛物以戒酒也不但民之小子為然其於小大德之士大夫等亦皆能念行文王之德以教其子孫故子孫亦聰聽之小子惟皆專一而戒其酒其民及在位不問貴賤子孫皆化則至成長為德可知也傳小子至飲酒正義曰知小子謂民之子孫者以下文云我民迪小子又云奔走事厥考厥長故知小子謂民之子孫也知有正有事非士大夫而云正官治事謂下羣吏者以文與小子相連故知是正官下治事之羣吏傳於所至至醉正義曰以述上文內外雙舉此為小子及民與士大夫可知其外冝有國君故下云指戒康叔為國之事故揔言衆國惟於祭祀得飲酒猶以德自將無令至醉大傳因此言宗室將有事族人皆入侍得有醉與不醉而出與不出之事而以德自將無令至醉亦一隅之驗文王為諸侯而云衆國者文王為西伯又三分有二諸侯故得戒衆國也傳文王至心善正義曰以惟曰為教辭故言文王化我民愛惜土物而不損耗則不嗜酒故心善妹土至王家正義曰既上言文王之教今指戒康叔之身實如汝當法文王斷酒之法故今往當使妹土之人繼爾股肱之教為純一之行其當勤於耕種黍稷奔馳趨走供事其父與兄其農功既畢始牽車牛遠行賈賣用其所得珍異孝養其父母父母以子如此善子之行子乃自洗潔謹敬厚致用酒以養此亦小子土物愛也又謂汝衆士有正之人及於衆伯君子長官大夫統衆士有正者其汝亦常聽用我斷酒之教勿違犯也汝康叔大能進行老成人之道則惟可為君矣如此汝乃為飲食醉飽之道由須進行老成人故我大惟教汝曰汝能長觀省古道所為考行中正之德即是進行老成人惟堪為君能考中德則汝庶幾能進饋祀於祖考矣以能進饋祀人神所助則汝乃能自大用逸之道如此用逸則乃信惟王正事之大臣不但正事大臣如此亦惟天順其大德而佑助之長不見遺忘在王家矣可不務乎傳今往至父兄正義曰以妹土為所封之都故言今往繼汝股肱之教者君為元首臣作股肱君倡臣行施由股肱故言繼其教也言奔走者顧氏云勤種黍稷奔馳趨走也傳農功至父母正義曰若當農功則有所廢故知既畢乃行故云始牽車牛即牽將大車載有易無遠求盈利所得珍異而本不損故可孝養其父母亦愛土物之義也傳其父至酒養正義曰以人父母欲家生之冨者若非盈利雖得其養有喪家資則父母所不善今勤商得利冨而得養所以善子之行也傳衆伯至違犯正義曰衆伯君子統衆士有正者經云庶士有正者戒其愼酒從卑至尊故先教子孫乃及庶士衆伯君子傳汝大至君義正義曰釋詁云羞進也既以愼酒立教是大能進行老成人之道是惟可為人君矣以人君若治不得所民事可憂雖得酒食不能醉飽若能進德民事可平故為飲食可醉飽之道以羣臣言聽教即為臣義不過愼酒進德次戒康叔以君義亦有聽教明為互矣傳我大至成矣正義曰以言曰故以為教辭即教以大克羞耇長省古道是老成人之德考其中正是能大進行可以惟為君故云則君道成矣傳能考至之道正義曰以聖人為能饗帝孝子為能饗親考德為君則人治之巳成民事可以祭神故考中德能進饋祀於祖考人愛神助可以無為故六用逸之道即上云飲食醉飽之道也鄭以為助祭於君亦非其義勢也以下然並亦惟天據人事是惟王正事大臣本天理故天順其大德不見忘在於王家反覆相成之勢也王曰封我西至之命正義曰於此乃揔言不可不用文王愼酒之教王命之曰封我文王本在西土以道輔訓往日國君及治事之臣大夫士與其民之小子其此等皆庶幾能用文王教而不厚於酒故我周家至于今能受殷之王命以此故不可不用其教以斷酒傳我文至常飲正義曰棐輔也徂往也以事已過故言往日恐嗜酒不成其德故以斷酒輔成之其御事謂國君之下衆臣也不厚於酒即無彝酒也故云不常飲揔述上也王曰封我聞至祗辟正義曰以周受於殷文王之前殷代也今又衛居殷地故舉殷代以酒興亡得失而為戒王命之曰封我聞於古所聞惟曰殷之先代智道之王成湯於上蹈道以畏天威於下明著加於小民即能常德持智以為政教自成湯之後皆然以至于帝乙猶保成其王道畏敬輔相之臣其君既然惟殷御治事之臣其輔相於君有恭敬之德不敢自寬暇自逸豫況曰其敢聚會羣飲酒乎於是在外之服侯甸男衛國君之長於是在內之服治事百官衆正惟次大夫惟服事尊官於百官族姓及致仕在田里而居者皆無敢沈湎於酒不惟不敢亦自不暇飲所以不暇者惟以助其君成其王道令德顯明又於正人之道必正身敬法正身以化下不令而行故不暇飲是亦可以為法也傳聞之至小民正義曰言聞之於古是事明衆見也下言自成湯知此別道湯事也王者上承天下恤民皆由蹈行於道畏天之罰已故也又以道教民故明德著小民傳能常至為非正義曰德在於身智在於心故能常德持智即上迪畏天顯小民為自湯後皆爾傳惟殷至逸豫正義曰此事當公卿故下別云越在內服百僚庶尹也為君畏相故輔之若寬暇與逸豫則不恭敬故不敢為也傳崇聚至明無正義曰釋詁云崇充也充實則集聚故崇為聚也飲必待暇逸猶尚不敢暇逸故言況敢聚集飲酒乎明無也傳於在至之德正義曰以公卿與國為體承君共事故先言之然後見廣故自外及內舉四者以揔六服又因衛為蕃衛故不言采也國謂國君伯言長連屬卒牧皆是見遍在外為君故言化湯畏相之德傳於在至自逸正義曰畿外有服數畿內無服數故為服治事也言百官衆正為揔之文但百官衆正除六卿亦有大夫及士士亦有官首而為政者惟亞傳云次大夫者謂雖為大夫不為官首者亞次官首故云亞舉大夫尊者為言其實士亦為亞次之官必知惟亞兼士者以此經文上下更無別見士之文故知兼之惟服宗工揔上百僚庶尹及惟亞言服治職事尊官之故亦不自逸惟亞等雖不為官首亦助上服治政事或可非官首者服事在上之尊官亦不自逸傳於百至里者正義曰每言於者繼上君與御事為於此不言在從上內服故也百官族姓謂其每官之族姓而與里居為揔故云卿大夫致仕居田里者也傳自外至飲酒正義曰自外服至里居皆無敢沈湎亦上銜事云亦不暇不暇則不逸可知助君敬法逆探下經也我聞至速辜正義曰既言帝乙以上愼酒以存故又言紂嗜酒而滅我聞亦惟曰殷之在今帝乙後嗣之謂紂王酣樂其身不憂於政事施其政令無顯明之德於民所敬所安皆在於怨不可變易大惟其縱淫泆於非常用燕安之故喪其威儀民見之無不䀌然痛傷其心也皆由惟大愛厚於酒晝夜不念自止息乃過逸其內心疾害很戾不能畏死聚罪人在商邑而任之於殷國滅亡無憂懼也不念發聞其德令之馨香使祀見享升聞於天大惟行其淫虐為民下所怨紂衆羣臣集聚用酒荒淫腥穢聞在上天故天下喪亡於殷無愛念於殷惟以紂奢逸故非天虐殷以滅之惟紂為人自召此罪故也傳言紂至變易正義曰施其政令於民無顯明之德言所施者皆是暗亂之政也紂意謂之為善所敬之所安之者及其施行皆是害民之事為民所怨紂之為惡執心堅固不可變易也傳紂大至其心正義曰誕訓為大言紂大惟其縱淫泆於非常之事傳紂衆至逸故正義曰紂衆羣臣用酒沈荒用者解經之自定本作自俗本多誤為嗜傳言凡至召罪正義曰此言惟人謂紂也今變言人者見雖非紂亦然王曰封豫至于時正義曰既陳殷之戒酒與嗜酒以致興亡之異故誥之王命言曰封我不惟若此徒多出言以誥汝而巳我自戒酒已親行之汝可法之也所以親行者古人有言曰人無於水監當於民監以水監但見已形以民監知成敗故也以須民監之故今殷紂無道墜失其天命我其可不大視以為戒撫安天下於今時也豫惟至于酒正義曰殷之存亡既可以為監若是故我惟告汝曰汝當堅固愛愼殷之善臣及侯甸男衛之君則在外尚然況已下太史所賔友內史所賔友於善臣百尊官而不固愼乎此之卑官猶尚固愼況惟汝之身事所服行美道服行美事治民而可不固愼乎於已身事猶當固愼況惟所敬順疇咨之圻父能迫回萬民之農父所順所安之宏父此等大臣能得固愼則可定其為君之道固愼大臣雖非急要尚能使君道得定況汝又能剛斷於酒乎善所莫大不可加也傳劼固至用之正義曰劼固釋詁文將欲斷酒為重故節文以相況毖訓為慎言誠堅固謹愼皆敬而擇任之其文通於下皆固慎傳侯甸至賔友乎正義曰太史掌國六典依周禮治典教典禮典政典刑典事典也內史掌八柄之法者爵祿廢置殺生與奪此太史內史即康叔之國大夫知者以下圻父農父宏父是諸侯之三卿明太史內史非王朝之官所賔友者敬也傳於善至民乎正義曰於善臣即上經殷獻臣也百尊官即上侯甸男衛太史內史也服行美道服事治民即上汝之身事知服事是治民者民惟邦本諸侯治民為事故也鄭玄以服休為燕息之近臣服采為朝祭之近臣非孔意也傳圻父至任大正義曰司馬主圻封故云圻父父者尊之辭以司徒教民五土之藝故言農父也以司馬征伐在乎閫外所專故隨順而疇咨之言君所順疇也迫近回繞於萬民言近民事也二者皆任大傳宏大至酒乎正義曰宏大釋詁文以司空亦君所順所安和之故言當順安之諸侯之三卿以上有司馬司徒故知宏父是司空言大父者以營造為廣大國家之父因節文而分之乃揔之言司馬司徒司空列國三卿今愼擇其人而任之則君道定況剛斷於酒乎為甚之義也其定辟揔上自劼毖殷獻臣巳下獨言三卿者因文相況而接之其實揔上也三卿不次者以司馬征伐為重次以政教安萬民司徒為重司空直指營造故在下也司徒言於萬民為迫回者事務為主故也司徒不言若者互相明皆為治民而君所順也厥或至于殺正義曰以為政莫重於斷酒故其有人誥汝曰民今飲酒相與羣聚是不用上命則汝收捕之勿令失矣盡執拘以歸於周之京師我其擇罪重而殺之也又惟殷之蹈惡俗諸臣惟其衆官化紂日久乃沈湎於酒勿用法殺之以漸染惡俗故三申法令且惟教之則汝有此明訓可以享國汝若不用我教辭惟我一人天子不憂汝不潔汝政事是汝同於見殺之罪不可不愼傳盡執至殺之正義曰言周故為京師但飲有稀數罪有大小不可一皆盡殺故知擇罪重者殺之傳又惟至殺之正義曰言諸臣謂尊者及其下列職衆官不可用法殺之明法有張弛此由殷之諸臣漸染紂之惡俗日久故不可即殺其衛國之民先非紂之舊臣乃羣聚飲酒恐增長昏亂故擇罪重者殺之據意不同故殺否有異傳以其至享國正義曰禮成於三故必三申法令有此明訓揔上之辭故得享國傳汝若至之罪正義曰汝不用我教辭則不足憂念故惟我一人不憂汝不潔汝之政事事惟穢惡不復教之使潔靜也王曰封汝至于酒正義曰以戒酒事終故結之王命言曰封汝當常聼念我所使汝愼者篤而行之勿使汝主民之吏若宰人者沈湎於酒當正身以帥民梓材第十三傳告康至治材正義曰此取下言若作梓材既勤朴斫故云為政之道如梓人治材此古杍字今文作梓梓木名木之善者治之冝精因以為木之工匠之名下有稽田作室乃言梓材三種獨用梓材者雖三者同喻田在於外室揔於家猶非指事之器故取梓材以為功也因戒德刑與酒事終言治人似治器而結之故也王曰至人宥正義曰王曰封汝為政當用其衆人之賢者與其小臣之良者以通達卿大夫及都家等大家之政於國然後汝當信用其臣以通逹王教於民惟乃可為國君之道汝為君道故當使上下順常於是曰我有典常之師可師法是君之順典常也其下司徒司馬司空國之三卿及正官衆大夫亦皆順典常而曰我無虐厲殺人之事是使臣之順常也如此君臣皆能順常則為善矣為君之道非但順常亦須敬勞之故云亦其為君之道當先敬心以愛勞民故汝往治民必敬勞之又以民須敬勞之故汝往之國詳察其姦宄及殺人之人二者所過歷之人原情不知有所寬宥以斷獄務從寬故汝往治亦當見其為君之事而民有過誤殘敗人者當寬宥之此亦為敬勞之也傳言當至於國正義曰以用也暨與也言用通厥臣可用明此皆賢與良也厥臣文在大家之上故知小臣也言用之者既用其言以為政又用其人以為輔本之得大家所用統之即君所遣也以大夫稱家對士庶有家而非大故云大家卿大夫在朝者都家亦卿大夫所得邑也又公邑而大夫所治亦是也用此以行政令上逹於國使人君知之也即是庶人升為士又用庶人進在官者小臣亦得進等而用之周禮有都家之官鄭云都謂王子弟所封及公卿所食邑家謂大夫所食采地傳以大家言之揔也大臣故言卿大夫及都家之政卿大夫之政謂在朝所掌者都家之政謂采邑所有政事二者並當通達之於國故連言之傳汝當至之道正義曰言汝當信用臣即信用卿大夫及都家自然大家也傳用小臣與庶人故得通王教於民也人君上承於王下治民事故交通其政惟乃國君之道而巳鄭以於邑言達大家於國言達王與邦君王為二王之後即亂名實也傳汝惟至師法正義曰即上民事王教通於國人是順常也故揔上惟邦君言汝惟君道使順常也典常可師即順常也傳言國至善矣正義曰此連上蒙若恆之文故云國之三卿正官衆大夫皆順典常也不言士從可知也此曰豫罔厲殺人所謂令康叔之語但在臣下冝為此也以上令下行行之在臣故云我無厲虐殺人之事互明君及臣皆師法而無虐傳亦其至來之正義曰亦其為君之道者為邦君之道非直順常亦須敬勞故往必敬勞即論語云先之勞之是也傳以民至勞之正義曰上文無罪敬勞此惟就有罪者原情免宥亦敬勞也其實姦宄不殺人者殺人亦是姦宄但重言而別其文姦宄及殺人二者並是賊害自當合罪不可寬宥其所過歷之人情所不知故詳察寬宥以為敬勞之傳聽訟至宥之正義曰以君者立於無過之地使物不失其所故宥罪原情當見其為君之事與上厥君始終相承於姦上言肆往此亦以罪事往可知也言宥明情亦可原故知過誤殘敗人也王啓至攸辟正義曰周公云所以敬勞者以王者開置監官其治主為於民故也以此當教民曰無得相殘傷無得相虐殺而為重害也何但不可為重害民之相於當至於敬養寡弱至於存恤屬婦合和其教用大道以相容無使至冤枉所以如此者以王者其當效實國君及於御治事者惟須知其教命所施何用知其善惡故不可不勤也所效實若能長養民長安民用古昔明王之道而治之如此為監無所復罪汝當務之傳當教至冤枉正義曰以言曰故知當教民也殘謂不死虐甚則殺故二文也經言屬婦傳言妾婦者以妾屬於人故名屬婦此經屬婦與寡弱為例則非關嫡婦也何者妻子是家中之貴者不至冤枉故也傳王者至不勤正義曰以君臣共國事故井效御治事而知其所施則下不得為非即是王使存省侯伯監治是也故不可不勤惟曰至丹雘正義曰既言王者所以效實國君為政之事故此言國君為政之喻惟為監之事曰若農人之考田也巳勞力遍布災而耕發其田又須惟其陳列修治為疆畔畎壟以至收穫然後功成又若人為室家巳勤力立其垣墉又當惟其塗而塈飾茨蓋之功乃成也又若梓人治材為器已勞力朴治斫削其材惟其當塗而丹漆以朱雘而後成以喻人君為政之道亦勞心施政除民之疾又當惟其飾以禮義使之行善然後洽傳為政至後洽正義曰此三者事別而喻同也先遠而類踈者乃漸漸以事近而功者次之皆言既勤於初乃言修治於末明為政孜孜因前基而修使善垣墉一也皆詳而復言之室器皆云其事終而考田止言疆畎不云刈穫者田以一種但陳修終至收成故開其初與下二文互也二文皆言斁即古塗字明其終而塗飾之其室言塗塈塈亦塗也揔是以物塗之茨謂蓋覆也器言塗丹雘塗丹皆飾物之名謂塗丹以朱雘雘是彩色之名有靑色者有朱色者故鄭玄引山海經云靑丘之山多有靑雘此經知是朱者與丹連文故也今王至保民正義曰此戒康叔巳滿三篇其事將終須有揔結因其政術言法於明王上下相承資以成治故稱今者王命惟告汝曰先王文武在於前丗巳自勤用明德招懷逺人使來以為親近也以明德懷柔之故衆國朝享於王又相親善為兄弟之國方方皆來賔服亦巳化上奉用先王之明德矣是先王行明德下亦行明德以從之而可法也先王既然凡為君以君天下者亦如先王用常法則和集衆國使之大來朝享亦須同先王用明德也君天下者當如此今大天巳付周家治九州之中國民矣周家之王若能為政用明德以懷萬國逺拓其疆界土壤則先王之道遂更光大以此今王須大先王之政惟明德之大道而用之以此和悅而先後其天下迷愚之民使之政治用此所以恱先王受命使之遂大之義故也是明德不可不務故我周王今亦行之汝為人臣可以不法乎當法王家勤用明德治國也汝若能法我王家而用明德是為善不可加因歎云巳乎如此為監則我周家惟曰欲汝至於萬年惟以承奉王室令其子子孫孫纍丗長居國以安民傳言文至法之正義曰言先王知謂文武也夾者是人左右而夾之故言近也傳衆國至明德正義曰享施於王而兄弟為相於之辭明彼此皆和協親仁善鄰左傳文以先王用明德欲下之所行今亦奉用為亦先王耳傳大天至遂大正義曰肆遂也申遂故為大越遠也使天下賔服故遠拓界壤以益先王故為遂大也傳今王至之義正義曰言用德亦是明德也先後若詩云豫曰有先後謂於民心先未悟而啓之巳悟於後化成之故謂教訓也先王本欲子孫成其事今化天下使善是恱先王受命其和恱先王即遠拓疆土恱其受命即遂大也尚書正義卷第十三計一萬四千三百二十二字
