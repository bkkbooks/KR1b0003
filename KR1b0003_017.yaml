body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達勑撰周書立政第二十一周官第二十二君陳第二十三立政第二十一周公若至鮮哉正義曰王之大事在於任賢使能成王初始即政猶尚幼少周公恐其怠忽政事任非其人故告以用臣之法周公順古道而告王曰我敢拜手稽首告嗣世天子成王今巳爲王矣王者當立善政其事不可不愼周公旣爲此言乃用王所立政之事皆戒於王曰王之親近左右常所長事謂三公也常所委任謂六卿也平法之人謂獄官也綴衣之人謂掌衣服者也虎賁以武力事王者此等皆近王左右最須得人周公旣歷言此官復言而歎曰嗚呼美哉此五等之官立政之本也知憂此官冝得賢人者少也傳順古至不愼正義曰周公旣拜手稽首而後發言還自言拜手稽首示已重其事欲令受其言故盡禮致敬以告王也召誥云拜手稽首旅土若公亦是召公自言已拜手稽首與此同也成王嗣丗而立故呼成王爲嗣天子周公攝政之時成王未親王事此時旣巳歸政於成王故言今以爲王矣不可不愼也王肅以爲於時周公㑹羣臣共戒成王其言曰拜手稽首者是周公讃羣臣之辭傳周公至其人正義曰此以立政名篇知用咸戒者是周公用王所立政之事皆戒於王也三公臣之尊者知常所長事謂三公也六卿分掌國事王之所任知常所委任謂六卿也準訓平也平法之人謂士官也士察也察獄之官用法必當均平故謂獄官爲準周禮司宼之長在常任之内此士官當謂士師也衣服必連綴著之此歷言官人知綴衣是掌衣服者此言親近大臣必非造衣裳者周禮太僕下大夫掌王王之服位出入王之大命此掌衣服者當是大僕之官也周禮虎賁氏下大夫言其若虎賁獸是以武力事王者此皆左右近臣冝得其人言其急於餘官得其人者文官得其文人武官得其武人違才易務皆爲非其人也傳歎此至者少正義曰此五官皆親近王故歎此五者立政之本也休美也王肅云此五官美哉是休兹爲美此五官也歎其官之美美官不可不委賢人用之故歎之知憂得其人者少下句惟言禹湯文武官得其人是知憂得人者少也古之至罔後正義曰旣言知憂得人者少乃逺述上丗之事此言禹與桀也古之人能用此求賢之道者惟有夏禹之時乃有羣臣卿大夫皆是賢人室家大強猶尚招呼賢俊之人與共立於朝尊事匕天禹之臣蹈知誠信於九德之行者乃敢告敎其君曰我敢拜手稽首君今巳爲君矣不可不愼也戒其君即告曰居汝掌事之六卿居汝牧民之州伯居汝平法之獄官使此三者皆得其人則此惟爲君矣言不得賢人不成爲君也禹能謀所面見之事無所疑惑用大明順之德則乃能居賢人於官賢人在官職事修理乃能三處居無義之民善人在朝惡人黜逺其國乃爲治矣及夏末年桀乃爲天子桀之爲德惟乃不爲其先王之法往所委任是惟暴德之人以此故絶丗無後得賢人則興任小人則滅是須官賢人以立政也傳古之至上天正義曰經言古之人迪傳言古之人道當說古之求賢人之道也王肅云古之人道惟有夏之大禹爲天子也其意言古人之道說有此事孔意似不然也孔以大夫稱家室猶家也籲訓呼也招呼者乃是臣下之事故以爲夏禹之時乃有卿大夫室家大強猶乃招呼在外賢俊與之共立於朝尊事上天也言君旣求賢臣之助言天子事天臣成君事故言共尊事上天傳禹之至所謀正義曰九德之行非一人能備言禹之臣蹈知九德之行極言其賢智大臣也禹時伯益之輩乃可以當此經典之文更無九德之事惟有皐陶謀九德故言九德皐陶所謀者即寛而栗不而立愿而恭亂而敬擾而毅直而温簡而廉剛而塞強而義是也傳知九至君矣正義曰進言戒君非大賢不可故知九德之臣乃敢告敎其君以立政也君矣亦猶言王矣言巳爲君矣不可不愼也君王一也變文以相避爾宅訓居也居汝事須得賢人六卿各掌其事者也居汝牧九州之伯主養民亦須得賢人養其民也居汝準士官主理刑法亦須賢人平其獄也六卿掌内州牧掌外内外之官及平法三事皆得其人則此惟爲君矣言羣官失職則不成爲君也上句周公戒王歷言五官其内無州牧此惟言三官加州牧者俱是逐急言之其有詳略爾曲禮云九州之長曰牧王制云千里之外設方伯八州八伯然則牧伯一也伯者言一州之長牧者言牧養下民牧伯俱得言之故孔以伯解牧鄭玄云殷之州牧曰伯虞夏及周曰牧與孔不同傳謀所至之外正義曰凡人爲主皆欲臣賢但大佞似忠賢不可别欲知其逺先驗於近但禹能謀所面見之事善官賢人旣得其官分別善惡無所疑惑仁賢必用邪佞必退然後舉直錯諸枉則爲能用大順德如是乃能居賢人於衆官賢人旣得居官則能分別善惡無義之民必獲大罪量其輕重厈之逺地乃能三處居此無義罪人三居者大罪宥之四裔次九州之外次中國之外四裔者四海之表最逺者也次九州之外者四海之内要服之外次中國之外者謂罪人所居之國外也猶若衞人居於晉去本國千里故孔注舜典云次千里之外是也鄭云三處者自九州之外至於四海三分其地逺近若周之夷鎭蕃也與孔不同亦越至見德正義曰不有所廢則無以興桀之滅亡夏家乃以開道湯德此言湯之能用人也桀之昬亂亦於成湯之道得升聞於天大賜受上天之光命得王有天下湯旣爲王乃用三有居惡人之法能使各就其居處言皆服其罪也又曰用三德之俊人能使各就其俊事言皆明其德也湯所以能嚴威惟可大法象者以其能用三居三俊之法故也成湯其在商邑用此三居三俊之道和於其邑其在四方用是斷罪任賢之大法見其聖德於民言逺近皆從化也傳桀之至天下正義曰成湯之道得升謂從下而升於天故天賜之以光命使之得王天下爲天子也釐賜耿光皆釋詁文傳湯乃至明德正義曰皐陶謨九德即洪範之三德細分以爲九爾以此知三俊即是洪範所言剛克柔克正直三德之俊也能就其俊事言明德者用以俊人居官顯明其有德也上句言則乃宅人玆乃三宅無義民先言用賢後言去惡此經先言三有宅後言曰三有俊者用賢去惡俱是立政之夲上句先說夏禹言得賢然後去惡見其須賢之切及說成湯文武先言去惡後言用賢又見惡冝速去或先或後所以互相見爾嗚呼至萬姓正義曰旣言湯以用賢而興又說紂之失人而滅周公又歎曰嗚呼其在殷王受德本性大惡自強惟進用刑罰與暴德之人同治其國並爲威虐乃惟衆習爲過德之人與之同共於其政由其任同惡之人故上天敬誅罰之乃使我周家王有華夏用商所受天命同治天下萬姓言周能用賢天親有德故得爲天子傳受德至威虐正義曰泰誓三篇惟單言受而此云受德者則德本配受共爲一人故知受德是紂字也旣受之與德共爲紂字而經或言受或言受德者呼之有單復爾其人實爲大惡德字乃爲善名非是時人呼有德知是帝乙愛焉爲作善字望其爲善而反爲大惡以其行反其字明非時人呼也釋詁云暋強也暋即昏也故訓爲強言紂自強為惡惟進用刑罰身旣進用刑罰則愛好暴虐之人故爲與之同於其國言並爲威虐傳乃惟至任賢正義曰暴德言以暴虐爲德逸德言以過惡爲德習效爲之衆者言其所任多也紂任衆爲過德之人與之同於其政言其不任賢也與暴德同於其國與惡德同於其政其事一也異言之爾牧誓所云四方之多罪逋逃是信是使是以爲大夫卿士俾暴虐於百姓以姦宄於商邑是其事也傳天以至有德正義曰言天知其惡熟詳審下罰故言敬罰也商本受天命周亦受天命故言用商所受天命同治萬姓釋言云弇同也同爲天子治萬姓與商同也此經之意言周家有德皇天親有德也王肅云敬罰者謂須暇五年亦越至長伯正義曰旣言上天去惡與善滅殷興周即說文王武王能用求賢審官之事桀惡所以興成湯紂惡所以開文武言紂之不善亦於文王武王使得其道大行能知居二有惡人之心居之皆得其所言服其罪也灼然見三有賢俊之心用之皆得其人言明其德也文武知此三宅三俊故能敬事上天稱天心也立民正長合民心也傳紂之至之心正義曰桀之昬亂開成湯紂之不善開文武其事同也於成湯言能受上天之命於文武云能敬事上帝前聖後聖爲行必同交錯爲文所以互相見爾文王受命武王伐紂二聖共成王道故文武並言之猶詩序云文武以天保巳上治内采薇巳下治外文武並言與此同也文王之時未定天下所立之官亦未具足卜經所言立政任人巳下三亳阪尹巳上其所舉官屬多是文武時事以見二聖同道父作之子述之言其相成爾故以能知三有居惡人之心灼然見三有賢俊之心言文王之聖心能揆度知惡人眞惡須屏黜之知賢人實賢須舉用之故去惡進賢皆得其所賢人難識故特言灼然言其知之審也傳言文至諸侯正義曰上天之道與善去惡三宅三俊行合天心言文武知三宅三俊故能敬事上帝伯亦長也故言立民正長天子祭天知敬事上帝謂郊𣏌天也天子建國知立民長伯謂建諸侯也以下句立政任人巳下歷言朝廷之臣與蠻夷衆君知此立民長伯主謂諸侯詩周頌維清述文王之德言肈禋大雅皇矣美文王之伐言是類類禋皆是祭天之名是文王巳𣏌天矣文王未得封建諸侯其建諸侯惟武王時爾立政至阪尹正義曰言文武亦法禹湯審官以立美政任人謂六卿準夫者平法之人謂理獄官也牧者九州之牧治爲天地人之三事自虎賁巳下歷舉官名言此官皆須得其人不以官之尊卑爲次蓋以從近而至逺虎賁綴衣趣馬三者官雖小須愼擇其人乃至左右攜持器物之僕及百官有司之下至衆府藏之吏亦須擇其人旣言近王小官及逺官大者小官猶須擇人況乎大都邑之小長與有道藝之人爲表幹之臣及百官有司之職可以非其任乎以近臣況逺臣以小官況大官旣以近小況逺大又舉官之次而掌事要者若太史下大夫長官大夫及衆掌常事之善士皆須得其人更舉官之大者司徒司馬司空之卿及次卿之衆大夫皆須得其人旣略言内外之官又更逺及夷狄蠻夷微盧之衆帥與三處亳民之監及阪地之尹長皆須用賢人言文武於此諸官皆求賢人爲之也傳文武至三事正義曰前聖後聖其道皆同未必相放法也後人法前自是常事因其上說禹湯立政故言文武亦法禹湯以立政也任人則前經所云常任六卿也準夫則準人也牧者前云宅乃牧也前文有常伯綴衣虎賁不言牧此不言常伯綴衣虎賁而言牧者以前文先舉朝臣故不言牧前巳備文故此不言常伯其綴衣虎賁而言牧者以下文自詳故此惟舉内外要官者言之故内官舉任人準夫外官舉牧故下云繼自今我立政立事準人牧夫我其克灼知厥若又云自古商人亦越我周文王立政立事牧夫準人則克宅之克由繹之玆乃俾乂皆據内外要重官以言之夫即人也立官所以事天地治人民爲此三事而已故以三事謂天地人也王肅云文王所以立政任人常任也準夫準人也牧者諸侯之長也與孔意同傳趣馬至其人正義曰周禮趣馬爲校人屬官馬一十二匹立趣馬一人掌賛正良馬而齊其飲食是掌馬之小官也綴衣是太僕也虎賁太僕皆下大夫也比三公六卿亦爲小尹之官雖文止三官亦包通在下之屬官三官之下小官多矣趣馬即下士其馬一匹有圉師一人是趣馬之下猶有小官也傳雖左至擇人正義曰諸官有所務業從王左右攜持器物之僕謂寺人内小臣等也百司庶府謂百官有司之下主劵契府藏之吏謂其下賤人非百官有司之身也言此等亦皆擇人傳小臣至任乎正義曰小臣猶皆擇人況大都邑之小長謂公卿都邑之内大夫士及邑宰之屬以身有道藝爲民之表的楨幹之臣其都邑之内屬官謂之小長周禮太宰職云乃施則于都鄙而建其長立其兩設其伍陳其殷兩謂兩卿長謂公卿伍謂大夫殷謂衆士是也傳太史至其人正義曰周禮太史下大夫二人掌建邦之六典又太宰職亦云掌建邦之六典太史副貳太宰掌其正太史掌其貳六典謂治典敎典禮典政典刑典事典六卿所掌者也掌邦六典之貳其所掌事重故特言之尹伯長官大夫周禮每官各有長若太史爲史官之長大司樂爲樂官之長如此類皆是也及衆掌常事之善士謂士爲長官者其大夫及士不爲長官者則前云百司也居官必須善人此是揔舉衆官故特言吉士傳此有至法則正義曰周公攝政之時制禮作樂其作立政之篇必在制禮之後周禮六卿而此有三卿及次卿衆大夫則是副卿之大夫有若周禮小宰之類是也此文武未伐紂之時也逺舉文武之初以爲法則爾泰誓下篇云王乃大巡六師六師則六軍也軍將皆命卿即伐紂之時巳立六卿矣牧誓亦云司徒司馬司空舉之三卿者彼傳巳解之云指誓戰者也傳蠻夷至用賢正義曰牧誓所云有微盧彭濮人此舉夷微盧以見彭濮之等諸夷也烝訓衆也此篇所言皆立官之事此經惟阪下言尹則夷微巳下以一尹揔之故傳言蠻夷微盧之衆帥及亳民之歸文主者三所爲之立監及阪地之尹長故言帥言監亦是言爲之立長義出經文尹也亳是湯之舊都此言三亳必是亳民分爲三處此篇說立官之意明是分爲三亳必是三所各爲立監也亳人之歸文王經傳未有其事文王旣未伐紂亳民不應歸之鄭王所說皆與孔同言亳民歸文王者蓋以此章雜陳文王武王時事其言以文王爲主故先儒因言亳民歸文王爾即如此意三亳爲巳歸周必是武王時也及阪地之尹長傳言其山阪之地立長爾不知其指斥何處也鄭玄以三亳阪尹者共爲一事云湯舊都之民服文王者分爲三邑其長居險故言阪尹蓋東成皐南轘轅西降谷也皇甫謐以爲三亳三處之地皆名爲亳蒙爲北亳榖熟爲南亳偃師爲西亳古書亡滅旣無要證未知誰得旨矣文王至于玆正義曰上旣揔言文武此人分而說之文王惟能其居心逺惡舉善乃能立此常事其主養人之官用能俊有德者旣任用俊人每事委之文王無所兼知於衆人之言或毀或譽文王皆不知也衆獄斷罪得失文王亦不得知也衆所當愼之事文王亦不得知也惟愼擇在朝有司在外牧養民之夫是時萬民或順於法或用違法衆刑獄衆所愼之事文王一皆無敢自知於此惟委任賢能而巳傳文王至德者正義曰上言文王能知三宅三俊知此言能居心者以逺惡舉善居其心也旣逺惡舉善乃能立此常事用賢養民是人君之常事也傳文王至任賢正義曰下云是訓用違即是在上庶言也是訓則稱譽之事用違則毀損之事但分析言之爾亦越至丕基正義曰亦於武王遵循父道所循惟文王撫安天下之功不敢廢其文王義德言奉行遵父道也又言武王所遵循者惟謀從文王寛容之德故武王君臣能並受此大大之基業謂受命爲天子傳之子孫傳武王至子孫正義曰以言並受則非獨王身故以爲君臣並受此大人之基業謀從寛容之德是與臣謀及基業成就則君臣共有故言並受且王爲天子臣爲諸侯皆受基業各傳子孫是亦爲並受也嗚呼孺子至受民正義曰周公旣歷說禹湯文武乃復指戒成王嗚呼而歎孺子今巳爲王矣旣正位爲王事不可不愼繼續從今巳往我王其與立政謂大臣也其與立事謂小臣也平法之人及養民之夫此等諸臣我王其能察之灼然知其順於事者則大乃使之治理言知其能有勤勞各盡心力然後用此賢臣治我所受天民和平我衆獄訟及衆當所愼之事必能如是則勿復有以代之言其法不可復變也政從君出爲人主用是一善之言善在一言而已勿以惡言亂之王能如是我王則終惟有成德之美以治我所受天民矣傳繼用至心力正義曰自此巳下四言繼自今者凡人靡不有初鮮克有終恐王不能終之戒成王使繼續從今巳往常用賢也自訓爲從亦訓爲用此傳言用今巳往下傳言從今巳往其意同也政事相對則政大事小故以立政爲大臣立事爲小臣及準人牧夫略舉四者以揔諸臣戒王任此人也其能灼然知其能順於事者則大乃使治顧氏云君能知臣下順於事則臣感君恩大乃治理言各盡心力也傳能治至復變正義曰相訓助也助君所以治民事故相爲治天命王者使之治民則天與王者此民故言能治我所受天民也能治下民理衆獄衆愼之事使得其所則爲政之大要能如此則勿有以代之言此法盡善不可復變易也或據臣身旣能如此不可以餘人代之也傳言政至之民正義曰釋詁云自用也話言也舎人曰話政之善言也孫炎曰話善之言也然則話之與言是一物也自一話者言人君爲政當用純一善言又云一言者純一善言在於一言而巳謂發號施令當須純一不得差貳欲令其口無可擇之言也顧氏云人君爲政之道當須用一善而巳爲善之法惟在一言也末訓爲終彦訓爲美王能出言皆善口無可擇如此我王則終惟有成德之美以治我所受天民矣釋訓云美士爲彦故彦爲美嗚呼予至俾乂正義曰且者周公名也周公又歎曰嗚呼我旦巳受賢聖人說禹湯之美言皆以告孺子王矣王冝依行之繼續從今以往文王之子孫其勿得過誤於衆獄訟衆所愼之事惟當用是正是之道治之用古商人成湯亦於我周家文王其立政立事牧夫準人此等諸官皆用賢人之法則能居之於心能用陳之於位明識賢人用之爲官此乃使天下大治戒成王使法之傳言用至下治正義曰上陳禹湯文武此覆上文惟言湯與文王者言有詳略無別意也能居之於心謂心知其賢也能用陳之謂陳列於位用之以爲官也王肅曰則能居之在位能用陳其才力如此故能使天下治也國則至國家正義曰旣言湯與文王用賢大治又言其不冝用小人商周聖賢之國無有立政用憸利小人者此憸利之人不順於徳若其用之是使其君無顯名在其丗也王當繼續從今巳往立其善政其勿用憸利之人其惟任用善士使勉力治我國家敎王使用善士勿使小人也今文至常人正義曰今告汝文王之子文王之孫孺子今巳即政爲王矣我所以須厚戒之王其勿誤於衆治獄之官當須愼刑也惟有司之牧夫有司主養民者冝得賢也治獄之吏養民之官若任得其人使其能治汝戎服兵器以此升行禹之舊迹四方而行至於天下至於四海之表無有不服王之化者以顯見文王之光明以播揚武王之大業言任得賢臣則光揚父祖周公又歎曰嗚呼繼續從今巳往後丗之王立行善政其惟能用常人必使常得賢人不可任非其才此雖指戒成王乃是國之常法因以戒後王言北法可常行也傳獨言至官人正義曰上有庶愼立政立事牧夫準人此獨言庶獄與有司之牧夫者言庶獄欲其重刑言有司牧夫欲其愼官人也傳其當至舊迹正義曰立官所以牧養下民戒備不虞故以詰爾戎兵爲言也戎亦兵也以其並言戎兵故傳以爲戎服兵器威懷並設以升禹治水之舊迹逺行必登山故以陟言之如舜之陟方意亦然傳方四至化者正義曰方行天下言無所不至故以方爲四方釋地云九夷八狄七戎六蠻謂之四海知海表謂夷狄戎蠻無有不服化者即詩小雅云蓼蕭澤及四海是也傳其惟至所私正義曰官須常得賢人故惟賢是用用賢是常常則非賢不可人主或知其不賢以私受用之代天爲官故言不可以天官有所私周公至中罰正義曰周公順其事而言曰太史以其太史掌廢置官人故呼而告之昔日司冦蘇公旣能用法汝太史當敬汝所用之獄以長施行於我王國欲使太史選主獄之官當求蘇公之比也此刑獄之法有所愼行必以其體式列用中常之罰不輕不重當如蘇公所行也傳忿生至之比正義曰成十一年左傳云昔周克商使諸侯撫封蘇忿生以温爲司㓂是忿生爲武王司㓂封蘇國也蘇是國名所都之地其邑名温故傳言以温也特舉蘇公治獄官以告太史知其言主獄之官當求蘇公之比類也傳此法至告之正義曰治獄必有定法此定法有所愼行周禮大司㓂云刑新國用輕典刑平國用中典刑亂國用重典輕重各有體式行列周公言然之時是法爲平國故必以其列用中罰使不輕不重美蘇公治獄使列用中罰明中罰不輕不重是蘇公所行也周禮太宰以八柄詔王馭羣臣有爵禄廢置生殺與奪之法太史亦掌邦之六典以副貳太宰是太史有廢置官人之制故特呼而告之也周官第二十二成王至周官正義曰成王於周公攝政之時旣黜殷命及其即政之後滅淮夷於是天下大定自滅淮夷還歸在豐號令羣臣言周家設官分職用人之法史敘其事作周官傳黜殷至言之正義曰據金縢之經大誥之序知黜殷命在周公攝政三年東征之時也據成王政之序費誓之經知滅淮夷在成王即政之後也淮夷於攝政之時與武庚同叛成王旣滅淮夷天下始定淮夷本因武庚而叛黜殷命與滅淮夷其事相因故雖則異年而連言之以見天下旣定乃作周官故也下經言四征弗庭是黜滅之事也罔不承德是安寧之狀也序顧經文故追言黜殷命以接滅淮夷見征伐乃安定之意也傳成王至西周正義曰以洛誥之文言王在新邑今復云在豐故解之也史記周本紀云太史公曰學者皆稱周伐紂居洛邑綜其實不然武王營之成王使召公卜居九鼎焉而周復都豐鎬是言成王雖作洛邑猶還西周之事也多方云王來自奄至於宗周宗周即鎬京也於彼不解至此始爲傳者宗周雖是鎬京文無豐鎬之字故就此解之武王旣以遷鎬京今王復在豐者豐鎬相近舊都不毀豐有文王之廟大事就豐宣之故也傳言周至之法正義曰周禮每官言人之貟數及職所掌立其定法授與成王成王即政之初即有淮夷叛逆未暇得以立官之意號令羣臣今旣滅淮夷天下清泰故以周家設官分職用人之法以誥羣臣使知立官之大旨也設官分職周禮序官之文言設置羣官分其職掌經言立三公六卿是設官也各言所掌是分職也各舉其官之所掌示以才堪乃得居之是說用人之法惟周至治官正義曰惟周之王者布政敎撫安萬國巡行天下侯服甸服四面征討諸侯之不直者所以安其海内兆民六服之内羣衆諸侯之君無有不奉承周王之德者自滅淮夷而歸於宗周豐邑乃督正治理職司之百官敘王發言之端也傳即政至甸服正義曰檢成王政之序與費誓之經知成王即政之年奄與淮夷又叛叛即往伐今始還歸多方云五月丁亥王來白奄至於宗周與此滅淮夷而還歸在豐爲一事也年初始叛五月即歸其間未得巡守於四方也而此言撫萬國巡行天下其實止得撫巡向淮夷之道所過之諸侯爾未是用四仲之月大巡守也以撫諸侯巡守是天子之大事因即大言之爾周之法制無萬國也惟伐淮夷非四征也言萬國四征亦是大言之爾六服而惟言侯甸者二服去圻最近舉近以言之言王巡省徧六服也傳四面至言多正義曰四征從京師而四面征也釋詁云庭直也綏安也諸侯不直謂叛逆王命侵削下民故四面征討諸侯之不直者所以安其兆民楚語云十日百姓千品萬官億醜兆民每數相十知十億曰兆稱兆言其多也傳六服至百官正義曰周禮九服此惟言六者夷鎭蕃三服在九州之外夷狄之地王者之於夷狄羈縻而巳不可同於華夏故惟舉六服諸侯奉承周德言協服也序云還歸在豐知宗周即豐也周爲天下所宗王都所在皆得稱之故豐鎬與􅏖邑皆名宗周釋詁云董督正也是董得爲督督正治理職司之百官下戒勑是董正也王曰至未危正義曰治謂政敎邦謂國家治有失則亂家不安則危恐其亂則預爲之制慮其危則謀之使安制其治於未亂之前安其國於未危之前張官設府使分職明察任賢委能令事務順理如是則政治而國安矣摽此二句於前以示立官之意必於未亂未危之前爲之者思患而預防之思患而預防之易旣濟卦象辭也曰唐至其人正義曰旣言須立官之意乃追述前代之法止而復言故更加一曰唐堯虞舜考行古道立官惟數止一百也内有百揆四岳者百揆揆度百事爲羣官之首立一人也四岳内典四時之政外主方岳之事立四人也外有州牧侯伯牧一州之長侯伯五國之長各監其所部之國外内置官各有所掌衆政惟以協和萬邦所以皆安也夏禹商湯立官倍多於唐虞雖不及唐虞之清簡亦能用以爲治明王立其政敎不惟多其官惟在得其人言自古制法皆明開官司求賢以處之也傳道堯至有法正義曰百人無主不散則亂有父則有君也君不獨治必須輔佐有君則有臣也易序卦云有父子然後有君臣則君臣之興次父子之後人民之始則當有之未知其所由來也雖逺舉唐虞復考古也說命曰明王奉若天道建邦設都則王者立官皆象天爲之故内置百揆四岳象天之有五行也五行佐天羣臣佐主以此爲象天爾不必其數有五乃象五行故以百揆四岳爲五行之象左傳說少昊立五鳩氏顓頊巳來立五行之官其數亦有五故置於五行矣舜典云肈十有二州此說虞事知置州牧十二也侯伯謂諸侯之長益稷篇禹言治水時事云外薄四海咸建五長知侯伯是五國之長也成王說此事者言堯舜所制上下相維内外咸治言有法也此言建官惟百夏商官倍則唐虞一百夏商二百禮記明堂位云有虞氏官五十夏后氏官百者禮記是後丗之言不與經典合也今予至厥官正義曰王言今我小子敬勤於德雖早夜不懈怠猶不能及於唐虞仰惟先代夏商之法是順順蹈其前代建官而法則之言不敢同堯舜之官準擬行夏殷之官爾若與訓俱訓爲順也傳師天至堪之正義曰三公俱是敎道天子輔相天子縁其事而爲之名三公皆當運致天子使歸於德義傳於保下言保安天子於德義揔上三者言皆然也禮記文王丗子云師也者敎之以事而喻諸德者也保也者愼其身以輔翼之而歸諸道者也道德別掌者内得於心出行於道道德不甚相逺因其並釋師保故分配之爾於公云爕理隂陽於孤云寅亮天地和理敬信義亦同爾以孤副貳三公故其事所掌不異傳天官至任大正義曰此經言六卿所掌之事撮引周禮爲之揔目或據禮文或取禮意雖言有小異義皆不殊周禮云乃立天官冢宰使帥其屬而掌邦治治官之屬太宰卿一人馬融云冢大也宰治也大治者兼萬事之名也鄭玄云變冢言大進退異名也百官揔焉則謂之冢列職於王則稱大冢者大之上也山頂曰冢是解冢大異名之意大宰職云三曰禮典以統百官馬融云統本也百官是宗伯之事也此統百官在冢宰之下當以冢尊故命統治百官爲冢宰之事治官禮官俱得統之也禮云以佐王均邦國此言均四海故傳辨之均平四海之内邦國與孔意不異傳地官至協睦正義曰周禮云乃立地官司徒使帥其屬而掌邦敎以佐王安擾邦國大宰職云二曰敎典以擾萬民鄭玄云擾亦安也言饒衍之傳亦以擾爲安五典即五敎也布五常之敎以安和天下之人民使小大協睦也舜典云契爲司徒敬敷五敎周禮司徒掌十有二敎一曰以祀禮敎敬則民不苟二曰以陽禮敎讓則民不爭三曰以隂禮敎親則民不怨四曰以樂禮敎和則民不乖五曰以儀辨等則民不越六曰以俗敎安則民不愉七曰以刑敎中則民不暴八曰以誓敎恤則民不怠九曰以度敎節則民知足十曰以丗事敎能則民不失職十有一曰以賢制爵則民愼德十有二曰以庸制禄則民興功鄭玄云有虞氏五而周十有二焉然則十有二細分五敎爲之五敎可以常行謂之五典五典謂父義母慈兄友弟恭子孝也傳春官至等列正義曰周禮云乃立春官宗伯使帥其屬而掌邦禮以佐王和邦國宗廟也伯長也宗廟官之長故名其官爲宗伯其職云掌建邦之天神人鬼地祇之禮又主吉凶賔軍嘉之五禮吉禮之别有十二凶禮之別有五賔禮之別有八軍禮之別有五嘉禮之別有六揔有三十六禮皆在宗伯職掌之文文煩不可具載大宰職云三曰禮典以和邦國以諧萬民其職乂有以玉作六瑞以等邦國以禽作六贄以等諸臣是以和匕下尊卑等列也傳夏官至亂者正義曰周禮云乃立夏官司馬使帥其屬而掌邦政以佐王平邦國其職主戎馬之事有掌征伐統正六軍平治王邦四方國之亂者天子六軍軍師之通名也案其職掌九伐之法馮弱犯寡則眚之賊賢害民則伐之暴内陵外則壇之野荒民散則削之負固不服則侵之賊殺其親則正之放弑其君則殘之犯今陵政則杜之外内亂鳥獸行則滅之傳秋官至時殺正義曰周禮云乃立秋官司宼使帥其屬而掌邦禁以佐王刑邦國其職云刑邦國詰四方馬融云詰猶窮也窮四方之姦也孔以詰爲治是主宼賊法禁治姦慝之人刑殺其強暴作亂者夏官主征伐秋官主刑殺征伐亦殺人而官屬異時者夏司馬討惡助夏時之長物秋司宼刑姦順秋時之殺物也周禮云掌邦刑此云掌邦禁者避下刑暴亂之文故云掌邦禁傳冬官至曰土正義曰周禮冬官亡小宰職云六曰冬官掌邦事又云六曰事職以富邦國以養萬民馬融云事職掌百工器用耒耜弓車之屬與此主土居民全不相當冬官旣亡不知其本禮記王制記司空之事云量地以制邑度地以居民足明冬官本有主土居民之事也齊語云管仲制法令士農工商四民不雜即比居民使順天時分地利授之土也土則地利爲之名以其吐生百穀故曰土也周禮云事此云土者爲下有居四民故云土以居民爲急故也六年至黜陟正義曰此篇說六卿職掌皆與周禮符同則六年五服一朝亦應是周禮之法而周禮無此法也周禮大行人云侯服歳一見其貢祀物甸服二歳一見其貢嬪物男服三歳一見其貢器物采服四歳一見其貢服物衞服五歳一見其貢材物要服六歳一見其貢貨物先儒說周禮者皆云見謂來朝也必如所言則周之諸侯各以服數來朝無六年一朝之事昭十三年左傳叔向云明王之制使諸侯歳聘以志業閒朝以講禮再朝而㑹以示威再㑹而盟以顯昭明自古巳來未之或失也存亡之道恒由是興說左傳者以爲三年一朝六年一㑹十二年而盟事與周禮不同謂之前代明王之法先儒未甞措意不知異之所由計彼六年一㑹與此六年五服一朝事相當也再會而盟與此十二年王乃時巡諸侯各朝於方岳亦相當也叔向盛陳此法以懼齊人使盟若周無此禮叔向妄說齊人當以辭拒之何所畏懼而敬以從命乎且云自古以來未之或失則當時猶尚行之不得爲前代之法脅當時之人明矣明周有此法禮文不具爾大行人所云見者皆言貢物或可因貢而見何必見者皆是君自朝乎遣使貢物亦應可矣大宗伯云時見曰㑹殷見曰同時見殷見不云年限時見曰㑹何必不是再朝而㑹乎殷見曰同何必不是再㑹而盟乎周公制禮若無此法豈成王謬言叔向妄說也計六年大集應六服俱來而此文惟言五服孔以五服爲侯甸男采衞蓋以要服路逺外逼四夷不必常能及期故寛言之而不數也傳周制至守然正義曰周禮大行人云十有二歳王巡守殷國是周制十二年一巡守也如舜典所云春東夏南秋西冬北以四時巡行故云時巡考正制度禮法于四岳之下如虞帝巡守然據舜典同律度量衡已下皆是也王曰至厥官正義曰王言而歎曰嗚呼凡我有官之君子謂大夫巳上有職事者汝等皆敬汝所主之職事愼汝所出之號令令出於口惟即行之不惟反之而不用是去而後反也爲政之法以公平之心滅已之私欲則見下民其信汝而歸汝矣學古之典訓然後入官治政論議時事必以古之制度如此則政敎乃不迷錯矣其汝爲政當以舊典常故事作師法無以利口辯佞亂其官敎之以居官爲政之法也傳有官至之道正義曰敎之出令使之號令在下則是尊官故知有官君子是大夫已上也下云三事曁大夫是也安危在於出令故愼汝出令是從政之本也令旣出口必須行之令而不行是去而更反故謂之反也不惟反者令其必行之勿使反也若前令不行而倒反別出後令以改前令二三其政則在下不知所從是亂之道也傳言當至迷錯正義曰襄三十一年左傳子産云我聞學而後入政未聞以政學者也言將欲入政先學古之訓典觀古之成敗擇善而從之然後可以入官治政矣几欲制斷當今之事必以古之義理議論量度其終始合於古義然後行之則其爲之政敎乃不迷錯也蓄疑至後艱正義曰又戒羣臣使彊於割斷勤於職事蓄積疑惑不能彊斷則必敗其謀慮怠惰忽略不能恪勤則荒廢政事人而不學如面向牆無所覩見以此臨事則惟煩亂不能治理戒汝卿之有事者功之髙者惟志意彊正業之大者惟勤力在公惟能果敢決斷乃無有後日艱難言多疑必将致後患矣申說蓄疑敗謀也傳爲德至可爲正義曰爲德者自得於已直道而行無所經營於心逸豫功成則譽顯而名益美也爲僞者行違其方枉道求進思念欺巧於心勞苦詐窮則道屈而事日益拙也以此故僞不可爲申說無載爾僞也成王至之命正義曰成王即政之初東夷背叛成王旣伐而服之東北逺夷其國有名肅愼氏者以王戰勝逺來朝賀王賜以財賄使榮國之伯爲䇿書以命肅愼之夷嘉其慶賀慰其勞苦之意史敘其事作賄肅愼之命名篇也傳海東至來賀正義曰成王伐淮夷滅徐奄指言其國之名此傳言東夷非徒淮水之上夷也故以爲海東諸夷駒麗扶餘馯貃之屬此皆於孔君之時有此名也周禮職方氏四夷之名八蠻九貉鄭玄云北方曰貉又云東北夷也漢書有髙駒麗扶餘韓無此馯馯即彼韓也音同而字異爾多方云王來自奄奄在後滅言滅奄即來必非滅奄之後更伐東夷夷在海東路逺又不得先伐逺夷後來滅奄此云成王旣伐東夷不知何時伐之魯語云武王克商遂通道於九夷八蠻於是肅愼氏來賀貢楛矢則武王之時東夷服也成王即政奄與淮夷近者尚叛明知逺夷亦叛蓋成王親伐淮夷而滅之又使偏師伐東夷而服之君統臣功故言王伐不是成王親自伐也肅愼之於中國又逺於所伐諸夷見諸夷旣服故懼而來賀也傳榮國至夷亡正義曰晉語云文王諏於蔡原訪於辛尹重之以周召畢榮於文王之時名次畢公之下則是大臣也未知此時榮伯是彼榮公以否或是其子孫也同姓諸侯相傳爲然注國語者亦云榮周同姓不知時爲何官故並云卿大夫王使榮伯明使之有所作史録其篇名爲賄肅愼之命明是王使之爲命書以幣賜肅愼氏之夷也周公至亳姑正義曰周公旣致政於王歸在豐邑將没遺言欲得葬於成周以成周是已所營示己終始念之故欲葬焉及公薨成王葬於畢以文武之墓在畢示已不敢臣周公使近文武之墓王以葬畢之義告周公之柩又周公徙奄君於亳姑因言亳姑功成史敘其事作亳姑之篇案帝王丗紀云文武葬於畢畢在杜南晉書地道記亦云畢在杜南與畢陌別俱在長安西北傳致政老歸正義曰周公旣還政成王成王又留爲太師今言周公在豐則是去離王朝又致太師之政告老歸於豐如伊尹之告歸也成王封伯禽於魯以爲周公後公老不歸魯而在豐者文十三年公羊傳云周公曷爲不之魯欲天下之一乎周也何休云周公聖人德至重功至大東征則西國怨西征則東國怨嫌之魯恐天下迴心趣向之故封伯禽命使遥供養死則奔喪爲主所以一天下之心于周室是言周公不歸魯之意也歸豐者蓋以先王之都欲近其宗廟故也傳周公至成亡正義曰序說葬周公之事其篇乃名亳姑篇名與序不相允㑹其篇旣亡不知所道故傳原其意而爲之說上篇將遷亳姑序言成王旣踐奄將遷其君於亳姑者是周公之意今告周公之柩以葬畢之義乃用亳姑爲篇名必是告葬之時并言及奄君巳定於亳姑言周公所遷之功成故以名篇也君陳第二十三周公至君陳正義曰周公遷殷頑民於成周頑民旣遷周公親自監之周公旣没成王命其臣名君陳代周公監之分別居處正此東郊成周之邑以䇿書命之史録其事作䇿書爲君陳篇名傳成王至官司正義曰成周周之下都監成周者正是一邑宰爾而特命君陳大其事者成王重周公所營猶恐殷民有不服之者故命君陳分居正東郊成周之邑里官司也以畢命之序言分居知此分亦爲分居分別殷民善惡所居即畢命所云旌别淑慝表厥宅里是也言東郊者鄭玄云天子之國五十里爲近郊今河南洛陽相去則然是言成周之邑爲周之東郊也傳臣名至名篇正義曰孔直云臣名則非周公子也鄭玄注中庸云君陳蓋周公子者以經云周公旣没命君陳猶若蔡叔旣没命蔡仲故也孔未必然矣傳言其至以恭正義曰令德在身之大名孝是事親之稱恭是身之所行言其善事父母行已以恭也釋訓云善父母爲孝善兄弟爲友傳言善至政令正義曰父母尊之極兄弟親之甚縁其施孝於極尊乃能施友於甚親言善事父母者必友於兄弟推此親親之心以至於踈逺每事以仁恕行之故能施有政令也我聞至逸豫正義曰我聞人之言曰有至美治之善者乃有馨香之氣感動於神明所言馨香感神者黍稷飲食之氣非馨香也明德之所逺及乃惟爲馨香爾勉勵君陳使爲德也欲必爲明德惟法周公汝當庶幾用是周公之道惟當每日孜孜勤法行之無敢自寛暇逸豫敎使勤於事也王曰至不宥正義曰王呼之曰君陳汝今爲政當弘大周公之大訓周公旣有大訓汝當遵而行之使其法更寛大汝奉周公之訓無得依恃形勢以作威於人無得倚附法制以行刻削百姓必當寛容而有法制使踈而不漏從容以和協於物莫爲褊急此成周殷民有犯事在於刑法未斷決者我告汝曰刑罰之汝惟勿得刑罰之我告汝曰赦宥之汝惟勿得赦宥之惟其以中正平法斷決之不得從上意也其有不順於汝之政今不化於汝之訓教其罪旣大當行刑中刑罰一人可以止息後犯者故云犯刑者乃刑之如其罪或輕細罰不當理雖刑勿息故不可輒刑若有人習於姦宄凶惡敗五常之道亂風俗之敎三犯其事者事雖細小勿得宥之以其知而故犯當殺之以絶惡源也傳汝爲至之政正義曰君陳之智必不及周公而令闡大周公訓者遵行其法使廣被於民即是闡揚而大之非遣君陳爲法使大於周公法也凡在人上位貴於人勢足可畏者多乗是形勢以作威刑於人倚附公法以行刻削之政故禁之也傳寛不至之治正義曰寛不失制則經寛而有制動不失和則經從容以和言動謂從容也傳習於至惡源正義曰釋言云狃復也孫炎曰狃忲前復爲也古言狃怵是慣習之義故以習解狃習於姦宄凶惡言爲之不知止也敗常亂俗有大有小罪雖小者三犯不赦恐其滋大所以絶惡源也此謂所犯小事言三者再猶可赦爾爾無至不良正義曰民者冥也當以漸敎之故戒君陳民有不知道者汝無忿怒疾惡頑嚚之民當以漸敎訓之無求備於一人當取其所能在爲人君長必有所含忍其事乃有所成有所寛容其德乃能大欲其寛大不褊隘也汝之爲政須知民之善惡簡別其德行修者亦簡別其有不修德行者進顯其賢良以率勵其不良者欲令其化惡使爲善也惟民至永丗正義曰惟民初生自然之性皆敦厚矣因見所習之物本性乃有遷變爲惡皆由習效使然人之情性好違上所命命之不必從也從其君所好君之所好民必從之在上者不可不愼所好也汝之治民能敬當從終常在於道德敎之汝以道德敎之是民乃無不變化民皆變從汝化則信升於大道矣汝能如此惟我一人亦當受其多福無凶危矣其汝之美名亦終有稱誦之美辭於長丗矣尚書正義卷第十七計一萬三千四百五十一字
