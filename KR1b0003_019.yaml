  text: 尚書正義卷第十九
  hash: sha256:7eed41aff5c8aa34e42e04a43ddcb7f423d18d8ce46114a9f3cc176461f86cb3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_019-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰周書君牙第二十七冏命第二十八吕刑第二十九君牙第二十七穆王至君牙正義曰穆王命其臣名君牙者為周大司徒之卿以䇿書命之史録其䇿書作君牙傳言汝至太常正義曰周禮司勳云凡有功者銘書於王之太常祭於大蒸鄭玄云銘之言名也生則書于王旌以識其人與其功也死則於蒸先王祭之是有功者書於王之太常以表顯之也周禮司常云日月為常王建太常是王之旌旗畫日月名之曰太常也今命至乃寧正義曰王言我以危懼之故今命汝為我輔翼汝當作我股肱心膂言將任之如已身也繼汝先丗舊所服行亦如父祖忠勤無為不忠辱纍汝祖考當須大布五常之教用和天下兆民令有法則凡欲率下當先正身汝身能正則下無敢不正民心無能中正惟取汝之中正汝當為中正以率之夏月大暑大雨天之常也小民惟曰怨恨而咨嗟冬月大寒亦天之常也小民亦惟曰怨恨而咨嗟天不可怨民尚怨之治民欲使無怨其惟難哉思慮其難以謀其易為政不違道不逆民民乃安矣傳今命至委任正義曰股腳也肱臂也膂背也汝為我輔翼當如我之身故舉四支以言為股肱心體之臣言委任如身也傳以膂為體以見四者皆體非獨膂為體也禮記緇衣云民以君為心君以民為體此舉四體今以臣為心者君臣合體則亦同心詩云赳赳武矢公侯腹心是臣亦為君心也傳冬大至怨嗟正義曰傳以祁為大故云冬大寒寒言大則夏暑雨是大雨於此言祁以見之上言暑雨此不言寒雪者於上言雨以見之互相備也嗚呼至前人正義曰王又歎言嗚呼大是顯明哉文王之謀也大可承奉哉武王之業也文王之謀武王之業開道佑助我在後之人皆以正道無邪缺言先王之道易可遵也汝惟敬明汝之五教用奉順於先王之道汝當答揚文武光明之命追配於前丗令名之人令其順先王之道同古之大賢也傳言武至承奉正義曰文王未克殷始謀造周故美其謀武王以殺紂功成業就故美其業謀則明白可遵業則功成可奉故謀言顯烈言承詩周頌武篇曰於皇武王無競維烈亦美武王業之木也傳文武至邪缺正義曰文始謀之武卒成之文謀大明武業可奉言先王以此成功開道佑助我之後人使我得安其事而奉行之以正道見其無邪罔缺失見其周備故傳言無邪缺王若至有乂正義曰王順而呼之曰君牙汝為大司徒惟當奉用先丗正官之法諸臣所行故事舊典於是法則之民之治亂在此而巳汝必奉而用之循汝祖考之所行明汝君之有治功汝君王自謂也囧命第二十八穆王至囧命正義曰穆王命其臣名伯囧者為周太僕正之官以䇿書命之史録其䇿書作囧命傳伯囧至大夫正義曰正訓長也周禮太御中大夫太僕下大夫孔以此言太僕正則官髙於太僕故以為周禮太御者知非周禮太僕若是周禮太僕則此云太僕是矣何須云正乎且此經云命汝作大正正于羣僕案周禮太馭中大夫而下有戎僕齊僕道僕田僕太御最為長既稱正于羣僕故以為太御中大夫且與君同車最為親近故春秋隨侯寵少師以為車右漢書文帝愛趙同命之為御凡御者最為密昵故此經云汝無昵於憸人充耳目之官故以為太御中大夫掌御玉輅之官戎僕雖中大夫以戎事為重敘在太御之下故以太御為長大僕雖掌燕朝非親近之任又是下大夫不得為長王若至咸休正義曰王順其事而呼之曰伯囧惟我不能於道德而繼嗣先人居大君之位人輕任重終常悚懼心內怵惕惟恐傾危中夜以起思望免其愆過昔在文王武王聰無所不間明無所不見齊中也每事得中聖通也通知諸事其身明聖如此又小大之臣無不皆思忠良其左右侍御僕從無非中正之人以旦夕承輔其君故其君出入起居無有不敬文武發號施令無有不善以此之故下民敬順其命萬邦皆美其化由臣善故也傳言常至過悔正義曰禮記祭義云春雨露既濡君子履之必有怵惕之心怵惕是心動之名多憂懼之意也厲訓危也言常悚懼惟恐傾危易稱夕惕若厲即此義也傳聰明至忠良正義曰聰發於耳明發於目故為視聽逺也齊訓中聖訓通也動必得中通而先識是無滯礙也惟豫至先烈正義曰王言惟我一人無善亦既無知實恃賴左右前後有職位之臣匡正其智所不及者責羣臣使正己也即言正己之事繩其愆過糾其錯謬格其非妄之心心有妄作則格正之使能繼先王之功業言得臣匡輔乃可繼丗也傳言恃至功業正義曰木不正者以繩正之繩謂彈正糾謂發舉有愆過則彈正之有錯謬則發舉之格謂檢括其有非理枉妄之心檢括使妄心不作臣當如此匡君使能繼先王之功業言已無能責臣使如此也今豫至吉士正義曰今我命汝作太僕官大正汝當教正於羣僕侍御之臣勸勉汝君為德汝與同僚交更修進汝君智所不及之事汝為僕官之長當愼簡汝之僚屬必使皆得正人無得用巧言令色便僻側媚之人其惟皆當用吉良善士令選其在下屬官小臣僕隸之等皆用善人傳欲其至佞偽正義曰作大正正長也作僕官之長正於羣僕令教正之二正義不同也羣僕雖官有小大皆近天子近人主者多以諂佞白容令大僕教正羣僕明使教之無敢佞偽也案周禮太馭中大夫堂御玉輅戎僕中大夫掌御戎車齊僕下大夫掌馭金輅道僕上士掌馭象輅田僕上士掌馭田輅羣僕謂此也傳當謹至正士正義曰府史巳下官長所自辟除命士以上皆應人主自選此令太僕正謹愼簡選僚屬者人主所用皆由臣下臣下銓擬可者然後用之故令太僕正愼簡僚屬也論語稱巧言令色足恭左丘明恥之便僻是巧言令色之類知是彼足恭也巧言者巧為言語以順從上意無情實也令色者善為顔色以媚説人主無本質也便僻者前却俯仰以足為恭側媚者為僻側之事以求媚於君此等皆是諂諛之人不可用為近官也媚愛也襄三十一年左傳云鄭子産謂子皮曰誰敢求愛於子知此為側媚者為側行以求愛非是愛前人也若能愛在上則忠臣也不當禁其無用吕刑第二十九吕命至吕刑正義曰吕侯得穆王之命為天子司寇之卿穆王於是用以侯之言訓暢夏禹贖刑之法吕侯稱王之命而布告天下史録其事作吕刑傳吕侯至司寇正義曰吕侯得王命必命為王官周禮司寇掌刑知吕侯見命為天子司寇鄭玄云吕侯受王命入為三公引書説云周穆王以吕侯為相書説謂書緯刑將得放之篇有此言也以其言相知為三公即如鄭言當以三公領司寇不然何以得專王刑也傳吕侯至天下正義曰名篇謂之吕刑其經皆言王曰知吕侯以穆王命作書也經言陳罰贖之事不言何代之禮故序言訓夏以明經是夏法王者代相革易刑罰丗輕丗重殷以變夏周又改殷夏法行於前代廢巳久矣今復訓暢夏禹贖刑之法以周法傷重更從輕以布告天下以其事合於當時故孔子録之以為法經多説治獄之事是訓釋申暢之也金作贖刑唐虞之法周禮職金掌受士之金罰貨罰入于司兵則周亦有贖刑而逺訓夏之贖刑者周禮惟言士之金罰人似不得贖罪縱使亦得贖罪贖必異於夏法以夏刑為輕故祖而用之罪實則刑之罪疑則贖之故當並言贖刑非是惟訓贖罰也周禮司刑掌五刑之法以麗萬民之罪墨罪五百劓罪五百宫罪五百刖罪五百殺罪五百五刑惟有二千五百此經五刑之屬三千案刑數乃多於周禮而言變從輕者周禮五刑皆有五百此則輕刑少而重刑多此經墨劓皆千剕刑五百宫刑三百大辟二百輕刑多而重刑少變周用夏是改重從輕也然則周公聖人相時制法而使刑罰太重令穆王改易之者穆王逺取夏法殷刑必重於夏夏承堯舜之後民淳易治故制刑近輕輕則民慢故殷刑稍重自湯巳後丗漸苛酷紂作炮烙之刑明知刑罰益重周承暴虐之後不可頓使太輕雖減之輕猶重於夏法成康之間刑措不用下及穆王民猶易治故吕侯度時制冝勸王改從夏法聖人之法非不善也而不以經逺吕侯之智非能髙也而法可以適時苟適於時事即可為善亦不言吕侯才髙於周公法勝於前代所謂觀民設教遭時制冝刑罰所以世輕丗重為此故也傳後為至甫刑正義曰禮記書傳引此篇之言多稱為甫刑曰故傳解之後為甫侯故或稱甫刑知後為甫侯者以詩大雅嵩髙之篇宣王之詩云生甫及申揚之水為平王之詩云不與我戍甫明子孫改封為甫侯不知因吕國改作甫名不知別封餘國而為甫號然子孫封甫穆王時未有甫名而稱為甫刑者後人以子孫之國號名之也猶若叔虞初封於唐子孫封晉而史記稱晉丗家然宣王以後改吕為甫鄭語史伯之言幽王之時也乃云申吕雖衰齊許猶在仍得有吕者以彼史伯論四嶽治水其齊許申吕是其後也因上申吕之文而云申吕雖衰吕即甫也惟吕至四方正義曰惟吕侯見命為卿於時穆王享有周國巳積百年王精神耄亂而荒忽矣王雖老耄猶能用賢取吕侯之言度時丗所冝作夏贖刑以治天下四方之民也傳言吕至揚名正義曰史述吕侯見命而記王年知其得命之時王以享國百年也曲禮云八十九十曰耄是耄荒為年老精神耄亂荒忽也穆王即位之時巳年過四十矣比至命吕侯之年未必巳有百年言百年者美大其事雖則年老而能用賢以揚名故記其百年之耄荒也周本紀云甫侯言於王作修刑辟是修刑法者皆吕侯之意美王能用之穆王即位過四十者不知出何書也周本紀云穆王即位春秋巳五十矣立五十五年崩司馬遷若在孔後或當各有所據無逸篇言殷之三王及文王享國若干年者皆謂在位之年此言享國百年乃從生年而數意在美王年老能用賢而言其長壽故舉從生之年以耄荒接之美其老之意也文不害意不與彼同王曰至在下正義曰吕侯進言於王使用輕刑又稱王之言以告天下説重刑害民之義王曰順古道有遺餘典訓記法古人之事昔炎帝之末有九黎之國君號蚩尤者惟造始作亂惡化遞相染易延及於平善之民平民化之亦變為惡無有不相寇盜相賊害為鴟梟之義鈔掠良善外姦內宄劫奪人物攘竊人財矯稱上命以取人財若已固自有之然蚩尤之惡巳如此矣至於髙辛氏之末又有三苗之國君習蚩尤之惡不肯用善化民而更制重法惟作五虐之刑乃言曰此得法也殺戮無罪之人於是始大為四種之刑刵截人耳劓截人鼻劅椓人隂黥割人面苗民於此施刑之時并制無罪之人對獄有罪者無辭無罪者有辭苗民斷獄並皆罪之無差簡有直辭者言濫及無罪者也三苗之民慣瀆亂政起相漸染皆化為惡泯泯為亂棼棼同惡小大為惡民皆巧詐無有中于信義以此無中于信反背詛盟之約雖有要約皆違背之三苗虐政作威衆被戮者方方各告無罪於上天上天下視苗民無有馨香之行其所以為德刑者發聞於外惟乃皆腥臭無馨香也君帝帝堯哀矜衆被殺戮者不以其罪乃報為暴虐者以威止絶苗民使無丗位在於下國言以刑虐故滅之也得同也九黎之文惟出楚語孔以蚩尤為九黎下傳又云蚩尤黃帝所滅言黃帝所滅則與史記同矣孔非不見楚語而為此説蓋以蚩尤是九黎之君黃帝雖滅蚩尤猶有種類尚在故下至少昊之末更復作亂若其不然孔意不可知也鄭玄云學蚩尤為此者九黎之君在少昊之代也其意以蚩尤當炎帝之末九黎當少昊之末九黎學蚩尤九黎非蚩尤也傳平民至之甚正義曰蚩尤作亂當是作重刑以亂民以峻法酷刑民無所措手足困於苛虐所酷人皆苟且故平民化之無有不相寇賊羣行攻劫曰寇殺人曰賊言攻殺人以求財也鴟梟貪殘之鳥詩云為梟為鴟梟是鴟類鄭玄云盜賊狀如鴟梟鈔掠良善劫奪人物傳言鴟梟之義如鄭説也釋詁云虔固也若固有之言取得人物如己自有也傳三苗至同惡正義曰上説蚩尤之惡即以苗民繼之知經意言三苗之君習蚩尤之惡靈善也不用善化民而制以重刑學蚩尤制之用五刑而虐為之故為五虐之刑不必皋陶五刑之外別有五也曰法者述苗民之語自謂所作得法欲民行而畏之如史記之文蚩尤黃帝所滅下句所説三苗帝堯所誅楚語云三苗復九黎之惡是異丗而同惡也鄭玄以為苗民即九黎之後顓頊誅九黎至其子孫為三國髙辛之衰又復九黎之惡堯興又誅之堯末又在朝舜臣堯又竄之後禹攝位又在洞庭逆命禹又誅之穆王深惡此族三生凶德故著其惡而謂之民孔惟言異丗同惡不言三苗是蚩尤之子孫韋昭云三苗炎帝之後諸侯共工也傳三苗至五虐正義曰三苗之主實國君也頑凶若民故謂之苗民不於上經為傳者就此惡行解之以其頑凶敢行虐刑以殺戮無罪釋詁云淫大也於是大為截人耳鼻椓隂黥面苗民為此刑也椓隂即宫刑也黥面即墨刑也康誥周公戒康叔云無或劓刵人即周出有劓刵之刑非苗民別造此刑也以加無辜故曰五虐鄭玄云刵斷耳劓截鼻椓謂椓破隂黥為羈黥人面苗民大為此四刑者言其特深刻異於皋陶之為鄭意蓋謂截耳截鼻多截之椓隂苦於去勢黥面甚於墨額孔意或亦然也傳三苗至之約正義曰三苗之民謂三苗國內之民也瀆謂慣瀆苗君久行虐刑民慣見亂政習以為常起相漸化泯泯相似之意棼棼擾攘之狀泯泯為亂習為亂也棼棼同惡共為惡也中猶當也皆無中於信義言為行無與信義合者詩云君子屢盟亂是用長亂丗之民多相盟詛既無信義必背違之以此無中於信反背詛盟之約也傳三苗至腥臭正義曰方方各告無罪於上天言其處處告也天矜於下俯視苗民無有馨香之行馨香以喻善也其所以為德刑苗民自謂是德刑者發聞於外惟乃皆是腥臭腥臭喻惡也傳君帝至下國正義曰釋詁云皇君也此言遏絶苗民下句即云乃命重黎重黎是帝堯之事知此滅苗民亦帝堯也此滅苗民在堯之初興使無丗位在於下國而堯之末年又有竄三苗者禮天子不滅國擇立其次賢者此為五虐之君自無丗位在下其改立者復得在朝但此族數生凶德故歷代每被誅耳乃命至惟明正義曰三苗亂德民神雜擾帝堯既誅苗民乃命重黎二氏使絶天地相通令民神不雜於是天神無有下至地地民無有上至天言天神地民不相雜也羣后諸侯相與在下國羣臣皆以明明大道輔行常法鰥寡皆得其所無有掩蓋之者君帝帝堯淸審詳問下民所患鰥寡皆有辭怨於苗民言誅之合民意堯視苗民見怨則又增修其德以德行威則民畏之不敢為非以德明人人皆勉力自修使德明言堯所行賞罰得其所也傳重即至相干正義曰楚語云昭王問於觀射父曰周書所謂重黎實使天地不通者何也若無然氏將能登天乎對曰非此之謂也古者民神不雜少昊氏之衰也九黎亂德家為巫史民神同位禍災荐臻顓頊受之乃命南正重司天以屬神命火正黎司地以屬民使復舊常無相侵瀆是謂絶地天通其後三苗復九黎之德堯復育重黎之後不忘舊者使復典之彼言主説此事而堯典云乃命羲和欽若昊天即所謂育重黎之後使典之也以此知重即羲也黎即和也言羲是重之子孫和是黎之子孫能不忘祖之舊業故以重黎言之傳言堯乃命羲和掌天地四時之官堯典文也民神不擾是謂絶地天通楚語文也孔惟加各得其序一句耳楚語又云司天屬神司地屬民令神與天在上民與地在下定上下之分使民神不雜則祭享有度災厲不生經言民神分別之意故言罔有降格言天神無有降至於地者謂神不干民孔因互文云地民不有上至於天者言民不干神也乃揔之云明不相干即是民神不雜也地民或作地祇學者多聞袖祇又民字似祇因妄改使謬耳如楚語云乃命重黎是顓頊命之鄭玄以皇帝哀矜庶戮之不辜至罔有降格皆説顓頊之事乃命重黎即是命重黎之身非羲和也皇帝淸問以下乃説堯事顓頊與堯再誅苗民故上言遏絶苗民下云有辭於苗異代別時非一事也案楚語云少昊氏之衰也九黎亂德又云其後三苗復九黎之德則九黎三苗非一物也顓頊誅九黎謂之遏絶苗民於鄭義為不愜楚語言顓頊命重黎解為帝堯命羲和於孔説又未允不知二者誰得經意也傳言堯至名焉正義曰此經二句説帝堯之德事也而其言不順文在苗民之下故傳以為堯監苗民之見怨則又增修其德敦德以臨之以德行其威罰則民畏之而不敢為非明賢則德明人者若凡人雖欲以德明賢者不能照察今堯德明賢者則能以德明識賢人故皆勸慕為善明與上句相互則德威者凡人雖欲以德行威不能威肅今堯行威罰則能以德威罰罪人故人皆畏威服德也乃命至祗德正義曰堯既誅苗民乃命三君伯夷禹稷憂施功於民使伯夷下禮典教民折斷下民惟以典法伯禹身平治水土主名天下山川其無名者皆與作名后稷下教民布種在於農畝種殖嘉榖三君者各成其功惟以殷盛於民使民衣食充足乃使士官制御百官之姓於刑之中正以教民為敬德言先以禮法化民民既富而後教之非苟欲刑殺也傳伯夷至於民正義曰伯夷與稷言降禹不言降降可知降下也從上而下於民也舜典伯夷主禮典教民而斷以法即論語所謂齊之以禮也山川與天地並生民應先與作名但禹治洪水萬事改新古老既死其名或滅故當時無名者禹皆主名之言此者以見禹治山川為民於此耕稼故也此三事者皆是為民故傳既解三事乃結上句此即所謂堯命三君憂功於民憂欲與民施功也此三事之次當禹功在先先治水土乃得種榖民得榖食乃能行禮管子云衣食足知榮辱倉廩實知禮節是言足食足衣然後行禮也此經先言伯夷者以民為國之本禮是民之所急將言制刑先言用禮刑禮相須重禮故先言之也傳言伯至敬德正義曰此經大意言禹稷教民使衣食充足伯夷道民使知禮節有不從教者乃以刑威之故先言三君之功乃説用刑之事言禹稷教民稼穡衣食既巳充足伯夷道民典禮又能折之以法禮法既行乃使皋陶作士制百官於刑之中令百官用刑皆得中正使不僭不濫不輕不重助成道化以教民為敬德言從伯夷之法敬德行禮也穆穆至棐彞正義曰言堯躬行敬敬之道在於上位三后之徒躬秉明德明君道在於下君臣敬明其德灼然著於四方故天下之士無不惟德之勤悉皆勤行德矣天下之士皆勤立德故乃能明於用刑之中正循大道以治於民輔成常教美堯君臣明德能用刑得中以輔禮教傳堯躬至之勤正義曰釋訓云穆穆敬也明明重明則穆穆重敬當敬天敬民在於上位也明明在下則是臣事知是三后之徒秉明德明君道於下也彰著于四方四方皆法效之故天下之士無不惟德之勤傳天下至常教正義曰刑者所以助教而不可專用非是身有明德則不能用刑以天下之大萬方之衆必當盡能用刑天下乃治此美堯能使天下皆勤立德故乃能明於用刑之中正言天下皆能用刑盡得中正循治民之道以治於民輔成常教伯夷所典之禮是常行之教也典獄至在下正義曰堯時典獄之官非能止絶於威有犯必當行威威刑不可止也惟能止絶於富受貨然後得富無貨富自絶矣言於時丗治貨賂不行堯時典獄之官皆能敬其職事忌其過失無有可擇之言在於其身天德平均惟能為天之德志性平均自為長久大命配當天意在於天下言堯德化之深於時典獄之官皆能賢也傳言堯至不行正義曰堯時主獄之官有威嚴有德行有恕心有犯罪必罪之是有威也無罪則赦之是有德也有威有德有恕心行之不受貨賂是恕心也訖是盡也故傳以訖為絶不可能使民不犯非絶於威能使不受貨賂惟絶於富言以恕心行之丗治則貨賂不行故獄官無得富者傳凡明至天下正義曰惟克天德言能效天為德當謂天德平均獄官效天為平均凡能明於刑之中正矣又能使無可擇之言在身者此人必是惟能為天平均之德斷獄必平矣皇天無親惟德是輔若能斷獄平均者必壽長久大命大命由己而來是自為大命享訓當也是此人能配當天命在於天之下鄭云大命謂延期長久也王曰至厥丗正義曰王呼諸侯戒之曰咨嗟汝四方主政事典獄訟者諸侯之君等非汝惟為天牧養民乎言汝等皆為天養民言任重也受任既重當觀古成敗今汝何所監視乎其所視者非是伯夷布刑之道也言當效伯夷善布刑法受令名也其今汝何所懲創乎其所創者惟是苗民非察於獄之施刑乎言當創苗民施刑不當取滅亡也彼苗民之為政也無肯選擇善人使觀視於五刑之中正惟是衆為威虐者任之以奪取人之貨賂任用此人使斷制五刑以亂加無罪之人上天不潔其所為故下咎惡於苗民苗民無以辭於天罰堯乃絶滅其丗汝等安得不懲創乎傳言當至法之正義曰伯夷典禮皋陶主刑刑禮相成以為治不使視皋陶而今視伯夷者欲其先禮而後刑道之以禮禮不從乃刑之則刑亦伯夷之所布故令視伯夷布刑之道而法之王肅云伯夷道之以禮齊之以刑傳其今至滅亡正義曰上言非時此言惟時文異者非時者言豈非是事也惟時者言惟當是事也雖文異而意同惟是苗民非察於獄之施刑以取滅亡也言其正謂察於獄之施刑不當於罪以取滅亡傳苗民至誅之正義曰以亂加無罪者正謂以罪加無罪是亂也蠲訓潔也天不潔其所為者鄭玄云天以苗民所行腥臊不潔故下禍誅之王曰至惟永正義曰王言而歎曰嗚呼汝等諸侯其當念之哉念以伯夷為法苗民為戒既令念此法戒又呼同姓諸侯曰伯父伯兄仲叔季弟幼子童孫等汝皆聽從我言依行用之庶幾有至善之命命必長壽也今汝等諸侯無不用安道以自居曰我當勤之哉汝己許自勤即當必勤汝無有徒念我戒許欲自勤而身竟不勤戒使必自勤也上天欲整齊於下民使我為之令我為天子整齊下民也我一日所行失其道非為天所終一日所行得其理惟為天所終此事皆在人所行言已當愼行以順天也我已兾欲順天汝等當庶幾敬逆天命以奉用我一人之戒汝所行事雖見畏勿自謂可敬畏雖見美勿自謂有德美欲令其謙而勿自取也汝等惟當敬愼用此五刑以成剛柔正直之三德以輔我天子我天子一人有善事則億兆之民蒙賴之若能如此其乃安寧惟久長之道也傳皆王至至命正義曰此揔告諸侯不獨告同姓知舉同姓包異姓也格訓至也言庶幾有至命至命當謂至善之命不知是何命也鄭玄云格登也登命謂壽考者傳云至命亦謂壽考傳今汝至不勤正義曰由用也慰安也人之行事多有始無終從而不改王既殷勤教誨恐其知而不行或當日欲勤行而中道倦怠故以此言戒之今汝等諸侯無不用安道以自居言曰我當勤之安道者謂勤其職是安之道若不勤其職是危之道也傳天整至所行正義曰天整齊於下民者欲使之順道依理以性命自終也以民不能自治故使我為之使我為天子我既受天委付務欲稱天之心墜失天命是不為天所終保全祿位是為天所終我一日所行善之與惡非為天所終惟為天所終皆在人所行王言已兾欲使為行稱天意也傳汝當至德美正義曰逆迎也上天授人為主是下天命也諸侯上輔天子是逆天命也言與天意相迎逆也汝當庶幾敬逆天命以奉我一人之戒欲使之順天意而用已命凡人被人畏必當自謂巳有可畏敬被人譽必自謂已實有德美故戒之汝等所行事雖見畏勿自謂可敬畏雖見美勿自謂有德美教之令謙而不自恃也傳先戒至之道正義曰上句雖畏勿畏雖休勿休是先戒以勞謙之德也勞謙易謙卦九三爻辭謙則心勞故云勞謙天子有善以善事教天下則兆民蒙賴之王曰至天威正義曰凡與人言必呼使來前吁歎聲也王歎而呼諸侯曰吁來有邦國有土地諸侯國君等告汝以善用刑之道在於今日汝安百姓兆民之道何所選擇非惟選擇善人乎何所敬愼非惟敬愼五刑乎何所謀度非惟度及丗之用刑輕重所冝乎即教諸侯以斷獄之法凡斷獄者必令囚之與證兩皆來至囚證具備取其言語乃與衆獄官共聽其入五刑之辭其五刑之辭簡核信實有罪則正之於五刑以五刑之罪罪其身也五刑之辭不如衆所簡核不合入五刑則正之於五罰罰謂取其贖也於五罰論之又有辭不服則正之於五過過失可宥則赦宥之從刑入罰從罰入過此五過之所病者惟嘗同官位惟詐反囚辭惟內親用事惟行貨枉法惟舊相往來以此五病出入人罪其罪與犯法者均其當淸證審察能使五者不行乃為能耳五刑之疑有赦赦從罰也五罰之疑有赦赦從過也過則赦之矣其當淸證審察使能之勿使妄入人罪妄得赦免既得囚辭簡核誠信有合衆心或記可刑或皆可放雖云合罪惟更審察其貌有所考合謂貌又當罪乃決斷之無簡不聽者謂雖似罪狀無可簡核誠信合罪者則不聽理其獄當放赦之皆當嚴敬天威勿輕聽用刑也傳在今至冝乎正義曰何度非及其言不明以論刑事而言度所及知所度者度及丗之用刑輕重所冝王肅云度謀也非當與主獄者謀慮刑事度丗輕重所冝也傳兩謂至之辭正義曰兩謂兩人謂囚與證也凡競獄必有兩人為敵各言有辭理或時兩皆須證則囚之與證非徒兩人而已兩人謂囚與證不為兩敵至者將斷其罪必須得證兩敵同時在官不須待至且兩人競理或並皆為囚各自須證故以兩為囚與證也兩至具備謂囚證具足各得其辭乃據辭定罪與衆獄官共聽其辭觀其犯狀斟酌入罪或入墨劓或入宫剕故云聽其入五刑之辭也傳五辭至五刑正義曰既得囚證將入五刑之辭更復簡練核實知其信有罪狀與刑書正同則依刑書斷之應墨者墨之應殺者殺之傳不簡至贖罪正義曰不簡核者謂覆審囚證之辭不如簡核之狀既囚與證辭不相符合則是犯狀不定謂不應五刑不與五刑書同獄官疑不能決則當正之於五罰令其出金贖罪依準五刑疑則從罰故為五罰即下文是也今律疑罪各依所犯以贖論虛實之證等是非之理均或事涉疑似旁無證見或雖有證見事非疑似如此者皆為疑罪傳不服至赦免正義曰不服不應罰者欲令贖罪而其人不服獄官重加簡核無復疑似之狀本情非罪不可強遣出金如是者則正之於五過雖事涉疑似有罪乃是過失過則可原故從赦免下文惟有五刑五罰而無五過亦稱五者緣五罰為過故謂之五過五者之過皆可原也傳五過至所在正義曰釋詁云疵病也此五過之所病皆謂獄吏故出入人罪應刑不刑應罰不罰致之五過而赦免之故指言五過之疵於五刑五罰不赦其罪未有此病故不言五刑之疵五罰之疵應刑而罰亦是其病於赦免言病則赦刑從罰亦是病可知損害王道於政為病故謂之病惟官謂嘗同官位與吏舊同僚也或詐反囚辭拒諱實情不承服也或內親用事囚有親戚在官吏或望其意而曲筆也或行貨於吏吏受財枉法也或囚與吏舊相往來此五事皆是病之所在五事皆是枉法但枉法多是為貨故於貨言枉餘皆枉可知傳以病至不行正義曰以五病所在出入人罪不罰不刑使得在於五過妄赦免之此獄吏之罪與犯法者同諸侯國君淸證審察能使之不行乃為善也此以病所在惟出人罪爾而傳并言入者有罪而妄出與無罪而妄入獄吏之罪等故以出入言之今律故出入者與同罪即此是也傳刑疑至其理正義曰刑疑有赦赦從罰也罰疑有赦赦從免也上云五罰不服正於五過即是免之也不言五過之疑有赦者知過則赦之不得疑也其當淸察能得其理不使應刑妄得罰應罰妄得免也舜典云眚災肆赦大禹謨云宥過無大易解卦象云君子以赦過宥罪論語云赦小過是過失之罪皆當赦放故知過即是赦之鄭玄云不言五過之疑有赦者過不赦也禮記云凡執禁以齊衆者不赦過如鄭此言五罰不服正於五過者五過皆當罪之也五刑之疑赦刑取贖五罰疑者反使服刑是刑疑而輸贖罰疑而受刑不疑而更輕可疑而益重事之顚倒一至此乎謂之祥刑豈當若是然則不赦過者復何所謂執禁以齊衆非謂平常之過失也人君故設禁約將以齊整大衆小事易犯人必輕之過犯悉皆赦之衆人不可復禁是故不赦小過所以齊整衆人令其不敢犯也今律合和御藥誤不如本方御幸舟船誤不牢固罪皆死乏軍興者斬故失等皆是不赦過也傳簡核至之至正義曰簡核誠信有合衆心或皆以為可刑或可以為赦未得即斷之惟當察其囚貌更有所考合考合復同乃從衆議斷之重刑之至也察其貌者即周禮五聽辭聽色聽氣聽耳聽目聽也鄭玄以為辭聽觀其出言不直則煩色聽觀其顔色不直則赧然氣聽觀其氣息不直則喘耳聽觀其聽聆不直則惑目聽觀其眸子視不直則眊然是察其貌有所考合也傳無簡至用刑正義曰無簡核誠信者謂簡核之於罪無誠信效驗可簡核即是無罪之人當赦之傳刻其至相當正義曰五刑之名見於經傳唐虞已來皆有之矣未知上古起在何時也漢文帝始除肉刑其刻顙截鼻刖足割勢皆法傳於先代孔君親見之説文云顙額也墨一名黥鄭玄周禮注云墨黥也先刻其面以墨窒之言刻額為瘡以墨塞瘡孔令變色也六兩曰鍰蓋古語存於當時未必有明文也考工記云戈矛重三鋝馬融云鋝量名當與吕刑鍰同俗儒云鋝六兩為一川不知所出耳鄭玄云鍰稱輕重之名今代東萊稱或以太半兩為鈞十鈞為鍰鍰重六兩太半兩鍰鋝似同也或有存行之者十鈞為鍰二鍰四鈞而當一斤然則鍰重六兩三分兩之二周禮謂鍰為鋝如鄭玄之言一鍰之重六兩多於孔王所説惟校十六銖爾舜典云金作贖刑傳以金為黃金此言黃鐵者古者金銀銅鐵揔號為金今別之以為四名此傳言黃鐵舜典傳言黃金皆是今之銅也古人贖罪悉皆用銅而傳或稱黃金或言黃鐵謂銅為金為鐵爾閲實其罪檢閲核實其所犯之罪使與罰名相當然後收取其贖此既罪疑而取贖疑罪不定恐受贖參差故五罰之下皆言閲實其罪慮其不相當故也傳刖足至百鍰正義曰釋言云剕刖也李巡云斷足曰刖説文云刖絶也是刖者斷絶之名故刖足曰剕贖劓倍墨剕應倍劓而云倍差倍之又有差則不啻一倍也下句贖宮六百鍰知倍之又半之為五百鍰也截鼻重於黥額相校猶少刖足重於截鼻所校則多刖足之罪近於官刑故使贖剕不啻倍劓而多少近於贖宫也傳宫淫至之冝正義曰伏生書傳云男女不以義交者其刑宫是宫刑為淫刑也男子之隂名為勢割去其勢與椓去其隂事亦同也婦人幽閉閉於宫使不得出也本制宮刑主為淫者後人被此罪者未必盡皆為淫昭五年左傳楚子以羊舌肸為司宫非坐淫也漢除肉刑除墨劓剕耳宫刑猶在近代反逆緣坐男子十五巳下不應死者皆宮之大隋開皇之初始除男子宮刑婦人猶閉於宫宫是次死之刑宫於四刑為最重也人犯輕刑者多犯重刑者少又以鍰數以倍相加序五刑先輕後重取事之冝傳死刑至制也正義曰釋詁云辟罪也死是罪之大者故謂死刑為大辟經歷陳罰之鍰數五刑之疑各自入罰不降相因不合死疑入宫宫疑入剕者是古之制也所以然者以其所犯疑不能決故使贖之次刑非其所犯故不得降相因傳別言至相備正義曰此經歷言二百三百五百者各是刑之條也每於其條有犯者實則刑之疑則罰之刑屬罰屬其數同也別言罰屬五者各言其數合言刑屬但揔云三千明刑罰同其屬數互見其義以相備也經云大辟之罰其屬二百文異於上四罰者以大辟二字不可云大辟罰之屬故分為二句以其二字足使成文上下至有要正義曰此又述斷獄之法將斷獄訟當上下比方其罪之輕重乃與獄官衆議斷之其囚有僭亂之虛辭者無得聽之勿用此辭斷獄此僭亂之辭言不可行也惟當清察罪人之辭惟當附以法理其當詳審使能之勿使僭失為不能也上刑適輕者謂一人雖犯一罪狀當輕重兩條據重條之上有可以虧減者則之輕條服下罪也下刑適重者謂一人之身輕重二罪俱發則以重罪而從上服令之服上罪或輕或重諸所罪罰皆有權冝當臨時斟酌其狀不得雷同加罪刑罰有丗輕丗重當視丗所冝權而行之行罰者所以齊非齊者有倫理有要善戒令審量之傳上下至可行正義曰罪條雖有多數犯者未必當條當取故事並之上下比方其罪之輕重上比重罪下比輕罪觀其所犯當與誰同獄官不可盡賢其間或有阿曲冝預防之僭不信也獄官與囚等或作不信之辭以惑亂在上人君無得聽此僭亂之辭以自疑惑勿即用此僭亂之辭以之斷獄此僭亂之言不可行用也傳一人至權冝正義曰一人有二罪則之重而輕并數者謂若一人有二罪則應兩罪俱治今惟斷獄以重條而輕者不更別數與重并數為一劉君以為上刑適輕下刑適重皆以為一人有二罪上刑適輕者若今律重罪應贖輕罪應居作官當者以居作官當為重是為上刑適輕下刑適重者謂若二者俱是贓罪罪從重科輕贓亦備是為而輕并數也知不然者案經既言下刑適重上服則是重上服而巳何得云輕贓亦備又今律云重罪應贖輕罪應居作官當者以居作官當為重者此即是下刑適重之條而以為上刑適輕之例實為未允且孔傳下經始云一人有二罪則上經所云非一人有二罪者也劉君妄為其説故今不從傳言刑至要善正義曰刑罰隨丗輕重言觀丗而制刑也刑新國用輕典刑亂國用重典刑平國用中典周禮大司寇文也鄭玄云新國者新辟地立君之國用輕法者為其民未習於教也平國承平守成之國用中典者常行之法也亂國篡弒叛逆之國用重典者以其化惡伐滅之也罰懲至兩刑正義曰言聖人之制刑罰所以懲創罪過非要使人死也欲使惡人極於病苦莫敢犯之而巳非口才辨佞之人可以斷獄惟良善之人乃可以斷獄言斷獄無非在其中正佞人即不能然也察囚之辭其難在於言辭差錯斷獄者非從其偽辭惟從其本情斷獄之時當哀憐下民之犯法敬愼斷獄之害人勿得輕耳斷之必令典獄諸官明開刑書相與占之皆庶幾得中正之道其所刑罰其當詳審能之勿使失中其斷獄成辭得其信實又當輸汝信實之狀而告於王其斷刑文書上於王府皆使備具勿有踈漏其囚若犯二事罪雖從重有并兩刑上之者言有兩刑亦具上之恐獄官有所隱沒故戒之傳當憐至之道正義曰論語云陽膚為士師曽子戒之云如得其情則哀矜而勿喜是斷獄者於斷之時當憐下民之犯法也死者不可復生斷者不可復續當須敬愼斷獄之害人勿得輕耳即決之五刑之屬三千皆著在刑書使斷獄者依案用之冝令斷獄諸官明開刑書相與占之使刑書當其罪今人之所犯不必當條須探測刑書之意比附以斷其罪若卜筮之占然故稱占也皆庶幾必得中正之道令獄官同心思使中也此言明啓刑書而左傳云昔先王議事以制不為刑辟者彼鑄刑書以宣示百姓故云臨事制冝不預明刑辟人有犯罪原其情之善惡斷定其輕重乃於刑書比附而罪之故彼此各據其一義不相違傳斷獄至文辭正義曰孚信也輸寫也下而為汝也斷獄成辭而得信實當輸寫汝之信實以告於王勿藏隱其情不告王也曲必隱情直則無隱令其不隱情者欲使之無阿曲也漢丗問罪謂之鞫斷獄謂之劾謂上其鞫劾文辭也傳其斷至匕之正義曰其斷刑文書上王府皆當備具若今曹司寫案申尚書省也有并兩刑謂人犯兩事刑有上下雖罪從重斷有兩刑者亦并具上之使王知其事王或時以下刑為重改下為上故并亦上之王曰至天下正義曰王歎而呼諸侯曰嗚呼刑罰事重汝當敬之哉謂諸侯官之長此同族異姓等我言多可戒懼我敬於刑當敬命有德者惟典刑事今上天治民命人君為天子配天在於下氶天之意為事甚重其聽獄訟當明白淸審於獄之單辭民之所以治者由獄官無有不用中正聽訟之兩辭由以中正之故下民得治汝獄官無有敢受貨賂成私家於獄之兩辭勿於獄之兩家受貨致富治獄受貨非家寶也惟是聚罪之事言汝身多違則不達虛言戒行急惡疏非虛論矣多聚罪則天報汝以衆人見被尤怨而罰責之汝當長畏惟天所罰天罰汝者非是天道不中惟人在於自作教命使不中爾教命不中則天罰汝天道罰不中也若令衆民無有善政在於天下則是人主不中天亦將罰人主諸侯為民之主故以天罰懼之傳敬之至警之正義曰此篇主多戒諸侯百官之長故知官長即諸侯也襄卜二年左傳哭諸侯之例云異姓臨於外同族於禰廟是相對則族為同姓姓為異姓也告之以我言多可戒懼者以警戒之也下言民無善政則天罰人主是警戒諸侯也傳我敬至典刑正義曰當使有德者惟典刑言將選有德之人使為刑官刑官不用無德之人也傳今天至言之正義曰傳以相為治今天治民者天有意治民而天不自治使人治之人君為配天在下當承天意治民治之常使稱天心也欲稱天心聽獄當淸審單辭單辭謂一人獨言未有與對之人訟者多直己以曲彼構辭以誣人單辭特難聽故言之也孔子美子路云片言可以折獄者其由也與片言即單辭也子路行直聞於天下不肯自道已長妄稱彼短得其單辭即可以斷獄者惟子路爾凡人少能然故難聽也傳民之至民治正義曰獄之兩辭謂兩人競理一虛一實實者枉屈虛者得理則此民之所以不得治也民之所以得治者由典獄之官其無不以有中正之心聽獄之兩辭棄虛從實實者得理虛者受刑虛者不敢更訟則刑獄淸而民治矣孔子稱必也使無訟乎謂此也傳典獄至兩辭正義曰典獄知其虛受其貨而聽其詐詐者虛而得理獄官致富成私家此民之所以亂也故戒諸侯無使獄官成私家於獄之兩辭傳受獄至見罪正義曰府聚也功事也受獄貨非是家之寶也惟是聚近罪之事爾罪多必有惡報其報則以衆人見罪也衆人見罪者多天必報以禍罰故下句戒令畏天罰也傳當長至罰之正義曰衆人見罪者多天必報以禍罰汝諸侯等當長畏懼為天所罰天之罰人非天道不得其中惟人在其教命自使不中教命不中則天罰之諸侯一國之君施教命於民者也故戒以施教命中否也傳天道至罰之正義曰天道下罰罰不中者令使衆民無有善政在於天下由人主不中為人主不中故無善政天將亦罰人主人主謂諸侯此言戒諸侯也王曰至祥刑正義曰戒之既終王又言而歎曰嗚呼汝諸侯嗣丗子孫等從自今巳往當何所監視非當視立德於民而為之中正乎言諸侯并嗣丗惟當視此立德於民為之中正之事汝必視此庶幾明聽我言而行之哉有智之人惟能用刑乃有無疆境之善辭得有無疆善辭者以其折獄能屬於五常之中正皆中其理而法有善政故也汝有邦有土之君受王之善衆而治之當視於此善刑從上巳來舉善刑以告之欲其勤而法之使有無窮之美譽傳言智至以然正義曰屬謂屬著也極中也慶善也五常謂仁義禮智信人所常行之道也言得有善辭名聞於後丗者以其斷獄能屬著於五常之中正皆得其理而法之有善所以得然也知五是五常者以人所常行惟有五事知五常也尚書正義卷第十九計一萬三千六百五十四字
