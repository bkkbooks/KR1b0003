  text: 尚書正義卷第十四
  hash: sha256:1445d5ea8ef60afa41cc069008eabad2e38ac1acc3269e1d1fdae5f1e4c60379
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_014-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰周書召誥第十四洛誥第十五召誥第十四成王至召誥正義曰成王於時在豐欲居洛邑以為王都使召公先往相其所居之地因卜而營之王與周公從後而往召公於庶殷大作之時乃以王命取幣以賜周公因告王冝以夏殷興亡為戒史敘其事作召誥傳武王至居焉正義曰桓二年左傳云昔武王克商遷九鼎于洛邑服䖍注云今河南有鼎中觀云九鼎者案宣三年左傳王孫滿云昔夏之方有德也貢金九牧鑄鼎象物然則九牧貢金為鼎故稱九鼎其實一鼎案戰國䇿顔率說齊王云昔武王克商遷九鼎鼎用九萬人則以為其鼎有九但游說之辭事多虛誕不可信用然鼎之上備載九州山川異物亦又可疑未知孰是故兩解之傳相所至陳戒正義曰孔以序言相宅於經意不盡故為傳以助成之召公相所居而卜之及其經營大作遂以陳戒史録陳戒為篇其意不在相宅序以經具故略之耳言先相宅者明於時周公攝政居洛邑是周公之意周公使召公先行故言先以見周公自後往也傳召公至作誥正義曰武王既崩周公即攝王政至此巳積七年將歸政成王故經營洛邑待此邑成使王即政召公以成王將新即政恐王不順周公之意或將惰於政事故因相宅以作誥也作誥之時王未即政周公作洛誥為反政於成王召公陳戒為即政後事故傳言新即政也惟二月至位成正義曰惟周公攝政七年二月十六日其日為庚寅既日月相望矣於巳望後六日乙未為二月二十一日王以此日之朝行自周之鎬京則至于豐以遷都之事告文王之廟此日王惟命太保召公先周公往洛水之旁相視所居之處太保即行其月小二十九日癸卯晦於二月之後順來三月惟三日丙午朏而月生明於朏三日戊申即三月五日太保乃以此朝旦至於洛即卜宅其巳得吉卜則經營之規度其城郭郊廟朝市之位處於戊申三日庚戍為三月七日太保乃以衆所受於殷之民治都邑之位於洛水之汭謂洛水北也於庚戍五日為三月十一日甲寅而所治之位皆成矣傳周公至紀之正義曰洛誥云周公誕保文武受命惟七年洛誥是攝政七年事也洛誥周公云豫惟乙卯朝至于洛師此篇云乙卯周公朝至于洛正是一事知此二月是周公攝政七年之二月也望者於月之半月當日衝日光照月光圎滿面嚮相當猶人之相望故名望也治曆者必先正望朔故史官因紀之將言望後之事必以望紀之將言朏後之事則以朏紀之猶今人將言日必先言朔也望之在月十六日為多大率十六日者四分之三十五日者四分之一耳此年入戊午蔀五十六歲二月小乙亥朔孔云十五日即為望是已丑為望言已望者謂庚寅十六日也且孔云望與生魄死魄皆舉大略而言之不必恰依曆數又算術前月大者後月二日月見可十五日望也顧氏亦云十五日望日月正相望也傳於巳至見考正義曰於已望後六日是為二十一日也步行也此云王朝行下太保與周公言朝至者君子舉事貴早朝故皆言朝也宗周者為天下所宗止謂王都也武王巳都於鎬故知宗周是鎬京也文王居豐武王未遷之時於豐立文王之廟遷都而廟不毀故成王居鎬京則至于豐以遷都之事告文王廟也大事告祖必告於考此經不言告武王以告文至則告武王可知以告祖見考也告廟當先祖後考此必於豐告文王於鎬京告武王也傳朏明至所居正義曰說文云朏月未盛之明故為明也周書月令云三日粵朏朏字從月出是入月三日明生之名也於順來者於二月之後依順而來次三月也二月乙未而發豐歷三月丙午朏又於朏三日是三月五日凡發豐至洛為十四日也召公早朝至于洛邑相卜所居當以至洛之日即卜也傳其巳至位處正義曰經營者考工記所云匠人營國方九里左祖右社面朝後市是也下有丁巳郊故知規度城郭郊廟朝市之位處也匠人不言郊以不在國內也匠人王城方九里如典命文又以公城方九里天子城十二里鄭玄兩說孔無明解未知從何文也郊者司馬法百里為郊鄭注周禮云近郊五十里禮記祭天于南郊祭地于北郊皆謂近郊也其廟案小宗伯云建國之神位右社稷左宗廟鄭注朝士職云庫門內之左右其朝者鄭云外朝一在庫門之外臯門之內是詢衆庶之朝內朝二者其一在路門外王每日所視謂之治朝其一在路門內路寢之朝王每日視訖退適路寢謂之燕朝或與宗人圖私事顧氏云市處王城之北朝為陽故在南市為隂故處北今案周禮內宰職佐后立市然則后既主隂故立市也傳於戊至由來正義曰於戊申後三日庚戍為三月七日也水內曰汭蓋以人南面望水則北為內故洛汭為洛水之北鄭云隈曲中也漢書地理志河南郡治在洛陽縣河南城別為河南縣治都邑之位於洛北今於漢河南城是也所治之位皆成布置處所定也治位乃是周人而言衆殷者本其所由來言本是殷民今來為我周家役也莊二十九年左傳發例云凡土功水昏正而栽日至而畢此以周之三月農時役衆者彼言尋常土功此則遷都事大不可拘以常制也若翼至若公正義曰順位成之明日乙卯三月十二日也周公以此朝旦至於洛則通逹而遍觀於新邑所經營其位處皆無所改易於乙卯三日丁巳三月十四日也用牲於郊告立祭天之位牛二天與后稷所配各用一牛於丁巳明日戊午乃祭社於新邑用太牢牛一羊一豕一於戊午七日甲子二十一日也周公乃以此朝旦用䇿書命衆殷在侯甸男服之內諸國之長謂命州牧使告諸國就功作其巳命殷衆衆殷皆勸樂勤事而大作矣太保召公乃以衆國大君諸侯出取幣乃復入稱成王命以賜周公曰我敢拜手稽首以戒王陳說王所冝順周公之事傳周公至洛汭正義曰周公以順位成之明日而朝至則是三月十二日也其到洛汭在召公之後七日不知初發鎬京以何日也成王蓋與周公俱來鄭云史不書王往者王於相宅無事也傳於乙至可知正義曰知此用牲是告立郊位於天者此郊與社於攻位之時巳經營之今非常祭之月而特用牲祭天知是郊位既定告天使知而今後常以此處祭天也禮郊用特牲不應用二牛以后稷配故二牛也郊特牲及公羊傳皆云養牲必養二帝牛不吉以為稷牛言用彼為稷牛者以之祭帝其稷牛隨時取用不在滌養是帝稷各用牛一故二牛也先儒皆云天神尊祭天明用犢貴誠之義稷是人神祭用太牢貶於天神法有羊豕因天用牛遂云牛二舉其大者從天言之羊豕不見可知也詩頌我將祀文王於明堂云惟羊惟牛又月令云以太牢祠于髙禖皆據配者有羊豕也傳告立至共牢正義曰經有社無稷稷是社類知其同告之告立社稷之位其祭用太牢故牛羊豕各一也句龍能平水土祀以為社后稷能殖百穀祀以為稷左傳魯語祭法皆有此文漢丗儒者說社稷有二左氏說社稷惟句龍后稷人神而巳是孔之所用孝經說社為土神稷為穀神句龍后稷配食者是鄭之所從而武成篇云告于皇天后土孔以后土為地言后土社也者以泰誓云類于上帝冝于冡土故以后土為社也小劉云后土與皇天相對以后土為地若然左傳云句龍為后土豈句龍為地乎社亦名后土地名后土名同而義異也社稷共牢經無明說郊特牲云社稷太牢二神共言太牢故傳言社稷共牢也此經上句言于郊此不言于社此言社于新邑上句不言郊於新邑上句言用牲此言牛羊豕不言用告天不言告地告社不言告稷皆互相足從省文也洛誥云王在新邑蒸祭王入太室祼則洛邑亦立宗廟此不云告廟亦從省文也傳於戊至牧也正義曰康誥云周公初基作新大邑于東國洛四方民大和㑹侯甸男邦采衛百工播民和見士于周與此一事也故知是時諸侯皆㑹故周公乃昧爽以賦功屬役書命衆殷在侯甸男服之邦伯使就築作功也康誥五服此惟三服者立文有詳略耳昭三十二年晉合諸侯城成周左傳稱命役書於諸侯屬役賦文此傳言賦功屬役其意出於彼也賦功謂賦斂諸侯之功科其人夫多少屬役謂付屬役之處使知得地之尺丈也邦伯諸國之長故為方伯州牧王制云千里之外設方伯方伯即州牧也周公命州牧使州牧各命其所部傳諸侯至周公正義曰上云周公朝用書命庶殷者周公自命之其事不由王也庶殷既以大作諸侯公卿乃並覲於王其時蓋有行官王在位而諸侯公卿並覲之既入見王乃出取幣初不言入而經言出者下云乃復入則上以入可知從省文也下賜周公言旅王若公明此出入是覲王之事而經文不見王至故傳辨之王與周公俱至自此巳上於王無事故不見也正以經文不見王至知與周公俱至也周公居攝功成將歸政於成王召公與諸侯出取幣欲因大㑹顯周公之功既成將令王自知政因賜周公遂以戒王故出取幣復入以待王命其幣蓋玄纁束帛也鄭玄云所賜之幣蓋璋以皮及寶玉大弓此時所賜案鄭注周禮云璋以皮二王之後享后所用寧當以賜臣也寶玉大弓魯公之分伯禽封魯乃可賜之不得以此時賜周公也傳召公至之事正義曰太保以庶邦冡君出取幣者以上太保之意非王命幣既入即云賜周公者下言召公不得賜周公知召公既以幣入乃稱成王命以賜周公於時政在周公成王未得賜周公也但召公見周公功成作邑將反王政欲尊王而顯周公故稱成王之命以賜周公鄭玄云召公見衆殷之民大作周公德隆功成有反政之期而欲顯之因大戒天下故與諸侯出取幣使戒成王立於位以其命賜周公王肅云為戒成王錫周公是也曰拜手稽首者召公自言已與冢君等敢拜手稽首陳王所冝順周公之事冝順之事自此以下皆是也誥告至弗敬正義曰召公所陳戒王冝順周公之事云我為言誥以告汝庶殷之諸侯下自汝御事欲令君臣皆聽之其實指以戒王諸侯皆在託以為言也乃曰嗚呼有皇天上帝改去其太子所受者即此大國殷之王命也以其無道故改命有德惟王受得此命乃無窮惟美亦無窮惟當憂之既憂之無窮嗚呼何其奈何不敬乎欲其長行敬也告庶殷者告諸侯也庶殷通尊卑之辭故民與諸侯同云庶殷皆謂所受於殷之衆也傳歎皇至不愼正義曰釋詁云皇君也天地尊之大故皇天后土皆以君言之也改其太子謂改天子之位與他姓即此大國殷之命謂紂也言紂雖為天所太子無道猶改之不可不愼也以託戒諸侯故言天子雖大猶改之況巳下乎釋詁云元首也首是體之大故傳言太子鄭云言首子者凡人皆云天之子天子為之首耳天既至用懋正義曰更述改殷之事天既逺終大國殷之王命矣此殷多有先智之王精神在天不能救紂以紂不行敬故也於其智王之後人謂繼丗之君乃其時之人皆服行其君之命由其亦能行敬故得不忝其先祖其此後王之終謂紂之時賢智者隱藏􅘃病者在位言其時無良臣多行無禮暴虐於時之民困於虐政夫知保抱攜持其婦子以哀號呼天告冤枉無辜往其逃亡出見執殺言無地自容以窮困也天亦哀矜於四方之民其眷顧天下選擇賢聖命用勉力行敬者以為民主故王今得之也傳言天至敬故正義曰天既逺終殷命言其去而不復反也說天終殷之命而言智王在天者言先智王雖精神在天而不能救紂者以紂不行敬故也戒王使行敬傳於其至不忝正義曰先智王之後繼丗君臣謂智王之後紂巳前能守位不失者經言後王後民傳言君臣者見民內有臣民於此皆服行君之命言不忝辱父祖也傳其終至良臣正義曰既言後王又復言其終知是後王之終謂紂也以􅘃從病類故言􅘃病也鄭玉皆以􅘃為病小人在位殘暴在下故以病言之傳言困至以窮正義曰言困於虐政抱子攜妻欲去之夫猶人人言天下盡然也保訓安也王肅云匹夫知欲安其室抱其子攜其妻以悲呼天也王其至自天正義曰既言皇天眷顧命用勉敬者為人主故戒主言其疾行敬德視古先民有夏之君取大禹以為法戒禹以能敬之故天道從而子安之禹能面考天心而順以行敬今是桀棄禹之道巳墜失其王命矣更復視有殷之君取成湯以為法戒湯以能敬之故天亦從而子安之天道所以至於保安湯者亦以湯面考天心而順以行敬也今是紂棄湯之道巳墜失其王命矣夏殷二代能敬則得之不敬則失之今童子為王嗣位治政則無遺棄壽考成人冝用老成人之言法古人為治曰王其考行古人之德則巳善矣況曰其有能考行所謀以從順天道乎若能從順天道則與禹湯同功言其善不可加也傳夏禹至王命正義曰勸王疾行敬德乃言天道安夏知夏禹能行敬德天道從而子安之天既子愛禹禹亦順天心鄭云面猶回向也則面為向義禹亦志意向天考天心而順安之言能同於天心也禹興夏而桀滅之知天道子保者是禹也既墜厥命者是桀也今桀廢禹之道巳墜失其王命矣傳言天至如禹正義曰此說二代興亡其意同也於禹言從而子安之則天於湯亦子安之故於湯因上略文直言格保格至也言至於保安湯者亦如禹也傳童子至法之正義曰嗣位治政謂周公歸政之後此時王未蒞政而言今沖子嗣者召公此戒戒其即政之後故也壽謂長命者是老稱無遺棄長命之老人欲其取老人之言而法效之老人之言即下云古人之德也嗚呼至民碞正義曰召公歎以戒王嗚呼今所有之王惟今雖復少小而大為天所子愛哉言任大也若其大能和同於天下小民則成今之美以勉之故王當不敢後其能用之士必任以為先又當顧念畏於下民僭差禮義能此二者則德化立美道成矣傳王為至道成正義曰王者為政任賢使能有能有用冝先任之故王者為政當不敢後其能用之士必任之為先也碞即巖也參差不齊之意故為僭也既任能人復憂下民故又當顧畏於下民僭差禮義畏其僭差當治之使合禮義也能此二者則德化立美道成美道成即今休是也王來至今休正義曰周公之作洛邑將以反政於王故召公述其遷洛之意今王來居洛邑繼上天為治躬自服行教化於土地正中之處故周公旦言曰其作大邑於土中其令成王用是大邑配大天而為治為治之道當事神訓民謹愼祭祀上下神祇其用是土中大致治也既能治則王其有天之成命治理下民今獲太平之美矣傳言王至正中正義曰傳言躬自服行則不訓自也鄭王皆以自為用傳稱周至為治正義曰王肅云旦周公名也禮君前臣名故稱周公之言為旦曰王者為天所子代天治民天有其意天子繼天使成謂之紹上帝也天子設法其理合於天道是為配皇天也天子將欲配天必冝治居土中故稱周公之言其為大邑於土之中其當令此成王用是大邑行化配上天而為治也說周公之意然戒成王使順公也周禮大司徒云以土圭之法測土深正日影以求地中日南則影短多暑日北則影長多寒日東則影夕多風日西則影朝多隂日至之影尺有五寸謂之地中天地之所合也四時之所交也風雨之所㑹也隂陽之所和也然則百物阜安乃建王國焉馬融云王國東都王城今河南縣是也傳為治至致治正義曰祭法云有天下者祭百神天地為大上下即天地也故為治當愼祀於天地舉天地則百神之祀皆愼之也能事神訓民則其用是土中大致治也傳用是至之美正義曰用是土中致治當於天心則王其有天之成命降福與之使多歷年歲治民今獲太平之美自旦曰至此述周公之意也王先至敬德正義曰召公既述周公所言又自陳已意戒王今為政先服治殷家御治事之臣使之比近於我有周治事之臣令新舊和協政乃可一和比殷周之臣時節其性命令不失其中則王之道化惟日其行矣王當敬為所不可不敬之德其德為下所敬則下敬奉其上命則化必行矣化在下者常若命之不行故以此為戒傳召公至可一正義曰自今休以上文義相連知皆是稱周公言也此一句意異於上知是召公自陳已意以終其戒殷家治事之臣謂殷朝舊人常被殷家任使者也周家治事之臣謂西土新來翼贊周家初基者也周臣恃功或加陵殷士殷人失勢或踈忌周臣新舊不和政必乖戾故召公戒王當先治殷臣使比近周臣必和協政乃可一也不使周臣比殷而令殷臣比周臣者周臣奉周之法當使殷臣從之故治殷臣使比周臣也傳和比至其行正義曰文承比周之下故知和比殷周之臣人各有性嗜好不同各恣所欲必或反道故以禮義時節其性命示之限分令不失中皆得中道則各奉王化故王之道化惟日其行言日日當行之日益逺也顧氏云和協殷周新舊之臣制其性命勿使怠慢也傳敬為至命矣正義曰聖王為政當使易從而難犯故令行如流水民從如順風若使設難從之教為易犯之令雖迫以嚴刑而終不用命故為其德不可敬也王必敬為此不可不敬之德則下民無不敬奉其命矣民奉其王命是化行也我不至若功正義曰言王所以須愼敬所為不可不敬之德者以我不可不監視于有夏亦不可不監視于有殷皆有歷年長與不長由敬與不敬故也王當法其歷年戒其不長更說冝監之意我不敢獨知亦王所知曰有夏之君服行天命以敬德之故惟有多歷年數謂桀父巳前也其末亦我不敢獨知亦王所知曰有夏桀不其長久惟不敬其德乃早墜失其王命是為敬者長不敬者短所以我不可不監夏也我不敢獨知亦王所知曰有殷之君受天命以敬德之故惟有多歷年數謂紂父巳前也其末亦我不敢獨知亦王所知曰殷紂不其長久惟不敬其德乃早墜失其王命亦是為敬者長不敬者短所以我不可不監殷也夏殷短長既如此矣今王繼受其命我亦惟當用此二國夏殷長短之命以為監戒繼順其功德者而法則之勸正為敬也傳言王至不長正義曰相監俱訓為視上言相有夏相有殷今復重言監有夏監有殷者上言順天則興棄命則滅此言敬則歷年不敬則短故重言視夏殷欲令王法其歷年戒其不長故也傳以能至所知正義曰下云不敬厥德乃早墜厥命知其以能敬德者故多歷年數也上言相夏相殷皆云天迪從子保面稽天若言上天以道安人人主考天順之非創業之君不能如是故傳以禹湯當之此言敬德歷年則繼體賢君亦能如此所言歷年非獨禹湯而巳下傳云殷之賢王猶夏之賢王則此多歷年數者夏則桀前之賢王殷則紂前之賢王不失位者皆是也召公此誥指以告王故知言我不敢獨知者其意言亦是王所知也王說亦然王乃至王顯正義曰既言當法則賢王又戒王為政之要王乃初始即政服行教化嗚呼王行教化當如初生之子子之善惡無不在其初生若習行善道此乃自遺智命智命謂身有賢智命由已來是自遺也為政之道亦猶是矣為政初則能善天必遺王多福使王有智則常吉歷年長久也今天觀人所為以授之命其命者智與愚也其命吉與凶也其命歷年與不長也若能敬德則有智常吉歷年長久也若不敬德則愚凶不長也天巳知我王今初始服政居此新邑觀王善惡欲授之命故惟王其當疾行敬德王其德之用言為行當用德則能求天長命以歷年也其惟王勿妄役小人過用非常之事亦當果敢絶刑戮之道以治下民順行禹湯所有成功則惟王居天子之位在德行之首矣王能如是小民乃惟法則於王行用王德於天下如是則於王道亦有光明也傳言王至猶是正義曰以此新即政始行教化比子之初生始欲學習為善則善矣若能為善天必授之以賢智之命是此賢智之命由已行善而來是自遺智命也初習為惡則惡矣若其為惡天必授之以頑愚之命亦是自遺愚命也方欲勸王慕善故惟舉智命而不言愚命者愚智由學習而至是無不在其初生此初生謂年長以解習學非初始生也為政之道亦猶是為善政得福為惡政得禍亦如初生之子習善惡也傳今天至在人正義曰命由天授逺舉天心故言今天制此三命有哲當有愚有歷年當有不長文不備者以吉凶相反言命吉凶則哲對愚歷年對不長可知矣天制此三命善惡由人惟人所修皆也此篇所云惟勸修敬德故云修敬德則有智則常吉則歷年為不敬德則愚凶不長也愚智夭壽之外而別言吉凶於凡人則康強為吉病患為凶於王者則太平為吉禍亂為凶三者雖以託天說之其實行之在人人行之有善惡天隨以善惡授之耳此是立教誘人之辭不可以賢智夭枉為難也傳言王至歷年正義曰其德之用言為行當用德用德與疾敬德為一事也故上傳云王其當疾行敬德則此文是也傳勿用至秉常正義曰勿用小民非常役用為非常之義戒王當使民以時莫為非常勞役欲其重民秉常也傳亦當至愼罰正義曰聖人作法以刑山刑以殺止殺若直犯罪之人亦當果敢致罪之以此絶刑戮之道用治民謂獄事無疑決斷得理則果敢為絶刑戮之道若其獄情疑惑枉濫者多是為不能果敢絶刑殺之道也上戒王以明德此戒王以愼罰故言亦也傳順行至之首正義曰若有功必順前丗有功者也上文所云相夏相殷謂禹湯之功故知此順行禹湯所有成功能順禹湯之功則惟王居位在德之首禹湯為有德之首故王亦為首傳王在至光明正義曰詩稱民之秉彞好是懿德故王在德元則小民乃惟法則於王行王政於天下王之為政民盡行之是言治政於王道有光明也上下至永命正義曰上既勸王敬德又言臣當助君言君臣上下勤憂敬德所以勤者其言曰我周家既受天命當大順有夏之多歷年歲用勿廢有殷之多歷年歲夏殷勤行敬德故多歷年長久我君臣亦當行敬德庶幾兼之如此者我欲令王用小民受天長命言愛下民則歷年多也召公既言此乃拜手稽首盡禮致敬欲王納用其言既拜而又曰我小臣敢以王之匹配於民衆百君子於友愛民者共安受王之威命明德敬奉行之是上下勤恤也臣下安受王命則王終有天之成命於王亦為昭著也我非敢獨勤而巳衆百君子皆然言我與衆百君子惟恭敬奉其幣帛用供待王能求天長命將以此慶王受天多福也傳言當至兼之正義曰王者不獨治必當以臣助之上句惟指勸王故此又言臣助君上下謂君臣故言當君臣共勤憂敬德不獨使王勤也我周王承夏殷之後受天明命欲其年過二代既言大順有夏歷年又言勿廢有殷歷年庶幾兼彼二代歷年長久勤行敬德即是大順勿廢也傳拜手至匹之正義曰拜手頭至手稽首頭至地謂既為拜當頭至手又申頭以至地故拜手稽首重言之諸言拜手稽首者義皆然也就此文詳而解之周禮太祝辨九拜一曰稽首施之於極尊召公為此拜者恐王忽而不聽盡禮致敬以入其言於王此拜手稽首一句史録其事非召公語也召公設言未盡為此拜乃更言鄭云拜手稽首者召公既拜興曰我小臣以下言召公拜訖而復言也王肅云我小臣召公自謂是小臣為召公之謙辭讎訓為匹敢以王之匹民百君子百者舉其成數言治民者非一人鄭玄云王之諸侯與羣吏是非一人也嫌匹為齊等故云民在下自上匹之傳言我至永命正義曰我非敢勤召公自道言我非敢獨勤而已必上下勤恤言與衆百君子皆勤也禮執贄必用幣帛惟恭敬奉其幣帛用供待王能求天長命將以執贄慶王多福王能愛養小民即是求天長命待王能愛小民即欲慶之洛誥第十五召公至洛誥正義曰序自上下相顧為文上篇序云召公先相宅此承其下故云召公既相宅召公以三月戊申相宅而卜周公自後而往以乙卯日至經營成周之邑周公即遣使人來告成王以召公所卜之吉兆及周公將欲歸政於成王乃陳本營洛邑之事以告成王王因請教誨之言周公與王更相報答史敘其事作洛誥史録此篇録周公與王相對之言以為後法非獨相宅告卜而巳但周公因致政本說往前告卜經文既具故序略其事直舉其發言之端耳傳召公至成王正義曰上篇云三月戊申太保朝至于洛卜宅厥既得卜則經營是召公先相宅即卜之又云乙卯周公朝至于洛則逹觀于新邑營是周公自後至經營作之召公相洛邑亦相成周周公營成周亦營洛邑各舉其一互以相明卜者召公卜也周公既至洛邑案行所營之處遣使以所卜吉兆逆告成王也案上篇傳云王與周公俱至何得周公至洛逆告王者王與周公雖相與俱行欲至洛之時必周公先到行處所故得逆告也顧氏云周公既至洛邑乃遣以所卜吉兆來告於王是也經稱成王言公既定宅伻來來視豫卜休恆吉是以得吉兆告成王也上篇召公以戊申至周公乙卯至周公在召公後七日也至洛較七日其發鎬京或亦較七日傳既成至之義正義曰周公攝政七年三月經營洛邑既成洛邑又歸向西都其年冬將致政成王告以居洛之義故名之曰洛誥言以居洛之事告王也篇末乃云戊辰王在新邑明戊辰巳上皆是西都時所誥也周公至明辟正義曰周公將反歸政陳成王將居其位周公拜手稽首盡禮致敬於王既拜乃興而言曰我今復還子明君之政言王往日幼少其志意未成不敢及知天之始命我周家安定天下之命故我攝王之位代王為治我乃繼文王武王安定天下之道以此故大視東土洛邑之居其始欲王居之為民明君之治言欲為民明君必當治於土中故為王營洛邑也傳周公至退老正義曰周公還政而巳明暗在於人君而云復還明君之政者其意欲令王明故稱復子明辟也正以此年還政者以成王年巳二十成人故必歸政而退老也傳說成王之年惟此而巳王肅於金縢篇末云武王年九十三而巳冬十一月崩其明年稱元年周公攝政遭流言作大誥而東征二年克殷殺管叔三年歸制禮作樂出入四年六年而成七年營洛邑作康誥召誥洛誥致政成王然則武王崩時成王年巳十三矣周公攝政七年成王適滿二十孔於此言成王年二十則其義如王肅也又家語云武王崩時成王年十三是孔之所據也傳如往至已攝正義曰如往釋詁文及訓與也言王往日幼少志意未成不敢與知上天始命我周家安定天下之命故已攝也天命周家安定天下者必令天下太平乃為安定成王幼少未能使之安定故不敢與知之周公所以攝也傳我乃至之治正義曰胤訓繼也文王受命武王伐紂意在安定天下天下未得安定故周公言我乃繼續文武安定天下之道大相洛邑之地其處可行教化始營此都為民明君之政治言欲為民明君其意當在此豫惟至獻卜正義曰周公追述立東都之事我惟以七年三月乙卯之日朝至於洛邑衆作之處經營此都其未往之前我使人卜河北黎水之上不得吉兆乃卜㵎水東瀍水西惟近洛而其兆得吉依規食墨我亦使人卜瀍水東亦惟近洛其兆亦吉依規食墨我以乙卯至洛我即使人來以所卜地圖及獻所卜吉兆於王言卜吉立此都王冝居之為治也傳致政至之意正義曰下文揔結周公攝政之事云在十有二月是致政在冬也在冬發言嫌此事是冬故辨之云本其春來至洛衆追說始卜定都之意也周公至洛之時庶殷巳集於洛邑故云至于洛師正義曰嫌周公自卜故云我使人謂使召公也案上篇召公至洛其日即卜而得卜河朔黎水者以地合龜非就地內此言所卜三處皆一時事也黎水之下不言吉凶者我乃是改卜之辭明其不吉乃改故知卜河北黎水之上不吉也武王定鼎於郟鄏巳有遷都之意而先卜黎水上者以帝王所都不常厥邑夏殷皆在河北所以博求吉地故令先卜河北不吉乃卜河南也其卜㵎瀍之閒南近洛吉今河南城也基趾仍在可驗而知所卜黎水之上其處不可知矣凡卜之者必先以墨畫龜要坼依此墨然後灼之求其兆順食此墨畫之處故云惟洛食顧氏云先卜河北黎水者近於紂都為其懷土重遷故先卜近以悅之用鄭康成之說義或然也傳今洛至成王正義曰洛陽即成周敬王自王城遷而都之春秋昭三十二年城成周是也周公慮此頑民未從周化故既營洛邑將定下都以遷殷之頑民故命召公即并卜之周公既至即遣使以所卜地圖及獻所卜吉兆來告於成王言巳重其事并獻卜兆者使王觀兆知其審吉也王拜至誨言正義曰成王尊敬周公故亦盡禮致敬拜手稽首乃受公之語述公之美曰不敢不敬天之美來至洛相宅其意欲作周家配天之美故也公既定洛邑即使人來告亦來視我以所卜之美常吉之居我當與公二人共正其美公定此宅其當用我萬億年敬天之美故也王既言此又拜手稽首於周公求教誨之言傳成王至之美正義曰拜手稽首施於極敬哀十七年左傳云非天子寡君無所稽首諸侯小事大尚不稽首況於臣乎成王尊敬周公故答其拜手稽首而受其言又述而美之天命文武使王天下是天之美事言公不敢不敬天之美來相洛邑之宅傳言公至其美正義曰周公追述往前遣使獻卜故成王復述公言言公前巳定宅遣使來來視我所卜之吉兆常吉之居自言前巳知其卜既有此美我當與公二人共正其美意欲留公輔巳共公正此美事來來重文者上來言使來下來為視我卜也鄭云伻來來者使二人也與孔意異傳公其至久逺正義曰言居洛為治可以永久公意其當用我使萬億年敬天之美言公欲令巳祚胤久遠美公意之深也王制云方百里者為方十里者百為田九十億畝方里者萬則是為田九百萬畝今記乃云九十億畝是名十萬為億也楚語云百姓千品萬官億醜每數相十是古十萬曰億今之算術乃萬萬為億也傳成王至之言正義曰此一段史官所録非王言也王求教誨之言必有求教誨之辭史略取其意故直云誨言為求誨言而拜故言成王盡禮致敬於周公求教誨之言也周公至有辭正義曰王求教誨之言公乃誨之周公曰王居此洛邑當始舉殷家祭祀以為禮典祀於洛之新邑皆次秩在禮無文法應祀者亦次秩而祀之我雖致政為王整齊百官使從王於周行其禮典若能如此我惟曰庶幾有善政事今王就行王命於洛邑曰王當記人之功尊人亦當用功大小為次敘有大功者則列為大祀又申述所以祀神記臣功者政事由臣而立惟天命我周邦之故曰汝受天命厚矣當輔大天命故須視羣臣有功者記載之君知臣功則臣皆盡力欲令羣臣盡力冝於初即教之乃汝新始即政其當盡自教誨衆官令王躬自化之使之立功又以朋黨害政尤冝禁絶故丁寧戒之少子愼其朋黨少子愼其朋黨戒其自今巳往令常愼此朋黨之事若欲絶止禁其未犯無令若火始然𦦨𦦨尚微火既然𦦨其火所及將灼然有次序矣不其復可絶也汝成王其當順此常道及撫循國事如我攝政所為惟當用我此事在周之百官則當畏服各立功矣汝當以此往行政化於新邑當使臣下百官各嚮就有官明為有功厚大成寬𥙿之德則汝長有歎譽之辭於後丗此周公誨王之言也傳言王至祀之正義曰於時制禮巳訖而云殷禮者此殷禮即周公所制禮也雖有損益以其從殷而來故稱殷禮猶上篇云庶殷本其所由來孔於上傳巳具故於此不言必知殷禮即周禮者以此云祀於新邑即下文蒸祭歲也既用騂牛明用周禮云始者謂於新邑始為此祭顧氏云舉行殷家舊祭祀用周之常法言周禮即殷家之舊禮也鄭玄云王者未制禮樂恆用先王之禮樂是言伐紂以來皆用殷之禮樂非始成王用之也周公制禮樂既成不使成王即用周禮仍令用殷禮者欲待明年即政告神受職然後班行周禮班訖始得用周禮故告神且用殷禮也孔義或然故復存之神數多而禮文少應祭之神名有不在禮文者故令皆次秩不在禮文而應祀者皆舉而祀之傳我整至政事正義曰時成王未有留公之意公以成王初始即政自慮百官不齊故雖即致政猶欲整齊百官使從王於周謂從至新邑行其典禮周公以成王賢君今復成長故言我惟曰庶幾有善政事言已私為此言兾王為政善也傳今王至民者正義曰記臣功者是人主之事故言今王就行王命於洛邑謂正位為王臨察臣下知其有功以否恐王輕忽此事故曰當記人之功更言曰者所以致殷勤也尊人必當用功大小為次序令功大者居上位功小者處下位也有大功則列為大祀謂有殊功堪載祀典者祭法云聖王之制祭祀也法施於民則祀之以死勤事則祀之以勞定國則祀之能禦大災則祀之能捍大患則祀之是為大祀謂功施於民者也或時立其祀配享廟庭亦是也傳惟天至化之正義曰惟天命我周邦謂天命我文武故及汝成王復受天命為天子是天之恩德深厚矣天以厚德被汝汝當輔大天命任賢使能行合天意是輔大天也汝當輔大天命故冝視羣臣有功者記載之覆上記功宗以功言之也欲令羣臣有功必須躬自教化之在於初始故言乃汝新即政其當盡自教衆官欲令王躬化之者正已之身使羣臣法之非謂以辭化之也言盡自教者政有大小恐王輕大略小令王盡自親化之言惟命曰亦是致殷勤乃者緩辭也義異上句故言乃耳王肅云此其盡自教百官謂正身以先之傳少子至巳往正義曰鄭云孺子幼少之稱謂成王也此上皆云成王此句特言少子者以明朋黨敗俗為害尤大恐年少所忽故特言孺子也朋黨謂臣相朋黨愼其朋黨令禁絶之戒其自今巳往謂從即政以後常以此事為戒也傳言朋至以初正義曰無令若火始然以喻無令朋黨始發若火既然初雖焰焰尚微其火所及灼然有次序不其復可絶也以喻朋黨若起漸漸益大羣黨既成不可復禁止也事從微至著防之冝以初謂朋黨未發之前防之使不發傳其順至百官正義曰考古依法為順常道號令治民為撫國事周公大聖動成軌則如我所為謂如攝政之時事所施為也惟當用我所為在周之百官令其行周公之道法於百官也傳往行至後丗正義曰此時在西都戒王故云往行政化於新邑當使臣下各嚮就所有之官令其各守其職思不出其位自當陳力就列明為有功在官者當以褊小急躁為纍故令臣下厚大成寬裕之德臣下既賢君必明聖則汝長有歎譽之辭於後丗矣今周頌所歌即歎譽成王之辭也公曰至爽侮正義曰周公復誨王曰嗚呼前言巳是矣更復教誨汝惟童子嗣父祖之位惟當終其美業天子居百官諸侯之上須知臣下恭之與慢奉上謂之享汝為天子其當恭敬記識百君諸侯奉上者亦當記識其有不奉上者奉上之道多威儀威儀不及禮物則人惟曰不奉上之道矣所以須記之者百官諸侯為下民之君惟為政教不肯役用其志於此奉上之事則凡民化之亦惟曰不奉上矣百官不奉天子民復不奉百君上下相畏敬惟政事其皆差錯侮慢不可治理矣故天子須知百官奉上與否也傳巳乎至美業正義曰周公止而復言故更言公曰巳乎者道前言巳如是矣為後言發端也童子者言其年幼而任重嗣父祖之位當終其美業能致太平是終之也傳奉上至奉上正義曰享訓獻也獻是奉上之辭故奉上謂之享百官諸侯上事天子凡所恭承皆是奉上非獨朝覲貢獻乃為奉上鄭玄專以朝聘說之理未盡也言汝為王當敬識百官諸侯之奉上者亦識其有違上者察其恭承王命如法以否奉上違上皆須記之奉上者當以禮接之違上者當以刑威之所謂賞慶刑威為君之道奉上之道其事非一故云多威儀威儀既多皆須合禮其威儀不及禮物惟曰不奉上矣謂旁人觀之亦言其不奉上也鄭云朝聘之禮至大其禮之儀不及物謂所貢篚多而威儀簡也威儀既簡亦是不享也乃惟至用戾正義曰又曰已居攝之時為政常若不暇汝惟小子當分取我之不暇而施行之又聽我教汝於輔民之常而用之汝乃於是事不勉力為政則汝是惟不可長久哉必須勉力為之乃可長久此所言皆是汝父所行汝欲勉之但厚次序汝正父之道而行之無不順我所為則天下不敢廢棄汝命必常奉而行之汝往居新邑敬行教化哉如此我其退老明教農人以義哉汝若能使彼天下之民被寬裕之政則我天下之民無問遠近者悉皆用來歸汝矣傳我為至用之正義曰為政常若不暇謂居攝時也聖人為政務在和人雖復治致太平猶恨意之不盡故謙言已所不暇若言猶有美事未得施者然故戒之成王汝惟小子當分取我之不暇而行之言已所不暇行者欲令成王勉行之鄭玄云成王之才周公倍之猶未而言分者誘掖之言也生民之為業雖復志有經營不能獨自成就須王者設教以輔助之聽我教汝輔民之常法而用之謂用善政以安民說文云頒分也傳汝乃至可長正義曰成王言公其以子萬億年言欲己長久也故周公於此戒之汝乃於是不勉力為政汝惟不可長哉欲其必勉力勤行政教為可長久之道然後可至萬億年耳蘉之為勉相傳訓也鄭王皆以為勉傳厚次至奉之正義曰正父謂武王言其德正故稱正父厚次序汝正父之道而行之令其為武王之政也武王周公俱是大聖無不順我所為又令法周公之道既言法武王又法周公則天下不敢棄汝命常奉行之傳汝往至皆來正義曰歸其王政令汝往居新邑敬行教化哉公既歸政則身當無事如此我其退老於州里明教農久以義哉又令成王行寬裕之政以治下民民被寬裕之政則我天下之民無問逺近者用來歸王言逺處皆來也上文使之惇大成裕故此言裕政來民結上事也伏生書傳稱禮致仕之臣教於州里大夫為父師士為少師朝夕坐於門孰而教出入之子弟是教農人以義也王若至毖祀正義曰王以周公將退因誨之而請留公王順周公之意而言曰公當留住而明安我童子不可去也所以不可去者當舉行大明之德用使我小子褒揚文武之業而奉當天命以和常四方之民居處其衆故也其厚尊大禮謂舉秩大祀皆次秩禮所無文有而皆祀之凡此皆待公而行非我能也更述居攝時事惟公明德光于天地勤政施於四方使四方旁來為敬敬之道以迎太平之政下民皆不復迷惑於文武所勤之教言公化洽使如此也今若留輔我童子惟當早起夜寐愼其祭祀而巳言政化由公而立我無所能也傳成王至去之正義曰成王以周公誨已為善順周公之意示已欲行善政而請留之自輔王以公若捨我而去則已政暗而治危故云公當明安我童子不可去也傳言公至順天正義曰文武受命功德盛隆成王自量已身不能繼業言公當留舉大明德以佐助我用我小子褒揚文武之業而奉順天者下句奉答天命是也孔分經為傳故探取下句以申之傳又當至其衆正義曰天命周家欲令民治故又當奉當天命以和常四方之民居處其衆也奉當者尊天意使允當天心和協民心使常行善也居處其衆使之安土樂業也傳厚尊至而行正義曰釋詁云將大也厚尊大禮謂祭祀之禮祭統云禮有五經莫重於祭是祭禮最尊大公誨成王令肇稱殷禮祀于新邑咸秩無文欲答公誨己之事還述公辭舉秩大祀皆次秩無禮文而冝在祀典者其祀事非我所為凡此皆待公而行者也言公不可捨我以去也傳言公至化之正義曰此與下經皆追述居攝時事堯典訓光為充此光亦為充也言公之明德充滿天地即堯典格于上下勤政施於四方即堯典光被四表也意言萬邦四夷皆服仰公德而化之上言待公乃行之此言公有是德言其將來說其巳然所以深美公也傳四方至化洽正義曰上言施化在公此言民化公德四方旁來為敬敬之道民皆敬嚮公以迎太平之政言迎者公政從上而下民皆自下迎之言其慕化速也文武勤行教化欲以教訓利民民蒙公化識文武之心不復迷惑文武所勤之教言公居攝之時政化巳洽於民也傳言政至所能正義曰此述留公之意陳自今已後之事言公若留住政化由公而立我童子徒早起夜寐愼其祭祀而已於政事無所能欲惟典祭祀以政事委公襄二十六年左傳云衛獻公使與寧喜言曰苟得反國政由寧氏祭則寡人亦猶是也王曰公功至若時正義曰王又重述前言還說居攝時事也曰公之功輔道我已厚矣天下無有不順而是公之功者公所以須留也傳公之至之功正義曰王意言公之居攝天下若為非則可捨我而去公之居攝天下無不順而是公之功不可捨我去王曰公豫至四輔正義曰王呼周公曰我小子其退此坐就為君於周謂順公之言行天子之政於洛邑也至洛邑當命公後立公之丗子為國君公當留輔我也公之攝政四方雖巳道治理猶自未能定於尊禮是亦未能撫順公之大功公當待其定大禮順公之大功此時未可去也公當留教道將助我其今已後之政監篤我政事衆官以此大安文武所受之民而治之為我四維之輔助明已當依倚公也傳我小至佐我正義曰退者退朝也周公於時令成王坐王位而以政歸之成王順周公言受其政也言我小子退坐之後便就君位於周周謂洛邑許其從公言適洛邑而行新政也古者臣有大功必封為國君今周公將欲退老故命立公後使公子伯禽為國君公當留佐我王肅云成王前春亦俱至洛邑是顧無事既㑹而還宗周周公往營成周還來致政成王也傳言四至以去正義曰王意恐公意以四方既定不須更留故謂公云四方雖巳道治而猶未能定於尊大之禮言其禮樂未能彰明也禮既未彰是天下之民亦未能撫安順行公之大功公當待其禮法明公功順乃可去耳明今不可以去傳大安至倚公正義曰文武受人之於天下今大安文武所受之民助我治之為我四維之輔明已當依倚公也維者為之綱紀猶如用繩維持之文王丗子云設四輔謂設衆官為四方輔助周公一人事無不統故一人為四輔管子云四維不張國乃滅亡傳取管子之意故言四維之輔也王曰公定至丗享正義曰王又呼公公留以安定我我從公言往至洛邑巳矣公功巳進且大矣天下皆樂公之功敬而歡樂公必留無去以困我哉公留助我我惟無猒其安天下之事公勿去以廢法則四方之民其丗丗享公之德矣傳公留至公功正義曰讀文以公定為句王稱定者言定已也故傳言公留以安定我我字傳加之我從公言是經之豫也往至洛邑巳矣言巳順從公命受歸政也公功巳進大天下咸敬樂公之功亦謂居攝時也釋詁云肅進也傳公必至之德正義曰王言己才智淺短公去則困故請公無去以困我哉我意欲致大平惟無猒倦其安天下之事是以留公公勿去以廢治國之法則天下四方之民蒙公之恩其丗丗享公之德享謂荷負之周公至孚先正義曰周公拜手稽首盡禮致敬許王之留乃興而為言曰王今命我來居臣位承安汝文德之祖文王所受命之民令我繼文祖大業我所以不得去也又於汝大業父武王大使我恭奉其道王意以此留我其事甚大我所以為王留也公呼成王云少子今所以來相宅於洛邑者欲其大厚行常道於殷賢人王當治理天下新其政化為四方之新君為周家後丗見恭敬之王所推先也重誨王曰其當用是土中為治使萬國皆被美德如此惟王乃有成功也公自稱名曰若王居洛邑則我旦以多衆君子卿大夫等及於御治事之臣厚率行前人先王成業使當其衆心為周家後丗人臣立信者之所推先言我留輔王使君臣皆為後丗所推先期於上下其顯也傳拜而至得去正義曰拜是從命之事故云拜而後言許成王留也以退為去以留為來故言王命我來來居臣位為太師也承安汝文德之祖文王所受命之民天命文王使為民主天以民命文王故民是文王所受命之民承安者承文王之意安定此民言王之留已乃為此事其事既大是所以不得去也傳於汝至己意正義曰於汝成王大功業之父武王王意大使我恭奉其道敘成王留已之意也王於文王武王皆欲令周公奉其道安其民其意一也周公分言之耳承安其文王之民恭奉其武王之道互相通也傳少子至賢人正義曰少子者呼成王之辭言我今所以來相宅於洛邑者欲令王居洛其大厚行典常於殷賢人而據洛為政故言來訓典為常故連言典常言其行常道也周受於殷故繼之於殷人有賢性故稱賢人傳言當至推先正義曰易稱日新之謂盛德雖舊有美政令王更復新之言當治理天下新其政化為四方之新君與後人為軌訓為周家見恭敬之王後丗所推先也謂周家後丗子孫有德之王被人恭敬推先已戒成王使為善政令後王崇重之傳曰其至成功正義曰重以誨王成其上事故言曰以起之傳我旦至推先正義曰旦是周公之名故自稱我旦也子者有德之稱大夫皆稱子故以多子為衆卿大夫同欲令成王行善政為後丗賢王所推先公與羣臣盡誠節為後丗賢臣所推先故欲以衆卿大夫及於御治事之臣深厚率行先王之業使當其人衆之心為周家後丗賢臣立信者之所推先也傳於此不言後丗從上省文也於君言見恭敬於臣言立信者以君尊言人敬臣卑言自立信因其所冝以設文也考朕至懷德正義曰周公又說制禮授王使王奉之我所成明子之法乃盡是汝文祖之德言用文王之道制禮其事大不可輕也又言所以須善治殷獻民者文武使已來居士中愼教殷民乃是見命於文武而安之故也制典當待太平我以時既太平即以秬黍鬯酒盛於二卣樽內我言曰當以此酒須明潔致敬於文武我則拜手稽首告文武以美享告云今太平即速告廟我不敢經宿則禋告文王武王以致太平之事汝王為政當順典常厚行之使有次序則諸為政者無云有遇用患疾之道苦毒下民則天下萬年猒飽於汝王之德殷乃長成為周王使殷民上下相承有次序則萬年之道下民其長觀我子孫而歸其德矣勸王使終之皆是誨王之言也傳我所至安之正義曰典禮治國事資聖人前聖後聖其終一揆故言所欲成明子之法乃盡是汝祖文王之德也子开成王言用文王之道制為典法以明成王行之為明君也特舉文祖不言武王下句並告文武兼用武王可知又述居洛邑之意所以居土中者是文武使已來居此地周公自言非已意也文武令我營此洛邑欲使居土中愼教殷民乃是見命於文武而安殷民也顧氏云文武使我來慎教殷民我今受文武之命以安民也傳周公至說之正義曰康誥之作事在七年云四方民大和㑹和㑹即太平之驗是周公攝政七年致太平也釋草云秬黑黍釋器云卣中樽也以黑黍為酒煮鬱金之草築而和之使芬香調暢謂之秬鬯鬯酒二器明潔致敬告文王武王以美享謂以太平之美事享祭也國語稱精意以享謂之禋釋詁云禋敬也是明禋為明潔致敬也太平是王之美事故太平告廟是以美享祭也公既告太平而致政成王成王留之故本而說之此事者欲令成王重其事厚行之周禮鬱鬯之酒實之於彞此言在卣者詩大雅江漢及文侯之命皆言秬鬯一卣告於文人則未祭實之於卣祭時實之於彞彼一卣此二卣者此一告文王一告武王彼王賜臣使告其太祖故惟一卣耳此經卣下言曰者說本盛酒於樽乃為此辭故言曰也傳言我至經宿正義曰此申述上明禋之事言我見天下太平則潔告文武不敢經宿示䖍恭之意也此三月營洛邑民巳和㑹則三月之時巳太平矣既告而致政則告在歲末而云不經宿者蓋周公營洛邑至冬始成得還鎬京即文武是為不經宿也且太平非一日之事公云不經宿者示䖍恭之意耳未必旦見太平即此日告也鄭玄以文祖為明堂日明禋者六典成祭於明堂告五帝太暭之屬也既告明堂則復禋於文武之廟告成洛邑傳汝為至為周正義曰釋言云惠順也此經述上惇典故言汝為政當順典常厚行之使有次序釋詁云遘遇也患疾之道謂虐政使人患疾之厚行典常使有次序則百官諸侯凡為政者皆無有遇用患疾之政以害下民則經歷萬年猒飽於汝德則殷國乃長成為周傳王使至終之正義曰上言天下民萬年猒飽王德此教為王德使萬年令民猒飽王德也能使殷民上下有次序則王德堪至萬年之道王之子孫當行不怠則民其長觀我子孫知其有德而歸其德矣此則長成為周勸勉王使終之戊辰至七年正義曰自此以下史終述之周公歸政成王既受言誥之王即東行赴洛邑其年十二月晦戊辰日王在新邑後月是夏之仲冬為冬節蒸祭其月節是周之歲首特異常祭加文王騂牛一武王騂牛一王命有司作䇿書乃使史官名逸者祝讀此䇿惟告文武之神言周公有功冝立其後為國君也其時王尊異周公以為賔殺牲享祭文王武王皆親至其廟王入廟之太室行祼鬯之禮言其尊異周公而禮敬深也於此祭時王命周公後令作䇿書使逸讀此䇿辭以告伯禽言封之於魯命為周公後也又揔述之在十有二月惟周公大安文武受命之事於此時惟攝政七年矣傳成王至晦到正義曰周公誥成王令居洛邑為治王既受周公之誥遂東行就居洛邑以十二月戊辰晦日到洛指言戊辰王在新邑知其晦日始到者此歲入戊午蔀五十六年三月云丙午朏以算術計之三月甲辰朔大四月甲戌朔小五月癸卯朔大六月癸酉朔小七月壬寅朔大八月壬申朔小九月辛丑朔大又有閏九月辛未朔小十月庚子朔大十一月庚午朔小十二月己亥朔大計十二月三十日戊辰晦到洛也傳明月至魯侯正義曰下云在十有二月者周之十二月建亥之月也戊辰是其晦日故明日即是夏之仲冬建子之月也言明月者此蒸祭非朔日故言月也自作新邑巳來未嘗於此祭祀此歲始於新邑蒸祭故曰蒸祭歲也周禮大司馬仲冬教大閲遂以享蒸是也王者冬祭必用仲月此是周之歲首故言歲耳王既戊辰晦到又須戒日致齊不得以朔日即祭之祭統云古者明君爵有德而祿有功必賜爵祿於太廟示不敢專也故云古者褒德賞功必於祭日示不專也因封之特設祭蒸之禮宗廟用太牢此文武皆言牛一知於太牢之外特加一牛告白文武之神言為尊周公立其後為魯侯魯頌所云王曰叔父建爾元子俾侯于魯是此時也王命作䇿者命有司作䇿書也讀䇿告神謂之祝逸祝䇿者使史逸讀䇿書也鄭玄以蒸祭上屬歲文王騂牛一者歲是成王元年正月朔日特告文武封周公也案周頌烈文序云成王即政諸侯助祭鄭箋云新王即政必以朝享之禮祭於祖考告嗣位也則鄭意以朝享之後特以二牛告文武封周公之後與孔義不同傳王賔至告神正義曰王賔異周公者王尊周公為賔異於其臣王肅云成王尊周公不敢臣之以為賔故封其子是也周語云精意以享謂之禋既殺二牲精誠其意以享祭文武咸皆也格至也皆至其廟言王重其事親告之也太室室之大者故為淸廟廟有五室中央曰太室王肅云太室淸廟中央之室淸廟神之所在故王入太室祼獻鬯酒以告神也祼者灌也王以圭瓉酌鬱鬯之酒以獻尸尸受祭而灌於地因奠不飲謂之祼效特牲云既灌然後迎牲則殺在祼後此經先言殺後言祼者殺者咸格表王敬公之意非行事之次也其王入太室祼乃是祭時行事耳周人尚臭祭禮以祼為重故言王祼其封伯禽乃是祭之將末非祼時也祭統賜臣爵祿之法云祭之日一獻君降立于阼階之南南嚮所命者北面史由君右執䇿命之鄭云一獻一酳尸也禮酳尸尸獻而祭畢是祭末乃命之以祼為重故特言之傳王為至拜後正義曰王為䇿書亦命有司為之也上云作䇿作告神之䇿此言作䇿誥伯禽之䇿祭於神謂之祝於人謂之誥故云使史逸誥伯禽封命之書封康叔謂之康誥此命伯禽當云伯禽之誥定四年左傳云命以伯禽即史逸所讀之䇿也上言逸祝䇿此誥下不言䇿者祝是讀書之名故上云祝䇿此誥是誥伯禽使知雖復讀書以誥之不得言誥䇿也上告周公其後已言告神封周公嫌此逸誥以他日告之故云皆同在蒸祭日以祭統言一獻命之知此亦祭日也文十三年公羊傳曰封魯公以為周公也周公拜乎前魯公拜乎後曰生以養周公死以為周公主傳言周至終述正義曰自戊辰巳上周公與成王相對語未有致政年月故史於此揔結之自戊辰巳下非是王與周公之辭故辨之云史所終述也尚書正義卷第十四計一萬七千四百五十字
