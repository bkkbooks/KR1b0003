body:
  text: 記夏本紀稱啓立有扈氏不服故伐之蓋由自堯舜受禪相承啓獨見繼父以此不服故云夏啓嗣禹立伐有扈之罪言繼立者見其由嗣立故不服也甘誓正義曰發首二句敘其誓之由其王曰巳下皆是誓之辭也曲禮云約信曰誓將與敵戰恐其損敗與將士設約示賞罰之信也將戰而誓是誓之大者禮將祭而號令齊百官亦謂之誓周禮大宰云祀五帝則掌百官之誓戒鄭玄云誓戒要之以刑重失禮也明堂位所謂各揚其職百官廢職服大刑是誓辭之略也彼亦是約信但小於戰之誓馬融云軍旅曰誓㑹同曰誥誥誓俱是號令之辭意小異耳傳甘有至先誓正義曰地理志扶風鄠縣古扈國夏啓所伐者也鄠扈音同未知何時改也啓伐有扈必將至其國乃出兵與啓戰故以甘爲有扈之郊地名馬融云甘有扈南郊地名計啓西行伐之當在東郊融則扶風人或當知其處也將戰先誓誓是臨戰時也甘誓牧誓費誓皆取誓地爲名湯誓舉其王號泰誓不言武誓者皆史官不同故立名有異耳泰誓未戰而誓故別爲之名泰誓自悔而誓非爲戰誓自約其心故舉其國名大戰至戮汝正義曰史官自先敘其事啓與有扈大戰于甘之野將欲交戰乃召六卿令與衆士俱集王乃言曰嗟重其事故嗟歎而呼之汝六卿者各有軍事之人我設要誓之言以勑告汝今有扈氏威虐侮慢五行之盛德怠惰棄廢三才之正道上天用失道之故今欲截絕其命天旣如此故我今惟奉行天之威罰不敢違天也我旣奉天汝當奉我汝諸士衆在車左者不治理於車左之事是汝不奉我命在車右者不治理於車右之事是汝不奉我命御車者非其馬之正令馬進退違戾是汝不奉我命汝等若用我命我則賞之於祖主之前若不用我命則戮之於社主之前所戮者非但止汝身而巳我則并殺汝子以戮辱汝汝等不可不用我命以求殺敵戒之使齊力戰也傳天子至命卿正義曰將戰而召六卿明是卿爲軍將天子六軍其將皆命卿周禮夏官序文也鄭玄云夏亦然則三王同也經言大戰者鄭玄云天子之兵故曰大孔無明說蓋以六軍並行威震多大故稱大戰傳各有至六事正義曰卿爲軍將故云乃召六卿及其誓之非六卿而巳鄭互云變六卿言六事之人者言軍吏下及士卒也下文戒左右與御是徧勑左軍之士歩卒亦在其閒六卿之身及所部之人各有軍事故六事之人爲揔呼之辭傳五行至亂常正義曰五行水火金木土也分行四時各有其德月令孟春三日太史謁於天子曰某日立春盛德在木夏云盛德在火秋云盛德在金冬云盛德在水此五行之德王者雖易姓相承其所取法同也言王者共所取法而有扈氏獨侮慢之所以爲大罪也且五行在人爲仁義禮智信威侮五行亦爲侮慢此五常而不行也有扈與夏同姓恃親而不恭天子廢君臣之義失相親之恩五常之道盡矣是威侮五行也無所畏忌作威虐而侮慢之故云威虐侮慢易說卦云立天之道曰隂與陽立地之道曰柔與剛立人之道曰仁與義物之爲大無大於此者周易謂之三才人生天地之閒莫不法天地而行事以此知怠惰棄廢天地人之正道棄廢此道言亂常也孔馬鄭王與皇甫謐等皆言有扈與夏同姓並依丗本之文楚語云昭王使觀射父傅太子射父辭之曰堯有丹朱舜有商均夏有觀扈周有管蔡是其恃親而不恭也周語云帝嘉禹德賜姓曰姒禹始得姓有扈與夏同姓則爲啓之兄弟如北者蓋禹未賜姓之前以姒爲姓故禹之親屬舊巳姓姒帝嘉其德又以姒姓顯揚之猶若伯夷國語稱賜姓曰姜然伯夷是炎帝之後未賜姓之前先爲姜姓與此同也故有扈以爲夏之同姓傳用其至滅之正義曰天子用兵稱恭行元罰諸侯討有罪稱肅將王誅皆示有所稟承不敢專也有扈旣有大罪冝其絕滅故原天之意言天用其失道之故欲截絕其命謂滅之也勦是斬斷之義故爲截也傳左車至其職正義曰歷言左右及御此三人在一車之上也故左爲車左則右爲車右明矣宣十二年左傳云楚許伯御樂伯攝叔爲右以致晉師樂伯曰吾聞致師者左射以菆攝叔曰吾聞致師者右入壘折馘執俘而還是左方主射右主擊刺而御居中也御言正馬而左右不言所職者以戰主殺敵左右用兵是戰之常事故略而不言御惟主馬故特言之互相明也此謂凡常兵車甲士三人所主皆如此耳若將之兵車則御者在左勇力之土在右將居鼓下在中央主擊鼓與軍人爲節度成二年左傳說晉伐齊云晉解張御郤克鄭丘緩爲右卻克傷於矢未絕鼓音曰余病矣張侯曰自始合而矢貫余手及肘余折以御左輪朱殷豈敢言病卻克傷於矢而鼔音未絕張侯爲御而血染左輪是御在左而將居中也攻之爲治常訓也治其職者左當射人右當擊刺是其所掌職事也傳御以至我命正義曰御以正馬爲政言御之政事事在正馬故馬不正則罪之詩云兩驂如手傳云進止如御者之手是爲馬之正也左右與御三者有失言皆不奉我命以御在後故揔解之傳天子至不專正義曰曽子問云孔子曰天子巡守以遷廟之主行載於齊車言必有尊也巡守尚然征伐必也故云天子親征必載遷廟之祖主行有功則賞祖主前示不專也周禮大司馬云若師不功則厭而奉主車鄭玄云厭㐲冠也奉猶送也送主歸於廟與社亦是征伐載主之事也傳天子至之義正義曰定四年左傳云君以軍行祓社釁鼓祝奉以從是天子親征又載社主行也郊特牲云惟爲社事單出里故以社事言之不用命奔北者則戮之於社主之前奔北謂背陳走也所以刑賞異處者社主隂隂主殺則祖主陽陽主生禮左宗廟右社稷是祖陽而社隂就祖賞就社殺親祖嚴社之義也大功大罪則在軍賞罰其徧敘諸勲乃至太祖賞耳傳孥子至累也正義曰詩云樂爾妻孥對妻別文是孥爲子也非但止辱汝身并及汝子亦殺言以恥惡累之湯誓云子則孥戮汝傳曰占之用刑父子兄弟罪不相及今云孥戮汝權以脅之使勿犯此亦然也五子之歌第三太康至之歌正義曰啓子太康以遊畋棄民爲羿所逐失其邦國其未失國之前畋于洛水之表太康之弟更有昆弟五人從太康畋獵與其母待太康于洛水之北太康爲羿所距不得反國其弟五人即啓之五子並怨太康各自作歌史敘其事作五子之歌傳太康至作歌正義曰昆弟五人自有長幼故稱昆弟嫌是太康之昆故云太康之五弟五子之歌正義曰史述作歌之由先敘失國之事其一曰以下乃是歌辭此五子作歌五章每章各是一人之作而辭相連接自爲終始初言皇祖有訓未必則指怨太康必是五子之歌相顧從輕至甚其一其二蓋是昆弟之次或是作歌之次不可知也傳啓之至名篇正義曰直言五子不知謂誰故言啓之五子太康之弟敘怨作歌不言五弟而言五子者以其述祖之訓故繫父以言之太康至作歌正義曰天子之在天位職當牧養兆民太康主以尊位用爲逸豫滅其人君之德衆人皆有二心太康乃復愛樂遊逸無有法度畋獵於洛水之表一出而十旬不反有窮國君其名曰羿因民不能堪忍太康之惡率衆距之于河不得反國太康初去之時其弟五人侍其母以從太康太康畋于洛南五弟待於洛北太康久而不反致使羿距于河五子皆怨太康追述大禹之戒以作歌而各敘己怨之志也其弟侍母以從太康太康初去即然待於洛水之北以兾太康速反羿旣距之五子乃怨史述太康之惡旣盡然後言其作歌故令羿距之文乃在母從之上作文之勢當然也傳尸主也正義曰釋詁文傳有窮至廢之正義曰襄四年左傳曰夏之方衰也后羿自鉏遷于窮石然則羿居窮石故曰有窮國名窮是諸侯之國羿是其君之名也說文云羿帝嚳射官也賈逵云羿之先祖丗爲先王射官故帝賜羿弓矢使司射淮南子云堯時十日並生堯使羿射九日而落之楚辭天問云羿焉彃日烏解羽歸藏易亦云羿彃十日說文云彃者射也此三者言雖不經以取信要言帝嚳時有羿堯時亦有羿則羿是善射之號非復人之名字信如彼言則不知羿名爲何也夏都河北洛在河南距太康於河北不得入國遂廢太康耳羿猶立仲康不自立也傳述循至敘怨正義曰述循釋詁文循其所戒用作歌以敘怨也其一曰皇祖有訓其二曰訓有之是述大禹之戒也其三恨亡國都其四恨絕宗祀其五言追悔無及直是指怨太康非爲述祖戒也本述戒作歌因即言及時事故言祖戒以揔之其一至不敬正義曰我君祖大禹有訓戒之事言民可親近不可卑賤輕下令其失分則人懷怨則事上之心不固矣民惟邦國之本本固則邦寧言在上不可使人怨也我視天下之民愚夫愚婦一能過勝我安得不敬畏之也所以畏其怨者一人之身三度有失凡所過失爲人所怨豈在明著大過皆由小事而起言小事不防易致大過故於不見細微之時當於是豫圖謀之使人不怨也我臨兆民之上常畏人怨懍懍乎危懼若腐索之馭六馬索絕則馬逸言危懼之甚人之可畏如是爲民上者奈何不敬愼乎怨太康之不恤下民也傳皇君至失分正義曰皇君釋詁文述禹之戒知君祖是禹禹有訓也民可近者據君爲文近謂親近之也下謂卑下輕忽之失本分也奪其農時勞以撗役是失分也故下云予視天下愚夫愚婦一能勝予是畏敬下民也傳言能至衆心正義曰我視愚夫愚婦當能勝我身是畏敬小民也由能畏敬小民故以小民從命是得衆心也傳三失至其微正義曰顧氏云怨豈在明未必皆在明著之時必於未形之日思善道以自防衞之是備愼其微也傳十萬至懼甚正義曰古數十萬曰億十億曰兆言多也懍懍心懼之意故爲危貌朽腐常訓也腐索馭六馬索絕馬驚馬驚則逸言危懼甚也經傳之文惟此言六馬漢丗此經不傳餘書多言駕四者春秋公羊說天子駕六毛詩說天子至大夫皆駕四許愼案王度記云天子駕六鄭玄以周禮校人養馬乗馬一師四圉四馬曰乗康王之誥云皆布乗黃朱以爲天子駕四漢丗天子駕六非常法也然則此言馬多懼深故舉六以言之傳作爲至鳥獸正義曰作爲釋言文昭元年左傳晉平公近女色過度惑以喪志老子云馳騁田獵令人心發狂好色好田則精神迷亂故迷亂曰荒女有美色男子恱之經傳通謂女人爲色獵則鳥獸並取故以禽爲鳥獸也傳陶唐至四方正義曰丗本云帝堯爲陶唐氏韋昭云陶唐皆國名猶湯稱殷商也案書傳皆言堯以唐侯升爲天子不言封於陶唐陶唐二字或共爲地名未必如昭言也以天子王有天下非獨兾州一方故以兾方爲都兾州統天下四方堯都平陽舜都蒲坂禹都安邑相去不盈二百皆在兾州自堯以來其都不出此地故舉陶唐以言之其四至絕祀正義曰有明明之德我祖大禹也以有明德爲萬邦之君謂爲天子也有治國之典有爲君之法遺其後丗之子孫使法則之又關通衡石之用使之和平人旣足用王之府藏則皆有矣典存國富冝以爲政今太康荒廢墜失其業覆滅宗族斷絶祭祀言太康棄典法所以滅宗祀也傳君萬至後丗正義曰萬邦之君謂君統萬國爲天子也典謂先王之典可憑據而行之故爲經籍則法釋詁文典謂先王舊典法謂當時所制其事不爲大異重言以備文耳貽遺釋言文以典法遺子孫言仁恩及後丗傳金鐵至取亡正義曰關者通也名石而可通者惟衡量之器耳律曆志云二十四銖爲兩十六兩爲斤三十斤爲鈞四鈞爲石是石爲稱之最重以石而稱則爲重物故金鐵曰石言絲緜止於斤兩金鐵乃至於石舉石而言之則止稱之物皆通之也傳取金鐵重物以解言石之意非謂所關通者惟金鐵耳米粟則斗斛以量之布帛則丈尺以度之惟言關通權衡則度量之物懋遷有無亦關通矣舉一以言之耳衡石所稱之物以供民之器用其土或有或無通使和平也論語云百姓足君孰與不足民旣足用則官亦富饒故通之使和平則官民皆足有典有法可依而行官民足可坐而守言古制存而太康失其業所以亡也訓緒爲業費氏顧氏等意云通金鐵於人官不禁障民得取之以供器用器用旣具所以上下充足以金鐵皆從石而生則金鐵亦石之類也故漢書五行志云石爲怪異入金不從革之條費顧之義亦得通也其五至可追正義曰嗚呼太康巳覆滅矣我將何所依歸我以此故思之而悲太康爲惡毒徧天下萬姓皆共仇我我將誰依就乎鬱陶而哀思乎我之心也我以此故外貌顔厚而内情忸怩羞慙由太康不愼其德以致此見距雖欲改悔其可追及之乎事巳往矣不可如何從首漸怨至此爲深皆是羿距時事也傳仇怨至國乎正義曰桓二年左傳云怨耦曰仇故爲怨也羿距於河不得復反乃思太康欲歸依之言當依誰以復國乎傳鬱陶至賢士正義曰孟子稱舜弟象見舜云思君正鬱陶鬱陶精神憤結積聚之意故爲哀思也詩云顔之厚矣羞愧之情見於面貌似如面皮厚然故以顔厚爲色愧忸怩羞不能言心慙之狀小人不足以知得失故慙愧於仁人賢士胤征第四羲和至胤征正義曰羲氏和氏丗掌天地四時之官今乃沈湎于酒過差非度廢天時亂甲乙不以所掌爲意胤國之侯受王命往征之史敘其事作胤征傳羲氏至甲乙正義曰羲氏和氏丗掌天地四時之官堯典所言是其事也羲和是重黎之後楚語稱堯育重黎之後使典天地以至于夏商是自唐虞至三代丗職不絕故此時羲和仍掌時日以太康逸豫臣亦縱㢮此承太康之後於今仍亦懈惰沈湎于酒過差非度廢天時亂甲乙是其罪也經云酒荒于厥邑惟言荒酒不言好色故訓淫爲過言耽酒爲過差也聖人作曆數以紀天時不存曆數是廢天時也日以甲乙爲紀不知日食是亂甲乙也傳奉辭罰罪正義曰奉責讓之辭伐不恭之罪名之曰征征者正也伐之以正其罪惟仲康至徂征正義曰惟仲康始即王位臨四海胤國之侯受王命爲大司馬掌六師於是有羲氏和氏廢其所掌之職縱酒荒迷亂于私邑胤國之君承王命往征之傳羿廢至天子正義曰以羿距太康於河於時必廢之也夏本紀云太康崩弟仲康立襄四年左傳云羿因夏民以代夏政則羿於其後篡天子之位仲康不能殺羿必是羿握其㩲知仲康之立是羿立之矣故云羿廢太康而立其弟仲康爲天子計五子之歌仲康當是其一仲康必賢於太康但形勢旣衰故政由羿耳羿在夏丗爲一代大賊左傳稱羿旣篡位寒浞殺之羿滅夏后相相子少康始滅浞復夏政計羿浞相承向有百載爲夏亂甚矣而夏本紀云太康崩其弟仲康立仲康崩子相立相崩子少康立都不言羿浞之事是馬遷之說踈矣告于至常刑正義曰胤侯將征羲和告于所部之衆曰嗟呼我所有之衆人聖人有謨之訓所以爲丗之明證可以定國安家其所謀者言先王能謹愼敬畏天戒臣人者能奉先王常法百官修常職輔其君君臣相與如是則君臣俱明惟爲明君明臣言君當謹愼以畏天臣當守職以輔君也先王恐其不然大開諫爭之路每歳孟春遒人之官以木鐸徇于道路以號令臣下使在官之衆更相規闕百工雖賤令執其藝能之事以諫上之失常其有違諫不恭謹者國家則有常刑傳徴證至安家正義曰成八年左傳稱晉殺趙括欒卻爲徴徴是證驗之義故爲證也能自保守是安定之義故爲安也聖人將爲敎訓必謀而後行故言所謀之敎訓聖人之言必有其驗故爲丗之明證用聖人之謨訓必有成功故所以定國安家傳言君至常法正義曰王者代天理官故稱天戒臣人奉主法令故言常憲君當奉天臣當奉君言君能戒愼天戒也臣能奉有常法奉行君法也此謂大臣下云百官修輔謂衆臣傳遒人至文敎正義曰以執木鐸徇於路是宣令之事故言宣令之官周禮無此官惟小宰云正歳帥理官之屬而觀治象之法徇以木鐸曰不用法者國有常刑宣令之事略與此同此似別置其官非如周之小宰名曰遒人不知其意蓋訓遒爲聚聚人而令之故以爲名也禮有金鐸木鐸鐸是鈴也其體以金爲之明舌有金木之異知木鐸是木舌也周禮敎鼔人以金鐸通鼔大司馬敎振旅兩司馬執鐸明堂位云振木鐸於朝是武事振金鐸文事振木鐸今云木鐸故云所以振文敎也傳官衆至失常正義曰相規相平等之辭故官衆謂衆官相規謂更相規闕平等有闕猶尚相規見上之過諫之必矣百工各執其所治技藝以諫謂被遣作器工有奢儉若月令云無作淫巧以蕩上心見其淫巧不正當執之以諫諫失常也百工之賤猶令進諫則百工以上不得不諫矣傳言百至大刑正義曰百官廢職服大刑明堂位文也顧氏云百官衆臣其有廢職懈怠不恭謹者國家當有常刑惟時至無赦正義曰言不諫尚有刑廢職懈怠是爲大罪惟是羲和顚倒其奉上之德而沈没昬亂於酒違叛其所掌之官離其所居位次始亂天之紀綱逺棄所主之事乃季秋九月之朔日月當合於辰其日之辰日月不合於舎不得合辰謂日被月食日有食之禮有救日之法於時瞽人樂官進鼓而擊之嗇夫馳騁而取幣以禮天神庶人奔走供救日食之百役此爲災異之大羣官促遽若此羲和主其官而不聞知日食是大罪也此羲和昬闇迷錯於天象以犯先王之誅此罪不可赦也故先王爲政之典曰主曆之官爲曆之法節氣先天時者殺無赦不及時者殺無赦失前失後尚猶合殺況乎不知日食其罪不可赦也況彼罪之大言已所以征也傳顚覆至之誅正義曰顚覆言反倒謂人反倒也人當竪立今乃反倒猶臣當事君今乃廢職似人之反倒然言臣以事君爲德故言顚覆厥德胤侯將陳羲和之罪故先舉孟春之令犯令之誅舉輕以見重小事犯令猶有常刑況叛官離次爲大罪乎傳沈謂至次位正義曰没水謂之沈大醉冥然無所復知猶沈水然故謂醉爲沈傳俶始至所主正義曰俶始遐逺皆釋詁文擾謂煩亂故爲亂也洪範五紀五曰曆數曆數所以紀天時此言天紀謂時日此時日之事是羲和所司言棄其所主傳辰日至可知正義曰昭七年左傳曰晉侯問於士文伯曰何謂辰對曰日月之㑹是謂辰是辰爲日月之會日月俱右行於天日行遲月行疾日每曰行一度月日行十三度十九分度之七計二十九日過半月巳行天一周又逐及日而與日聚會謂此聚㑹爲辰一歳十二㑹故爲十二辰即子丑寅卯之屬是也房謂室之房也故爲所舎之次計九月之朔日月當㑹於大火之次釋言云集㑹也㑹即是合故爲合也日月當聚會共舍今言日月不合於舎則是日月可知也日食者月掩之也月體掩日日被月映即不成共處故以不集言日食也或以爲房謂房星九月日月會于大火之次房心共爲大火言辰在房星事有似矣知不然者以集是止舎之處言其不集於舎故得以表日食若言不集於房星似太遲太疾惟可見曆錯不得以表日食也且日之所在星宿不見正可推筭以知之非能舉目而見之君子愼疑寧當以日在之宿爲文以此知其必非房星也傳凡日至百役正義曰文十五年左傳云日有食之天子不舉伐鼔于社諸侯用幣于社伐鼓于朝杜預以爲伐鼓于社責羣隂也此傳言責上公者郊特牲云社祭土而主隂氣也君南嚮北墉下荅隂之義也是言社主隂也日食隂侵陽故杜預以爲責羣隂也昭二十九年左傳云封爲上公祀爲貴神社稷五祀是尊是奉是社祭句龍爲上公之神也日食臣侵君之象故傳以爲責上公亦當羣隂上公並責之也周禮瞽矇之官掌作樂瞽爲樂官樂官用無目之人以其無目於音聲審也詩云奏鼓簡簡謂伐鼓爲奏鼔知樂官進鼔則伐之周禮太僕軍旅田役賛王鼔救日月亦如之鄭玄云王通鼔佐擊其餘面則救日之時王或親鼔莊二十五年穀梁傳曰天子救日置五麾陳五兵五鼔陳旣多皆樂人伐之周禮無嗇夫之官禮云嗇夫承命告于天子鄭玄云嗇夫蓋司空之屬也嗇夫主幣禮無其文此云嗇夫馳必馳走有所取也左傳云諸侯用幣則天子亦當有用幣之處嗇夫必是主幣之官馳取幣也社神尊於諸侯故諸侯用幣於社以請救天子伐鼓于社必不用幣知嗇夫馳取幣禮天神庶人走蓋是庶人在官者謂諸侯胥徒也其走必有事知爲供救日食之百役也曽子問云諸侯從天子救日食各以方色與其兵周禮庭氏云救日之弓矢是救日必有多役庶人走供之鄭注庭氏云以救日爲太陽之弓救月爲太隂之弓救日以枉矢救月以恒矢其鼓則蓋用祭天之雷鼓也昭十七年夏六月甲戍朔日有食之左傳云季平子曰惟正月朔慝未作日有食之於是乎有伐鼓用幣禮也其餘則否太史曰在此月也當夏四月是謂孟夏如彼傳文惟夏四月有伐鼔用幣之禮餘月則不然此以九月日食亦奏鼔用幣者顧氏云夏禮異於周禮也傳政典至無赦正義曰胤侯夏之卿士引政典而不言古典則當時之書知是夏后爲政之典籍也周禮太宰掌建邦之六典以佐王治邦國一曰治典二曰敎典三曰禮典四曰政典五曰刑典六曰事典若周官六卿之治典謂此也先時不及者謂此曆象之法四時節氣弦望晦朔不得先天時不得後天時四時時各九十日有餘分爲八節節各四十五日有餘也節氣者周天三百六十五日四分日之一四時分之均分爲十二月則月各得三十日十六分日之七以初爲節氣半爲中氣故一歳有二十四氣也計十二月每月二十九日彊半也以月初爲朔月盡爲晦當月之中日月相望故以月半爲望望去晦朔皆不滿十五日也又半此望去晦朔之數名之曰弦弦者言其月光正半如弓弦也晦者月盡無月言其闇也朔者蘇也言月死而更蘇也先天時者所名之日在天時之先假今天之正時當以甲子爲朔今曆乃以癸亥爲朔是造曆先天時也若以乙丑爲朔是造曆後天時也後即是不及時也其氣望等皆亦如此今予至戒哉正義曰羲和所犯如上故今我用汝所有之衆奉王命行天罰汝等衆士當同心盡力於王室庶幾輔我敬承天子之命使我伐必克之又恐兵威所及濫殺無辜故假喻以戒之火炎崐山之岡玉石俱被焚燒天王之吏爲過惡之德則酷烈甚於猛火冝誅惡存善不得濫殺滅其爲惡大帥罪止羲和之身其被迫脅而從距王師者皆無治責其罪久染汗穢之俗本無惡心皆與惟得更新一無所問又言將軍之法必有殺戮嗚呼重其事故歎而言之將軍威嚴能勝其愛心有罪者雖愛必誅信有成功若愛心勝其威嚴親愛者有罪不殺信無功矣言我雖愛汝有罪必殺其汝衆士冝勉力以戒愼哉勿違我命以取殺也傳將行至子弟正義曰將之爲行常訓也天欲加罪王者順天之罰則王誅也奉王命行王誅謂殺淫湎之身羲和之罪不及其嗣故知殺其身立其賢子弟楚語云重黎之後丗掌天地四時之官至于夏商則此不滅其族故傳言此也傳山脊至害玉正義曰釋山云山脊岡孫炎曰長山之脊也以崐山出玉言火逸害玉喻誅惡害善也傳逸過至於火正義曰逸即佚也佚是淫縱之名故爲過也天王之吏言位貴而威髙乗貴勢而逞毒心或睚眦而害良善故爲過惡之德其傷害天下甚於火之害玉猛火爲烈甚矣又復烈之於火言其害之深也傳殱滅至無治正義曰殱盡也釋詁文舎人曰殱衆之盡也衆皆死盡爲滅也渠大魁帥無正訓以上殱厥渠魁謂滅其元首故以渠爲大魁爲帥史傳因此謂賊之首領爲渠帥本源出於此自契至釐沃正義曰自此巳下皆商書也序本別卷與經不連孔以經序冝相附近引之各冠其篇首此篇經亡序存文無所託不可以無經之序爲卷之首本書在此故附此卷之末契是商之始祖逺本之自契至于成湯凡八遷都至湯始往居亳從其先王帝嚳舊居當時湯有言告史序其事作帝告釐沃二篇傳十四至國都正義曰周語曰玄王勤商十四丗而興玄王謂契也勤殖功業十四丗至湯而興爲天子也殷本紀云契生昭明昭明卒子相土立相土卒子昌若立昌若卒子曹圉立曹圉卒子冥立冥卒子振立振卒子微立微卒子報丁立報丁卒子報乙立報乙卒子報丙立報丙卒子主壬立主壬卒子主癸立主癸卒子天乙立天乙是爲成湯是也契至成湯十四丗凡八遷國都者商頌云帝立子生商是契居商也丗本云昭明居砥石左傳稱相土居商丘及今湯居亳事見經傳者有此四遷其餘四遷未詳聞也鄭玄云契本封商國在太華之陽皇甫謐云今上洛商是也襄九年左傳云陶唐氏之火正閼伯居商丘相土因之杜預云今梁國睢陽宋都是也其砥石先儒無言不知所在自契至湯諸侯之國而得數遷都者蓋以時王命之使遷至湯乃以商爲天下號則都雖數遷商名不改今湯遷亳乃作此篇若是諸侯遷都則不得史録其事以爲商書之首文在湯征諸侯伊尹去亳之上是湯將欲爲王時事史以商有天下乃追録初興并湯征與汝鳩汝方皆是伐桀前事後追録之也傳契父至王居正義曰先王天子也自契已下皆是諸侯且文稱契至湯今云從先王居者必從契之先丗天子所居也丗本本紀皆云契是帝嚳子知先王是契父帝嚳帝嚳本居亳今湯住從之嚳實帝也言先王者對文論優劣則有皇與帝及王之別散文則雖皇與帝皆得言王也故禮運云昔者先王未有宮室乃謂上皇爲王是其類也孔言湯自商丘遷焉以相土之居商丘其文見於左傳因之言自商丘徙耳此言不必然也何則相土契之孫也自契至湯凡八遷若相土至湯都遂不改豈契至桓土三丗而七遷也相土至湯必更遷都但不知湯從何地而遷亳耳必不從商丘遷也鄭玄云亳今河南偃師縣有亭漢書音義臣瓉者云湯居亳今濟隂亳縣是也今亳有湯塚已氏有伊尹塚杜預云梁國蒙縣北有亳城城中有成湯塚其西又有伊尹塚皇甫謐云孟子稱湯居亳與葛爲鄰葛伯不祀湯使亳衆爲之耕葛即今梁國寧陵之葛郷也若湯居偃師去寧陵八百餘里豈當使民爲之耕乎亳今梁國穀熟縣是也諸說不同未知孰是傳告來至皆亡正義曰經文旣亡其義難明孔以意言耳所言帝告不知告誰序言從先王居或當告帝嚳也傳葛國至於葛正義曰序言湯征諸侯知其人是葛國之君伯爵直云不祀文無指厈王制云山川神柢有不舉者爲不敬不敬者君削以地宗廟有不順者爲不孝不孝者君黜以爵是言不祀必廢其土地山川之神祇及宗廟皆不祀故湯始征之湯伐諸侯伐始於葛仲虺之誥云初征自葛是也孟子云湯居亳與葛爲鄰葛伯不𣏌湯使人問之曰何爲不祀曰無以供犧牲也湯使遺之牛羊葛伯食之又不祀湯又使人問之曰何爲不祀曰無以供粢盛也湯使亳往爲之耕老弱饋食葛伯率其人要其酒食黍稻者劫而奪之不授者殺之有童子以黍内餉殺而奪之書曰葛伯仇餉此之謂也是說伐始於葛之事也傳伊尹至於桀正義曰伊氏尹字故云字氏倒文以曉人也伊尹不得叛湯知湯貢之於桀必貢之者湯欲以誠輔桀兾其用賢以治不可匡輔乃始伐之此時未有伐桀之意故貢伊尹使輔之孫武兵書反閒篇曰商之興也伊尹在夏周之興也吕牙在殷言使之爲反閒也與此說殊傳鳩方至曰遇正義曰伊尹與之言知是賢臣也不期而㑹曰遇隱八年穀梁傳文也尚書正義卷第七計九千三百四十三字
