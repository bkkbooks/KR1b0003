  text: 尚書正義卷第十
  hash: sha256:da9769417fb059074f8e60a61b95cf9497e70faf7fd03cc025426613fa1ffcc8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1b0003_SBCK_010-1a}
body:
  text: 國子祭酒上護軍曲阜縣開國子臣孔穎達奉勑撰周書泰誓上第一泰誓中第二泰誓下第三牧誓第四武成第五泰誓上第一惟十至三篇正義曰惟文王受命十有一年武王服喪既畢舉兵伐殷以卜諸侯伐紂之心雖諸侯僉同乃退以示弱至十三年紂惡既盈乃復往伐之其年一月戊午之日師渡孟津王誓以戒衆史敘其事作泰誓三篇傳周自至示弱正義曰武成篇云我文考文王誕膺天命以撫方夏惟九年大統未集則文王以九年而卒也無逸稱文王享國五十年則嗣位至卒非徒九年而巳知此十一年者文王改稱元年至九年而卒至此年為十一年也詩云虞芮質厥成毛傳稱天下聞虞芮之訟息歸周者四十餘國故知周自虞芮質厥成諸侯並附以為受命之年至九年而文王卒至此十一年武王居父之喪三年服畢也案周書云文王受命九年惟暮春在鎬召太子發作文傳其時猶在但未知崩月就如暮春即崩武王服喪至十一年三月大祥至四月觀兵故今文泰誓亦云四月觀兵也知此十一年非武王即位之年者大戴禮云文王十五而生武王則武王少文王十四歲也禮記文王丗子云文王九十七而終武王九十三而終計其終年文王崩時武王巳八十三矣八十四即位至九十三而崩適滿十年不得以十三年伐紂知此十一年者據文王受命而數之必繼文王年者為其卒父業故也緯候之書言受命者謂有黃龍玄龜白魚赤雀負圖銜書以命人主其言起於漢哀平之丗經典無文焉孔時未有此說咸有一德傳云所征無敵謂之受天命此傳云諸侯並附以為受命之年是孔解受命皆以人事為言無瑞應也史記亦以斷虞芮之訟為受命元年但彼以文王受命七年而崩不得與孔同耳三年之喪二十五月而畢故九年文王卒至此三年服畢此經武王追陳前事云肆豫小子發以爾友邦冢君觀政于商是十一年伐殷者止為觀兵孟津以卜諸侯伐紂之心言于商知亦至孟津也傳十三年至伐紂正義曰以一月戊午乃是作誓月日經言十三年春大㑹于孟津又云戊午次于河朔知此一月戊午是十三年正月戊午日非是十一年正月也序不別言十三年而以一月接十一年下者序以觀兵至而即還略而不言月日誓則經有年有春故略而不言年春止言一月使其互相足也戊午是二十八日以曆推而知之據經亦有其驗漢書律曆志載舊說云死魄朔也生魄望也武成篇說此伐紂之事云惟一月壬辰旁死魄則壬辰近朔而非朔是為月二日也二日壬辰則此月辛卯朔矣以次數之知戊午是二十八日也不言正月而言一月者以武成經言一月故此序同之武成所以稱一月者易革卦彖曰湯武革命順乎天而應乎人象曰君子以治歷明時然則改正治歷必自武王始矣武王以殷之十二月發行正月四日殺紂既入商郊始改正朔以殷之正月為周之二月其初發時猶是殷之十二月未為周之正月改正在後不可追名為正月以其實是周之一月故史以一月名之顧氏以為古史質或云正月或云一月不與春秋正月同義或然也易緯稱文王受命改正朔布王號於天下鄭玄依而用之言文王生稱王巳改正然天無二日上無二王豈得殷紂尚在而稱周王哉若文王身自稱王巳改正朔則是功業成矣武王何得云大勳未集欲卒父業也禮記大傳云牧之野武王之大事也既事而退追王大王亶父王季歷文王昌是追為王何以得為文王身稱王巳改正朔也春秋王正月謂周正月也公羊傳曰王者孰謂謂文王其意以正為文王所改公羊傳漢初俗儒之言不足以取正也春秋之王自是當時之王非改正之王晉丗有王愆期者知其不可注公羊以為春秋制文王指孔子耳非周昌也文王丗子稱武王對文王云西方有九國焉君王其終撫諸呼文王為王是後人追為之辭其言未必可信亦非實也傳渡津乃作正義曰孟者河北地名春秋所謂向盟是也於孟地置津謂之孟津言師渡孟津乃作泰誓知三篇皆渡津乃作也然則中篇獨言戊午次于河朔者三篇皆河北乃作分為三篇耳上篇未次時作故言十三年春中篇既次乃作故言戊午之日下篇則明日乃作言時厥明各為首引故文不同耳尚書遭秦而亡漢初不知篇數武帝時有太常蓼侯孔臧者安國之從兄也與安國書云時人惟聞尚書二十八篇取象二十八宿謂為信然不知其有百篇也然則漢初惟有二十八篇無泰誓矣後得僞泰誓三篇諸儒多疑之馬融書序曰泰誓後得案其文似若淺露又云八百諸侯不召自來不期同時不謀同辭及火復於上至於王屋流為鵰五至以穀俱來舉火神怪得無在子所不語中乎又春秋引泰誓曰民之所欲天必從之國語引泰誓曰朕夢協朕卜襲于休祥戎商必克孟子引泰誓曰我武惟揚侵于之疆取彼凶殘我伐用張于湯有光孫卿引泰誓曰獨夫受禮記引泰誓曰豫克受非豫武惟朕文考無罪受克豫非朕文考有罪惟豫小子無良今文泰誓皆無此語吾見書傳多矣所引泰誓而不在泰誓者甚多弗復悉記略舉五事以明之亦可知矣王肅亦云泰誓近得非其本經馬融惟言後得不知何時得之漢書婁敬說髙祖云武王伐紂不期而㑹盟津之上者八百諸侯僞泰誓有此文不知其本出何書也武帝時董仲舒對䇿云書曰白魚入于王舟有火復于王屋流為烏周公曰復哉復哉今引其文是武帝之時巳得之矣李顒集注尚書於僞泰誓篇每引孔安國曰計安國必不為彼僞書作傳不知顒何由為此言梁主兼而存之言本有兩泰誓古文泰誓伐紂時事聖人取為尚書今文泰誓觀兵時事別録之以為周書此非辭也彼僞書三篇上篇觀兵時事中下二篇亦伐紂時事非盡觀兵時事也且觀兵示弱即退復何誓之有設有其誓不得同以泰誓為篇名也傳大㑹以誓衆正義曰經云大㑹于孟津知名曰泰誓者其大㑹以誓衆也王肅云武王以大道誓衆肅解彼僞文故說謬耳湯誓指湯為名此不言武誓而別立名者以武誓非一故史推義作名泰誓見大㑹也牧誓舉戰地時史意也顧氏以為泰者大之極也猶如天子諸侯之子曰太子天子之卿曰太宰此㑹中之大故稱泰誓也惟十至孟津正義曰此三篇俱是孟津之上大告諸國之君而發首異者此見大㑹誓衆故言大㑹于孟津中篇徇師而誓故言以師畢㑹下篇王更徇師故言大巡六師皆史官觀事而為作端緒耳傳三分至孟春正義曰論語稱三分天下有其二中篇言羣后以師畢㑹則周之所有諸國皆集牧誓所呼有庸蜀羌髳微盧彭濮人知此大㑹謂三分有二之諸侯及諸戎狄皆㑹也序言一月知此春是周之孟春謂建子之月也知者案三統曆以殷之十二月武王發師至二月甲子咸劉商王紂彼十二月即周之正月建子之月也傳冢大至聽誓正義曰冢大釋詁文侍御是治理之事故通訓御為治也同志為友天子友諸侯親之也牧誓傳曰言志同滅紂今揔呼國君皆為大君尊之也下及治事衆士謂國君以外卿大夫及士諸掌事者大小無不皆明聽誓自士以上皆揔戒之也傳生之至為貴正義曰萬物皆天地生之故謂天地為父母也老子云神得一以靈靈神是一故靈為神也禮運云人者天地之心五行之端也食味別聲被色而生者也言人能兼此氣性餘物則不能然故孝經云天地之性人為貴此經之意天地是萬物之父母言天地之意欲養萬物也人是萬物之最靈言其尤冝長養也紂違天地之心而殘害人物故言此以數之與下句為首引也傳沈湎至無辜正義曰人被酒困若沈於水酒變其色湎然齊同故沈湎為嗜酒之狀冒訓貪也亂女色荒也酷解經之暴殺解經之虐皆果敢為之案說文云酷酒厚味也酒味之厚必嚴烈人之暴虐與酒嚴烈同故謂之酷傳一人至政亂正義曰秦政酷虐有三族之刑謂非止犯者之身乃更上及其父下及其子經言罪人以族故以三族解之父母前丗也兄弟及妻當丗也子孫後丗也一人有罪刑及三族言淫濫也古者臣有大功乃得繼丗在位而紂之官人不以賢才而以父兄已濫受寵子弟頑愚亦用不堪其職所以政亂官人以丗惟當用其子耳而傳兼言兄者以紂為惡或當因兄用弟故以兄協句耳傳土髙至奢麗正義曰釋宫云宫謂之室室謂之宫李巡曰所以古今通語明實同而兩名此傳不解宫室義當然也釋宫又云闍謂之臺有木者謂之榭李巡曰臺積土為之所以觀望也臺上有屋謂之榭又云無室曰榭四方而髙曰臺孫炎曰榭但有堂也郭璞曰榭即今之堂隍也然則榭是臺上之屋歇前無室今之廳是也詩云彼澤之陂毛傳云陂澤障也障澤之水使不流溢謂之陂停水不流謂之池侈亦奢也謂衣服采飾過於制度言匱竭民之財力為奢麗也顧氏亦云華侈服飾二劉以為宫室之上而加侈服據孔傳云服飾過制即謂人之服飾二劉之說非也殷本紀云紂厚賦稅以實鹿臺之錢而盈巨橋之粟益收狗馬竒物充仞宫室益廣沙丘苑臺多聚野獸飛鳥置其中大聚樂戲於沙丘以酒為池懸肉為林使男女倮相逐其閒說紂奢侈之事書傳多矣傳忠良至暴虐正義曰焚炙俱燒也刳剔謂割剝也說文云刳刲也今人去肉至骨謂之剔去是剔亦刲之義也武王以此數紂之惡必有忠良被炙孕婦被刳不知其姓名為誰也殷本紀云紂為長夜之飲時諸侯或叛妲己以為罰輕紂欲重刑乃為尉斗以火燒之然使人舉輒爛其手不能勝紂怒乃更為銅柱以膏塗之亦加於炭火之上使有罪者緣之足滑跌墜入中紂與妲已以為大樂名曰炮烙之刑是紂焚炙之事也後文王獻洛西之地赤壤之田方千里請紂除炮烙之刑紂許之皇甫謐作帝王丗紀亦云然謐又云紂剖比干妻以視其胎即引此為刳剔孕婦也傳悛改至之甚正義曰左傳稱長惡不悛悛是退前創改之義故為改也觀政于商計當恐怖言紂縱惡無改悔之心平居無故不事神祇是紂之大惡上帝舉其尊者謂諸神悉皆不事故傳言百神以該之不事亦是不祀別言遺厥先宗廟弗祀遺棄祖父言其慢之甚也天佑至厥志正義曰巳上數紂之罪此言伐紂之意上天佑助下民不欲使之遭害故命我為之君上使臨政之為之師保使教誨之為人君為人師者天意如此不可違天我今惟其當能佑助上天寵安四方之民使民免於患難今紂暴虐無君師之道故今我往伐之不知伐罪之事為有罪也為無罪也不問有罪無罪志在必伐我何敢有逺其本志而不伐之傳言天至教之正義曰衆民不能自治立君以治之立君治民乃是天意言天佑助下民為立君也治民之謂君教民之謂師君既治之師又教之故言作之君作之師師謂君與民為師非為別置師也傳當能至天下正義曰天愛下民為立君立師者當能佑助天意寵安天下不奪民之財力不妄非理刑殺是助天寵愛民也傳越逺至其志正義曰越者踰越超逺之義故為逺也武王伐紂內實為民除害外則以臣伐君故疑其有罪與無罪言巳志欲為民除害無問是之與否不敢逺其志言已本志欲伐何敢逺本志捨而不伐也傳力鈞至可見義曰德者得也自得於心義者冝也動合事冝但德在於身言有德義施於行故言秉執武王志在養民動為除害有君之明德執利民之大義與紂無者為敵雖未交兵揆度優劣負可見示以必勝之道令士衆勉力而戰也傳紂之至同罪正義曰紂之為惡如物在繩索之貫一以貫之其惡貫巳滿矣物極則反天下欲畢其命故上天命我誅之今我不誅紂則是逆天之命無恤民之心是我與紂同罪矣猶如律故縱者與同罪也傳祭社至於紂正義曰釋天引詩云乃立冢土戎醜攸行即云起大事動大衆必先有事乎社而後出謂之冝孫炎曰冝求見福祐也是祭社曰冝冢訓大也社是土神故冢土社也毛詩傳云冢土大社也受命文考是告廟以行故為告文王廟也王制云天子將出類乎上帝冝乎社造乎禰此受命文考即是造乎禰也王制以神尊卑為次故先言帝社後言禰此以廟是已親若言家內私議然後告天故先言受命文考而後言類于上帝舜典類于上帝傳云告天及五帝比以事類告天亦當如彼也罰紂是天之意故用汝衆致天罰於紂也泰誓中第二傳次止至之北正義曰次是止舍之名榖梁傳亦云次止也序云一月戊午師渡孟津則師以戊午日渡也此戊午日次于河朔則是師渡之日次止也上篇是渡河而誓未及止舍而先誓之此次于河朔者是既誓而止於河之北也莊三年左傳例云凡師一宿為舍再宿為信過信為次此次直取止舍之義非春秋三日之例也何則商郊去河四百餘里戊午渡河甲子殺紂相去才六日耳是今日次訖又誓明日誓訖即行不容三日止于河旁也傳徇循至西土正義曰說文云徇疾也循行也徇是疾行之意故以徇為循也下篇大巡六師義亦然也此誓揔戒衆軍武王國在西偏此師皆從西而來故稱西土傳鮐背至小人正義曰釋詁云鮐背耇老壽也舍人曰鮐背老人氣衰皮膚消瘠背若鮐魚也孫炎曰耇面凍梨色似浮垢也然則老人背皮似鮐面色似梨故鮐背之耇稱梨老傳以播為布布者遍也言遍棄之不禮敬也昵近釋詁文孫炎曰昵親近也牧誓數紂之罪云四方之多罪逋逃是崇是長是信是使知紂所親近罪人謂天下逋逃之小人也傳過酗至罪同正義曰酗是酒怒淫酗共文則淫非女色故以淫為過言飲酒過多也肆是放縱之意酒過則酗縱情為虐以酒成此暴虐之惡臣下化而為之由紂惡而臣亦惡言君臣之罪同也朋家至彰聞正義曰小人好忿天性之常化紂淫酗怨怒無巳臣下朋黨共為一家與前人並作仇敵脅上權命以相滅亡無罪之人怨嗟呼天紂之穢惡之德彰聞天地言其罪惡深也傳臣下至惡深正義曰脅上謂紂既昏迷朝無綱紀姦宄之臣脅於在下假用在上之權命脅之更相誅滅也傳浮過正義曰物在水上謂之浮浮者髙之意故為過也桀罪巳大紂又過之言紂惡之甚故下句說其過桀之狀案夏本紀及帝王丗紀云諸侯叛桀關龍逢引皇圖而諫桀殺之伊尹諫桀桀曰天之有日如吾之有民日亡吾乃亡矣是桀亦賊虐諫輔謂已有天命而云過於桀者殷本紀云紂剖比干觀其心桀殺龍逢無剖心之事又桀惟比之於日紂乃詐命於天又紂有炮烙之刑又有刳胎斫脛之事而桀皆無之是紂罪過於桀也傳剝傷至殺之正義曰說文云剝裂也一曰剝割也裂與割俱是傷害之義也殺人謂之賊故賊為殺也元者善之長易文言文良之為善書傳通訓也元良俱善而雙舉之者言其剝喪善中之善為害大也以諫輔紂紂反殺之即比干是也上篇言焚炙忠良與此經相類而復言此者以殺害人為惡之大故重陳之也傳其梘至誅之正義曰紂罪過於桀而言與桀同辜者罪不過死合死之罪同言必誅也傳言我至之占正義曰夢者事之祥人之精爽先見者也吉凶或有其驗聖王採而用之我卜伐紂得吉夢又戰勝禮記稱卜筮不相襲襲者重合之義訓戎為兵夢卜俱合於美是以兵誅紂必克之占也聖人逆知來物不假夢卜言此以強軍人之意耳史記周本紀云武王伐紂卜龜兆不吉羣公皆懼惟太公強之太公六韜云卜戰龜兆焦筮又不吉太公曰枯骨朽蓍不踰人矣彼言不吉者六韜之書後人所作史記又採用六韜好事者妄矜太公非實事也傳平人至不同正義曰昭二十四年左傳此文服虔杜預以夷人為夷狄之人即如彼言惟云億兆夷人則受率其旅若林即曽無華夏人矣故傳訓夷為平平人為凡人言其智慮齊識見同人數雖多執心用德不同心謂謀慮德謂用行智識既齊各欲申意故心德不同也傳我治至德同正義曰釋詁云亂治也故謂我治理之臣有十人也十人皆是上智咸識周是殷非故人數雖少而心德同同佐武王欲共滅紂也論語引此云豫有亂臣十人而孔子論之有一婦人焉則十人之內其一是婦人故先儒鄭玄等皆以十人為文母周公太公召公畢公榮公太顚宏夭散冝生南宮括也傳周至至仁人正義曰詩毛傳亦以周為至相傳為此訓也武王三分天下有其二則紂黨不多於周但辭有激發旨有抑揚欲明多惡不如少善故言紂至親雖多不如周家之少仁人也百姓有過在豫一人正義曰言此者以上云民之所惡天必誅之巳今有善不為民之所惡天必佑我令教化百姓若不教百姓使有罪過實在我一人之身此百姓與下百姓懍懍皆謂天下衆民也今朕至有光正義曰既與天下為任則當為之除害今我必往伐紂我之武事惟於此舉之侵紂之疆境取彼為凶殘之惡者若得取而殺之是我伐凶惡之事用張設矣湯惟放逐我能擒取是比於湯又益有光明傳揚舉至伐之正義曰文王丗子論舉賢之法云或以事舉或以言揚是揚舉義同故揚為舉也於時猶在河朔將欲行適商都言我舉武事侵入紂之郊疆往伐之也春秋之例有鐘鼓曰伐無曰侵此實伐也言往侵者侵是入之意非如春秋之例無鐘鼓也勗哉至非敵正義曰取得紂則功多於湯冝勉力哉夫子將士等呼將士令勉力也以兵伐人當臨事而懼汝將士等無敢有無畏輕敵之心寧執守似前人之強非已能敵之志以伐之如是乃可克矣傳朂勉至克矣正義曰朂勉釋詁文呼將士而誓之知夫子是將士也老子云禍莫大於輕敵故令將士無敢有無畏之心令其必以前敵為可畏也論語稱子路曰子行三軍則誰與孔子曰必也臨事而懼令軍士等不欲發意輕前人寧執非敵之志恐彼強多非我能敵執此志以伐之則當克矣傳言民至容頭正義曰懍懍是怖懼之意言民畏紂之虐危懼不安其志懍懍然以畜獸為喻民之怖懼若似畜獸崩摧其頭角然無所容頭顧氏云常如人之欲崩其角也言容頭無地隱三年穀梁傳曰髙曰崩頭角之稱崩體之髙也泰誓下第三傳是其至巳上正義曰上篇未次而誓故略言大㑹中篇既次乃誓為文稍詳故言以師畢㑹此篇最在其後為文益詳故言大巡六師巡繞周遍大其事故稱大也師者衆也天子之行通以六師為言於時諸侯盡㑹其師不啻六也師出以律易師卦初六爻辭也律法也行師以法即誓勑賞勸是也禮成於三故為三篇之誓三度申重號令為重愼艱難之義也孫子兵法三令五申之此誓三篇亦為三令之事也牧誓王所呼者從上而下至百夫長而止知此衆士是百夫長巳上也傳言天至法則正義曰孝經云則天之明昭二十五年左傳云以象天明是治民之事皆法天之道天有尊卑之序人有上下之節三正五常皆在於天有其明道此天之明道其義類惟明言明白可效王者所冝法則之將言商王不法天道故先摽二句於前其下乃述商王違天之事言其罪冝誅也傳輕狎至神明正義曰鄭玄論語注云狎慣忽之言慣見而忽之意與侮同傳因文重而分之五常即五典謂父義母慈兄友弟恭子孝五者人之常行法天明道為之輕狎五常之教侮慢而不遵行之是違天顯也訓荒為大大為怠惰不敬謂不敬天地神明也上篇云不事上帝神祗知此不敬天地神明也禮云母不敬傳舉天地以言明每事皆不敬也傳冬月至之甚正義曰釋器云魚曰斫之樊光云斫斫也說文云斫斬也斬朝涉水之脛必有所由知冬月見朝涉水者謂其脛耐寒疑其骨髓有異斬而視之其事或當有所出也殷本紀云微子既去比干曰為人臣者不得不以死爭乃強諫紂怒曰吾聞聖人心有七竅遂剖比干觀其心是紂謂比干心異於人剖而觀之言酷虐之甚傳痡病至及逺正義曰痡病釋詁丈紂之毒害未必遍及夷狄而云病四海者言害所及者逺也郊社至婦人正義曰不修謂不掃治也不享謂不祭祀也與上篇不事上帝神祇遺厥先宗廟不祀其事一也重言之耳竒技謂竒異技能淫巧謂過度工巧二者大同但技據人身巧指器物為異耳傳祝斷正義曰哀十四年公羊傳云子路死子曰天祝豫何休云祝斷也是相傳訓也傳迪進至之功正義曰迪進登成皆釋詁文殺敵為果致果為毅宣二年左傳文果謂果敢毅謂強決能殺敵人謂之為果言能果敢以除賊致此果敢是名為毅言能強決以立功皆言其心不猶豫也軍法以殺敵為上故勸令果毅成功也傳若紂至之致正義曰言克受乃是文王之功若受克豫非是文王之罪而言非我父罪我之無善之致者其意言勝非我功敗非父咎崇孝罪已以求衆心耳牧誓第四武王至牧誓正義曰武王以兵戎之車三百兩虎賁之士三百人與受戰於商郊牧地之野將戰之時王設言以誓衆史敘其事作牧誓傳兵車至全數正義曰孔以虎賁三百人與戎車數同王於誓時所呼有百夫長因謂虎賁即是百夫之長一人而乘一車故云兵車百夫長所載也數車之法一車謂之一兩詩云百兩迓之是車稱兩也風俗通說車有兩輪故稱為兩猶屨有兩隻亦稱為兩詩云葛屨五兩即其類也一車步卒七十二人司馬法文也車有七十二人三百乘凡二萬一千人計車有七十二人三百乘當有二萬一千六百人孔略六百而不言故云舉全數顧氏亦同此解孔既用司馬法一車七十二人又云兵車百夫長所載又下傳以百夫長為卒帥是實領百人非惟七十二人依周禮大司馬法天子六軍出自六鄉凡起徒役無過家一人故一鄉出一軍鄉為正遂為副若鄉遂不足則徴兵于邦國則司馬法六十四井為甸計有五百七十六夫共出長轂一乘甲士三人步卒七十二人至於臨敵對戰布陳之時則依六鄉軍法五人為伍五伍為兩四兩為卒五卒為旅五旅為師五師為軍故左傳云先偏後伍又云廣有一卒卒偏之兩非直人數如此車數亦然故周禮云乃㑹車之卒伍鄭云車亦有卒伍左傳戰于繻葛杜注云車二十五乘為偏是車亦為卒伍之數也則一車七十二人者自計元科兵之數科兵既至臨時配割其車雖在其人分散前配車之人臨戰不得還屬本車當更以虎賁甲士配車而戰孔舉七十二人元科兵數者欲揔明三百兩人之大數云兵車百夫長所載者欲見臨敵實一車有百人既虎賁與車數相當又經稱百夫長故孔為此說傳勇士至夫長正義曰周禮虎賁氏之官其屬有虎士八百人是虎賁為勇士稱也若虎之賁走逐獸言其猛也此虎賁必是軍內驍勇選而為之當時謂之虎賁樂記云虎賁之士說劒謂此也孔意虎賁即是經之百夫長故云皆百夫長也傳是克至早旦正義曰春秋主書動事編次為文於法日月時年皆具其有不具史闕耳尚書惟記言語直指設言之日上篇戊午次于河朔洛誥戊辰王在新邑與此甲子皆言有日無月史意不為編次故不具也是克紂之月甲子之日是周之二月四日以曆推而知之也釋言云晦冥也昧亦晦義故為冥也冥是夜爽是明夜而未明謂早旦之時蓋雞鳴後也為下朝至發端朝即昧爽時也傳紂近至紂戰正義曰傳言在紂近郊三十里或當有所據也皇甫謐云在朝歌南七十里不知出何書也言至于商郊牧野知牧是郊上之地戰在平野故言野耳詩云于牧之野禮記大傳云牧之野武王之大事繼牧言野明是牧地而鄭玄云郊外曰野將戰于郊故至牧野而誓案經至于商郊牧野乃誓豈王行巳至於郊乃復到退適野誓訖而更進兵乎何不然之甚也武成云癸亥夜陳未畢而雨是癸亥夜已布陳故甲子朝而誓衆將與紂戰故戒勑之傳鉞以至苦之正義曰太公六韜云大柯斧重八斤一名天鉞廣雅云鉞斧也斧稱黃鉞故知以黃金飾斧也鉞以殺戮殺戮用右手用左手杖鉞示無事於誅右手把旄示有事於教其意言惟教軍人不誅殺也把旄何以白旄用白者取其易見也逖逺釋詁文傳治事至戰者正義曰孔以於時巳稱王而有六師亦應巳置六卿今呼治事惟三卿者司徒主民治徒庶之政令司馬主兵治軍旅之誓戒司空主土治壘壁以營軍是指誓戰者故不及太宰太宗司寇也其時六卿具否不可得知但據此三卿為說耳此御事之文指三卿而說是不通於亞旅巳下傳亞次至門者正義曰亞次釋言文旅衆釋詁文此及左傳皆卿下言亞旅知是大夫其位次卿而數衆故以亞次名之謂諸是四命之大夫在軍有職事者也師氏亦大夫其官掌以兵守門所掌尤重故別言之周禮師氏中大夫使其屬帥四夷之隸各以其兵服守王之門外朝在野外則守內列鄭玄云內列蕃營之在內者也守之如守王宫傳師帥卒帥正義曰周禮二千五百人為師師帥皆中大夫百人為卒卒長皆上士孔以師雖二千五百人舉全數亦得為千夫長長與帥其義同是千夫長亦可以稱帥故以千夫長為師帥百夫長為卒帥王肅云師長卒長意與孔同順經文而稱長耳鄭玄以為師帥旅帥也與孔不同傳八國至之南正義曰九州之外四夷大名則東夷西戎南蠻北狄其在當方或南有戎而西有夷此八國並非華夏故大判言之皆蠻夷戎狄屬文王者國名也此八國皆西南夷也文王國在於西故西南夷先屬焉大劉以蜀是蜀郡顯然可知故孔不說又退庸就濮解之故以次先解羌云羌在西蜀叟者漢丗西南之夷蜀名為大故傳據蜀而說左思蜀都賦云三蜀之豪時來時往是蜀都分為三羌在其西故云西蜀叟叟者蜀夷之别名故後漢書興平元年馬騰劉範謀誅李􅔸益州牧劉焉遣叟兵五千人助之是蜀夷有名叟者也髳微在巴蜀者巴在蜀之東偏漢之巴郡所治江州縣也盧彭在西北者在東蜀之西北也文十六年左傳稱庸與百濮伐楚楚遂滅庸是庸濮在江漢之南傳稱舉至干楯正義曰稱舉釋言文方言云戟楚謂之孑吳揚之閒謂之戈是戈即戟也考工記云戈柲六尺有六寸車戟常鄭云八尺曰尋倍尋曰常然則戈戟長短異名而云戈者即戟戈戟長短雖異其形制則同此云舉戈冝舉其長者故以戈為戟也方言又云楯自關而東或謂之楯或謂之干關西謂之楯是干楯為一也戈短人執以舉之故言稱楯則並以扞敵故言比矛長立之於地故言立也傳索盡至國亡正義曰禮記檀弓曰吾離羣而索居則索居為散義鄭玄云索散也物散則盡故索為盡也牝雞雌也爾雅飛曰雌雄走曰牝牡而此言牝雞者毛詩左傳稱雄狐是亦飛走通也此以牝雞之鳴喻婦人知外事故重申喻意云雌代雄鳴則家盡婦奪夫政則國亡家揔貴賤為文言家以對國耳將陳紂用婦言故舉此古人之語紂直用婦言耳非能奪其政舉此言者專用其言賞罰由婦即是奪其政矣婦人不當知政是別外內之分若使賢如文母可以興助國家則非牝雞之喻矣傳妲己至用之正義曰晉語云殷辛伐有蘇氏蘇氏以妲己女焉妲己有寵而亡殷殷本紀云紂嬖于婦人愛妲己惟妲己之言是從列女傳云紂好酒淫樂不離妲己妲己所舉言者貴之妲己所憎者誅之為長夜飲妲己好之百姓怨望而諸侯有叛者妲己曰罰輕誅薄威不立耳紂乃重刑辟為炮烙之法妲己乃笑武王伐紂斬妲己頭懸之於小白旗上以為亡紂者此女也傳昏亂至鬼神正義曰昏暗者於事必亂故昏為亂也詩云肆筵設席肆者陳設之意毛傳亦以肆為陳也對答相當之事故答為當也紂身昏亂棄其冝所陳設祭祀不復當享鬼神與上郊社不修宗廟不享亦一也不事神祇惡之大者故泰誓及此三言之傳王父至以道正義曰釋親云父之考為王父則王父是祖也紂無親祖可棄故為祖之昆弟棄其祖之昆弟則父之昆弟亦棄之矣春秋之例母弟稱弟凡春秋稱弟皆是母弟也母弟謂同母之弟同母尚棄別生者必棄矣舉尊親以見卑踈也遺亦棄也言紂之昏亂棄其所遺骨肉之親不接之以道經先言棄祀棄親者鄭玄云誓首言此者神怒民怨紂所以亡也傳使四至都邑正義曰暴虐謂殺害殺害加於人故言於百姓姦宄謂劫奪劫奪有處故言於商邑百姓亦是商邑之人故傳揔言於都邑也傳今日至一心正義曰戰法布陳然後相向故設其就敵之限不過六步七步乃止相齊焉欲其相得力也樂記稱進旅退旅是旅為衆也言當衆進一心也傳夫子至為例正義曰此及下文三云夫子此勗哉在下下勗哉在上此先呼其人然後勉之此既言然下先令勉勵乃呼其人各與下句為目也上有戈矛戈謂擊兵矛謂刺兵故云伐謂擊刺此伐猶伐樹然也傳桓桓武貌正義曰釋訓云桓桓威也詩序云桓武志也傳貔執夷正義曰釋獸云貔白狐其子􅩸舍人曰貔名白狐其子名􅩸郭璞曰一名執夷虎豹屬傳商衆至之義正義曰迓訓迎也不迎擊商衆能奔來降者兵法不誅降也役謂使用也如此不殺降人則所以使用我西土之義用義於彼令彼知我有義也王肅讀御為禦言不禦能奔走者如殷民欲奔走來降者無逆之奔走去者亦不禦止役為也盡力以為我西土與孔不同武成第五武王至武成正義曰武王之伐殷也往則陳兵伐紂歸放牛馬為獸記識殷家美政善事而行用之史敘其事作武成傳往誅至牧地正義曰此序於經于征伐商是往伐也歸馬放牛是歸獸也故傳引經以解之爾雅有釋獸釋畜畜獸形相類也在野自生為獸人家養之為畜歸馬放牛不復乘用使之自生自死若野獸然故謂之獸獸以野澤為家故言歸也傳記識至為法正義曰紂以昏亂而滅前丗政有善者故訪問殷家政教記識善事以為治國之法經云列爵惟五分土惟三是也武成正義曰此篇敘事多而王言少惟辭又首尾不結體裁異於餘篇自惟一月至受命于周史敘伐殷往反及諸侯大集為王言發端也自王若曰至大統未集述祖父巳來開建王業之事也自豫小子至名山大川言已承父祖之意告神陳紂之罪也自曰惟有道至無作神羞王自陳告神之辭也既戊午巳下又是史敘往伐殺紂入殷都布政之事無作神羞以下惟告神其辭不結文義不成非述作之體案左傳荀偃禱河云無作神羞其官臣偃無敢復濟惟爾有神裁之蒯聵禱祖云無作三祖羞大命不敢請佩玉不敢愛彼二者於神羞之下皆更申已意此經無作神羞下更無語直是與神之言猶尚末訖且冢君百工初受周命王當有以戒之如湯誥之類冝應說其除害與民更始創以為惡之禍勸以行道之福不得大聚百官惟誦禱辭而已欲征則殷勤誓衆既克則空話禱神聖人有作理必不爾竊謂神羞之下更合有言簡編斷絶經失其本所以辭不次耳或𥘉藏之日已失其本或壞壁得之始有脫漏故孔稱五十八篇以外錯亂磨滅不可復知明是見在諸篇亦容脫錯但孔此篇首尾具足既取其文為之作傳恥云有所失落不復言其事耳傳文王至克商正義日文王受命有此武功詩之文也彼言武功謂始伐崇耳殷紂尚在其功未成成功在於克商今武始成矣故以武成名篇以泰誓繼文王之年故本之於文王鄭云著武道至此而成惟一至武成正義曰此歷敘伐紂往反祀廟告天時日說武功成之事也一月壬辰旁死魄謂伐紂之年周正月辛卯朔其二日是壬辰也翼日癸巳王朝步自周于征伐商謂正月三日發鎬京始東行也其月二十八日戊午渡河泰誓序云一月戊午師渡孟津泰誓中篇云惟戊午王次于河朔是也二月辛酉朔甲子殺紂牧誓云時甲子昧爽乃誓是也其年閏二月庚寅朔三月庚申朔四月己丑朔厥四月哉生明王來自商至于豐謂四月三日月始生明其日當是辛卯也丁未祀于周廟四月十九日也越三日庚戌柴望二十二日也正月始往伐四月告成功史敘其事見其功成之次也漢書律曆志引武成篇云惟一月壬辰旁死魄若翼日癸巳武王乃朝步自周于征伐紂越若來二月既死魄越五日甲子咸劉商王紂惟四月既旁生魄越六日庚戌武王燎于周廟翼日辛亥祀於天位越五日乙卯乃以庶國祀於周廟與此經不同彼是焚書之後有人僞為之漢丗謂之逸書其後又亡其篇鄭玄云武成逸書建武之際亡謂彼僞武成也傳此本至死魄正義曰將言武成逺本其始此本說始伐紂時一月周之正月是建子之月殷十二月也此月辛卯朔朔是死魄故月二日近死魄魄者形也謂月之輪郭無光之處名魄也朔後明生而魄死望後明死而魄生律曆志云死魄朔也生魄望也顧命云惟四月哉生魄傳云始生魄月十六日也月十六日為始生魄是一日為始死魄二日近死魄也顧氏解死魄與小劉同大劉以三日為始死魄二日為旁死魄旁死魄無事而記之者與下日為發端猶今之將言日必先言朔也傳翼明至孟津正義曰翼明釋言文釋宫云堂上謂之行堂下謂之步彼相對為名耳散則可以通故步為行也周去孟津千里以正月三日行自周二十八日渡孟津凡二十五日每日四十許里時之冝也詩云于三十里毛傳云師行三十里蓋言其大法耳傳其四至互言正義曰其四月此伐商之四月也哉始釋詁文顧命傳以哉生魄為十六日則哉生明為月初矣以三日月光見故傳言始生明月三日也此經無日未必非二日也生明死魄俱是月初上云死魄此云生明而魄死明生互言耳傳倒載至文教正義曰樂記云武王克殷濟河而西車甲釁而藏之府庫倒載干戈包之以虎皮天下知武王之不復用兵也散軍而郊射左射貍首右射騶虞而貫革之射息也是偃武修文之事故傳引之郊射是禮射也王制論四代學名云虞謂之庠夏謂之序故言設庠序修文教也傳山南至乘用正義曰釋山云山西曰夕陽山東曰朝陽李巡曰山西暮乃見日故曰夕陽山東朝乃見日故云朝陽陽以見日為名故知山南曰陽杜預云桃林之塞今弘農華隂縣潼關是也是在華山東也指其所往謂之歸據我釋之則云放放牛歸馬互言之耳華山之旁尤乏水草非長養牛馬之地欲使自生自死此是戰時牛馬故放之以示天下不復乘用易繫辭云服牛乘馬服乘俱是用義故以服揔牛馬傳四月至執事正義曰以四月之字隔文巳多故言四月丁未此以成功設祭明其遍告羣祖知告后稷以下后稷則始祖以下容毀廟也天子七廟故云文考文王以上七丗之祖見是周廟皆祭之故經揔云周廟也駿大釋詁文周禮六服侯甸男采衛要此略舉邦國在諸侯服故云甸侯衛其言不次詩頌云駿奔走在廟故云皆大奔走於廟執事也越三日庚戌正義曰召誥云越三日者皆從前至今為三日此從丁未數之則為四日蓋史官不同立文自異或此三當為四由字積與誤傳魄生至一統正義曰月以望虧望是月半望在十六日為多通率在十六日者四分居三其一在十五日耳此言既生魄故言魄生明死十五日之後也丁未祀于周廟已是此月十九日矣此受命于周繼生魄言之則受命在祀廟之前故祀廟之時諸侯巳奔走執事豈得未受周命巳助周祭明其受命在祀廟前矣史官探其時日先言告武成既訖然後却說受命故文在下耳諸侯與百官舊有未屬周者今皆受政命於周於此時始天下一統也顧氏以既生魄謂庚戌巳後雖十六日始生魄從十六日至晦皆為生魄但不知庚戌之後幾日耳傳謂后至先王正義曰此先王文在公劉之前知謂后稷也后稷非王尊其祖故稱先王周語云昔我先王后稷又曰我先王不窋韋昭云王之先祖故稱王商頌亦以契為玄王文武之功起於后稷后稷始封於邰故言建邦啓士傳后稷至之業正義曰周本紀云后稷卒子不窋立卒子鞠陶立卒子公劉立是公劉為后稷曽孫也本紀云公劉之後有公非公祖之類知公是爵殷時未諱故稱劉名先公多矣獨三人稱公當時之意耳本紀云公劉復修后稷之業百姓懷之多徙而歸保焉周道之興自此之後是能厚先人之業也傳大王至王家正義曰詩云后稷之孫實惟大王居岐之陽實始翦商是大王翦齊商人始王業之兆迹也周本紀云王季修古公之道諸侯順之是能纘統大王之業勤立王家之基本也大邦至其德正義曰大邦力足拒敵故言畏其力小邦必畏矣小邦或被棄遺故言懷其德大邦亦懷德矣量事為文也傳言諸至未就正義曰文王斷虞芮之訟諸侯歸之改稱元年至九年而卒故云大業未就也文王既未稱王而得輒改元年者諸侯自於其國各稱元年是已之所稱容或中年得改矣汲冢竹書魏惠王有後元年漢初文帝二元景帝三元此必有因於古也伏生司馬遷韓嬰之徒不見此書以為文王受命七年而崩故鄭玄等皆依用之傳致商至川河正義曰致商之罪謂伐紂之時欲將伐紂告天乃發故文在所過之上禮天子出征必類帝冝社此告皇天后土即泰誓上篇類于上帝冝于冢土故云后土社也昭二十九年左傳稱句龍為后土后土為社是也僖十五年左傳云戴皇天而履后土彼晉大夫要秦伯故以地神后土而言之與此異也自周適商路過河華故知所過名山華嶽大川河也山川大乃有名名大互言之耳周禮太祝云王過大山川則用事焉鄭云用事用祭事告行也曰惟有道曽孫周王發正義曰自稱有道者聖人至公為民除害以紂無道言已有道所以告神求助不得飾以謙辭也稱曽孫者曲禮說諸侯自稱之辭云臨祭祀內事曰孝子某侯某外事曰曽孫某侯某哀二年左傳蒯聵禱祖亦自稱曽孫皆是言已承藉上祖奠享之意暴殄至蒸民正義曰天物語闊人在其閒以人為貴故別言害民則天物之言除人外普謂天下百物鳥獸草木皆暴絶之傳逋亡至大姦正義曰逋亦逃也故以為亡罪人逃亡而紂為魁主魁首也言受用逃亡者與之為魁首為主人萃訓聚也言若蟲獸入窟故云窟聚水深謂之淵藏物謂之府史遊急就篇云司農少府國之淵淵府類故言淵府水鍾謂之澤無水則名藪藪澤大同故言藪澤萃淵藪三者各為物室言紂與亡人為主亡人歸之若蟲之窟聚魚歸淵府獸集藪澤言紂為大姦也據傳意主字下讀為便昭七年左傳引此文杜預云萃集也天下逋逃悉以紂為淵藪集而歸之與孔異也傳冕服至成命正義曰冕服采章對被髮左衽則為有光華也釋詁云夏大也故大國曰夏華夏謂中國也言蠻貃則戎夷可知王言華夏及四夷皆相率而充已使奉天成命欲其共伐紂也既戊午至我師正義曰自此以下皆史辭也其上闕絶失其本經故文無次第必是王言既終史乃更敘戰事於文次當承自周于征伐商之下此句次之故云既戊午也史官敘事得言罔有敵于我師稱我者猶如自漢至今文章之士雖民論國事莫不稱我皆云我大隨以心體國故稱我耳非要王言乃稱我也傳自河至畢陳正義曰出四百里驗地為然戊午明日猶誓於河朔癸亥巳陳於商郊凡經五日日行八十里所以疾者赴敵冝速也帝王丗紀云王軍至鮪水紂使膠鬲候周師見王問曰西伯將焉之王曰將攻薛也膠鬲曰然願西伯無我欺王曰不子欺也將之殷膠鬲曰何日至王曰以甲子日以是報矣膠鬲去而報命於紂而雨甚軍卒皆諫王曰卒病請休之王曰吾巳令膠鬲以甲子報其主矣吾雨而行所以救膠鬲之死也遂行甲子至于商郊然則本期甲子故速行也周語云王以二月癸亥夜陳未畢而雨是雨止畢陳也待天休命雨是天之美命也韋昭云雨者天地神人和同之應也天地氣和乃有雨降是雨為和同之應也傳旅衆至距戰正義曰旅衆釋詁文詩亦云其㑹如林言盛多也本紀云紂發兵七十萬人以距武王紂兵雖則衆多不得有七十萬人是史官美其能破強敵虛言之耳傳紂衆至之言正義曰罔有敵于我師言紂衆雖多皆無有敵我之心故自攻於後以北走自攻其後必殺人不多血流漂舂杵甚之言也孟子云信書不如無書吾於武成取二三䇿而巳仁者無敵於天下以至仁伐不仁如何其血流漂杵也是言不實也易繫辭云斷木為杵掘地為臼是杵為舂器也傳皆武至禮賢正義曰紂囚其人而放釋之紂殺其身而增封其墓紂退其人而式其門閭皆是武王反紂政也下句散其財粟亦是反紂於此須有所解因言之耳上篇云囚奴正士論語云箕子為之奴是紂囚之又為奴役之周禮司厲職云其奴男子入于罪隸鄭衆云為之奴者繫於罪隸之官是囚為奴以徒隸役之也商容賢人之姓名紂所貶退處於私室式者車上之橫木男子立乘有所敬則俯而憑式遂以式為敬名說文云閭族居里門也武王過其閭而式之言此內有賢人式之禮賢也帝王丗紀云商容及殷民觀周軍之入見畢公至殷民曰是吾新君也容曰非也視其為人嚴乎將有急色故君子臨事而懼見太公至民曰是吾新君也容曰非也視其為人虎據而鷹趾當敵將衆威怒自倍見利即前不顧其後故君子臨衆果於進退見周公至民曰是吾新君也容曰非也視其為人欣欣休休志在除賊是非天子則周之相國也故聖人臨衆知之見武王至民曰是吾新君也容曰然聖人為海內討惡見惡不怒見善不喜顔色相副是以知之是說商容之事也傳紂所至貧民正義曰藏財為府藏粟為倉故言紂所積之府倉也名曰鹿臺巨橋則其義未聞散者言其分布發者言其間出互相見也周夲紀云命召公釋箕子之囚命畢公釋百姓之囚表商容之閭命閎夭封比干之墓命南宫括散鹿臺之錢發巨穚之粟以賑貧弱也然則武王親式商容之閭又表之也新序云鹿臺其大三里其髙千尺則容物多矣此言鹿臺之財則非一物也史記作錢後丗追論以錢為主耳周禮有泉府之官周語稱景王鑄大錢是周時巳名泉為錢也傳施舍至服德正義曰左傳成十八年晉悼公初立施舍已責成二年楚將起師已責救之定五年歸粟於蔡以睭急矜無資也杜預以為施恩惠舍勞役也巳責止逋責也皆是恤民之事故傳引之以證大賚所謂周有大賚論語文孔安國解堯曰之篇有二帝三王之事周有大賚正指此事故言所謂也恱是歡喜服謂聽從感恩則恱見義則服故天下皆恱仁服德也帝王丗紀云王命封墓釋囚又歸施鹿臺之珠玉及傾宫之女於諸侯殷民咸喜曰王之於仁人也死者猶封其墓況生者乎王之於賢人也亡者猶表其閭況存者乎王之於財也聚者猶散之況其復藉之乎王之於色也見在者猶歸其父母況其復微之乎是恱服之事也傳列地至三品正義曰爵五等地三品武王於此既從殷法未知周公制禮亦然以否孟子曰北宫錡問於孟子曰周之班爵祿如何孟子曰其詳不可得聞矣嘗聞其略天子之制地方千里公侯方百里伯七十里子男五十里漢書地理志亦云周爵五等其土三等也公侯百里伯七十里子男五十里漢丗儒者多以為然包咸注論語云千乘之國百里之國也謂大國惟百里耳周禮大司徒云諸公之地封疆方五百里侯四百里伯三百里子二百里男一百里蓋是周室既衰諸侯相并自以國土寬大皆違禮文乃除去本經妄為說耳鄭玄之徒以為武王時大國百里周公制禮大國五百里王制之注具矣重民五教正義曰此重揔下五事民與五教食喪祭也五教所以教民故與民同句下句食與喪祭三者各為一事相類而別故以惟目之言此皆聖王所重也論語云所重民食喪祭以論語即是此事而彼無五教録論語者自略之耳垂拱而天下治正義曰說文云拱斂手也垂拱而天下治謂所任得人人皆稱職手無所營下垂其拱故美其垂拱而天下治也尚書正義卷第十計一萬四千六百一十三字
